  USA_sons_of_liberty_decisions_government:0 "Take Action Against the §YSons of Liberty§!"
  USA_sons_of_liberty_decisions_government_desc:0 "There is no doubt that the Sons of Liberty are a threat to the Kingdom. We must stop them, as they are continuously destabilizing our nation and we can not let them do so any day further!\n\nThe §8Sons of Liberty§! currently have [?libertarians_strength|H0..0] strength and [?libertarians_popularity|H0..0] popularity.\nTo crush them, they must have none of both."
  USA_sons_of_liberty_decisions_rebels:0 "Liberation From §0Tyranny§!"
  USA_sons_of_liberty_decisions_rebels_desc:0 "The government broke our trust when they allowed the King to consolidate absolute power. We must overthrow the government, and restore the days of small government!\n\nOr, as §Hsome§! have even §Rradically§! suggested, the abolition of government altogether...\n\nWe currently control [?num_of_states_fallen_to_libertarians|H0..0] states. Controlling §H15§! states as well as controlling the §Hcapital§! will allow us to completely overthrow the monarchy."
  USA_expand_rebellion_to_state:0 "Expand Rebellion to [FROM.getname]"
  USA_expand_rebellion_to_state_desc:0 "We must expand our influence by spreading our revolution to [FROM.getname]."
  USA_15_states_controlled:0 "We (the §8Rebellion§!) currently control §H15§! states."
  USA_capital_controlled:0 "We (the §8Rebellion§!) currently control the §Hcapital§!."
