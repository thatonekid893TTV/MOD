  USA_ttf:0 "Buy Out the Competition"
  USA_ttf_desc:0 "We may now be the largest soda company in the nation, but that is not enough. We must have an absolute control over all American soda brands, to establish our hegemony...\n\nWe have purchased [?number_of_domestic_soda_companies_purchased|H0..0] of the possible §H4§! domestic soda companies. Purchasing them all will give us a bonus as the hegemon of soda within America."
  USA_retake_fanta:0 "Retaking Fanta"
  USA_establish_fanta_administration:0 "Establish a Coca-Cola Administration in Germany"
