  USA_expanding_land_of_tomorrow:0 "Expanding the Land of Tomorrow"
  USA_expanding_land_of_tomorrow_desc:0 "Walt has grand plans for the future. He wants to build a theme park empire across what is not only [USA.getnameDEF], but also the rest of the world.\n\nCurrently, we have built [?theme_parks_built|Y0..0] theme parks, and every §H2§! theme parks we build, we will get our tourism national spirit improved."
  USA_pacific_theatre:0 "The Pacific Theatre"
  USA_pacific_theatre_desc:0 "Rising tensions between Japan and China may result in a painful bloody war. Let us prepare so Japan's warmongering won't spread."
  USA_a_plan_for_japan:0 "A Plan For Japan"
  USA_a_plan_for_japan_desc:0 "Japan's defeat is inevitable, but it will be painful... we must create plans for them once they cease resistance."
  USA_prog_convention:0 "The Progressive Convention of [GetYear]"
  USA_president_inagurated_prog:0 "President Inagurated"
  USA_president_inagurated_prog:0 "The time has come. A president has been nominated, and will soon be inagurated."
  USA_take_back_former_territories:0 "Reintegrate Our Former Lands"
  USA_take_back_former_territories_desc:0 "With our nation secure post civil war, we can now start to integrate our former lands."
  USA_integrate_puerto_rico:0 "Integrate Puerto Rico"
  USA_integrate_hawaii:0 "Integrate Hawaii"
  USA_integrate_alaska:0 "Integrate Alaska"
  USA_new_monarchies:0 "Empower Western Monarchies"
  USA_new_monarchies_desc:0 "Now that we have major influence over Western Europe, we should re-empower Western monarchies."
  USA_create_france_empire:0 "Establish the French Empire"
  USA_create_british_empire:0 "Establish the British Empire"
  USA_create_german_empire:0 "Establish the German Empire"
  USA_create_united_netherlands:0 "Establish a United Netherlands"
  USA_create_kingdom_of_italy:0 "Empower the King in Italy"
  USA_party_management:0 "Party Management"
  USA_party_management_desc:0 "We must manage the political parties in our country, so we can ensure a winner in our elections. Here are the current estimates on what percentage of votes each party will get in the next election.\n\nThe popularity of the £party_usa_democrats §2Democratic Party§! is currently [?USA_democratic_party_popularity_var|H0..1] out of §H100§!.\n\nThe popularity of the £party_usa_republicans §tRepublican Party§! is currently [?USA_republican_party_popularity_var|H0..1] out of §H100§!.\n\nThe popularity of the £generic_war_escalation_text_icon §gThird Parties§! are currently [?USA_third_party_popularity_var|H0..1] out of §H100§!.\n\nThe support of parties could bear §Grewards§! or §Rmisfortunes§! depending on who wins in the election. If the £party_usa_republicans §tRepublican Party§! or the £party_usa_democrats §2Democratic Party§! have below §H40%§! of the vote, it will be impossible for them to be elected.\n\nIf the support of the £generic_war_escalation_text_icon §gThird Parties§! reach §H35%§!, it could have §Rdire§! consequences!"
  USA_rally_republicans:0 "Hold a £party_usa_republicans §tRepublican Party§! rally"
  USA_rally_republicans_desc:0 "The £party_usa_republicans §tRepublican Party§! will hold a rally to support their party."
  USA_rally_democrats:0 "Hold a £party_usa_democrats §2Democratic Party§! rally"
  USA_rally_democrats_desc:0 "The £party_usa_democrats §2Democratic Party§! will hold a rally to support their party."
  USA_republican_campaign_trail:0 "Nation-wide £party_usa_republicans §tRepublican Party§! campaign"
  USA_republican_campaign_trail_desc:0 "£party_usa_republicans §tRepublican§! supporters, as well as some politicians, will tour the country to gather support."
  USA_democratic_campaign_trail:0 "Nation-wide £party_usa_democrats §2Democratic Party§! campaign"
  USA_democratic_campaign_trail_desc:0 "£party_usa_democrats §2Democrat§! supporters, as well as some politicians, will tour the country to gather support."
  USA_populist_propoganda:0 "Ramp up £generic_war_escalation_text_icon §gThird Party§! populist propoganda"
  USA_populist_propoganda_desc:0 ""The £party_usa_republicans §tRepublican Party§! and the £party_usa_democrats §2Democratic Party§!. Who needs them? That's right: absolutely no-one! We need a new way, with other parties...""
  USA_emergency_republican_campaign:0 "£party_usa_republicans §tRepublican Party§! Campaigns"
  USA_emergency_republican_campaign_desc:0 "Many £party_usa_republicans §tRepublican Party§! politicians are traveling around the country, campaigning for their support."
