l_english:
  USA_expand_statehood: "Expanding US Statehood"
  USA_expand_statehood_desc: "We have expanded much over time, and that calls for allowing new states into our grand nation."
  USA_statehood_for_alaska_desc: "Alaska has been controlled by us for the better part of a century, and they have grown significantly since. They deserve to join the Union."
  USA_statehood_for_hawaii_desc: "We annexed Hawaii almost half a century ago, and since then, they have provided themselves as an extremely useful naval base. They now will become our newest state."
  USA_statehood_for_puerto_rico_desc: "Puerto Rico, similar to Cuba, the Philippines, and Guam, were annexed by us after the Spanish-American war. Unlike Cuba, (and somewhat unlike the Philippines), they have stayed a part of us. The time is now to decide their fate, but it's obvious they shouldn't become independent. They should become the newest state."
  USA_statehood_for_nfl: "Grant Statehood to Newfoundland and Laborador"
  USA_statehood_for_nfl_desc: "Newfoundland and Laborador have been on the fringe of joining either the United States, or Canada. Now that we control them, we can make that choice for them."
  USA_statehood_for_maritimes: "Grant Statehood to Acadia"
  USA_statehood_for_maritimes_desc: "The Acadian region is very similar to New England, and since we now control them, it only makes sense that they are a state, too."
  USA_statehood_for_quebec: "Grant Statehood to Quebec"
  USA_statehood_for_quebec_desc: "Quebec, while culturally different to us, was still part of what was Canada, which is very similar to us. Therefore, it needs to be our next state."
  USA_statehood_for_ontario: "Grant Statehood to Ontario"
  USA_statehood_for_ontario_desc: "Ontario, and Canada as a whole, were our ambition in the War of 1812. We didn't get it then, but now that we have now, it will be our next state!"
  USA_statehood_for_central_canada: "Grant Statehood to Central Canada"
  USA_statehood_for_central_canada_desc: "Many of the Central Canadian states are practically American states. Well, they are now!"
  USA_statehood_for_western_canada: "Grant Statehood to Western Canada"
  USA_statehood_for_western_canada_desc: "We wanted all of the Oregon territory all those years ago. Now, it's finally ours, and it will be our next state."
  USA_statehood_for_sonora: "Grant Statehood to Sonora"
  USA_statehood_for_sonora_desc: "The Treaty of Guadalupe-Hidalgo was extremely favored towards Mexico, now we own one of their northern states, Sonora, and we can now integrate them."
  USA_statehood_for_chihuahua: "Grant Statehood to Chihuahua"
  USA_statehood_for_chihuahua_desc: "The Treaty of Guadalupe-Hidalgo was extremely favored towards Mexico, now we own one of their northern states, Chihuahua, and we can now integrate them."
  USA_statehood_for_yucatan: "Grant Statehood to Yucatan"
  USA_statehood_for_yucatan_desc: "The Treaty of Guadalupe-Hidalgo was extremely favored towards Mexico, now we own the Yucatan Peninsula, and we can now integrate them."
  USA_statehood_for_cuba: "Grant Statehood to Cuba"
  USA_statehood_for_cuba_desc: "Cuba, similar to Puerto Rico, the Philippines, and Guam, were annexed by us after the Spanish-American war. Similar to the Philippines, they gained independence after the war. But they are ours once again, and will be our newest state!"
  USA_statehood_for_hispanola: "Grant Statehood to Hispañola"
  USA_statehood_for_hispanola_desc: "Former President Ulysses S. Grant wanted to annex the Dominican Republic. It was so close, with their government accepting it, but it was killed in Congress. No longer will their (and Haiti's) statehood be prevented!"
  USA_expand_california: "Expand California"
  USA_expand_california_desc: "We may currently control two Californias, but we must merge them and integrate the Baja into the American state!"
  USA_golden_circle:0 "Forming the Golden Circle"
  USA_golden_circle_desc:0 "Although garnering support for it may be difficult, we must realize the Golden Circle.\n\nSupport for the Golden Circle is currently at [?USA_golden_circle_support_var|Y0..0]."
  golden_circle_support_up:0 "Support for the Golden Circle will be increased by §H5§!."
