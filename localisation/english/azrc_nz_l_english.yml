 AZR_NZL_holland_takes_over_d:0 "Pressure Hamilton to Resign"
 AZR_NZL_holland_takes_over_d_desc:0 "Adam Hamilton is a weak leader, the National Party and New Zealand need a strong leader for us to weather these turbulent times."
