 #events
 mmr_nzl.1.t:0 "[NZL.GetNameDefCap] Invites us to The Pacific Communist Alternative"
 mmr_nzl.1.desc:0 "Our revolutionary government has received an offer of invitation from [NZL.GetNameDef] to join their newly formed military alliance, The Pacific Communist Alternative. Seeking to reject the Stalinist line that accepts normalization of relations with reactionary regimes, [NZL.GetNameDef] promises to defend and spread the revolution across the Pacific."
 mmr_nzl.1.a:0 "We will liberate the Pacific and then the world from capitalism and imperialism!"
 mmr_nzl.1.b:0 "We are not yet ready to take on the imperialist regimes of the Pacific."
 mmr_nzl.101.t:0 "[FROM.GetNameDefCap] Agrees to Join The Pacific Communist Alternative"
 mmr_nzl.101.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that [FROM.GetLeader] is ready and willing to aid [NZL.GetNameDef] in our fight to defend the revolution and liberate the Pacific from capitalism and imperialism."
 mmr_nzl.101.a:0 "We are brothers in arms!"
 mmr_nzl.102.t:0 "[FROM.GetNameDefCap] Rejects our Invitation to The Pacific Communist Alternative"
 mmr_nzl.102.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that while they are unfortunately unable to join our alliance, they send warm regards."
 mmr_nzl.102.a:0 "Hopefully they will not stand in our way."
 mmr_nzl.2.t:0 "Reports of Communist Agitation in [INS.GetNameDef]"
 mmr_nzl.2.desc:0 "We have received reports that the communist rebel factions have grown significantly in their agitation against colonial troops and infiltrated local administration across [INS.GetNameDef], particularly in the south east of the country. While we don't know how or why these communists have been so bold and effective against the colonial administration, a significant portion of captured guns from the rebels have shown markings in English. The rise of communism across the Pacific and Asia puts our colony in danger, and should be responded against."
 mmr_nzl.2.a:0 "Send resources to focus on cracking down on the communist rebel cells."
 mmr_nzl.2.b:0 "We do not have the resources to send right now."
 mmr_nzl.2001.t:0 "Reports of Communist Agitation in [event_target:MMR_NZL_anti_colonial_agitation_dec_d_11_country.GetNameDef]"
 mmr_nzl.2001.desc:0 "We have received reports that the communist rebel factions have grown significantly in their agitation against colonial troops and infiltrated local administration across [event_target:MMR_NZL_anti_colonial_agitation_dec_d_11_country.GetNameDef]. While we don't know how or why these communists have been so bold and effective against the colonial administration, a significant portion of captured guns from the rebels have shown markings in English. The rise of communism across the Pacific and Asia puts our colony in danger, and should be responded against."
 mmr_nzl.2001.a:0 "Send resources to focus on cracking down on the communist rebel cells."
 mmr_nzl.2001.b:0 "We do not have the resources to send right now."
 mmr_nzl.2002.t:0 "[FROM.GetNameDefCap] has Cracked Down on the [?global.azr_is_general_puppet_agitated_var.GetAdjective] Communist Cells"
 mmr_nzl.2002.desc:0 "We have received reports from our [event_target:MMR_NZL_anti_colonial_agitation_dec_d_11_country.GetAdjective] Commmunist allies that [FROM.GetNameDef] has sent military resources to the colonial regime in [event_target:MMR_NZL_anti_colonial_agitation_dec_d_11_country.GetNameDef], which has begun a counter-offensive against their forces."
 mmr_nzl.103.t:0 "[FROM.GetNameDefCap] has Cracked Down on the Indonesian Communist Cells"
 mmr_nzl.103.desc:0 "We have received reports from our Indonesian Commmunist allies that [FROM.GetNameDef] has sent military resources to the colonial regime in [event_target:MMR_NZL_anti_colonial_agitation_dec_d_11_country.GetNameDef], which has begun a counter-offensive against their forces."
 mmr_nzl.103.a:0 "Their oppression betrays their fear, and forments their inevitable downfall."
 mmr_nzl.3.t:0 "Reports of Communist Agitation in [MAL.GetNameDef]"
 mmr_nzl.3.desc:0 "We have received reports that the communist rebel factions have grown significantly in their agitation against colonial troops and infiltrated local administration across [MAL.GetNameDef], particularly in the south east of the country. While we don't know how or why these communists have been so bold and effective against the colonial administration, a significant portion of captured guns from the rebels have shown markings in English. The rise of communism across the Pacific and Asia puts our colony in danger, and should be responded against."
 mmr_nzl.104.t:0 "[FROM.GetNameDefCap] has Cracked Down on the Malayan Communist Cells"
 mmr_nzl.104.desc:0 "We have received reports from our Malayan Commmunist allies that [FROM.GetNameDef] has sent military resources to the colonial regime in [MAL.GetNameDef], which has begun a counter-offensive against their forces."
 mmr_nzl.4.t:0 "Reports of Communist Agitation across [SAW.GetNameDef]"
 mmr_nzl.4.desc:0 ""We have received reports that previously marginal communist rebel factions have grown significantly in their agitation against troops and infiltrated local administration across [SAW.GetNameDef]. While we don't know how or why these communists have been so bold and effective against the [SAW.GetAdjective] administration, a significant portion of captured guns from the rebels have shown markings in English. The rise of communism across the Pacific and Asia puts [SAW.GetName] in danger, and should be responded against."
 mmr_nzl.105.t:0 "[FROM.GetNameDefCap] has Cracked Down on the Sarawakan Communist Cells"
 mmr_nzl.105.desc:0 "We have received reports from our Sarawakan Commmunist allies that [FROM.GetNameDef] has sent military resources to government troops across [SAW.GetNameDef], who have begun a counter-offensive against their forces."
 mmr_nzl.5.t:0 "Reports of Insurgent Anti-Colonial Agitation across our Pacific Holdings"
 mmr_nzl.5.desc:0 "We have received reports that previously marginal anti-colonial insurgent factions have grown significantly in their agitation against our colonial troops across the Pacific. While we don't know how or why these insurgents have become so bold and effective against our occupation, a significant portion of captured guns from the rebels have shown markings in English. The rise of anti-colonial rhetoric and action across the Pacific and Asia puts our colonial holdings in danger, and some are suggesting we institute Martial Law in the rebelling colonies."
 mmr_nzl.5.a:0 "Institute Martial Law in the rebelling colonies."
 mmr_nzl.5.b:0 "The natives will tire themselves out, our colonial troops have nothing to worry about."
 mmr_nzl.6.t:0 "Reports of Communist Agitation across [PHI.GetNameDef]"
 mmr_nzl.6.desc:0 ""We have received reports that the communist rebel factions have grown significantly in their agitation against colonial troops and infiltrated local administration across [PHI.GetNameDef], particularly in the south of the country. While we don't know how or why these communists have been so bold and effective against [SAW.GetLeader]'s administration, a significant portion of captured guns from the rebels have shown markings in English. The rise of communism across the Pacific and Asia puts [PHI.GetNameDef] in danger, and should be responded against."
 mmr_nzl.107.t:0 "[FROM.GetNameDefCap] has Cracked Down on the Filipino Communist Cells"
 mmr_nzl.107.desc:0 "We have received reports from our Filipino Commmunist allies that [FROM.GetNameDef] has sent military resources to the colonial regime in [PHI.GetNameDef], which has begun a counter-offensive against their forces."
 mmr_nzl.7.t:0 "[NZL.GetNameDefCap] has requested to join our alliance."
 mmr_nzl.7.desc:0 "Diplomats from [NZL.GetNameDef] have sent us a request to join our faction, stating that we are brothers in arms against imperialism and capitalism across eastern and southern Asia."
 mmr_nzl.7.a:0 "We welcome them as brothers in arms."
 mmr_nzl.7.b:0 "We have no need for [NZL.GetNameDef] as an ally."
 mmr_nzl.108.t:0 "[FROM.GetNameDefCap] has Accepted our Request to Join their Alliance"
 mmr_nzl.108.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that [FROM.GetLeader] is ready and willing to work with [NZL.GetNameDef] in our shared fight to defend the revolution and liberate the Pacific from capitalism and imperialism."
 mmr_nzl.108.a:0 "We are brothers in arms!"
 mmr_nzl.109.t:0 "[FROM.GetNameDefCap] Rejects our Request to Join their Alliance"
 mmr_nzl.109.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that while they are unfortunately unable to grant us entry into their alliance, they send warm regards."
 mmr_nzl.109.a:0 "We will have to lead the anti-colonial fight ourselves."
 mmr_nzl.20.t:0 "[NZL.GetNameDefCap] Requests Pacific Decolonization"
 mmr_nzl.20.desc:0 "Diplomats from [NZL.GetNameDef] have sent a bold request to decolonize our Pacific holdings. They argue that the native inhabitants are ready for independence, and that by decolonizing now, we will not have to deal with any problems that may arise from colonial unrest."
 mmr_nzl.20.a:0 "This is Absurd!"
 mmr_nzl.20.b:0 "Perhaps a compromise can be made."
 mmr_nzl.20.c:0 "It is time for the era of [ROOT.GetAdjective] colonial rule in the Pacific to come to an end."
 mmr_nzl.121.t:0 "[FROM.GetNameDefCap] has Rejected Pacific Decolonization"
 mmr_nzl.121.desc:0 "We have received word from the [FROM.GetAdjective] government that they are entirely uninterested in Pacfic Decolonization and see our request as absurd!"
 mmr_nzl.121.a:0 "A frustrating shame."
 mmr_nzl.121.b:0 "We will have to pressure them more 'directly'."
 mmr_nzl.122.t:0 "[FROM.GetNameDefCap] has Responded with a Counter Proposal"
 mmr_nzl.122.desc:0 "The [FROM.GetAdjective] government has agreed to Pacific decolonization, on the condition that their former colonies remain in the [FROM.GetAdjective] sphere of influence. Effectively, they would be free from home rule, but unable to have independent foreign policy, with [FROM.GetName] as their effective suzerain."
 mmr_nzl.122.a:0 "We can agree to these terms."
 mmr_nzl.122.b:0 "This is unacceptable neo-colonialism."
 mmr_nzl.123.t:0 "[FROM.GetNameDefCap] has Agreed to our Proposal"
 mmr_nzl.123.desc:0 "The [FROM.GetAdjective] government has agreed to Pacific decolonization, and will begin withdrawing colonial troops and administators immediately."
 mmr_nzl.123.a:0 "A victory for diplomacy!"
 mmr_nzl.124.t:0 "[NZL.GetNameDef] has Accepted our Counter Proposal"
 mmr_nzl.124.desc:0 "[NZL.GetNameDefCap] has accepted our counter proposal, and agreed that managed decolonization will be best for both our and the natives interests."
 mmr_nzl.124.a:0 "A new age for the Pacific."
 mmr_nzl.125.t:0 "[NZL.GetNameDef] Pushes Back Against our Counter Proposal"
 mmr_nzl.125.desc:0 "The government of [NZL.GetName] has pushed back against our counter proposal, calling our legitimate concerns 'neo-colonialism'. We must now decide how to procede."
 mmr_nzl.31.t:0 "[NZL.GetNameDefCap] Invites us to The Pacific Alliance"
 mmr_nzl.31.desc:0 "We have received an offer of invitation from [NZL.GetNameDef] to join their newly formed military alliance, The Pacific Alliance. Seeking to defend liberty and democracy across the Pacific, [NZL.GetNameDef] believes it is essential that the free democracies of the Pacific unite."
 mmr_nzl.31.a:0 "We must defend liberty across the Pacific!"
 mmr_nzl.31.b:0 "We are not interested in getting dragged into any conflicts alongside [NZL.GetNameDef]."
 mmr_nzl.131.t:0 "[FROM.GetNameDefCap] agrees to join The Pacific Alliance"
 mmr_nzl.131.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that the free people of [FROM.GetNameDef] are ready and willing to defend freedom and democracy across the Pacific."
 mmr_nzl.131.a:0 "A great day for freedom and democracy in the Pacific."
 mmr_nzl.132.t:0 "[FROM.GetNameDefCap] rejects our invitation to The Pacific Alliance"
 mmr_nzl.132.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that while they are unfortunately unable to join our alliance, they send warm regards."
 mmr_nzl.132.a:0 "We will carry forth without them."
 mmr_nzl.32.t:0 "[NZL.GetNameDefCap] has requested to join our alliance."
 mmr_nzl.32.desc:0 "Diplomats from [NZL.GetNameDef] have sent us a request to join our faction, stating that we are brother republics both having come from the yoke of the British Empire, and that they would like to form closer ties to our great republic, possibly in the form of economic and scientific collaboration."
 mmr_nzl.32.a:0 "We are brother republics!"
 mmr_nzl.32.b:0 "We have no need for [NZL.GetNameDef] as an ally."
 mmr_nzl.133.t:0 "[FROM.GetNameDefCap] has Accepted our Request to Join their Alliance."
 mmr_nzl.133.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that the free people of [FROM.GetNameDef] are ready and willing to defend freedom and democracy across the Pacific."
 mmr_nzl.133.a:0 "Our brother republics stand together!"
 mmr_nzl.134.t:0 "[FROM.GetNameDefCap] has Rejected our Request to Join their Alliance."
 mmr_nzl.134.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that while they are unfortunately unable to grant us entry into their alliance, they send warm regards."
 mmr_nzl.134.a:0 "We will have to reevaluate our foreign policy."
 
 mmr_nzl.200.t:0 "[GetYear] New Zealand General Election"
 mmr_nzl.200.desc:0 "The people of New Zealand go to the polls today to decide who will lead their nation for the next 3 years. Will the Labour Party continue to lead the country out of the Great Depression, or can the newly formed National Party eke out a legislative victory?"
 mmr_nzl.200.a:0 "Labour Victory"
 mmr_nzl.200.b:0 "National Victory"
 mmr_nzl.201.t:0 "1941 Census Postponed"
 mmr_nzl.201.desc:0 "With the ongoing war occupying the states full attention, the [NZL.GetRulingPartyLong] under [NZL.GetLeader] has postponed the upcoming census, which also postpones the upcoming election until after the census is complete. While this move is somewhat controversial, the public will hopefully understand, given that the 1931 census was also postponed, then due to the Great Depression."
 mmr_nzl.201.a:0 "A Necessary Action"
 mmr_nzl.202.t:0 "[GetYear] New Zealand General Election"
 mmr_nzl.202.desc:0 "The people of New Zealand go to the polls today to decide who will lead their nation for the next 3 years. The Labour Party and the National Party hold competing visions for the country, with Labour emphasizing the union worker, and National emphasizing the rising entreprenuer in their respective appeal to the voters."
 mmr_nzl.202.a:0 "Labour Victory"
 mmr_nzl.202.b:0 "National Victory"
 mmr_nzl.203.t:0 "[GetYear] New Zealand General Election"
 mmr_nzl.203.desc:0 "The people of New Zealand go to the polls today to decide who will lead their nation for the next 3 years. The Labour Party and the National Party hold competing visions for the country, with Labour emphasizing the union worker, and National emphasizing the rising entreprenuer in their respective appeal to the voters."
 mmr_nzl.203.a:0 "Labour Victory"
 mmr_nzl.203.b:0 "National Victory"
 mmr_nzl.204.t:0 "[GetYear] New Zealand General Election"
 mmr_nzl.204.desc:0 "The people of New Zealand go to the polls today to decide who will lead their nation into the next decade. The Labour Party and the National Party hold competing visions for the country, with Labour emphasizing the union worker, and National emphasizing the rising entreprenuer in their respective appeal to the voters."
 mmr_nzl.204.a:0 "Labour Victory"
 mmr_nzl.204.b:0 "National Victory"
 mmr_nzl.205.t:0 "Formation of the National Party"
 mmr_nzl.205.desc:0 "With the electoral blowout of the 1935 Labour victory, the United-Reform coalition has effectively collapsed, leaving the political right in New Zealand rudderless. The infighting between United's George Forbes and Reform's Gordon Coates has exasperated the situation. Forbes currently will take control until a proper vote can be organized on the first leader of this new party. Controversial conservative rising star Adam Hamilton has been chosen to lead a new party born from the ashes of United and Reform, unified in opposition to Labour's socialistic policies. It remains to be seen whether Hamilton can topple the popular Michael Joseph Savage."
 mmr_nzl.205.a:0 "The conservatives lick their wounds."
 mmr_nzl.2051.t:0 "Chaos in the National Party"
 mmr_nzl.2051.desc:0 "Disputes over the leadership of the newly formed National Party between current National leader George Forbes and former Refom leader J.G. Coates has boiled over. Coates, with the aid of a number of loyalist within National from the former Reform party, has launched a soft coup against Forbes, breaking the party constitution in the process. It remains to be seen if Forbes can survive this challenge. What is clear is that National needs a real leader."
 mmr_nzl.2051.a:0 "Forbes is able to hold on to power."
 mmr_nzl.2051.b:0 "Coates' plan succeeds."
 mmr_nzl.2052.t:0 "National Party Leadership Vote"
 mmr_nzl.2052.desc:0 "All 25 National Party MPs will vote today on who will become the first National Party leader and lead National into the next election. There are two candidates up for election. First is Charles Wilkinson, a nationalist who left Reform in the 20s to be an independent, and the chosen candidate of former United leader George Forbes. Then there is Adam Hamilton, the ally of J.G. Coates, who tried to unconstitutionally install him as party leader only a few months ago. However, Coates has an ace up his sleeve, just before the vote he has threatened to leave National with his allies if Hamilton does not get chosen. Hamilton is a deeply unpopular politician who has colloquially been blamed for the Drepression due to his economic mismanagement, but Coate's leaving and restarting Reform would split the conservative vote."
 mmr_nzl.2052.a:0 "Hamilton narrowly wins."
 mmr_nzl.2052.b:0 "Wilkinson narrowly wins."
 mmr_nzl.2053.t:0 "Adam Hamilton narrowly wins National Leadership"
 mmr_nzl.2053.desc:0 "Adam Hamilton, J.G. Coates' pick for National leader, has narrowly beat Charles Wilkinson by 1 vote, securing him a fragile mandate as the first official leader of the National Party. An unpopular politician among the public and and within his party, he will have to work as a compromise candidate in order to keep National together."
 mmr_nzl.2053.a:0 "Hamilton is no threat to Labour."
 mmr_nzl.2054.t:0 "Charles Wilkinson narrowly wins National Leadership"
 mmr_nzl.2054.desc:0 "Charles Wilkinson, George Forbes' pick for National leader, has narrowly beat Adam Hamilton by 1 vote, securing him a fragile mandate as the first official leader of the National Party. Having been an independent MP for almost a decade, he brings a fresh face to the party that does not have the baggage of the Depression, something George Forbes wanted for National. However, Coates has made true with his promise to leave the Nationals. While not all former Reform politicians have joined him, this split has severely weakened National going into the next election."
 mmr_nzl.2054.a:0 "May this rightist infighting never end."
 mmr_nzl.2055.t:0 "George Forbes Retires"
 mmr_nzl.2055.desc:0 "George Forbes, the veteran conservative MP and former PM known to parliament and the public as 'Honest George' for his integrity and rational demeanor, has decided to retire after years of public service. He has received respect and praise from the left and right upon his decision as he leaves the National Party that he helped found."
 mmr_nzl.2055.a:0 "May he enjoy a well deserved retirement."
 mmr_nzl.206.t:0 "[mmr_nzl_206_t_sl]"
 mmr_nzl_206_t_lab_fraser:0 "Fraser Suggests Wartime Coalition"
 mmr_nzl_206_t_lab_mjs:0 "Savage Suggests Wartime Coalition"
 mmr_nzl_206_t_nat:0 "Hamilton Suggests Wartime Coalition"
 mmr_nzl.206.desc:0 "Adam Hamilton, leader of the National opposition, has brought forth the suggestion of a wartime coalition government comprising of National and Labour ministers. While this would show a united front against our enemies abroud and strengthen the war effort, it would weaken our ability to legislate and govern as mandated by our electoral victory and our base of support."
 #mmr_nzl_206_desc_lab_fraser:0 "Peter Fraser, leader of the Labour opposition, has brought forth the suggestion of a wartime coalition government comprising of Labour and National ministers. While this would show a united front against our enemies abroud and strengthen the war effort, it would weaken our ability to legislate and govern as mandated by our electoral victory and our base of support."
 #mmr_nzl_206_desc_lab_mjs:0 "Michael Joseph Savage, leader of the Labour opposition, has brought forth the suggestion of a wartime coalition government comprising of Labour and National ministers. While this would show a united front against our enemies abroud and strengthen the war effort, it would weaken our ability to legislate and govern as mandated by our electoral victory and our base of support."
 #mmr_nzl_206_desc_nat:0 "Adam Hamilton, leader of the National opposition, has brought forth the suggestion of a wartime coalition government comprising of National and Labour ministers. While this would show a united front against our enemies abroud and strengthen the war effort, it would weaken our ability to legislate and govern as mandated by our electoral victory and our base of support."
 mmr_nzl.206.a:0 "Form a \"Wartime Cabinet\" with a 4-2 Labour majority"
 #mmr_nzl_206_a_lab_fraser:0 "Form a \"Wartime Cabinet\" with a 4-2 National majority"
 #mmr_nzl_206_a_lab_mjs:0 "Form a \"Wartime Cabinet\" with a 4-2 National majority"
 #mmr_nzl_206_a_nat:0 "Form a \"Wartime Cabinet\" with a 4-2 Labour majority"
 mmr_nzl.206.b:0 "We should stand united!"
 mmr_nzl.206.c:0 "They can dictate wartime policy when they win an election"
 mmr_nzl.2061.t:0 "Wartime Cabinet Established"
 mmr_nzl.2061.desc:0 "Labour and National have agreed to a temporary \"Wartime Cabinet\" in which Labour will remain in a dominant position in the government, but National will gain increased powers to influence wartime policy. It remains to be seen how well this coalition will hold up, but Hamilton is already facing fierce opposition from within his party to this unequal agreement."
 mmr_nzl.2061.a:0 "Hamilton has taken the bait"
 mmr_nzl.2062.t:0 "Wartime Coalition Government Formed"
 mmr_nzl.2062.desc:0 "Labour and National have agreed to a temporary wartime coalition unity government. While it is a political win for the National Party, it has unified the people of New Zealand around the war effort."
 mmr_nzl.2062.a:0 "New Zealand stands united!"
 mmr_nzl.207.t:0 "Hamilton Ousted as Opposition Leader"
 mmr_nzl.207.desc:0 "Adam Hamilton, who has lead the newly formed National Party to defeat and submission to Labour in his \"Wartime Cabinet\", has been ousted by charismatic political upstart Sidney Holland. With new leadership National is seeking to envigorate its party and win back the common worker."
 mmr_nzl.207.a:0 "Holland has an uphill battle"
 mmr_nzl.2071.t:0 "Hamilton Resigns"
 mmr_nzl.2071.desc:0 "Adam Hamilton, who has led the newly formed National Party to victory in the last election, has resigned effective immediately. It seems the charismatic political upstart Sidney Holland has outmanuevered the unpopular Hamilton. With new leadership National is seeking to envigorate its party and win back the common worker."
 mmr_nzl.2071.a:0 "Holland will stabilize the country."
 mmr_nzl.208.t:0 "Michael Joseph Savage Dead"
 mmr_nzl.208.desc:0 "Michael Joseph Savage, the fatherly leader of the Labour Party, who led them to their first electoral victory, has passed away. He has been replaced by Labour Party workhorse and Minister of Health, Peter Fraser."
 mmr_nzl.208.a:0 "May he rest in peace"
 mmr_nzl.208.b:0 "Good Riddance"
 mmr_nzl.209.t:0 "[NZL.GetName] Invites Us to the Pacific Communist Alternative"
 mmr_nzl.209.desc:0 "Our comrades to the east have sent a formal invitation for us to join them in a military alliance to protect our mutual revolutions, and spread the workers revolutions across the colonized East Asia and Pacific Islands."
 mmr_nzl.209.a:0 "We are comrade in revolution and brothers in arms!"
 mmr_nzl.209.b:0 "We are not their puppets to be led to endless war"
 mmr_nzl.2091.t:0 "[AST.GetName] accepts our invitation to the Pacific Communist Alternative"
 mmr_nzl.2091.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that the liberated workers of [FROM.GetNameDef] are ready and willing to defend and spread the revolution across the Pacific."
 mmr_nzl.2091.a:0 "We will liberate the workers of the Pacific together!"
 mmr_nzl.2092.t:0 "[FROM.GetNameDefCap] rejects our invitation to the Pacific Communist Alternative"
 mmr_nzl.2092.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that while they are unfortunately unable to join our alliance, they send warm regards."
 mmr_nzl.2092.a:0 "We will carry forth without them."
 mmr_nzl.210.t:0 "[NZL.GetName] interferes in our politics"
 mmr_nzl.210.desc:0 "The radical Communists in New Zealand have launched a major subversive propaganda and influence campaign, radicalizing disillusioned Australian workers and destabilizing our economic and political stability."
 mmr_nzl.210.a:0 "This is a dangerous escalation!"
 mmr_nzl.211.t:0 "[NZL.GetName] Sends Soldiers to Fight for Us"
 mmr_nzl.211.desc:0 "The government of [NZL.GetName], recognizing that their manpower is not best served remaining in the far flung corner of the globe, has donated some of their manpower to support our war support."
 mmr_nzl.211.a:0 "The Commonwealth gives back!"
 mmr_nzl.212.t:0 "[NZL.GetName] Sends More Soldiers to Fight for Us"
 mmr_nzl.212.desc:0 "The government of [NZL.GetName], recognizing that their manpower is not best served remaining in the far flung corner of the globe, has donated more of their manpower to support our war support."
 mmr_nzl.212.a:0 "The [ROOT.GetFactionName], united for victory!"
 mmr_nzl.213.t:0 "[NZL.GetName] Requests Leadership of South East Asian Communist Movement"
 mmr_nzl.213.desc:0 "Our comrades in [NZL.GetCommunistParty], recognizing that they are now the de-jure leading Communist party in the South East Asian and Pacific regions, wishes to be recognized at the de-facto leader of the Communist cause in their regions of influence, taking that role from current de-facto leaders in the [AST.GetCommunistParty]."
 mmr_nzl.213.a:0 "The [NZL.GetCommunistParty] have proven their effectiveness and loyalty."
 mmr_nzl.213.b:0 "We have no need to alter Comintern operations in Southern Asia."
 mmr_nzl.2131.t:0 "The Soviets Recognize Our Party's Leadership Role in the Region"
 mmr_nzl.2131.desc:0 "Soviet diplomats have recognized our contribution to the Comintern and Communist cause in Southern Asia and the Pacific, making the [AST.GetCommunistParty] now subordinate to us."
 mmr_nzl.2131.a:0 "A glorious day for the [NZL.GetCommunistParty]!"
 mmr_nzl.2132.t:0 "The Soviets Refuse to Recognize Our Party's Leadership Role in the Region"
 mmr_nzl.2132.desc:0 "Soviet diplomats have refused to recognize our contribution to the Comintern and Communist cause in Southern Asia and the Pacific, considering the [AST.GetCommunistParty] still to be the more important party despite its lack of political relevance."
 mmr_nzl.2132.a:0 "How dare they!"
 mmr_nzl.214.t:0 "[NZL.GetCommunistParty] Leadership Contested"
 mmr_nzl.214.desc:0 "Jack Locke, a devoted Stalinist, has contested [NZL.GetLeader]'s leadership of the [NZL.GetRulingPartyLong]. The two comrades were close and passionate comrades up until the revolution, but their relationship has devolved into a torrid affair that threatens to undermine the very foundations of the revolution! Locke has appealed to the many Stalinists within the party, while [NZL.GetLeader] maintains popular support among the people for her anti-war and agriarianist views. Given the sharp escalation and passion of these two budding communist leaders, it is likely only one of these two comrades will make it out of this power struggle. Perhaps in another world these two could have been star crossed lovers."
 mmr_nzl.214.a:0 "[NZL.GetLeader] suppresses the Stalinist elements in the party."
 mmr_nzl.214.b:0 "Locke pulls off an internal coup!"
 mmr_nzl.215.t:0 "Scandal! [NZL.NZL_elsie_farrelly.GetName] Divorced!"
 mmr_nzl.215.desc:0 "[NZL.NZL_elsie_farrelly.GetName], rising star of the communist movement taking over the hearts and minds of the working class, has had a scandalous and shameful divorce with her husband Frederick Engels Freeman, better known as Fred Freeman, while pregnant with their first child. This will certainly damaging the reputation of the [NZL.GetCommunistParty] and [NZL.NZL_elsie_farrelly.GetName] herself."
 mmr_nzl.215.a:0 "A shameful disgrace."
 mmr_nzl.216.t:0 "[NZL.GetName] Demands International Cooperation"
 mmr_nzl.216.desc:0 "[NZL.GetNameDefCap] has sent out a request to all the independent nations of the world with a demand to sign a petition supporting international cooperation and negotiation and disavowing war as a tool to solve their nation's issues.We have an opportunity to show that we don't intend to start war over our international disagreements, but in doing so we will significantly blunt the support for war among our populace."
 mmr_nzl.216.a:0 "We will agree to this."
 mmr_nzl.216.b:0 "This is an infringement on our sovereignty!"
 mmr_nzl.2161.t:0 "Results of Petition for International Cooperation"
 mmr_nzl.2161.desc:0 "The nations of the world have responded to our call for international cooperation."
 mmr_nzl.2161.a:0 "A great success!"
 mmr_nzl.2161.b:0 "A worthwhile effort."
 mmr_nzl.2161.c:0 "A difficult day for all peace loving people."
 mmr_nzl.217.t:0 "A Dark Proposal"
 mmr_nzl.217.desc:0 "As New Zealand slides further into political anarchy and extremism, the New Zealand Legion has regained prominence among the working class as they participate in streetfights with unions and Communists and promote traditional New Zealander values. [NZL.GetNeutralityLeader] can reach out to them and support their actions and their leaders financially and legally, but if they are given an inch, they might take a mile."
 mmr_nzl.217.a:0 "The Legion will protect New Zealand from Communists and Socialists."
 mmr_nzl.217.b:0 "The Legion is a poisoned chalice!"
 mmr_nzl.218.t:0 "George Julius Dead"
 mmr_nzl.218.desc:0 "Esteemed scientist, inventor, and entreprenuer George Julius has died unexpectedly today at the age of 73. A visionary born in England but made [NZL.GetNameDef] his home, he will be dearly missed."
 mmr_nzl.218.a:0 "A national tragedy."
 
