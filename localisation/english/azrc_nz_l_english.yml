 #focuses
 NZL_convoy_focus:0 "Convoy Focus"
 NZL_convoy_focus_desc:0 "With our reliance on convoys to connect our island nation, we should invest into their mass production."
 NZL_a_polynesian_navy:0 "A Polynesian Navy"
 NZL_a_polynesian_navy_desc:0 "Our island nation needs a strong navy to defend itself, which can only come about with a massive investment into the naval production and research"
 NZL_naval_base_construction:0 "Naval Base Effort"
 NZL_naval_base_construction_desc:0 "We must develop our naval bases to supply our military and that of our allies."
 NZL_island_air_bases:0 "Island Air Bases"
 NZL_island_air_bases_desc:0 "Islands are unsinkable aircraft carriers. We should take advantage of this for the battle for the Pacific."
 NZL_light_up_the_skies:0 "Air Innovations"
 NZL_light_up_the_skies_desc:0 "Controlling the skies is essential to our national defense. Instead of spending exhorbitant resources into a fledging navy or trying to rival militaries with much more experience and manpower, we should primarily invest into research and developement of aircraft and air warfare."
 NZL_anti_air:0 "Anti-Air Focus"
 NZL_anti_air_desc:0 "Defending our cities, factories, military, and supply lines from bombers will require a major investment into Anti-Aircraft weaponry."
 NZL_air_range:0 "Air Range Focus"
 NZL_air_range_desc:0 "The Pacific is the largest ocean in the world, and the islands that dot it vast waters are spread few and far between. We must invest into extending the range of our aircraft if we are to fully utilize our airborne investments."
 NZL_synthetic_rubber_investment:0 "Synthetic Rubber Investments"
 NZL_synthetic_rubber_investment_desc:0 "Aircraft require rubber, and the lands of our nation have been cursed with a dearth of this vital resource. We must invest therefore invest into the research and production of synthetic rubber in order to meet the demands of our Airforce."
 NZL_radar_focus:0 "Radar Focus"
 NZL_radar_focus_desc:0 "Our nation has been blessed with innovators and inventors that have spearheaded the development of civlian radar technology. We should take advantage of this gift in the research and developement of military radar technology."
 NZL_superior_firepower:0 "Firepower Focus"
 NZL_superior_firepower_desc:0 "One of the Achilles Heel's of [NZL.GetName] is its miniscule population when compared with the rest of the world. We can make up for this with orienting our military strategy to overwhelm any enemy with our firepower."
 NZL_grand_battleplan:0 "[NZL_grand_battleplan_sl]"
 NZL_grand_battleplan_sl_loc_pca:0 "Organize The Masses"
 NZL_grand_battleplan_desc:0 "[NZL_grand_battleplan_desc_sl]"
 NZL_grand_battleplan_desc_sl_loc_pca:0 "In order to liberate the oppressed masses of the of Pacific, we must organize our military strategy to replicate the anti-colonial warriors fighting guerilla warfare against their colonial oppressors."
 NZL_grand_battleplan_sl_loc_base:0 "Planning Focus"
 NZL_grand_battleplan_desc_sl_loc_base:0 "The Pacific is a continent unto itself. We must invest into planning properly if we are to achieve victory in the Pacific theatre."
 NZL_staff_college:0 "Staff College"
 NZL_staff_college_desc:0 "It is time for our military to invest in the construction and developement of a proper staff college to prepare the next generation of leaders in the Army of [NZL.GetNameDef]."
 NZL_logistics_focus:0 "Logistics Focus"
 NZL_logistics_focus_desc:0 "In the wide variety of terrain and supply situations we may find ourselves in, a proper understanding of and investment into logistics will be essential for our victory."
 NZL_maintain_manpower:0 "Field Hospital Focus"
 NZL_maintain_manpower_desc:0 "We only have a finite number of men we can call upon to fight for [NZL.GetNameDef]. We should invest into the deployment of specialized support companies that can aid us in ensuring our casualties are not our downfall."
 NZL_paratrooper_focus:0 "Paratrooper Focus"
 NZL_paratrooper_focus_desc:0 "Paratroopers are an innovative form of warfare that we can utilize to our advantage in the island rich Pacific, given that our navy is outmatched by the great naval powers."
 NZL_maori_work_camps:0 "Maori Work Camps"
 NZL_maori_work_camps_desc:0 "With much of their land now confiscated from them, there are calls from radical white supremecists within our Legions to implement ghettos and labor camps akin to those of the National Socialist regime in Germany with which to properly implement segragation and boost our economic output."
 NZL_maori_reconciliation:0 "Maori Reconciliation"
 NZL_maori_reconciliation_desc:0 "Although we have severely damaged our relations with the Maori, we have an opportunity to reimplement some welfare programs with which with ease their suffering, and take the first steps in mending this broken relationship."
 NZL_desert_acclimatization:0 "Desert Training"
 NZL_desert_acclimatization_desc:0 "With access to the vast land of the British Empire, the 2NZEF can train for desert warfare in the upcoming war."
 NZL_mountain_acclimatization:0 "Mountain Training"
 NZL_mountain_acclimatization_desc:0 "With access to the vast land of the British Empire as well as our local mountain ranges, the 2NZEF can train for mountain warfare in the upcoming war."
 NZL_rally_behind_the_commonwealth:0 "Rally Behind the Commonwealth"
 NZL_rally_behind_the_commonwealth_desc:0 "We must rally the nation behind the Commonwealth as we did 20 years before!"
 NZL_economic_mobilization:0 "Economic Mobilization"
 NZL_economic_mobilization_desc:0 "We must rapidly mobilize the economy to prepare to fight for the Commonwealth!"
 NZL_commonwealth_radar:0 "Commonwealth Radar"
 NZL_commonwealth_radar_desc:0 "We should organize or brilliant home-grown radio innovators to support the Allied cause in the Pacific."
 NZL_combined_intelligence_centre:0 "Combined Intelligence Centre"
 NZL_combined_intelligence_centre_desc:0 "[NZL.GetLeader] has received a proposal to develop a Combined Intelligence Centre, that would organize our radar technicians and intelligence officers together, while creating an easier structure with which to collaborate with our allies. This is an excellent proposal!"
 NZL_for_the_mother_country:0 "For the Commonwealth"
 NZL_for_the_mother_country_desc:0 "Our Commonwealth allies need us more than ever. The best way we can aid them from our distant corner of the globe is with our volunteers and material support."
 NZL_break_with_the_empire:0 "Break with the Empire"
 NZL_break_with_the_empire_desc:0 "[NZL.GetNameDefCap] rejects all forms of imperialism, and our former overlord is at the heart of global imperialist oppression. We can no longer remain tied to such a vile beast."
 NZL_pacific_communist_alternative:0 "Pacific Communist Alternative"
 NZL_pacific_communist_alternative_desc:0 "We should reach out to fellow Pacific communists to organize a Pan-Pacific alternative to the Comintern rooted in militant Anti-Colonialism."
 NZL_communist_refuge:0 "Communist Refuge"
 NZL_communist_refuge_desc:0 "We should develop [NZL.GetNameDef] into a refuge for communists fleeing the capitalist empires and their colonies."
 NZL_anti_colonial_refuge:0 "Anti-Colonial Refuge"
 NZL_anti_colonial_refuge_desc:0 "We should develop [NZL.GetNameDef] into a refuge for all those seeking refuge from the capitalist empires and their colonies."
 NZL_anti_colonial_agitation:0 "Anti-Colonial Agitation"
 NZL_anti_colonial_agitation_desc:0 "It is time to begin agitation against the capitalist imperialist that keep the Pacific and much of Asia in colonial bondage."
 NZL_strike_at_the_imperialists:0 "Strike At The Imperialists"
 NZL_strike_at_the_imperialists_desc:0 "Now that we have built up anti-colonial guerilla networks across the occupied Pacific, and developed an internationale of anti-colonial communist states, it is time to strike at the capitalist imperialists and liberate the Pacific!"
 NZL_communist_radicalization:0 "Communist Radicalization"
 NZL_communist_radicalization_desc:0 "Many communists and leftists are in the education sector. We should take advantage of this to radicalize the youth and young adults into devotion to the [NZL.GetCommunistParty]."
 NZL_soviet_military_advisors:0 "Soviet Military Advisors"
 NZL_soviet_military_advisors_desc:0 "The Soviets are willing to send military advisors to aid us in rebuilding the Aotearoan Military. We should invite them with open arms."
 NZL_mobilize_the_masses:0 "Mobilize the Masses"
 NZL_mobilize_the_masses_desc:0 "If we are to liberate the masses of the Pacific, we need masses of our own. We must reorient our army for mass mobilization."
 NZL_a_polynesian_red_army:0 "A Polynesian Red Army"
 NZL_a_polynesian_red_army_desc:0 "With the Soviet's expertise and aid we have reformed the Aotearoan Army into a Red Army for the Pacific."
 NZL_aquatic_machines:0 "Mechanized Marine Corp"
 NZL_aquatic_machines_desc:0 "With the influx of British technological expertise and aid, we have the opportunity to radically reform our Armed Forces, focusing on mechanization and our Marine special forces."
 NZL_champion_the_peace_movement:0 "Champion the Peace Movement"
 NZL_champion_the_peace_movement_desc:0 "[NZL.GetCommunistLeader] is an avowed pacificist. Under her leadership, we have an opportunity to remake [NZL.GetNameDef] into a Pacificist paradise."
 NZL_embrace_agrarian_socialism:0 "Emprace Agrarian Socialism"
 NZL_embrace_agrarian_socialism_desc:0 "As an agriculturally based nation, we should orient the [NZL.GetCommunistParty] line around Agrarian Socialism."
 NZL_the_first_five_year_plan:0 "The First Five Year Plan"
 NZL_the_first_five_year_plan_desc:0 "With the revolution successful, we can now implement [NZL.GetNameDef]'s first Five Year Plan."
 NZL_women_in_the_workforce:0 "Women in the Workforce"
 NZL_women_in_the_workforce_desc:0 "[NZL.GetCommunistLeader] has always been a champion of feminism and women's rights. It is time the [NZL.GetCommunistParty] implement women's equality in the workforce."
 NZL_rural_infrastructure_investment:0 "Rural Infrastructure Investment"
 NZL_rural_infrastructure_investment_desc:0 "[NZL.GetNameDefCap] is filled with innovators that can boost our economic and social productivity within our agriculturally based economy. We should sponsor them to develop our rural regions."
 NZL_urban_investment:0 "Urban Investment"
 NZL_urban_investment_desc:0 "We should invest into developing our urban centers in order to maximize their industrial potential."
 NZL_haven_of_tranquility:0 "Haven of Tranquility"
 NZL_haven_of_tranquility_desc:0 "We can now remake [NZL.GetNameDef] into [NZL.GetCommunistLeader]'s pacificist utopia"
 NZL_anti_sub:0 "Anti-Submarine Focus"
 NZL_anti_sub_desc:0 "If we are to face off against the western imperialists, we must invest into ships that can defend our convoys from submarines. With Japanese expertise, our research efforts can be heavily expedited."
 NZL_carrier_focus:0 "Carrier Focus"
 NZL_carrier_focus_desc:0 "The Japanese have been able to produce a modern carrier fleet with limited resoources and industry. With their expertise, perhaps we can expedite our own research into this new class of ships."
 NZL_corportize_the_economy:0 "Corporatize the Economy"
 NZL_corportize_the_economy_desc:0 "Given our geographical and political isolation from the world, we must reorient our economy towards a corporatist model in line with those of our European Fascist brethren if we are to survive. THis will upset our liberal and libertarian supporters, but any dissent can be dealt with by our Legions."
 NZL_mobilize_the_legions:0 "Mobilize the Legions"
 NZL_mobilize_the_legions_desc:0 "Our Legion Party has spawned various groups of 'legions' across the country allied to our anti-socialist cause. We should take advantage of this ideological fervor to expand mobilization."
 NZL_autarcky:0 "Kiwi Autarcky"
 NZL_autarcky_desc:0 "We are alone against the world, but we can learn from the European Fascists once again in embracing a fully Fascistic economy."
 NZL_war_on_pacifism:0 "War On Pacifism"
 NZL_war_on_pacifism_desc:0 "Pacificism is socialistic cancer that has nearly destroyed our civilization. It is time we bring it to a heel."
 NZL_crush_the_communist_menace:0 "Crush the Red Menace"
 NZL_crush_the_communist_menace_desc:0 "Across Asia and the Pacific they are communist threats abound. We must stand up to them before they spread any further."
 NZL_strike_down_under:0 "Strike Down Under"
 NZL_strike_down_under_desc:0 "We must strike the illegitimate socialist government in [AST.capital.GetName] and liberate our fellow Englishmen from their oppressors."
 NZL_claim_polynesia:0 "Claim Polynesia"
 NZL_claim_polynesia_desc:0 "It is due time that we claim all of Polynesia. We can and will rule the central Pacific!"
 NZL_claim_austronesia:0 "Austronesian Ambitions"
 NZL_claim_austronesia_desc:0 "Now that we have united Australian and claimed Polynesia, it is time to seek the ultimate prize, the Austronesian continent. With the resources and labor available to us there we will be unstoppable!"
 NZL_claim_the_pacific:0 "Pan-Pacific Empire"
 NZL_claim_the_pacific_desc:0 "With Polynesia secured, we can set our sights on the entire Pacific! We are invincible!"
 NZL_pacific_peacekeepers:0 "Pacific Peacekeepers"
 NZL_pacific_peacekeepers_desc:0 "With our history in the great war fighting as the New Zealand Expeditionary Force, we should invest in our expeditionary capabilities to protect peace and democracy across the Pacific."
 NZL_decolonize:0 "Decolonization"
 NZL_decolonize_desc:0 "It is due time that we decolonize our own colonial holdings, setting up autonomous regimes under our protection."
 NZL_seek_american_protection:0 "Seek American Protection"
 NZL_seek_american_protection_desc:0 "As a small and relatively defenseless new republic, we should reach out to the Americans for protection. As fellow republic born out of the British Empire, we have much in common."
 NZL_american_industrial_aid:0 "American Industrial Aid"
 NZL_american_industrial_aid_desc:0 "Our alliance with the Americans comes with many benefits, the first of which is access to American industrial aid."
 NZL_american_licenses:0 "American Licenses"
 NZL_american_licenses_desc:0 "We should reach out to the Americans to draft an agreement to provided easier channels to license their advance weaponry and military technology."
 NZL_pacific_leadership:0 "Pacific Leadership"
 NZL_pacific_leadership_desc:0 "Despite our small and isolate position even in the Pacific theatre, we should reach out to the democracies of the region and attempt to form a defensive pact."
 NZL_promote_trade:0 "Promote Trade"
 NZL_promote_trade_desc:0 "Being outside the Commonwealth means that many of our guaranteed trade partners are gone. We should invest into promoting free trade across the region and position ourselves as a safe and amicable trading partner."
 NZL_scientific_refuge:0 "Scientific Refuge"
 NZL_scientific_refuge_desc:0 "Our position in the corner of the world, our democratic traditions, and our legacy of home grown innovators, engineers, inventors, and scientists, make us the perfect haven for dissident scientist fleeing autocracies across the world."
 NZL_american_scientific_cooperation:0 "American Scientific Cooperation"
 NZL_american_scientific_cooperation_desc:0 "Our American allies are at the forefront of scientific expertise. We should formally collaborate with them on scientific endeavors."
 NZL_anti_colonial_pressure:0 "Anti-Colonial Pressure"
 NZL_anti_colonial_pressure_desc:0 "While we are a free republic, many in the Pacific are still under the colonial yoke. We should invest into diplomatically pressuring the colonial governments to end their unjust occupation of these foreign lands and grant the people of them freedom, or at least autonomy."
 NZL_promote_democratic_values:0 "Promote Democratic Values"
 NZL_promote_democratic_values_desc:0 "We should invest into promoting democratic values across the Pacific."
 NZL_naval_range:0 "Naval Range Focus"
 NZL_naval_range_desc:0 "The Pacific is a wide and vast ocean with few islands in between. If we are to maximize our naval potential we must maximize our naval range."
 NZL_naval_reorientation:0 "Naval Industrial Reorientation"
 NZL_naval_reorientation_desc:0 "Isolated from our any allies and surrounded by enemies, we must reorient our military production toward shipbuilding if we are to have a chance at winning the battle for the Pacific."
 NZL_our_pacific_empire:0 "Our Own Empire"
 NZL_our_pacific_empire_desc:0 "It is time we cast of the domineering yoke of the British and set our own path, free of socialistic influence."
 NZL_unify_australasia:0 "Unify Australasia"
 NZL_unify_australasia_desc:0 "We have an unprecendented opportunity to unify the south Pacific Anglosphere and form a united, strong, and English Australasia."
 NZL_take_australasian_com_lead:0 "Subjugate the Australian CPA"
 NZL_take_australasian_com_lead_desc:0 "The Comintern still looks to the Communist Party of Australia as the leader of the communist movement in the region. It is time, now that we are the preeminent communist power in the region, that Moscow support our leadership of the South Pacific communist movement."
 NZL_prepare_ast_for_lib:0 "Prepare Australian Workers for Liberation"
 NZL_prepare_ast_for_lib_desc:0 "With the resources of their newly liberated sister nation, the workers of Australia can be empowered to fight for their liberation from capitalist oppression, and will be useful to aid our forces in the event of war between us."
 NZL_liberate_ast:0 "Liberate Australian Workers"
 NZL_liberate_ast_desc:0 "It is time that we heed the plight of the Australian worker! Down with capitalist imperialism! Long live the revolution!"
 NZL_invite_ast_to_faction:0 "Invite Australia to PCA"
 NZL_invite_ast_to_faction_desc:0 "Our comrades in Australia are ready to join us in liberating the workers of the Pacific."
 NZL_unite_australasia_com:0 "Unite Australasia"
 NZL_unite_australasia_com_desc:0 "A century ago we split from the colonial precursor to the state of Australia, and since then we have always be brothers and sisters with our neighbors to the west. Now that we are also comrades in the revolution, it is time that we unite together, using the regional term \"Australasia\"."
 NZL_jap_naval_expertise:0 "Invite Japanese Naval Experts"
 NZL_jap_naval_expertise_desc:0 "The Japanese have built a navy to rival the colonial powers that have ruled the Pacific up until now. We should request experts and advisors in builting and maintaining a navy that can project power with few resources."
 NZL_jap_pacific_planes:0 "Invite Japanese Air Experts"
 NZL_jap_pacific_planes_desc:0 "The Japanese have invested into a fleet of carrier planes to dominate the Pacific skies. We can take advantage of their experience to aid them in their military endeavors."
 NZL_garuntee_individual_liberty:0 "Guaruntee Individual Libery"
 NZL_garuntee_individual_liberty_desc:0 "Individualism is the cornerstone of the Legion's ethos. While we are a corporatist and fascist state, empowering the hard working man in leading his family is the cornerstone of our power base."
 NZL_family_matters:0 "Family Matters"
 NZL_family_matters_desc:0 "We will encourage family building and traditional gender roles in order to bolster our nation."
 NZL_preempt_fascist_threat:0 "Preempt the Fascist Threat"
 NZL_preempt_fascist_threat_desc:0 "The Fascists are threatening to spread darkness to the Pacific. It is time that we stand up and defend democracy from these warmongering despots."
 NZL_statute_of_westminster_loyalist:0 "Adopt Westminster"
 NZL_statute_of_westminster_loyalist_desc:0 "We embrace the Westminster system that we have inherited from the United Kingdom."
 NZL_beeby_education_reforms:0 "Beeb's Education Reforms"
 NZL_beeby_education_reforms_desc:0 "C.E. Beeby, colloquially known as "Beeb", is a pioneering educator with radical ideas to reform the New Zealand education system. We will empower him to reform our education system with fresh ideas promoting democratic ethos and educational prowess."
 NZL_empower_the_trade_unions:0 "Cooperate With the Trade Unions"
 NZL_empower_the_trade_unions_desc:0 "The Labour Party is commited to empowering and working alongside trade unions to develop socialistic economic policy and fight for the working class, who are the lifeblood of our nation."
 NZL_welfare_state:0 "Welfare State"
 NZL_welfare_state_desc:0 "It is time that we transform the state of New Zealand into a welfare focused state, investing into key industries and working families, with reforms that will last even if Labour loses power in an election."
 NZL_empower_the_industrialists:0 "Cooperate With the Industrialists"
 NZL_empower_the_industrialists_desc:0 "The National Party is commited to empowering and working alongside industrialists to develop capitalistic economic policy and fight for the captains of industry, who are the power brokers of our nation."
 NZL_austerity:0 "Austerity"
 NZL_austerity_desc:0 "It is time that we transform the state of New Zealand into an austerity focused state, balancing our budget and empowering the free market, with reforms that will last even if National loses power in an election."
 NZL_organize_the_legion:0 "Organize the Legion"
 NZL_organize_the_legion_desc:0 "The Legion is currently fractured, unfocused, and disorganized. If we organize the Legion into a proper political party with a mix of fascist political orientation with libertarian policy platform, we can convince the New Zealand working class that we are capable of national leadership."
 NZL_legions_of_christ:0 "Legions of Christ"
 NZL_legions_of_christ_desc:0 "By integrating Christianity into our political ethos we can radicalize the population and military towards our imperial ambitions."
 NZL_claim_melanesia:0 "Claim Melanesia"
 NZL_claim_melanesia_desc:0 "The common definition of Australasia includes the Melanesian region to our north, named after the dark skin of its native inhabitants. While we have no interest in actually integrating these natives into our nation, we can still lay our colonial claim to these territories."
 NZL_eng_soc:0 "English Socialism"
 NZL_eng_soc_desc:0 "The workers of Great Britain have also liberated themselves from the capitalist yoke. We should reach out to our brothers in the north to see if we can once again be allies, now as equal comrades instead of imperial subjects."
 NZL_big_sister:0 "[NZL_big_sister_sl]"
 NZL_big_sister_sis:0 "Big Sister"
 NZL_big_sister_bro:0 "Big Brother"
 NZL_big_sister_desc:0 "[NZL_big_sister_desc_sl]"
 NZL_big_sister_desc_sis:0 "[NZL.GetCommunistLeader] is now in the position to consolidate power and act as the matriarch of the nation."
 NZL_big_sister_desc_bro:0 "[NZL.GetCommunistLeader] is now in the position to consolidate power and act as the patriarch of the nation."
 NZL_technology_sharing_with_eng:0 "Technology Sharing With Union of Britain"
 NZL_technology_sharing_with_eng_desc:0 "The Union of Britain has many of the world's top scientists and technology innovators. They are generous enough to share what they know with us, their brothers in arms."
 NZL_claim_ast:0 "Claim Australia"
 NZL_claim_ast_desc:0 "With the mother nation of the Anglosphere as our ally, we are in a position to stake claim to Australia, in the hopes of uniting the SWPA under an Australasian superstate."
 NZL_integrate_melanesia:0 "Integrate Melanesia"
 NZL_integrate_melanesia_desc:0 "The common definition of Australasia includes the Melanesian region to our north. The native peoples of these islands have suffered greatly under extractive colonial capitalism. We should integrate these people into our nation to uplift them as comrades and equals."
 NZL_beacon_of_liberty:0 "Beacon of Liberty"
 NZL_beacon_of_liberty_desc:0 "We should stand alone as the a beacon of liberty in the Pacific and wider world. With a reorientation of forieng and domestic policy away from military alliances, we support and aid emerging nations and democratic movements."
 NZL_promote_international_cooperation:0 "Promote International Cooperation"
 NZL_promote_international_cooperation_desc:0 "Regardless of the failure of the League of Nations to prevent war, end colonialism, and support emerging nations, we should aim to live up to those ideals, and remind the world that cooperation is better than conquest."
 NZL_indirectly_support_anti_fascist_cause:0 "Indirectly Support Anti-Fascist Cause"
 NZL_indirectly_support_anti_fascist_cause_desc:0 "There are Anti-Fascist movements around the world seeking international support. We can use our diplomatic and political capital to support democracy and Anti-Fascism across the world."
 NZL_breadbasket_of_the_emerging_world:0 "Breadbasket of the Emerging World"
 NZL_breadbasket_of_the_emerging_world_desc:0 "There are many small emerging nations around the world seeking international aid and support. We can use our economic capital and agricultural abundance to support the emerging nations that provide electoral freedoms for their citizens."
 NZL_democratic_faction_investments:0 "Democratic Allied Investments"
 NZL_democratic_faction_investments_desc:0 "We have a number of democratic allies interesting in investing in our military industrial capacity. We should work to negotiate the flow of foreign capital and industrial support in order to bolster our military production output."
 NZL_uranium_mining:0 "Uranium Mining"
 NZL_uranium_mining_desc:0 "Over the last decades, our Australian conrades have found large uranium deposits in South Australia, especially around Mt Gee. Uranium is now a vital military resource and exploitation of these reserves should be increased."
 NZL_aoteroan_nuclear_program:0 "Australasian Nuclear Program"
 NZL_aoteroan_nuclear_program_desc:0 "Now that we are rich with Uranium, we can utilize our advanced science and technology sectors to pursue nuclear technology. While it is a massive investment, acquiring nuclear power could be the key to ensuring security and prosperity for all Australasians."
 NZL_arms_for_the_revolution:0 "Arms for the Revolution"
 NZL_arms_for_the_revolution_desc:0 "We must mass produce guns at an unprecendented scale to support our comrades across the Pacific, even if it means the quality of each gun worsens."
 NZL_claim_ast_fasc:0 "Claim Australia"
 NZL_claim_ast_fasc_desc:0 "If we are to realize our imperial ambitions we must stake claim to Australia in the hopes of uniting the SWPA under an Australasian superstate."
 NZL_nz_corps:0 "NZ Corps"
 NZL_nz_corps_desc:0 "The First New Zealand Corps is a divsion formed from the 2nd New Zealand Division as well as other COmmonwealth forces. Led by Bernard Freyburg, this new formation has enabled the brilliant Brigadier Howard Kippenberger to be promoted to Major General."
 NZL_expand_port_chalmers:0 "Expand Port Chalmers"
 NZL_expand_port_chalmers_desc:0 "Port Chalmers in Dunedin, South Island, is a vital alternative to the port of Auckland. While the port is small, if we invest into it further we can expand its shipbuilding and ship repairing capabilities, diversifying and expanding our shipbuilding industry."
 NZL_indigenous_air_designs:0 "Indigenous Air Designs"
 NZL_indigenous_air_designs_desc:0 "Now that we are independent we must invest into our nascent aircraft repair and construction firms to build an indigenous aircraft industry."
 NZL_coal_creek_scheme:0 "Coal Creek Scheme"
 NZL_coal_creek_scheme_desc:0 "[NZL_coal_creek_scheme_desc_sl]"
 NZL_coal_creek_scheme_desc_native:0 "The many rivers in the [723.GetName] hold incredible hydroelectric power generation potential, increasing the industrial potential of the [723.GetName]. We can begin with damming the Mata-Au river in the area known locally as Coal Creek, near the town of Roxburgh."
 NZL_coal_creek_scheme_desc_base:0 "The many rivers in the [723.GetName] hold incredible hydroelectric power generation potential, increasing the industrial potential of the [723.GetName]. We can begin with damming the Clutha River in the area known locally as Coal Creek, near the town of Roxburgh."
 NZL_tiwai_point_aluminium_smelting:0 "Tiwai Point Aluminium Smelting"
 NZL_tiwai_point_aluminium_smelting_desc:0 "We can continue to develop the South Island by working with our Australian counterparts who have discovered a seemingly endless Bauxite reserve in [872.GetName]. While it is in AUstralia, we can invest into a large scale smelter to convert the Bauxite into Aluminum."
 NZL_modern_army:0 "Modern Army"
 NZL_modern_army_desc:0 "We must prioritize modernizing our army as we prepare to defend the nation."
 NZL_research_cooperation:0 "Research Cooperation"
 NZL_research_cooperation_desc:0 "Kiwis are an intelligent and resourceful people with scientifically adavanced allies. We must work with our allies to share knowledge and breakthroughs for mutual benefit."
 NZL_australasian_research_cooperation:0 "Australasian Research Cooperation"
 NZL_australasian_research_cooperation_desc:0 "Australians and Kiwis are an intelligent and resourceful people. We must work together to share knowledge and breakthroughs for mutual benefit."
 
