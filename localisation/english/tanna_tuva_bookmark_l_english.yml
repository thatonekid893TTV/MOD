 TAN_GATHERING_STORM_DESC:0 "Tannu Tuva has had a rough start as a nation. It was founded in 1914 as the Uryankhay Krai Republic during the fall of the Qing Dynasty. Then it was promptly taken over by communists in 1921 as the Russian Civil War came to a close. The nation would pass more turmoil as Kuular’s theocratic and nationalist policies would lead to a Soviet-backed coup in 1929. Tannu Tuva has not had an easy time as a nation. Along with political turmoil, the nation has a weak government, worthless currency, and an extremely weak and outdated military. Now under the rules of Stalinist Salchak Toka, the nation grows closer to the Soviet Union through political influence and an ongoing border dispute with Mongolia."
