  SAU_purchase_aircraft_tt: "\nDepending on the progress of [FROM.GetAdjective] research, we will choose to order 40 §YFighters§!, 30 §YNaval Bombers§!, or 20 §YTactical Bombers§!."
  SAU_purchase_artillery_tt: "\nDepending on the progress of [FROM.GetAdjective] research, we will choose to order 100 §YArtillery§! [GetAvailableArtilleryToPurchase].\n"
  SAU_purchase_vehicles_tt: "\nDepending on the progress of [FROM.GetAdjective] research, we will choose to order 100 §YMotorized Vehicles§!, 50 §YMechanized Vehicles§!, or 50 §YArmored Vehicles§!."
  SAU_purchase_armor_tt: "Depending on the progress of [FROM.GetAdjective] research, we will choose to order 40 §YLight Tanks§!, 20 §YMedium Tanks§!, or 10 §YHeavy Tanks§!."

  SAU_mining_the_sea: "Mining the Sea"

  SAU_mining_the_sea_desc: "We should mine the sea to prevent hostile traffic from passing through, thus making us more secure from naval invasion."

  ##########################################################################################################################    工业   ##########################################################
  ################################################################################################
  SAU_wunian_jihua_decisions: "Five-Year Plan"
  SAU_wunian_jihua_decisions_desc: "Despite its strong communist overtones, the Five-Year Plan is undeniably a useful tool for planning a nation's economic development. We should introduce plans to guide the development of our industry.\n\nCurrent [SAU.GetAdjective] §YShares§!: [Root.GetshateAngerLevel]([?SAU.SAU_shate_gufen|-0])\n\nCurrent Standard Oil Company §YShares§!: [Root.GetmeifushiyouAngerLevel]([?SAU.UAS_meifushiyou_gufen|-0])"
  SAU_shiyougongsi_jianzao: "Oil companies are under construction"
  SAU_shiyougongsi_jianzao_tt: "The company has so far built:\n-§Yindustrial complex§!：§G[?built_a_civ]§!\n-§Yarms factory§!：§G[?built_a_mil]§!\n-§Yinfrastructure§!：§G[?built_a_infra]§!\n-§Ysynthetic refinery§!：§G[?lian_youchang]§!"
  SAU_goumai_amei_shiyou_gufen: "Purchase Standard Oil Company Shares"
  SAU_goumai_amei_shiyou_gufen_desc: "The rights to exploit and operate oil, a national resource, are completely in the hands of U.S. oil monopoly capital. Most of the huge revenue generated by the substantial increase in oil production does not accrue to Saudi Arabia, but is instead swallowed up by U.S. oil monopoly capital."
  SAU_sea_decision_cost_pp: "£pol_power §Y[?SAU.SAU_shougou_gufen_pp]§! "
  SAU_sea_decision_cost_pp_blocked: "£pol_power §R[?SAU.SAU_shougou_gufen_pp]§! "
  SAU_sea_decision_cost_pp_tooltip: "Executing this decision costs £pol_power §Y[?SAU.SAU_shougou_gufen_pp]§! "
  Saudi_Arabia_gongye_wunianjihua_one_tt: "\nUnlocks the decision: §Y$SAU_goumai_amei_shiyou_gufen$§!, allowing us to gradually purchase shares in §YStandard Oil of California§!.\nIf we complete the §Y$Saudi_Arabia_gongye_shate_amei_shiyougongsi$§! focus: the §Gcost of the §Y$SAU_goumai_amei_shiyou_gufen$§! decision is halved§!."
  SAU_shou_gou_amei_shiyou: "Nationalize Saudi Aramco"
  SAU_shou_gou_amei_shiyou_desc: "We already own the majority of Standard Oil. It's time to fully nationalize it. This will be a great step towards Saudi Arabia's glorious future."
  SAU_guoyou_hua_shate_amei: "Forced Nationalization of Aramco"
  SAU_guoyou_hua_shate_amei_desc: "Throughout our history, many foreign companies and enterprises have come to our country and exploited our resources and people. We must nationalize these industrial assets and make them our own."
  shate_gufen_1: "§Y0%§!"
  shate_gufen_2: "§Y10%§!"
  shate_gufen_3: "§Y20%§!"
  shate_gufen_4: "§Y30%§!"
  shate_gufen_5: "§Y40%§!"
