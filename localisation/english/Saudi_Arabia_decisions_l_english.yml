  SAU_duoshenjiao_ouxiangchongbai: "Honoring Ancestors"
  SAU_duoshenjiao_ouxiangchongbai_desc: "It is not just one faith that unites us, but rather a multitude of faiths that make up the religious ecology of our society. Despite claiming to be different and following different paths, some outsiders to our belief system have learned to coexist within our society, as if they were one of us."
  SAU_duoshenjiao_ouxiangchongbai_hubaile: "The Divination of Khubaile"
  SAU_duoshenjiao_ouxiangchongbai_hubaile_desc: "Khubaile is human-like, with a missing right hand. Before him are seven divination sticks, the first of which reads "Innocent," the second "Agreement." When people are arguing about something, planning a long journey, or considering undertaking a task, they go to Khubaile to draw a divination stick and act accordingly."
  SAU_duoshenjiao_ouxiangchongbai_anla: "The Glory of Allah"
  SAU_duoshenjiao_ouxiangchongbai_anla_desc: "In Western Asia, the Moon Goddess is married to the Sun Goddess and has the stars as her children. The Moon gives them everything, including all of nature and everything they possess. The Sun smothers the hope of life, and only the Moon can offer new life."
  SAU_duoshenjiao_ouxiangchongbai_mona: "The Misfortune of Mena"
  SAU_duoshenjiao_ouxiangchongbai_mona_desc: "Mena was the ancient Arabian goddess of fate. Her idol is located on the coast of the Mushalal region, part of the ancient Wadi Valley, between Mecca and Medina. Aws, Hazraj, and the tribes living in Medina, Mecca, and the surrounding areas once worshipped Mena and offered sacrifices to her."
  SAU_duoshenjiao_ouxiangchongbai_late: "The Power of Rat"
  SAU_duoshenjiao_ouxiangchongbai_late_desc: "The goddess Lat is known as "the mightiest one" or "the powerful one." People prayed to her before battle for protection and victory. Her idol is located in Taif. She was worshipped by all Arabs, including the Quraysh. The idol was managed for generations by the family of Attab ibn Malik of the Saqif tribe, who built a temple around the open-air Lat idol."
  SAU_duoshenjiao_ouxiangchongbai_ouzha: "Fertility of 'Uzza"
  SAU_duoshenjiao_ouxiangchongbai_ouzha_desc: "'Uzza was a fertility goddess. Her idol is found in a ravine called Suqam, located in the Wadi al-Hurad, within the borders of Nahrat-e-Shahamiyah, on the right-hand side of the road from Mecca to Iraq. Ibn Kalbi states: 'Uzza was the most important idol of the Quraysh tribe. The Quraysh worshipped her and sacrificed animals to her."
