  meifushiyou_gufen_10: "§Y90%§!"
  meifushiyou_gufen_11: "§Y100%§!"
  SAU_kuoda_shiyou_kaicai_fanwei: "Expanding the oil company's exploration area"
  SAU_kuoda_shiyou_kaicai_fanwei_desc: "Granting the oil company the right to explore and exploit oil fields within an additional 200,000 square kilometers of our country will help us unearth the precious treasures beneath this yellow sand, which will completely change Saudi Arabia's destiny."
  SAU_kuoda_shiyou_kaicai_fanwei_tt: "We have a chance of discovering a §Glarge§! oil and gas field."
  SAU_lasinula_lianyouchang: "Preparing for the construction of the Ras Tannurah Refinery"
  SAU_lasinula_lianyouchang_desc: "The Ras Tannurah Refinery is a massive refinery launched by Saudi Aramco in the early days of oil production. The town of Ras Tannurah is located on the coast of the Arabian Gulf, approximately 64 kilometers from the city of Dhahran in the Kingdom of Saudi Arabia. On May 1, 1939, the tanker D.G. Scofield dropped anchor here, marking the start of the Aramco project. King Abdulaziz bin Abdulrahman Al Saud personally turned the valve, loading the tanker with the Kingdom's first batch of export crude oil."
  SAU_gaizu_shate_amei: "Negotiated 50/50 split"
  SAU_gaizu_shate_amei_desc: "Following the Venezuelan model, a 50/50 split will be implemented, requiring foreign companies extracting oil in the country to pay half of all profits as income tax. The introduction of a series of tax mechanisms will further increase the government's total revenue from oil companies."
  SAU_gaizu_shate_amei_tt: "Our §G shares§! will be split §G 50/50 with Saudi Aramco§!"
  SAU_xiujian_fan_alabo_youguan: "Construction of the Trans-Arabian Pipeline"
  SAU_xiujian_fan_alabo_youguan_desc: "The Trans-Arabian Pipeline At the time of its completion, the Pipeline was the world's largest oil pipeline system. The pipeline system runs east to north through the Kingdom of Saudi Arabia, extending to the city of Sidon in Lebanon. Completed in 1950, the pipeline transports oil to European markets across the Mediterranean Sea."
  SAU_huangjin_touru_jichusheshi: "Investing gold in naval construction"
  SAU_huangjin_touru_junshi: "Investing gold in military construction"
  SAU_huangjin_touru_jianzhugongsi: "Investing gold in civilian construction"
  SAU_huangjin_touru_flag: "Gold has been invested in construction"


  SAU_mai_shiyou_gei_guojia: "Selling Oil"
  SAU_mai_shiyou_gei_guojia_desc: "War brings wealth, and the current conflicts raging around the world present a golden opportunity. As technology advances, the warring nations will need more oil to sustain their war machines. We must not miss this opportunity.\n\n\n"
  SAU_absolute_neutrality_breakdown: "[Root.GetAdjective]'s §Yopinion§! of [SAU.GetAdjective] is [?ROOT.opinion@SAU|+0]\n\nSelling oil to a nation hostile to a major power will result in a decrease in opinion. If §Y[?ROOT.GetAdjective]§!'s opinion of [SAU.GetAdjective] reaches §R[?SAU.SAU_pingjia_biaoqian]§! and [SAU.GetAdjective] sells oil to a nation at war with §Y[?ROOT.GetAdjective]§!, they will consider us a §Rviolation of neutrality§! and may §Rdeclare war on [SAU.GetAdjective]§!"
  SAU_add_fallout_to_opinion: "Will have an impact."
  SAU_country_to_appease_1_opinion_loc: "[?ROOT.opinion@SAU|+0]"
  SAU_country_to_appease_2_opinion_loc: "[?ROOT.opinion@SAU|+0]"
  SAU_country_to_appease_3_opinion_loc: "[?ROOT.opinion@SAU|+0]"
  SAU_xiang_deguo_chushoushiyou: "Sell oil to [FROM.GetAdjective]"

  SAU_goumai_shiyou: "Purchase [SAU.GetAdjective] oil"
  woyao_mai_shiyou: "Purchase [SAU.GetAdjective] oil"
  SAU_mai_shiyou_flag: "[FROM.GetNameDefCap] has agreed to purchase our oil, but has not yet delivered."
  SAU_xiang_deguo_chushoushiyou_1_flag: "[FROM.GetAdjective] refuses to purchase oil"
  SAU_yingguo_ruqin_mission: "[ENG.GetAdjective] questions [SAU.GetAdjective] diplomatic direction"
  SAU_sell_oil: "Sell [SAU.GetAdjective] oil to [FROM.GetNameDef]"
  SAU_sell_oil_desc: "With wars breaking out around the world, we have a golden opportunity to sell our vast oil reserves to improve our economy and eliminate external threats. This will fully utilize our abundant natural resources."
  SAU_sold_oil_flag: "Sell [SAU.GetAdjective] Oil"
  SAU_refused_oil_flag: "Reject [SAU.GetAdjective] Oil"
  SAU_offers_oil_flag: "Offers [SAU.GetAdjective] Oil"
  SAU_gongye_zengjia_yiliao_touzi: "Increase Medical Facilities"
  SAU_gongye_zengjia_yiliao_touzi_desc: "Medical facilities in [SAU.GetAdjective] are severely inadequate. Dysentery, cholera, and malaria are ravaging the countryside, hindering development. Increasing facilities across the country will effectively address this situation."
  SAU_gongye_qingli_nueji: "Malaria Cleanup"
  SAU_gongye_qingli_nueji_desc: "Malaria remains a scourge in many parts of our country. By clearing areas where malaria parasites breed, we can eliminate this long-standing historical challenge for rural populations and open up new land for development."
  SAU_shou_gou_shate_helan_yinhang: "Acquire Saudi-Anagro Bank"
  SAU_shou_gou_shate_helan_yinhang_desc: "Saudi-Anagro Bank was founded in 1926 as a branch of the Dutch Small Bank. Giving the right to mint coins to a foreign company is unlikely to be a good idea. Acquiring Saudi-Anagro Bank and establishing a national bank would be a crucial step in Saudi Arabia's modernization."

  ##########################################################################################################################    政治   ##########################################################
  ################################################################################################
  zongjiaoshili_panluan: "Religious forces are rebelling"
  zongjiaoshili_panluan_desc: "Reports from outside indicate that traditionalist religious groups have infiltrated the north and are attempting to persuade the local population to return to their traditional way of life—a stark contradiction to our secular policies. These charismatic imams and active opposition leaders are instigating a shift in popular sentiment in the north, and all attempts to gently persuade them have so far failed. Regardless, the time has come for a decision."
  SAU_zongjiaoshili_panluan_mission: "Religious forces are preparing for a rebellion"
  SAU_spreading_the_red_flame_cat: "Spreading revolution in the Middle East"
  SAU_spreading_the_red_flame_cat_desc: "We have finally succeeded in establishing a truly proletarian regime, but the struggle will be long and difficult. It is our responsibility to spread the flame of revolution throughout the Middle East, helping oppressed workers overthrow capitalist tyranny and establish their own proletarian regime!\n\n\n"
  SAU_kuilei_zhongdong_geguo: "Encourage proletarian unity in [FROM.GetNameDef]"
  zhuanzhu_zhonngdong_geming: "[SAU.GetAdjective] Red Menace"
  SAU_jianli_renmin_xiaqu_decision: "Establish Volkskommissariats in [FROM.GetNameDef]"
  SAU_zaixiaqu_gongyehua_decision: "Industrialization Efforts in [FROM.GetNameDef]"
  SAU_zhongdong: "Incite anti-[FROM.OWNER.GetAdjective] uprising in [FROM.GetName]"
  SAU_zhongdong: "Support the uprising to overthrow [FROM.Owner.GetAdjective] rule."
  SAU_yaoqing_zhongdong_geguo: "Invite [FROM.GetNameDefCap] to join us"
  SAU_chengli_alabo_renmigongheguo: "Liberation of Arabia"
  SAU_chengli_alabo_renmigongheguo_desc: "We are part of the kingdom of the truly oppressed, while the Saudi monarchy is part of the kingdom of the true oppressors and colonizers. The ongoing battle is between these two kingdoms... Our struggle against tyranny is part of a long chain of world revolution that will inevitably lead to the collapse of the imperialist superpowers and the rise of the oppressed world."
  SAU_alabo_lianheguo_chengli: "Formation of the United Arab Republic"
  #######################################蓝线##################################################
  SAU_xiang_mengjun_tigong_qingbao: "Provide intelligence."
  SAU_xiang_mengjun_tigong_qingbao_desc: "[ROOT.GetNameDef] must be cautious in what we say and do to ensure our fragile neutrality is not compromised, or we risk losing our democratic island to the tide of war."
  SAU_tigong_qingbao_zhichi: "Provide intelligence support."
  #######################################法团##################################################
  SAU_cisha_yiben_shate: "Assassinate Ibn Saud"
  SAU_cisha_yiben_shate_desc: "We once believed that Ibn Saud would be a wise and capable leader who would lead our country to greatness. However, the results of his repressive, almost dictatorial regime have proven us not only wrong, but have even threatened to further destabilize our nation. It is our unshirkable responsibility to remove this incompetent ruler and establish a new government that the people trust."
  SAU_yihewan_quandao: "Incite the remnants of the Ikhwan"
  SAU_yihewan_quandao_desc: "A remnant of our Ikhwan will be incited to carry out our 'dirty work'. This way, even if the assassination attempt is discovered, no member of our government will be implicated."
  SAU_jianli_cisha_xiaozu: "Establish a hit squad"
  SAU_jianli_cisha_xiaozu_desc: "We will offer a staggering sum of money to Ikhwan-sympathetic factions within the government to incite them to identify suitable individuals for our plan."
  SAU_zhiding_shijun_jihua: "Forge a posthumous testament"
  SAU_zhiding_shijun_jihua_desc: "Before we begin final preparations and action, we need to forge a posthumous will from Ibn Saud to prevent any opponents from questioning our legitimacy."
  SAU_zhiding_shijun_jihua_flag: "Forged Will"
  SAU_alabodiguo_jingong_celue: "King of the Arab World"
  SAU_alabodiguo_jingong_celue_desc: "We have not forgotten the glorious history of Arabia. Deep in our hearts, [SAU.GetNameDef] remains an empire, and with hard work, we will soon become one again. Now is the time to prepare our people for this transformation."
  SAU_meisuobudamiya_zhanlue_decisions: "Mesopotamia Strategy"
  SAU_kuayue_haixia_decisions: "Crossing the Strait"
  SAU_jinru_zhongya_decisions: "Entering Central Asia"
  #######################################拉希德##################################################
  SAU_dusaiwaer_yishi_qiuai_jice: "The Ottoman Road"
  SAU_dusaiwaer_yishi_qiuai_jice_desc: "The collapse of the Ottoman Empire brought us a sigh of relief, but now it seems that the threat from Western colonialism is even greater than the former Ottoman Empire. These turbulent times call for more surprising allies. The Rashid family has long exchanged with the Ottoman Empire. Perhaps now is the time for [ROOT.GetNameDefCap] to bear the banner of the Caliphate and let the Ottoman eagle fly over these lands once again."
  SAU_kaishi_zhuiqiu_gongzhu_tt: "$TUR_durrushehvar_i$ is the daughter of $TUR_abdulmejid_ii$, the last Sultan of the Ottoman Empire. After the Ottoman Empire was overthrown by Kemal, she followed her family's arrangements and married Azam Khan, the eldest son of the Nizam of Hyderabad, India. However, this marriage was unhappy. Her pedantic husband was bored with this intelligent princess and flirted with various mistresses. Perhaps we should let her pursue a better marriage, shouldn't we?..."
  SAU_xuancheng_aosiman_tt: "After choosing this resolution, we will not be able to choose to pursue §Y$TUR_durrushehvar_i$§!（This resolution and §Y$SAU_yindu_guoshifangwen$§!§R Cannot coexist §!）"
  SAU_xuancheng_aosiman_1_tt: "Claiming the Ottomans alone with this decision will incur a short-lived $stability_factor_tt$: §R-25.0%§! penalty. Choosing §Y$SAU_yindu_guoshifangwen$§! will subsequently initiate a pursuit of Druseval in exchange for the Ottoman claim (long-lasting)."
  SAU_yindu_guoshifangwen_tt: "This decision will start the quest for $TUR_durrushehvar_i$ to gain Ottoman claims."
  SAU_yindu_guoshifangwen: "State visit to [HYD.GetNameDefCap]"
  SAU_jiechumaijide_ershi: "Seeking the support of $TUR_abdulmejid_ii$"
  SAU_kaishi_zhuiqiu_gongzhu: "Begin the pursuit of $TUR_durrushehvar_i$"
  SAU_kaishi_zhuiqiu_gongzhu_mission: "The pursuit of $TUR_durrushehvar_i$"
  SAU_yingqu_dulusaiwaer_flag: "$TUR_durrushehvar_i$ accepts our advances."
  SAU_yingjiu_saaiyide_nuerxi: "rescue $TUR_said_i_nursi$"
  SAU_yingjiu_saaiyide_nuerxi_desc: "$TUR_said_i_nursi$ advocates for the restoration of the Ottoman Empire. He was persecuted by [TUR.GetNameDefCap] for his religious revival, spending much of his life in prison and exile. Now that the great Caliph has arrived in his loyal city, it is time to rescue these loyal subjects from the persecution of Kemal's followers."
  SAU_yingjiu_saaiyide_nuerxi_1_tt: "We will attempt to rescue $TUR_said_i_nursi$. However, this action is too risky and may fail."
  SAU_xuancheng_aosiman: "Claim Ottoman"
  SAU_JOR_bianjing_chongtu: "Raid Jordan"
  SAU_mohanmode_jihua_decisions: "Mehmed Offensive"
  SAU_mohanmode_jihua_decisions_desc: "Mehmed II was the seventh Sultan of the Ottoman Empire, nicknamed "Fatih." His reign was marked by conquests in Asia Minor and the Balkans. To honor him, we have named our war plan in the region after him."
  SAU_sailemu_jihua_decisions: "Salem Offensive"
  SAU_sailemu_jihua_decisions_desc: "Selim I was the ninth Sultan of the Ottoman Empire, best known for his invasion of the Mamluks in 1516 AD. In his honor, we will name our plan to invade North Africa and expel [ENG.GetAdjective] from these lands after him."
  SAU_sulaiman_jihua_decisions: "Suleiman Offensive"
  SAU_sulaiman_jihua_decisions_desc: "Suleiman the Magnificent was a prominent 16th-century Ottoman monarch, widely known in the West as "The Great." Suleiman personally led the Ottoman conquests of the Christian capital of Belgrade, Rhodes, and much of Hungary. Therefore, by naming our plan after him, we will atone for our defeat at the hands of the Habsburgs."
  SAU_huigui_yisitanbuer_decisions: "Return to [797.GetName]"
  SAU_zhenghe_kuerde: "Integrate [KUR.GetAdjective]"
  SAU_zhenghe_baojialiya: "Integrate [BUL.GetAdjective]"
  Saudi_Arabia_laxide_muhanmude_de_yichan_tt: "Unlocks §YDecision§!, allowing us to integrate puppet vassals into the state."
  SAU_gongru_yisitanbuer: "Capture [797.GetName]"
  SAU_gongru_yisitanbuer_desc: "We promised $TUR_abdulmejid_ii$ to return to Istanbul in order to marry $TUR_durrushehvar_i$. Now is the time to fulfill that promise..."
  SAU_form_roman_empire_category: "Realize Roman Ambitions"
  SAU_form_roman_empire_category_desc: "The idea of an Empire spanning the Mediterranean has in recent years been revived in the popular mind. Now, our military campaigns have exceeded the wildest dreams of even our most ardent supporters, and we find ourselves on the cusp of being able to realize these ambitions. Roma invicta!"
  SAU_aosiman_luoma_diguo: "Realizing Rome's ambitions"
  SAU_reintigrate_hispania: "Reintigrate Hispania"
  SAU_reintigrate_dacia: "Reintigrate Dacia"
  SAU_reintigrate_moesia: "Reintigrate Moesia"
  SAU_reintigrate_aegyptus: "Reintigrate Aegyptus"
  SAU_restore_mesopotamia: "Restore the province of Mesopotamia"
  SAU_reconquer_galatia_et_cappadocia: "Reconquer Galatia et Cappadocia"
  SAU_integrate_armenian_lands: "Integrate the Armenian Lands"
  SAU_restore_order_in_arabia_petra: "Restore order in Arabia Petra"
  SAU_restore_order_in_mauretania: "Restore order in Mauretania"
  SAU_return_to_pannonia: "Return to Pannonia"
  SAU_restore_roman_rule_to_raetia_et_noricum: "Restore Roman rule to Raetia et Noricum"
  SAU_restore_roman_rule_to_gaul: "Restore Roman rule to Gaul"
  SAU_restore_roman_rule_to_belgica: "Restore Roman rule to Belgica"
  SAU_occupy_iberia: "Occupy Iberia"
  SAU_return_to_britannia: "A Return to Britannia"
  SAU_conquer_hibernia: "Conquer Hibernia"
  SAU_conquer_caledonia: "Conquer Caledonia"
  SAU_avenge_teutoburg: "Avenge Teutoburg"
  SAU_reestablish_the_bosporan_kingdom: "Reestablish the Bosporan Kingdom"
  #######################################哈希姆##################################################
  SAU_haximu_alabo_zhiyuanjun: "Free Arab Legion"
  SAU_haximu_alabo_zhiyuanjun_desc: "Arabs from around the world have volunteered to fight the old powers that have held us back for decades. Perhaps we could build on this by recruiting troops from abroad to fight alongside our own forces against a common enemy."
  SAU_haximu_alabo_zhiyuanjun_decisions: "Recruit the Free Arab Legion in §Y[FROM.GetName]§!"
  #######################################伊赫万##################################################
  SAU_jinqi_beilue_duo: "Recently plundered"
  SAU_yihewan_lueduo: "Nomadic Force"
  SAU_yihewan_lueduo_desc: "The Ikhwan, or "Brotherhood," adheres to the strict rules of Islamic law. In response to Western colonialism, the Ikhwan seek to purify Islam and unite all Muslims under a single nation through their creed.\n\n"Our warriors rely on camels and scimitars, the same weapons the Prophet Muhammad used to conquer the world. Only those who fight with camels and scimitars are true Muslim warriors. Our enemies, however, can only rely on the dirty weapons provided by the infidels! God will be on our side!" ”
  SAU_yihewan_lueduo_zhouwei: "Plunder §Y[FROM.GetName]§!"
  country_beilueduo_flag: "Plundering"
  SAU_yihewan_lueduo_zhouwei_cost_cangaceiro: "£command_power §Y10§!"
  SAU_yihewan_lueduo_zhouwei_cost_cangaceiro_blocked: "§R£command_power 10§!"
  SAU_yihewan_jihade: "Jihad"
  SAU_yihewan_jihade_desc: "For a thousand years, the followers of Muhammad have waited; for a thousand years, they have longed for independence and freedom for all Arabs and Muslims; for a thousand years, they have suffered under the oppression of evil empires and armies; after a thousand years, our time has finally arrived..."
  SAU_zhengzhao_shengzhanshi: "Calling for the Holy Warriors"
  SAU_zhenli_yi_lailin: "Jihad against §Y[FROM.GetName]§!"
  SAU_zhenli_yi_lailin_desc: "Our sacred mission is to spread Islam throughout the world. May no one ever again tread the path of darkness, for we hold up the light of God!"
  SAU_xuwang_yi_huimie: "Jihad against §Y[FROM.GetName]§!"
  SAU_xuwang_yi_huimie_desc: "As long as paganism reigns in Europe, there will be no peace. The time has come for a new holy war. A new war machine roars in His name, ready to crush the infidels with righteous fury. Peace will never come until the judgment of scimitar and fire falls upon all unbelievers."
  zhengzai_jihade_flag: "launch Holy War"
