  SAU_gaijin_wuzhuang_liliang: "Military modernization"
  SAU_gaijin_wuzhuang_liliang_desc: "The [SAU.GetAdjective] is outdated in equipment, lacks well-trained soldiers, and is generally in poor condition. We must reform our military and transform the [SAU.GetAdjective] into a modern army capable of competing with the most technologically advanced militaries in the world. The time for modernization has arrived!"
