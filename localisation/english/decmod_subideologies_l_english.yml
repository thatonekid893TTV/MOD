l_english:
 agrarian_communism:0 "Agrarian Communism"
 agrarian_communism_desc:0 "'A revolution is not a dinner party.' - Mao Zedong \n\nAgrarian Communism goes against the Soviet Line of Communism with its focus on Heavy Industry and Urban development. Its main Appeal is in largely Peasant Societies, which some might consider to be backwaters, as it advacates first for the liberation of the Farmers and the liquidation of large Landholders, with the Workers being a second thought."
 military_communism:0 "Military Communism"
 military_communism_desc:0 "'Should there be a revolution, only God knows where it will end. I think that a constitutional regime would mean the end of Russia. We need a despot!' - Mikhail Tukhachevsky \n\nUnifying the Authoritarian Nature of military Juntas with at the ideals of Socialism, Military Communism represents a far more militaristic Variant of the Marxist Doctrine, hoping to bring about the World Revolution through any Force necessary."
 monarcho_communism:0 "Monarcho-Communism"
 monarcho_communism_desc:0 "'You should not be serving me.' - Emperor Aisin-Gioro 'Henry' Puyi I should be serving you.The Opposition to Monarchism, which often represents a key Part of the Socialist Ideology, is in the Case of Monarcho-Communism reversed, where instead, an almost absolute Monarch is crowned by elected Representatives instead of Religious Leaders to serve as a strong unifying Head of State whose royal Bloodline ensures continuing rule for Generations to come."
 esoteric_marxism:0 "Esoteric Communism"
 esoteric_marxism_desc:0 "'It is our duty to create for the young generation traditions of Culture; where there is Culture, there is Peace; there is achievement; there is the right solution for the difficult social problems.' - Nicholas Roerich \n\nEsoteric Communism combines the fringe and long lost Pagan Faiths with modern Marxist Theory, creating a bizare, less main stream, version of Religious Communism. This Fusion creates a rift between rightist esoteric Movements for their leftist economics and social policies as well as a with the Marxist-Leninist currents of the left do to their rejection of Materialism."
 syndicalism:0 "Syndicalism"
 syndicalism_desc:0 "'I feel that many of our critics are people who stayed at home in bed while we were doing the hard work of the strike.' - Elizabeth Gurley Flynn \n\nSyndicalism is a revolutionary Current that seeks to gain ownership over the means of production through industrial Action, organised by powerfull Trade Unions. Due to ideological differences with Anarchist as well as the 3rd Internationale, Syndicalism has lost much of it's political relevance, to revive it would take a miracle..."
 titoism:0 "Titoism"
 titoism_desc:0 "'None of our republics would be anything if we weren't all together, but we have to create our history.' - Josip Broz Tito \n\nTitoism describes a form of thought developped by the Yugoslav Communist Josip Broz, going by the alias Tito. The Ideology is in typical Balkan fashion a mixture of various previous forms of left wing Ideas, rejecting Stalinism and Anarchism alike, all the while allowing limited forms of capitalism."
 goulash_communism_ideology:0 "Goulash Communism"
 goulash_communism_ideology_desc:0 "'What kind of regime is it that doesn't have even a tiny little opposition, just for show? - János Kádár \n\n'Goulash Communism is the Nickname given to the specific branch of Socialism synthesized in Budapest, which is as the Hungarian National Dish of Goulash, a Mixture of various Ingreadients. Namely, the focus is on the Public Wellfare, more than the immeadiate construction of a Communist Society. This results in an immeadiate focus on Consumer Goods as well as a lifting of many authoritarian Policies."
 SOV_stalinism_desc:0 "'It is difficult for me to imagine what "personal liberty" is enjoyed by an unemployed person, who goes about hungry, and cannot find employment.' - Iosip V. Stalin \n\n$stalinism_desc$"
 old_bolshevism:0 "Bolshevism"
 old_bolshevism_desc:0 "'Without a revolutionary theory there can be no revolutionary movement. This cannot be insisted upon too strongly at a time when the fashionable preaching of opportunism is combined with absorption in the narrowest forms of practical activity.' - Vladimir Ilyich Lenin\n\nBolshevism is the Nickname given to the Ideology of the Radical Wing of the Russian Social Democratic Labour Party, the followers of Vladimir Lenin, which would go on to overthrow the Provisional Regime in Russia and end the eastern Front of the Great War. Advocating for a leftist Broad Coalition following the Teachings of Marx, Engels and Lenin while alienating the new Factions in Soviet Communist Theory as they seek to liberate the Global Proletariat. They are hated abroad, demonised by liberals, the bringers of Doom for fascists, despised Trotskyist for the Center, Rightists for Trotskyists and Stalinists for the Bukharinist Faction, and have thus almost entirely become Irrelevant."
 council_communism:0 "Council Communism"
 council_communism_desc:0 "'Marxism must abhor nothing so much as the possibility that it becomes congealed in its current form. It is at its best when butting heads in self-criticism, and in historical thunder and lightning, it retains its strength.' - Rosa Luxemburg\n\nCouncil Communism is a form of Marxist thought developped mainly in western and central Europe in response to centralisation of Power during the Bolshevik Revolution.\nThe Ideology rejects authoritarian Political Practices, while still holding on to the ideals of Planned Economy, instead basing the political apparatus on Worker's, Peasant's and Soldier's Councils, unintentionally leading to political participation being tied to employment.\nWhile common ground with Syndicalists would be expected as they share many principles as well as enemies, the Council Communists adheere to the clasical Engelsian rejection of Anarchism, as seen in 'On Authority', advocating for a strong state with a powerfull army to protect the Socialist Project."
 communist_thalassocracy:0 "Communist Thalassocracy"
 communist_thalassocracy_desc:0 "'Circumstances rule men; men do not rule circumstances.' - Herodotus of Halicarnassus \n\nCommunist Thalassocracy refers to a variation of the idea of a primarly Maritime State which is both economically as well as socially egalitarian in Nature, placing it's centers of Power either close to or on Bodies of Water while neglecting the Hinterland. Such Ideas are mainly praticed in regions with many islands or rivers, or advocated for by Sailors and Officers of the Red Navy."
 #
 esoteric_fascism:0 "Esoteric Fascism"
 esoteric_fascism_desc:0 "'Men willingly believe what they wish to be true.' - Gaius Iulius Caesar \n\nEsoteric Fascism is a varied school of thought existing in the fringes of many radical right-wing Movements, constructing a view of the World based on National Myths and a strong call to return to an idealised  and imagined, usualy agrarian, Past, all the while resurecting long forgotten Pagan Faiths. Though Believers strongly reject modern Society in rhetoric, if a King Tiger helps them acomplish their twisted goals, so be it."
 national_syndicalism:0 "National Syndicalism"
 national_syndicalism_desc:0 "$fascism_ideology_desc$"
 imperial_cult:0 "Imperial Cult"
 imperial_cult_desc:0 "'Degenerates like you belong on a Cross' - Vulpes Inculta \n\nThe Imperial Cult is the State Religion and Ideology of the Roman Empire and has been revived by the crazed Dictators ambition to restore what we left behind. In Practice, the modern Cult is a fusion of Mussolonite Fascism and a religious obsession with the Greco-Roman Gods as a replacement for the Abrahamic Faiths, which Imperial Cultists see as 'Degenerate'."
 ultra_nationalism:0 "Ultra Nationalism"
 ultra_nationalism_desc:0 "'Preventive war is like committing suicide for fear of death.' - Otto Von Bismark \n\nUltra Nationalism follows many of the corporatist, militarist and nationalistic Ideals pursued by the Fascists in Rome and Berlin, but is unwilling to establish a fully fascistic Government and follow through on the various Irredentist claims that usually come out of the Far-right. While they will often colaborate with foreign Fascist Powers, should it become necessary, is willing to throw their ideological Brother in Arms under the Bus to save themselves."
 showa_nationalism:0 "Shōwa Nationalism"
 showa_nationalism_desc:0 "'The fruits of victory are tumbling into our mouths too quickly.' - Emperor Hirohito \n\nShōwa Nationalism follows many of the corporatist, militarist and nationalistic Ideals pursued by the Fascists in Rome and Berlin, but is unwilling to establish a fully fascistic Government, prefering instead to use and abuse the rhetoric of Pan-Asianism. While they will often colaborate with foreign Fascist Powers, should it become necessary, is willing to throw their ideological Brother in Arms under the Bus if it means saving His Imperial Majesty and the Empire."
 managed_democracy:0 "Managed Democracy"
 managed_democracy_desc:0 "'Managed Democracy is a Cornerstone of advanced Civilisation'\n\nManaged Democracy is a system of Governance that utilises the Rhetoric and Imagery of Democracy, Liberty and Freedom all the while subjecting it's Citizens to strict controll through a strong National Security State, strict Militarism and very exploitative Labor Contracts. The Propaganda Apparatus is the actual Cornerstone of such a System."
 #
 clerical_fascism_neutrality:0 "Clerical Fascism"
 clerical_fascism_neutrality_desc:0 "Clerical Fascism represents a deeply religious and faith-driven branch of the far right, usually popular in countries where the church still holds much influence over the matters of state. In comparisson to the german or italian schools of thought, the leader holds a far less important role, and while cults of personality are very much commonplace, the movement sees itself as fullfilling divine Will instead."
 bonapartism:0 "Bonapartism"
 bonapartism_desc:0 "'The true character of man ever displays itself in great events.' - Napoleon Bonaparte \n\nBonapartism refers to an Ideology coined by the former French Emperor Napoleon, where a strong central figure consolidates the powers of the State in their hands, while not being affiliated with any of the major political Movements, but courting the support of all by making token concessions."