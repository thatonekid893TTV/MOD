 scwoffensivenote.43.t:0 "Fall of Madrid"
 scwoffensivenote.43.d:0 "Reports are flooding in that the Nationalist have taken control of the Spanish capital, following extended battles across the city's main suburbs and city centre. \n\n"
 scwoffensivenote.43.a:0 "Fantastic news."
 scwoffensivenote.43.b:0 "Great news."
 scwoffensivenote.43.c:0 "Awful news."
 scwoffensivenote.43.e:0 "Bitter news."
 scwoffensivenote.43.f:0 "Disappointing."
 scwoffensivenote.46.t:0 "Fall of Barcelona"
 scwoffensivenote.46.d:0 "The latge city of Barcelona, capital of the Catalonia region, has fallen to Nationalist forces. Reports of fighting have begun to die down. \n\nWhatever this may mean for the future autonomy of the Catalonian regions, this is a massive victory for anti-Republican forces."
 scwoffensivenote.46.a:0 "Fantastic news."
 scwoffensivenote.46.b:0 "Great news."
 scwoffensivenote.46.c:0 "Awful news."
 scwoffensivenote.46.e:0 "Bitter news."
 scwoffensivenote.46.f:0 "Disappointing."
 scwoffensivenote.49.t:0 "Fall of Asturias"
 scwoffensivenote.49.d:0 "Reports have been verified that the Nationalists are now in control of Asturias. The former centre of Spanish workers' resistance fell after significant gains were made by the Guardia Civil, backed by well supplied shock troops in the Nationalist army. \n\nRumours of repression cannot yet be corroborated."
 scwoffensivenote.49.a:0 "Fantastic news."
 scwoffensivenote.49.b:0 "Great news."
 scwoffensivenote.49.c:0 "Awful news."
 scwoffensivenote.49.e:0 "Bitter news."
 scwoffensivenote.49.f:0 "Disappointing."
 scwoffensivenote.52.t:0 "Fall of Valencia"
 scwoffensivenote.52.d:0 "Following vicious fighting, the major Spanish city of Valencia has just fallen to the Nationalists. \n\nAs the sound of gunfire and canonfire wanes, and normality returns, the people of the region are waking up to the new reality under this new order brought by the Nationalist camp. \n\nAlready, the use of regional languages, such as Catalan, has been restricted in public places."
 scwoffensivenote.52.a:0 "Fantastic news."
 scwoffensivenote.52.b:0 "Great news."
 scwoffensivenote.52.c:0 "Awful news."
 scwoffensivenote.52.e:0 "Bitter news."
 scwoffensivenote.52.f:0 "Disappointing."
 scwoffensivenote.55.t:0 "Fall of Bilbao"
 scwoffensivenote.55.d:0 "The northern city of Bilbao has just been captured, as the Nationalist make significant advances in the Basque region. \n\nLocal people have been split between loyalist Republicans hoping for greater autonomy and Catholic traditionalists supporting the Nationalists. \n\nCurrent developments however may have solved this dilemma for now."
 scwoffensivenote.55.a:0 "Fantastic news."
 scwoffensivenote.55.b:0 "Great news."
 scwoffensivenote.55.c:0 "Awful news."
 scwoffensivenote.55.e:0 "Bitter news."
 scwoffensivenote.55.f:0 "Disappointing."
 scwoffensivenote.58.t:0 "Fall of Seville"
 scwoffensivenote.58.d:0 "The southern Spanish city of Seville has fallen to Nationalist forces, according to local reports. This is a large blow to the Rebublic as it provides their enemies a clear path and connection northwards."
 scwoffensivenote.58.a:0 "Fantastic news."
 scwoffensivenote.58.b:0 "Great news."
 scwoffensivenote.58.c:0 "Awful news."
 scwoffensivenote.58.e:0 "Bitter news."
 scwoffensivenote.58.f:0 "Disappointing."
 scwoffensivenote.61.t:0 "Fall of Seville"
 scwoffensivenote.61.d:0 "The southern Spanish city of Seville has fallen to Republican forces, according to local reports. This is a large blow to the Nationalist uprising  as it cuts off their connection southwards."
 scwoffensivenote.61.a:0 "Disastrous news."
 scwoffensivenote.61.b:0 "Terrible news."
 scwoffensivenote.61.c:0 "Tremendous news."
 scwoffensivenote.61.e:0 "Wonderful news."
 scwoffensivenote.61.f:0 "Fantastic."
 scwoffensivenote.64.t:0 "Fall of Burgos"
 scwoffensivenote.64.d:0 "The southern Spanish city of Burgos has fallen to Republican forces, according to local reports. Burgos has been a political centre for the Nationalists since the beginning of the civil war. \n\nDefeat here is a significant setback to the military uprising."
 scwoffensivenote.64.a:0 "Disastrous news."
 scwoffensivenote.64.b:0 "Terrible news."
 scwoffensivenote.64.c:0 "Tremendous news."
 scwoffensivenote.64.e:0 "Wonderful news."
 scwoffensivenote.64.f:0 "Fantastic."
 scwoffensivenote.65.t:0 "Frontlines Solidify in Spain"
 scwoffensivenote.65.d:0 "After a period of large scale movement in the opening phases of this war, both sides have dug in. Much of Spain now resembles a 'collection of hilltop fortresses, each garrisoned by angry men with rifles, shouting insults at the occupants of the next fortress across the valley'. \n\nFor now, if we do wish to make progress on any front here, we must wait for the word of our allies, who will inform us once the preparations are complete for a full offensive in any region of Spain. \n\nIt is their war, after all."
 scwoffensivenote.65.a:0 "Acknowledged. We must wait for their word."