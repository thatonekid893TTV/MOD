 spanishvanillaplus.1.t:0 "'No Pasaran' Speech Airs"
 spanishvanillaplus.1.d:0 "On Madrid Radio, Communist Party leader Dolores Ibarruri, nicknamed 'La Pasionaria' for her oratory skills, has given a rousing speech, exhorting her countrymen to unite to defend the Republic as news arrives of the military uprising. \n\nIn the course of the speech, she first denounces the insurrectionists as the 'hangmen of October' (referring to the crushing of the 1934 Asturias miners strike) who 'drag through the mud the very same honourable military tradition that they have boasted to possess'. \n\n'The whole country cringes in indignation at these heartless barbarians that would hurl our democratic Spain back down into an abyss of terror and death. However, THEY SHALL NOT PASS! For all of Spain now presents itself for battle.' \n\n'Let no one hesitate! All stand ready for action. All workers, all antifascists must now look upon each other as brothers in arms.' \n\n'Peoples of Catalonia, the Basque Country, and Galicia! All Spaniards! Defend our democratic Republic and consolidate the victory achieved by our people on the 16th of February.'   \n\n'The Communist Party calls you to arms. We especially call upon you, workers, farmers and intellectuals to assume your positions in the fight to decisively smash the enemies of the Republic and of people's freedoms.' \n\n'Long live the Popular Front! Long live the union of all anti-fascists! Long live the Republic of the people!' \n'The Fascists shall not pass! THEY SHALL NOT PASS!' "
 spanishvanillaplus.1.a:0 "¡No pasarán!"
 spanishvanillaplus.2.t:0 "'No Pasaran' Speech Airs"
 spanishvanillaplus.2.d:0 "On Madrid Radio, Communist Party leader Dolores Ibarruri, nicknamed 'La Pasionaria' for her oratory skills, has given a rousing speech, exhorting her countrymen to unite to defend the Republic as news arrives of the military uprising. \n\nIn the course of the speech, she first denounces the insurrectionists as the 'hangmen of October' (referring to the crushing of the 1934 Asturias miners strike) who 'drag through the mud the very same honourable military tradition that they have boasted to possess'. \n\n'The whole country cringes in indignation at these heartless barbarians that would hurl our democratic Spain back down into an abyss of terror and death. However, THEY SHALL NOT PASS! For all of Spain now presents itself for battle.' \n\n'Let no one hesitate! All stand ready for action. All workers, all antifascists must now look upon each other as brothers in arms.' \n\n'Peoples of Catalonia, the Basque Country, and Galicia! All Spaniards! Defend our democratic Republic and consolidate the victory achieved by our people on the 16th of February.'   \n\n'The Communist Party calls you to arms. We especially call upon you, workers, farmers and intellectuals to assume your positions in the fight to decisively smash the enemies of the Republic and of people's freedoms.' \n\n'Long live the Popular Front! Long live the union of all anti-fascists! Long live the Republic of the people!' \n'The Fascists shall not pass! THEY SHALL NOT PASS!' "
 spanishvanillaplus.2.a:0 "Let the witch wail."  
 spanishvanillaplus.3.t:0 "The White Terror"
 spanishvanillaplus.3.d:0 "As our troops gain ground across Spain, our forces have begun a campaign of repression and executions aimed at subversive elements and those previously loyal to the Republic. \n\nThis brutal crackdown is distasteful to some but seen as necessary by many. General Mola has put it simply, that 'it is imperative to spread an atmosphere of terror, in order to create an impression of mastery.' \n\nWhichever way one looks at it, there is now quiet in the areas we control, after years of chaos under the Republic."
 spanishvanillaplus.3.a:0 "Dead reds and traitors. Nothing to see here."
 spanishvanillaplus.4.t:0 "Nationalist White Terror"
 spanishvanillaplus.4.d:0 "According to many refugees escaping the Nationalist zone, wherever the Nationalists advance, they seem to launch major crackdowns, arresting all those pointed out by their neighbours to either be loyal to the Republic, or aligned with this or that left-wing or moderate group. \n\nThose arrested are usually marched out to the remote areas and summarily shot. \n\nThe actual number of mass executions and imprisonments we can only guess."
 spanishvanillaplus.4.a:0 "We must overcome this fascist menace!"
 spanishvanillaplus.5.t:0 "White Terror Continues"
 spanishvanillaplus.5.d:0 "As the Crusade to liberate Spain continues, so does the struggle to purge it of the years-long red influence that has led to this war in the first place. \n\nThose who have resisted by firing on our troops are given no quarter, even when they attempt to hide among civilians once towns are taken. \n\nOthers who we have identified as red sympathisers, or have been identified as such with the help of their neighbours, are detained and dealt with through a swift process. \n\nThis is a battle for the heart and soul of our country that we must have win, and that they must lose."
 spanishvanillaplus.5.a:0 "A la cárcel o al paredón, lo mismo da."
 spanishvanillaplus.6.t:0 "Nationalist White Terror Continues"
 spanishvanillaplus.6.d:0 "More news keeps arriving of Nationalist forces continuing their brutal crackdown against individuals and groups aligned with the Republic. \n\nReports of mass executions and terror tactics are still flooding in: shootings of prisoners on the spot, disappearances of individuals aligned with left-wing movements or simply sympathetic to the republic... the list goes on."
 spanishvanillaplus.6.a:0 "The horror continues!"
 spanishvanillaplus.7.t:0 "White Terror Expands"
 spanishvanillaplus.7.d:0 "Our forces and local authorities has continued the task of pacifiying the areas under our control, both to consolidate recent victories as well as shape society as we hope to see it down the years. \n\nThough retribution against the murderous devils we face plays a part in the repressions, Spain is also to return to the state it was in before foreign, alien ideologies sowed the chaos the country now finds itself in. \n\nAs General Juan Yagüe has said: '"We will redeem those on the other side, impose on them our version of civilisation, on those who don't want it now, by hook or by crook'."
 spanishvanillaplus.7.a:0 "Our struggle for Spain continues."
 spanishvanillaplus.8.t:0 "Nationalist White Terror Expands"
 spanishvanillaplus.8.d:0 "Throughout Spain, a new atmosphere has filled the air, as the dire picture of what awaits those supportive of the Republic if they fall into the hands of the Nationalists. \n\nOutside of Republican fighters usually being shot rather than taken captured, a purge usually ensues in the Nationalist-held areas. Those arrested can be held for a long period of time, but many are usually taken at night to remote areas and shot. A note of 'delito: rojo' suffices as last mention in many prison registrars. \n\nHowever, these acts have not been confined to only public figures or politically active individuals. A recent controversy has arisen surrounding the fate of playwright Federico García Lorca, who was reportedly arrested and never heard from again. English writer H. H. Wells, speaking on behalf of his association of writers, has demanded to know where he is, to a shrug from the Nationalist side."
 spanishvanillaplus.8.a:0 "This madness must be stopped!" 
 spanishvanillaplus.9.t:0 "The Red Terror"
 spanishvanillaplus.9.d:0 "With the initial general confusion, with passions ignited by the conflict, and as news has arrived of Nationalist atrocities, waves of reports of excesses from those claiming to act on the side of the Republic have come in. \n\nThroughout the Republican zone, there have been summary arrests of individuals accused of acting as a third column for the Nationalists: Conservative CEDA and Falange members, Catholic clergy and on occasion, simply people who have bad blood with local anarchists. In certain frontline regions, some prisons have been emptied with all suspects summarily executed by mobs. A particularly grim case surrounds and as the iIn response to the Nationalist threat, the forces and militias aligned with the Republic have initiated their own campaign of executions and terror against perceived enemies. \n\nBrutal acts against supposed Nationalist sympathisers are justified by some on our side."
 spanishvanillaplus.9.a:0 "There may be little we can do at this stage."
 spanishvanillaplus.10.t:0 "Republican Red Terror"
 spanishvanillaplus.10.d:0 "Republican militias have launched brutal acts against their political opponents and the Church. expedited trials of accused sympathisers marked by mob justice, Reports of mass executions and persecution are flooding in." 
 spanishvanillaplus.10.a:0 "They will be avenged. Spain will emerge victorious."
 spanishvanillaplus.11.t:0 "Red Terror Continues"
 spanishvanillaplus.11.d:0 "The forces and militias aligned with the Republic continue their campaign of executions and terror against perceived enemies. \n\nBrutal acts against supposed Nationalist sympathisers are justified by some on our side."
 spanishvanillaplus.11.a:0 "Oh dear."
 spanishvanillaplus.12.t:0 "Republican Red Terror Continues"
 spanishvanillaplus.12.d:0 "Republican militias continue their brutal acts against their political opponents and the Church. Reports of mass executions and persecution are still flooding in."
 spanishvanillaplus.12.a:0 "The bloodshed continues, but we will prevail."
 spanishvanillaplus.13.t:0 "Red Terror Expands"
 spanishvanillaplus.13.d:0 "The forces and militias aligned with the Republic expand their campaign of executions and terror against perceived enemies. \n\nBrutal acts against supposed Nationalist sympathisers are justified by some on our side."
 spanishvanillaplus.13.a:0 "We have bigger issues to deal with."
 spanishvanillaplus.14.t:0 "Republican Red Terror Expands"
 spanishvanillaplus.14.d:0 "Republican militias expand their brutal acts against their political opponents and the Church. Reports of mass executions and persecution are continuing."
 spanishvanillaplus.14.a:0 "This madness must be stopped!"
 spanishvanillaplus.15.t:0 "Bombing of Guernica"
 spanishvanillaplus.15.d:0 "The serene town of Guernica, a symbol of Basque culture and identity, has been bombed during the ongoing Spanish Civil War by planes affiliated with the Nationalist side. \n\nThe aerial bombardment was relentless and indiscriminate, targeting civilians and infrastructure alike. \nThe attack, lasting over three hours, left the historic town in ruins, with the majority of its buildings destroyed or severely damaged. \n\nThe international outcry has been immense, as reports of the tragedy spread across the world, highlighting the horrors of modern warfare."
 spanishvanillaplus.15.a:0 "Tragic."
 spanishvanillaplus.15.b:0 "Fascist barbarians!"
 spanishvanillaplus.15.c:0 "A sad mistake."
 spanishvanillaplus.16.t:0 "Nationalist Forces enter Madrid"
 spanishvanillaplus.16.d:0 "The Nationalists have taken Madrid after a long period of fighting. \nVictorious troops marched through the streets with the jibe 'Hemos Pasado!' (We have passed) as a reply to the famous slogan by the Republican side. The war may very well be close to the end."
 spanishvanillaplus.16.a:0 "¡Hemos pasado!"
 spanishvanillaplus.17.t:0 "Nationalist Forces enter Madrid"
 spanishvanillaplus.17.d:0 "The Nationalists have taken Madrid after a long period of fighting. \nVictorious troops marched through the streets with the jibe 'Hemos Pasado!' (We have passed) as a reply to the famous slogan by the Republican side. The war may very well be close to the end."
 spanishvanillaplus.17.a:0 "Catastrophic."
 spanishvanillaplus.18.t:0 "Operation Rügen: Guernica Bombed"
 spanishvanillaplus.18.d:0 "German air forces hit Republican positions near the town of Guernica in the Northern Basque country, as part of operations targeting enemy logistics and infrastructure. \n\nWhile it is believed the targets in the area were legitimate, as the town was a known enemy communication hub, our bombs hit several houses and civic buildings near the town square. \n\nThe strikes resulted in several hundred casualties among local civilians, according to enemy reports. \nWhile we may strive to be more careful going forward, the damage has already been done."
 spanishvanillaplus.18.a:0 "Very unfortunate for our cause here."
 spanishvanillaplus.19.t:0 "Spanish Civil War: German Aid Sought"
 spanishvanillaplus.19.d:0 "Civil war has broken out in Spain as the brittle Republic has now come fully undone. \n\nIt may however be in our interest to not stay on the sidelines, as it becomes increasingly clear that anarchic elements may take advantage of the situation, potentially providing the Bolshevists a base in the Iberian peninsula and giving them control of the Gibraltar straits. \n\nFurthermore, the generals leading the rebellion may be reliable allies in the future as the Reich changes the balance of power in Europe. \n\nOur contacts close to their leadership indicate that aid is being sought. Our Luftwaffe's planes and a couple of divisions would certainly be welcome. \n\nEither way, we must act fast if we are to make a difference here."
 spanishvanillaplus.19.a:0 "We must take action." 
 spanishvanillaplus.20.t:0 "German intervention in the Spanish Civil War"
 spanishvanillaplus.20.d:0 "Our first set of units have joined the war, to much fanfare and relief on the part of the Nationalists. \n\nThere are indications that German exiles, notably Communists and Jews, have also joined various units on the Republican side. \n\nWe will definitely have our work cut out for us."
 spanishvanillaplus.20.a:0 "A friend in need...." 
 spanishvanillaplus.21.t:0 "Legion Condor"
 spanishvanillaplus.21.d:0 "We have decided to drastically upscale our involvement in the Spanish war. Substantial resources and manpower will go to aid the Nationalist forces to defeat the Republic and the red bonzes behind it, and bring order to Spain. \n\nThe German contingent, officially defined as volunteers, will increase into the many thousands as more pilots, air crews, logistics personnel, as well as some ground forces, join the struggle. \n\nThe additional airpower brought by more fighter and bomber squadrons will be a key contribution that the Reich particularly can bring, especially to counter the resources that the Republicans may be receiving from other parties."
 spanishvanillaplus.21.a:0 "The Reds shall not rest." 
 spanishvanillaplus.22.t:0 "Bombing of Durango"
 spanishvanillaplus.22.d:0 "During operations conducted against Republican targets in the Basque country, our planes hit the town of Durango. \n\nInitial reports say that bombs were dropped on several civilian buildings, including 2 churches, unadvertantly killing over one hundred people. \n\nThe Nationalists are keen to blame the deaths of the Republicans, shielding us from direct responsibility."
 spanishvanillaplus.22.a:0 "Very unfortunate for our cause here."
 spanishvanillaplus.23.t:0 "Bombing of Durango"
 spanishvanillaplus.23.d:0 "Italian planes hit the town of Durango in the Basque country, killing 300 people. \n\nOstensibly targeting military infrastructure, the bombs fell on the town of ten thousand inhabitants, destroying numerous houses and two churches. \n\nThe Nationalists have denied this recounting of events, saying the planes were targetting military positions, and blamed the deaths and destruction on communist bands fighting for the Republicans."  
 spanishvanillaplus.23.a:0 "An unforgivable fascist crime."
 spanishvanillaplus.23.b:0 "An unfortunate event in the struggle to save Spain."
 spanishvanillaplus.24.t:0 "Deaths of Romanian volunteers"
 spanishvanillaplus.24.d:0 "We have received word that two Romanian members of the Iron Guard who were fighting on our side, have fallen for God and Spain in battles near Madrid. \n\nTheir bodies are to be repatriated with full due honours."
 spanishvanillaplus.24.a:0 "Heroes." 
 spanishvanillaplus.25.t:0 "Funerals of Ion Motsa and Vasile Marin"
 spanishvanillaplus.25.d:0 "Two Romanian nationals, Ion Motsa and Vasile Marin, both members of the Iron Guard, were killed while fighting for the Nationalists during a battle near Madrid. \n\nTheir bodies were repatriated with massive pomp, with the mortuary train stopping in Berlin, then arriving in Romania through Poland. It then made stops across large parts of the country, through Bukovina, Transylvania, Oltenia, and Wallachia where the bodies attracted thousands of mourners taking part in religious services for the two, who have come to be seen as martyrs for the Christian cause in Spain against the communism. \n\nWhen the train finally arrived in Bucharest, one of the largest funerals in recent Romanian took place with thousands of Iron Guard Legionnaires and additional tens of thousands of sympathisers attended the march to Moța and Marin's final rest place. \n\nOpponents of the Iron Guard fear that these events may lead to an upswell in support for the movement."
 spanishvanillaplus.25.a:0 "Odihnească-se în pace."
 spanishvanillaplus.26.t:0 "Italian fascist allies in Spain"
 spanishvanillaplus.26.d:0 "The Italians are as keen as we are to help the Nationalists prevent a Red takeover of Spain. They have accordingly sent several divisions of blackshirt volunteers, known as the Corpo Truppe Volontarie, as well as an air expeditionary corps, the 'Aviazione Legionaria'. \n\nThis is a promising beginning of a long-enduring new partnership between the Reich and the Kingdom of Italy."
 spanishvanillaplus.26.a:0 "Welcome allies." 
 spanishvanillaplus.27.t:0 "German allies in Spain"
 spanishvanillaplus.27.d:0 "Nazi Germany has joined the struggle in Spain against the communists of the Republic, sending aid to the Nationalists. \n\nA large contingent of planes and personnel have been sent, as part of their 'Condor Legion', to provide tactical support to Nationalist offensives across Spain. \n\nThe Reds will not stand a chance against our two rising European powers, and will be exposed as the failures that they are on the battlefield. \n\nThis furthermore bodes well for future cooperation between our country and the Reich."
 spanishvanillaplus.27.a:0 "Welcome allies." 
 spanishvanillaplus.28.t:0 "O'Duffy's Irish Brigade"
 spanishvanillaplus.28.d:0 "Not all allies are made equal. \n\nA brigade of some 700 men arrived from the Catholic nation of Ireland, hoping to aid our cause, eager to defend Christian Spain against the red menace. \n\nNevertheless, most were these men were poorly trained, beholden to excessive drinking, and generally unable to follow the orders they were given. \n\nFollowing a particularly bad friendly fire incident, which killed 2 Irishmen and 9 of our men, the decision was taken to dissolve the brigade entirely."
 spanishvanillaplus.28.a:0 "An unimpressive band. What a waste of time."  
 spanishvanillaplus.29.t:0 "Irish Fascists in Spain"
 spanishvanillaplus.29.d:0 "Eoin O'Duffy, leader of the fascist Blueshirts in Ireland, had sent 700 men to fight for the Nationalists in the Spanish Civil War. \n\nThey have returned with very mixed success, after the Nationalist camp kicked them out for disorderly conduct."
 spanishvanillaplus.29.a:0 "Incompetents."
 spanishvanillaplus.31.t:0 "Bombing of Madrid"
 spanishvanillaplus.31.d:0 "Planes aligned with Nationalist side have bombed the Spanish capital, leaving unparalleled death and destruction in their wake. \n\nPropagandists on the Republican side have started publishing pictures of the devastation and its victims on posters and in newspapers as the 'products of fascism'. \n\nThough international observers say this heralds a new age of destruction surpassing conventional battle lines, any descriptions will leave cold any of those taking shelter for their lives in Madrid and elsewhere."
 spanishvanillaplus.31.a:0 "The terrifying results of modern warfare."
 spanishvanillaplus.31.b:0 "Terrifying."
 spanishvanillaplus.31.c:0 "These criminal acts will not go unanswered."
 spanishvanillaplus.31.e:0 "Fascist monsters dropping death from the sky." 
 spanishvanillaplus.31.f:0 "Terrifying."
 spanishvanillaplus.32.t:0 "Battle of Madrid"
 spanishvanillaplus.32.d:0 "Our forces have started to move on the capital of Madrid. \n\nWe expect to face stiff resistance, both from our own reds, but also from all sorts of communist and anarchist fanatics from abroad who have made a nest out of our proud capital to further stir up trouble. \n\nTaking back Madrid will not be straightforward as many areas in its urban environment have been fortified to hinder our advances. But none of this will stop us."  
 spanishvanillaplus.32.a:0 "Viva la muerte." 
 spanishvanillaplus.34.t:0 "Siege of Madrid"
 spanishvanillaplus.34.d:0 "As Nationalist forces make advances in the rest of Spain, Republican-held Madrid is gearing up for the long haul, as the Republican government evacuates to Valencia.  \n\nBarricades and sandbag trenches have been set up in and on the outskirts of the city, making full use of geographical barriers such as the river Manzares. The Madrid metro now serves a secondary roll as a system of bomb shelters. \n\nCommunist and non-communist volunteer militias have been mobilized, transforming the Ciudad Universitaria into a veritable fortress. \n\nPropaganda banners and posters have become daily fixtures in the city streets in the face of increasing shortages and threats. \n\nThere are great challenges ahead for the people of Madrid, but the city will not be given up by the Republic without a fight."
 spanishvanillaplus.34.a:0 "We will dislodge them eventually."
 spanishvanillaplus.34.b:0 "The red nest is in our crosshairs."
 spanishvanillaplus.34.c:0 "Madrid will hold."
 spanishvanillaplus.34.e:0 "The frontline of free people everywhere."
 spanishvanillaplus.34.f:0 "Madrid must hold."
 spanishvanillaplus.35.t:0 "Red Terror in Spain"
 spanishvanillaplus.35.d:0 "In the Republican zone, reports have accumulated for a while of increasing repression against suspected enemies of the Republic. \n\nFirst and foremost, religious Catholics and the clergy have been murdered in large numbers. Priests killed, nuns kidnapped and imprisoned, churches ramsacked and desecrated, monastery crypts forced open and dead corpses put outside on display. \n\nCommunist and anarchist bands have also rounded up suspected sympathisers of our cause: traditionalists, religious people, CEDA members, anti-communists and the like. Some now joined only by a last mention of their fate of 'entregado al comité' on public registers. \n\nWhether these acts are done with official sanction or not, is of little relevance to the dead."
 spanishvanillaplus.35.a:0 "Revolting acts by these savage reds."
 spanishvanillaplus.35.b:0 "These vile atrocities will not go unpunished."
 spanishvanillaplus.36.t:0 "White Terror in Spain"
 spanishvanillaplus.36.d:0 "Rumours of atrocities in the Nationalist-held zone have accumulated throughout the war, and made it into the foreign press. \n\nIn each town taken over, supporters, real and suspected, of the Republic or of left wing groups have been rounded up and shot in remote places. No city or town is being spared from these excesses, as the Nationalists continue their so-called 'Crusade' against all dissenting and non-traditional forces in Spain. \n\nAs the list of murdered and 'disappeared' intellectuals, liberals, socialists and other political activists increase, other reports have come in of sexual violence and forces labour in the Nationalist zone."
 spanishvanillaplus.36.a:0 "We will stop these killers and bring them to justice."
 spanishvanillaplus.36.b:0 "The vile handywork of fascist reactionaries. They will be avenged."
 spanishvanillaplus.36.c:0 "Ghastly."
 spanishvanillaplus.37.t:0 "Spanish Civil War: Italian Aid Sought"
 spanishvanillaplus.37.d:0 "Civil war has broken out in Spain. The pathetic Republic that was already beset by political divides has now had split in two. \n\nFascist Italy clearly sympathises with the Nationalist, who have risen up to overthrow this corrupt system, and bring in one closer to our ideals.  \n\nDespite the likely cost in lives and resources, it may be in our interest to not stay on the sidelines, given the real risk of anarchic elements and communists taking advantage of the situation, potentially providing the Bolshevists a base in the Iberian peninsula. \n\nFurthermore, the generals leading the rebellion may prove themselves as reliable allies in the future. Our contacts close to the Nationalist leadership indicate that they are seeking our aid. Some planes and a couple of divisions would certainly be welcome relief. \n\nEither way, time is of the essence if we wish to influence events on the ground."
 spanishvanillaplus.37.a:0 "We must take action."
 spanishvanillaplus.38.t:0 "Italian intervention in the Spanish Civil War"
 spanishvanillaplus.38.d:0 "Italian units have joined the war in Spain. \n\nAnswering the call to arms by our Mediterranean neighbour, the first set of units were greeted with much fanfare by the Nationalists and their supporters. Morale is high among these Italian volunteers who are fully resolved to save Christian Spain from the red bandits that threaten her.  \n\nThere are also indications that some Italian exiles, mostly Communists, have also joined various units on the Republican side. \n\nOur blackshirts brigades and air forces will be fully be engaged to support the Spanish Nationalists, while hopefully breaking new ground for our ideology abroad."
 spanishvanillaplus.38.a:0 "A friend in need...." 
 spanishvanillaplus.39.t:0 "Corpo Truppe Volontarie"
 spanishvanillaplus.39.d:0 "The Italian contingent in the war has received the needed funding and support to make an even larger difference. \n\nAn expeditionary ground force in the form of the Corpo Truppe Voluntarie can now be sent, bolstered by more air units from the Aviazione Legionaria ('Legionary Air Force'). \n\nThe news from Spain has attracted a large number of volunteers amongst our blackshirts to both defend 'Christian Spain' and to hopefully spread fascist ideology abroad. The Italian press are hailing those going as the pride of the Kingdom."
 spanishvanillaplus.39.a:0 "The combined arms of Fascism shall liberate Spain."
 spanishvanillaplus.40.t:0 "Portuguese 'Viriatos' enter Spain"
 spanishvanillaplus.40.d:0 "Joining this war has been a fairly straightforward affair: the Portuguese press has called for volunteers to join units, and the prospect of defending the Iberian peninsula against the communist menace, following years of bad press for the Spanish government, has not lost its appeal. \n\nThose taking up a rifle and crossing the border to join have been dubbed 'Viriatos' in our press, named after the Lusitanian leader fighting the invading Romans. \n\nOfficially, these men are volunteers to provide plausible deniability, as weapons and supplies join them across the border."
 spanishvanillaplus.40.a:0 "A friend in need...." 
 spanishvanillaplus.41.t:0 "Portuguese Volunteers in Spain"
 spanishvanillaplus.41.d:0 "Volunteers have arrived from Portugal to support the Nationalist cause against the Republic. \n\nOstensibly to save 'Christian Spain', these men have been called the 'Viriatos' and arrived in a number of armed waves across the Portuguese border. \n\nPortugal's government is no doubt also interested in seeing a friendly government arise in Spain after years of strained relations with the Spanish Republic. \n\nThis war seemingly continues to taking on larger regional, even international, dimensions."
 spanishvanillaplus.41.a:0 "And the Portuguese join the Crusade."
 spanishvanillaplus.41.b:0 "And the Portuguese join the Crusade."
 spanishvanillaplus.41.c:0 "A neighbouring country supporting potential allies."
 spanishvanillaplus.42.t:0 "Picasso Painting at Paris Expo"
 spanishvanillaplus.42.d:0 "Artist Pablo Picasso has just unveiled his new art piece at the Spanish Pavilion of the Paris International Exposition. \n\nTitled 'Guernica', the large oil painting has attracted a large amount of attention: In cubic and surrealist style, it depicts the bombing of the Basque town of Guernica, showing the forms of gored animals, dead children, houses on fire and a dismembered soldier. \n\nThe wide acclaim that the painting has received has also spread knowledge of the depicted war in Spain, and further tours to show off the painting elsewhere are planned." 
 spanishvanillaplus.42.a:0 "Iconic." 
 spanishvanillaplus.42.b:0 "We have no interest in these circles." 
 spanishvanillaplus.42.c:0 "Ugly trash." 
 spanishvanillaplus.44.t:0 "Spanish Refugee Crisis"
 spanishvanillaplus.44.d:0 "As the Nationalist forces advance and the Spanish Civil War inches towards some conclusion, hundreds of thousands of Spanish refugees, including many who fear persecution under Nationalist rule, have rushed to leave the country by any means available. \n\nFrench authorities have created dozens of makeshift camps to deal with the countless men, women and children who have fled across the Pyrenees. \n\nAs these desperate people face an uncertain future and the choice of either an unwelcome exile abroad or possible repression at home, the fate of the Spanish Republic seems all but sealed." 
 spanishvanillaplus.44.a:0 "Unfortunate."
 spanishvanillaplus.44.b:0 "A disaster."
 spanishvanillaplus.44.c:0 "A disaster."
 spanishvanillaplus.44.e:0 "Vae Victus."
 spanishvanillaplus.45.t:0 "La Retirada"
 spanishvanillaplus.45.d:0 "As the last number of Republican-held cities fall to the Nationalists, refugees have started streaming to the French border seeking refuge. \n\nAlthough the government is stressing that the situation is under control, the sanitation and supplies of food are reportedly woefully inadequate for these numbers of people. \n\nFurthermore, it is doubtful that we can provide asylum to so many people and a triage of some kind will be necessary. The political rammifications of allowing potential Republican subversives into France may also be palpable down the line."
 spanishvanillaplus.45.a:0 "Unfortunate turn of events."
 spanishvanillaplus.46.t:0 "Spanish Civil War: Aiding the Nationalists"
 spanishvanillaplus.46.d:0 "After years of political turmoil as the left and right in Spain struggled for power by political means, dividing society into two.  \n\nThose fissures have now exploded following an attempted coup and military uprising against the Republic. Though the Spanish are indeed excrutiating neighbours, they still are that and our country might be best served having a friendly regime with which we see eye to eye. \n\nIf we are to get involved by aiding the Nationalist camp, we must act sooner rather than later." 
 spanishvanillaplus.46.a:0 "De Espanha, nem bom vento nem bom casamento."
 spanishvanillaplus.47.t:0 "Victory Parade of the Condor Legion"
 spanishvanillaplus.47.d:0 "The men of Legion Condor have returned to Germany victorious and have taken part in a large parade in Berlin. \n\nOver several hours, all those who participated in the campaign to help the Nationalists paraded through the Tiergarten, past the Führer and the Brandenburg Gate to the adulation of the crowds. \n\nA special Condor Legion medal was comissioned and presented to the soldiers, pilots and other personnel who have saved Spain from the clutches of Bolshevism, to whom both the Spanish and German nation give thanks."
 spanishvanillaplus.47.a:0 "Forward, Legionaries!" 
 spanishvanillaplus.48.t:0 "Return of the Condor Legion"
 spanishvanillaplus.48.d:0 "The men of Legion Condor have returned from the unsuccessful campaign in Spain to a muted reception in Germany. \n\nThey have been thanked for their service in the international movement to stop the spread of Bolshevism. \n\nAlthough another outcome might have been desirable, our participation has nonetheless provided us with valuable know-how and experience about modern warfare which we can hopefully put to good use in the future."
 spanishvanillaplus.48.a:0 "We fought a good fight."
 spanishvanillaplus.49.t:0 "Victory Parade of the Frecce Nere"
 spanishvanillaplus.49.d:0 "The men of the Corpo Truppe Volontarie and the Aviazione Legionaria have returned to Italy victorious, and were consequently treated to a large welcome event in Rome. \n\nThe event showcased Italy's contribution to the war, in the presence of the Duce and other fascist leaders, to the adulation of crowds of onlookers. \n\nA special medal was comissioned and presented to the blackshirt volunteers, air force pilots and other personnel who partook in the campaign for God and Spain, for which future generations in the Mediterranean may be indebted to them."
 spanishvanillaplus.49.a:0 "A great victory." 
 spanishvanillaplus.50.t:0 "Return of the Corpo Truppe Volontarie"
 spanishvanillaplus.50.d:0 "Our volunteers have returned from the unsuccessful campaign in Spain to a muted reception in Rome. \n\nThey have been thanked for their service in the international movement to stop the spread of Bolshevism. \n\nAlthough another outcome might have been desirable, our participation has nonetheless provided us with valuable know-how and experience about modern warfare which we can hopefully put to good use in the future. \n\nMeanwhile, our relations with Spain and its government may remain strained for a long time."
 spanishvanillaplus.50.a:0 "Let us hope other campaigns go more smoothly."
 spanishvanillaplus.51.t:0 "German Intervention in Spain"
 spanishvanillaplus.51.d:0 "The German Reich has sent a large force of aircraft and ground volunteers to aid the military uprising against the Rebublic. \n\nInitially a small token force, Germany has expanded its operations of its 'Legion Condor' to provide a significant edge in airpower to the Nationalists. Officially only experienced 'volunteers' from the Luftwaffe, German airmen in fighter planes and bombers are taking flight to support offensives to help 'drive the Bolshevists out of Spain'."
 spanishvanillaplus.51.a:0 "With the German Reich on our side, our victory is assured."
 spanishvanillaplus.51.b:0 "Welcome, but what are the Nazis up to?"
 spanishvanillaplus.52.t:0 "Italian Intervention in Spain"
 spanishvanillaplus.52.d:0 "Volunteers from Fascist Italy have arrived in Spain to support the Nationalist cause against the Republic. \n\nOstensibly to save 'Christian Spain' and to 'spread fascism', blackshirt battalions of the 'Corpo Truppe Volontarie' and Italian airmen of the 'Aviazione Legionaria' are joining battle in several areas of Spain. Internationally, fascists have been pleading the cause of the Nationalists as 'defending Christian Spain' against international communism, which has rallied around the Republic to gain the upper hand on the Iberian peninsula."
 spanishvanillaplus.52.a:0 "Spain's Mediterranean brothers have joined the Crusade."
 spanishvanillaplus.52.b:0 "A welcome addition, but what plans do the fascists have here?"
 spanishvanillaplus.53.t:0 "Civil War in Spain: French Response"
 spanishvanillaplus.53.d:0 "The Spanish Republic has fallen into civil war following a failed military coup. The military uprising, calling themselves the 'Nationalists', now threaten to overthrow the democratic government in Spain. \n\nMany Frenchmen sympathise with the ruling Popular Front government, or else with one of the many socialist groups active there, and some have made their way to Spain to take up arms. Others prefer that the French government stay out of it entirely. \n\nOur country remains split on the question of aiding the Republicans and we may need to support in other ways for now."
 spanishvanillaplus.53.a:0 "It isn't clear what we can do here."
 spanishvanillaplus.54.t:0 "French Volunteers in Spain"
 spanishvanillaplus.54.d:0 "The 'Marsellaise Brigade' has formed, manned by numerous French socialists and democrats willing to come to the aid of the beleaguered French Rebublic and stop fascism in its tracks. \n\nOur government has provided them the arms and materials that they need to join the battles ahead. The Spanish Republic for its part is very grateful and has welcomed them as part of the larger set of International Brigades from across the world, protecting the Spanish people from the reactionary forces that aim to enslave her again. \n\nWe have a tough struggle ahead." 
 spanishvanillaplus.54.a:0 "For the Republic."
 spanishvanillaplus.55.t:0 "French Intervention in Spain"
 spanishvanillaplus.55.d:0 "France has sent volunteer ground forces and other much needed military aid to the Spanish Republic. \n\nAlthough the challenges the Republican side faces are enormous, the newly formed 'Marseillaise Brigade' brings hope that we may turn the tide. That the government of France has sided with the majority of its people who sympathise with us is already a big step, and has led to many more French men and women independently making the journey to join a brigade of their choice. \n\nThe French tricolour now proudly stands next to the red, yellow and purple of the Republic."
 spanishvanillaplus.55.a:0 "Liberté, égalité, fraternité."
 spanishvanillaplus.55.b:0 "From Paris to Madrid, United against Fascism!"
 spanishvanillaplus.55.c:0 "Vive la France!"
 spanishvanillaplus.56.t:0 "Victory in Spain"
 spanishvanillaplus.56.d:0 "The war in Spain is over, and despite all odds, the Spanish Republic has been preserved. \n\nThe reactionary forces behind the military uprising were no match for the combined forces of international solidarity. The many French volunteers are returning home as heroes both to the PCF and other socialist movements, but also to French democrats who were uneasy at the prospect of a totalitarian state at the southern border. \n\nThe leaders of the Marsellaise Brigade have been accordingly decorated by the President, with a special Croix D'Honneur for Spain commissioned. \nThe hope is there that a larger catastrophe has just been prevented."
 spanishvanillaplus.56.a:0 "Viva la libertad!"
 spanishvanillaplus.57.t:0 "The Spanish Disaster"
 spanishvanillaplus.57.d:0 "As the French volunteers return to France to either a muted or cool reaction from the populace, our government has to face the reality of having a fascist state on our southern border, possibly for the next generation. \n\nThe dejection of the French left is matched by the jubilance of our own fascist and Catholic reactionaries who hope the defeat of Spanish Republic may be followed by similar radical changes here in France. \nThe dark consequences may take time to be fully understood as anti-fascists lick their wounds."
 spanishvanillaplus.57.a:0 "A setback for free peoples everyhwere." 
 spanishvanillaplus.58.t:0 "Civil War in Spain"
 spanishvanillaplus.58.d:0 "A large military uprising has just engulfed parts of the Spanish Republic, threatening to overthrow Spain's left-wing government. The leadership and ranks of these rebels are filled by all sorts of reactionaries with ties to fascist movements, both in Spain and abroad. \n\nThe governing Popular Front governmen includes many forces friendly to Socialism and to the Soviet Union, including the Spanish Communist party and remains a potential international ally, despite its instability. There is also the potential of gaining some of the Republic's large gold reserves in return. \n\nIf we are to stop these fascists, a decision to support them must be taken sooner rather than later. \n\nMany communists and anti-fascists from abroad have already started making their way to the peninsula."
 spanishvanillaplus.58.a:0 "We must act."
 spanishvanillaplus.59.t:0 "Soviet Volunteers in Spain"
 spanishvanillaplus.59.d:0 "We have sent a number of Soviet citizens to next great anti-fascist struggle in Spain. \n\nOfficially only 'volunteers' next to other Comintern-backed 'international brigades' from various nations, these Soviet citizens with combat experience will hopefully help turn the tide against Spain's rebel military. The sight of our units on the ground and in the air may already provide the Spanish Republicans a significant morale boost. \n\nWe may also consider sending military advisers and further military aid. However, if it is as we fear and other fascist nations get involved to support the other side, what we have sent may not be enough."
 spanishvanillaplus.59.a:0 "¡No pasarán!" 
 spanishvanillaplus.60.t:0 "More Military Aid for Spain"
 spanishvanillaplus.60.d:0 "The Soviet aid and military contribution has increased substantially, reflecting our shared interests with the Republic to stop the fascists and their reactionary lackeys in the Iberian peninsula. \n\nThe contingent has become large enough for others to now notice that Farmer's and Worker's State stands with the Republic. \n\nBack home, the Pravda has started regular reports on the war in Spain, hailing the struggle of the "revolutionary people of Spain" against the fascist aggressors. \n\nOur leadership, while sharing the ideological goals, hopes that we will gain a future ally as well as fair recompense from the Spanish treasury."
 spanishvanillaplus.60.a:0 "¡No pasarán!" 
 spanishvanillaplus.61.t:0 "Soviet Intervention in Spain"
 spanishvanillaplus.61.d:0 "First there were rumours of Soviet material, then there was unmistakable proof of Soviet volunteers in several units. \n\nThe Soviet Union has started providing support to the Republic in a move that will cause communists and socialists to rejoice the world over. \n\nThe Spanish communist party is already hailing the arrival of these volunteers as beautiful gesture of 'international solidarity' to aid the Spanish people. \n\nSuch backing is the best news the Republican side has received yet, and just when it is most needed."
 spanishvanillaplus.61.a:0 "We must welcome any help we can get."
 spanishvanillaplus.61.b:0 "Anti-fascists of the world, unite!"
 spanishvanillaplus.61.c:0 "What are the Soviets up to here?"
 spanishvanillaplus.62.t:0 "Victory in Spain"
 spanishvanillaplus.62.d:0 "The cabal of fascist generals has been defeated, and Spain has been made safe for socialism. Our contingent, that already joined in the festivities in Spain when victory was announced, are now part of a victory parade in Red Square. Every Soviet citizen who took part has been decorated for their heroic contributions far from home, including several comrades who have been awarded the title of 'Hero of the Soviet Union'. \n\nA victory for working people everywhere and a large victory for Soviet Union internationally."
 spanishvanillaplus.62.a:0 "¡No pasarán!"
 spanishvanillaplus.63.t:0 "Ideological Foes Victorious in Spain"
 spanishvanillaplus.63.d:0 "While some might hail the failure of the fascist coup in Spain as victory in and of itself, this is far our preferred outcome. \n\nHaving revisionist socialists and frauds posing as communists leading the chaos in post-war Spain is far from what our leadership wanted and this result has only left behind a hotbed of anti-Soviet madmen who may reproduce further and cause us trouble elsewhere internationally. \n\nRevolution must be prevail over the old order, but it should be OUR revolution, not theirs."
 spanishvanillaplus.63.a:0 "A victory only for the revisionist wreckers." 
 spanishvanillaplus.64.t:0 "Defeat of the Spanish Republic"
 spanishvanillaplus.64.d:0 "The war has ended unfavourably with the victory of the fascists and the end of the Republic. Communists, those that have not fled at least, are being hunted down and persecuted by these ideological cannibals that have somehow gained the upper hand. \n\nIn this setback for the Comintern, massive resources were spent in aid to the Republican side but all of it came to naught. We have nonetheless chosen to honour those Soviet citizens who took part, albeit in a more muted and less flashy way. \n\nPerhaps the experience gained may help the Red Army in the future."
 spanishvanillaplus.64.a:0 "A setback, but we fought a good fight."
 spanishvanillaplus.65.t:0 "Spanish Republican Exiles"
 spanishvanillaplus.65.d:0 "As many Spanish people struggle to live under this new order, many packed their bags and left before it was too late. The head of the Spanish Communist Party, Dolores Ibarruri, several generals such as Enrique Líster and Francisco Ciutat de Miguel, have all left and knocked on our door. We estimate there may be around four thousand in all, including many evacuated children. \n\nNaturally they may prove useful in the building of socialism here, while their home countries sort out the turmoil they have brought themselves into."
 spanishvanillaplus.65.a:0 "Bienvenidos, compañeros."
 spanishvanillaplus.66.t:0 "Franco Gives Victory Speech"
 spanishvanillaplus.66.d:0 "General Franco, the Caudillo of Spain, has delivered an address following the victory of his Nationalist forces in the civil war. \n\nIn it, he declares that the war is over and that a new system is about to be established based on traditional Spanish values. \n\n'"A totalitarian state will harmonize the functioning of all the capacities and energies of Spain, in which, within National Unity, work, considered the most unavoidable of duties, will be the only expression of the popular will. \n\nAnd thanks to it, the authentic sentiment of the Spanish people will be manifested through those natural bodies that, like the family, the municipality, the association, and the corporation, will make our supreme ideal crystallize into reality.'"
 spanishvanillaplus.66.a:0 "¡Arriba España!"
 spanishvanillaplus.67.t:0 "Speech from the Canary Islands"
 spanishvanillaplus.67.d:0 "One of the leaders of the uprising, General Francisco Franco Bahamonde, has just broadcast a speech over the radio from the Canary Islands. \n\n'The situation in Spain has been growing worse every day: anarchy reigns in most of the countryside and towns; authorities named by the government merely preside over revolts rather than quelling them'. \n\n'Revolutionary strikes of all kinds paralyze the nation, ruining and destroying its sources of wealth and creating a situation of hunger that will throw working men into a state of desperation.' \n\nHe calls on all 'who feel holy love for Spain' to support the military to bring 'order and the rule of liberty and justice' back to the country." 
 spanishvanillaplus.67.a:0 "¡Arriba España!"
 spanishvanillaplus.68.t:0 "Speech from the Canary Islands"
 spanishvanillaplus.68.d:0 "As Spain is thrown into confusion by news of a military uprising, a radio speech has been broadcast from the Canary Islands. \n\nThe speaker, the troublesome general Francisco Franco Bahamonde who was posted to those remote islands due to his right-wing sympathies, called on all "who feel holy love for Spain" to support the military. \n\nThe speech claims that 'the situation in Spain has worsened each day, with anarchy reigning in most towns and countrysides'. \n\nHe accuses the government of ripping the country apart by 'making electoral pacts with separatists', allowing the masses to be 'deceived and exploited by Soviet agents' and of lacking the authority and prestige to impose 'order, liberty and justice'. \n\nSurely an ominous speech for most listeners."
 spanishvanillaplus.68.a:0 "What are these clowns doing?"
 spanishvanillaplus.69.t:0 "Valley of Cuelgamuros"
 spanishvanillaplus.69.d:0 "Near Madrid, in the Sierra de Guadarrama, construction has begun on a monumental civic project, involving the carving and drilling of a mountain, with convict labor used to carry out much of the work. \n\nAs a 'national act of atonement and reconciliation, the 'Valley of the Fallen' is to become both a Catholic basilica and national monument for those who fell during the tragic events of the civil war. \n\nWe expect that construction will take a long time to complete, possibly decades."
 spanishvanillaplus.69.a:0 "An end to this tragic chapter of our history."
 spanishvanillaplus.70.t:0 "Francisco Franco Becomes Leader"
 spanishvanillaplus.70.d:0 "General Francisco Franco Bahamonde, one of the group of generals behind the uprising, has been appointed Generalísimo of the National army and the defacto leader of the nationalists. \n\nKnown for his successful actions during the Rif war, Franco was popular in Nationalist circles and maintained good relations with fascist powers abroad. \n\nKnown as a pragmatist more than a political ideologue, it remains to seen what he will do, both in keeping his camp united and in terms of his plans for Spain."
 spanishvanillaplus.70.a:0 "A fitting leader for the Nationalists."
 spanishvanillaplus.70.b:0 "We look forward to working with him."
 spanishvanillaplus.70.c:0 "We should have dealt with this traitor when he had the chance."
 spanishvanillaplus.70.e:0 "Another brutal individual in power."
 spanishvanillaplus.70.f:0 "Another bloodstained fascist."
 spanishvanillaplus.70.g:0 "Another moustache guy."
 spanishvanillaplus.71.t:0 "Spanish Revolution in Republican Zone"
 spanishvanillaplus.71.d:0 "Across large parts of Spain, in Catalonia, in Valencia and other remote areas, the winds of change have turned into a storm since this war has started. \n\nA silent revolution in some places, a noiser one in others. The Church has been sidelined and social norms have been modified, with civil marriage, secular education and women's liberation (via movements like the 'Mujeres Libres') gaining traction. Abortion has also been legalised and prostitution banned in some areas. \n\nWith government resources exhausted by the war effort, anarchists, communists and libertarian socialists have taken steps to replace institutions with the power vaccum fitting their worldview and vision for society: independent anarchist communes have been set up in some places to create their own utopia where money has been abolished, elsewhere trade unions such as the CNT and UGT have realised their plans of 'seizing the means of production'. \n\nFarms and factories have been taken over and collectivised on a small but increasing scale. An unparalleled degree of social experimentation is taking place, challenging the old order, though creating a practical headache for the Spanish Republic." 
 spanishvanillaplus.71.a:0 "This Republic is rotten inside and out. We must save the country while we still can."
 spanishvanillaplus.71.b:0 "Utter chaos."
 spanishvanillaplus.71.c:0 "Utter insanity. We must pull the fronts together lest we lose them all."
 spanishvanillaplus.71.e:0 "This is the wrong time for this."
 spanishvanillaplus.71.f:0 "Interesting, but the wrong pace at the wrong time."
 spanishvanillaplus.71.g:0 "Anarchy. Literally."
 spanishvanillaplus.72.t:0 "Churches and Monasteries Ransacked"
 spanishvanillaplus.72.d:0 "In many parts of Spain, open acts against the Church and its property have been committed by certain Republican militias. \n\nThere are reports that monasteries, churches and convents have been looted, ceremonial objects taken, crypts opened up and their corpses put outside on display. Some churches have been entirely requisitioned as barracks or entertainment venues. \n\nReports exist of darker acts, such as the execution of bishops, priests and nuns, accused of being supporters of the Nationalists. \n\nAs news of this reaches audiences abroad, the Republican side faces a potential public relations disaster."
 spanishvanillaplus.72.a:0 "The true face of this godless red Republic."
 spanishvanillaplus.72.b:0 "Disgusting enemies of all that is holy."
 spanishvanillaplus.72.c:0 "Utter insanity. We must pull the fronts together lest we lose them all."
 spanishvanillaplus.72.e:0 "The Vatican knew what it was doing when it took a side."
 spanishvanillaplus.72.f:0 "This is a disaster."
 spanishvanillaplus.72.g:0 "The superstitious reactionaries should not have taken a side."
 spanishvanillaplus.72.h:0 "Appalling."
 spanishvanillaplus.74.t:0 "Alcazar Saved"
 spanishvanillaplus.74.d:0 "We have relieved the 16th-century fortress from the long siege imposed on it since the beginning of the war. \n\nOur troops, led by Colonel José Moscardó Ituarte, had bravely held out in the fortress under constant gun and artillery fire by both Republican militias and even by random civilians regularly invited to take potshots at the walls. \n\nValiantly, Moscardó held fast after the dastardly reds captured his own son and murdered him after he refused their ultimatum to give up the fortress in exchange. He will surely by promoted for his sacrifice. \n\nThe battle was destructive and bloody. Large parts of the Alcazar, including several of its century-old walls lie in ruins. The assault by our troops resulted in a number of civilian deaths in Toledo itself, including at Tavera hospital.  \n\nNevertheless, the relief of the Alcazar, considered impossible by many, has solidified Francisco Franco's status as the most fitting leader of the Nationalists. This heroic achievement has already provided a large morale boost for our side."
 spanishvanillaplus.74.a:0 "¡Arriba España!"
 spanishvanillaplus.75.t:0 "Nationalists Lift Siege of the Alcazar"
 spanishvanillaplus.75.d:0 "Nationalist troops led by General Francisco Franco Bahamonte have reached the besieged Alcazar and relieved the garrison, holed up there since the beginning of the war. \n\nClearly outnumbered, surrounded and outgunned by several Republican militias, the garrison held out through a long bloody siege in which the 16th-century fortress has been all but destroyed. \n\nDespite the limited military value of the site, the Nationalists, but also foreign observers, are hailing this as a massive propaganda victory for their side, as reaching them in time was considered impossible by many."
 spanishvanillaplus.75.a:0 "Heroic."
 spanishvanillaplus.75.b:0 "Heroic."
 spanishvanillaplus.75.c:0 "Militarily insignificant."
 spanishvanillaplus.75.e:0 "Under siege, the fascists stay put and we fold. This must change."
 spanishvanillaplus.75.f:0 "Militarily insignificant."
 spanishvanillaplus.75.g:0 "Under siege, the fascists stay put and we fold. This must change."
 spanishvanillaplus.75.h:0 "A shame."
 spanishvanillaplus.76.t:0 "Primo de Rivera Executed"
 spanishvanillaplus.76.d:0 "We have received word that Jose Antonio Primo de Rivera has just been murdered. \n\nAlready imprisoned at Alicante prison, he was charged with 'conspiracy against the Republic' and 'military insurrection'. Primo de Rivera then defended himself in the kangaroo court that the reds set up. \n\nAfter inevitably being found guilty, he was sentenced to death. He was executed by firing squad. \n\nThough it still may not be sure how a proposed prisoner exchange might have turned out, this tyrannical act by this dying Republic will no doubt be met with widespread outrage from everyone on the Nationalist side, as well as many others. \n\nThe proper time to mourn him will be later, but Falangists have already started to honour this loss and mark his martyrdom in various ways."
 spanishvanillaplus.76.a:0 "Grave news. A true martyr for the national cause." 
 spanishvanillaplus.77.t:0 "Primo de Rivera Dead"
 spanishvanillaplus.77.d:0 "News has just come through that Jose Antonio Primo de Rivera, leader of the Falange and son of dictator Miguel Primo de Rivera, has just been killed by firing squad in a Republican jail. \n\nThough officially he was tried by a court and sentenced to death for being part of the conspiracy that led to the current civil war, faith in this process will be divided along political lines. The Nationalists and Falange supporters are mourning the loss already and have vowed revenge. The Republicans on the other hand will welcome the removal of a very dangerous figure who would have attempted to impose fascism on Spain. \n\nEither way, the war has taken another dramatic turn as this potential, even likely, leader of the Nationalists is now gone."
 spanishvanillaplus.77.a:0 "His martyrdom will not be in vain."
 spanishvanillaplus.77.b:0 "A martyr."
 spanishvanillaplus.77.c:0 "The traitor is gone, but his surviving ideas will be harder to kill."
 spanishvanillaplus.77.e:0 "Good riddance."
 spanishvanillaplus.77.f:0 "Good riddance to this fascist socialite."
 spanishvanillaplus.77.g:0 "Another dead fascist in a war they started."
 spanishvanillaplus.77.h:0 "Who will replace him, though?"
 spanishvanillaplus.78.t:0 "Primo de Rivera Released in Prisoner Exchange"
 spanishvanillaplus.78.d:0 "After a large amount of wrangling through our backchannels, the prisoner exchange has been accepted and Jose Antonio has now been freed and brought safely to Nationalist lines. \n\nThe price we paid was high: 500 prisoners of political, cultural or military value, including surviving mayors, trade union leaders, artists and red activists, as well as a further 1000 soldiers taken prisoner. \n\nThough it is imperative we know have our potential political leader back in safe hands, we hope this does not set a bad precedents. \n\nRegardless, Jose Antonio was welcomed and looked healthy, impetuous to take the reins of the Falangist cause and lead us to victory."
 spanishvanillaplus.78.a:0 "Fantastic news." 
 spanishvanillaplus.79.t:0 "Primo de Rivera Becomes Leader"
 spanishvanillaplus.79.d:0 "In a move solidifying the Falange as the dominant party within the Nationalist camp, Jose Antonio Primo de Rivera, party leader and son of dictator Miguel Primo de Rivera, has just been made leader. \n\nImprisoned by the Republic since the beginning of the civil war, Primo de Rivera was released as part of a large prisoner exchange which led to the release of over 1000 Rebublican prisoners. \n\nHow Primo de Rivera's release and ascension to leadership will affect the war further remains to be seen. \n\nSome on the Republican side are however already calling foul at the release of, in their eyes, such a politically dangerous individual."
 spanishvanillaplus.79.a:0 "A fitting leader for the Nationalists and Spain."
 spanishvanillaplus.79.b:0 "We look forward to working with him."
 spanishvanillaplus.79.c:0 "His father was bad enough, now him?"
 spanishvanillaplus.79.e:0 "A more acceptable face will not change who we are fighting."
 spanishvanillaplus.79.f:0 "Another pseudointellectual fascist."
 spanishvanillaplus.79.g:0 "Who?"
 spanishvanillaplus.80.t:0 "Arson of Irun"
 spanishvanillaplus.80.d:0 "As our troops advance in the Basque Country, they had several anarchist militia on the run after vicious fighting in Irun, near the French border. \n\nAfter expending their last reserves of ammunition, these cowardly reds resolved not to leave us the city intact and set parts of the town on fire. \n\nWe of course will spread this as an example of the barbaric nature of the enemy we face."
 spanishvanillaplus.80.a:0 "Anarchists that would burn the entire country down!" 
 spanishvanillaplus.81.t:0 "Spain Withdraws from League of Nations"
 spanishvanillaplus.81.d:0 "Following the victory of Francisco Franco's Nationalists in the Spanish Civil War, Spain has announced that it is withdrawing with immediate effect from the League of Nations. \n\nReasons cited were its alleged ties with the previous government of the Republc, alleged hostility by members to Franco's new government, as well general stances taken by members on foreign policy that are at odds with Spain's interests. \n\nSpain has now taken the same path as a number of its close allies in Europe by withdrawing."
 spanishvanillaplus.81.a:0 "This decision looks promising."
 spanishvanillaplus.81.b:0 "Another nail in the coffin of the old world order."
 spanishvanillaplus.81.c:0 "Yet another fascist country sowing instability."
 spanishvanillaplus.81.e:0 "Those that ignored the civil war will now bear its consequences."
 spanishvanillaplus.82.t:0 "Foreign Journalists and Writers in Republican Zone"
 spanishvanillaplus.82.d:0 "Republican Spain now hosts a larger number of foreigners who have joined the war effort in some way, whether by enlisting to fight, by providing humanitarian aid, by driving ambulances and providing medical relief. \n\nBritish writer Eric Blair has joined a unit of the International Brigades, as has French novelist André Malraux. \n\nAmerican Earnest Hemingway is in Spain serving as both as an ambulance driver and foreign correspondent, as is Martha Gellhorn, reporting for Collier's Weekly. \nGerman-Jewish photographer Gerda Taro has come to the Republican zone to document the war and Spanish homefront, providing valuable insight to the rest of the world. \n\nOne should hope that foreigners can come to Spain in the future during better times."
 spanishvanillaplus.82.a:0 "Interesting."
 spanishvanillaplus.82.b:0 "All help in the struggle is welcome."
 spanishvanillaplus.82.c:0 "Interesting."
 spanishvanillaplus.83.t:0 "Foreign Volunteers in Spain"
 spanishvanillaplus.83.d:0 "A concept originally conceived by the Comintern, the first 'International Brigades' were formed in Albacete where foreign volunteers, mostly recruited from Communist movements abroad, undergo training before being sent to the front. \n\nDespite the name 'brigades', volunteers generally are organised into specific batallions to serve in Republican divisions. To simplify communication, battalions usually include people of the same nationality or language, named after noteworthy individuals from that country. \n\nThe war in Spain, news of human suffering and the prospect of fascism taking over, has attracted a large number of idealists from across Europe so far: French, Belgian, Italian, German and Polish volunteers make up the largest contingent, however this is expected to expand further.""
 spanishvanillaplus.83.a:0 "We must welcome any help we can get."
 spanishvanillaplus.83.b:0 "Anti-fascists of the world, unite!"
 spanishvanillaplus.83.c:0 "What are the Soviets up to here?"
 spanishvanillaplus.84.t:0 "Support for International Brigades"
 spanishvanillaplus.84.d:0 "The government has decided to expand support for the International Brigades by diverting government funding to the recruitment of volunteers and expanding the number of allowed battalions. \n\nThose serving currently have proven themselves and represent valuable assets to the anti-fascist cause. Proposals are being looked at to provide better training and weapons to the volunteers as well as attract a larger circle of anti-fascist fighters from abroad beyond the usual circles of party members, subject to Comintern screening. \n\nThe Spanish Communist Party is very much onboard already with these proposals. There will be long hard months and maybe years ahead, but the power of international solidarity is limitless."
 spanishvanillaplus.84.a:0 "Long live international solidarity." 
 spanishvanillaplus.85.t:0 "Government support for International Brigades"
 spanishvanillaplus.85.d:0 "The Republican government has just approved several measures allowing for the creation of more international battalions and increasing the funding of recruitment abroad. \n\nThe Spanish Communist Party released a statement lauding the 'international solidarity shown so far by anti-fascists the world over' and expressing the hope that these measures to increase battalion numbers, recruitment and training might serve 'the deathblow to the dark forces of reaction'. \n\nNews of Nationalist atrocities have already reached public consciousness in places like the USA, Canada and South America, which may prove to be sources of additional men and women coming to fight."
 spanishvanillaplus.85.a:0 "We must welcome any help we can get." 
 spanishvanillaplus.85.b:0 "Anti-fascists of the world, unite!"
 spanishvanillaplus.85.c:0 "What are the Soviets up to here?"
 spanishvanillaplus.86.t:0 "Nationalist Victory in Spain"
 spanishvanillaplus.86.d:0 "The Nationalists have prevailed in the civil war, to our great relief. \n\nPortugal's neighbour now has a more ideologically similar government now that the Spanish Republic has been overthrown. \nWe have indications that our contribution has been much appreciated by the Nationalists. \n\nThe men serving as Viriatos for their part have returned and are being honoured in ceremonies in their hometowns and villages. The Spaniards have also for their part asked for a list of known volunteers so that their sacrifices may not be forgotten."
 spanishvanillaplus.86.a:0 "Bem-vindos de volta, rapazes."
 spanishvanillaplus.87.t:0 "Nationalist Defeat in Spain"
 spanishvanillaplus.87.d:0 "Despite the efforts of the brave men who joined the fight in Spain, the military uprising has been defeated, leaving the Spanish Republic intact. \n\nIt is not yet clear to what extent our involvement supporting the Nationalists during the war is known however, we expect frosty relations with our ideologically divergent neighbour for the foreseeable future. \nSome sympathisers with the Nationalists, landlords and military leaders have opted to vote with their feet and leave, either staying in or passing through Portugal to points elsewhere. \n\nIt is hoped that the experience our battle-hardened men have brought back may be useful in some way going forward. "
 spanishvanillaplus.87.a:0 "An unfortunate result." 
 spanishvanillaplus.88.t:0 "The Radio General"
 spanishvanillaplus.88.d:0 "Since the fall of Seville, General Gonzalo Queipo de Llano has taken to the medium of radio more than many other figures on our side, giving addresses each night, in which he both chides and violently attacks those on the Republican side. \n\nSome memorable quotes of his include: \n\n'For every one of our men who falls, I will kill at least ten extremists. And as for the leaders who flee, don’t think they will escape; I will drag them out from the ground if necessary, and if they are dead, I will kill them again.' \n\n'Red scoundrels, just wait till I arrive there in ten days. I'll sit down in a cafe in Larios street, drinking beer, and for each sip I take, ten of you will die' \n\n'Our valiant Legionnaires and Moroccan troops have taught the Reds what real men are. And their women as well. This is justified because they advocate free love. At least now they’ll know what real men are, not militia cowards. They won’t escape, no matter how much they kick and scream.' \n\nHopefully, such demagoguery will have an effect on the battlefield."
 spanishvanillaplus.88.a:0 "Distasteful."
 spanishvanillaplus.89.t:0 "The Radio General"
 spanishvanillaplus.89.d:0 "A particularly crazed voice takes to the airwaves every evening on Radio Sevilla. \nNationalist General Queipo de Llano engages in a particularly crude form of psychological warfare with regular violent tirades against our side, such as: \n\n'In Barcelona, after having had three different governments, it seems that radical Marxism has been declared. What has become of (Catalonian President) Companys and those around him? Truly everyone deserves to die slaughtered like pigs.' \n\n'The die is cast and decided for us and it is useless for these scoundrels to resist and produce that hubbub of screams and shots that you hear everywhere. Troops of the Tercio (Foreign Legion) and Regulares (Morrocan troops) are already on their way and, as soon as they arrive, those troublemakers will be hunted down like vermin. Long live Spain!' \n\n'Red scoundrels, just wait till I arrive there in ten days. I'll sit down in a cafe on Larios street, drinking beer, and for each sip I take, ten of you will die. I will shoot ten for each of our people that you shoot, even if I have to drag you out of your graves to do it.' \n\n'Our valiant Legionnaires and Moroccan troops have taught the reds what real men are. And their women as well. This is justified because they advocate free love. At least now they’ll know what real men are, not militia cowards. They won’t escape, no matter how much they kick and scream.'"
 spanishvanillaplus.89.a:0 "We are fighting psychopaths."
 spanishvanillaplus.90.t:0 "Vatican Recognizes Nationalists"
 spanishvanillaplus.90.d:0 "The Holy See has recognised the Nationalist side as the legitimate government of Spain. \n\nThe Catholic Church, after years of frosty relations with the government of the Spanish Republic, is said to have become increasingly favourable to the military uprising as events in Spain unfolded. \n\nIn light of atrocities committed against Catholic laymen and clergy as well as the expropriation of Church propertly over the course of the war, the outcry of Catholic leaders across the world may have further forced the Pope's hand, who otherwise is expected to maintain neutrality on geopolitical matters. \n\nThe Vatican thus also joins the increasing number of countries, already including Germany and Italy, that have adopted a practical approach regarding the changing facts on the ground in Spain, where Republican forces are said to be in retreat on several fronts."
 spanishvanillaplus.90.a:0 "The Holy Father's sanction is welcome."
 spanishvanillaplus.90.b:0 "Useful endorsement."
 spanishvanillaplus.90.c:0 "A strong voice in favour of our cause."
 spanishvanillaplus.90.e:0 "The Catholic Church has been biased from the start."
 spanishvanillaplus.90.f:0 "Why is the Pope getting involved here?"
 spanishvanillaplus.90.g:0 "The forces of superstition and reaction support the fascists."
 spanishvanillaplus.90.h:0 "Why is the Pope getting involved here?"
 spanishvanillaplus.91.t:0 "Collective Letter of the Spanish Bishops"
 spanishvanillaplus.91.d:0 "Though it has been obvious that the Catholic Church favours our side against the murderous reds who have the blood of thousands of Christians and priests on their hands, we have decided to make use of this by commissioning an open letter by Spanish Church leaders. \n\nThe letter, requested to be published across the Catholic press worldwide, calls on the world to support the Nationalists in any way they can, in light of the murders of priests and nuns by communist and anarchist bands across Spain. \n\nIn short, the letter denounces the civil war but blames the weak Republic for causing it, by aiding and abeting the enemies of the Church to attack the 'national conscience'. It also blames the influence of the USSR for actively formenting anti-Church Marxist Revolution. The letter upholds the national-religious character of the Nationalist side and justifies their cause as the only way to re-establish peace in Spain. \n\nThe letter received the signature of 58 Spanish archbishops, bishops and diocesan administrators."
 spanishvanillaplus.91.a:0 "Fantastic."
 spanishvanillaplus.91.b:0 "The Crusade continues."
 spanishvanillaplus.92.t:0 "People's Olympiad in Barcelona Cancelled"
 spanishvanillaplus.92.d:0 "The People's Olympiad in Barcelona has been cancelled due to the outbreak of hostilities in the country. \n\nOriginally conceived as a protest event against the Olympic Games in Berlin, the People's Olympiad gained the support from the Soviet Union, international socialist athletes and from those boycotting Nazi Germany. \n\nAround 6000 athletes from 49 countries had registered to take part, including teams of exiles from Germany and Italy. \n\nNow that the event has been cancelled, those participants that had already arrived have now left, and a valiant few have made the decision to stay and have signed up to defend the Republic during its hour of need."
 spanishvanillaplus.92.a:0 "Good. No one needed the 'Red Olympics' anyway."
 spanishvanillaplus.92.b:0 "Pathetic event."
 spanishvanillaplus.92.c:0 "This event could have put the Republic on the map."
 spanishvanillaplus.92.e:0 "The least of Spain's problems now."
 spanishvanillaplus.92.f:0 "Next year perhaps, in a free Spain."
 spanishvanillaplus.92.g:0 "The least of Spain's problems now."
 spanishvanillaplus.93.t:0 "Nationalist Takeover Thwarted in Barcelona"
 spanishvanillaplus.93.d:0 "A Nationalist insurrection to take over Barcelona, led by elements of the military garrison sympathetic to the military uprising, has just been crushed. \n\nThough this was owed in part to the contingent of the military and Guardia Civil that remained loyal to the Republic, the decisive blow was dealt by the powerful anarchist militias in the city, who answered the call to oppose the rebellion, and arrived in their thousands to push the soldiers back to their barracks. Street battles then continued, before the garrison eventually surrendered. \n\nThe leader of the rebels, General Manuel Goded Llopis, and his 5 other colonels, after ordering their men to stand down, were tried for treason and executed the following day at Montjuïc Castle. \n\nThis failure to take Barcelona is a massive victory for the Republic, however the influence and strength of the anarchist militias, backed by the CNT and FAI labor unions, are now uncontested. \n\nAs these groups hail the 'revolutionary fervor of resistance' that has saved the city, they may remain a force to be reckoned with for all involved."
 spanishvanillaplus.93.a:0 "A very unfortunate turn of events."
 spanishvanillaplus.93.b:0 "A shame."
 spanishvanillaplus.93.c:0 "An epic victory against the Nationalist thugs."
 spanishvanillaplus.93.e:0 "Bravo."
 spanishvanillaplus.93.f:0 "A wonderful turn of events with the fascists beaten."
 spanishvanillaplus.93.g:0 "Barcelona breathes a sigh of relief."
 spanishvanillaplus.94.t:0 "The Falange-Carlist Synthesis"
 spanishvanillaplus.94.d:0 "The decision to fuse the Falange and the Carlists into one movement, the FET y de las JONS, has some extensive rammifications. \n\nThe wing of the party in favour of a revolutionary transformation of Spanish society, having become less and less relevant with the influx of opportunistic new joiners for a while, has been completely sidelined. The Caudillo has become the undisputed leader with very different ambitions of stabilizing the country. \n\nFurthermore, the common uniform combines the dark-blue shirt of the Falange and the red beret of the Carlists. \n\nBoth sides may have lost something of their original character, but this may be for the best. A new chapter of Spanish politics beckons."
 spanishvanillaplus.94.a:0 "We need a common front."
 spanishvanillaplus.95.t:0 "Exiles fight for Spanish Republic"
 spanishvanillaplus.95.d:0 "Volunteers in the International Brigades have included nationals of many European countries, including thousands of German, Italian and Austrian exiles. \n\nForced to leave their own countries due to fascism, they are trying to make a difference in the struggle against it here. \n\nThough viewed initially with suspicion by some, they, and their fallen, have since made it very clear that their loyalties lie with us."
 spanishvanillaplus.95.a:0 "They know the dangers of fascism better than any of us."
 spanishvanillaplus.95.b:0 "All anti-fascists of the world, unite!"
 spanishvanillaplus.95.c:0 "Welcome."
 spanishvanillaplus.97.t:0 "Anarchist Uprising in Catalonia"
 spanishvanillaplus.97.d:0 "The central government has launched a failed crackdown against the anarchist communes in Aragon and independent socialists. \nBarcelona is reportedly lost, and street battles have taken place across the Republican zone. \n\nThis split in the front has come after long standing differences of philosophy in governance, as well as the conduct of the war came to a head. \n\nSome are increasingly vocal that this split may be fatal for any chance of the Republic stopping the Nationalists."
 spanishvanillaplus.97.a:0 "A red front, a split front."
 spanishvanillaplus.97.b:0 "A red front, a split front."
 spanishvanillaplus.97.c:0 "Another challenge."
 spanishvanillaplus.97.e:0 "Not promising."
 spanishvanillaplus.97.f:0 "We must overcome these ragtag militias posing as revolutionaries."
 spanishvanillaplus.97.g:0 "Awful."
 spanishvanillaplus.98.t:0 "Accusations against the POUM"
 spanishvanillaplus.98.d:0 "Following the recent uprising of anarchists in Catalonia, there are also accusations about another socialist organisation, the Partido Obrero de Unificacion Marxista, or POUM. \n\nThey are claimed to be fraternising with the enemy. Pro-Stalin Communists already accuse them of being 'Trotskyist' with 'crypto-fascist tendencies', however these recent accusations may have put some over the edge. \n\nSome argue that the POUM should be banned in the zone under Republican control and its leaders arrested immediately."
 spanishvanillaplus.98.a:0 "Treason everywhere."
 spanishvanillaplus.100.t:0 "Bombing of Barcelona"
 spanishvanillaplus.100.d:0 "There have been a large number of air raids on the city of Barcelona. \n\nAir raid sirens sounded for hours as a large proportion of city's inhabitants took shelter either in bunkers, or fled the city entirely. \n\nBarcelona city centre and the port have been particularly badly damaged, with a few explosions also hitting the city's Gothic Quarter. \n\nThe death toll is at least a thousand people, though many others are still unaccounted for and may be under the rubble of destroyed buildings. \n\nIt is very likely that these events will remain in the city's collective memory for a long time to come."
 spanishvanillaplus.100.a:0 "More terrifying results of modern warfare."
 spanishvanillaplus.100.b:0 "Terrifying."
 spanishvanillaplus.100.c:0 "These criminal acts will not go unanswered."
 spanishvanillaplus.100.e:0 "Fascist monsters dropping death from the sky."
 spanishvanillaplus.100.f:0 "The fascist murderers will not set foot in the city."
 spanishvanillaplus.100.g:0 "Terrifying."
 spanishvanillaplus.101.t:0 "Funeral of José Antonio Primo de Rivera"
 spanishvanillaplus.101.d:0 "Over 11 days, over 467 kilometers, with thousands watching its passing through every Spanish town and city on the way, the funeral procession of José Antonio Primo de Rivera marched from Alicante, the city of his last days, to his place of burial at El Escorial, northwest of Madrid. \n\nAs the Falangist honour guards carrying his coffin on their shoulders changed, so did the landscapes of the surrounding countryside, all along this final journey. \n\nThe civil war has ended and a new chapter of Spanish history must commence. However, for many of Primo de Rivera's supporters, who have dubbed him '"El Ausente' ('The Missing One'), and now in the enforced canon of national mythology, he joins along in that long march towards the country's future."
 spanishvanillaplus.101.a:0 "¡Presente!"
 spanishvanillaplus.102.t:0 "Spain Hit by Double Political Assassination"
 spanishvanillaplus.102.d:0 "The country is on the brink following a spate of political killings in Madrid. \n\nYesterday, a police lieutenant of the Guardia de Asalto, José Castillo, was killed by suspected Falangist gunmen on the Calle de Fuencarral. \n\nPresumably as retaliation, highly influential CETA member and former Finance Minster José Calvo Sotelo was detained by police, shadowed by local left wing militiamen. On the way to the police station, Sotelo was shot and his body dumped near a cemetery. \n\nFaced with outrage from the right, political fractures inhibit any investigation promised by the government, which is now dragging its feet. \n\nWhat happens to Spain now, is anyone's guess, however further bloodshed seems inevitable at this stage."
 spanishvanillaplus.102.a:0 "Fascist violence is ripping the country apart."
 spanishvanillaplus.102.b:0 "The infection of Marxist terror." 
 spanishvanillaplus.104.t:0 "Nationalists reach the Mediterranean"
 spanishvanillaplus.104.d:0 "After a series of dramatic pushes eastward, the Nationalist army has reached the Spanish east coast of the Mediterranean. \n\nThe first troops approaching the beaches reportedly celebrated this tremendous milestone. \n\nThis represents another symbolic setback for the embattled Spanish Republic." 
 spanishvanillaplus.104.a:0 "Thalassa, thalassa!"
 spanishvanillaplus.104.b:0 "Fantastic."
 spanishvanillaplus.104.c:0 "We cannot afford to lose ground like this."
 spanishvanillaplus.104.e:0 "Disastrous."
 spanishvanillaplus.104.f:0 "Disastrous."
 spanishvanillaplus.104.g:0 "Disastrous."
 spanishvanillaplus.105.t:0 "Martyrdom of Lina Odena"
 spanishvanillaplus.105.d:0 "Lina Odena, a young woman who joined the battle for the Republic has just lost her life. \n\nOdena was driving through the frontlines in the south of Spain, where her vehicle took a wrong turn and she ended up surrounded by a Nationalist patrol. Rather than surrender, she shot herself with her pistol. \n\nOdena has risen through the ranks in recent years. After growing up sympathetic both to the Republic and to the ideals of Socialism, Odena went to be trained in Moscow to further the communist movements in Spain. \n\nHowever tragic this loss may be, she is being hailed as martyr in the battle against fascism in Spain, and word of her sacrifice has spread across the Republican zone." 
 spanishvanillaplus.105.a:0 "A tragic loss but an inspiration to others."
 spanishvanillaplus.105.b:0 "Anti-fascist martyrs never truly die."
 spanishvanillaplus.105.c:0 "Tragic."
 spanishvanillaplus.106.t:0 "Spanish Republic of 1936: A House Divided Against Itself"
 spanishvanillaplus.106.d:0 "Since the 1931 departure of King Alfonso XIII, the Second Spanish Republic has staggered from crisis to crisis. \n\nThe first government made up of six left-wing parties, after drafting the Republic's first constitution, engaged in various attemps of land reform and secularisation, only to exacerbate tensions with hostile conservative forces, as well as anger the left for whom the reforms were insufficient. Deeper radicalisation of the left, clashes between anarchist groups and the right-wing Guardia Civil and military would lead to its collapse. \n\nThe ensuing 1933 election brought to power a coalition of right-wing parties, the CEDA, who easily beat the divided left. However, formerly moderate socialists would radicalise following their defeat, as popular support for communist and anarchist parties surged. The new CEDA-backed Republican government, as it attempted to reverse previous reforms, would face an onslaught of strikes across Spain, leading to violent clashes in Spain's northern mining regions between strikers and police, before culminating in the Asturias Uprising led by revolutionary workers backed by the anarchist CNT trade union. \n\nThe Spanish Army, commanded by General Francisco Franco Bahamonde, crushed the rebels over two traumatising weeks, at the cost of 1,000 lives. These brutal actions were met with approval from the anti-communist right and horror from the socialist left. \nPetty political scandals then achieved what armed rebellion could not, felling the ruling right-wing coalition. \n\nToday, the 1st January, the Cortes has just been dissolved and elections have been scheduled for February to decide the next government of a nation split between left-wing republicans, socialists, communists, and anarchists on the left, and conservatives, religious Catholics, monarchists, militarists and Falangists on the right. \n\nWhatever the result, few in Spain believe there is any way back now, as the festering hatred which these two Spains hold for one another threatens to spill over into a new unprecedented stage of bloodletting."
 spanishvanillaplus.106.a:0 "A messy situation."
 spanishvanillaplus.107.t:0 "Election Campaign: CEDA"
 spanishvanillaplus.107.d:0 "'Give me an absolute majority and I will give you a great Spain!', promise posters of the right-wing CEDA as election season gets into full gear. \n\nThe 'National Bloc' has been formed for the election, an alliance between the CEDA, Carlists and a few other right wing parties. Our campaign has received the backing of the Catholic church and much of the middle class, who the other side seems intent on destroying. \n\nMeanwhile, the voices on the left are hardly comforting, with the thoroughly bolshevized PSOE firebrand Largo Caballero declaring that 'If the right wins the elections, we will have to go straight to open civil war!'. \nThe red cabal they have formed has agreed on nationalising industry, expropriating private land and giving parts of Spain to Catalan separatists if they win. To top it off, they have even promised amnesty to the many traitors and criminals in jail for involvement in the Asturias rebellion! \n\nWe cannot leave the country to these people and the right will campaign its hardest to defend Spain from the 'dictatorship of the proletariat' and violent revolution."
 spanishvanillaplus.107.a:0 "As if elections solve anything."
 spanishvanillaplus.108.t:0 "Election Campaign: The Popular Front"
 spanishvanillaplus.108.d:0 "After three years of right-wing government, the left has got its act together, forming the Popular Front. \n\nThis wide victory coaltion includes the socialist PSOE, the communist PCE, Azaña's Republican Left, the centre-left Republican Union, the Catalan and other regional left wing parties. Though not running themselves, the anarchist movements have agreed to support us with their vote, in exchange for promised amnesties for those in prison from the Asturias uprising and other strikes. The left has never been as united as we are now, resolved to take our country back for its people. \n\nThe Right on the other hand, engages in the usual collusion with anti-progressives, such as the Church, and increasingly, with crypto-fascists. Their election propaganda demonizes us as wanting to 'arm the mob', 'burn down banks and houses' and 'loot and share out their women'. \n\nBehind these lies are their true intentions of continuing to roll back the progress made during the first years of the Republic, leaving country in the hands of obscurantist clerics, landowners and violent reactionaries. \n\nWe are not going back to the Spain of the 1920s."
 spanishvanillaplus.108.a:0 "¡Viva el Frente Popular!"
 spanishvanillaplus.109.t:0 "A Flawed Result"
 spanishvanillaplus.109.d:0 "The vote tally was as follows: \n\nPopular Front: 4,654,116 \nRight: 4,503,524 \nCentre: 400,901 \nBasque Nationalists: 125,714 \n\nWith a bare margin of 150,000 votes, less than 2 percent, the left is out in the streets celebrating the result as a massive mandate to transform the country. Already there are reports of prisons being stormed, unlawfully releasing some of their criminal comrades. \n\nSome of the more hawkish leaders on the right have appealed to President Zamora not to let these people govern by proclaiming a state of emergency. Others, notably the military chief of staff, Franco Bahamonde, has offered the sitting caretaker Prime Minister, Manuel Portela, the support of the army if he just stays where he is. \n\nNevertheless both people have refused the suggestions, and the writing is on the wall: The radicals are about to take over."
 spanishvanillaplus.109.a:0 "We will not take this lying down."
 spanishvanillaplus.110.t:0 "The People's Victory"
 spanishvanillaplus.110.d:0 "A tremendous result for the people of Spain, as the Popular Front has won a thumping majority of 286 of the 473 seats in the Cortes. \n\nThose on the right complaining about slim margins of victory themselves benefited last time from the voting system that gives easy parliamentary majorities to the winning bloc. \n\nNow however, we are faced with the inevitable problem of keeping a coalition together that, beyond its dislike of the right, may find difficulty agreeing on anything else. \n\nFor the time being, however, hundreds of thousands of people across Spain are out in the streets celebrating a decisive win for the liberal, worker and farmer who now have a government that will put their interests first."
 spanishvanillaplus.110.a:0 "The people have spoken. The others must accept it."
 spanishvanillaplus.111.t:0 "Primo de Rivera Arrested and Falange Banned"
 spanishvanillaplus.111.d:0 "Following recent assassination attempts by Falangists against PSOE leader Caballero and Cortes deputy De Asua, the government has outlawed the Falange. \nFurthermore, Jose Antonio de Rivera has been arrested for illegal arms possession and is being kept in an, as of yet, unknown location. \n\nThis may do little however to stem support for the party, whose membership has soared since the last election, amid economic woes and a record 17% unemployment throughout Spain."
 spanishvanillaplus.111.a:0 "An outrage! Another act of tyranny of this rotten red republic!"
 spanishvanillaplus.111.b:0 "Just where the rotten fascist traitor belongs."
 spanishvanillaplus.112.t:0 "Primo de Rivera Speech"
 spanishvanillaplus.112.d:0 "In Seville, Primo de Rivera has given a speech about the current state of politics in Spain following the election: 'We are not here to enter the game of liberal politics. We are here to create something new. The nation must stand above all divisions and reach its destiny.' \n\n'"Spain is a nation that must rise above class struggle, above the chaos of the left and the right. The time has come for a new Spain, a united Spain."' \n\nBoth liberal democracy and Marxism are unfit for purpose, according to the Falangist leader. This week there have been reports of clashes with left-wing opponents in several city suburbs, with hundreds of injuries reported."
 spanishvanillaplus.112.a:0 "Jose Antonio is right."
 spanishvanillaplus.112.b:0 "More incitement."
 spanishvanillaplus.113.t:0 "Political Assassinations"
 spanishvanillaplus.113.d:0 "A wave of political violence has hit parts of the country. \n\nJudge Manuel Pedregal was fatally shot after sentencing a Falange member to a prison term. \n\nThe Falange also claim to have killed two journalists in northern Spain and a military captain in Madrid.  "
 spanishvanillaplus.113.a:0 "Incite violence and you get violence."
 spanishvanillaplus.113.b:0 "Murder! There will be severe repercussions for this."
 spanishvanillaplus.114.t:0 "Concessions to the Left"
 spanishvanillaplus.114.d:0 "The government has announced a range of policies to appease those on the left after criticism that its course was too slow. \n\nMore amnesties have been provided to those imprisoned during the Asturias uprising, as promised during the election. \n\nThe 'Instituto de Reforma Agraria' is overseeing the handover of land to peasants in Andalucia and Estremadura, and the confiscation of land belonging to aristocrats involved in the Sanjurjo rising has also been announced. \n\nThe new Generalitat of Catalonia has been established with promises of more autonomy down the line. President of Catalonia, Lluis Companys, reopened the Catalonian parliament following the announcement."
 spanishvanillaplus.114.a:0 "We built this country, and they're just giving it away!"
 spanishvanillaplus.114.b:0 "We need to keep our election promises, and rally as many people as possible."
 spanishvanillaplus.115.t:0 "Reassign Disloyal Leaders"
 spanishvanillaplus.115.d:0 "The government has embarked on a reorganisation of the military, appointing several new generals to key posts. By contrast, several leaders have been transferred to less critical areas: \n\nGeneral Mola has been reassigned from the Army of Africa to Navarre. General Franco has been sent to the far-off Canary Islands and General Goded to the Balearic Islands. \n\nIt is hoped that stationing these politically unreliable individuals away from centers of power will help stabilise the situation."
 spanishvanillaplus.115.a:0 "They won't get rid of them that easily."
 spanishvanillaplus.115.b:0 "A reshuffle is the best temporary solution here."
 spanishvanillaplus.116.t:0 "Primo de Rivera Speech"
 spanishvanillaplus.116.d:0 "Primo de Rivera and his Falangists have been actively holding party meetings, giving fiery public speeches, guarded by hundreds of armed supporters. \n\n'"We are not a party, we are a movement. A movement that responds to a need, a desire for unity, and a promise of regeneration.' \n\nRegarding accusations of violence committed by him and his supporters, he blames his opponents as being far more violent, while saying that 'violence can be justified when it is used for an ideal that defends the nation and its future'."
 spanishvanillaplus.116.a:0 "Someone who says how it is."
 spanishvanillaplus.116.b:0 "If the street won't do something about this fascist demagogue, then we must."
 spanishvanillaplus.117.t:0 "Political Arrests"
 spanishvanillaplus.117.d:0 "The police have launched a crackdown on suspected Falangists in Madrid, following an attack with submachine guns in the city centre, killing 3 and wounding another 40. \n\nAs a result, hundreds of Falange members have been apprehended, including several founding members. \n\nGiven the charged political environment however, right-wing politicans are crying foul. \The opposition CEDA leader, with dubious sources, has meanwhile claimed that since the current government has come to power, '269 murders, 170 arsons of churches, 133 general strikes and 216 local strikes' have taken place. He claims that there has been a complete breakdown of law and order."
 spanishvanillaplus.117.a:0 "Tyranny for our side, a blind eye for sowers of chaos on theirs."
 spanishvanillaplus.117.b:0 "These violent traitors are going where they belong."
 spanishvanillaplus.118.t:0 "Suppression of Strikes"
 spanishvanillaplus.118.d:0 "Workers trade unions, emboldened by the victory of the Popular Front, have increased the pressure on farm and factory owners by demanding wage increases. As a consequence of refusals, strikes have popped up across the country, with land and factory occupations becoming commmonplace. \n\nIn one such incident in Yeste, after a Guardia Civil member was killed, the force responded by killing 17 labourers. \n\nElsewhere, there are reports of Falangists getting into armed confrontations with striking workers and supporting militias. "
 spanishvanillaplus.118.a:0 "Force is the only antidote to this chaos."
 spanishvanillaplus.118.b:0 "The Guardia Civil shows its true face yet again."
 spanishvanillaplus.119.t:0 "North Secured by Uprising"
 spanishvanillaplus.119.d:0 "Supported by Carlist militias and the Guardia Civil, large parts of northern Spain have now joined the military uprising. Burgos, Pamplona, La Coruña, Leon, Valldolid have all fallen like dominoes after the pro-uprising garrisons took control. \n\nBurgos: local military and Guardia Civil units declared an emergency and swifty took over public buildings and then the civil government headquarters. Local left-wing leaders and trade unions did not know what hit them before it was too late. Burgos is now fit to be our provisional centre in the North. \n\nPamplona: The Carlist stronghold immediately switched to the Nationalists without any encountered resistance. \n\nValladolid: Local militias overcame unprepared pro-Republican forces and quickly seized the rest of the city. \n\nLeon: Early decapitation of Republican leadership as the mayor's residence was surrounded and he was apprehended. Little other resistance was encountered. \n\nLa Coruña: Military garrison, led by General Fanul overthrew the local government and declared martial law. The rest of Galicia was seized with little resistance. \n\nMomentum is with the Nationalist as they progress through the North."
 spanishvanillaplus.119.a:0 "The North is ours!"
 spanishvanillaplus.119.b:0 "Great."
 spanishvanillaplus.119.c:0 "This is insane."
 spanishvanillaplus.119.e:0 "A disaster."
 spanishvanillaplus.119.f:0 "How could the fascists take all of the North so quickly?"
 spanishvanillaplus.119.g:0 "Awful."
 spanishvanillaplus.120.t:0 "Negotiate Carlist Support"
 spanishvanillaplus.120.d:0 "One of the wild cards among the Spanish groups are the Carlists. \n\nThese ultra-Catholic monarchists hope to bring back a Spanish king, not from the same house as the last King, Alfonso XIII, but from the rival Bordonic line of Don Carlos (hence the name 'Carlists'). \n\nTheir heartland in the North of Spain supporting the rebellion would literally be a 'godsend' but is far from a given, as we still do not see eye to eye on what the Spain of thereafter looks like. Nevertheless, these zealots would make for dangerous enemies and they seem to agree with both the military and Falange that the current government needs to go. \n\nAn agreement has finally been struck between General Mola and the Carlists over a meeting in Pamplona, in which they agreed to support the uprising, when it comes, with around 8,000 requetés. \n\nWe have made some powerful allies now, let's not put it to waste."
 spanishvanillaplus.120.a:0 "The monarchists are our natural allies but their fanaticism may be a problem down the line."
 spanishvanillaplus.121.t:0 "The Triumvirate"
 spanishvanillaplus.121.d:0 "With a final confirmation from General Franco, the stage is set. \n\nThe conspiracy against the Republic will be led by the following generals: \n\nSanjurjo, who will leave exile from Portugal to lead the rebellion once the South is taken  \n\nMola, who will lead the rebellion alongside the Carlists in the North, \n\nFranco, who will leave the Canary Islands to take charge of the army of Africa, then support the others by bringing these forces to the mainland. \n\nOutside of these three, General De Llano will attempt to get the garrison in Seville on his side to take the city, as will General Goded in Barcelona. \n\nThough the plan is set, the end goals are not, as we have a broad church of Falangists, monarchists and military pragmatists bound together only by a desire to overthrow the current system. The can of the 'day after' will have to be kicked down the road."
 spanishvanillaplus.121.a:0 "The group of men who will drive out the reds and save Spain."
 spanishvanillaplus.122.t:0 "Abolition of Regionalism"
 spanishvanillaplus.122.d:0 "As we have taken back the regions of the Basque Country and Catalonia, we have released the following decree: \n\n'The entry of our glorious forces into Catalan territory brings to the forefront the importance of reestablishing a public law regime which, in accordance with the principle of national unity, restores to those provinces the honour of being governed on equal footing with their brother provinces in the rest of Spain.' \n\nThe law essentially reverses all of the concessions on autonomy that the Republic irresponsibly granted. \nCatalonia will now have the honour of being governed on an equal footing as the rest of Spain, as will the Basque Country. \n\nSpain is their country, Spanish their language. Our future is their future."
 spanishvanillaplus.122.a:0 "The party is over."
 spanishvanillaplus.123.t:0 "General Mola Killed in Plane Crash"
 spanishvanillaplus.123.d:0 "We have just received the devastating news that General Mola, one of the three leaders of the uprising, has just died in a plane accident near Burgos. \n\nHis plane, an Airspeed Envoy, crashed into a mountainside. His body and the wreckage of the plane were recovered by people from the local town of Alcocero, near the site. \n\nThis loss of one of our most respected and capable leaders will be felt for a while. However, this leaves General Franco as the only surviving member of the original three and undoubtedly as the most senior leader of the Nationalist camp. \n\nGeneral Franco is to lead the funeral in Burgos with thousands of mourners and supporters."
 spanishvanillaplus.123.a:0 "A massive loss for our cause."
 spanishvanillaplus.124.t:0 "Death of General Mola"
 spanishvanillaplus.124.d:0 "General Mola, one of the original leaders of the military uprising and senior general in the Nationalist camp, has just been killed in a plane crash. \n\nWhile flying near Burgos, his Airspeed Envoy hit a mountain. The causes of the crash are yet still unknown. The death of the general, dubbed 'El Director' follows the death of General Sanjurjo at the beginning of the civil war (also in a plane crash). Their deaths now leave General Franco as the only surviving leader of the uprising. \n\nAt Burgos, Generalissimo Franco led the funeral march through the streets while mourners scattered rose petals from balconies as a muted brass band played 'Sueño Eterno'."
 spanishvanillaplus.124.a:0 "The tragic death of a hero."
 spanishvanillaplus.124.b:0 "The tragic loss of a hero."
 spanishvanillaplus.124.c:0 "Another traitor down."
 spanishvanillaplus.124.e:0 "Hopefully this is a blow to their cause."
 spanishvanillaplus.124.f:0 "Another ugly head of the hydra removed."
 spanishvanillaplus.124.g:0 "Another one?"
 
 spanishvanillaplus.125.t:0 "A Tale of Two Police Forces"
 spanishvanillaplus.125.d:0 "Spain's police forces have been divided and the subject of political football since even before the Republic. \n\nKnown traditionally by their distinctive black tricorne hats, the Guardia Civil (Civil Guard) act as the gendarmerie in rural areas. Especially since the Asturias uprising, they have been known to side with right-wing elements and landowners where they are present, frequently placing them in violent confrontation with strikers and rioting peasants. This had led many of the left to consider them the brutal traditional enforcers of Spain's reactionaries.  \n\nFaced with mounting criticism against the Guardia Civil, following numerous bloody incidents, the Republican government founded the Guardia de Asalto (Assault Guards) as an armed urban police force. Over the years, the government has attempted to build up these forces to match the Civil Guard to bring a better balance of forces and increase public trust in the police in Spain's left-leaning cities. \n\nRegardless, the police remains a reflection of its constituents and large-scale unrest may not leave either unscathed by, nor spared from partisan division." 
 spanishvanillaplus.125.a:0 "Another failure of this Republic, that cannot even provide a unified police force."
 spanishvanillaplus.125.b:0 "It is crucial that the Guardia Civil not be left unopposed."
 spanishvanillaplus.126.t:0 "Arming the People"
 spanishvanillaplus.126.d:0 "Despite long-held opposition in government circles to even the prospect, the Republic has bowed to public pressure in places and weapons have started to be handed out to militias of groups friendly to the Republic. \n\nIn Madrid, 20,000 small arms, mostly pistols and rifles, were gathered from army warehouses and distributed by recognised local militia leaders to their members. Many of these people do not have any formal training using firearms, and criticism is still ongoing. \n\nThose parties in favour of the decision, notably the Spanish Communist party, argue that drastic times call for drastic measures."
 spanishvanillaplus.126.a:0 "Government sponsored anarchy in action."
 spanishvanillaplus.126.b:0 "The Republic must be defended by its citizens. They have the most to lose."
 spanishvanillaplus.127.t:0 "Rise of the Falange"
 spanishvanillaplus.127.d:0 "Despite receiving only 46,000 votes and no seats in the Spanish Cortes, the Falange has started growing at a massive pace since the election as former CEDA-backed Accion Popular members have flocked to its ranks. \n\nFounded by José Antonio Primo de Rivera, the Falange or, Falange Española de las JONS (Spanish Falange of the Councils of the National Syndicalist Offensive), is a very conservative paramilitary group that emphasizes an almost mythic vision of Spain and of its place in the world. As such, the party symbol of the 'the yoke of labor and the arrows of power' ('yugo de la labor y las flechas de poderío') hails from Spanish Imperial symbolism. \n\nThough similar in its right-wing and militarist nature to fascist movements in Italy and Germany, its blue-shirted members would reject this label and emphasize their 'revolutionary' outlook, aiming to reorganise Spain along corporatist principles to end the struggles of class warfare. \n\nHowever lofty the party's stated goals are, the group has clearly taken a radical turn since the election, and supporters have engaged in numerous bouts of violence with left-wing opponents, as well as numerous murders against figures they consider the 'enemies of Spain'. \n\nWhatever decision is taken regarding a ban, the Falangists are likely to continue to exist and wage a physical and 'spiritual' war for their ideals throughout the country."
 spanishvanillaplus.127.a:0 "The backlash against anarchy, separatism and class hatred."
 spanishvanillaplus.127.b:0 "Fascism with a Spanish face."
 spanishvanillaplus.128.t:0 "Anarchism in Spain"
 spanishvanillaplus.128.d:0 "In contrast to other European countries, the ideals of Mikhail Bakunin arrived in Spain before the works of Karl Marx did and thus strongly influenced the development of a variety of anti-authoritarian left-wing groups, hostile to any order forced by state power, which others now refer to as 'anarchists'. Many of their supporters though would simply refer to themselves as 'libertarians'. \n\nTheir heartland of support remains undoubtedly in Catalonia, Aragon and Valencia, where their representative trade unions, the CNT and FAI, politically remain a force to be reckoned with. \n\nThough they are bitterly opposed to the 'fascism' of right-wing Spain, they share little love for the obligations and structure of the Republic and its socialist supporters. \n\nAppeasement and non-confrontation has been the dominant approach so far from the central government."
 spanishvanillaplus.128.a:0 "A prehistoric mindset that would destroy Spanish civilisation."
 spanishvanillaplus.128.b:0 "Utopian idealists who might be trouble down the line."
 spanishvanillaplus.129.t:0 "The Socialist/Communist Divide"
 spanishvanillaplus.129.d:0 "The advent of the Third International has also left its trace on Spain. The Spanish Socialist Party (PSOE) and its UGT trade union represents the largest left-wing party in the Popular Front. Under the influence of Caballero, it nevertheless took a hard turn to the left, advocating open acts of class warfare against the right and its middle class supporters, from which the election joke 'Vote Communist to Save Spain from Marxism' arose. \n\nMomentum since the election has however been with the Spanish Communist Party (PCE) whose membership has grown dramatically. Supporters are drawn to its more disciplined ideological stance, influenced by the rally to the Moscow and Comintern line of thought, in contrast to the PSOE or anarchist groups. \n\nThe Catalan regions exhibit their own political spectrum, outside of the anarchist groups and limited support for the PSOE/PCE, as many Catalans favour greater autonomy from the central government and support their own Catalan left-wing movements. \n\nOutside of anarchism, and pro-Moscow communism, there also remains the' Workers' Party of Marxist Unification' (POUM) whose center of support remains in that region. \n\nFor now, the organised left is showing a common front."
 spanishvanillaplus.129.a:0 "Why can't we just get along?"
 
 spanishvanillaplus.130.t:0 "Negotiating with the Nationalists"
 spanishvanillaplus.130.d:0 "The war has turned against the Republic. \nOur original 13 conditions agreed with the government have now been reduced to a mere 3 given how critical the situation is. And de facto, we only really care about 1 of them: that the vanquished be spared of any reprisals. \n\nThe Nationalists have shown no interest in negotiation so far and likely will not now either, as they are on the cusp of victory."
 spanishvanillaplus.130.a:0 "Attempt to negotiate terms."
 spanishvanillaplus.130.b:0 "We shall fight to the bitter end."
 spanishvanillaplus.131.t:0 "Republican Peace Overtures"
 spanishvanillaplus.131.d:0 "The Republican government has approached us via some common backchannels and proposed peace terms. \n\nAt this point, it is unclear what remains to be discussed. We control most of Spain, with that proportion increasing daily. In terms of tolerating the same structures as existed under the Republic, that ship has sailed long ago. \nThere can be no coexistence between Spain and an anti-Spain. \n\nWe broke off the talks fairly early, with a demand for conditional surrender of the remaining Republican forces."
 spanishvanillaplus.131.a:0 "No one can escape destiny."
 spanishvanillaplus.132.t:0 "Negociated Peace Rejected by Nationalists"
 spanishvanillaplus.132.d:0 "The Nationalists have spurned our overtures, saying that "these discussions dishonour us both at this point". \n\nThe only outcome they will accept is our unconditional surrender."
 spanishvanillaplus.132.a:0 "Why did we even bother?"
 spanishvanillaplus.133.t:0 "Cárcel Modelo Incident"
 spanishvanillaplus.133.d:0 "In the midst of the chaos of the uprising across Spain, a violent incident in Carcel Modelo prison in Madrid took place. \n\nFollowing rumours that prisoners were escaping, a group of anarchist militiamen broke in and occupied the prison grounds, where suspected supporters of the Nationalists were being held. Over a number of hours, 30 prisoners, including former government ministers, founding members of the Falange, were killed in cold blood. \n\nThis has caused a massive scandal for the government as law and order is increasingly being put into question in the zone we control."
 spanishvanillaplus.133.a:0 "A public relations disaster."
 spanishvanillaplus.134.t:0 "Law on Political Responsibilities"
 spanishvanillaplus.134.d:0 "War has consequences. The new country we are building will be a hostile one to the reds and to all those that have opposed its establishment. \n\nThe new 'Law of Political Responsibilities' (Ley de Responsabilidades Políticas) has been promulgated which deals with political opponents, making all those who were loyally aligned with the Republic, usually by being members of a party of the Popular Front, up to 18 months preceding the war and onwards, liable to prosecution. \nThis naturally includes those fighting for it now against us, the legitimate government of Spain."
 spanishvanillaplus.134.a:0 "Our opponents will rue the day."
 spanishvanillaplus.135.t:0 "Spanish Exile Government in France"
 spanishvanillaplus.135.d:0 "After the fall of the Spanish Republic, many of its former leaders, including Manuel Azaña, have been given asylum in France. \n\nA Spanish Government-in-Exile has been set up, headed by Diego Martínez Barrio. While we doubt this will come of anything, with Spain firmly in the hand of their opponents, at least they are safe here for now."
 spanishvanillaplus.135.a:0 "Let's see what comes of this."
 spanishvanillaplus.136.t:0 "Republican Exile Government in France"
 spanishvanillaplus.136.d:0 "A 'Spanish Government-In-Exile' has been formed with its seat in Paris. Like rats jumping off a sinking ship, many of the Republic's politicians escaped well ahead of the advance of our forces during the war, including Azaña, Negrín, Prieto, Companys, de Albornoz.  \n\nAlthough some apparently have discussed forming an insurgency, for now most exiles seem content to have evaded their deserved fate at our hands. While they are in France, in the absence of any willingness to extradite them on the part of the French government, we will have to leave them be."
 spanishvanillaplus.136.a:0 "At least they are out of Spain for now."
 spanishvanillaplus.137.t:0 "Spanish Republicans in France"
 spanishvanillaplus.137.d:0 "The longer we are here, the more we see France for the mess it is. It is little wonder that France fell if one takes into account the large number of subversive elements it has present on its soil. \n\nOne such element is the large number of Spanish Bolshevists, many of which escaped to France following the war in Spain, who have set up all sorts of networks and cooperate with resistance groups against our administrations. \n\nAlthough we have imprisoned many, thankfully our Spanish partners have also provided a list of wanted individuals. Naturally, we have obliged by extraditing a few hundred of these, including several leaders of the former Spanish Republic."
 spanishvanillaplus.137.a:0 "Our Spanish friends will be thrilled."
 spanishvanillaplus.138.t:0 "Extradition of Prominent Republicans by Germany"
 spanishvanillaplus.138.d:0 "Our German friends have handed over a number of wanted fugitives, following their occupation of France: At dawn, German authorities handed these wanted persons across the border, including the following individuals: \n\nJulián Zugazagoitia - socialist politician and former Minister of the Interior   \n\nJoan Peiró" - anarcho-syndicalist leader and former Minister of Industry \n\nLluís Companys - separatist politician and former 'President of Catalonia' \n\nNaturally, they have been immediately imprisoned pending a trial. We expect proceedings to be quick, ending in their overdue executions."
 spanishvanillaplus.138.a:0 "Look who's back."
 
 spanishvanillaplus.139.t:0 "Nationalists Take Seville"
 spanishvanillaplus.139.d:0 "Seville has fallen to Nationalist forces after the garrison's pro-Republican leaders were quickly disarmed and arrested. \n\nRapid and brutal action by General Queipo de Llano and his chief of staff, Jose Monereo, allowed the infantry and artillery battalions to switch to the Nationalists quickly, with Falangist sympathisers in the ranks taking command and quick executions of any that refused or hesitated to declare allegiance to the rebellion. \n\nThe Civil Guard in the surrounding countryside joined the rebellion, and any actions by workers opposing the rebellion were quickly preempted. \n\nGeneral de Llano then announced the takeover from over Seville radio and soldiers reportedly sang 'El Novio de la Muerte' while parading through the streets."
 spanishvanillaplus.139.a:0 "Excellent work."
 spanishvanillaplus.139.b:0 "Great."
 spanishvanillaplus.139.c:0 "What? Had we acted quicker this might have been avoided."
 spanishvanillaplus.139.e:0 "A disaster."
 spanishvanillaplus.139.f:0 "The fascists have a major city in their hands."
 spanishvanillaplus.139.g:0 "Awful."
 spanishvanillaplus.140.t:0 "The Army of Africa"
 spanishvanillaplus.140.d:0 "Undeniably the force whose support will make or break any uprising against the government is the Army of Africa, based in Spanish Morocco. \n\nThese colonial forces include at least 15,0000 'Regulares' and 1,500 Ifni Riflemen, both primarily indigenous Morrocan troops, as well as another 12,000 troops under the patronage of the local sultan. \nThese Moors are led by Spanish officers and, apart from by their hardy nature, are also marked by their capacity to live off the land and stealthily move using folds in the ground. \n\nThe Army of Africa crucially also includes the 'Tercio de Extranjeros', or Spanish Foreign Legion, with its 4,000 legionnaires who form the elite of the Spanish army. \n\nThough traditionally made up an assortment of characters, including criminals and fugitives, the Legion cultivates cold hard discipline in its members as well as a cult of 'virility and blood' which has been put to good use in several conflicts in the region. Their trained battle groups, known as 'banderas', as well as their experienced use of mobile artillery should grind whatever the Republic sends against it to dust."
 spanishvanillaplus.140.a:0 "Glory to the heroic Army of Africa!"
 spanishvanillaplus.141.t:0 "More Concessions to the Left"
 spanishvanillaplus.141.d:0 "The Madrid government has unwrapped a new host of measures as a nod to its supporters during the election. \n\nThe Basque country is to receive more rights of self-governance. A Cortes commission, led by PSOE leader Indalecio Prieto is proposing a new charter of autonomy for the Basque Country and Navarre. Followed by similar, more advanced moves for Catalonia, this has incurred the ire of Spain's right wing who see it as another move towards the desintegration of the country. \n\nThe government has also announced its new education policy which foresees the creation of new schools with a secular focus. Religious orders are to be sidelined and banned from teaching children. \n\nLocal efforts to nationalise Church property and convert them into secular Republican schools will be supported by the state. This agenda of greater state-sponsored secularization has already drawn protest from the Vatican."
 spanishvanillaplus.141.a:0 "More treason against the Spanish nation!"
 spanishvanillaplus.141.b:0 "We must rally as many people as possible."
 spanishvanillaplus.143.t:0 "Events at Badajoz"
 spanishvanillaplus.143.d:0 "With the taking of Badajoz, our forces, aided by local Falangist have begun rounding up individuals hostile to the national cause. This hotbed of socialist activism was also the scene of several massacres when this war began, including 56 people burned alive in a church in Fuente de Cantos and the execution of dozens of Nationalist supporters before our arrival. \n\nAround 2,000 of such people were arrested and put in the city's bullring. Orders were then given to shoot all of them at night, leading to the horrific scene of the arena's sand being stained in red. \n\nThese events have occured with an unusual visibility, as numerous war journalists were present and shots were heard by everyone in the city. These gunshots will hopefully ring throughout the rest of Spain as a warning to our oppponents. \n\nFurthermore, Commander Yagüe gave an off-script interview to an American journalist, bluntly answering: 'Of course we shot them. What do you expect? Was I supposed to take 4,000 reds with me as my column advanced, racing against time? Was I expected to turn them loose in my rear and let them make Badajoz red again?'"
 spanishvanillaplus.143.a:0 "Understandable but we are getting sloppy."
 spanishvanillaplus.144.t:0 "Massacre in Badajoz"
 spanishvanillaplus.144.d:0 "The Nationalists have taken Badajoz in Extremadura, a key region of Land Reform efforts for years, and have committed an atrocious massacre of over 2,000 people. \n\nTrade unionists, socialists, intellectuals and liberals loyal to the Republic, or basically anyone pointed as being so by local fascists, were detained in the city's bullring and shot. \n\nThese acts were witnessed by numerous Portuguese and other foreign journalists who have reported extensively on the atrocity. Already, this event has had a serious psychological effect on other cities, as it presumably was meant to."
 spanishvanillaplus.144.a:0 "Unspeakable."
 spanishvanillaplus.145.t:0 "División Azul"
 spanishvanillaplus.145.d:0 "While we have not decided to drag the country into the full hostilities of the ongoing war in Europe, Spain will nonetheless do its part in the fight against Bolshevism. \n\nThe new División Azul ('Blue Division') is made up several thousands of Spanish volunteers, largely committed Falangists, who will militarily support the Reich. \n\nAlthough Spanish government support for these units are obvious, all Spaniards involved have enlisted in a private capacity, allowing a healthy distance from responsibility for their actions. \n\nMany of the division's ranks inclde experienced officers who have been given military leave in order to to participate. \n\nIt is nevertheless fully in our interests for the Russians to be delivered a complete defeat at the hands of the Reich after their sponsorship of communist chaos in our country. For the diehards in its ranks, this is little more than an extension of the Crusade against Bolshevism first fought in their home country."
 spanishvanillaplus.145.a:0 "Rusia es culpable!"
 spanishvanillaplus.146.t:0 "División Azul"
 spanishvanillaplus.146.d:0 "The Spanish government, while choosing to remain officially neutral, has sponsored the establishment of a division of Spanish volunteers to aid in our fight against Eastern Bolshevism. \n\nWe have received word that thousands have already signed up to join ranks with us, in what is increasingly becoming a battle of European civilization. \n\nNaturally, we will aid in training and logistics as we can to make use of their contribution. Our war propaganda has also shed light on these volunteers, wearing the Feldgrau uniforms and swearing their oaths to the Führer, hailing them as the newest joiners in the 'great Crusade'. \n\nPrivately however, it remains to be seen whether the Spanish contingent will make any sort of difference."
 spanishvanillaplus.146.a:0 "Welcome, brothers in arms."
 spanishvanillaplus.147.t:0 "Meeting at Hendaye"
 spanishvanillaplus.147.d:0 "At Hendaye railway station, just across the French border, El Caudillo has met with the German Führer, both accompanied by Foreign Ministers Ramón Serrano Suñer and Joachim Von Ribbentrop. El Caudillo again thanked him for his support in the civil war and communicated his sympathy for the German cause on the continent. \n\nInevitably, Hitler started to discuss whether Spain would join the Axis, promising a number of concessions, including handing Gibraltar to Spain once conquered. \n\nA long back and forth ensued over the 7 hour meeting, with El Caudillo making further requests, ostensibly commensurate with the risk of joining the war, for French Morocco and Algeria, for French Cameroon to be added to Spanish Guinea, and a large amount of aid to speed up Spain's recovery from still recent hostilities. \n\nNeedless to say, talks ended in deadlock given these demands and for now, Spain is remaining outside of the conflict, outside of some vague commitments to enter 'eventually'."
 spanishvanillaplus.147.a:0 "Likely a relief to many."
 spanishvanillaplus.148.t:0 "Meeting at Hendaye"
 spanishvanillaplus.148.d:0 "The Führer has met with Spanish Caudillo Francisco Franco at Hendaye railway station, near the Spanish border. Though talks were initially cordial, they took a hard turn once both, in the presence of Foreign Ministers Suñer and Van Ribbentrop, got down to business. \n\nBeyond the initial offer from the Führer of Gibraltar, Franco made a number of requests in exchange for joining the Axis that verged on extortionate: French Morocco and Algeria, Cameroon, then deliveries of large quanitiries of food, oil and military supplies. It became clear fairly quickly that these were non-starters, and both simply settled for vague assurances for the time being. \n\nAfter returning to Germany, the Führer was asked by an aide whether talks are to continue at a later date and apparently answered: 'I would prefer to have three or four of my own teeth pulled out than to speak to that man again!'"
 spanishvanillaplus.148.a:0 "Unfortunate."
 
 
