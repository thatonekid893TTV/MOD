#Italian Investment #!#
gram_decision_alb_italian_investment:0 "Italian Investment"
gram_decision_alb_italian_investment_desc:0 "Signed on November 27, 1926, the Treaty of Tirana was a pivotal moment in Albania's history, marking the start of significant Italian investments in key industries like textiles and agriculture. This influx of Italian capital and expertise helped modernize the Albanian economy and led to vital infrastructure improvements, such as roads and railways, which enhanced trade and connectivity.\n\nWhile the treaty fostered growth, it raised concerns about Albania's dependence on Italy and potential loss of sovereignty. Nonetheless, it played a crucial role in accelerating Albania's industrialization.\n\n§YINFORMATION§!\n\nUsing this decisions, you can boost the §YIndustrialization§! of §YAlbania§!, for the price of the "level" of your §YIndependence§!. You currently have a §YNational Spirit§!, §YTreaty of Tirana§! which has §Y10§! levels. Each level represents your current §YFreedom§! from §YItalian Influence§!. So it is in your best regards to keep this §YNational Spirit§!, under level §Y8§!. Reason? Well it is simple really. If you don't you will become an §YItalian§! puppet, which isn't really the best thing in the world, to be mostly honest.\n"
increasing_italian_grip_over_our_economy:0 "Increasing Italian Grip over Our Economy"
loan_payment_to_italy:0 "Loan Payment to Italy"
political_correctness_2:0 "Political Correctness"
purchase_italian_guns:0 "Purchase Italian Guns"
request_help_from_italy_for_mineral_excavation:0 "Request Help From Italy for Mineral Excavation"
request_italian_industrial_investment:0 "Requst Italian Industrial Investment"