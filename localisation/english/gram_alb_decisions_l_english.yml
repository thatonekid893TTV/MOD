#Crumbling Nation #!#
gram_decision_alb_crumbling_nation:0 "Crumbling Nation"
gram_decision_alb_crumbling_nation_desc:0 "Yugoslavia is an unstable multi-ethnic state that occupies lands that we consider rightfully ours. By leveraging this ethnic diversity, we could potentially force Yugoslavia to let go of territories of Slovenia, Croatia, Bosnia and Montenegro."
force_the_issue_on_the_serbs:0 "Force the Issue on the Serbs"
force_the_issue_on_the_serbs_desc:0 "Slovenia, Croatia, Bosnia, and Montenegro are economically independent, but their growth is being restrained by Serbia's control within Yugoslavia. If we push Serbia to let go of these countries, it could create opportunities for us to expand."
