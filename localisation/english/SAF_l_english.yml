l_english:
#SAF STUFF
 SAF_organization_of_african_unity:0 "Organization of African Unity"
 SAF_organization_of_african_unity_desc:0 "Until now, freedom from European colonization was seen as a matter of simply gaining independence. However, it seems we are all still potential targets for conquest in the eyes of many leaders outside of Africa. Only by standing together and cooperating can the people of Africa hope to resist ending up as subjects once again."
 SAF_organization_of_african_unity_tt:0 "Unlock decisions to invite independent African countries to the §YOrganization of African Unity§!"
 SAF_executive_council:0 "Executive Council"
 SAF_executive_council_desc:0 "We should push for greater cooperation at the Organization of African Unity by creating an executive body to act on the will of the people and who can respond quickly to threats to stability in our region."
 SAF_executive_council_tt:0 "Unlock decisions to invite §YOrganization of African Unity§! Members to the Executive Council."
 SAF_african_union:0 "The African Union"
 SAF_african_union_desc:0 "The time has come for the people of Africa to be united in an African Union. Never again will we be threatened by imperialists or fascists as we strive to become Africa’s first superpower."
 SAF_african_union_tt:0 "Unlock decisions to integrate §YExecutive Council§! members into the §YAfrican Union§!"
 SAF_african_central_bank:1 "The [ETH_GetCentralBankName]"
 SAF_african_central_bank_desc:1 "With the creation of an [ETH_GetCentralBankName], we could begin the process of integrating the economies within the Organization of African Unity. This would allow us to more efficiently utilize our resources and infrastructure for the betterment of all member states."
 SAF_african_central_bank_tt:1 "Unlock decisions to invite §YOrganization of African Unity§! members to the [ETH_GetCentralBankName]."
 SAF_african_central_bank_2_tt:0 "$MODIFIER_STABILITY_FACTOR$: §G5%§! \n$modifier_production_speed_industrial_complex_factor$: §G10%§! \n$modifier_production_speed_infrastructure_factor$: §G10%§!"
 SAF_mutual_defense:0 "Mutual Defense "
 SAF_mutual_defense_desc:0 "The people of Africa will never have lasting peace until the nations of the world realize the cost of attempting to colonize us is too great. To achieve this, the Organization of African Unity’s members should create a mutual defense agreement, promising to protect each other if any of us are attacked."
 SAF_mutual_defense_tt:0 "Unlock decisions to invite §YOrganization of African Unity§! members into a mutual defense agreement."
 SAF_african_wildfire:0 "African Wildfire"
 SAF_african_wildfire_desc:0 "We successfully overcame the [ITA.GetAdjective] invasion, but we should not rest until all of Africa is liberated from the horrors of colonialism. We should use our skills and resources to fan the flames of resistance across the continent and force the imperialists to withdraw."
 LIB_liberate_the_world:0 "Liberate the World"
 LIB_liberate_the_world_desc:0 "WE MUST LIBERATE EVERYTHING!"