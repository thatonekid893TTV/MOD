l_english:
 romania.7.t:0 "The Romanian Bridgehead"
 romania.7.d:0 "As [POL.GetAdjective] troops are retreating after they have been overwhelmed by [GER.GetAdjective] forces, many of them made it to our border. Both infantry troops and multiple aircraft have entered our territory looking for refuge and we are willing to grant them access to our ports to reach their allies' soil safely. We are willing to help them survive and support them with the essentials, but we want compensation. Our generals are calling for the confiscation of all weaponry and all aircraft in exchange for our help, while many others want to support the Polish fight for freedom by letting them keep the eequipment they managed to secure."
 romania.7.a:0 "We'll take their weapons as compensation."
 romania.7.b:0 "They [POL.GetAdjective] many keep their arms and continue their fight!"
 romania.8.t:0 "Evacuation Through the Romanian Bridgehead"
 romania.8.d:0 "Our [ROM.GetAdjective] friends have held their promise and helped many of our men to safely retreat from the [GER.GetAdjective] advance and board ships sailing towards our allies in the west. But not only have they kept their promise, but they have decided to support our cause by letting us keep our guns and aircraft that were evacuated alongside our troops."
 romania.8.a:0 "They are the best!"
 romania.9.t:0 "Nicolae Ciupercă Retires from Military Service"
 romania.9.d:0 "Nicolae Ciupercă has served his country since the Second Balkan War and has recently been promoted to General de Corp de Armată, but due to recent disagreements with our Conducător Ion Antonescu on how to lead our fight on the [SOV.GetAdjective] front, he has decided to retire from military service altogether. With one of our most competent military leaders gone, the question was raised, about who might step into his place."
 romania.9.a:0 "Sad to lose such a valuable talent."
 romania.10.t:0 "Patriarch Miron of Romania Dies"
 romania.10.d:0 "Patriarch Miron of Romania has died at the age of 70 years old. He has been the patriarch since 1919 and has recently seen a lot of support by King Carol II, but his health has been rapidly deteriorating since January, when he suffered from two heart attacks. After escaping the Romanian winter in Cannes, France, he has now died from bronchopneumonia complicated by his heart disease. His body was sent by train to Bucharest, the funeral train stopping in all stations in Romania to permit believers to pay their last respects and say prayers before the body. Cristea being buried in the Patriarchal Cathedral in Bucharest."
 romania.10.a:0 "May he rest in peace!"
 ROM_cristea_dead:0 "Miron Cristea has died"
 romania.11.t:0 "Armand Călinescu Assassinated"
 romania.11.d:0 "Our prime minister Armand Călinescu has been fatally shot by members of an Iron Guard death squad under direct leadership of Horia Sima. With multiple assassination attempts on him having previously failed, the force he tried to stop so vehemently, has now killed it's biggest adversary. After the murder the assassins reportedly tried to announce Călinescu's death on national radio, but were stopped by local security. With speculations saying that [GER.GetNameDef] both approved and assisted the assassination, this might be the future [GER.GetLeader] has planned for [ROM.GetNameDef]."
 romania.11.a:0 "We have to stop these fascist scumbags!"
 romania.12.t:0 "Legionnaires' Rebellion"
 romania.12.d:0 "Iron Guard Legionnaires in Bucharest with backing by the German Waffen-SS started a violent rebellion against General Antonescu's regime. Since his rise to power with the help of the Iron Guard, Antonescu was slowly decreasing their power, which now culminated in a full-blown rebellion, in which Legionnaires captured the ministry of the interior, police stations and other government and municipal buildings, and opened fire on soldiers trying to regain these buildings. Calling for the people to rise up against the Freemasons and the Jews masses of peasants answered the call flooded the streets of Bucharest.  For two days the Romanian military defended itself and tried to besiege the Legionnaires' strongholds, but did not initiate attacks and gave them a free hand. Parallel to these events one of the bloodiest pogroms in Romanian history was executed in Bucharest, leaving around 125 jews killed in the most cruel ways possible."
 romania.12.d.b:0 "Iron Guard Legionnaires in Bucharest with backing by the German Waffen-SS started a violent rebellion against General Antonescu's regime. Since his rise to power with the help of the Iron Guard, Antonescu was slowly decreasing their power, which now culminated in a full-blown rebellion, in which Legionnaires captured the ministry of the interior, police stations and other government and municipal buildings, and opened fire on police forces trying to regain these buildings. Calling for the people to rise up against the Freemasons and the Jews masses of peasants answered the call flooded the streets of Bucharest. Large parts of the Romanian armed forces seemed to have been in on the plan, as General Antonescu was quickly captured and exiled by his own men. Parallel to these events one of the bloodiest pogroms in Romanian history was executed in Bucharest, leaving over 2000 jews killed in the most cruel ways possible, with many more to follow."
 romania.12.a:0 "We can not trust the Germans!"
 romania.12.b:0 "Long live the National Legionary State!"
 romania.13.t:0 "1937 General Election"
 romania.13.d:0 "Today on the 20th December of 1937 the Romanian people cast their votes. While remaining the biggest party, the National Liberal Party failed to obtain a majority. Ruling out a possible coalition with both their arch-rivals from the National Peasants' Party and the Iron Guard's Everything for the Country Party. Though only coming in fourth place, Carol II now invited the fascist Octavian Goga to form a new government. With many speculating that Carol might use his power to change the government again sooner than later."
 romania.13.d.b:0 "Today on the 20th December of 1937 the Romanian people cast their votes. While remaining the biggest party, the National Liberal Party failed to obtain a majority. Ruling out a possible coalition with both their arch-rivals from the National Peasants' Party and the Iron Guard's Everything for the Country Party. Having previously allied themselves with the Iron Guard, octavian Goga's National Christian Party now stepped forward to form Romania's first fascist government with the help of Carol II."
 romania.13.a:0 "Carol II has to take over quickly!"
 romania.13.b:0 "Romania finds itself on a new course."
 romania.14.t:0 "Romania demands Guarantee"
 romania.14.d:0 "Our relations with Romania have been improving ever since the formalizing of the Balkan Pact, but with tensions rising between [GER.GetNameDef] and [SOV.GetNameDef], [ROM.GetAdjective] representatives have now arrived in Ankara asking for a formal guarantee of military support, in case of an foreign invasion."
 romania.14.a:0 "They shall have their guarantee."
 romania.14.b:0 "That would only put us at unnecessary risk."
 romania.15.t:0 "[From.GetNameDefCap] guarantees Romanian borders"
 romania.15.d:0 "Speaking before a meeting of the Romanian-[From.GetAdjective] Friendship Association, [From.GetLeader] announced that the current borders of Romania are 'unchangeable and permanent', promising that his government would do everything in its power to defend them should war come."
 romania.15.a:0 "Good."
 romania.16.t:0 "[From.GetNameDefCap] refuses Guarantee"
 romania.16.d:0 "Our recent diplomatic offensive has been met with cold rejection by [From.GetNameDef]. Speaking before parliament, [From.GetLeader] stated that the question of a formal guarantee to Romania 'will be decided if and when it becomes relevant'."
 romania.16.a:0 "Harsh."
 romania.17.t:0 "Romania offers Bessarabia"
 romania.17.d:0 "Ever since the Great War we claimed the Romanian regions of Bessarabia and Bucovina. Now that we have allied ourselves with Romania, war is no longer an option, put they have approached us with an mutually beneficial offer. In return for Bessarabia, they demand industrial support and an end to our claim to Bucovina."
 romania.17.a:0 "That sounds fair."
 romania.17.b:0 "We are not willing to pay them!"
 romania.18.t:0 "[From.GetNameDefCap] accepts Proposal"
 romania.18.d:0 "After approaching [From.GetAdjective] officials with an peaceful transfer of the Bessarabia region against industrial support and the end to their claim on Bucovina, we have now received an affirmative answer."
 romania.18.a:0 "We made a good deal."
 romania.19.t:0 "[From.GetNameDefCap] refuses Proposal"
 romania.19.d:0 "After approaching [From.GetAdjective] officials with an peaceful transfer of the Bessarabia region against industrial support and the end to their claim on Bucovina, we have now received an negative answer."
 romania.19.a:0 "Nothing it is!"
 romania.20.t:0 "Romania requests Moldavian ASSR"
 romania.20.d:0 "The Romanian government has approached us with an request to unite the Moldovan population of our nations. After the Great War Romania and Moldova formed an union and with our relations improving steadily, they have now requested for the Moldavian ASSr to join this union. One the one hand we could help out our allies, but on the other we will use a part of our workforce."
 romania.20.a:0 "Less mouths to feed for us."
 romania.20.b:0 "We need every factory we got!"
 romania.21.t:0 "[From.GetNameDefCap] transfers Moldavian ASSR"
 romania.21.d:0 "After approaching [From.GetAdjective] officials with an request to integrate the Moldavian ASSR into our nation, we have received word that our proposal has been accepted by our allies to the east."
 romania.21.a:0 "Good."
 romania.22.t:0 "[From.GetNameDefCap] refuses Moldavian ASSR"
 romania.22.d:0 "After approaching [From.GetAdjective] officials with an request to integrate the Moldavian ASSR into our nation, we have received word that our request has been ruled out by our so-called allies to the east."
 romania.22.a:0 "Harsh."
 romania.23.t:0 "Romania Demands Return of Transylvania"
 romania.23.d:0 "Our ruling of the Second Vienna Award was a major setback for the Romanian government, ultimately leading to the shaking of their entire government. Now that their government has stabilized, they demand the return of their Transylvanian territories as a sign of our support and good will."
 romania.23.a:0 "They are the more useful ally."
 romania.23.b:0 "It is too late."
 romania.24.t:0 "[From.GetNameDefCap] Revokes Second Vienna Award"
 romania.24.d:0 "After meeting with [ROM.GetAdjective] government officials, [GER.GetLeader] announced the revocation of the Second Vienna Award, forcing [HUN.GetNameDefCap] to return their Transylvanian acquisitions to their Romanian allies. This came as a great relief to the [ROM.GetAdjective] government, while the entirety of [HUN.GetNameDef] seems devastated over thsi decision."
 romania.24.a:0 "This is a great day in Romanias history."
 romania.24.b:0 "How could they?!"
 romania.25.t:0 "[From.GetNameDefCap] Refuses Demands"
 romania.25.d:0 "After meeting with [ROM.GetAdjective] government officials, [GER.GetLeader] has decided to continue backing the Second Vienna Award and whith them the Hungarian claim to Transylvania. In an attempt to pursue him, [ROM.GetLeader] had personally approached him asking for the revocation of the Treaty that shattered previous [ROM.GetAdjective] governments."
 romania.25.a:0 "Are they even our allies?"
 romania.26.t:0 "The Danubian Defense League"
 romania.26.d:0 "With [GER.GetAdjective], [ITA.GetAdjective] and [SOV.GetAdjective] ambitions slowly reaching the Balkan peninsula, [ROM.GetAdjective] officials have called for an military alliance to mount a defense along the Danube and it's tributaries to protect Balkan independence. Now they have approached us to join their so-called Danubian Defense League, splitting both our nation and our government whether to join them and potentially become a target or stand alone and hope for appeasement."
 romania.26.a:0 "We stand united."
 romania.26.b:0 "Neutrality is the best defense."
 romania.27.t:0 "[From.GetNameDefCap] agrees to join the Danubian Defense League"
 romania.27.d:0 "The government of [From.GetLeader] has declared its support for the Danubian Defense League. A delegation from [From.GetNameDef] has arrived to discuss the specifics of joining our faction and to organize plans of military support in case of war."
 romania.27.a:0 "Good."
 romania.28.t:0 "[From.GetNameDefCap] declines."
 romania.28.d:0 "Negotiations with [From.GetNameDef] about joining our faction have broken down. The delegation from [From.GetNameDef] have submitted an extensive list of demands as a prerequisite of joining our faction, including far-reaching commitments of military support.\n\nThe General Staff has refused these demands on the grounds that they are impossible to meet, and the Foreign Office now believes that this was a delibirate move by [From.GetLeader] to turn down our offer without appearing responsible for it."
 romania.28.a:0 "How rude."