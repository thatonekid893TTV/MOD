l_english:
 progressive_democrat:0 "Progressive Democrats"
 progressive_democrat_desc:0 "§7Progressive Democrats§! typically align themselves with the New Deal, striving to bring economic and social equality to all Americans through government programs and corporations."
 democrat:0 "Democrat"
 democrat_desc:0 "§BDemocrats§! believe that a large government will help provide for the needs of the people. Many are also staunch anti-socialists, and support a capitalist economy of some sort. Many also support the status quo or are progressive on social issues."
 conservative_democrat:0 "Conservatve Democrats"
 conservative_democrat_desc:0 "§4Conservatve Democrats§! mostly emphasize states' rights, with some being outright sympathethic to the Confederacy of the past. Most either favor the status quo on civil rights or support segregation. In terms of economics, they generally suppport protectionism. They also usually ally with Conservative Republicans to support their agenda."
 liberal_republican:0 "Progressive Republicans"
 liberal_republican_desc:0 "§9Progressive Republicans§! stress the need for civil rights, and are often sympathetic to or support New Deal policies. They are in support of capitalism, but as a result of their stance on New Deal policies they may support welfare programs."
 republican:0 "Republicans"
 republican_desc:0 "§RRepublicans§! largely support free market economics, and are sympathetic or supportive of civil rights movements."
 conservative_republican:0 "Conservative Republicans"
 conservative_republican_desc:0 "§8Conservative Republicans§! are staunch anti-communists who are in overwhelming support of capitalist economics. Some support protectionism, and most are either neutral or in support of civil rights. They also usually ally with Conservative Democrats to support their agenda."
 trumpist_republican:0 "Trumpist Republicans"
 trumpist_republican_desc:0 "§OTrumpist Republicans§! follow the ideas of Donald Trump, a right-wing populist, often following by the slogan, "§RMake America Great Again§!". They often clash with establishment §RRepublicans§!, especially most §3Neo-Conservatives§!..."
 reform:0 "Reform Centrism"
 reform_desc:0 "§0Reform Centrism§! follows the ideas of Ross Perot and his Reform Party. Bipartasian and syncretic, this ideology combines ideas from both the §RRepublican§! and §3Democratic§! parties."
 progressive_independent:0 "Populist Progressivism"
 progressive_independent_desc:0 "§LPopulist Progressivism§! are the populist and progressive ideas followed by former §3Democrat§!, Robert F. Kennedy, JR. Socially Liberal, but anti-establishment, he hopes to unite America against the main two parties."
 neoprogressive_democrat:0 "Neo-Progressive Democrat"
 neoprogressive_democrat_desc:0 "§CNeo-Progressive Democrats§! propose economic and social equality for all, often wishing to implement welfare policies and social reform. They are also very socially liberal, and push for a large government to achieve their goals."
 longism:0 "Longism"
 longism_desc:0 "§5Longists§! are the followers of former Louisiana governor, Huey Long. Longism is a populist movement which strives to bring economic equality to all Americans through wealth taxes and wealth distribution, as part of the "Share the Wealth" program. They are also strict isolationists, hoping to avoid being dragged into foreign wars.
 corporatist_dictatorship:0 "Corporatocracy"
 corporatist_dictatorship_desc:0 "A corporatocracy is a type of government that is solely led by a company and its representatives."
 democratic_socialism_ideology:0 "Democratic Socialism"
 democratic_socialism_ideology_desc:0 "Democratic Socialism is an ideology that supports socialist system, such as worker ownership of industries, but with democratic systems."
 communism:0 "Socialism"
 progressivism:0 "Progressivism"
 progressivism_desc:0 "Progressives stress the need for civil rights, and are often sympathetic to or support New Deal policies. They are in support of capitalism, but as a result of their stance on New Deal policies they may support welfare programs."
 libertarian:0 "Libertarianism"
 libertarian_desc:0 "Libertarians promote small government policies, supporting the abolition of many government programs that they deem unnecessary. Most are capitalist, however a small minority are socialist."
 anarcho_capitalism:0 "Anarcho-Capitalism"
 anarcho_capitalism_desc:0 "Anarcho-Capitalism is an ideology that supports no government with a capitalist system and free markets to maximize what they believe is true capitalism."
