	POLITICS_MIHAI_I_DESC:0 "Shortly after Michael's birth, his father, Crown Prince Carol of Romania, had become involved in a controversial relationship with Magda Lupescu. In 1925, Carol was pressured to renounce his rights to the throne and moved to Paris in exile with Lupescu. In 1927, Michael ascended the throne, following the death of his grandfather King Ferdinand I. As Michael was still a minor, a regency council was instituted, composed of his uncle Prince Nicolae, Patriarch Miron Cristea and the president of the Supreme Court, Gheorghe Buzdugan. The council proved to be ineffective and, in 1930, Carol returned to Romania and replaced his son as monarch, reigning as Carol II. As a result, Michael returned to being heir apparent to the throne and was given the additional title of Grand Voievod of Alba-Iulia."
	POLITICS_TATARESCU_DESC:0 "Gheorghe I. Tătărescu was a Romanian politician who served twice as Prime Minister of Romania, three times as Minister of Foreign Affairs and once as Minister of War (1934). Representing the "young liberals" faction inside the National Liberal Party (PNL), Tătărescu began his political career as a collaborator of Ion G. Duca, becoming noted for his anticommunism and, in time, for his conflicts with the PNL's leader Dinu Brătianu and the Foreign Minister Nicolae Titulescu. During his first time in office, he moved closer to King Carol II and led an ambivalent policy toward the fascist Iron Guard and ultimately becoming instrumental in establishing the authoritarian and corporatist regime around the National Renaissance Front. In 1940, he accepted the cession of Bessarabia and Northern Bukovina to the Soviet Union and had to resign."
	POLITICS_PAWKER_DESC:0 "Ana Pauker (born Hannah Rabinsohn; 13 February 1893 – 3 June 1960) was a Romanian communist leader and served as the country's foreign minister in the late 1940s and early 1950s. Ana Pauker became the world's first female foreign minister when entering office in December 1947. She was also the unofficial leader of the Romanian Communist Party immediately after World War II. Pauker was born into a poor, religious Orthodox Jewish family in Codăești, Vaslui County (in central Moldavia), the daughter of Sarah and (Tsvi-)Hersh Kaufman Rabinsohn. Her father was a traditional slaughterer and synagogue functionary, her mother a small-time food seller. They had four surviving children; an additional two died in infancy. As a young woman, she became a teacher in a Jewish elementary school in Bucharest. While her younger brother was a Zionist and remained religious, she opted for Socialism, joining the Social Democratic Party of Romania "
	POLITICS_GROZA_DESC:0 "Petru Groza (7 December 1884 – 7 January 1958) was an Austro-Hungarian-born Romanian politician, best known as the first Prime Minister of the Communist Party-dominated government under Soviet occupation during the early stages of the Communist regime in Romania, and later as the President of the Presidium of the Great National Assembly (nominal head of state of Romania) from 1952 until his death in 1958.Groza emerged as a public figure at the end of World War I as a notable member of the Romanian National Party (PNR), preeminent layman of the Romanian Orthodox Church, and then member of the Directory Council of Transylvania. In 1925–26 he served as Minister of State in the cabinet of Marshal Alexandru Averescu. In 1933, Groza founded a left-wing Agrarian organization known as the Ploughmen's Front (Frontul Plugarilor). The left-wing ideas he supported earned him the nickname The Red Bourgeois. Groza became Premier in 1945 when Nicolae Rădescu, a leading Romanian Army general who assumed power briefly following the conclusion of World War II, was forced to resign by the Soviet Union's deputy People's Commissar for Foreign Affairs, Andrei Y. Vishinsky. During Groza's tenure, Romania's King, Michael I, was forced to abdicate as the nation officially became a "People's Republic". Although his authority and power as Premier was compromised by his reliance upon the Soviet Union for support, Groza presided over the onset of full-fledged Communist rule in Romania before eventually being succeeded by Gheorghe Gheorghiu-Dej in 1952 and became the President of the Presidium of the Great National Assembly until his death in 1958."
	POLITICS_CAROL_II_DESC:0 "Carol II (3 October 1893 – 4 April 1953) reigned as King of Romania from 8 June 1930 until his forced abdication on 6 September 1940. He was the eldest son of Ferdinand I and became crown prince upon the death of his grand-uncle, King Carol I in 1914. He was the first of the Hohenzollern kings of Romania to be born in the country; both of his predecessors had been born in Germany and only came to Romania as adults. As such, he was the first member of the Romanian branch of the Hohenzollerns who spoke Romanian as his first language, and was also the first member of the royal family to be raised in the Orthodox faith. Carol was also a fan of football, being the Romanian Football Federation's president for almost one year from 1924 until 1925."
	POLITICS_MANIU_DESC:0 "Iuliu Maniu was an Austro-Hungarian-born lawyer and Romanian politician. He was a leader of the National Party of Transylvania and Banat before and after World War I, playing an important role in the Union of Transylvania with Romania. Maniu was born to an ethnic Romanian family in Szilágybadacsony, Austria-Hungary (now Bădăcin, Sălaj County, Romania); his parents were Ioan Maniu and Clara Maniu. He finished the Calvinist College in Zalău in 1890, and studied Law at Franz Joseph University in Kolozsvár (Cluj), then at the University of Budapest and the University of Vienna, being awarded the doctorate in 1896. Maniu joined the Romanian National Party of Transylvania and Banat (PNR), became a member of its collective leadership body in 1897, and represented it in the Budapest Parliament on several occasions. He settled in Blaj, and served as a lawyer for the Greek Catholic Church (to which he belonged). Maniu was influenced by the activity of Simion Bărnuțiu, a maternal uncle of his father, Ioan Maniu."
	POLITICS_ANTONESCU_DESC:0 "A Romanian Army career officer who made his name during the 1907 peasants' revolt and the World War I Romanian Campaign, the antisemitic Antonescu sympathized with the far-right and fascist National Christian and Iron Guard groups for much of the interwar period. He was a military attaché to France and later Chief of the General Staff, briefly serving as Defense Minister in the National Christian cabinet of Octavian Goga as well as the subsequent First Cristea cabinet, in which he also served as Air and Marine Minister. During the late 1930s, his political stance brought him into conflict with King Carol II and led to his detainment. Antonescu nevertheless rose to political prominence during the political crisis of 1940, and established the National Legionary State, an uneasy partnership with the Iron Guard's leader Horia Sima. After entering Romania into an alliance with Nazi Germany and ensuring Adolf Hitler's confidence, he eliminated the Guard during the Legionary Rebellion of 1941. In addition to being Prime Minister, he served as his own Foreign Minister and Defense Minister. Soon after Romania joined the Axis in Operation Barbarossa, recovering Bessarabia and Northern Bukovina, Antonescu also became Marshal of Romania."
	