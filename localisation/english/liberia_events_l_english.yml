l_english:

liberia.1.t:0 "Purchase Foreign Fighters"
liberia.1.d:0 "In order to progress in aero technology we must purchase old planes from the world powers. Who shall we approach?"
liberia.1.a:0 "Britain has always been known for it's superior designs"
liberia.1.b:0 "Germany's Luftwaffe is very impressive"
liberia.1.c:0 "America, we must retain good relations with our motherland"
liberia.1.e:0 "Soviet, to support the working man"

britain.700.t:0 "Liberian Interest in Sierra Leone"
britain.700.d:0 "Liberia has expressed interest in purchasing Sierra Leone. Should we indulge them?"
britain.700.a:0 "Absolutely"
britain.700.b:0 "Absolutely not"

liberia.2.t:0 "Britain Accepts"
liberia.2.d:0 "The United Kingdom has accepted our generous bid for Sierra Leone. It is a great day for Liberia."
liberia.2.a:0 "Excellent"

liberia.3.t:0 "Britain Rejects Deal"
liberia.3.d:0 "Negotiations have broken down in London. It seems Britain is determined to keep their colonial assets."
liberia.3.a:0 "A black day for Liberia"

liberia.4.t:0 "France Accepts Deal"
liberia.4.d:0 "France has accepted our offer for their surrounding lands around our great republic."
liberia.4.a:0 "Wonderful"

liberia.5.t:0 "France Rejects Offer"
liberia.5.d:0 "Negotiations have broken down in Monrovia. France is intent in keeping it's colonial properties."
liberia.5.a:0 "Baguette-Headed fools"


liberia.6.t:2 "[From.GetName] Demands Decolonization"
liberia.6.d:1 "[From.GetNameDefCap] has issued an ultimatum demanding that we immediately grant full independence to our colonial possessions. If we do not, they say they and their allies are resolved to back their demands up by military force..."
liberia.6.a:1 "Then we have no choice."
liberia.6.b:1 "Let them try."

liberia.7.t:1 "[From.GetName] Decolonizes"
liberia.7.d:1 "[From.GetNameDefCap] has decolonized, as per our demands."
liberia.7.a:1 "A colonialized people now taste freedom!"

liberia.8.t:1 "[From.GetName] Refuses Demands"
liberia.8.d:1 "[From.GetNameDefCap] refused our demands to decolonize."
liberia.8.a:1 "War it is, then."

liberia.12.t:0 "[?global.african_supporting_country.GetNameDef] Requests Recognition of [?global.african_revolt_country.GetNameDef]"
liberia.12.desc:0 "[?global.african_supporting_country.GetLeader], the leader of [?global.african_supporting_country.GetNameDef], has requested an immediate end to the war with the [?global.african_revolt_country.GetAdjective] rebels. The [?global.african_supporting_country.GetAdjective] diplomats encourage [ROOT.GetName] to recognize the independence of [?global.african_revolt_country.GetNameDef]. They don't explicitly state that [?global.african_supporting_country.GetNameDef] will go to war should we decide to refuse, but they clearly hint at the possibility."
liberia.12.a:0 "They are right, we should end this colonial conflict now"
liberia.12.b:0 "The war will end when [?global.african_revolt_country.GetNameDef] is defeated"

liberia.13.t:0 "[?global.african_supporting_country.GetAdjective] Mediation Successful!"
liberia.13.desc:0 "[?global.african_supporting_country.GetLeader], the leader of [?global.african_supporting_country.GetNameDef], has successfully negotiated with [?global.african_colonial_country.GetLeader] on our behalf. [?global.african_colonial_country.GetLeader] has agreed to recognize [ROOT.GetAdjective] independence and ordered a cessation of hostilities between [?global.african_colonial_country.GetNameDef] and [ROOT.GetNameDef]. [ROOT.GetNameDefCap] will always be indebted to [?global.african_supporting_country.GetNameDef] for their help in our struggles."
liberia.13.a:0 "Liberty at last"

liberia.14.t:0 "[FROM.GetNameDefCap] Refuses to Recognize [?global.african_revolt_country.GetAdjective] Independence"
liberia.14.desc:1 "Despite our pressure, the [?global.african_colonial_country.GetAdjective] government refuses to recognize [?global.african_revolt_country.GetNameDef] and cease hostilities. The [?global.african_colonial_country.GetAdjective] seem set on destroying the independence movement. This is probably as far as we can get with diplomacy alone."
liberia.14.a:0 "We tried at least"
liberia.14.b:0 "Then we have to make them"

liberia.15.t:0 "[FROM.GetName] Joins the War Against [?global.african_colonial_country.GetName]"
liberia.15.desc:1 "After having attempted at mediation in our war against [?global.african_colonial_country.GetNameDef] and failed, [?global.african_supporting_country.GetNameDef] has decided to actively start supporting the [ROOT.GetAdjective] struggle. The [?global.african_colonial_country.GetAdjective] ambassador to [?global.african_supporting_country.GetName] has been informed that [?global.african_supporting_country.GetNameDef] considers itself at war with [?global.african_colonial_country.GetName] from this point on, until the moment that [?global.african_colonial_country.GetNameDef] gives up it's imperialist and colonial ambitions in Africa and elsewhere."
liberia.15.a:0 "The forces of [ROOT.GetName] and [?global.african_supporting_country.GetName] stand united!"

liberia.16.t:0 "Freedom for [FROM.GetNameDef]"
liberia.16.desc:1 "After heavy diplomatic pressure from [ROOT.GetName], including direct meetings between [ROOT.GetLeader] and [?global.african_colonial_country.GetLeader], the [?global.african_colonial_country.GetAdjective] government decided to back down, and recognize [?global.african_revolt_country.GetAdjective] independence. \nThanks to direct [ROOT.GetAdjective] intervention, the war for [?global.african_revolt_country.GetAdjective] independence is finally over. [?global.african_revolt_country.GetNameDefCap] is a free country, and [ROOT.GetLeader] will surely for ever be a hero in [?global.african_revolt_country.GetNameDef]."
liberia.16.a:0 "Another country liberated from the imperialists"

 liberia.17.t:0 "Fourth International or London Bureau?"
 liberia.17.d:0 "[ROOT.GetLeader] seeks to solidify the internationalist stance of the [ROOT.GetCommunistParty] and promote world revolution by aligning with other Marxist parties in the form of an international. Should [ROOT.GetNameDef] look towards the Trotskyists of the Fourth International or the International Revolutionary Marxist Centre, the so-called 'London Bureau'?"
 liberia.17.a:0 "The Fourth International"
 liberia.17.b:0 "The London Bureau"

 liberia.18.t:0 "Thomas J. R. Faulkner Passes Away"
 liberia.18.d:0 "President Thomas J. R. Faulkner has died after a period of declining health. His tenure was marked by efforts to navigate Liberia’s complex position between tradition and modernity, as well as by cautious attempts to assert national independence amid growing foreign influence. With his passing, the question of succession has been swiftly resolved—C. Frederick Taylor, publisher of 'The African Nationalist' and a figure known for his pan-African views, has assumed the presidency to guide the nation through uncertain times."
 liberia.18.a:0 "Taylor takes up the mantle of leadership."

 liberia.19.t:0 "The Death of Thomas J. R. Faulkner"
 liberia.19.d:0 "Thomas J. R. Faulkner has passed away. Once a reformer and outspoken critic of the True Whig establishment, Faulkner will be best remembered for exposing the forced labor and quasi-enslavement practices of the King administration—acts that brought international scrutiny upon Liberia and briefly shook the foundations of the Americo-Liberian elite. An engineer by training and a patriot by conviction, he devoted much of his life to improving infrastructure and promoting self-reliance among the Liberian people. Faulkner’s principled defiance and technical acumen will leave an indelible mark on the nation’s political conscience."
 liberia.19.a:0 "A reformer’s voice is silenced."

 liberia.20.t:0 "Thomas J. R. Faulkner Endorses 'The African Nationalist'"
 liberia.20.d:0 "Word has arrived that Thomas J. R. Faulkner, the former presidential candidate and outspoken critic of the True Whig oligarchy, has offered his support to 'The African Nationalist' movement. A trained engineer and tireless reformer, Faulkner gained renown for exposing the forced labor and virtual enslavement practiced under the King/Yancy administration—an act that brought shame upon the ruling elite and international scrutiny to Liberia’s governance. His endorsement lends the movement a weight of experience and integrity that few in Monrovia can match.\n\nC. Frederick Taylor, publisher of 'The African Nationalist', has thus far guided the cause as a journalist and agitator. Now, with Faulkner’s prestige and leadership on offer, the movement stands at a crossroads: will it rally around the elder reformer as its political figurehead, or remain under Taylor’s direction?"
 liberia.20.a:0 "Faulkner’s leadership will give the movement legitimacy."
 liberia.20.b:0 "Taylor has carried the banner this far — he shall remain in charge."



france.780.t:0 "Liberian Interest in our Territories"
france.780.d:0 "Liberia in it's newfound economic prosperity has expressed interest in buying our surrounding territories. Should we indulge them?"
france.780.a:0 "We could use the money"
france.780.b:0 "That territory is far too important right now"

 liberia_news.1.t:0 "[From.GetName] Demands Decolonization"
 liberia_news.1.desc:0 "The [From.GetAdjective] government has issued an ultimatum to all colonial powers, demanding the immediate withdrawal from their colonies and granting full independence. They have indicated the willingness of a united Africa to back up these demands with the use of military force, if needed."
 liberia_news.1.a:0 "The united spear of the nations of Africa speak with one voice."
 liberia_news.1.b:0 "We have a decision to make..."
 liberia_news.1.c:0 "Who do the Liberians think that they are dealing with?"

liberia_elections.1.t:0 "Uncontested Election in Liberia"
liberia_elections.1.desc:0 "The 1939 elections have concluded without opposition, securing another term for Edwin Barclay. His first term had been extended beyond the usual four years by special decision, delaying elections until now. With this vote, Liberia returns to a standard four-year electoral cycle, with the next election scheduled for 1943. However, with the True Whig Party’s continued dominance, whether future elections will bring real competition remains to be seen."
liberia_elections.1.a:0 "Another term for Barclay."

liberia_elections.2.t:0 "Elections in Liberia"
liberia_elections.2.desc:0 "The 1939 elections have brought a rare moment of genuine competition. Incumbent President Samuel David Coleman, having risen to power through political maneuvering, now faces a serious challenge from reformist Didwho Welleh Twe and the True Whig Party’s longtime leader, Edwin Barclay. The outcome will determine the direction of Liberia’s future—whether it continues under Coleman, embraces Twe’s reforms, or returns to Barclay’s established rule."
liberia_elections.2.a:0 "Samuel David Coleman"
liberia_elections.2.b:0 "Didwho Welleh Twe"
liberia_elections.2.c:0 "Edwin Barclay"

liberia_elections.3.t:0 "Elections in Liberia"
liberia_elections.3.desc:0 "The True Whig Party has nominated William Tubman as its candidate, continuing its dominance over Liberian politics. His opponent, the Democratic Party’s James F. Cooper, represents the interests of Liberia’s wealthiest elite and challenges the status quo. However, Tubman’s victory would not only secure his presidency but also restore the extended eight-year term, a practice previously justified under special circumstances. The outcome of this election will determine whether Liberia continues under the TWP’s firm control or takes an uncertain new path."
liberia_elections.3.a:0 "William Tubman"
liberia_elections.3.b:0 "James F. Cooper"

liberia_elections.4.t:0 "Elections in Liberia"
liberia_elections.4.desc:0 "With Liberia once again heading to the polls, the political landscape remains in flux. Samuel David Coleman, Didwho Welleh Twe, and James F. Cooper each offer distinct visions for the nation's future. Coleman, a key figure in past administrations, seeks to consolidate his influence. Twe continues to push for reform, rallying his supporters behind a more inclusive Liberia. Meanwhile, Cooper, representing the wealthiest layer of Americo-Liberians, aims to make a bid for political power. The outcome of this election will determine the direction of Liberia for years to come."
liberia_elections.4.a:0 "Samuel David Coleman"
liberia_elections.4.b:0 "Didwho Welleh Twe"
liberia_elections.4.c:0 "James F. Cooper"

liberia_elections.5.t:0 "Elections in Liberia"
liberia_elections.5.desc:0 ""With Liberia set to hold another election, the nation prepares for another contest over its future. The incumbent seeks to maintain stability and continue their policies, but challengers argue for a different course. The results of this election will shape Liberia’s trajectory in the coming years."
liberia_elections.5.a:0 "Samuel David Coleman"
liberia_elections.5.b:0 "Didwho Welleh Twe"
liberia_elections.5.c:0 "James F. Cooper"
liberia_elections.5.d:0 "William Tubman"
