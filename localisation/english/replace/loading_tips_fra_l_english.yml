l_english:
LOADING_TIP_154:0 "I don't think the Germans ever thought of attacking in the Sedan area.\n- Charles Huntziger(May 7, 1940)"
LOADING_TIP_155:0 "Very serious enemy effort towards the Meuse.\n- Air Force Intelligence Report(May 12, 1940)"
LOADING_TIP_156:0 "The Frenchman really looks like he's been abandoned by all the right minds, otherwise he could and should have prevented this.\n- Fedor Von Bock(learning of the Sedan breakthrough)"
LOADING_TIP_157:0 "It's all a matter of hours.\n- Maurice Gamelin (about the outbreak of the Allied counterattack, which will not take place until three days later)"
LOADING_TIP_158:0 "Lieutenant, are you happy with me?.\n- The last words of a French gunner from the 237th heavy artillery regiment, with both legs blown off and on the verge of death"
LOADING_TIP_159:0 "The war started off very badly. It must therefore continue...\n- Charles de Gaulle"
LOADING_TIP_160:0 "France lost a battle, but France didn't lose the war.\n- Charles de Gaulle"
LOADING_TIP_161:0 "It is with a heavy heart that I tell you that the fight must be stopped.\n- Philippe Pétain"
LOADING_TIP_162:0 "I accept the heavy load you are asking me to take on. I will do what I can, but I cannot guarantee success.\n- Maxime Weygand (to Reynaud when he replaces Gamelin as Generalissimo, May 19, 1940)"
LOADING_TIP_163:0 "The French troops fought like lions!\n- Walter von Reichenau"
LOADING_TIP_164:0 "It will absolutely be necessary for us, after the war, to forge an alliance capable of containing a country capable of military prowess which astonishes the world as in Bir Hakeim.\n- Adolf Hitler"
LOADING_TIP_165:0 "There are three battles I will never forget: Stonne, Stalingrad and Montecassino.\n- Paul Wagner"
LOADING_TIP_166:0 "Despite our overwhelming numerical superiority, the French are counter-attacking at several points. I don't understand how these soldiers, sometimes fighting 1 in 20, find the strength to storm.\n- Georg von Küchler,(Dunkirk)"
LOADING_TIP_167:0 "We received bad news, bad news all the time. An incredible atmosphere, a kind of moral wear and tear, after this accumulation in eight days of catastrophic news.\n- André Beaufre, (France 1940)"
LOADING_TIP_168:0 "Never interrupt your enemy when he makes a mistake.\n- Napoléon Bonaparte"
LOADING_TIP_169:0 "if you build an army of 100 lions and their leader is a dog, in any fight, the lions will die like a dog. BUT if you build an army of 100 dogs and their leader is a lion, all dogs will fight like a lion.\n- Napoléon Bonaparte"
LOADING_TIP_170:0 "I'm worried. Now we'll see what Gamelin is worth.\n- Paul Reynaud (May 10, 1940)"
LOADING_TIP_171:0 "Ah! The fools! If only they knew...\n- Édouard Daladier (on the people's reaction to the Munich Conference)"
LOADING_TIP_172:0 "There is no armistice, no suspension of arms. The battle goes on.\n- Benoit Besson (after the announcement of an armistice)"
LOADING_TIP_173:0 "As long as we demolish the army, I'm in.\n- Léon Blum (voting against the production of tanks in the year 1934)" 
LOADING_TIP_174:0 "On this tenth day of June, 1940, the hand that held the dagger has struck it into the back of its neighbor..\n- Franklin Roosevelt (after the declaration of war of Mussolini)"
LOADING_TIP_175:0 "We are heading towards a new Sedan and even more terrible than that of 1870.\n- Gaston Bilotte"
LOADING_TIP_176:0 "If the Germans really gave me the pleasure of attacking, I would offer them a billion francs.\n- Maurice Gamelin"
LOADING_TIP_177:0 "It is the life of France that is at stake in this battle, the whole of Western civilization, the fate of the small powers, the dignity of man. Stop first, beat later.\n- Maxime Weygand"
LOADING_TIP_178:0 "Dangerous, but precious. And with an enormous quality: knowing how to do his job without talking about it, without being talked about.\n- Georges Clémenceau (about Weygand)"
LOADING_TIP_179:0 "We are not prepared to allow Strasbourg to come under German cannon fire.\n- Albert Sarraut (after the remilitarization of the Rhineland)"
LOADING_TIP_180:0 "When we have reduced our armaments, she will impose what she wants: the Saar, Anschluss, eastward expansion, Alsace, etc.\n- Maxime Weygand"
LOADING_TIP_181:0 "We're just beginning to realize that an armistice is not negotiable.\n- Camille Chautemps"
LOADING_TIP_182:0 "We must banish the idea of a defensive military state, a term to which I can think of no equivalent other than impotence, a concept which may be attractive because it favours less effort, but which postulates defeat and the estrangement of our friends.\n- Weygand (La France est-elle défendue ?, 1937)"
LOADING_TIP_183:0 "For the brave, the gun is just the handle of the bayonet !\n- Napoléon Bonaparte"
LOADING_TIP_184:0 "The heroic resistance of the French army saved the British and allowed them to continue the war"\n- Winston Churchill"
LOADING_TIP_185:0 "Let's also hope that our country will stop sliding downhill and start climbing back up again. In this respect, the year 1938 opens under very gloomy skies."\n- André Corap"
LOADING_TIP_186:0 "Gamelin is like our pillboxes. The arrows I send him ricochet."\n -Pierre Héring"
LOADING_TIP_187:0 "With General Weygand at the head of our armies, it's the soul of Foch that inspires resistance and exalts the will to win.\n-Le Temps newspaper"
LOADING_TIP_188:0 "An optimist is a man who plants 2 acorns and bags a hammock.\n-Jean de Lattre de Tassigny"
LOADING_TIP_189:0 "I hate the lies that have done you so much harm.\n-Philippe Pétain"
LOADING_TIP_190:0 "It is me alone that History will judge.\n(Philippe Pétain)"