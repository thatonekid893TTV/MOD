l_english:
#Albania Yields - Italian Event
 italy.1.t:0 "[ALB.GetName] Yields"
 italy.1.d:1 "The [ALB.GetName] has agreed to our demands, and [ALB.GetLeader] has been forced to be put out of power. From now and until the end of time, [ALB.GetName] shall be Italian!"
 italy.1.a:0 "A glorious day."

#Albania Rejects Ultimatum - Italian Event
 italy.2.t:0 "[ALB.GetLeader] Rejects the Ultimatum"
 italy.2.d:0 "Defiant to the last, [ALB.GetLeader] has rejected our ultimatum. [ALB.GetLeader] is now trying to scrape together whatever pitiful defenses [ALB.GetName] can muster. We must occupy them and put an end to this farce!"
 italy.2.a:0 "We could have done this the easy way, [ALB.GetLeader]!"

#Italian Ultimatum - Albanian Event
 italy.3.t:0 "Italian Ultimatum"
 italy.3.d:0 "Italian diplomats have presented an ultimatum to us demanding that we submit to their occupation! [ALB.GetName] is to be ruled in a personal union under the Italian king!"
 italy.3.a:0 "We must submit."
 italy.3.b:0 "It shall not come to pass! Rally to [ALB.GetLeader]!"

#Albanian Submission - Global Event 
 news.22.t:1 "[ALB.GetLeader] Submits to Italy"
 news.22.d:2 "An ultimatum has been delivered to the [ALB.GetName] government by Italian diplomats, demanding that they submit to complete military occupation. \n\n[ALB.GetLeader] was put out of power, and Albania will now be ruled in a personal union under King Vittorio Emanuele III.\n\n[ITA.GetNameDef] looks to the Balkans..."
 news.22.a:1 "Another victim of Italy's ambitions."
 news.22.b:0 "We are one step closer towards realizing our grand empire."
 news.22.c:0 "Another victory for our friend [ITA.GetLeader]!"

#Albania Holds Back - Global Event
 news.23.t:0 "[ALB.GetLeader] Reject's Italian Demands"
 news.23.d:0 "Diplomats from [ITA.GetNameDef] have delivered an ultimatum to [ALB.GetNameDef], demanding the latter's annexation into Greater Italy. \n\nIn a brave act of national leadership, [ALB.GetLeader] has refused to yield to the Italian demands, urging the Albanian people to resist pressure from [ITA.GetNameDef]. \n\nNevertheless, foreign military experts agree that [ALB.GetNameDef] has little chance of resisting an invasion."
 news.23.a:0 "For how long can [ALB.GetNameDef] fight back?"
 news.23.b:0 "This will be a short campaign."
 news.23.c:0 "Long live ,[ALB.GetLeader]!"