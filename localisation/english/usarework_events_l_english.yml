l_english:
 usarework_election.t: "The Election of [GetYear]"
 usarework_election.desc: "The Election of [GetYear] has arrived. Tens of millions of voters head to the ballot box to cast their vote. However, only one party can win. Who will it be?"
 usarework_election.a: "The £party_usa_democrats §2Democratic Party§!"
 usarework_election.b: "The £party_usa_republicans §tRepublican Party§!"
 stability_pp_moddifier_dependent: "§HWe will gain or lose stability and political power dependent on which party has§! §Gmore§! §Hsupport.§!"

 democrat_nomination.t: "The Democrat Nomination of [GetYear]"
 democrat_nomination.desc: "Democrat delegates from around the country arrive at the convention center. There are many options, but there can only be one candidate."
 republican_nomination.t: "The Republican Nomination of [GetYear]"
 republican_nomination.desc: "Republican delegates from around the country arrive at the convention center. There are many options, but there can only be one candidate."
 nomination_warning: "§RThis WILL decide which candidate this party will have in the presidential election of [GetYear]§!."

 intro_event.t: "Welcome to GermanyLuxembourg's USA Rework!"
 intro_event.desc: "Thank you for playing my mod! Please, enjoy the game!\nOh! And if you enjoy HOI4 timelapses, check out my YouTube channel, GermanyLuxembourg Deluxe!"

 althist_options.t: "Alternate History Choices"
 althist_options.desc: "Here are the alternate history choices. Enjoy!"

 future_democrat_nomination.t: "The Democrat Nomination of [GetYear]"
 future_republican_nomination.t: "The Republican Nomination of [GetYear]"
 future_nomination.desc: "An odd event has occured as all of the current presidential candidates have dropped out.\nThankfully, some... interesting? Offers have come up."

 gridlocked_election.t: "Congress Unable to Select President!"
 gridlocked_election.desc: "Congress has been unable to select a president due to the chaos. So far, FDR will stay as president. This has caused many to get angry, especially from the third-party voters. Only time can tell what will happen next..."

 macarthur_coup_plan.t: "MacArthur Offers A Plan"
 macarthur_coup_plan.desc: "MacArthur has offered to take over the governent in case of increased tensions within the country.\nOf course, this meeting is top secret, but this could be important in the future..."
 accept_coup_warning: "§ROur democratic institutions may fall apart.§!"
 reject_coup_warning: "§ROur country may fracture into a civil war.§!"

 macarthur_coup.t: "MacArthur takes over the Government!"
 macarthur_coup.desc: "With the country falling apart and the situation refusing to get better, MacArthur has decided to take over the government."

 pickside.t: "Congress Declares National Emergency"
 pickside.desc: "Congress has declared a national emergency and is now considering martial law as the only option to stamp out these riots that are hampering our nation.\nThey have already started to consolidate power..."
 pickaside_progs: "§RThis will cause you to take the side of the Progressives and Socialists!§!"
 pickaside_cong: "§RThis will cause you to take the side of the Congress!§!"

 unionstrike.t: "The Great Strike of [GetYear]"
 unionstrike.desc: "The economy has come to a screeching halt following a nationwide strike, led by progressive labor unions. They demand the government to stop their autocratic intentions.\nThe ball is in Congress' court now..."

 congress_takeover.t: "Congress Passes the Emergency Powers Act"
 congress_takeover.desc: "Today, House Speaker William B. Bankhead and President of the Senate (a.k.a. Vice President), John Nance Garner announced the passing of the Emergency Powers act, essentially making the President of the Senate the sole legal authority over the United States in a last ditch attempt to rescue the nation. The means of "fixing" this country are certainly questionable, no doubt, but the President has decided to keep his lips sealed on this one"

 colonies_break.t: "Territories Break Free!"
 colonies_break.desc: "All of our colonies and territories have broken free from our country as a result of the recent congressional "coup". Governors have stated that they do not want to be dragged any longer into the political violence that is ravaging our country.\nHowever, the territory of Alaska has been siezed by the Canadians and many of our Pacific possessions by Japan, and the British have seized the Panama Canal."

 militias_mobilize.t: "Militias Mobilize"
 militias_mobilize.desc: "Militias on both sides have begun to mobilize and factions are starting to form in the military."
 
 2uscw.t: "A House Divided"
 2uscw.desc: "At 9:43 AM, progressive-aligned militias in Washington began to rebel against the government, until eventually being put out. However, similar reports of insurgencies have been reported across the country, with it all culminating with William Borah declared leader of the insurgency, and declaring that an armed conflict has begun."
 2uscwend.t: "The Second United States Civil War Ends!"
 2uscwend.desc: "Finally, the United States has finally ended its civil war as fighting has finally ended. Now, the new regime must focus on fixing the country."

 leader_question.t: "The Leadership Question"
 leader_question.desc: "Some have questioned if Garner should be replaced as leader of our country, however some say he is capable enough."
 select_king.t: "Selecting a King"
 select_king.desc: "You can't have a kingdom without a king. Well, unless you're Hungary. Anyway, we must select a King to fill the throne. Thankfully, many have offered to take the position."
 usa_king.t: "The American Candidates"
 usa_king.desc: "Many Americans have offered to become king. But in reality, there are only two realistic options."
 uk_king.t: "The British Candidates"
 uk_king.desc: "The Windsors are the obvious choice here, but should we pick the former king, or his wife?"
 de_king.t: "The German Candidates"
 de_king.desc: "The Hohenzollerns are the obvious choice here, but should we pick the former Kaiser's son, or his daughter?"
 kingdom_of_america.t: "Establishment of an American Monarchy"
 kingdom_of_america.desc: "An American monarchy has now been established, with a constitutional monarch, who has power, but limited by Congress. A new flag has been risen over Washington, as well as a new system."
 democratic_opposition.t: "Democrats and Republicans Unite!"
 democratic_opposition.desc: "In response to the establishment of an American Monarchy, the Republican and Democratic parties have united into one, electing Earl Warren as their leader."
 corrupt_deals.t: "The Advisors' Suggestions"
 corrupt_deals.desc: "Some congressmen have met with the President, telling him that if he wants to truly wants to make corporatism work, he must work especially with one of the three "big companies".\nHowever, they do seem a little fishy."
 companies_meeting.t: "Companies Meet with Garner"
 companies_meeting.desc: "Today, representatives of the Coca-Cola, Walt Disney, and Ford Motor Companies have meet with President Garner to collaborate with the government even more. Unfortunately, we can only pick one."
 
 prog_convention_1.t: "The Progressive Convention of [GetYear]"
 prog_convention_1.desc: "Today marks the beginning of the Progressive Convention, essentially the event that will form the future government.\nIt has come to our attention that the Communists want to work with us. What do we say?"
 prog_convention_2.t: "Communists Attempt a Coup!"
 prog_convention_2.desc: "Furious with the lack of a common ground, many Communists have taken arms and have stormed the convention!"
 prog_convention_3.t: "[USA.GetLeader] Criticises Convention Result!"
 prog_convention_3.desc: "Our president, [USA.GetLeader], has refused to accept the convention results. As a matter of fact, he says he will refuse to let our candidate be elected!\nHowever, our insiders have found out that he won't really put up a resitance."
 prog_convention_4.t: "The Communists Select a Candidate!"
 prog_convention_4.desc: "Unsuprisingly, the Communists have been quick to announce their selection of Earl Browder as the President."
 prog_convention_5.t: "Choosing the President"
 prog_convention_5.desc: "After a near-coup by the Communists, the people can select the next president of the country. Who will it be?"
 prog_convention_6.t: "[USA.GetLeader] Inagurated as President!"
 prog_convention_6.desc: "This morning, [USA.GetLeader] has officially been inagurated as president. During his half-hour long speech, he announced his plans for the nation and how he would fix it.\nThe nation hopes for a great future with our president."
 prog_convention_7.t: "The Great Compromise"
 prog_convention_7.desc: "Today both communists and progressives alike have meet at the Progressive Convention. Fierce negotiations between both sides took place, and it went well into the night. Thankfully, the both sides were able to come to a compromise and a certain Norman Thomas was chosen.\nA moderate democratic socialist and member of the former Socialist Party of America, he will hopefully be able to appease both sides and unite the nation."
 fate_corporate.t: "Fate of the Corporations"
 fate_corporate.desc: "The largest and most powerful conglomerates of our country have a heavy influence on the government. Ever since our great revolution, this cannot be tolerated.\nTherefore, we must decide their fate."
 future_of_france.t: "The Future of the New France"
 future_of_france.desc: "With France now under our control, we must purge the old government and create a new government. What shall we do?"
 
 liberia_colony.t: "America Demands Our Submission!"
 liberia_colony.desc: "An American delegation has arrived today stating that we must return to our colonial status under them.\nThey state that non-compliance will be met with force."
 german_unity.t: "German Unity Question"
 german_unity.desc: "[USA.getnameDEF] has asked for us to join a great them for a great German-American state!"

 integrate_us.t: "[USA.getnameDEF] Wants Us to Reunite With Them!"
 integrate_us.desc: "[USA.getnameDEF] has sent a delegate to us, suggesting that we should rejoin them, so our people can be prosperous, and so we can be on the right side of history."
 demand_claimed_lands.t: "[USA.getnameDEF] Wants Their Claimed Lands Back!"
 demand_claimed_lands.desc: "[USA.getnameDEF] has sent a delegation to our government saying that they wish for their former lands that we occupied to be given back.\nRefusal, he said, could be met with war..."
 regain_philippines.t: "[USA.getnameDEF] Offers Protection!"
 regain_philippines.desc: "[USA.getnameDEF] wants us to return to be under their protection! Chances are, that if we decline war will me imminent..."

 corporations_problem.t: "The Problem of the Corporations" 
 corporations_problem.desc: "Questions have arisen among the leadership of the party. What will be the fate of the large companies? We do not know..." 

 no_neutrality.t: "Abandonment of Neutrality"
 no_neutrality.desc: "The outbreak of war has forced us to rid of our neutral policies. Therefore, the effects of the Neutrality Act have been nullified."
 germany_triumph.t: "Triumph over Germany"
 germany_triumph.desc: "War has ended in Europe as the final German forces have surrendered. What happens next... who knows?"
 pearl_harbour.desc: "Yesterday, December 7, 1941—a date which will live in infamy—the United States of America was suddenly and deliberately attacked by naval and air forces of the Empire of Japan. The United States was at peace with that Nation and, at the solicitation of Japan, was still in conversation with its Government and its Emperor looking toward the maintenance of peace in the Pacific. Indeed, one hour after Japanese air squadrons had commenced bombing in the American Island of Oahu, the Japanese Ambassador to the United States and his colleague delivered to our Secretary of State a formal reply to a recent American message. And while this reply stated that it seemed useless to continue the existing diplomatic negotiations, it contained no threat or hint of war or of armed attack."
 pearl_harbour.t: "The Japanese Attack Pearl Harbor!"
 japan_triumph.t: "Triumph over Japan"
 japan_triumph.desc: "War has ended in Asia as the final Japanese forces have surrendered. What happens next... who knows?"
 america_demands_leadership.t: "[USA.getnameDEF] demands faction leadership!"
 america_demands_leadership.desc: "[USA.getnameDEF] wants to lead our faction, should we let them?"
 america_demands_leadership_2.t: "Our request to lead the faction has been denied."
 america_demands_leadership_2.desc: "Our request to lead the faction has been denied."

 candidate_ideology_progressive: "This candidate is £political_alignment_flag_progressives §7Progressive§!."
 candidate_ideology_conservative: "This candidate is £political_alignment_flag_conservatives §4Conservative§!."
 candidate_ideology_liberal: "This candidate is £political_alignment_flag_liberals §YLiberal§!."

 pathguides.t: "Path Guides - Page 1"
 pathguides.desc: "§3CIVIL WAR / GRIDLOCKED ELECTION§!\nTo get the gridlock, ramp up third party populist propoganda enough times so support is up to over 35/100 for the third parties (TIP: Complete "Affirm the New Deal" for extra political power). Then, when the election comes, you get the option to gridlock. To get the civil war, get the gridlock, and then decline MacArthur's proposal. Then, you can pick the side in the event chain and eventually the CW will begin.\n\n\n§CMACARTHUR'S DICTATORSHIP§!\nGet the gridlocked election, after accept MacArthur's proposal and he will take over the government soon.\n\n\n§4ROGRESSIVES/SOCIALISTS PATHS§!\nIn all of these paths, side with the people and then complete the "Hold the Progressive Convention" focus.\n\n§RCOMMUNISM§!\nDeny the compromise. The commies will stage a coup as a result. Let them win the day.\n\n§tDEMOCRATIC SOCIALISM§!\nAccept the compromise.\n\n§6PROGRESSIVES§!\nDeny the compromise. The commies will stage a coup as a result. Let the progressives win the day.\n\n\n§OAUTOCRATIC PATHS§!\nFor these paths, you must stay with the government in the civil war.\n\n§0MONARCHIES§!\nIn the "Question of Leadership" event you get with the focus of the similar name, say that the country needs old ways. Then continue down the paths. Later you can select and then empower a monarch.\n\n§GCORPORATIST DICATORSHIP§!\nIn the event that you get shortly after starting the "Corporatism" focus, you will get a choice to work with the companies. Say yes. You will then get a choice of what company to work with. Pick your company and then you will get a decision to initiate a corporate buyout that will cause that company to coup the government."
 pathguides2.t: "Path Guides - Page 2"
 pathguides2.desc: "§1ANARCHIST-LIBERTARIAN PATHS§!\nFor these paths, you must go down the monarchist path, and then complete the focus "All Power to the King".\n\n§9CAPITALIST LIBERTARIANS/ANARCHISTS§!\nYou will be able to side with the Sons in the event chain. Gain control of 15 of the states (including the capital) and you will be able to topple the monarchy.\n\n§gFRED TRUMP§!\nWork with the Democratic-Republicans in the event. Then, consolidate one leader for the movement.\n\n§BEXILED MONARCHY§!\nIn the "Fate of the Royals" event, exile them. Pick the country to exile them to, and then you will get an event soon to become said country. The monarchs will stage a coup soon. Later you can retake and core America."

 sons_of_liberty.t: "The Sons of Liberty"
 sons_of_liberty.desc: "A small political group in Boston known as the Sons of Liberty is starting to significantly grow following the King's consolidation of absolute powers. They promote a return to small government capitalist policies, although anarchists are suspected to be part of the group as well.\n\nSome in the King's council have suggested the possibility that some of them are even armed.."
 sons_of_liberty_2.t: "The Sons of Liberty Continue to Grow"
 sons_of_liberty_2.desc: "As the weeks have gone by, the governments of the New England kingdoms have reported hundreds of suspicious meetings, which we suspect to be the Sons of Liberty, and estimates of their membership are up to the tens or maybe even hundreds of thousands.\n\nSecurity has been increased in the region, but there is no sign of them stopping soon."
 sons_of_liberty_3.t: "The Providence Proclamation"
 sons_of_liberty_3.desc: "Today, members of the Sons of Liberty met up in Providence, Rhode Island, and signed the Providence Proclamation, stating that they would rebel against the government until they overthrew the government.\n\nThey started by occupying Providence. What will happen next is anyone's guess..."
 america_demands_leadership_3.t: "Our request has been accepted!"
 america_demands_leadership_3.desc: "Our request has been accepted! Now we can truly lead our faction through an era of prosperity."
 rioters_overthrow_monarchy.t: "Rioters Storm the White House"
 rioters_overthrow_monarchy.desc: "The Rioters have stormed the White House, and arrested the King. They have now declared that the monarchy is no more, and have started to attack monarchist sympathizers as well.\n\nMeanwhile, the leadership of Sons of Liberty have formed a government in Boston and declared the Free States of America."
 sons_of_liberty_4.t: "Rioters Take the Capital"
 sons_of_liberty_4.desc: "Today, Sons of Liberty rioters have stormed the District of Colombia and have siezed all excluding the White House, where the royal family has themselves barricaded.\n\nWe will have to sieze arms storages from other states before we can even think about storming it."
 monarchist_problem.t: "The Monarchist Problem"
 monarchist_problem.desc: "While we have captured the monarch and their family and placed them under arrest, we still don't know what to do with them..."
 monarchist_solution.t: "The Monarchist Solution"
 monarchist_solution.desc: "We must now decide what to do with the monarch and the rest of the royal family."
 monarchist_loyalists_flee.t: "Loyalists Flee"
 monarchist_loyalists_flee.desc: "The loyalist scum have left our free republic for the evil monarchists..."
 monarchist_loyalists_flee_2.t: "Monarchists Seize Power"
 monarchist_loyalists_flee_2.desc: "The former American royal family has seized power!"
 deal_with_the_old_parties.t: "Dealing with the Democratic-Republicans"
 deal_with_the_old_parties.desc: "We must now deal with the former opposition to the Monarchists, the Democratic-Republican Party."
 rise_of_certain_members: "§HCertain Members§! could capitalize off of this..."
 future_of_the_sons.t: "The Future of the Sons"
 future_of_the_sons.desc: "While many say that the current system of shared leadership should be fine, others say that we should pick one leader. While debates among the Sons have lasted for days, the general consensus has been..."
 future_of_the_sons_2.t: "Deciding on a Leader"
 future_of_the_sons_2.desc: "While there are a large field of candidates, there can only be one leader of the Sons of Liberty. Democratically elected representatives have meet in Boston today, and they now must decide."
 future_of_the_sons_3.t: "Future of the Ideology"
 future_of_the_sons_3.desc: "While the majority of the Sons of Liberty are Libertarian, there is no doubt that there are Anarcho-Capitalist elements within the party. They have long seeked the disbandment of the federal government overall, and the establishment of a national committee to allow the states to work together."
 generic_denial.t: "[FROM.getnameDEF] Denies Our Demands!"
 generic_denial.desc: "Those fools from [FROM.getnameDEF] have denied our demands! They will certainly regret this..."
 generic_accept.t: "[FROM.getnameDEF] Accepts Our Demands"
 generic_accept.desc: "Level-headed minds from [FROM.getnameDEF] have accepted our demands! They won't regret their decision."

 usarework.77.t: "Future of the Silver Legion"
 usarework.77.desc: "We must decide the future of our party, the Silver Shirts, and in turn, our nation.\nWhat this mainly boils down to is our leader. Some say Pelley is a unifying figure, but many disagree."
 rigged_elections.t: "The Final Election"
 rigged_elections.desc: "Today, Garner has decided to hold an election to decide our new president, stating that he no longer wished to lead the country anymore. While he made sure it was extremely rigged for the Democrats, that didn't mean that others tried, and there were many challengers within the Democratic Party itself.\nJudging by the party's hegemony over the nation, this may be the last..."
 return_of_elections.t: "Return of Elections"
 return_of_elections.desc: "The military government has served its time well, but we now need a return to a civilian government. It is only right for the people."