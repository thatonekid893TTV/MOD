 ABILITY_TOOLTIP_NAME:0 "$NAME|H$"
 tanna_tuva.1:0 "Siberian Unification"
 tanna_tuva.1.d:0 "After hard work, the Tuvan government has proclaimed the unification of Siberia. Siberia has never had a nation for the Siberian people. They have only been fully united under the Russian Empire and Soviet Union. But now the Siberian people have their own nation. The leader of the new Siberian nation has proclaimed that the Siberian people shall never be oppressed anymore. As from this day on, Siberia is here. And it shall not fall."
 tanna_tuva.2:0 "Join the Soviet Union"
 tanna_tuva.2.desc:0 "The Tuvan government has come to us asking to join the Soviet Union. Although the annexation of Tannu Tuva would not have any economical impact, the decision would be only political. Should we let them join the Soviet Union? Or should they be something else? "
 tanna_tuva.3:0 "Autonomy in the Soviet Union"
 tanna_tuva.3.desc:0 "Tannu Tuva wishes to join the Soviet Union as an autonomous Oblast. They would retain their independence as a nation, but we would control their foreign relations and other aspects of their country. Should we accept this proposal?"
 tanna_tuva.4:0 "State Supervised Religion"
 tanna_tuva.4.desc:0 " The government has announced the state supervision of religion within the country. Although religion plays a major role in Tuvan society, it slows down the efficiency of our nation. We must monitor religious institutions for the good of the country!"
 tanna_tuva.8:0 "Inner-Mongolia Question"
 tanna_tuva.8.desc:0 "During the Sino-Japanese War, our Tuvan allies have taken over Mongolia and wish to annex the region of Inner Mongolia. The people here are ethnically closer to the Mongols and Tuvans than to the Chinese. Annexation of these territories would result in a unified Mongol nation. Should we allow the Tuvan government to annex the region?"
 tanna_tuva.9:0 "Contact with Old Believers"
 tanna_tuva.9.desc:0 "Few settlements of Old Believers have been found in remote parts of the Urals and Siberia, however it was never suspected that they were living in Tannu Tuva. Old Believers are a group of Orthodox Russians who do not follow Nikon's revisions and reforms imposed on the Russian orthodox church. There are very few Russian Old Believers but the ones that remain live in small villages and camps. The Old Believers that we have made contact with claim that there are more of them, and that they are just representatives of their settlements."
 tanna_tuva.10:0 "Old Believer Settlements"
 tanna_tuva.10.desc:0 "The representatives of the Old Believer settlements have led us to their settlements. While they are small, there are a lot of them. The government officials we have dispatched there have counted that there are about 2,500 Old Believers."
 tanna_tuva.11:0 "Old Believers Camps"
 tanna_tuva.11.desc:0 "We have located more Old Believer camps. We found them living in the mountains."
 tanna_tuva.12:0 "Old Believer Ambassadors"
 tanna_tuva.12.desc:0 "Old Believer Ambassadors have come to our government requesting help. They say that they can aid in a potential invasion in the Soviet Union, one of our greatest enemies. Do we take the offer up? Or are these people fools?"
 tanna_tuva.121:0 "Germany Sends Advisors"
 tanna_tuva.121.desc:0 "Unexpected! Germany has accepted our offer and sent advisors to help train our military!"
 tanna_tuva.122:0 "Germany Ignores Us"
 tanna_tuva.122.desc:0 "Expected. Germany has ignored our ambassadors."
 tanna_tuva.13:0 "_______"
 tanna_tuva.13.desc:0 ""Old Believer Ambassadors have come to our government requesting help. They say that they can aid in a potential invasion in the Soviet Union, one of our greatest enemies. Do we take the offer up? Or are these people fools?"
 tanna_tuva.131:0 " Japan Ignores Us"
 tanna_tuva.131.desc:0 "Japan has ignored our offer."
 tanna_tuva.132.desc:0 "In an unexpected twist, Japan has sent aid!"
 tanna_tuva.14:0 "Send Word Abroad"
 tanna_tuva.14.desc:0 "All over the world, there are a small number of Old Believers. Now that we have secured our own nation, we should send word abroad, that a homeland for the Old Believers exists, and that we can reclaim Russia and repeal Nikon's revisions! However, such news will cost money to broadcast. How much money should we use to fund this campaign?"
 tanna_tuva.141:0 "The Old Believer Cause"
 tanna_tuva.141.desc:0 "If you see this then you have a mod on."
 tanna_tuva.142:0 "The Old Believer Cause
 tanna_tuva.142.desc:0 "If you see this then you have a mod on."
 tanna_tuva.143:0 "Volunteers have Arrived!"
 tanna_tuva.143.desc:0 "This morning, a large number of volunteers have arrived to fight for our cause."
 tanna_tuva.144:0 "Volunteers Flood In!"
 tanna_tuva.144.desc:0 "Unexpectedly, volunteers are flooding into the nation!"
 tanna_tuva.15:0 "Sending Word into Russia"
 tanna_tuva.15.desc:0 "Although religion may be banned in the Soviet Union, it does not mean there are no Old Believers there. We should attempt to make contact with any Old Believers in Russia to join us in our cause."
 tanna_tuva.16:0 "Soviet Sympathizers"
 tanna_tuva.16.desc:0 "Many people within the Soviet Union may believe in the communist principles established by their leaders, but many of them also sympathize with the old Russian traditions forgotten and eradicated by the revolution. A good amount of these people are government officials who would be willing to help us. We should consider forming connections with such people if we are to take back Russia."
 tanna_tuva.17:0 "White Russian Exiles Contacted"
 tanna_tuva.17.desc:0 "We were able to contact a few White Russians within the Soviet Union, Mongolia, Sinkiang, and Mangukuo. Although they are few, they are willing to aid us in our mission to retake Russia. They have brought experienced soldiers, military advisors, and have called other members to come. With their support we will be able to beat the Soviets, repeal Nikon's reforms officially, and maybe bring the White Russians back to power."
 tanna_tuva.18:0 "Old Believers Request Permission to Go"
 tanna_tuva.18.desc:0 "Null."
 tanna_tuva.19:0 "Question about Guaranteeing Independence"
 tanna_tuva.19.desc:0 "With the founding of our new state for Old Believers, we face many enemies. The Soviet Union and communist Mongolia will not take our government kindly, as communist nations see religion as a threat to their regimes. We must find someone to guarantee our independence to deter them. We have many options to pick from. We could ask the West, South America, and maybe Japan will too. Whom should we ask?"
 tanna_tuva.191:0 "Old Believers State Requests Guarantees"
 tanna_tuva.191:0 "Null."
 tanna_tuva.20:0 "The Chairman's Speech"
 tanna_tuva.20.desc:0 "Today is the first day of the new year. It is Tuvan traditional for the leader of our nation to give a speech. Our leader, Salchak Kalbakkhorekovich Toka, gave out his speech. He promises the Tuvan people that he will try his best to keep the nation stable and to commit to the communist nation. He continues to describe his vision of a collectivized and communist Tuvan utopia through Sovietization and other communist policies. He also describes how Dazhy and the opposition only mean harm to the nation and they should be repelled. At the end of his speech, the people in the streets celebrate with dances and parties. In the evening, people gather around campfires and discuss their dreams and desires for the new year."
 tanna_tuva.21:0 "A Letter From the Developer"
 tanna_tuva.21.desc:0 "Dear Player, \n Thank you very much for choosing to play my mod. Although the entire mod is not finished yet, I do plan to finish it. Thank you for playing this mod again. Tannu Tuva is truly a forgotten nation. It has a rich history even in the modern era, although a lot of it has been lost to time. I hope this mod is able to give you a little bit about this country's unique and interesting history. I also hope you enjoy this mod as much as I have enjoyed making it. If you have any suggestions, comments, or want to report any bugs, please let me know through the Google Form that is on the mod's workshop page. Thank you very much, and good luck! \n With gratitude, \n The Developer"
 tanna_tuva.22:0 "Opposition Leaders Intercepted"
 tanna_tuva.22.desc:0 "The government has had a high suspicion that the opposition groups within the nation were going to organize a coup. To prevent this coup, multiple government officials and police men have set up a trap to capture the rebels. A few of our men even pretended to be part of the opposition to gain insider knowledge. Due to all these efforts, we have been able to intercept the opposition and their little coup. Our insiders have also been able to report the location of the opposition's leaders leading to their capture."
 tanna_tuva.23:0 "Framing Dazhy"
 tanna_tuva.23.desc:0 "Dazhy was the main leader of the opposition. He had been scheming to overthrow the government for a few years now. He had orchestrated militias and had convinces regional groups to side with him. His ultimate goal was to push the idea of Kuular's dream, a theocratic and nationalist idea. One the government banned many years ago due to it being anti-revolutionary. However, there is very little evidence to support all of this. We only have a few testimonies and his past of following Kuular. If we are to end up framing Dazhy, how should we do so?"
 tanna_tuva.24:0 "The Fate of The Opposition"
 tanna_tuva.24.desc:0 "Now that we have captured these traitors, how should we deal with them? The fate of these traitors will send a message to everyone who opposes the government."
 tanna_tuva.25:0 "Informing the Public"
 tanna_tuva.25.desc:0 "The chaos that has taken place in our nation has caused a lot of questions. In response, our chairman has decided to inform the public himself. In his speech he declared that he and his men had found the traitors. Who would destroy the Tannu Tuva we know and love. These traitors would have ruined our lives and our work as a nation. These men must be punished, and their revolution must be obliterated to protect our nation."
 tanna_tuva.26:0 "Toka's Tannu Tuva"
 tanna_tuva.26.desc:0 "Now that the oppositon has been removed, Toka declares that Tannu Tuva is free of any enemies of the revolution. He is also happy to say that, Tannu Tuva can now begin turning it self into a true communist nation."
 tanna_tuva.27:0 "Tuvan Five Year Plan"
 tanna_tuva.27.desc:0 "Toka has declared that Tannu Tuvan will begin its first Five Year Plan. This Five Year Plan will be the start of the rapid industrilization of the nation. However, many people are skeptical as they fear collectivization. The first attept of collectivization in Tannu Tuva was a disaster. Mass famines and people were extremely poor, and the trauma from these times still remain. If we are to make this Five Year Plan truly successful, we have to show the people that this time we have learned from our mistakes."
 tanna_tuva.28:0 "Opposition Seizes The Capital!"
 tanna_tuva.28.desc:0 "The government has created a trap and it horribly backfired! We were able to seize the capital and capture the Stalinist minions. We can now really transform Tannu Tuva into the nation Tuvans want, and not some Stalinist puppet state."
 tanna_tuva.29:0 "Dazhy Seizes Power"
 tanna_tuva.29.desc:0 "Dazhy has taken control of the government and vows to bring back and restore Tuvan traditions and adapt communism for the Tuvan people. He also vows to bring about Kuular's dream of a communist, theocratic state with nationalist elements."
 tanna_tuva.30:0 "Nationalists Gain Control"
 tanna_tuva.30.desc:0 "In an unexpected turn, the minor political group, the nationalist, have taken control over the government. Although the nationalist government has not declared its intentions, they want to bring Tannu Tuva to glory."
 tanna_tuva.31:0 "Hunting the Old Believers"
 tanna_tuva.31.desc:0 "The Old Believers are not Tuvans, they are Russians. Eradicate them..."
 tanna_tuva.32:0 "Religious Coup in Tannu Tuva"
 tanna_tuva.32.desc:0 "Following the discovery of Old Believers living in Tannu Tuva, the Old Believers are now in control of the state. Our plans of overthrowing the government were successful. With a nation under our control we can now begin to contruct a nation for and of Old Believers. Great things await us down this road! For God and for glory!"
 tanna_tuva.33:0 "Second Attempt at Collectivization"
 tanna_tuva.33_desc:0 "Although our initial attempts at collectivization were a disaster, that was due to administrative mistakes and corrupt party members. Collectivization is the only way our nation is ever going to grow and prosper. This is our only chance."
 tanna_tuva.34:0 "Tuvan Uranium"
 tanna_tuva.34_desc:0 "Uranium has been found in Tannu Tuva and they have offered us access to it, do we accept their proposal?"
 tanna_tuva.35:0 "Communism and Tuvan Culture"
 tanna_tuva.35_desc:0 "Tuvan culture is not one very compatible with the ideas of communism. However, this is an issue that can be resolved. The chairman of our nation has proposed that we should attempt to control and modertate aspects of Tuvan culture. Although this may be highly unpopular, it would benefit us greatly in many sectors of our industry."
 tanna_tuva.36:0 "Sending Students Abroad"
 tanna_tuva.36.desc:0 "Sending our students abroad for foreign education is a wonderful idea! However, where should we send these students. The best countries for our Tuvan students will be the Soviet Union or the United States. In the Soviet Union, they will learn the history of communism and the glory of it. Alongside with some technical expertise. In the United States, they will learn a variety of subjects regarding indstury and economics that would greatly benefit our nation. Depending on the nation, it may be an opportunity for us to build closer relations with the nation they study in. With these two choices, where should we send them?"
 tanna_tuva.37:0 "Making Ammends with Moscow"
 tanna_tuva.38:0 "Making Ammends with Moscow"
 tanna_tuva.38.desc:0 "Without our recent actions, we have deeply offended the Soviet Union. Our government has decided to draft up a apology letter. It reads, "The Tuvan government and people are deeply sorry for offending the great Soviet Union. We have taken these actions for the advancement of the revolution within in our nation. In heinsight, our actions were quite anti-revolutionary. We recognize our mistakes and we deeply apologize. We promice to never makes these mistakes again." Hopefully the Soviets accept our apology and we can be allies with them once again."
 tanna_tuva.39:0 "An Apology from Tannu Tuva"
 tanna_tuva.39.desc:0 "Tannu Tuva apologies for its wrong doings. Should we accept it or not?"
 tanna_tuva.40:0 "The Soviets Reject Our Apology"
 tanna_tuva.40.desc:0 "The Soviet response to our apology was a disapointing one. It was said that multiple Soviet officers, and the secretary himself were further offended by the apology. Our attempts in reconciliation with the Soviets were for nothing."
 tanna_tuva.41:0 "Thee Success of Collectivization"
 tanna_tuva.41.desc:0 "The people of Tannu Tuva have witnessed the transformation of their nation. No longer we are a nation of nomads and tribesmen, we are a real nation. We have roads, towns, and cities! Collectivization and communism have transformed our nation! This accomplishment is one worth celebrating!"
 tanna_tuva.42:0 "The Fate of the Stalinists"
 tanna_tuva.42.desc:0 "With the recent capture of stalinist members of the government, we are now left with deciding their fate. Many call for their deaths for being traitors against the Tuvans and keeping them alive will only result in more Stalinist influence. Others argue that there is no need for bloodshed and they should be exiled. What should we do with them?"
 tanna_tuva.43:0 "Tannu Tuva seeks Western Investments"
 tanna_tuva.44:0 "Investments Come In"
 tanna_tuva.44.desc:0 "Our request for Western investments have been answered. A Western company plans to conduct buisness in our nation."
 tanna_tuva.45:0 "Tuvan Advice"
 tanna_tuva.50.desc:0 "This morning we have recieved a telegram from the Ukrainian Soviet Socialist Republic. The messages read, "The Ukrainian people, like all the peoples of the USSR, deeply appreciate and will never forget the assistance to the front and the liberated regions that the workers of the Tuvan People's Republic provide in a fraternal manner." Our efforts to aid the Soviet Union after the war have seemed to really help lots of people."
 tanna_tuva.51:0 "Ural Question"
 tanna_tuva.52:0 "Siberia Question"
 tanna_tuva.53:0 "Far East Question"
 tanna_tuva.54:0 "Vladivostock Question"
 tanna_tuva.55:0 "Central Asia Question"
 tanna_tuva.56:0 "Das-Dug Mountain Dispute"
 tanna_tuva.561:0 "Soviet Union Sides with Us"
 tanna_tuva.561.desc:0 "Soviet representatives have arrived today informing us of their support for our claim to Das-Dug Mountain."
 tanna_tuva.562:0 "Soviet Union Sides with Mongolia"
 tanna_tuva.562.desc:0 "Soviet representatives have arrived today informing us of their support for Mongolia's claim to Das-Dug Mountain."
 tanna_tuva.57:0 "The Great Purge"
 tanna_tuva.57.desc:0 "Recent investigations to reveal any traitors to our nation have revealed that there are many government offials who are against the party's ideas. Theese officials are working against the state and they need to be removed at once! However, removing such government officials could seriously hurt our nation."
 tanna_tuva.58:0 "Soviets Reject the Idea"
 tanna_tuva.58.desc:0 "The Soviets reject our idea of unifying our people."
 tanna_tuva.59.desc:0 "This morning a telegram from Moscow came in informing us that we had insulted them with our idea. The telegram also calls for the punishment of Tannu Tuva for proposing such an idea."