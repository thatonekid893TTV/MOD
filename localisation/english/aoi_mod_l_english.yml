 ITA_protectorate_event.19.t: "Question of Lower California"
 ITA_protectorate_event.19.d: "Lower California has come under our control. Historically, this peninsula was part of Mexico, but due to proximity to California, US shows interest in region. Now we must decide who to transfer it to - USA or Mexico."
 ITA_protectorate_event.19.a: "Transfer it to Mexico"
 ITA_protectorate_event.19.b: "Transfer it to America"
  
 ITA_alaska_question: "Question of Alaska"
  
 ITA_protectorate_event.20.t: "Fate of Southwestern US States"
 ITA_protectorate_event.20.d: "Italy controls vast territories in North America, including Texas, California, Nevada, Utah, Arizona, and lands known in Mexican mythology as Aztlan. Historically, these regions belonged to Mexico, but after Mexican-American War in 19 century, some were annexed by US. Now we must decide who to transfer these territories to - USA or Mexico."
 ITA_protectorate_event.20.a: "Well, now Mexicans can surely find ancestral homeland"
 ITA_protectorate_event.20.b: "These are American territories, no matter what anyone says."
   
 ITA_protectorate_event.21.t: "Question of Alaska"
 ITA_protectorate_event.21.d: "Alaska has come under our control. Now question arises: who should we transfer this strategically important territory to — Canadian puppet or US? Each side is ready to establish it as their protectorate."
 ITA_protectorate_event.21.b: "Transfer it to Canada"
    
 ITA_protectorate_event.22.t: "Question of Turkish Kurdish Territories"
 ITA_protectorate_event.22.d: "Kurdistan has come under Italian control. Historically, this region was part of Ottoman Empire and has been influenced by various powers for centuries. Now we must decide who to transfer territory to — Turkish puppet or Levant. Each choice will significantly affect balance of power in Middle East."
 ITA_protectorate_event.22.a: "[ANA.GetName] will maintain its presence here"
 
 BBA_italy_interaction_events.107.t: "Changing the Old Order"
 BBA_italy_interaction_events.107.d: "The regime change in Italy opens a new chapter in the management of our puppet states. The monarchs, who have long held power in these territories, remain symbols of the old order. We can allow them to stay, but risk weak loyalty, or replace them with a fascist administration, which will strengthen control but may provoke discontent among local elites. The fate of the puppet states depends on our determination."
 BBA_italy_interaction_events.107.a: "The monarchy is a relic of the past, it must be removed"
 BBA_italy_interaction_events.107.b: "Their distance from the metropolis and reliability allow them to keep their comfortable positions"

 
 ITA_protectorate_event.18.t: "Slovenian question"
 ITA_protectorate_event.18.d: "Italian Slovenia, with a significant German population, can either remain under the local Slovenian protectorate or be transferred to the Alpine Protectorate. Our choice will determine the nature of governance in the region and the loyalty of its population."
 ITA_protectorate_event.18.a: "Transfer Slovenia under [SWI.GetAdjective] administration"
 ITA_protectorate_event.18.b: "Transfer Slovenia under [AUS.GetAdjective] administration"
 ITA_protectorate_event.18.c: "Leave things as they are"

 
