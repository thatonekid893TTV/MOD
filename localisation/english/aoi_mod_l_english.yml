 BBA_italy_civil_war.10.t: "Valtellina Redoubt"
 BBA_italy_civil_war.10.d: "The war is starting to turn against us. Our troops have to retreat to the north, where our largest cities are located. Alessandro Pavolini proposed a project called the Valtellina Redoubt, or officially the Republican Alpine Redoubt, a line of fortifications in the very north of the country that should be built near the Swiss border. He explains this by saying that it is the best place where [ROOT.GetAdjective] troops will conduct the last defense in case of a complete defeat of Italian Social Republic. \nThe Fascist government is skeptical about this plan, but what do we say?"
 BBA_italy_civil_war.10.a: "Yes, we need such protection"
 BBA_italy_civil_war.10.b: "We can do a little preparation"
 BBA_italy_civil_war.10.c: "Waste of time"
