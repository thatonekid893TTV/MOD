 SWI_nostra_event.1.t: "Frontist movement is taking over"
 SWI_nostra_event.1.d: "The fascist and pro-German "frontist movement," in particular its most popular wing, National Front, has been actively gaining support among the Swiss people and army in recent months. \nRealizing that now is the best opportunity to seize power, fascists from the front marched on [ROOT.Capital.GetCapitalVictoryPointName] to the Federal Council building and demanded to resign in favor... \nAfter several hours of the council blockade, this demand was accepted, and now a national-socialist regime has been formed in Switzerland."
 SWI_nostra_event.1.a: "in favor of Robert Tobler"
 SWI_nostra_event.1.b: "In favor of Rolf Henne"
 
 can_fire_advisors_swi_tt: "§GFederal council mechanic will end. All advisors will become available§!"
 
 
 ITA_news.4.t: "The end of the Italian Civil War"
 
 ITA_news.5.d: "The bloody civil war in Italy ended with the victory of the fascists. \nThe end of the war was marked by the march of soldiers of the National Republican Army through the streets of Rome, in which [ITA.GetLeader] declared that all the traitors to the Motherland had been defeated, and that the triumph of the Italian Social Republic had taken place. \nThe Fascist militia captures the surrendered partisans; at the same time, the anti-fascist opposition fled the country, realizing their possible fate."
 ITA_news.5.a: "The enemies could not break the will of the Italian people."
 ITA_news.5.b: "Fascism is harder to defeat than expected."

 ITA_news.4.d: "The bloody civil war in Italy ended with the victory of the anti-fascists. \nAfter the anti-fascists launched an uprising against [ITA.GetFascistParty], which began to expand throughout the country, the Duce's position became obvious. After the capture of the largest cities of the RSI and the surrender of the last Blackshirt units, the war ended. \nNow [ITA.GetLeader] has to aim to defascisize and rebuild the country after a conflict of this scale."
 ITA_news.4.a: "Italy will triumph!"
 ITA_news.4.b: "It's not over yet."
 
