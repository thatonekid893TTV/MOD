 LBA_event.8.t: "The demand for reparations"
 LBA_event.8.d: "[ITA.GetNameWithFlag] has almost fallen, and the conflict is nearing its end. According to our agreement, the countries that helped us, we will pay them a kind of reparations to cover their military expenses. It's time to do that."
 LBA_event.8.a: "A deal is a deal..."
 LBA_event.9.t: "[FROM.GetNameWithFlag] violates our agreements!"
 LBA_event.9.d: "[FROM.GetNameWithFlag] promised to pay us a large sum of money as compensation for helping them, but today [FROM.GetAdjective] ambassador said that they are breaking all contracts with us and refusing to pay! What should we do?"
 LBA_event.9.a: "Sad news"
 LBA_event.9.b: "We will punish them."
 LBA_event.10.t: "[FROM.GetNameWithFlag] backs down"
 LBA_event.10.d: "[FROM.GetNameWithFlag] decided to do nothing after receiving our message. Success!"
 LBA_event.11.t: "[FROM.GetNameWithFlag] does not back down"
 LBA_event.11.d: "[FROM.GetAdjective] government has emphatically stated that it will crack down on any attempts by us to violate the agreements. The war is just around the corner."
 LBA_event.11.a: "They showed their true face."
