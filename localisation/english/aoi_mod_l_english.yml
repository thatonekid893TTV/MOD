 ITA_protectorate_event.1.t: "Occupation of French territories"
 ITA_protectorate_event.1.d: "We have successfully defeated France, and now its southern territories are under our control. What should we do with regions such as Savoy, Corsica and Provance, where a significant Italian minority lives?"
 ITA_protectorate_event.1.a: "Let's limit ourselves to Corsica and Nice"
 ITA_protectorate_event.1.b: "Italy will take everything!"
 ITA_protectorate_event.2.t: "The Southern German question"
 ITA_protectorate_event.2.d: "This morning, Italian flags were raised in Munich and Stuttgart in honor of the capture of Southern Germany, and our troops rushed North. What should we do with the occupied territories?"
 ITA_protectorate_event.2.a: "Let's pass under [SWI.GetAdjective] control"
 ITA_protectorate_event.2.b: "Establish a South German Protectorate"
 ITA_protectorate_event.3.d: "Iraq, the cradle of Mesopotamian civilization, is under our control. On the one hand, the Iraqis are Arabs, and on the other hand, Iraq is geographically closer to the Levant. How can I solve the problem?"
 ITA_protectorate_event.3.t: "The Iraqi issue"
 ITA_protectorate_event.3.a: "Transfer the region to [PAL.GetName]"
 ITA_protectorate_event.3.b: "May the Arabs be united"
 ITA_protectorate_event.4.t: "Slovak question"
 ITA_protectorate_event.4.d: "Slovakia is under our control. We know that Hungary claims Slovak lands for ethnic and historical reasons, while the Slovaks themselves did not really like Hungarian rule. Solution?"
 ITA_protectorate_event.4.a: "Hungary will get everything!"
 ITA_protectorate_event.4.b: "Only the southern lands will be ceded to Hungary"
 ITA_protectorate_event.4.c: "The whole of Slovakia will be united"
 ITA_protectorate_event.5.t: "The Transylvanian question"
 ITA_protectorate_event.5.d: "Our troops have marched victoriously through the largest cities of Transylvania, and now it is necessary to decide the fate of the region. On the one hand, both Hungarians and Romanians claim Transylvania, considering it their ancestral territory, and on the other, a lot of Transylvanians want to gain independence from these 2 powers."
 ITA_protectorate_event.5.b: "We will come to a compromise"
 ITA_protectorate_event.5.c: "Transylvania will be Romanian"
 ITA_protectorate_event.5.e: "There is another option..."
 ITA_protectorate_event.6.t: "Gibraltar issue"
 ITA_protectorate_event.6.d: "Gibraltar is ours! Finally, one of the sentinels of the Mediterranean has been defeated, which means that the triumph of the Italian World Order is just around the corner. All that remains is to decide what to do with this part of the land that is so important to us."
 ITA_protectorate_event.6.a: "Let's pass it under [CAT.GetAdjective] control"
 ITA_protectorate_event.6.b: "Gibraltar will be ours"
 ITA_protectorate_event.7.t: "North African issue"
 ITA_protectorate_event.7.d: "We already have a colony in North Africa - Libya, but there is a question of expanding our possessions in this region. The whole problem is that it is impossible to decide under whose control these territories will be: under the control of a united North African protectorate, or we will give some kind of autonomy to the local nations."
 ITA_protectorate_event.7.a: "We will unite into one protectorate"
 ITA_protectorate_event.7.b: "Wi will give them autonomy"
