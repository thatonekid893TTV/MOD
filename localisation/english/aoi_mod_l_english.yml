 AOI_news.1.t: "Proclamation of Empire"
 AOI_news.1.d: "Yesterday Italy's victory in the war against Ethiopia was announced. [ITA.GetLeader], the Duce of Fascist Italy, gave a grand speech on the balcony of the Palazzo Venezia in Rome. Tens of thousands of people gathered for his speech. In this speech, duce said that shame of Adwa defeat is finnaly washed away and that italians are one step closer to achieving their former glory. \nNow that Ethiopia is under the control of the Italians, it is worth being attentive to what steps the fascist government will take in relation to this region."
 AOI_news.1.a: "Fascists will not get away with this"
 AOI_news.1.b: "Great victory!"
 AOI_undeveloped_country: "Undeveloped country"
 AOI_undeveloped_country_desc: "[ITA.GetAdjective] Somaliland and Eritrea are currently developing rapidly, which, however, cannot be said about the recently conquered Abyssinia - the infrastructure and industrial system, which has not developed for decades, are in a deplorable state."
