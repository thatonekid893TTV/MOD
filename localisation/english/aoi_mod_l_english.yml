 ITA_other_event.7.t: "Italian Africa Formed!"
 ITA_other_event.7.d: "Italian Africa has been successfully established — Libya, Italian East Africa, Ethiopia, Egypt, and Sudan are now unified under a single administrative system of Italy. This momentous step confirms the country's growing influence on the continent and opens a new era of stable governance. At this stage, it is necessary to appoint a leader for the new region, who will ensure its prosperity, coordinated use of resources, and further strengthening of the Italian presence in Africa. So, we have 3 candidates — who will govern this vast colony?"

