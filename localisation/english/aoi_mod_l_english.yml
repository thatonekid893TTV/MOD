 BBA_italy_interaction_events.100.t: "The claim of Crete"
 BBA_italy_interaction_events.100.d: "[FROM.GetName] lays claim to Crete, claiming that it is native [FROM.GetAdjective] is our territory and asks us to hand it over to them. What should we do?"
 BBA_italy_interaction_events.101.t: "[FROM.GetName] agreed"
 BBA_italy_interaction_events.101.d: "[FROM.GetName], seeing our superiority, agreed to transfer our territories to us."
 BBA_italy_interaction_events.102.t: "[FROM.GetName] refused"
 BBA_italy_interaction_events.102.d: "[FROM.GetName], despite our superiority, refused to transfer our territories to us."
 BBA_italy_interaction_events.103.t: "The demand of Nice and Savoy"
 BBA_italy_interaction_events.103.d: "For [FROM.GetName] Nice and Savoy have always been extremely important lands, and now they demand to hand them over to them. Our answer?"
 BBA_italy_interaction_events.104.t: "The Palermo dictate"
 BBA_italy_interaction_events.104.d: "[FROM.GetAdjective] influence has grown very much lately, and now [FROM.GetName] demands that Malta be handed over to them - a kind of cornerstone for Italian irrendentists. Our answer?"
