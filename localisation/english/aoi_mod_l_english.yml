 FORMABLES_news.1.t: "Creation of Greater Albania"
 FORMABLES_news.1.d: "Today, in [ALB.Capital.GetCapitalVictoryPointName] it was announced the creation of Greater Albania, a pan-Albanian state that includes, in addition to Albania, Kosovo, Macedonia, and Northern Greece. \n[ALB.GetLeader] states, that the Albanian people have been drawn to their native country for decades, and now they have a chance to live together in one state. This will strengthen Albania's position in the Balkans, and perhaps [ALB.GetName] will even become a regional power."
 FORMABLES_news.1.a: "Good news for the Albanian people..."
 
 FORMABLES_news.2.t: "Proclamation of the Greater Yugoslavia"
 FORMABLES_news.2.d: "A few months ago [YUG.GetAdjective] government has embarked on the unification of all South Slavic territories, which include the territories of little Yugoslavia, Bulgaria, Albania, Styria and Vardar Macedonia. When all these territories were united under the rule from [YUG.Capital.GetCapitalVictoryPointName], it was proclaimed that Yugoslav irredentism had been successful, and that the unity of the Slavs had been achieved. \nThese actions make Yugoslavia the strongest regional player, and pose all the concerns for neighboring great powers such as Italy and Germany, whose influence will only decrease there."
 FORMABLES_news.2.a: "An interesting turn of events" 
 
