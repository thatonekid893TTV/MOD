 ITA_protectorate_event.24.t: "The question of the French Alps"
 ITA_protectorate_event.24.d: "The French Alps - soaked with the blood of our soldiers. We have reclaimed these lands with blood and sweat. Now the question arises: should we keep them for ourselves or hand them over to a French puppet?"
 ITA_protectorate_event.24.a: "From Savoy to Nice - Italy’s rule is unshakable!"
 ITA_protectorate_event.24.b: "Transfer to [FCO.GetName]"

 ITA_protectorate_event.25.t: "The question of Drome and Var"
 ITA_protectorate_event.25.d: "Drome and the Var coast are now under our control after the victory over French forces. These lands are strategically important, as the mountain passes open the way inland, and the ports of Toulon are key to the Mediterranean. We must decide whether to assert direct control or hand administration over to a French puppet."

