 ITA_monarchy_event.3.t: "The Rise of the old dynasty"
 ITA_monarchy_event.3.d: "Recent reforms and propaganda aimed at legitimizing the Massimo dynasty, whose representatives claim to be direct descendants of the emperors of the Roman Empire proved to be successful. The Pope, following his desire to restore the old order, today made a statement that power is passing to Leon Massimo, who claims the lands of the Roman Empire at the peak of his power. The ceremony is scheduled for tomorrow."
 ITA_monarchy_event.3.a: "With him, we will regain our former power. Ave!"
