 LBA_host_italian_exiles_desc: "We will shelter Italian exiles in our country"
 LBA_ignine_muslim_militarism_desc: "To wage wars more effectively, it is necessary to ignite Muslim militarism"
 LBA_call_to_aoi_desc: "We will turn to AOI for support"
 LBA_camicie_nere_desc: "We will reorganize the Blackshirts to organize the army more effectively"
 LBA_call_for_fascist_europe_desc: "To win, we need a deal with the European fascist powers"
 LBA_former_italian_colonies_desc: "Appeal to former colonies"
 LBA_operation_klara_desc: "It is required to start developing Operation Clara for homecoming."
 LBA_support_separatism_desc: "We will support separatism in Sicily and Sardinia so that we can be supported there after the start of the war"
 LBA_war_of_liberation_desc: "The hour has come. We will either return to our homeland, or we will collapse forever!"
 LBA_fascist_empire_desc: "Italy has been through enough lately, and only thanks to fascism has it been able to survive and rise above its former "allies" "
 LBA_fascist_reforms_desc: "Fascist reforms need to be re-initiated to bring back corporatism and restore class cooperation"
 LBA_hang_every_traitor_desc: "It's time to destroy the decision-making centers from which Italy's traitors received their funding"
 LBA_stop_treaties_desc: "And although we are grateful for the help, we are not someone's slaves, so we will no longer pay reparations"
 LBA_get_former_colonies_desc: "Subjugate the former colonies"
 LBA_god_loves_trinity_desc: "God loves the Trinity, which is why we need to finally subjugate Abyssinia"
 LBA_finish_resistance_desc: "There are still communist partisans and mafia in our country who terrorize our troops and interfere with civilian life. They need to be pacified."
 LBA_we_have_returned_desc: "It's finally happened! Our troops have liberated Rome from the liberal-communist contagion! Victory is just around the corner!"

 LBA_great_liberator_desc: "To fight more effectively against our enemies, [ROOT.GetLeader] must declare the liberation campaign of the conquered nations"
 LBA_restoration_of_rome_desc: "Our power has reached its limit - the possibility of restoring the Roman Empire is closer than ever!"
 LBA_demand_nizza_desc: "Nizza, Savoia, Corsica fatal..."
 LBA_demand_dalmatia_desc: "Dalmatia was promised to us after the First World War, but we never got it. It's time to fix this."
 LBA_lost_greek_islands_desc: "Crete and the Dodecanese are more important to us than ever for the sake of hegemony in the Mediterranean."
 LBA_demand_ticino_desc: "Switzerland is building huge chains of fortifications - it looks like they are preparing for war. And if war is inevitable, it should be declared first (if they are unwise, of course)."
 LBA_malta_diktat_desc: "...Malta baluardo di romanita..."
 LBA_push_towards_irredentism_desc: "Outside of Italy itself, there are a huge number of Italians who want to unite into one state. We must fulfill this mission."
 LBA_roman_assimilation_desc: "If we grant single citizenship to all conquered peoples, their integration into Great Rome will be much easier."
 LBA_by_blood_alone_desc: "[ROOT.GetName] is now at the peak of its power, and we will finally be able to write our names in the annals of history. By blood alone the wheels of history are moving!"
 LBA_bulding_italian_empire_desc: "Italian Empire that [ROOT.GetLeader] have long dreamed of, is now the most feasible goal that we need to strive for."
 LBA_restore_vatican_desc: "Communist bandits destroyed the Vatican, which was founded in 1929 and was the center for all Catholics. To attract tourists and increase our legitimacy, we will recreate it anew - on our own terms."
 LBA_albania_occupation_desc: "Albania can become an important target for expansion into the Balkans. It is required to subdue her"
 LBA_subdue_sentinels_desc: "The sentinels of the Mediterranean Sea - Gibraltar and the Suez Canal - have always trapped us in our own sea. We need to capture them as quickly as possible in order to unbend the bars made by our enemies for Italy."
 LBA_reform_republican_nat_army_desc: "[ROOT.GetAdjective] army has proven to be successful, and because of this, we need to reform it into a more professional structure and expand its size."
 
 ITA_socialist_latin_union_desc: "Socialism will be the instrument that will be able to unite the proletarians of Latin countries. So let's start the liberation campaign against the criminal bourgeoisie."
 ITA_italian_sphere_of_influence_desc: "Italy already possesses colonies in Africa, and puppet states in the Balkans and the Mediterranean recognize our influence. The time has come to integrate these lands into a unified and great Italian Empire, preparing the nation for its role as a great power and strengthening its place in the future world order."
 ITA_european_unity_desc: "The best way to ensure Europe's survival in the fight against fascists and communists is to create a fundamentally new organization - the European Union."
 ITA_towards_new_world_order_desc: "Italy looks to the future with determination and ambition. We strive for a new world order where the Italian voice will carry weight, and our ideas and culture will pave the way for influence in Europe and beyond. The time has come to prepare the nation for the role of a great power, to strengthen its foundations, and to expand the horizons of its influence."
 
 
 ITA_demand_ceuta: "Demand Ceuta"
 ITA_demand_ceuta_desc: "We will demand the transfer of Ceuta — a key port in North Africa with strategic and commercial importance. Since our support for Spain was not free, we will demand political and economic concessions. Controlling Ceuta will allow us to reach Gibraltar, secure maritime routes, and become a symbol of our national power and resolve."

 italy.20.t: "[FROM.GetName] demands Ceuta"
 italy.20.d: "It became clear that [FROM.GetAdjective] help for us in civil war wasn't free. Now [FROM.GetLeader] demands transfering city of Ceuta to them to become one step closer to Italian empire. What should we do?"
 
 
