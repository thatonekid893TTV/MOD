 ITA_peace_negotiations.1.t: "[ENG.GetName] requests the peace"
 ITA_peace_negotiations.1.d: "It seems that our successes in the Mediterranean have stirred up British society and politicians, since [ENG.GetName] has taken such a step. So, we can either agree to peace talks from a position of strength, or continue to fight."
 ITA_peace_negotiations.1.a: "We have already shamed England. Time to end this."
 ITA_peace_negotiations.1.b: "We will only be satisfied with a complete victory!"

 ITA_peace_negotiations.3.t: "The Fate of the Royal Navy"
 ITA_peace_negotiations.3.d: "The Royal Navy is the very force that bound us in Middle-earth. We have a great chance to weaken it by demanding that some of the British ships be handed over to us."
 
 ITA_peace_negotiations.5.t: "The Fate of the British Colonies"
 ITA_peace_negotiations.5.d: "Britain has been exploiting the population of its African colonies for decades. We have the opportunity to free them and expand our influence to Africa and the Middle East."

 ITA_peace_negotiations.6.t: "Suez channel Trade"
 ITA_peace_negotiations.6.d: "After the conflict ended, we acquired the Suez channel, the most important transport and trading point for most countries of the world. Now we can enjoy the benefits of this acquisition."

 ITA_peace_negotiations.7.t: "Formalization of the peace treaty"
 ITA_peace_negotiations.7.d: "The last aspects of the peace settlement were discussed today. A peace treaty can be enforced."
 ITA_peace_negotiations.7.a: "La vittoria e nostra!"
 
