 ITA_cossacks_fate: "Fate of Don and Kuban lands"
 ITA_protectorate_event.40.d: "For long times, Don and Kuban lands have been home to the cossacks - a distinct social group with their own military and cultural traditions. They recently fought against Bolshevism alongside our German allies, and more lately - for Italy in the struggle against partisans on our territory. \nThese lands are inhabited by ethnic Russians, so the time has come to decide under whose authority they will be."
 ITA_protectorate_event.40.a: "The Cossacks have earned these lands"
 
 ITA_protectorate_event.41.t: "Cossack Circle"
 ITA_protectorate_event.41.d: "Cossack Circle gathers on the historic lands of the Don and Kuban to elect a new ataman. Krasnov, known as the ideological leader of the Cossacks, Shkuro, an experienced military commander and anti-partisan fighter, and Pannwitz, a German officer who earned the trust of the Cossacks, are all vying for leadership of the Cossack Stan."
 ITA_protectorate_event.41.a: "Krasnov will lead"
 ITA_protectorate_event.41.b: "Shkuro will lead"
 ITA_protectorate_event.41.c: "Bring in the German - after all, he proved himself in battles in Italy"

 
 ITA_women_and_fascism: "Women and Fascism"
 ITA_women_and_fascism_desc: "A woman is an integral part of the fascist nation - the guardian of the family, the mother of new generations, and the support of traditions. Therefore, we must strengthen female fascist organizations, directing their activities toward raising children, supporting the family, and serving the Fatherland, so that each generation grows up in the spirit of discipline and devotion to the state."

