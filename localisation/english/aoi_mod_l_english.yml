 ITA_news.1.t: "[ITA.GetName] has taken over Malta!"
 ITA_news.1.t_lba: "[LBA.GetName] has taken over Malta!"
 ITA_news.1.d: "Malta, the largest British naval base in the Mediterranean, was captured by Italian troops on [GetDateText]! \nThe last weeks have been the hardest for this island, with constant bombing and an ongoing naval blockade that have undermined the morale of Malta's defenders. A few days ago, after sabotage of British ships by the 10th MAS Flotilla, an Italian forces landed on the island, and after heavy fighting captured the entire island. \nThis development of events will radically change the course of the struggle in the Mediterranean and undermine Britain's international authority."
 ITA_news.1.a: "We have teared Malta out of the opressors' hands!"
 ITA_news.1.b: "This is a disaster!"
 
 GER_italy_cw_event.2.t: "The Fate of Zadar"
 GER_italy_cw_event.2.d: "Zadar has been under Italian control for many years, and it seems the time has come to return it. Recent events have clearly shown that [RSI.GetName] will not be able to protect our citizens when war comes to our country. We need to act quickly, which, although it will cause [GER.GetAdjective]th dissatisfaction."
 GER_italy_cw_event.2.a: "Let's do it"
 GER_italy_cw_event.2.b: "We can rely on [RSI.GetAdjective] troops"
 GER_italy_cw_event.3.t: "[FROM.GetName] enter its troops to Zara"
 GER_italy_cw_event.3.d: "After the taking of Dalmatia by Croatia, [FROM.GetLeader] has stated his intentions to reclaim Zara. We cannot allow such self-activity, because it can lead to the destabilization of the region. Or maybe not..."
 GER_italy_cw_event.3.a: "Let them try."
 GER_italy_cw_event.3.b: "We have too much to do as it is. They can take it"
 
 
 GER_italy_cw_event.4.t: "[FROM.GetName] demands retreating"
 GER_italy_cw_event.4.d: "It seems that [FROM.GetName] opposes our attempt to regain Zadar, and declares that otherwise [FROM.GetAdjective] army will enter our territory to "curb our self-activity"."
 GER_italy_cw_event.4.a: "We are not [FROM.GetAdjective] slaves, let them have it if they want!"
 GER_italy_cw_event.4.b: "We have no choice..."
 
 ITA_news.2.t: "Mussolini has been executed!"
 ITA_news.2.d: "Republic of Salo is in a state of chaos and is living out its last days. Italian fascists flee to neutral Switzerland, but not everyone manages to get there. That, Duce Benito Mussolini with his mistress Clara Petacci and other prominent fascists such as Alessandro Pavolini, Nicola Bombacci, Achille Starace and others were identified near the border, detained and shot by the partisans in Northern Italy. \nA few days later, their disfigured bodies were transported to Milan and hung for all to see. That's how Mussolini's life ended."
 ITA_news.2.a: "We will take revenge."
 ITA_news.2.b: "May the earth be glass wool to him"
 ITA_protectorate_event.9.t: "Collapse of the Italian Administration"
 ITA_protectorate_event.9.d: "Recent events in Italy have radically changed the situation in our country. Italian troops are withdrawing from our country and heading back to the metropolis to fight the mafia, communists and royalists. [ROOT.GetLeader] is also leaving us, and he'll go to serve in the navy of the Italian Social Republic. Power is now back in the hands of Ante Pavelic."
 ITA_protectorate_event.9.a: "Total chaos"
 ITA_protectorate_event.10.t: "Zeroing out the Treaties of Rome"
 ITA_protectorate_event.10.d: "According to the Treaties of Rome, Dalmatia was ceded to Italy, our former metropolis. But since it is embroiled in the chaos of the civil war, we have a great opportunity to regain the lost territories by de jure canceling the signed agreement."
 ITA_protectorate_event.10.a: "Start de-occupation"


