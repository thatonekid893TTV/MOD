 SWI_frankfurter_bad_guy_desc: "David Frankfurter is a Jew who killed a representative of the national-socialist Party. For this, he must suffer the heaviest punishment."

 SWI_frankfurter_fair_trial: "Fair trail for David Frankfurter"
 SWI_frankfurter_fair_trial_desc: "David Frankfurter committed murder, for which he will be tried impartially in order to be punished."
 
 
