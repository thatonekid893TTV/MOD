 AOI_new_governor_of_AOI: "New governor of AOI"
 AOI_event.1.t: "Cancellation of slavery in Ethiopia"
 AOI_event.1.d: "[AOI.GetLeader], today issued an order according to which all existing slave-owning institutions in Abyssinia are abolished. \nFragment from the order: <<People of Tigray, Amhara, Gojjam: Listen! Slavery is a relic of ancient barbarism, and where there is an Italian flag, there can be no slavery... ...The slaves in your territories have been freed. Those who need help should contact the Italian authorities and receive assistance and protection. >> \nNow since slavery has been abolished, it will reduce tension in the region, as well as allow for accelerated development of Ethiopian towns and villages."
 AOI_event.1.a: "Glory to the Italian liberators!"
 AOI_event.2.t: "Replacement of [AOI.GetLeader]"
 AOI_event.2.a: "Fine"
 AOI_event.2.d: "Some time has passed since [AOI.GetLeader] became the leader of the [ROOT.GetName]. During this time the situation has somewhat stabilized. However, he has now been recalled back to Italy. \nBecause of this, Rodolfo Graziani, whose management methods are not known for moderation, was appointed as the new governor of the [AOI.GetName]. This could lead to tighter control of the country, but it is not known whether he will be replaced by anyone in future."
 AOI_event.3.d: "By order of [ITA.GetLeader], Pietro Badoglio was appointed the first governor of Italian East Africa. Most likely, this decision was made due to the fact that it was the troops of Pietro Badoglio who were the first to occupy Addis Ababa. \nAll that remains is to see what decisions the new leader of the country will make."
 AOI_event.3.t: "New governor of AOI"
 AOI_event.4.t: "Arrival of Italian settlers"
 AOI_event.4.d: "With the arrival of settlers from our metropolis, various agricultural machinery and modern tools used by the settlers began to arrive to us. This fact will greatly simplify the industrialization of the colony."
 AOI_event.4.a: "Good news"
 AOI_event.5.a: "Perfect"
 AOI_event.5.t: "Establishment of Roman bank's filials"
 AOI_event.5.d: "With the conquest of Ethiopia, the question of the economic integration of the metropolis and the East African possessions arose. \n[ITA.GetAdjective] government has decided to open filials of the Bank of Rome in AOI. Currently, these filials are located in major cities such as Addis Ababa, Jimma, Asmara, Mogadishu, Harar, Gondar and Gambella. \nThis solution will contribute to the autarkization of the colony's economy and, in the future, strengthen trade between [ROOT.GetName] and neighboring countries."
 AOI_event.6.t: "[AOI.GetNameWithFlag] is preparing military infrastructure"
 AOI_event.6.d: "Our troops in Somalia and Sudan have begun to notice more and more Italian soldiers constructing military infrastructure. They may be preparing for a future confrontation. \nHow should we respond to these actions?"
 AOI_event.6.a: "Do the same"
 AOI_event.6.b: "Ignore it"
 AOI_event.7.t: "Amedeo's feast of meskel"
 AOI_event.7.d: "Meskel feast - the largest festival of Ethiopian and Eritrean Christians; it gathers in Addis-Ababa and people burn a huge tree on a bonfire (Demere). \nAt the festival time, [ROOT.GetLeader] met with local warlords - Haile Selassie Gugsa, Haile Tekle Haymanot and Abba Jofir - to discuss the future of our region. Each of them represents its own region in a diverse Abyssinia. So which one of them will be our priority at the moment?"
 AOI_event.7.a: "Abba Jofir"
 AOI_event.7.b: "Haile Selassie Gugsa"
 AOI_event.7.c: "Haile Tekle Haymanot"
 AOI_event.8.t: "Continuation of festival"
 AOI_event.8.d: "Now that we have secured the loyalty of one of the warlods, we should discuss which of the country's sectors we should develop - the army, industry, or focus on internal stability. This decision will be important, since that it looks like there will be a war soon."
 AOI_event.8.a: "Stability of the state"
 AOI_event.8.b: "The strength of the army"
 AOI_event.8.c: "Accelerated industrialization"
 AOI_event.15.t: "Seyoum Mangasha's release?"
 AOI_event.15.d: "Seyoum Mangasha, former commander of [ETH.GetAdjective] troops, with the installation of [ITA.GetAdjective] authority, was put under house arrest in Addis Ababa. He is an extremely experienced commander and an influential ras, whose loyalty will clearly help our colony in governing the state and waging future wars. So what are we going to do with him?"
 AOI_event.15.a: "Try to gain loyalty"
 AOI_event.15.b: "Let him stay under house arrest"
 AOI_event.16.t: "Death of Balcha Safo"
 AOI_event.16.d: "Balcha Safo is an Ethiopian commander who joined the guerrillas after the defeat of his country and is currently terrorizing our young colony. \nAccording to reports, in one of the recent battles in Jimma, he was killed along with his squad after intense combat."
 AOI_event.16.a: "One problem fewer"
 AOI_event.9.a: "Carlo Geloso"
 AOI_event.9.b: "Alfredo Guzzoni"
 AOI_event.9.c: "Alessandro Pirzio Birolli"
 AOI_event.9.t: "Sending generals to [AOI.GetNameWithFlag]"
 AOI_event.9.d: "At the moment, our colony is weak, and it clearly needs [ITA.GetAdjective] general who could effectively manage the colonial troops and maintain order in the occupied territories. Who will it be?"
 AOI_event.11.t: "[ITA.GetNameWithFlag] is sending us a general"
 AOI_event.11.d: "[ITA.GetNameWithFlag] has decided to send one of their generals to our colony in order to maintain local order."
 AOI_event.11.a: "Excellent"
 AOI_event.17.t: "Resource exploration expeditions"
 AOI_event.17.d: "After the conquest of Ethiopia, the issue of mining rare minerals such as molybdenum, palladium, and others began in the newfound lands. \nOnes of those who began to go on expeditions to find such resources became [ITA.GetAdjective] geologists Ardito Desio, Alberto Parodi and Alfredo Pollini, who were hired by SAPIE (anonymous company for Ethiopian business) for this purpose. At the same time, this task is not an easy one - once one of the missions, which included Desio, was attacked by [ETH.GetAdjective] partisans, 2 out of 5 Italians were killed, but Desio himself remained alive. With the help of him and other researchers, the extraction of fossil resources in East Africa has increased significantly over the years, including..."
 AOI_event.17.a: "Steel"
 AOI_event.17.b: "Tungsten"
 AOI_event.17.c: "Aluminum"
 AOI_event.18.t: "Hospitals construction"
 AOI_event.18.d: "By order of [ROOT.GetLeader] with the beginning of industrialization and urbanization of the colony, the massive construction of previously non-existent medical facilities began.\nAccording to the order, a clinic or hospital should be built every 30 kilometers. \nIn addition, the construction of the only serum therapy institute in all of East Africa is beginning in Addis Ababa. Such actions will contribute to improving the quality of life of the local population and help to overcome unsanitary conditions."
 AOI_event.18.a: "This is the only way" 
 AOI_event.19.t: "Faccetta nera"
 AOI_event.19.d: "Faccetta nera (black face) is an Italian fascist march written in 1935, with lyrics by Renato Micheli and music by Mario Rucchione. This song tells about the fate of an Ethiopian woman who was freed from slavery by the Italians, after which she ended up in Rome, where she became a member of the fascist militia.\nVery quickly, this song became extremely popular among Italy and its colonies."
 AOI_event.19.a: "Faccetta nera,Sarai Romana, E pé bandiera, Tu vivrai quelle italiana"
 AOI_news.2.t: "Creation of a unitary Italo-African State"
 AOI_news.2.d: "After Italian East Africa gained independence from the former metropolis and, following the fascist policy towards Africans, there was a need to unite these two countries under a single government. \nAfter [AOI.GetLeader] and [ITA.GetLeader] held extremely long negotiations on the issue of the arrangement of the future state, it was decided that an equal union of the two countries would be the best option. Today, the unification process has been completed, and [AOI.GetAdjective] army has already sworn allegiance to the new government."
 AOI_news.2.b: "A new era has begun"
 AOI_news.2.a: "It won't help them" 
 AOI_news.3.t: "Creation of unified East Africa"
 AOI_news.3.d: "Italian East Africa, after gaining independence, set a course for the unification of East Africa under its leadership. First of all, the lands of Sudan, Kenya, Tanzania, Mozambique and other small states were annexed to the country, after which a large-scale propaganda campaign began in them, which is aimed at approving the current course [AOI.GetName]. It looks like a new player is entering the arena."
 AOI_news.4.t: "The war in Africa!"
 AOI_news.4.d: "After the German attack on Poland, the Allied countries declared war first. After a while, [ITA.GetNameWithFlag] with [ITA.GetLeader] in power, intervened in the conflict, which owns colonies in East and North Africa. There are a huge number of troops from the opposing sides in these regions, and the strategic value of the Suez Canal cannot be overestimated. The war consumes more and more new regions."
 AOI_news.4.a: "The Fascists will fall!"
 AOI_news.4.b: "Popolo italiano! Corri alle armi!"
 AOI_news.5.t: "The fall of [AOI.GetName]"
 AOI_news.5.d: "[AOI.GetNameWithFlag] fell under the onslaught of British troops, the country's largest cities such as Mogadishu, Asmara, Addis Ababa and others were captured. \nMany [AOI.GetAdjective] commanders, along with their troops, surrendered to the enemy army. Since a huge number of Axis soldiers have been captured and a foothold in East Africa has been lost, this is a very big defeat for the Axis."
 AOI_news.5.a: "This is a disaster!"
 AOI_news.5.b: "Expected result"
 AOI_event.100.t: "Welcome to Italy Redux!"
 AOI_event.100.d: "Welcome to the mod that changes Italy, its colonies and protectorates, and other countries related to them. The author of the mod is Ackenwald, and I hope you like it."
 AOI_event.12.t: "Proposal for a unitary state"
 AOI_event.12.d: "We have received a proposal from the authorities of [FROM.GetNameWithFlag] to create a united Italian-African state. What is our response?"
 AOI_event.12.a: "Agree"
 API_event.12.b: "Some kind of nonsense"
 AOI_event.13.t: "[FROM.GetNameWithFlag] agreed"
 AOI_event.13.d: "Wonderful news! After the negotiations, [FROM.GetLeader] agreed to our proposal positively - Italo-Africa will exist! \nNow our responsibilities include merging our civil and military administrations."
 AOI_event.13.a: "Fine"
 AOI_event.14.t: "[FROM.GetNameWithFlag] disagreed"
 AOI_event.14.d: "[FROM.GetNameWithFlag] rejected our generous offer to unite. Obviously, they don't take us seriously and don't want to have anything to do with us."
 AOI_event.14.a: "What a nightmare"
 AOI_event.14.b: "We will unite by force!" 
 AOI_event.20.t: "Terror in Addis Ababa!"
 AOI_event.20.d: "As the fight against the guerrillas infesting our young colony has begun, enemy elements have decided to carry out an assassination on [ROOT.GetLeader]! The underground elements tried to shoot him, but were unable to do so, and the attempt failed. After that, the fascist militia and personal guards began a battle with the partisans right in Addis Ababa, as a result of which the latter were defeated and executed. Civilians got hurt aswell."
 AOI_event.20.a: "At least, [ROOT.GetLeader] is alive..."
 AOI_event.21.t: "Ethiopian refugees are returning to their Homeland!"
 AOI_event.21.d: "The war came to our country, and with it [ETH.GetAdjective] commanders and their troops who fled the country after losing in [ITA.GetAdjective]-[ETH.GetAdjective] war. There are also reports that partisans are rising up in various regions of the country, who have been waiting for this moment. It won't be so easy to suppress them now."
 AOI_event.21.a: "Bastards!"
 AOI_event.22.t: "Building dams"
 AOI_event.22.d: "The Genale Dam is the largest dam built by Italians in Somalia near the town of Jenale in 1926 after 2 years of construction. In addition to the dam itself, dozens of kilometers of unpaved roads and railways have been created here, which has freed up more than 30,000 hectares of land. The town of Vittorio di Africa was also founded in this area, which became a center for the cultivation of agricultural products (cane, wheat, bananas). \nCurrently, when Ethiopia was conquered, there was a need to create similar structures in it. In particular, the northern regions of Ethiopia, such as Adwa, are suffering from drought. If we build dams there, it will allow us to gain the loyalty of local farmers and increase the flow of products from there."
 AOI_event.22.a: "Let's build a dam there."
 AOI_event.22.b: "We have more important things to do." 
 AOI_event.23.t: "Prince Amadeo has capitulated!"
 AOI_event.23.d: "Prince Amadeo of Savoy and Aosta, seeing the hopelessness of the whole situation, surrendered to the British troops along with part of his army. It was a despicable and desperate act, but now, on orders from Rome, general Guglielmo Nasi, an experienced military commander who had previously been governor of Harare and Shewa, has become governor of AOI."
 AOI_event.23.a: "The situation is getting worse every day"
 AOI_news.6.t: "The massacre in Gondar"
 AOI_news.6.d: "Yesterday, a massacre took place at the shipyard of an Italian company based in Gondar - hundreds of armed men led by Ras Immiru, who bypassed the Italian positions at night, committed mass murders of Italian and African workers. \nThe workers did not have firearms with them and were unable to defend themselves properly; their corpses were castrated and decapitated. In total, more than 70 people were killed, including Ethiopian soldiers, when an explosion occurred at the shipyard afterwards."
 AOI_news.6.a: "Terrible news!" 
 AOI_event.24.t: "[FROM.GetNameWithFlag] asks for independence"
 AOI_event.24.d: "It seems like our colony has increased its political influence and army since its foundation, if she decided to do this thing. Nevertheless, [FROM.GetNameWithFlag] was very useful for our country. What is our response?"
 AOI_event.24.a: "Give independence"
 AOI_event.24.b: "Never!"
 AOI_event.25.t: "[FROM.GetNameWithFlag] demands Mozambique annexation"
 AOI_event.100.a: "Show the complete changelog"
 AOI_event.101.t: "Complete changelog"
 AOI_event.101.d: "Focus tree for Italian East Africa. \nGeneric focus tree for Italian protectorates. \nFocus tree of Italian exiles (LBA). \nNew formables (Balkan federation (YUG), Greater Yugoslavia, Greater Albania, Italy (Italian states), Roman and Italian empires (LBA), Italo-Africa, Italian Africa, Africa and East Africa (AOI). \nFocus "Italian hegemony" now can lead to formation of Greater Italy and Roman empire. \nAfter creating greater Italy or Roman empire, Italian civil war and overthrow of country leader won't happen. \nGreater Italy branch was buffed. \nCompletion time of many focuses has been reduced.\nItaly can now create EU through democratic branch. \nItaly can create Latin union through communist branch. \nItaly can restore Roman dynasty through Pope path. \nAdded Italian MIOs to the AOI and Libya.\nAdded Italian fascist music station.\nAdded new decisions regardless Italian African and Balkan policy.\nleaders of Yugoslavia were replaced to accurate ones.\nItalian countries can now reform Italy.\nFrench monarchist and fascist paths were improved. \nMany Turkish focuses were reduced in time completion."
 AOI_event.101.a: "Cool!"
 AOI_news.7.t: "Armistice of Cassibile"
 AOI_news.7.d: "After the winning of Allied forces in North Africa and landing in Sicily, Italy's position began to deteriorate. Mussolini was arrested a few weeks ago, and a Grand fascist council led by Pietro Badoglio took over. \nIn the end, armistice was signed in Cassibile (Sicily), and Italy had capitulated. But even before armistice was signed, Germans found out about it by intercepting the telegram, which is why it was decided to launch Operation Axis to deploy troops in Italy. \nThe southern pro-allied army is joined by Italian mafia gangs and partisans across the country, while German troops and the recently liberated Mussolini have gained a foothold in the North."
 AOI_news.7.a: "Interesting..." 
 AOI_event.31.t: "[FROM.GetNameWithFlag] requests to merge colonies"
 AOI_event.31.d: "[FROM.GetNameWithFlag] has assured its loyalty to us, which is why it requires certain privileges. In particular, to unite the Italian colonies in Africa under its leadership. This definition includes Italian Libya, East Africa, Sudan and Egypt. What is our response?"
 AOI_event.31.a: "Good idea"
 AOI_event.31.b: "Our answer is no"
 AOI_event.30.t: "The capital of the new state"
 AOI_event.30.d: "After the successful second Risorgimento, which was carried out by our great [ROOT.GetLeader] the question arose about the new capital of the newly formed Italy. Which city will it be?"
 AOI_event.30.a: "Rome"
 AOI_event.30.b: "Milan"
 AOI_event.30.c: "Naples"
 AOI_event.30.e: "Leave it as it is"
 AOI_event.33.t: "[FROM.GetNameWithFlag] demands to transfer Styria"
 AOI_event.33.d: "[FROM.GetNameWithFlag], in order to successfully accomplish the idea of Greater Yugoslavia, asked our government today to transfer them control over Styria. What's our response?"
 AOI_event.33.a: "They can have it"
 AOI_event.33.b: "Never!"
