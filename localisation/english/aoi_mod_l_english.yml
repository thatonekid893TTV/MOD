 ITA_taiwan_fate: "Fate of Taiwan"
 ITA_protectorate_event.28.d: "Taiwan is under our troops' control. As everyone knows, this island holds a very important strategic position. Who will govern it?"
 ITA_protectorate_event.27.a: "This region is too valuable — it will become our base"
 ITA_protectorate_event.28.a: "Transfer the region to China"
 ITA_protectorate_event.28.b: "Transfer the region to Japan"
 ITA_protectorate_event.29.d: "Xinjiang is home to Uyghurs, who are not ethnically Chinese. We can either grant them autonomy or hand the region to China, which may cause local unrest. What should we do?"
 ITA_protectorate_event.29.a: "Grant local autonomy"
 ITA_protectorate_event.30.d: "Tibet has its own people, culture, and national consciousness, and the locals are reluctant to be part of China. What should we do?"
 ITA_protectorate_event.30.b: "Maybe transfer it to India?"
 ITA_protectorate_event.31.d: "After the expansion of Italian power in the Far East, the question of the future of the Amur region and Vladivostok arises. These rich and strategically important lands are under Italian control, but their administration is disputed: Russia demands its historical territories back, China sees them as a restoration of historical justice, and Manchuria insists on expanding its living space. Our response?"
 ITA_protectorate_event.31.a: "These are Russian territories"
 ITA_protectorate_event.31.b: "Transfer to Manchuria — after all, they lived there"
 ITA_protectorate_event.32.d: "Now that the region is under control, we must decide whether to restore Manchuria as a separate puppet state or hand it over to China."
 ITA_protectorate_event.33.d: "The question of Mongolia's future arises — should we create a separate puppet state, or transfer it under the administration of Russia or China, considering the strategic importance of the region and its history?"
 ITA_protectorate_event.33.a: "Create a Mongolian puppet state"
 ITA_mongolia_fate: "Fate of Mongolia and Uriankhai"
 ITA_tibet_fate: "Fate of Tibet"
 ITA_sinkiang_fate: "Fate of Xinjiang"
 ITA_outer_mongolia_fate: "Fate of Inner Mongolia"
 ITA_protectorate_event.34.d: "After subjugating Inner Mongolia, its future must be decided — transfer to Mongolia, China, or divide between Manchuria and China."
 ITA_protectorate_event.34.a: "Transfer to Mongolia"
 ITA_protectorate_event.34.b: "Transfer entirely to China"
 ITA_protectorate_event.34.c: "Initiate a division"

 ITA_protectorate_event.35.d: "The question of Vojvodina's future arises — who will govern this strategic and multi-ethnic region? Hungary claims historical rights to the northern lands, Serbia relies on the ethnic majority and claims to the south, and Croatia sees an opportunity to expand its influence. It's a complex decision, but it must be made."
 ITA_protectorate_event.35.b: "Not Vojvodina, but Ujvidek!"
 ITA_protectorate_event.35.c: "Perhaps transfer to Croatia?"
 ITA_voevodina_question: "Fate of Vojvodina"

 ITA_dalmatia_fate: "Fate of Dalmatia"
 BBA_italy_interaction_events.108.d: "The question of Dalmatia's future arises. Western "allies" had promised this territory to Italy after the First World War but did not keep their word. Now Rome can either keep Dalmatia entirely under its control or divide it, handing part to Croatia while formally observing protocols."
 BBA_italy_interaction_events.108.a: "Dalmatia is ours!"
 BBA_italy_interaction_events.108.b: "We'll take only our lawful territories."
 ITA_transfer_fire_land: "Decision on the fate of Land of the Fire"
 ITA_this_state_ukraine: "Fate of [FROM.FROM.GetName]"
 ITA_protectorate_event.36.d: "[FROM.FROM.GetName] is home to both Ukrainian and Romanian populations. Who should control the region?"
 ITA_protectorate_event.36.a: "Ukraine"
 ITA_protectorate_event.36.b: "Romania"

 ITA_this_state_bul_rom: "Fate of Dobruja"
 ITA_protectorate_event.37.d: "Dobruja has always been a point of contention between Bulgaria and Romania. Now that it is under our control, who should it go to?"

 ITA_protectorate_event.36.b: "Transfer all to Romania"
 ITA_aland_fate: "Fate of Aland"
 ITA_protectorate_event.38.d: "The question of the future of the Aland Islands arises — who should control them: Scandinavia or Karelia? This decision will affect the balance of power in Northern Europe and Italy's influence in the region."
 ITA_protectorate_event.38.a: "Transfer to [SMI.GetName]"
 ITA_protectorate_event.38.b: "Transfer to [KAR.GetName]"

 ITA_honolulu_fate: "Fate of the Hawaiian Islands"
 ITA_protectorate_event.27.d: "The question of control over the Hawaiian Islands arises — should they be handed to the United States or should Italy maintain a base here? This decision will determine Italy's strategic position in the Pacific."
 
