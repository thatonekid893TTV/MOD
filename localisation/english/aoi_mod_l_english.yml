 ITA_vatican_san_marino_event.2.t: "The Fate of San Marino"
 ITA_vatican_san_marino_event.2.d: "The civil war is starting to take shape in our favor, and our troops have already reached [SMR.GetAdjective] borders. As we know, San Marino has long been governed by [SMR.GetLeader], a henchman of the criminal fascist ideology. Start an invasion, or will [SMR.GetName] maintain a neutral status?"
 ITA_vatican_san_marino_event.2.a: "Let it exist"
 ITA_vatican_san_marino_event.2.b: "Start it"
 ITA_vatican_san_marino_event.1.t: "The Fate of the Vatican" 
 ITA_vatican_san_marino_event.1.d: "The civil war is finally over, and the old regime has lost. But in the very heart of our capital there is a quasi-state created by the fascist regime, called the Vatican. Everyone knows that the Vatican is a holy place for all Catholics, and if we suddenly violate its independence, many European countries will treat us extremely negatively. So, our answer?"
 ITA_vatican_san_marino_event.1.a: "Let's preserve the sovereignty of the Vatican"
 ITA_vatican_san_marino_event.1.b: "Priests have no place in this country!"
 ITA_vatican_san_marino_event.3.t: "Influence on [MNC.GetName]"
 ITA_vatican_san_marino_event.3.d: "War has been raging in Europe for a long time, at the same time the small principality of Monaco maintains its neutrality. It seems that we have extremely important financial and strategic importance for [FROM.GetAdjective]of the Russian alliance, which is why they announce the deployment of troops to our territory and gaining access to international trade through the ports of Monaco, as well as ensuring our protection."
 ITA_vatican_san_marino_event.3.a: "It sounds quite reasonable"
 ITA_vatican_san_marino_event.3.b: "This is not going to happen!"
 ITA_vatican_san_marino_event.4.t: "[MNC.GetName] agrees"
 ITA_vatican_san_marino_event.4.d: "[MNC.GetName] responded positively to our message, and allowed us to deploy our troops on their territory, as well as trade through [MNC.GetAdjective] ports."
 ITA_vatican_san_marino_event.4.a: "Success!"
 ITA_vatican_san_marino_event.5.t: "[MNC.GetName] refuses"
 ITA_vatican_san_marino_event.5.d: "Monaco seems to be firmly stating that it will no longer maintain its neutrality, and it seems to want to form an alliance with [USA.GetName] or [ENG.GetName], since it refuses our message. "
 ITA_vatican_san_marino_event.5.a: "As if they represent something"
 ITA_vatican_san_marino_event.5.b: "We will sweep them away."
 ITA_vatican_san_marino_event.6.t: "The Occupation of Monaco"
 ITA_vatican_san_marino_event.6.d: "Following the possibility of trade and the deployment of Axis troops, we have learned that [ITA.GetLeader] plans to turn Monaco into a puppet state by creating a new pro-Italian government."
 ITA_vatican_san_marino_event.6.a: "Don't resist"
 ITA_vatican_san_marino_event.7.t: "The new government in Monaco"
 ITA_vatican_san_marino_event.7.d: "We successfully occupied government buildings in Monaco, and our troops were not resisted. On the contrary, some people welcomed us and agreed to cooperate with the new authorities. There is now a new government in Monaco."
 ITA_vatican_san_marino_event.7.a: "Great news"
