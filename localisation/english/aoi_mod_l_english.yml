 ITA_news.8.d: "An official ceremony was held in Rome, where the city was proclaimed the new capital of Europe. The Eternal City, whose past is closely tied to the history of the continent, once again gains special significance as a center of political and diplomatic life. \nThe world’s reaction proved to be mixed – some states welcomed the decision, seeing in it a symbol of stability and European unity, while others expressed concern that Rome’s elevation might shift the balance of power and lead to rising tensions. At the same time, for the city’s inhabitants, this event marked the beginning of a large-scale transformation of the capital, intended to unite the legacy of antiquity with the demands of modernity."
 
