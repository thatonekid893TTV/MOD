 LBA_event.1.t: "Italian fascists are fleeing into exile"
 LBA_event.1.d: "The Italian Civil War did not turn in favor of the fascists. Every day it becomes more and more obvious that the Duce regime will soon fall, which is why the ministers, troops and military leaders of the Italian Social Republic, along with Mussolini himself, are starting to flee to us. We should accept them."
 LBA_event.1.a: "Is the Metropolis going into exile? I've seen this before..."
 LBA_event.2.t: "The appeal of the ex-Duce"
 LBA_event.2.d: "Benito Mussolini, after his regime completely fell in the metropolis, ended up with us. He, along with a group of influential fascists, stated to [ROOT.GetLeader] on the need to hold a meeting of the newly formed grand fascist council to resolve the issue of the country's leadership. What should we do?"
 LBA_event.2.a: "That's what we'll do"
 LBA_event.2.b: "It's too risky..."
 LBA_event.3.t: "[FROM.GetName] requests support to fight"
 LBA_event.3.d: "We have received the message from [FROM.GetAdjective] that they want us to help them in the struggle for the liberation of Italy and the return of the fascist regime. And although it seems like a risky business, we can get financial and political benefits from it. Our answer?"
 LBA_event.3.a: "Undoubtedly!"
 LBA_event.3.b: "We have other plans"
 LBA_event.4.t: "[FROM.GetName] agreed"
 LBA_event.4.d: "[FROM.GetName] has agreed to provide military support in the coming struggle."
 LBA_event.5.t: "[FROM.GetName] declined"
 LBA_event.5.d: "[FROM.GetName] refused to support us in the coming struggle."
 LBA_event.6.t: "[FROM.GetName] requests equipment"
 LBA_event.6.d: "For replenishments of [FROM.GetAdjective] army, [FROM.GetAdjective] government has requested weapons from us. Should we send them?"
 LBA_event.6.a: "Of course"
 LBA_event.7.d: "[FROM.GetAdjective] the government was generous and agreed to transfer the necessary weapons to us."
 ITA_other_event.1.t: "The eagle spreads its wings"
 ITA_other_event.1.d: "Italian troops continue their victorious march across Europe - Gibraltar, Malta and the Suez Canal have already been captured. \nOur soldiers proved the strength of Italian weapons and the courage of our people. Our enemies now see that we are a force to be reckoned with!"
 ITA_other_event.1.a: "One step closer to Italian hegemony"
 GER_italy_cw_event.1.t: "Troops entering Italy"
 GER_italy_cw_event.1.d: "In Italy, the treacherous elements who overthrew Duce not so long ago have made peace with the Allies, which directly threatens our Southern territories. What should we do - immediately send troops to Northern Italy, or act methodically and without risk?"
 GER_italy_cw_event.1.a: "Send troops!"
 GER_italy_cw_event.1.b: "Use caution" 
 
