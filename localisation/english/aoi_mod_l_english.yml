 SETTINGS_show_paths: "Mod paths"
 SETTINGS_event.2.d: "\nHow do I play for AOI? There are 2 ways: \n1) Play as Ethiopia, complete "Reach out to the Italians" focus, after which you win the civil war as any collaborator and complete the focus on creating an AOI. \n2) As Italy, you defeat Ethiopia, then complete focuses "Triumph in Africa" and "Ministry of Italian Africa", then create a AOI and play as it. \n\nHow do I play as Italian exiles? \nPlay as Libya, and don't change ideology. Italy must go into civil war by completing "Defy the duce" focus. And after fascist side (RSI) will be at 75% capitulation, Libya will get event in which Italian exiles get there, which will unlock the path. \n\nHow do I access Italian decisions to create or integrate protectorates? \nFor this, simply complete "Towards new world order" and "Ascendancy of the Living Space of Greater Italy"." 
 
 
