 LBA_event.100.t: "Fleeing to Libya"
 LBA_event.100.d: "We are losing the civil war, and it seems it is time for us to flee from our native country to avoid a cruel fate. We only have a way to Libya, only there is our colonial authority still stable."
 LBA_event.100.a: "We will return..."
