 ITA_mobilize_massaie_rurali: "Mobilize Massaie Rurali"
 ITA_mobilize_massaie_rurali_desc: "The rural women's organization — the largest female organization in the countryside, uniting peasant women and housewives. Mobilizing them will focus efforts on strengthening families, villages, and loyalty to the ideals of the Fascist state."
 ITA_mobilize_sold: "Mobilize Sindacato Operaie e Lavoranti a Domicilio"
 ITA_mobilize_sold_desc: "The SOLD organization unites urban women working in factories and from home, directing their labor to support industry and the economy. Their mobilization boosts production capacity, reinforces discipline, and instills loyalty to the Fascist party, making them an important pillar of the state."
 ITA_create_saf: "Create Servizio Ausiliario Femminile"
 ITA_create_saf_desc: "Our women are ready to contribute to the common cause. The Women's Auxiliary Service (SAF), led by Piera Fondelli, unites women of all ages to support the army, organize supplies, provide medical assistance, and perform administrative work. Creating the SAF will allow women to take their place alongside men, becoming an active force supporting the front and rear, and an essential part of the struggle for Italy's greatness." 
 
