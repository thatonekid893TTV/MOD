 LBA_event.13.t: "Partisans are rising"
 LBA_event.13.d: "Partisans and separatists, after finding out about the beginning of full-scale invasion of Italy, decided to take weapons in their hands and fight on our side."
 LBA_event.13.a: "Great news!"
 LBA_event.12.t: "A surge in separatist sentiments"
 LBA_event.12.d: "In Sicily and Sardinia, there has recently been a sharp surge in anti-government and separatist sentiments. Perhaps [LBA.GetNameWithFlag] is behind this?"
 LBA_event.12.a: "Something needs to be done quickly!"
 LBA_news.2.t: "Fascist win the second civil war!"
 LBA_news.2.d: "After the Italian fascists fled to Libya after the defeat of the civil war, a lot has changed. Today, Italian anti-fascist government has completely surrendered, and the country has passed back into the hands of [LBA.GetAdjective] troops. \nThe last pockets of anti-fascist resistance are already being cleared out. "
 LBA_news.2.a: "Greatest comeback?"
 LBA_news.2.b: "It was destined to be so"
 
 LBA_news.1.t: "Return to the metropolis"
 LBA_news.1.d: "After military preparations and political agreements on the part of [LBA.GetName], [LBA.GetAdjective] troops landed on Italian territory in order to, as [LBA.GetLeader] said, "reclaim their Homeland." Other major fascist powers in Europe are also joining this war on the side of the Italian government in exile. How will all this turn out?"
 LBA_news.1.a: "The boot flared up."
