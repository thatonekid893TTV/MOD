 LBA_event.101.t: "Meeting of Grand Council of fascism in [ROOT.Capital.GetCapitalVictoryPointName]"
 LBA_event.101.d: "At today's meeting of Grand Council of fascism in [ROOT.Capital.GetCapitalVictoryPointName], the fate of our country is being decided - the one who will lead [ROOT.GetAdjective] society for the liberation war against the liberal-communist invaders of Italy will be chosen, and we have several candidates for this. \n1)Former duce of Fascist Italy - Benito Mussolini. \n2)Commander-in-Chief of the Army of Italian Social Republic - Rodolfo Graziani. \n3)Commander of the 10th MAS Flotilla which was formed during the civil war - Junio Valerio Borghese. \n4)Current governor of Libya - Italo Balbo. \nEach of them is important in its own way, so we need..."
 LBA_event.101.a: "Mussolini's charisma"
 LBA_event.101.b: "Graziani's steadfastness"
 LBA_event.101.c: "Borghese's determination"
 LBA_event.101.e: "Balbo's competence"
 
