 ITA_protectorate_event.15.t: "Authority in [PRR.GetName]"
 ITA_protectorate_event.15.d: "After our victory, Italy controls the European part of Russia. Now we must choose: rely on local forces and cooperate with the People's Labor Union, letting them manage the regions, or appoint our own governor and keep full power in our hands. The first option will maintain relative stability and popular support, though some control remains with the locals. The second grants complete control over resources and the army, but requires strict administration and may provoke unrest."
 ITA_protectorate_event.15.a: "Appoint an Italian Governor"
 ITA_protectorate_event.15.b: "Trust Local Forces"

 ITA_protectorate_event.16.t: "Plymouth Naval Base"
 ITA_protectorate_event.16.d: "We have established control over England and now must decide what to do with Plymouth — a key base of the Royal Navy. We can leave it under the British protectorate, maintaining the appearance of local authority, or fully take Plymouth under our control, strengthening our influence at sea. The first option will ease resistance and preserve cooperation, while the second ensures complete control over the fleet and this strategically important port, but increases the risk of unrest."
 ITA_protectorate_event.16.a: "Our influence on the Northern Europe begins here."
 ITA_protectorate_event.16.b: "Let the protectorate hold the base"

