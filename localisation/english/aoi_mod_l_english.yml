 ITA_news.7.t: "Formation of the Social Republic"
 ITA_news.7.d: "After further strengthening the fascist regime, Benito Mussolini proclaimed the formation of the Italian Social Republic, finally abolishing the institution of the monarchy and removing the Savoy Dynasty from the political life of the country. \nNow the main pillar of the state is [ITA.GetRulingPartyLong], declared the only legitimate political force. Some of the people are rejoicing about this; and the monarchists have been ousted from political life, and the army has undergone personnel changes aimed at strengthening loyalty to the new regime. \nItaly's future in these new conditions remains uncertain - the country is entering the next stage of its history, and only time will tell what it will become."
 ITA_news.7.a: "Evviva il Fascio Repubblican!"
 ITA_news.7.b: "The monarchy has again shown its inefficiency."
 ITA_news.7.c: "Italy is ultimately sinking into the darkness of dictatorship."
 
