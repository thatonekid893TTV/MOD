 ITA_news.6.t: "The collapse of Great Britain"
 ITA_news.6.d: "Great Britain as a single state no longer exists. Rule of the [ENG.GetRulingPartyLong] party has collapsed into fragments, and only factions fighting among themselves remain from the once mighty country. \nPoliticians have disappeared, generals are fighting not for a single nation, but for ruins, and instead of footsteps, only desperate groans can be heard on the streets of burning cities. \nThe sun no longer rises over the foggy Albion."
 ITA_news.6.a: "The British lion no longer roars."
 ITA_news.6.b: "But I know we'll meet again some sunny day..."


 ENG_italo_british_war_dec_cat: "Italo-British War"
 ENG_italo_british_war_dec_cat_desc: "The war between [ENG.GetFlag]us and [ITA.GetFlag]Italy are not going in our favor with Italy - Suez, Malta and Gibraltar have already fallen. If we do not regain control of them soon or conclude a truce, everything may end sadly..."

 ENG_regain_lost_terr: "Regain control of the Mediterranean Sea"
 
 ENG_collapse_event.1.t: "[ITA.GetName] is taking over our Mediterranean bases!"
 ENG_collapse_event.1.d: "The war between us and Italy is not going in our favor - Suez, Malta and Gibraltar have already fallen. If we don't regain control of them soon or conclude a truce, everything may end sadly..."
 ENG_collapse_event.1.a: "We must ask for negotiations"
 ENG_collapse_event.1.b: "No truce!"

 ENG_collapse_event.2.t: "Panics in [ROOT.Capital.GetCapitalVictoryPointName]"
 ENG_collapse_event.2.d: "The Italian successes in the Mediterranean came as a shock to the entire British public. There is complete confusion in Westminster: ministers blame each other for the country's defeats, and opposition newspapers shout about the "end of the era of British hegemony," crowds take to the streets. In light of this news, the current government has resigned in disgrace to the cries of an irritated public. It feels like these are not just temporary problems, but the threshold of something more terrible."
 ENG_collapse_event.2.a: "We will hold out."
 
 ENG_collapse_event.3.t: "The crack in the Crown"
 ENG_collapse_event.3.d: "Britain is losing not only its external position, but also its internal unity. In Wales, thousands of protesters take to the streets of Cardiff, demanding autonomy and an end to the "Mediterranean Adventure." There is a wave of marches in Edinburgh, slogans about "English enslavers" and calls for secession are getting louder. And although the protests are not formally separatist in nature, the level of discontent is clearly off the charts. Police are reporting growing tensions, and local administrations are beginning to act autonomously, ignoring instructions from London."
 ENG_collapse_event.3.a: "The protests will take place by themselves"

 ENG_collapse_event.4.t: "Riots in the colonies"
 ENG_collapse_event.4.d: "Amid the growing chaos inside Britain, riots broke out in the colonies. \nIn Africa, there are large-scale uprisings against the garrisons, the population refuses to work for the British and obey them. At the same time, our dominions -Canada, Australia, and New Zealand - are deploying their troops into territories previously held by us for the sake of "restoring order." The empire is ablaze."
 ENG_collapse_event.4.a: "Collapse is inevitable."
 
 ENG_collapse_event.5.t: "[IRE.GetName] brings troops in"
 ENG_collapse_event.5.d: "Due to of chaos in the metropolis and the loss of control over the colonies, Ireland took a decisive step - its troops crossed the border and occupied Belfast without any resistance - the British garrisons did not offer any resistance, and part of the population completely meets the forces of Ireland as liberators. The international community is confused, but no one is rushing to intervene."
 ENG_collapse_event.5.a: "We will get our own back."

 ENG_collapse_event.6.t: "England remains alone!"
 ENG_collapse_event.6.d: "After a few weeks of protests in Edinburgh and Cardiff, the local parliaments finally severed ties with London. Today, [GetDateText], new flags were raised in both capitals, and the independence of Scotland and Wales was proclaimed. \nEmpire is disintegrating before our eyes. Or do we still have a chance to change everything?"
 ENG_collapse_event.6.a: "We are too weak for a war on the island"

 ENG_collapse_event.7.t: "This is the end."
 ENG_collapse_event.7.d: "We are standing on the edge of a precipice. Numerous rebel groups refuse to obey orders, and catastrophic losses in the Mediterranean and separatist protests have undermined the remnants of state power. \nNow there are only two options left — to ignite the flames of civil war or to sign a humiliating peace with the Italian invaders and their allies. What should we do?"
 ENG_collapse_event.7.b: "Death to all enemies, both external and internal!"
 ENG_collapse_event.7.a: "Capitulate..."


