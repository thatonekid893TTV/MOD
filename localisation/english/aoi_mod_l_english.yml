 ITA_other_event.6.t: "Further Expansion"
 ITA_other_event.6.d: "Ethiopia is now fully under Italian control. In our plans is the creation of a United Italian Africa, bringing together Libya, Italian East Africa, as well as Egypt and Sudan, currently under British control. Uniting these lands under our administration will strengthen Italy's influence on the continent, allow effective management of resources, and develop infrastructure that will bring prosperity to our colonies. The time to act and realize our ambitions has come — Africa awaits Italy!"
 ITA_other_event.6.a: "Only a little remains to be done!"

 
 ALL_can_be_later_integrated: "§GLater these territories can be integrated§!"
 
 is_italian_africa_focus_tt: "If §YItalian Africa§! is §YLibya§! or §YEgypt§!, they must complete the focus §YItalian Hegemony§!. If §YItalian Africa§! is §YItalian East Africa§!, it must complete the focus §YFaithful Colony§!."
 
 
