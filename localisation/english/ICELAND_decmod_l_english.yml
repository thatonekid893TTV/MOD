 ICE_events_decmod.1.t:0 "Forging a great Artifact"
 ICE_events_decmod.1.desc:0 "With our newly created Volcanic Forges still being questioned by some, it would really help if [ICE.GetLeader] would commission something that can publicly show the people that the government endorses them."
 ICE_events_decmod.1.a:0 "An Axe can show our strenght"
 ICE_events_decmod.1.b:0 "A Shield will be symbolic"
 ICE_events_decmod.1.c:0 "One Ring to Rule them All"
 ICE_events_decmod.1.d:0 "Our King needs a Crown that will be passed down for generations"
 ICE_events_decmod.1.e:0 "A Great Hammer"
