 ICE_a_kindom_of_our_own:0 "Our Own Kingdom"
 ICE_a_kindom_of_our_own_desc:0 "$ICE_the_kingdom_of_iceland_desc$"
 ICE_the_grand_fleet:0 "The Grand [ICE.GetAdjective] Royal Fleet"
 ICE_the_grand_fleet_desc:0 "Our beloved King Knud I. has declared that in Order to defend our Island among increasing international Tension and War being at this point inevitable, we need to be prepared to fight of any Invaders before they reach our shores."
 ICE_knud_ship_tt:0 "Adds a §YKnud-Class Battleship§! to the production queue at 75% complete."
 ICE_the_royal_academy:0 "The Royal [ICE.GetAdjective] Academy"
 ICE_the_royal_academy_desc:0 "His Majesty is certain that our Nation must become a have of higher Education. To that Purpose, he will personally sponsor the Royal Academy."
 ICE_viking_norway:0 "Proclaim Viking Norway"
 ICE_viking_norway_desc:0 "The Viking Age will come again at our Hands. We must take our Ambitions across the Atlantic to form a great Viking State once again and bring down the Regime in Oslo."
 ICE_longhouse_dec_tt:0 "Unlock Decisions to §YBuild Viking Longhouses§!"
 ICE_modern_longships:0 "Construct Modern Longships"
 ICE_modern_longships_desc:0 "Our great Ancestors traveled all across the known World in their Longships. We must build a great raiding Fleet like theirs once again, and we will make ourselves known on all seven Seas this time."
 ICE_renewed_raids:0 "Renewed Raids"
 ICE_renewed_raids_desc:0 "We shall use our new Fleet to extract Loot from the chumps that have foolishly layed down their Arms and abandoned the Path of their Ancestors. Afterall, Might does indeed make right."
 ICE_raiding_dec_tt:0 "Unlock Decisions to §YRaid in the North Atlantic and Baltic Sea§!"
 ICE_restore_the_varangian_guard:0 "Restore the Varangian Guard"
 ICE_restore_the_varangian_guard_desc:0 "The Varangians once made up the Bulk of the eastern Roman special Forces. This great Honor might not be something we can restore, but we should celebrate their Discipline and Dedication."
 ICE_is_friend_tt:0 "If §Y[THIS.GetName]§! is in a Faction with §Y[ICE.GetNameDef]§!:\n"
 ICE_varangian_adventures:0 "Varangian Adventures"
 ICE_varangian_adventures_desc:0 "Many cneturies ago, our glorious Ancestors ventured from their frozen homes and raided all across Europe. And while the that is the most well remembered Part is the Looting, they were also Traiders, Conquerors and Settlers. We should make a point of reminding the world of that as well."
 ICE_urbanise_iceland:0 "Urbanise Iceland"
 ICE_urbanise_iceland_desc:0 "The Island is a great Base with a great strategic Importance, but is very much underdevelopped. With our newly 'found' Wealth, we will invest in the Economy of Iceland and bring it up to the continental Standart."
 ICE_weapons_forged_from_volcano_steel:0 "Weapons forged from Volcanos"
 ICE_weapons_forged_from_volcano_steel_desc:0 "Iceland has many active volcanos, it would be a waste to not use them in our war effort. The high Temperatures of the lava will be used to melt ore into whatever metal we may desire."
 ICE_use_geathermal_energy:0 "Use Geothermal Energy"
 ICE_use_geathermal_energy_desc:0 "Our Island is well know for the great amount of Geysirs that can be found here, we will use the great Geothermal Energy to power our Factories and Homes."
 ICE_bring_down_the_pretenders:0 "Bring down the Pretenders"
 ICE_bring_down_the_pretenders_desc:0 "The Regime in Oslo still seems to think that they can hold on to the Illusion that we are nothing but a nuisance. We will proove them wrong with a great reclamation of the Homeland."
 ICE_the_shield_maiden:0 "Venerate the Shield Maiden"
 ICE_the_shield_maiden_desc:0 "Some of our Women are interrested in signing up for military Service, citing the history of the Shield Maiden. We can always use more Soldiers and Sailors, so we should promote the veneration of the Shield Maiden."
 ICE_the_great_capital:0 "Our Great Capital"
 ICE_the_great_capital_desc:0 "We must build a great Capital where all our 'aquired' Wealth is put on full display alongside our Inudtrial Might. Our People must understand the Importance of Oslo and, should it be assaulted by the Enemy, it is to be defended until the last drop of Blood."
 ICE_rehabilitate_the_norwegian_officers:0 "Rehabilitate Norwegian Officers"
 ICE_rehabilitate_the_norwegian_officers_desc:0 "The former Norwegian General Staff is not fully irredemable. Perhaps we can teach them our values and make them fully functioning members of Norse Society, and perhaps even restore their Command."
 ICE_claim_greater_norway:0 "Claim Greater Norway"
 ICE_claim_greater_norway_desc:0 "Once, Norway was a respected Worldpower, allthough we have fallen far, our recent conquests have brought about a resurgance, we have to relcaim all lost land and conquer the former Lands of the Kingdom of Norway, by whatever force necessary."
 ICE_return_to_vinland:0 "Return to Vinland"
 ICE_return_to_vinland_desc:0 "We shall reclaim what we once had on the American Continent. Soon enough the locals will be assimilated."
 ICE_raid_the_french_coast_once_again:0 "Settle the French Coast"
 ICE_raid_the_french_coast_once_again_desc:0 "A Milenia ago, the french Coastline was littered with Viking Outposts. We shall reclaim not only small enclaves, but the whole Area, it is our rightfull claim."
 ICE_sail_to_kiev:0 "Sail to Kiev"
 ICE_sail_to_kiev_desc:0 "Perhaps the Greatest Achievement of our Ancestors was founding an Empire that would be one of Europes foremost powers for some time. Certainly the locals will wish to reclaim the Kievan Glory and join us in the pursuit of it."
 ICE_march_on_novgorod:0 "March on Novgorod"
 ICE_march_on_novgorod_desc:0 "We are Raiders and Traiders! For our lifestyle, Ports along major Rivers are important, and so a city of as many Rivers as Novgorod is crucial to our future prospects."
 ICE_settle_coastal_vinland:0 "Settle Coastal Vinland"
 ICE_settle_coastal_vinland_desc:0 "We shall send out Settlers to Vinland, there is more than enough land for everyone there and someone cultivating the land will be beneficial."
 ICE_honor_the_rurikids:0 "Honor the Rurikids"
 ICE_honor_the_rurikids_desc:0 "The House of Rurikid once ruled much of the East and was one of Europes most prestigeous Families. Their Viking Heritage is very much important to our Project, and we shall honor their legacy by restoring their Capital's former Splendor."
 ICE_novgorod_trade_hub:0 "The Great Trade Hub"
 ICE_novgorod_trade_hub_desc:0 "The great Trading City of Novgorod was once widely renowned. Now it is overshadowed by Peter's little Project in the Golf of Finland. This must be corrected."
