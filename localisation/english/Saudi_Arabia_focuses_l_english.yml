l_english:
  SAU_kangmi_yu_minzhu: "Red and Blue"
  SAU_wahabi_yu_diguo: "Tradition and Empire"
  SAU_jiudi_laxide: "Lord of Mount Shemayr"
  SAU_saiyide_huigui: "Sayyid's Return"
  SAU_renzhu_duyipai: "Monotheists"
  SAU_gulao_shenhua: "Jahiliyya"
  SAU_junshi_shrtycu: "Military"
  SAU_gongye_shrtycu: "Industry"
  ########################################################################################################################################    工业   ###########################################################
  ####################################################################################################
  Saudi_Arabia_gongye_wunianjihua_one: "The First Five-Year Plan"
  Saudi_Arabia_gongye_wunianjihua_one_desc: "Despite its strong communist overtones, the Five-Year Plan is undeniably a useful tool for planning a country's economic development. We should introduce plans to guide the development of our industry."
  Saudi_Arabia_gongye_zengjia_yiliao_touzi: "Increase Medical Facilities"
  Saudi_Arabia_gongye_zengjia_yiliao_touzi_desc: "[SAU.GetAdjective]'s medical facilities are severely inadequate. Dysentery, cholera, and malaria plague the countryside, hindering development. Increasing facilities across the country will effectively address this situation."
  Saudi_Arabia_gongye_qingli_nueji: "Eliminating Malaria"
  Saudi_Arabia_gongye_qingli_nueji_desc: "Malaria remains a scourge in many parts of our country. By clearing areas that harbor malaria parasites, we can eliminate this long-standing historical challenge for rural populations and open up new land for development."
  Saudi_Arabia_gongye_jiang_mumin_qianru_chengshi: "Relocating pastoralists to cities"
  Saudi_Arabia_gongye_jiang_mumin_qianru_chengshi_desc: "Before Saudi unification, Bedouins lived largely nomadic lives and generally did not work in our cities. By developing housing in cities and encouraging migration, the urban workforce will be increased."
  Saudi_Arabia_gongye_jianli_yiliao_zhongxin: "Establishing medical centers"
  Saudi_Arabia_gongye_jianli_yiliao_zhongxin_desc: "In recent years, many life-threatening diseases have swept the country. We will focus on training new medical specialists and lay the foundation for a Ministry of Public Health to organize research and develop medical expertise nationwide. Such an institution may sound expensive, but it will save thousands of lives."
  Saudi_Arabia_gongye_amei_shiyou_tance: "Oil Exploitation"
  Saudi_Arabia_gongye_amei_shiyou_tance_desc: "On May 29, 1933, Saudi Arabia signed a concession agreement with Standard Oil of California, allowing California-Arabian Standard Oil (CASOC), a wholly-owned subsidiary of CASOC, to explore for oil in Saudi Arabia."
  Saudi_Arabia_gongye_shiyou_one: "Dammam 7 Oil Well"
  Saudi_Arabia_gongye_shiyou_one_desc: "The development of Dammam 7 Oil Well will significantly increase our country's oil production capacity. The commissioning of this rich oil field will provide us with vital industrial resources and foreign exchange earnings."
  Saudi_Arabia_gongye_shiyou_one_tt: "This national policy will be implemented independently by §YStandard Oil§!."
  Saudi_Arabia_gongye_lianyouchang_flag: "§YDaman No. 7 Oil Well§! has been successfully exploited."
  Saudi_Arabia_gongye_shiyou_two: "Expanding Standard Oil's Oil Field Exploration Rights"
  Saudi_Arabia_gongye_shiyou_two_desc: "Granting Standard Oil Company oil field exploration and production rights within an additional 200,000 square kilometers of our country will help unearth the precious treasures beneath this yellow sand, which will completely change Saudi Arabia's destiny."
  Saudi_Arabia_gongye_shiyou_three: "Ghawar Oil Field"
  Saudi_Arabia_gongye_shiyou_three_desc: "The Ghawar Oil Field, located in eastern Saudi Arabia, is the world's largest oil field with proven reserves and the largest onshore oil field. Developing the massive Ghawar oil field will allow this black ocean beneath the desert to drive the Kingdom's modernization."
  Saudi_Arabia_gongye_lianyouchang: "Ras Tanura Refinery"
  Saudi_Arabia_gongye_lianyouchang_desc: "Establishing a modern refinery will enable us to be more competitive on the world stage and diversify our economy, greatly facilitating the import and export of crude oil and its products."
  Saudi_Arabia_gongye_kuojian_yuanyou_matou: "Expanding the Crude Oil Terminal"
  Saudi_Arabia_gongye_kuojian_yuanyou_matou_desc: "With the war machine's growing thirst for oil, we must expand our port facilities, increase our oil export capacity, and ensure unimpeded access to our oil trade routes."
  Saudi_Arabia_gongye_haishang_shiyou: "Exploiting the Safaniyah Field"
  Saudi_Arabia_gongye_haishang_shiyou_desc: "Standard Oil has discovered the Safaniyah field, the world's largest offshore oil field, on the Gulf shelf. If we can exploit these reserves, we will have better control over oil prices and become more self-sufficient."
  Saudi_Arabia_gongye_shate_amei_shiyougongsi: "Restructuring Saudi Aramco"
  Saudi_Arabia_gongye_shate_amei_shiyougongsi_desc: "Following the Venezuelan model, we will implement a 50/50 profit-sharing system, requiring foreign companies extracting oil within our borders to pay half of all profits as income tax. The introduction of a series of tax mechanisms will further increase the government's total revenue from oil companies."
  Saudi_Arabia_gongye_xuanbu_shiyou_daheng: "Declare ourselves oil tycoons."
  Saudi_Arabia_gongye_xuanbu_shiyou_daheng_desc: "Instead of using our oil to finance wars waged by other countries around the world, we should keep it for our own use. If we stockpile oil in [SAU.Capital.GetCapitalVictoryPointName], we can ensure it can be sold at a high price to countries in need."
  Saudi_Arabia_gongye_congzhanzheng_huoli: "Profit from War"
  Saudi_Arabia_gongye_congzhanzheng_huoli_desc: "War brings wealth, and the current conflicts raging around the world present a golden opportunity. As technology advances, the belligerents will need more oil to fuel their war machines. We must not miss this opportunity."
  Saudi_Arabia_gongye_congzhanzheng_huoli_tt: "Unlock the decision §YSell Oil to Major Nations§!, allowing [SAU.GetAdjective] to sell oil to major nations and gaining an offshore plant."
  Saudi_Arabia_gongye_kuangye_daxue: "Establish a [SAU.GetAdjective] mining company."
  Saudi_Arabia_gongye_kuangye_daxue_desc: "To fully exploit the Kingdom's underground mineral wealth, we must cultivate local technical talent. By integrating domestic resources, establishing a state-owned mining system, and increasing industrial production capacity, we can transform this underground wealth into a driving force for national development."
  Saudi_Arabia_gongye_saiwenhe_tiekuang_kaicai: "Mining the Sevawenhe Iron Ore"
  Saudi_Arabia_gongye_saiwenhe_tiekuang_kaicai_desc: "Rich iron ore resources lie along the Sevawenhe River. Through systematic mining, these minerals will drive our country's industrialization and provide a solid foundation for our military and infrastructure."
  Saudi_Arabia_gongye_gangtiechang: "Expand the [SAU.Capital.GetCapitalVictoryPointName] Steel Plant"
  Saudi_Arabia_gongye_gangtiechang_desc: "We have discovered rich iron ore deposits, so now is the time to expand the steel industry in [SAU.Capital.GetCapitalVictoryPointName]. The new steel mills will provide our nation with the steel plates needed for modern weaponry."
  Saudi_Arabia_gongye_jinkuang_kaicai: "Mahd Dahab Gold Mine"
  Saudi_Arabia_gongye_jinkuang_kaicai_desc: "Mahd Dahab is home to Saudi Arabia's oldest gold mines. Using modern technology, we will exploit these resources, purchase the necessary supplies, expertise, and tools, and deliver them to where they are most needed."
  Saudi_Arabia_gongye_huangjin_touzi_chanye: "Putting Gold into Industry"
  Saudi_Arabia_gongye_huangjin_touzi_chanye_desc: "With our abundant gold reserves, we can transform our wealth into industrial capital, fuel modernization, and position Saudi Arabia to capitalize on the wave of change."
  Saudi_Arabia_gongye_caigou_guowai_jixie_shebei: "Purchasing Foreign Machinery and Equipment"
  Saudi_Arabia_gongye_caigou_guowai_jixie_shebei_desc: "Despite our vast mineral resources, we still lack the industrial machinery used by modern industrial nations. If we invest in importing these machines, our mining output and industrial productivity will increase significantly."
  Saudi_Arabia_gongye_wunianjihua_two: "Second Five-Year Plan"
  Saudi_Arabia_gongye_wunianjihua_two_desc: "Given the resounding success of the First Five-Year Plan, the nation's best government officials have once again gathered to discuss national affairs. If the First Five-Year Plan was so successful, why not formulate another one?"
  Saudi_Arabia_gongye_guojia_yinhang: "Acquire Saudi-Arabia Bank"
  Saudi_Arabia_gongye_guojia_yinhang_desc: "Saudi Arabian Bank was founded in 1926 as a branch of the Dutch Royal Bank. Handing over the power of minting to a foreign company is not a good idea. Acquiring Saudi Arabian Bank and establishing a national bank would be a crucial step in Saudi Arabia's modernization."
  Saudi_Arabia_gongye_gaige_nongye_bumen: "Reforming the Agricultural Sector"
  Saudi_Arabia_gongye_gaige_nongye_bumen_desc: "The [SAU.GetAdjective] food system has long been plagued by underdevelopment. With the success of the First Five-Year Plan, we have ample funding to ensure the development of agriculture. Through targeted reforms, infrastructure investment, and the introduction of modern technologies, we can increase production and build a more resilient food system."
  Saudi_Arabia_gongye_nongye_fazhan_jihua: "Agricultural Development Plan"
  Saudi_Arabia_gongye_nongye_fazhan_jihua_desc: "Through mechanization, we are bringing in and putting into use new machinery and equipment that we have imported, and making our agriculture more efficient. Reinvesting the increased tax revenue from this sector will further improve efficiency."
  Saudi_Arabia_gongye_shangpin_chukou: "Commodity Exports"
  Saudi_Arabia_gongye_shangpin_chukou_desc: "Dates, fig coffee: Your premium lifestyle, all made in Saudi Arabia! We can easily further enhance our international image as a top exporter of luxury goods."
  Saudi_Arabia_gongye_shuiguo_jiagong: "Date Processing"
  Saudi_Arabia_gongye_shuiguo_jiagong_desc: "The [SAU.GetAdjective] people are excellent farmers, and we should capitalize on any surplus they produce by packaging it for export. To do this, we must establish more industrial processing facilities."
  Saudi_Arabia_gongye_kuoda_kafei_chanye: "Expand the Coffee Industry"
  Saudi_Arabia_gongye_kuoda_kafei_chanye_desc: "There is a global demand for coffee. As the first region in the world to drink and produce coffee, Arabia's coffee culture is as ancient and rich as its history. We should capitalize on this advantage and invest in the coffee industry to strengthen our export trade."
  Saudi_Arabia_gongye_alabo_ma: "Arabian Horse"
  Saudi_Arabia_gongye_alabo_ma_desc: "The Arabian horse is the oldest horse breed on Earth. It was the first to be domesticated and has become a loyal companion throughout human history. Its courage, swiftness, and endurance make it an excellent choice for war."
  Saudi_Arabia_gongye_kuoda_yangzhi_mianyang: "Goat farming"
  Saudi_Arabia_gongye_kuoda_yangzhi_mianyang_desc: "Damask goats provide high-quality milk, meat, wool, and hides, and have high nutritional value. They are one of the few commodities currently exported in large quantities by [SAU.GetAdjective]. We can seize this opportunity to expand our nascent agricultural base by managing and establishing modern goat farms."
  Saudi_Arabia_gongye_guojia_guangbo_diantai: "National Radio"
  Saudi_Arabia_gongye_guojia_guangbo_diantai_desc: "With the establishment of National Radio, the government now has a method of communicating directly with the public. We can use it to ensure they receive the most objective and up-to-date information, or simply the information we want them to know."
  Saudi_Arabia_gongye_kuozhan_dianbao_wangluo: "Expanding the telegraph network"
  Saudi_Arabia_gongye_kuozhan_dianbao_wangluo_desc: "[SAU.GetAdjective] has fallen behind its neighbors in many economic indicators. The first step in modernizing the economy is to improve communications between cities and neighboring countries by expanding the telegraph network."
  Saudi_Arabia_gongye_dianqihua_jihua: "Electrification Plan"
  Saudi_Arabia_gongye_dianqihua_jihua_desc: "Innovations in industry, communications, and the military increasingly rely on electricity. We must ensure the nation can capitalize on these new technologies by expanding electrification across [SAU.GetAdjective]."
  Saudi_Arabia_gongye_dianqihua_jihua_tt: "§YElectrification will gradually spread outward, starting in Riyadh, with a new core region gaining this modifier every two months.§!"
  Saudi_Arabia_gongye_yu_yingbang_tuogou: "Depegging from the British Pound"
  Saudi_Arabia_gongye_yu_yingbang_tuogou_desc: "Our currency remains pegged to the British pound, severely limiting our ability to pursue economic policies that suit our needs. We must break free from this constraint, establish our own monetary authority, and ensure our sovereignty over the riyal."
  Saudi_Arabia_gongye_jichu_gongye_gongsi: "Basic Industrial Companies"
  Saudi_Arabia_gongye_jichu_gongye_gongsi_desc: "As oil revenues grow, we should invest in local industries and establish basic industrial companies to transform our resources into real productive forces, laying the foundation for our industrialization."
  Saudi_Arabia_gongye_jizan_hegu_daba: "Build the Jizan Valley Dam"
  Saudi_Arabia_gongye_jizan_hegu_daba_desc: "The drier regions of our country lack adequate irrigation, increasing harvest risks and potentially leading to famine. However, we can build dams to increase water availability for irrigation, which could even lead to agricultural surpluses."
  Saudi_Arabia_gongye_xinxing_gongye_chengshi: "New Industrial Cities"
  Saudi_Arabia_gongye_xinxing_gongye_chengshi_desc: "Modernized agriculture has freed people from working the fields. Investing in new industrial cities will provide these people with new jobs, thereby increasing our industrial output."
  Saudi_Arabia_gongye_alabo_tielu_jihua: "[SAU.GetAdjective] Railway Project"
  Saudi_Arabia_gongye_alabo_tielu_jihua_desc: "[SAU.GetAdjective] Saudi Arabia is bordered by the Persian Gulf to the east, the Red Sea to the west, the Great Nafud Desert to the north, and the Rub' al Khali Desert to the south. The [SAU.GetAdjective] railway project promises to be one of our greatest engineering achievements. By focusing our efforts on this domestic railway, we will be able to mobilize more efficiently during war."
  Saudi_Arabia_gongye_daman_liyade_tielu: "Dammam-Riyadh Railway"
  Saudi_Arabia_gongye_daman_liyade_tielu_desc: "The Eastern Province is the lifeline of our country's oil economy. Connecting Dammam and Riyadh will enable faster and more convenient transportation of oil."
  Saudi_Arabia_gongye_maidina_maijia_tielu: "Medina-Mecca Railway"
  Saudi_Arabia_gongye_maidina_maijia_tielu_desc: "Hajj tax plays a significant role in our country. The construction of the Medina-Mecca Railway is expected to enhance the pilgrim experience and attract more pilgrims."
  Saudi_Arabia_gongye_liyade_jida_tielu: "Riyadh-Jeddah Railway"
  Saudi_Arabia_gongye_liyade_jida_tielu_desc: "Jeddah, located on the Red Sea, is one of the main routes for North Korean oil exports to Europe. By expanding the Riyadh-Jeddah Railway, connecting the Eastern Province to Jeddah via Riyadh, it will further facilitate the transportation and export of oil."
  Saudi_Arabia_gongye_gongcheng_zhuangju: "An Engineering Feat"
  Saudi_Arabia_gongye_gongcheng_zhuangju_desc: "With the completion of the [SAU.GetAdjective] railway, we have also achieved a special feat. Our feat is impressive not only for its grand scale, but also for the engineering feat that overcame the steep [SAU.GetAdjective] route and high altitude terrain. We should be proud of the government and the contracting engineers who have accomplished this feat."
  Saudi_Arabia_junshixian_kaitou: "Military Modernization"
  Saudi_Arabia_junshixian_kaitou_desc: "While our military is capable of coping domestically, it remains one of the weakest in the Middle East and is often criticized for the state of its modernization efforts. It is time to seriously address the current state of our military."
  Saudi_Arabia_junshi_lujunxian_one: "[SAU.GetAdjective] Army"
  Saudi_Arabia_junshi_lujunxian_one_desc: "The threat of war looms, both from neighboring nations and distant lands. Furthermore, there are numerous factions within the country that could spark civil unrest. The only thing that can deter them is a strong armed force."
  Saudi_Arabia_kongjun_lujunxian_one: "[SAU.GetAdjective] Air Force"
  Saudi_Arabia_kongjun_lujunxian_one_desc: "The [SAU.GetAdjective] Air Force has never been our top priority, but now is the time to invest time and resources in developing our air force and training our pilots. We will show the world that we can command the skies."
  Saudi_Arabia_junshi_anquan_junshi_xueyuan: "Military Intelligence Security Bureau"
  Saudi_Arabia_junshi_anquan_junshi_xueyuan_desc: "Enemy military intelligence is of paramount importance. Without an accurate understanding of the enemy's positions and motives, it is difficult to defeat them in direct combat. Therefore, the establishment of a military intelligence department within the military is imperative."
  Saudi_Arabia_junshi_junshi_chanye_ju: "Military Industry Bureau"
  Saudi_Arabia_junshi_junshi_chanye_ju_desc: "To meet the needs of the armed forces, we must expand our weapons industry. Therefore, a new industry bureau dedicated to the production of military equipment must be established."
  Saudi_Arabia_junshi_junxie_yanjiu: "Armament Research"
  Saudi_Arabia_junshi_junxie_yanjiu_desc: "We now have sufficient facilities to effectively design and manufacture a wide range of support equipment. This eliminates the need to rely on trade to strengthen our military. Our new equipment will completely crush our enemies and ensure our continued success in any conflict."
  Saudi_Arabia_junshi_lujun_huoqu_waiguosheji: "Acquiring Foreign Designs"
  Saudi_Arabia_junshi_lujun_huoqu_waiguosheji_desc: "Even if we wish we had the scientists and engineers to manufacture our own armor, it would be best to leverage our existing connections to secure good deals on the international market, as this is currently the only real option for obtaining specialized equipment."
  Saudi_Arabia_junshi_touzi_qiche_chanye: "Investing in the Automotive Industry"
  Saudi_Arabia_junshi_touzi_qiche_chanye_desc: "Future warfare will require fast-moving vehicles that can encircle and destroy the enemy without giving them time to react. What's not needed are the infantry fire lines of the 16th or 17th centuries, a strategy that needlessly wastes time and manpower and is ineffective."
  Saudi_Arabia_junshi_zizhu_jundui_jixiehua: "Funding the mechanization of the army"
  Saudi_Arabia_junshi_zizhu_jundui_jixiehua_desc: "Some scientists are studying the possibility of using half-track vehicles for troop transport and equipping them with heavy armor. This option could be cheaper than tanks, but more rugged than trucks and capable of navigating more challenging terrain. Perhaps we should fund this project."
  Saudi_Arabia_junshi_wanshan_wuliu_tixi: "Improving the logistics system"
  Saudi_Arabia_junshi_wanshan_wuliu_tixi_desc: "Many generals in our senior command have a dismissive attitude towards logistics and supply chains, lacking a clear understanding of the current system's problems. As we embark on a comprehensive program to improve our logistics system, we must also make them aware of the critical importance of efficient logistics in modern warfare."
  Saudi_Arabia_junshi_zhuangjia_liliang: "Armored Forces"
  Saudi_Arabia_junshi_zhuangjia_liliang_desc: "The battlefield demands speed and power. By investing in armored vehicles and mechanized units, we are building a modern army capable of achieving decisive and swift victories, ensuring [SAU.GetAdjective] dominance in any conflict."
  Saudi_Arabia_junshi_duogongneng_tanke: "Multi-purpose Tanks"
  Saudi_Arabia_junshi_duogongneng_tanke_desc: "Just as we equip our infantry with multi-purpose sabers, we also need machines that can fill any gap and complete a variety of combat missions. We still have progress and catching up to do in tank warfare, so we must develop in all areas to have a well-rounded force."
  Saudi_Arabia_junshi_zixing_huopao: "Self-Propelled Artillery"
  Saudi_Arabia_junshi_zixing_huopao_desc: "The tank may have completely rewritten the laws of warfare, but self-propelled artillery remains the most valuable vehicle on the battlefield in many situations. The support these cheap and simple vehicles can provide against fortifications or enemy tanks can be crucial."
  Saudi_Arabia_junshi_xunlian_tanke_zhihuiguan: "Training Armored Commanders"
  Saudi_Arabia_junshi_xunlian_tanke_zhihuiguan_desc: "To maximize the effectiveness of our tank divisions, they must be led by capable commanders. To this end, we must prepare to send our commanders back to training camp to learn how to effectively integrate tank combat tactics."
  Saudi_Arabia_junshi_guowang_junshi_xueyuan: "[ROOT.GetLeader] Military Academy"
  Saudi_Arabia_junshi_guowang_junshi_xueyuan_desc: "Compared to other powers in the region, our military has proven to be significantly underdeveloped in both equipment and thinking. We need to establish our own military academy to train a new generation of officers capable of modern warfare."
  Saudi_Arabia_junshi_waiguo_guwen: "Invite Foreign Military Advisors"
  Saudi_Arabia_junshi_waiguo_guwen_desc: "The quickest way to bring our military training up to modern standards is to invite advisors from Western nations. They will help train the next generation of [SAU.GetAdjective] soldiers to adapt to the ever-changing battlefield."
  Saudi_Arabia_junshi_shizahn_moni: "Realistic Combat Simulations"
  Saudi_Arabia_junshi_shizahn_moni_desc: "We no longer have any excuses to conceal our geopolitical stance from our adversaries. Therefore, we have nothing to lose by involving our military in war games simulating engagements with our adversaries."
  Saudi_Arabia_junshi_tiba_qingnian_junguan: "Officer Training"
  Saudi_Arabia_junshi_tiba_qingnian_junguan_desc: "A good officer inspires his men to fight in the face of adversity, but may be blind to hopeless situations. A good leader recognizes adversity but makes the best of it. A great leader strategically extricates himself from adversity and strikes again from a more advantageous position. We will identify and train our officers to be the best they can be."
  Saudi_Arabia_junshi_tiba_qingnian_junguan_tt: "§YAll Army Commanders§!: Increase Planning Ability: §G1§!: Increase Logistics Ability: §G1§!"
  Saudi_Arabia_junshi_tiba_qingnian_junguan_1_tt: "§YThree§! random Army Commanders will receive §Y$career_officer$§!: -$MODIFIER_UNIT_LEADER_PROMOTE_COST_FACTOR$: §G-25%§! "
  Saudi_Arabia_junshi_lujun_zhuanyehua: "Army Professionalization"
  Saudi_Arabia_junshi_lujun_zhuanyehua_desc: "Current events have demonstrated that a loose militia comprised of reservists is woefully inadequate. To meet the coming conflict, we must train all physically qualified individuals and transform them into a formidable professional force."
  Saudi_Arabia_junshi_luoshi_bingyi: "Implementing Military Service"
  Saudi_Arabia_junshi_luoshi_bingyi_desc: "Contract soldiers are too small to defend our sovereignty against aggressive neighbors. Therefore, we will implement compulsory military service to ensure that all men of conscription age receive minimum military training."
  Saudi_Arabia_junshi_lianhezuozhan_silingbu: "Joint Operations Command"
  Saudi_Arabia_junshi_lianhezuozhan_silingbu_desc: "Now that we have not only developed our Army but also laid a good foundation for our Air Force, it is time to establish coordination and cooperation between these different services. Therefore, we will establish a joint operations command, composed of commanders drawn from both services."
  Saudi_Arabia_junshi_qingdaofu_zhanshu: "Scavenger Tactics"
  Saudi_Arabia_junshi_qingdaofu_zhanshu_desc: "As we expand our industrial base, we should train our troops to forage and salvage what can be salvaged on the battlefield. This will be a vital method for them to maintain their supply until we can consistently produce and transport our own equipment."
  Saudi_Arabia_junshi_alabo_qibingtuan: "Bedouin Cavalry"
  Saudi_Arabia_junshi_alabo_qibingtuan_desc: "Our region has a long and proud tradition of equestrianism. We should honor these traditions and ensure that our cavalry units are held in the highest regard, then deploy them to the forefront of our armed forces."
  Saudi_Arabia_junshi_luotuo_qibing_tuan: "Hot Sand Warriors"
  Saudi_Arabia_junshi_luotuo_qibing_tuan_desc: "If we want to fight for a long time in the harsh conditions of the Middle East and North Africa, we must rebuild our Camel Cavalry Corps!"
  Saudi_Arabia_junshi_panyan_julebu: "Establish a Mountain Climbing Division"
  Saudi_Arabia_junshi_panyan_julebu_desc: "Future invasions will most likely come from the north, and our battle to defend our homeland will most likely take place in the inhospitable mountains. We must have soldiers who can fight effectively in such harsh terrain."
  Saudi_Arabia_kongjun_xueyuan: "Air Force Academy"
  Saudi_Arabia_kongjun_xueyuan_desc: "Although we have established a preliminary pilot training mechanism, if we are to truly control the air, we need more professional education. The establishment of an official Air Force Academy in Tehran will greatly accelerate this process and ensure the quality of professional training for pilots."
  Saudi_Arabia_kongjun_liyade_hangkong_jichang: "Riyadh Airfield"
  Saudi_Arabia_kongjun_liyade_hangkong_jichang_desc: "Owning aircraft is meaningless if we don't have the infrastructure to fly them. The demands on our air force are constantly expanding, and we're severely lacking the necessary infrastructure."
  Saudi_Arabia_kongjun_leida_yanjiu: "Radar Research"
  Saudi_Arabia_kongjun_leida_yanjiu_desc: "Modern air forces rely not only on aircraft, but also on the technology to guide them. Radar technology has already been invented, and we can't let ourselves fall behind!"
  Saudi_Arabia_junshi_tongxun_xinxi_jishu: "Ministry of Communications and Information Technology"
  Saudi_Arabia_junshi_tongxun_xinxi_jishu_desc: "New technologies such as radio detection and ranging offer the world many opportunities and will undoubtedly become important areas of military technology in the future. We must ensure that we keep pace with global developments in these areas."
  Saudi_Arabia_kongjun_fangkong_wuqi: "Deployment of air defense weapons"
  Saudi_Arabia_kongjun_fangkong_wuqi_desc: "Regardless of where the invaders originate, they will undoubtedly use aircraft to control the skies and bomb our cities and military forces. Only by preparing air defenses can we offset such attacks from the air."
  Saudi_Arabia_junshi_sanbing: "Paratrooper Special Forces"
  Saudi_Arabia_junshi_sanbing_desc: "We have not overlooked the strategic importance of airborne forces. Training these elite paratroopers for rapid deployment behind enemy lines will enhance their versatility and combat effectiveness, thereby strengthening our overall offensive capabilities."
  Saudi_Arabia_kongjun_benguofeiji: "Domestic Aircraft Research"
  Saudi_Arabia_kongjun_benguofeiji_desc: "It is best for us to create and produce our own models and aircraft designs, as other countries' designs or production of aircraft claimed to be suitable for our pilots are not trustworthy."
  Saudi_Arabia_kongjun_waiguosheji_xuke: "Licensing Foreign Designs"
  Saudi_Arabia_kongjun_waiguosheji_xuke_desc: "Researching and developing aircraft of our own design would take too much time and effort. This is why we should obtain a production license for foreign equipment rather than insisting on [SAU.GetAdjective] domestic production."
  Saudi_Arabia_kongjun_goumai_guowai_feiji: "Purchase Foreign Aircraft"
  Saudi_Arabia_kongjun_goumai_guowai_feiji_desc: "Our Air Force has decided that not only developing but also producing our own aircraft would be extremely expensive and time-consuming. Instead, they advocate purchasing foreign equipment, a position we should also adopt."
  Saudi_Arabia_kongjun_guojia_hangkong_gongsi: "[SAU.GetAdjective] Aviation Company"
  Saudi_Arabia_kongjun_guojia_hangkong_gongsi_desc: "It is clear that if we wish to maintain the highest possible productivity, we must develop a large-scale aircraft industry within our own borders."
  Saudi_Arabia_kongjun_cezhong_zhandouji: "Fighter Air Company Plan"
  Saudi_Arabia_kongjun_cezhong_zhandouji_desc: "Fighter aircraft must be able to defeat not only enemy aircraft, but also their anti-aircraft guns and the vigilant gaze of naval vessels. The air force should consist of small aircraft, suited to conduct dogfights and tactical strikes effectively, while never becoming too heavy to maneuver quickly and decisively."
  Saudi_Arabia_kongjun_cezhong_gongjiji: "Tactical Air Force Air Company Plan"
  Saudi_Arabia_kongjun_cezhong_gongjiji_desc: "The air force should not only support ground forces but also perform many more complex missions that ground forces alone cannot accomplish. This is the true essence of a great air force."
  Saudi_Arabia_kongjun_cezhong_daxingfeiji: "Flying Fortress Project"
  Saudi_Arabia_kongjun_cezhong_daxingfeiji_desc: "The only way to properly utilize the air force is to bombard the enemy with it, bringing them to their knees until nothing remains before the horizon. Therefore, we should build large aircraft capable of carrying as much explosives as we need."
  Saudi_Arabia_kongjun_shiyan_wuqi: "Experimental Weapons Department"
  Saudi_Arabia_kongjun_shiyan_wuqi_desc: "If we do not want to lag behind our competitors in the technological field, then we had better begin researching relevant theories and attempting to develop so-called miracle weapons to avoid being defeated on the battlefield."
  Saudi_Arabia_kongjun_lilunjinbu: "Theoretical Advancement"
  Saudi_Arabia_kongjun_lilunjinbu_desc: "It is important to note that even the greatest pilots and aircraft cannot succeed in battle without the right strategy. Warfare is about planning, strategy, and leveraging the strengths of all individuals within a nation. Therefore, we should vigorously develop new theories that can be put into practice by the Air Force."
  Saudi_Arabia_kongjun_hedan_jihua: "Project Khalid"
  Saudi_Arabia_kongjun_hedan_jihua_desc: "The Americans and Germans are working to uncover the secrets of the atom, and we cannot allow ourselves to fall behind them. While their minds are preoccupied with war, our scientists are also demonstrating how to use atomic fission to improve civilian life."
  Saudi_Arabia_haijun_hangkong_bing: "Focused on Naval Support"
  Saudi_Arabia_haijun_hangkong_bing_desc: "The primary purpose of our military aircraft is to help us secure shipping lanes for our naval and civilian vessels and protect them. Therefore, it is important to design our aircraft with naval support and patrol roles in mind, and to ensure they can avoid being shot down by ship-borne anti-aircraft guns."
  Saudi_Arabia_haijun_lujunxian_one: "[SAU.GetAdjective] Navy"
  Saudi_Arabia_haijun_lujunxian_one_desc: "[SAU.GetAdjective] is bordered to the north and south by the Red Sea and the Persian Gulf, situated on one of the world's most important oil supply routes. Therefore, we must establish a naval force to protect our interests in the region."
  Saudi_Arabia_haijun_xueyuan: "Establish a [ROOT.GetLeader] Naval Academy"
  Saudi_Arabia_haijun_xueyuan_desc: "Simply producing and maintaining ships is not enough to make a navy. We need well-trained officers and specialists to learn how to utilize naval assets in combat. Therefore, we will establish the [ROOT.GetLeader] Naval Academy to train the next generation of naval officers."
  Saudi_Arabia_haijun_kuojian_xiuli_matou: "Expand the repair docks"
  Saudi_Arabia_haijun_kuojian_xiuli_matou_desc: "Even the sturdiest ships with the most efficient crews will eventually require repairs before returning to service. We should invest in our naval repair yards to ensure this process proceeds as quickly as possible."
  Saudi_Arabia_haijun_guwen: "Invite foreign naval advisors"
  Saudi_Arabia_haijun_guwen_desc: "Our naval officers have had few opportunities lately to test their abilities in combat. Therefore, we would benefit from inviting foreign naval officers to train our own officers in modern naval tactics."
  Saudi_Arabia_haijun_haijun_luzhandui: "Establish a Marine Corps"
  Saudi_Arabia_haijun_haijun_luzhandui_desc: "If we hope to establish influence abroad, we need to develop a naval force, a 'naval commando', capable of conducting daring naval invasions and penetrating enemy coastal defenses."
  Saudi_Arabia_haijun_goumai_jianchuan: "Buy ships"
  Saudi_Arabia_haijun_goumai_jianchuan_desc: "Building new ships from scratch is prohibitively expensive, but many nations may be willing to part with a fleet of older vessels. While these are outdated, they can be quickly refitted to cheaply expand their forces."
  Saudi_Arabia_haijun_hangkong_muujian: "Study aircraft carriers"
  Saudi_Arabia_haijun_hangkong_muujian_desc: "It has been repeatedly demonstrated that future wars will depend heavily on air superiority, both on land and at sea. The purpose of an aircraft carrier is to control the skies above enemy ships and quickly sink them with a display of divine justice."
  Saudi_Arabia_haijun_cunzai_jianudi: "Presence Fleet"
  Saudi_Arabia_haijun_cunzai_jianudi_desc: "By building a large naval force, even if we never deploy it, its presence can deter our enemies: the thought of our fleet sailing forward and striking their routes forces them to tread more cautiously."
  Saudi_Arabia_haijun_xiji_jianudi: "Strike Fleet"
  Saudi_Arabia_haijun_xiji_jianudi_desc: "Naval supply lines are vital to the functioning of most economies. Using our naval might to disrupt these supply lines could be a way to bring even the most powerful nations to their knees."
  Saudi_Arabia_haijun_xunyang_qianting: "Cruiser Submarines"
  Saudi_Arabia_haijun_xunyang_qianting_desc: "Cruiser submarines represent the pinnacle of heavy underwater assault. What they lack in maneuverability and stealth, they more than make up for in range."
  Saudi_Arabia_haijun_xiuzhen_qianting: "Midget Submarines"
  Saudi_Arabia_haijun_xiuzhen_qianting_desc: "Self-sufficient submarines operating in the vast oceans are futile. We can better utilize our resources by building smaller ships that operate in the shallow waters off our coasts."
  Saudi_Arabia_haijun_xiaoci: "Degaussing"
  Saudi_Arabia_haijun_xiaoci_desc: "We will begin degaussing our ships, reducing their magnetic signature. This will protect them from magnetic mines and reduce the ships' electronic signature."
  Saudi_Arabia_haijun_bosiwan_jiandui: "Persian Gulf Fleet"
  Saudi_Arabia_haijun_bosiwan_jiandui_desc: "The Persian Gulf is a vital sea route for our oil exports, so protecting it at all costs is worthwhile. Focusing training on activities in the Persian Gulf will ensure that any invader from the north will have difficulty landing by sea."
  Saudi_Arabia_haijun_honghai_jiandui: "Red Sea Fleet"
  Saudi_Arabia_haijun_honghai_jiandui_desc: "The Red Sea, connected to the Mediterranean Sea to the northwest via the Suez Canal, is a vital route to the Mediterranean and the primary route for our oil shipments to Europe. Focusing training on Red Sea activities will ensure that any invaders from the south will have difficulty landing by sea."
  Saudi_Arabia_haijun_daman_gangkou: "Expanding the Port of Dammam"
  Saudi_Arabia_haijun_daman_gangkou_desc: "More and larger ships are traveling to and from the Eastern Province, which means we need a larger port. The state should fund the expansion of the Port of Dammam so that we can further develop our economy."
  Saudi_Arabia_haijun_jida_gangkou: "Kingdom Port of Jeddah"
  Saudi_Arabia_haijun_jida_gangkou_desc: "Jeddah is the main port of Mecca and a vital stop for anyone making the Hajj by sea. Expanding this city will make the holy city more accessible and will aid the economic development of our humble nation."
  Saudi_Arabia_haijun_haishang_bulei: "Sea Mine Laying Strategy"
  Saudi_Arabia_haijun_haishang_bulei_desc: "While placing mines on the sea would severely impact the efficiency of our oil shipments, ensuring that hostile traffic cannot pass through would increase our security from naval invasions."
  Saudi_Arabia_haijun_haishang_bulei_tt: "\nUnlocks the decision: §Y$SAU_mining_the_sea$§!, allowing us to deploy mines at §Y$STRATEGICREGION_100$§! and §Y$STRATEGICREGION_203$§!."
  ######################################################################################################################################     政治      ###########################################################################################################
  Saudi_Arabia_focus_one: "The Kingdom of Yellow Sands"
  Saudi_Arabia_focus_one_desc: "The united kingdoms of Najd and Hejaz hold sway over the heart of the Arabian Peninsula. Rich oil resources and Wahhabi traditions will determine the fate of this desert land—will it become a modern power, cling to ancient beliefs, or return to its former glory..."
  Saudi_Arabia_changye_manman: "The Night Is Long"
  Saudi_Arabia_changye_manman_desc: "The yellow sands stretch endlessly, the night is endless. The descendants of the Bedouin persevere amidst poverty. Oil will ignite the flames of revival, and the game of royal power and reform will soon be revealed—the day finally dawns, and Saudi Arabia is on the verge of a great renaissance..."
  Saudi_Arabia_luori_yuhui: "The Afterglow of the Sunset"
  Saudi_Arabia_luori_yuhui_desc: "Ibn Saud's banner has blanketed the peninsula, but the shadow of the past remains. Rashid's shadow lingers in the old lands, and Hashemite ambitions lurk in the north. Oil wealth illuminates the future, but beneath the throne, undercurrents still surge..."
  Saudi_Arabia_huangliang_yimeng: "A Yellow Millet Dream"
  Saudi_Arabia_huangliang_yimeng_desc: "The Ikhwan's dream of jihad was shattered by an iron fist, and the ancient Bedouin gods were burned by the fire of Wahhabism. Though the glory of the past has faded, oppression will eventually ignite the flames of resistance—the people of the Yellow Sands will finally seize their own dawn."
  ###########################################################################################################
  Saudi_Arabia_jiaofa_caijue_yubo: "The Aftermath of the Shariah Ruling"
  Saudi_Arabia_jiaofa_caijue_yubo_desc: "We are part of the kingdom of the truly oppressed, while the Saudi monarchy is part of the kingdom of the true oppressors and colonizers. The ongoing battle is between these two kingdoms... Our struggle against tyranny is part of a long chain of world revolution that will inevitably lead to the collapse of the imperialist superpowers and the rise of the oppressed world."
  Saudi_Arabia_stage_mass_protests: "Organizing Protests"
  Saudi_Arabia_stage_mass_protests_desc: "The people have had enough of Ibn Saud's excuses and Wahhabi abuses. It is time for us to take to the streets and demand immediate change."
  Saudi_Arabia_zhengqu_beifang: "Fighting for the North"
  Saudi_Arabia_zhengqu_beifang_desc: "Before the operation, we can contact the Shamayr tribe to gain the support of Rashid's former followers and ensure that the northern tribes will join us in the fight against Ibn Saud's tyranny."
  Saudi_Arabia_zhengqu_beifang_tt: "Secure the support of the northern tribes and have them side with us once the §YCivil War§! begins. Receive §G4§! tribal divisions after the §YCivil War§! begins."
  Saudi_Arabia_zhengqu_nanfang: "Strive for the South."
  Saudi_Arabia_zhengqu_nanfang_desc: "The Yemeni Imam State in the south is our compatriot, and the neighboring holy lands also have Shia communities. We must win their support and, in the event of rebellion, sever the holy lands' ties with Riyadh and deal a fatal blow to the tyrant!"
  Saudi_Arabia_zhengqu_nanfang_tt: "Secure the support of the southern Shia and have them side with us once the §YCivil War§! begins. Receive §G3§! militia divisions after the §YCivil War§! begins." 
  Saudi_Arabia_waiguo_zhiyuanzhe: "Foreign Volunteers"
  Saudi_Arabia_waiguo_zhiyuanzhe_desc: "The Hashemites to the north and Iran across the sea are Shia, like us. To resist the tyrannical rule, we can establish civil ties with them, let our compatriots witness the tragedy in their communities, and plead for their help."
  Saudi_Arabia_waiguo_zhiyuanzhe_tt: "Seek the support of our fellow foreign compatriots. If they agree, they will send volunteers to aid us after our §Ycivil War§! begins. The higher their §Grating§!, the more likely they are to accept. The base agree/reject value is §G1.0§!, and a §Grating§! greater than §G45§! is §G10.0§!."
  SAU_tongbao_zhiyuanjun: "Shia Volunteer Resolution"
  Saudi_Arabia_ashulajie_de_huixiang: "Ashura Celebrations"
  Saudi_Arabia_ashulajie_de_huixiang_desc: "We are part of the kingdom of the truly oppressed, while the Saudi monarchy is part of the kingdom of the true oppressors and colonizers. The ongoing battle is between these two kingdoms... Our struggle against tyranny is part of a long chain of world revolution that will inevitably lead to the collapse of the imperialist superpowers and the rise of the world of the oppressed."
  Saudi_Arabia_zuoxian_one: "First Congress of Saudi Qammufiqh"
  Saudi_Arabia_zuoxian_one_desc: "With the success of the rebellion against Ibn Saud's tyranny, the continued progress of our cause requires an end to the internal divisions among the country's democratic parties. A first congress attended by all Qammufiqh will be empowered by popular will to eliminate the economic conditions that foster religious extremism."
  Saudi_Arabia_biancuan_xinxianfa: "Drafting a New Constitution"
  Saudi_Arabia_biancuan_xinxianfa_desc: "The People's Republic cannot survive by relying on the laws of the old kingdom. We must draft a new constitution that reflects the will of the workers, peasants, and landless, not the arrogance of the monarch or the colonial bureaucracy."
  Saudi_Arabia_biancuan_xinxianfa_tt: "Traditional religious forces in the north may raise objections, and if we fail to appease them, we could risk a second §Rcivil War§! scenario."
  Saudi_Arabia_shehuizhuyi_jingji: "Establish a socialist economy."
  Saudi_Arabia_shehuizhuyi_jingji_desc: "To truly improve our society, we must change the way money flows and remove those at the top of companies who only achieved their positions through nepotism. Workers will once again have a voice in their country, and all [SAU.GetAdjective] people will be equal!"
  Saudi_Arabia_jianli_gonghui: "Establish trade unions."
  Saudi_Arabia_jianli_gonghui_desc: "We must raise awareness among the [SAU.GetAdjective] people about their social and work rights. By establishing trade unions and workers' cooperatives, we will expose the [SAU.GetAdjective] government's disregard for workers."
  Saudi_Arabia_guoyouhua_gongye: "Nationalize industry." 
  Saudi_Arabia_guoyouhua_gongye_desc: "We have clearly seen from the world's major powers that governments that interfere with the free market have achieved remarkable economic results by controlling production and reducing unemployment. We will follow this example and rapidly expand the economy through nationalized industry."
  Saudi_Arabia_nongye_jitihua: "Socialist Agricultural Plan"
  Saudi_Arabia_nongye_jitihua_desc: "The New Agricultural Plan involves a series of state investments to ensure that the majority of [SAU.GetAdjective] farmers can purchase new machinery such as tractors to facilitate their harvests."
  Saudi_Arabia_xiandi_yundong: "Land Donation Movement"
  Saudi_Arabia_xiandi_yundong_desc: "Through voluntary land redistribution, we will empower the landless and restore justice in the countryside. By returning land to those who work it, we win not only their labor but also their enduring loyalty."
  Saudi_Arabia_kangmi_gaizao_daziran: "Transforming Nature"
  Saudi_Arabia_kangmi_gaizao_daziran_desc: "The Transforming Nature program must be implemented. Saudi Arabia's natural environment must serve the nation as much as its citizens. Rivers can be dammed, rocks can be mined. Nothing can stop us from moving forward."
  Saudi_Arabia_gongchanzhuyi_jiaoyu_zhongxin: "Communist Education Center"
  Saudi_Arabia_gongchanzhuyi_jiaoyu_zhongxin_desc: "The people must receive a proper education to think independently and not fall back into the trap of tribalism and barbarism. Therefore, we must work to establish an educational system and curriculum that reflects our views."
  Saudi_Arabia_saomang_gongzuo: "Literacy Project"
  Saudi_Arabia_saomang_gongzuo_desc: "Illiteracy is widespread among the working class, but with a little proper education, the situation will soon improve, and hidden talents will undoubtedly emerge."
  Saudi_Arabia_funv_jiaoyu: "Women's Education"
  Saudi_Arabia_funv_jiaoyu_desc: "Since the Islamic rule of the Arabian Peninsula, women have been denied education. Promoting university access for all will likely benefit our country."
  Saudi_Arabia_funv_jiaoyu_tt: "§OProviding education to women may be opposed by tribal leaders.§!"
  Saudi_Arabia_nvxing_puxuan_quanli: "Women's Suffrage"
  Saudi_Arabia_nvxing_puxuan_quanli_desc: "While this major shift in our electorate may bring some political instability, our women are a powerful force of support, and we can win them over to ensure public support!"
  Saudi_Arabia_niangzijun: "Women's Army"
  Saudi_Arabia_niangzijun_desc: "Revolutionary women from all political persuasions propose the formation of a Women's Guard to facilitate the mobilization and active participation of all classes in wartime."
  Saudi_Arabia_funv_quanli_pingdeng: "Equal Rights for Women"
  Saudi_Arabia_funv_quanli_pingdeng_desc: "Women are the linchpin and foundation of society. Granting them full and equal rights will enable [CAN.GetAdjective] to achieve its destined greatness."
  Saudi_Arabia_qiangzhi_shisuhua: "Forced Secularization"
  Saudi_Arabia_qiangzhi_shisuhua_desc: "Since the founding of the Republic, [SAU.GetAdjective] clergy have been in constant conflict with the government. While Islam is deeply rooted in this land, it is time to abolish it and embark on the path of modernization in order to prove to the West that we are capable of competing with it."
  Saudi_Arabia_yisilan_makesi_zhiyi: "Islamic-Marxist"
  Saudi_Arabia_yisilan_makesi_zhiyi_desc: "While Islam does not reflect the ideas and perspectives of Marxism, it is a good guiding tool. We should protect Islam and unify it with our own ideology. Cooperation with religious schools will pave the way for this."
  Saudi_Arabia_renmin_daxue: "[SAU.GetAdjective] People's University"
  Saudi_Arabia_renmin_daxue_desc: "To build a strong nation, we need an advanced education system that provides easy access to the greatest and brightest minds in [SAU.GetAdjective]. Early involvement will gain influence over the institution's research areas. Dedicating the university to the people simply ensures that these intellectuals will be happy to stay and aid our cause in the years to come."
  Saudi_Arabia_zhongyang_junshi_jihua_weiyuanhui: "Military Planning Committee"
  Saudi_Arabia_zhongyang_junshi_jihua_weiyuanhui_desc: "If the revolution is to succeed, we must establish a committee to foster greater strategic and military cooperation between us and our allies, while ensuring our military is in top fighting shape and ready to strike our enemies."
  Saudi_Arabia_zujian_anquan_weiyuanhui: "Forming a Security Committee"
  Saudi_Arabia_zujian_anquan_weiyuanhui_desc: "As world tensions rise, our ideological enemies grow. To maintain our power, we must focus on creating an intelligence agency that reinforces our values ​​within [SAU.GetAdjective] and internationally."
  Saudi_Arabia_xuanchuan_shouduan: "Propaganda"
  Saudi_Arabia_xuanchuan_shouduan_desc: "We have seen the power of propaganda before, and its effectiveness cannot be denied. By allocating resources to strengthen support for our glorious leader, we can ensure that the people's attitudes are what we desire."
  Saudi_Arabia_kangmi_jianli_qingniantuan: "Establishing the Kangmi Youth League"
  Saudi_Arabia_kangmi_jianli_qingniantuan_desc: "We have found that exposing children and youth to communist ideology and all its core values ​​at an early age can help them grow into loyal and happy citizens who are ready to both work and fight for their country when the need arises."
  Saudi_Arabia_tiba_junguan: "Promoting Officers"
  Saudi_Arabia_tiba_junguan_desc: "The nobility can no longer control our nation's military. Many of our brave soldiers have proven their leadership abilities. It is time to promote those with courage and fighting skills, rather than those with royal connections or personal wealth."
  Saudi_Arabia_quanmin_wuzhuang: "National Armament"
  Saudi_Arabia_quanmin_wuzhuang_desc: "If [SAU.GetAdjective] is to successfully defend itself against foreign invaders, we must promote a militarized society, ensuring that everyone can bear arms if needed for national defense."
  Saudi_Arabia_gensuijuren_de_jiaobu: "Following the footsteps of [SOU.Capital.GetCapitalVictoryPointName]"
  Saudi_Arabia_gensuijuren_de_jiaobu_desc: "Some members of our party had the honor of visiting [SOU.Capital.GetCapitalVictoryPointName]. They returned with praise for the [SOU.GetAdjective] way of governing. We should consider a closer alliance with [SOU.GetAdjective]."
  Saudi_Arabia_sulian_gongye_yuanzhu: "Soviet Industrial Aid"
  Saudi_Arabia_sulian_gongye_yuanzhu_desc: "Our allies possess far greater industrial capacity than our own. We will need their help if we are to weather the coming storm."
  Saudi_Arabia_sulian_junshi_guwen: "Soviet Military Advisors"
  Saudi_Arabia_sulian_junshi_guwen_desc: "Soviet military advisors can give our troops and commanders a sharp edge against the enemy."
  Saudi_Arabia_lianhe_kaifa_xiangmu: "Joint Development Projects"
  Saudi_Arabia_lianhe_kaifa_xiangmu_desc: "Since we are allies, we should strive to jointly establish laboratories and research cooperation programs to further develop weapons that are beyond the capabilities of this world's capitalists and imperialists."
  Saudi_Arabia_jungong_hezuo: "Soviet Military-Industrial Cooperation"
  Saudi_Arabia_jungong_hezuo_desc: "By negotiating with the [SOV.GetAdjective] before designing and producing our own weapons, we can produce powerful weapons that will cut through enemy lines like a hot knife through butter."
  Saudi_Arabia_hongjun_gongcheng_shi: "Red Army Engineers"
  Saudi_Arabia_hongjun_gongcheng_shi_desc: "Much of our country's infrastructure was destroyed during the civil war. If we want to establish a true workers' republic, we must not only rebuild the country but also initiate a program of rapid industrialization. Our Red Army comrades possess the skills to help us initiate this process."
  Saudi_Arabia_SOV_junshi_yanxi: "Soviet-Arab military exercises"
  Saudi_Arabia_SOV_junshi_yanxi_desc: "Our soldiers and officers have never faced an alliance like ours, and they must train as a unit until cooperation becomes second nature. Once this is achieved, the [SAU.GetAdjective] military will be unstoppable."
  Saudi_Arabia_SOV_shiyou_hezuo: "Soviet-Arab Oil Cooperation"
  Saudi_Arabia_SOV_shiyou_hezuo_desc: "[SAU.GetNameDefCap] and our friends in [SOU.GetAdjective] possess vast oil reserves. By coordinating and expanding production, we can firmly control this world's most important resource."
  Saudi_Arabia_he_wuqi_jihua: "Nuclear weapons program"
  Saudi_Arabia_he_wuqi_jihua_desc: "The launch of our atomic weapons program is a crucial step in [SAU.GetAdjective]'s journey from a small, unknown nation to a world power."
  Saudi_Arabia_minzu_zhenxian: "Creating Our Own Future"
  Saudi_Arabia_minzu_zhenxian_desc: "With the revolution's resounding success, the time has come to determine how we will shape [SAU.GetAdjective]'s future. Comrade Mustafa Wahba has been a staunch supporter of the [SAU.GetAdjective] Communist Party for many years and served as its first General Secretary. Many believe he is well-suited to lead our nation from now on, ushering [SAU.GetAdjective] into a new era of prosperity."
  Saudi_Arabia_jingji_guihua_weiyuanhui: "Establishing an Economic Planning Commission"
  Saudi_Arabia_jingji_guihua_weiyuanhui_desc: "While it is easy to overemphasize the present situation and neglect all other concerns, we must not forget that even small steps can lead to great results. By establishing a planning commission and formulating a series of economic plans, we can effectively develop the economy."
  Saudi_Arabia_kuaisu_gongyehua: "Rapid Industrialization"
  Saudi_Arabia_kuaisu_gongyehua_desc: "To stand the test of time, our new socialist government must industrialize rapidly. After all, we may now be a threat to those who fear the rise of the proletariat."
  Saudi_Arabia_qianghua_gonghui: "Sustainable Economy"
  Saudi_Arabia_qianghua_gonghui_desc: "The shift to the New Economic Policy has significantly shifted the focus of production toward consumer goods at the expense of slower industrialization. If we are to remain competitive in the long term, we must restructure our economy to a more sustainable model."
  Saudi_Arabia_diqu_fazhan: "Regional Development"
  Saudi_Arabia_diqu_fazhan_desc: "We must ensure that industrial development is spread throughout the country, rather than concentrating factories in a few areas and neglecting others."
  Saudi_Arabia_qu_zhongxin_hua: "Decentralization"
  Saudi_Arabia_qu_zhongxin_hua_desc: "Taking power away from the workers and placing it in the hands of corrupt elites is a clear counter-revolutionary act. We must enable the workers to control their own destiny."
  Saudi_Arabia_renmin_geming: "People's Revolution"
  Saudi_Arabia_renmin_geming_desc: "For a revolution to endure, it must permeate every aspect of society. Only if all the people see themselves as an integral part of the revolution can it withstand the hardships that lie ahead."
  Saudi_Arabia_zuigao_suwei_ai: "Arab Soviets"
  Saudi_Arabia_zuigao_suwei_ai_desc: "Allowing one man to represent an entire nation is inherently undemocratic, and therefore counter-revolutionary. We abandon this cult of personality and declare that from this day forward, our nation will forever be represented by the collective will of the people gathered in the Arab Soviet."
  Saudi_Arabia_shandong_zhongdong_geming: "Incite Revolution in the Middle East"
  Saudi_Arabia_shandong_zhongdong_geming_desc: "The Middle East, long oppressed by foreign powers, has reached the point of socialist revolution. We must arouse the people's desire for ultimate liberation from exploitation and raise the red flag of socialism."
  Saudi_Arabia_shandong_zhongdong_geming_tt: "Unlock a decision to §YStrengthen Communist Thought§! in §YSmall Middle Eastern Countries§!. Once the Communist Parties in the affected countries gain majority support, we will be able to win them over to §YCommunism§! and join ours."
  Saudi_Arabia_jiaqiang_jingji_hezuo: "Strengthen Economic Cooperation"
  Saudi_Arabia_jiaqiang_jingji_hezuo_desc: "With our government now more open to cooperation with our neighbors and international actors, we should strive for new trade agreements and economic pacts with our newfound allies."
  Saudi_Arabia_xiandai_fuli_zhidu: "Jointly train armies"
  Saudi_Arabia_xiandai_fuli_zhidu_desc: "Everyone knows they must defend their homeland, but if they fail to recognize the importance of cross-border cooperation and supporting neighbors in defending what they value, the Middle East's unity will surely collapse."
  Saudi_Arabia_alabo_lianmeng_zongshuji: "Secretary-General of the Arab League"
  Saudi_Arabia_alabo_lianmeng_zongshuji_desc: "We must build a coalition of like-minded Arab nations to protect Arab interests from external interference."
  Saudi_Arabia_tuanjie_gongfu_shengli: "United for victory"
  Saudi_Arabia_tuanjie_gongfu_shengli_desc: "Arabs have suffered foreign domination for too long, but now is the time for our people to join the fight against the invaders and fight for our homeland and our rights."
  Saudi_Arabia_chanchu_diguo_zhuyi: "Eradicate Imperialism"
  Saudi_Arabia_chanchu_diguo_zhuyi_desc: "Imperialism has deep roots in the soil of Africa and the Middle East, shackled to the workers there. These peoples have suffered too long under colonialism. We must end exploitation, empower the oppressed to control their own destinies, and divert the attention of our enemies."
  Saudi_Arabia_qianze_zhimin_zhuyi: "Condemn Colonialism"
  Saudi_Arabia_qianze_zhimin_zhuyi_desc: "Now is the time to condemn colonialism and call on European powers to liberate the people of the Middle East, who have been oppressed for countless years. If necessary, we will fight for the benefit of the people of the Middle East."
  Saudi_Arabia_qianze_zhimin_zhuyi_tt: "§YAll non-allied nations with Middle Eastern colonies§! will be given an event to choose between releasing their colonies or suffering the consequences of local uprisings."
  Saudi_Arabia_jiefang_zhongdong: "Down with the Colonizers"
  Saudi_Arabia_jiefang_zhongdong_desc: "We will do everything in our power to support resistance movements in the Middle East until the scourge of imperialism is finally eradicated and workers around the world unite!"
  Saudi_Arabia_jiefang_alabo: "Liberate Arabia"
  Saudi_Arabia_jiefang_alabo_desc: "We cannot limit our efforts to encouraging workers to take up arms and raise the red flag to our neighbors. We must spread proletarian revolution throughout Arabia!"
  Saudi_Arabia_tashang_haian: "Take to the Shores"
  Saudi_Arabia_tashang_haian_desc: "We have a long history of trade and cultural exchange with the peoples of the Horn of Africa. Unfortunately, they remain trapped in feudal systems of government. If we succeed in liberating the peoples across the sea, we will gain control of vital trade routes across the Red Sea and extend our influence deep into Africa."
  Saudi_Arabia_feizhou_zhi_huo: "The Fire of Africa"
  Saudi_Arabia_feizhou_zhi_huo_desc: "We must not rest until all of Africa is freed from the horrors of colonialism. We must use our skills and resources to sow the flames of resistance throughout the land and force the imperialists to retreat."
  Saudi_Arabia_mengji_xiongfu: "Strike the Bear in the Belly"
  Saudi_Arabia_mengji_xiongfu_desc: "Confronting the Soviets without any frontier positions is an impossible challenge. We will demand right of way to [PER.GetName], attacking the Soviets where they least expect it, entering their open heartland."
  Saudi_Arabia_duisu_hejie: "Reconciliation with the Soviet Union"
  Saudi_Arabia_duisu_hejie_desc: "Whether we like it or not, alliance with the Soviet Union is a necessary sacrifice to ensure our survival."
  Saudi_Arabia_genchu_xifang_faxisi: "Eradication of Western Fascism"
  Saudi_Arabia_genchu_xifang_faxisi_desc: "We cannot wait for the fascist regimes of Europe to choose the moment to attack us. The best way to deal with fascism is to strike first and strike hard."
  Saudi_Arabia_dui_ziben_zhuyi: "Wage war on capitalism"
  Saudi_Arabia_dui_ziben_zhuyi_desc: "Capitalism is the natural enemy of communism and must be eliminated by force if necessary. We will lead the struggle against the symbols of capitalism and pave the way for a new socialist era."
  Saudi_Arabia_nimen_jiangyou_genghaode_mingtian: "You will have a better tomorrow " 
  Saudi_Arabia_nimen_jiangyou_genghaode_mingtian_desc: "As our economies and cultures merge, a new sense of identity is emerging, advocating for an expanded meaning of [SAU.GetAdjective]. From now on, we are one people, one nation."
  ##########################################蓝线############################################################
  Saudi_Arabia_lanxian_one: "Saudi Youth Democratic Congress"
  Saudi_Arabia_lanxian_one_desc: "The path to liberal democracy is now open to us. It is time to take decisive steps to build a fair society in our country and secure [SAU.GetAdjective] its proper place on the international stage."
  Saudi_Arabia_xin_xianfa: "New Constitution of the Republic"
  Saudi_Arabia_xin_xianfa_desc: "The [SAU.GetAdjective] Constitution is the first liberal constitution, declaring that every [SAU.GetAdjective] citizen should be treated equally."
  Saudi_Arabia_shate_tuanjie: "Arab Unity"
  Saudi_Arabia_shate_tuanjie_desc: "This is a matter of life and death, and our people know this. We will unite with all our might to resist any threat that may arise!"
  Saudi_Arabia_shate_tuanjie_tt: "We will appease the traditional religious leaders of the tribes to prevent §Rrebellion§! from subsequent reforms."
  Saudi_Arabia_gauzu_zongjiao_jingcha: "Reform the religious police"
  Saudi_Arabia_gauzu_zongjiao_jingcha_desc: "To protect the country from internal and external threats, we must replace the corrupt and incompetent old police force with a new one. The religious police must be transformed into a national police."
  Saudi_Arabia_fanfubai_zhengce: "Anti-corruption policies"
  Saudi_Arabia_fanfubai_zhengce_desc: "We must ensure that the political corruption that has tainted our country for decades is never again present in our new government. By implementing new policies, we will focus on eradicating the culture of bribery, embezzlement, and nepotism in the country."
  Saudi_Arabia_chengren_saomang_yundong: "Adult literacy campaign"
  Saudi_Arabia_chengren_saomang_yundong_desc: "Illiteracy is a serious problem plaguing our people. Enabling people to read and write in their own language will help empower and liberate them. The Council of Ministers and the Ministry of Education have jointly developed an education manual and pledged to establish schools to provide adult education."
  Saudi_Arabia_shehui_minzhu_funvlianmeng: "Social Democratic Women's Union"
  Saudi_Arabia_shehui_minzhu_funvlianmeng_desc: "For centuries, the plight of women in our society has been neglected. By integrating the Social Democratic Women's Union more deeply into the heart of government, we can finally address their concerns and create a more equitable society for all."
  Saudi_Arabia_nvxing_diwei: "The Status of Women"
  Saudi_Arabia_nvxing_diwei_desc: "Women have long been oppressed in our society, subjected to barbaric, outdated customs. Addressing this issue will require more than just legislation, but legislation will be the first step towards building an equitable nation."
  Saudi_Arabia_jianli_daxue: "Establish [SAU.GetAdjective] Universities"
  Saudi_Arabia_jianli_daxue_desc: "This university is a huge success. The country needs to build on this success and develop a more targeted higher education system, also for industrial development. This way, we can ensure we have the engineers we need."
  Saudi_Arabia_shehui_wending: "Social Stability"
  Saudi_Arabia_shehui_wending_desc: "We have shaken off the horrific memories of tyranny and made society more equitable. While we still have a long way to go before we can achieve socialism, we can now proudly say that the [SAU.GetAdjective] people have finally achieved social peace."
  Saudi_Arabia_yongbao_baoshou: "Maintaining Conservative Tendencies"
  Saudi_Arabia_yongbao_baoshou_desc: "For too long, liberal ideas have plagued our Middle East, weakening the minds of our people and corrupting our politicians. We must return to our ancient good values."
  Saudi_Arabia_yongbao_ziyou: "Embrace Liberal Tendencies"
  Saudi_Arabia_yongbao_ziyou_desc: "The excessive pursuit of uniformity stifles the human spirit. We will uphold the independence and freedom of the individual. We must always look forward and strive for a better tomorrow!"
  Saudi_Arabia_chongjian_gongheguo_weidui: "Establish the Republican Guard"
  Saudi_Arabia_chongjian_gongheguo_weidui_desc: "Given the current situation, the Republic faces great danger. A Republican Guard must be established to combat the grave threats that seek to haunt us. Soldiers, fight for your Republic!"
  Saudi_Arabia_fuquan_xianbinbgdui: "Empower the Gendarmerie"
  Saudi_Arabia_fuquan_xianbinbgdui_desc: "The Gendarmerie plays a vital role in maintaining peace and security in our country. It is time to strengthen this police force so that it can perform even more tasks."
  Saudi_Arabia_baozhang_zongjiao_heping: "Guarantee religious freedom"
  Saudi_Arabia_baozhang_zongjiao_heping_desc: "When our country began to oppress Shia Muslims, many fled. To reverse this brain drain, we must amend our laws and work towards a secular state. This should bring back many of the bright minds who have fled our country."
  Saudi_Arabia_baohu_women_de_bianjing: "Protect our borders"
  Saudi_Arabia_baohu_women_de_bianjing_desc: "We are surrounded by enemies who want to isolate and destroy our great nation. With the domestic situation under control, we should turn our attention to foreign affairs and begin taking steps to ensure our national security."
  Saudi_Arabia_tudi_gaige: "Land Reform"
  Saudi_Arabia_tudi_gaige_desc: "In line with our recently announced plans to revitalize industry and implement land reform, now is the time to begin the process of industrial and agricultural restructuring."
  Saudi_Arabia_zhongshi_gonggong_gongcheng: "Focus on public works"
  Saudi_Arabia_zhongshi_gonggong_gongcheng_desc: "To rebuild our country from the ashes of civil war, we need to invest more time in public works projects. If we invest more money in local infrastructure, it will not only help our economy, but also improve the lives of our citizens."
  Saudi_Arabia_tudi_fazhanjihua: "Land Development Plan"
  Saudi_Arabia_tudi_fazhanjihua_desc: "As we advance agricultural reform, we must bring industry to the countryside. Mechanization, rural infrastructure development, and small-scale manufacturing will transform villages into productive centers."
  Saudi_Arabia_cujin_chengshihua_jincheng: "Promote urbanization"
  Saudi_Arabia_cujin_chengshihua_jincheng_desc: "While the world around us continues to industrialize and urbanize, [SAU.GetAdjective] remains largely unchanged. This leaves us dependent on other countries for our economic survival. Recognizing this and promoting urbanization should quickly end these dependencies."
  Saudi_Arabia_kaifang_tudi_xxuke: "Open Land Permits"
  Saudi_Arabia_kaifang_tudi_xxuke_desc: "We will issue development permits, land expropriations, and land grants on an unprecedented scale. This will provide a significant boost to the [SAU.GetAdjective] economy."
  Saudi_Arabia_nongye_butie: "Agricultural Subsidies"
  Saudi_Arabia_nongye_butie_desc: "Our farmers have been struggling with a debt crisis and foreclosures. Their helplessness and anger have been simmering for a long time and, if left unchecked, could develop into something far more dangerous. We must address this situation and do everything we can to help the agricultural sector."
  Saudi_Arabia_tielu_gengxin_jihua: "Railway Renewal Program"
  Saudi_Arabia_tielu_gengxin_jihua_desc: "As the lifeline of [SAU.GetAdjective] commerce and industry, railways are vital. As our economy recovers and rebounds, we must ensure our infrastructure can keep pace."
  Saudi_Arabia_dainqihua_jihua: "[SAU.Capital.GetCapitalVictoryPointName] Power Plant"
  Saudi_Arabia_dainqihua_jihua_desc: "As cities across our country continue to grow, we must ensure they have access to adequate electricity. Let's build a new power plant at [SAU.Capital.GetCapitalVictoryPointName] as a key step in developing our most important city."
  Saudi_Arabia_guanzhu_neibu: "Focus Inward"
  Saudi_Arabia_guanzhu_neibu_desc: "While reaching out to the major democratic powers is an option, many in our government believe we should focus our attention and resources on [SAU.GetAdjective] instead. For now, we should limit our trade with the world to ensure [SAU.GetAdjective] has what it needs to withstand the impact of war."
  Saudi_Arabia_fuquan_gonghui: "Empowering Unions"
  Saudi_Arabia_fuquan_gonghui_desc: "The [SAU.GetAdjective] proletariat possesses considerable potential, and we must empower our unions with the resources and power to manage and strengthen our workforce."
  Saudi_Arabia_shengchan_xian: "Expanding Production Lines"
  Saudi_Arabia_shengchan_xian_desc: "It is time to upgrade and expand our key production lines to ensure our military forces have the supplies and equipment to continue operating at peak performance."
  Saudi_Arabia_jingji_xiandaihua: "Economic Modernization"
  Saudi_Arabia_jingji_xiandaihua_desc: "As [SAU.GetNonIdeologyName] regains stability, investment and business interest will follow. To revitalize the economy, we will invest in agricultural modernization and our limited industry."
  Saudi_Arabia_xiangzhe_ziyoufangren_nuli: "Towards laissez-faire"
  Saudi_Arabia_xiangzhe_ziyoufangren_nuli_desc: "Markets must flow freely, and only by avoiding government influence on industry can our economy recover."
  Saudi_Arabia_shitu_baochi_zhongli: "Maintaining Neutrality"
  Saudi_Arabia_shitu_baochi_zhongli_desc: "While others believe it takes courage and wisdom to choose sides in a global conflict, we understand it takes even greater courage and wisdom to refuse to take sides."
  Saudi_Arabia_quzhu_tongmengguo_qiaomin: "Expel Allied nationals"
  Saudi_Arabia_quzhu_tongmengguo_qiaomin_desc: "The Axis Powers have presented us with dubious evidence, claiming that our regime is at risk of subversion by the Allies. They believe the only way to prevent this is to expel all Allied nationals to eliminate any spies lurking within our borders."
  Saudi_Arabia_quzhu_zhouxinguo_qiaomin: "Expel Axis Nationals"
  Saudi_Arabia_quzhu_zhouxinguo_qiaomin_desc: "The Allies accuse us of coddling their enemies because many citizens of hostile nations are allowed to roam freely in [ROOT.GetNonIdeologyName]. While there is no evidence that they are engaging in activities detrimental to us, to reassure the Allies, we should demand their departure during the current global conflict."
  Saudi_Arabia_shitu_zhichi_minzhu_guojia: "Support Democracies"
  Saudi_Arabia_shitu_zhichi_minzhu_guojia_desc: "The democracies of Europe and America are in dire straits. As fellow democracies, we have a duty to do everything possible to help them overcome their difficulties. Therefore, we must send [SAU.GetAdjective] individuals to safeguard the interests of our fellow democracies."
  Saudi_Arabia_zhichi_mengjun_jiandie_huodong: "Support Allied espionage"
  Saudi_Arabia_zhichi_mengjun_jiandie_huodong_desc: "The fact that we maintain a neutral foreign policy does not prohibit us from covertly supporting other democracies in their fight against fascism in Europe. In fact, our neutrality and the oil situation in the Middle East make us a vital link in the international anti-fascist struggle."
  Saudi_Arabia_minzhu_binggongchang: "The Arsenal of Democracy"
  Saudi_Arabia_minzhu_binggongchang_desc: "In the near future, we are likely to be drawn into a major conflict. To ensure that we are not wiped out in such a scenario, we should rapidly expand our military-industrial complex." "
  Saudi_Arabia_shenqing_jiaru_tongmengguo: "Join the Allies"
  Saudi_Arabia_shenqing_jiaru_tongmengguo_desc: "The future of the [SAU.GetAdjective] and its democratic values ​​rests with the leading Western democracies and their alliance. As part of this alliance, we can lend them strength and rely on their support."
  Saudi_Arabia_baowei_guojia: "Defend the Nation"
  Saudi_Arabia_baowei_guojia_desc: "While we have eliminated internal threats to our government, threats from beyond our borders will always exist. We must do everything we can to ensure our economy can support our military in the event of a war."
  Saudi_Arabia_jiefang_yilang: "Liberate Iran"
  Saudi_Arabia_jiefang_yilang_desc: "The [PER.GetAdjective] regime is a threat to our nation. Only by liberating it through force and defeating the [PER.GetAdjective] military ourselves can we secure our nation's future. "
  Saudi_Arabia_jiefang_bageda: "Liberate Iraq"
  Saudi_Arabia_jiefang_bageda_desc: "As one of our allies, we must ensure the security of [IRQ.GetAdjective] by all means necessary. This major initiative aims to protect the [IRQ.GetAdjective] people from external threats while promoting unity in the region."
  Saudi_Arabia_kongzhi_zhongdong: "Control the Middle East"
  Saudi_Arabia_kongzhi_zhongdong_desc: "By offering to protect their assets in the Middle East, we can help relieve some of the pressure on [ENG.GetAdjective]. Given our contributions to the war, they are likely to accept this offer... especially since they have virtually no ability to prevent our direct occupation of the region."
  Saudi_Arabia_duikang_kangmi_qiaotoubao: "A bridgehead against communism"
  Saudi_Arabia_duikang_kangmi_qiaotoubao_desc: "We must plan ahead so that we can effectively coordinate our forces with our allies and organize a counterattack if the situation becomes unfavorable." "
  Saudi_Arabia_duikang_faxisi_qiaotoubao: "Liberate Europe from Fascism"
  Saudi_Arabia_duikang_faxisi_qiaotoubao_desc: "No one is safe until all of us are safe. Fascism remains prevalent in Europe and will undoubtedly cause further problems in the future. We must act to prevent the spread of this ideology."
  Saudi_Arabia_zhongdong_huoju: "Torch of the Middle East"
  Saudi_Arabia_zhongdong_huoju_desc: "Through our careful stewardship, the Middle East has transformed from an economically backward region into a rapidly expanding industrial powerhouse. We will unite to forge a new socialist future for our people."
  Saudi_Arabia_yu_meiguo_guanxi: "Alliance with the United States"
  Saudi_Arabia_yu_meiguo_guanxi_desc: "One of our strongest allies is the awakened giant to the north. We should send a [SAU.GetAdjective] envoy to Washington, D.C., to develop closer relations with the [USA.GetAdjective] government.

  Saudi_Arabia_meiguo_lujun_xunlian: "US Army Training"
  Saudi_Arabia_meiguo_lujun_xunlian_desc: "[USA.GetNameDefCap] has kindly offered to provide us with their military training regimen so that we can begin preparing our own forces for a possible war. Not only will this create a more experienced and hardened military, but we can also use what we learn to strengthen our special forces programs."
  Saudi_Arabia_meiguo_haijun_jiaoliu: "US Navy Training"
  Saudi_Arabia_meiguo_haijun_jiaoliu_desc: "As a gesture of goodwill toward the [USA.GetAdjective] people, we should propose joint military exercises in the waters near [SAU.GetAdjective]. By working together, we can improve the training and skills of our navies and air forces. "
  Saudi_Arabia_minzhu_wuqi: "Weapons of Democracy"
  Saudi_Arabia_minzhu_wuqi_desc: "We must make all necessary preparations to stop our enemies before they commit unthinkable acts, even if that means using indiscriminate weapons of mass destruction to bring our enemies to hell. Doing so will obviously prevent them from committing further atrocities of war."
  Saudi_Arabia_yu_yingguo_guanxi: "Special Envoy to London"
  Saudi_Arabia_yu_yingguo_guanxi_desc: "[ENG.GetAdjective], as a nation that helped liberate the Arab people from Ottoman territories, now stands with them against their enemies. In order to establish closer ties with the [ENG.GetAdjective] government, it is wise for us to send a [SAU.GetAdjective] person to London."
  Saudi_Arabia_yu_yingguo_yingxiang: "British Naval Training"
  Saudi_Arabia_yu_yingguo_yingxiang_desc: "As our ties with the UK grow closer, we should investigate whether we can also learn from their military activities. The Royal Navy is highly regarded, and studying their operations could be beneficial. While we do so, we should also consider developing similar ships."
  Saudi_Arabia_yu_yingguo_kongjun: "British Air Force Training"
  Saudi_Arabia_yu_yingguo_kongjun_desc: "As our ties with the UK grow closer, we should investigate whether we can also learn from their military activities. The Royal Air Force is highly regarded, and studying their operations could be beneficial. While we do so, we should also consider attempting to acquire some similar aircraft."
  Saudi_Arabia_yu_yingguo_lianhe_yanjiu: "[ENG.GetAdjective]-[ROOT.GetAdjective] Technical Exchange"
  Saudi_Arabia_yu_yingguo_lianhe_yanjiu_desc: "Our nation's expertise has vastly improved in recent years, but we still have much to learn from our [ENG.GetAdjective] friends. Perhaps we can persuade them to share their knowledge with us."
  Saudi_Arabia_kong_wangzuo: "Empty Throne"
  Saudi_Arabia_kong_wangzuo_desc: "Under the rule of King Ibn Saud, [SAU.GetAdjective] is experiencing a period of relative stability. Yet, beneath the ancient kingdom's seemingly eternal status quo, undercurrents of anger and distrust simmer. Minorities abound, but perhaps, amidst the turmoil around the world, the [ROOT.GetAdjective] people can unite, find opportunities amidst change, and forge their own path."
  Saudi_Arabia_yiben_shate_zhengtong: "Lord of the Two Holy Mosques"
  Saudi_Arabia_yiben_shate_zhengtong_desc: "For nearly a thousand years, blood and fire filled these deserts, and kingdoms rose twice, only to fall to the clutches of heresy and internal strife. Now, Ibn Saud's sword ended this cycle of humiliation. In 1932, the Third Saudi Kingdom was born under the protection of God. The fate of the Arabs would no longer be written by outsiders! There is no god but Allah, and Muhammad is His Messenger!"
  Saudi_Arabia_wangguo_jiaoyu_zhengce: "Kingdom of Education Policy"
  Saudi_Arabia_wangguo_jiaoyu_zhengce_desc: "The Supreme Council of the Government is engaged in a heated debate on the Kingdom's Education Bill. This bill aims to prevent the loss of valuable Arab intellectuals to European universities, improve rural education, and incorporate specialized industrial and agricultural knowledge into textbooks."
  Saudi_Arabia_zhengshou_zhakati: "Levy of Zakat"
  Saudi_Arabia_zhengshou_zhakati_desc: "'Zakat' originally means 'purification.' When the rich give money from their wealth to the poor, it is an act of charity, a way of purifying their wealth."
  Saudi_Arabia_zunzhong_buluo_xisu: "Respect tribal customs."
  Saudi_Arabia_zunzhong_buluo_xisu_desc: "We must not forget what our people are going through and have already gone through in these difficult times. To stabilize the country and remain in power, we must appease them accordingly."
  Saudi_Arabia_lingchen_miejue_jihua: "Istisbah."
  Saudi_Arabia_lingchen_miejue_jihua_desc: "Despite repeated repressions, some opposition tribes continue to lurk in the shadows, exploiting the despicable and rebellious lower classes to bolster their ranks. It is our unshirkable responsibility to bury them completely, even at any cost..."
  Saudi_Arabia_liangshi_zhizhan: "Food War"
  Saudi_Arabia_liangshi_zhizhan_desc: "For our nation to truly be independent, we cannot rely on foreign agriculture to feed our people. We must achieve agricultural self-sufficiency. The Food War will demonstrate our resolve for self-reliance and further strengthen our nation."
  Saudi_Arabia_tudi_zhizhan: "The Land War"
  Saudi_Arabia_tudi_zhizhan_desc: "Our land campaign will drain miles of swamps to create farmland. It will also provide new jobs, and the resilience of the [SAU.GetAdjective] people will impress foreign governments."
  Saudi_Arabia_jixu_jinxing_xijila: "The Hijra Continues"
  Saudi_Arabia_jixu_jinxing_xijila_desc: "In 1912, Ibn Saud joined forces with the Wahhabis to form the Monotheistic Brotherhood, the Ikhwan Movement, which encouraged the Bedouin to settle down and initiated the influential Ikhwan Movement in Saudi Arabia's history. Its goal was to force the Bedouin to abandon their nomadic lifestyle and move to settlements with complete religious functions, a process known as the Hijra (migration)."
  Saudi_Arabia_yiben_shate_wunian_jihua: "Continue the Five-Year Plan"
  Saudi_Arabia_yiben_shate_wunian_jihua_desc: "With the availability of economic experts, the time has finally arrived for [SAU.GetAdjective] to implement its first Five-Year Plan. This will significantly boost our economy and put [SAU.GetAdjective] on the path to becoming a developed and prosperous nation!"
  Saudi_Arabia_xilan_hegu_dingju_jihua: "Sirhan Valley Settlement Plan"
  Saudi_Arabia_xilan_hegu_dingju_jihua_desc: "Sirhan (Wadi The Sirhan Valley resettlement project began as a relief effort for the Bedouin tribes of Anazah and Shamayr. Bedouin settlement gradually slowed, and during this period, Saudi Arabia began to see the gradual settlement of individual Bedouin families."
  Saudi_Arabia_hegu_mofan_jihua: "Model Settlement Project"
  Saudi_Arabia_hegu_mofan_jihua_desc: "Nomads from the desert and valleys have decided to settle in the Harad Faisal Valley, as reported by local officials. This will certainly benefit our economy, but we must first hope that the local area can support such a large influx of nomads in such a short period of time."
  Saudi_Arabia_nongye_zaibutie_jihua: "Agricultural Subsidy Program"
  Saudi_Arabia_nongye_zaibutie_jihua_desc: "People are an important pillar of our country and deserve social recognition and a stable income. These subsidies make it possible to achieve this goal."
  Saudi_Arabia_gonggong_jianshe_jihua: "Public Construction Program"
  Saudi_Arabia_gonggong_jianshe_jihua_desc: "A series of social construction programs have been implemented in conjunction with our Five-Year Plan. These programs will reduce unemployment and establish new public institutions."
  Saudi_Arabia_shehui_baoxian_zhidu: "Insurance System"
  Saudi_Arabia_shehui_baoxian_zhidu_desc: "The insurance system provides our enlisted personnel with life insurance to cover their worst-case scenarios. Knowing their families will be taken care of has significantly increased the number of people willing to join the military."
  Saudi_Arabia_guliwailai_touzi: "Encouraging Foreign Investment"
  Saudi_Arabia_guliwailai_touzi_desc: "If our country is to prosper, it needs investment in industry and infrastructure. Fortunately, there is no shortage of foreigners willing to invest and profit."
  Saudi_Arabia_shazhong_waijiao: "Saudi-China Diplomacy"
  Saudi_Arabia_shazhong_waijiao_desc: "Given global tensions, [ROOT.GetLeader] believes we should coordinate military and foreign policies across the region to better protect against future aggression."
  Saudi_Arabia_wenhe_wahabi_zhuyi: "Maintaining Our Neutrality"
  Saudi_Arabia_wenhe_wahabi_zhuyi_desc: "The founder of Wahhabism, Muhammad ibn Abdul Wahhab, was neither a prophet nor an angel, but merely a scholar." Wahhabism cannot represent Saudi Arabia. Saudi Arabia has both Sunni and Shia sects, with four major Sunni sects and numerous Shia sects, all of which are represented on the Religious Council. No one sect can now promote the views of any one sect as the sole religion in Saudi Arabia."
  Saudi_Arabia_chuantong_xingbie_juese: "Traditional Gender Roles"
  Saudi_Arabia_chuantong_xingbie_juese_desc: "With the completion of the Five-Year Plan, it is time to restore society to its original form. By reaffirming the traditional gender roles of 'men working outside the home, women working inside the home,' everyone will know their place and what they desire."
  Saudi_Arabia_gongwuyuan_gaizu: "Civil Service Reform"
  Saudi_Arabia_gongwuyuan_gaizu_desc: "With social stability and development, and our grip on government growing stronger, we are now starting to reform the civil service from the grassroots level to make it more efficient and dynamic. This should bring about exciting new ideas and opportunities."
  Saudi_Arabia_baozhang_zongjiao_jiaoyu: "Religious Harmony"
  Saudi_Arabia_baozhang_zongjiao_jiaoyu_desc: "Our policy of frank dialogue and community outreach in the eastern provinces has yielded results. The radical religious elements have been driven out by the local population. This is a wonderful victory for our government, and we can already foresee a bright future of unity and [ROOT.GetAdjective]."
  Saudi_Arabia_renren_weixian: "Appoint people based on merit"
  Saudi_Arabia_renren_weixian_desc: "We need to replace the old system of promotion based on social status with one based on merit! We need capable people to lead our military."
  Saudi_Arabia_zuguo_zhongcheng_gongminquan: "Fatherland, Loyalty, and Citizenship"
  Saudi_Arabia_zuguo_zhongcheng_gongminquan_desc: "Undoubtedly, the concept of one's primary allegiance to one's homeland contradicts the spirit of Islam, which emphasizes the universal community of the homeland rather than a national group. Therefore, homeland implies the recognition of the Kingdom of Saudi Arabia as a geopolitical entity and the obligation of allegiance to its citizens."
  Saudi_Arabia_yisilan_hezuo_zuzhi: "Organization of Islamic Cooperation"
  Saudi_Arabia_yisilan_hezuo_zuzhi_desc: "Our loyalty cannot lie with the Eastern Bloc nor with the... Joining the Western Bloc will not guarantee the security of an Islamic state, nor will joining a military alliance or seeking the protection of a superpower."
  Saudi_Arabia_baowei_bianjing: "Defending the Borders"
  Saudi_Arabia_baowei_bianjing_desc: "If the enemy were to intrude upon our borders, [ROOT.GetNameDef] would be doomed. Our borders are sacred, and our nation cannot afford to lose even a single inch of its territory. Therefore, we must strengthen our border defenses and be prepared to defend them." "
  Saudi_Arabia_guoji_zhongli: "International Neutrality"
  Saudi_Arabia_guoji_zhongli_desc: "While others believe it takes courage and wisdom to choose sides in global conflicts, we understand it takes even greater courage and wisdom to refuse to take sides."
  Saudi_Arabia_quzhu_deguo_geluoba: "Expel Geroba"
  Saudi_Arabia_quzhu_deguo_geluoba_desc: "We have grown too close to the Germans. It is time to end this farce. They have no honor or dignity, and no moral principles. We will expel them from [ROOT.GetNameDef] like vermin!"
  Saudi_Arabia_shate_meiguo_huanziyuan: "Saudi-US Resource Cooperation"
  Saudi_Arabia_shate_meiguo_huanziyuan_desc: "The [USA.GetAdjective] delegation accepted our proposal to integrate resource extraction between our two countries and expressed interest in establishing a diplomatic framework with us that would include a mutual defense agreement and joint resource development projects. This would allow us to deepen our trade relationship with them through resource cooperation."
  Saudi_Arabia_kunxihaao_huiyi: "Quincy Conference"
  Saudi_Arabia_kunxihaao_huiyi_desc: "[USA.GetLeader] visited [SAU.GetAdjective] today aboard the heavy cruiser USS Quincy and announced that [USA.GetAdjective] engineers plan to begin joint development and research of industrial machinery and weapons next week. This is a great day for [SAU.GetAdjective]!"
  Saudi_Arabia_hajimofu_tian_kangmi: "The Khakimov Proposal"
  Saudi_Arabia_hajimofu_tian_kangmi_desc: "The communist movement in the Middle East has attracted the attention of the [SAU.GetAdjective] leadership. Fortunately, they seem to be showing some interest in the growing number of people who support the proletarian cause."
  Saudi_Arabia_sulian_gongye_yuanzhu_two: "Soviet Industrial Aid"
  Saudi_Arabia_sulian_gongye_yuanzhu_two_desc: "[SAU.GetAdjective] has a relatively low level of industrialization. To enhance national competitiveness, attracting investment from Soviet allies to [SAU.GetAdjective] is a viable strategy."
  Saudi_Arabia_sulian_mianfen_yuanzhu: "Soviet flour aid"
  Saudi_Arabia_sulian_mianfen_yuanzhu_desc: "The [SOV.GetNameDef] ambassador contacted our diplomats and proposed a bilateral trade agreement. Under the terms of the agreement, [SOV.GetNameDef] would provide us with raw materials such as grain and cotton, in exchange for a negligible supply of oil and minerals."
  Saudi_Arabia_lianhe_shiguan_xuexiao: "Joint Soviet-Arab Non-Commissioned Officer School"
  Saudi_Arabia_lianhe_shiguan_xuexiao_desc: "Jeddah is a historic city, and its proximity to the Persian Gulf facilitates international exchange. It is an ideal location for a new school to train politicized officers, not only to learn the fundamentals of warfare but also to receive a profound education in Marxist thought."
  Saudi_Arabia_jiaru_kangmi_guoji: "Joining the Communist International"
  Saudi_Arabia_jiaru_kangmi_guoji_desc: "With the introduction of Soviet ideology, our wartime alliance policy shifted. By joining the Communist International, our former 'comrades' in this global conflict will be dismayed to see the [SAU.GetAdjective] turn their guns on new targets."
  Saudi_Arabia_yaoqing_gongren: "Inviting Workers"
  Saudi_Arabia_yaoqing_gongren_desc: "Oil discoveries in the eastern provinces have encouraged many [SOV.GetAdjective] to come and help with development, improving both the quality of life for our people and our industrial capacity."
  Saudi_Arabia_weile_gongtong_de_liyi: "For the common good"
  Saudi_Arabia_weile_gongtong_de_liyi_desc: "The collective is stronger than the individual, and this applies even to the economy. The [SAU.GetAdjective] have decided to restructure their economy to better serve the collective, not just any one nation. This means changing the way we do things, which may be difficult at first, but will ultimately improve the well-being of all."
  Saudi_Arabia_haiwangeming: "Gulf Revolution"
  Saudi_Arabia_haiwangeming_desc: "The balance of power in the region is shifting in our favor. We must seize the opportunity and begin to build a larger anti-colonial movement here."
  Saudi_Arabia_yibenshate_kangmi_dayingguo: "Persian Gulf Crisis"
  Saudi_Arabia_yibenshate_kangmi_dayingguo_desc: "The imperialists have been forced into a losing position. Now is the time to pressure them on all fronts and drive them out of the region once and for all. First, we will blockade the Persian Gulf, severing the shipping routes of the imperialist powers."
  Saudi_Arabia_tuifan_yilang_shaa: "Liberate Iran"
  Saudi_Arabia_tuifan_yilang_shaa_desc: "Under the visionary leadership of the [ROOT.GetLeader], we are ready to bring freedom and justice to our [PER.GetAdjective] brothers and sisters who have long suffered under the tyranny of the [PER.GetLeader]. We will not only consolidate our borders but also expand our influence in the region."
  Saudi_Arabia_haiwan_baquan_tongzhi: "Defender of the Middle East"
  Saudi_Arabia_haiwan_baquan_tongzhi_desc: "We have accomplished what was once considered impossible: the complete expulsion of imperial power from the Middle East. Today, we are the de facto power in the region, free to exert our influence without external interference."
  Saudi_Arabia_shula_yihui_minzhu: "Shura Council"
  Saudi_Arabia_shula_yihui_minzhu_desc: "The expansion of the Shura Council has proven a resounding success. Perhaps we should consider moving toward a constitutional monarchy."
  Saudi_Arabia_laodong_zhongde_funv: "Women in Labor"
  Saudi_Arabia_laodong_zhongde_funv_desc: "In the Arab world, women have traditionally performed domestic work and, in recent decades, have also taken on industrial labor. The tobacco, coffee, and garment industries tend to employ a majority of women, although this has created friction with the male-dominated union movement. Men now enjoy equal pay and a minimum wage—we should implement this for women as well."
  Saudi_Arabia_kuoda_nvxing_quanli: "Expanding Women's Rights"
  Saudi_Arabia_kuoda_nvxing_quanli_desc: "In recent years, many [SAU.GetAdjective] elites have worried that women could subvert revolutionary ideals. But more importantly, equality before the law is what allows our societies to thrive."
  Saudi_Arabia_funv_canzhdng_quan: "Women's Suffrage"
  Saudi_Arabia_funv_canzhdng_quan_desc: "Any nation hoping to enter the new century needs to recognize women's rights and gender equality."
  Saudi_Arabia_guoshi_fangwen_xifang: "State Visit"
  Saudi_Arabia_guoshi_fangwen_xifang_desc: "It's undeniable that democratically led nations are currently driving dramatic change in the world. If the [SAU.GetAdjective] is to change, perhaps it can learn something from them. We should establish formal relations as soon as possible and immediately explore any opportunities for cooperation."
  Saudi_Arabia_shate_jixu_xihua: "Continue Westernization"
  Saudi_Arabia_shate_jixu_xihua_desc: "Westernization has always been one of the underlying goals of our leadership. Many aspire to emulate the leading Western powers, adopting their ideologies and practices. If we hope to integrate with these countries in the future, we must prepare for such integration now."
  Saudi_Arabia_yaoqing_waiguo_touzizhe: "Inviting Foreign Investors"
  Saudi_Arabia_yaoqing_waiguo_touzizhe_desc: "Given our country's abundant natural resources and a growing urban population desperate for jobs, our economy has significant potential for growth. However, to trigger that growth, we will need substantial investment from abroad."
  Saudi_Arabia_shenqing_jiaru_tongmengguo_zhi: "Alliance with the Allies"
  Saudi_Arabia_shenqing_jiaru_tongmengguo_zhi_desc: "While we have many grievances against Britain, we must now put them aside and forge closer cooperation with the Allies. As the British say, it is better to choose familiar devils than unknown partners."
  Saudi_Arabia_kongzhi_yilake: "Control Iraq"
  Saudi_Arabia_kongzhi_yilake_desc: "As one of the Allies, we must ensure the security of [IRQ.GetNameDef] by all necessary means. This significant initiative aims to protect the [IRQ.GetAdjective] people from external threats while promoting unity in the region."
  Saudi_Arabia_kongzhi_yilang_jingong: "Control Iran"
  Saudi_Arabia_kongzhi_yilang_jingong_desc: "[PER.GetNameDefCap] is one of [SAU.GetNameDef]'s open gateways to the east. Securing this corridor for our allies is vital, while also making [PER.GetNameDef] safer under our protection. This is undoubtedly for the benefit of the [PER.GetAdjective] people."
  Saudi_Arabia_fensui_buershenweike: "Crush the Bolshevik Menace"
  Saudi_Arabia_fensui_buershenweike_desc: "Since the Communists will inevitably bring their cursed revolution to [ROOT.GetNameDef], why not strike first and catch them unawares before they finally strike? We must strike first, crushing their beloved revolution once and for all with a thunderous force!"
  Saudi_Arabia_fulici_geluoba_tiaoyue: "Fritz Groba Pact"
  Saudi_Arabia_fulici_geluoba_tiaoyue_desc: "Fritz Groba was expelled from Iraq after attempting to incite anti-British sentiment there. His role in the British pipeline attack forced him into exile. Groba will be warmly welcomed in our country."
  Saudi_Arabia_yisilan_jiaoyu_jihua: "Islamic Education Program"
  Saudi_Arabia_yisilan_jiaoyu_jihua_desc: "During Europe's Dark Ages, Islam held high the torch of knowledge; today, we Muslims live in Dark Ages. - Mahmoud Tarzi"
  Saudi_Arabia_guli_chaosheng: "Encourage the Hajj"
  Saudi_Arabia_guli_chaosheng_desc: "Our position as guardians of the Holy City and protectors of brave pilgrims has earned us a positive reputation in the Islamic world. Let us continue to develop the Holy Land and ensure peace in our corner of the world."
  Saudi_Arabia_zizhu_aiji_xiongdihui: "Support the Egyptian Brotherhood"
  Saudi_Arabia_zizhu_aiji_xiongdihui_desc: "The Egyptian Muslim Brotherhood (Ikhwan Al-Muslimeen) is the only Islamic group in Egypt that advocates replacing the monarchy with Sharia law and has not strayed from the radical ideas of former teacher Hassan al-Banna. If we want to extend the Caliphate to Egypt, we must help them launch their uprising." 
  Saudi_Arabia_zizhu_aiji_xiongdihui_tt: "When the support level of Egypt's §YFascist Party§! reaches §Y40.0%§!, §RCivil War§!"
  Saudi_Arabia_zhanzheng_zhunbei_faxisi: "War Preparations"
  Saudi_Arabia_zhanzheng_zhunbei_faxisi_desc: "In order to fully prepare the country for the coming war, we must ensure readiness not only within the Wehrmacht, but also in industry and infrastructure."
  Saudi_Arabia_deguo_feixingqi_fazhan_jihua: "German Aircraft Development Program"
  Saudi_Arabia_deguo_feixingqi_fazhan_jihua_desc: "By collaborating with the Germans, we will be able to utilize their technology in sectors we have previously focused on modernizing, and one of these areas is aircraft. Using German technology, we will dominate the Arabian skies!"
  Saudi_Arabia_deguo_qianting_fazhan_jihua: "German Submarine Development Program"
  Saudi_Arabia_deguo_qianting_fazhan_jihua_desc: "By collaborating with the Germans, we will be able to leverage their technology into sectors we've previously focused on modernizing, one of which is submarine warfare. We will leverage our new allies and control the Red Sea shipping lanes!"
  Saudi_Arabia_deguo_zhanzheng_jiqi: "Acquire German tanks"
  Saudi_Arabia_deguo_zhanzheng_jiqi_desc: "Thanks to our alignment with the Germans, we now not only have easier access to blueprints and detailed information for researching and manufacturing tanks similar to German armor, but we can also easily purchase such vehicles from them. The Smoking Cobra will sow fear in the hearts of our enemies!"
  Saudi_Arabia_deguo_qingbao_bumen_hezuo: "Collaboration with German intelligence"
  Saudi_Arabia_deguo_qingbao_bumen_hezuo_desc: "Established a partnership with [GER.GetAdjective] intelligence. Their expertise in counterinsurgency and intelligence operations will be a valuable aid in identifying and neutralizing insurgent forces."
  Saudi_Arabia_jiaru_zhouxinguo_faxisi: "Join the Axis"
  Saudi_Arabia_jiaru_zhouxinguo_faxisi_desc: "Let this be it. This is our gamble to preserve [SAU.GetNameDef] in the coming storm. We will join the storm under the banner of the faction led by [ROOT.GetLeader]. Hopefully, we have made the right decision."
  Saudi_Arabia_zhiyuan_jinfangzhen: "Support the Golden Phalanx"
  Saudi_Arabia_zhiyuan_jinfangzhen_desc: "There is an influential organization in [IRQ.GetNameDef] that shares similar aspirations. We should support these like-minded friends; perhaps they can help eliminate the imperialist presence in the region."
  Saudi_Arabia_huoqu_yilake_shiyyou: "Secure Iraqi oil"
  Saudi_Arabia_huoqu_yilake_shiyyou_desc: "Why trust someone else with a job you know you can do almost perfectly yourself? Our soldiers will be on Baghdad soil before the end of this month: there is no doubt about it."
  Saudi_Arabia_sihui_jida_tiaoyue: "Abolish the Treaty of Jeddah"
  Saudi_Arabia_sihui_jida_tiaoyue_desc: "We have already violated the restrictions imposed on us by the Treaty of Jeddah, and now is the time to break free from this yoke, just as our allies have done before us."
  Saudi_Arabia_gaige_zongjiao_guanli: "Reform religious administration"
  Saudi_Arabia_gaige_zongjiao_guanli_desc: "Religion is the backbone of any civilized empire. Naturally, this is an aspect we must consider, and do so with the utmost caution and forethought. The religious fate of the Middle East may lie in our hands, and we need skilled experts in religious affairs."
  Saudi_Arabia_xianzhi_zongjiao_quanli: "Restrict religious rights"
  Saudi_Arabia_xianzhi_zongjiao_quanli_desc: "Current Wahhabi rule is marked by a strong policy of purification, which has forced many talented and capable Shia into exile or hiding. We could stabilize the situation by ending the persecution of Shia, potentially gaining a powerful ally."
  Saudi_Arabia_oulaima_zhanglao_weiyuanhui: "Establish a Council of Elders"
  Saudi_Arabia_oulaima_zhanglao_weiyuanhui_desc: "We could establish the 'Ulayma Council of Elders' as the highest religious body of official Wahhabism and the highest authority on Islamic law, appointing non-Wahhabi leaders to leadership and dispersing the influence of sectarian families."
  Saudi_Arabia_xiaoruo_shaliya_fa: "We could weaken Sharia law"
  Saudi_Arabia_xiaoruo_shaliya_fa_desc: "We could draw on modern interpretations of the Ottoman era and strive to integrate new-age technological advances with Islamic teachings, while upholding and protecting traditional Islamic values ​​and customs."
  Saudi_Arabia_yunxu_jieri_qingdian: "Permit festivals and celebrations." 
  Saudi_Arabia_yunxu_jieri_qingdian_desc: "Recently, [ROOT.GetLeader] delivered a small speech in the Eastern Province, announcing that Shia in the Eastern Province would be allowed to celebrate their festivals and expressing respect for Shia customs to local community leaders. Although this move has drawn widespread outrage from Wahhabi politicians, [ROOT.GetLeader] and the Shia community are generally satisfied with the outcome."
  Saudi_Arabia_jiaoyu_fazhan_jijin: "Education Development Fund"
  Saudi_Arabia_jiaoyu_fazhan_jijin_desc: "We have ample funds at our disposal. Our thriving industries and manufacturers allow us to devote more resources to expanding our scientific institutions."
  Saudi_Arabia_jiaoyu_guowang_daxue: "King Abdullah University"
  Saudi_Arabia_jiaoyu_guowang_daxue_desc: "[SAU.GetAdjective] lacks educational options, and it is our mission to address this! By establishing a university in our nation's capital, we will be able to improve the overall quality of education."
  Saudi_Arabia_zhaohui_yimamu: "Recall the Mutawis"
  Saudi_Arabia_zhaohui_yimamu_desc: "A 1927 fatwa sent many Mutawis to Shia communities, forcing them to pray as Mutawis. With the implementation of a policy of religious tolerance, it is time to recall these Mutawis."
  Saudi_Arabia_diaochaju_jiandiejigou: "The King's Bureau of Investigation"
  Saudi_Arabia_diaochaju_jiandiejigou_desc: "By establishing our General Bureau of Investigation, we will penetrate all aspects of [SAU.GetAdjective] society, exposing communists, criminals, and other bad apples and bringing them to justice, thereby ensuring greater lasting peace and stability in [SAU.GetAdjective]."
  Saudi_Arabia_zengqiang_zongjiao_jiaoyu: "Strengthening religious education"
  Saudi_Arabia_zengqiang_zongjiao_jiaoyu_desc: "For centuries, religion and state have been an inseparable part of the Arab world. Our unique faith and its Islamic values ​​can be fully utilized in our society."
  Saudi_Arabia_damufuti_shixihua: "Hereditary Grand Mufti"
  Saudi_Arabia_damufuti_shixihua_desc: "To consolidate the authority of the faith, the position of Grand Mufti will be a family-inherited rank. The power of the religious court will permeate every corner. God's law cannot be questioned, and only the pious can rule this holy land."
  Saudi_Arabia_jixu_shaliya_fa: "Continue Sharia Law"
  Saudi_Arabia_jixu_shaliya_fa_desc: "It is undeniable that our people are deeply religious, and our citizens believe in Islam. We have an obligation to ensure the continuation of religious beliefs and require Muslim citizens to abide by Islamic law."
  Saudi_Arabia_chongjing_yisilanjiao: "Respect Islam"
  Saudi_Arabia_chongjing_yisilanjiao_desc: "Islam has always been the foundation of our society, and it plays a vital role in the daily lives of most citizens. Rather than continuing to oppose the clergy, perhaps it is time to express our reverence for the religion and demonstrate our devotion to Islam to the world."
  Saudi_Arabia_quanwu_jieshan_weiyuanhui: "Committee for Encouraging Good and Punishing Evil"
  Saudi_Arabia_quanwu_jieshan_weiyuanhui_desc: "To safeguard orthodox beliefs, we will establish committees throughout the country to encourage and punish wrongdoing. Religious teachers will ensure that the sharia is upheld and any deviations from the right path will be corrected."
  Saudi_Arabia_yisilan_daxue_chuantong: "Traditional Islamic University"
  Saudi_Arabia_yisilan_daxue_chuantong_desc: "The concept of 'secondary school' emerged during the reign of Abdul Hamid II of the Ottoman Empire, when Islam and science were taught alongside each other. The restoration of this institution is an important step towards restoring the Golden Age of Islamic learning."
  Saudi_Arabia_jiechu_caijue_jinling: "End the ban on sharia rulings"
  Saudi_Arabia_jiechu_caijue_jinling_desc: "[SAU.GetLeader] declares that no one is superior to another, and that the Shia [SAU.GetAdjective] share the same faith as us. We must address our differences and grant them equal rights and opportunities, especially regarding military service."
  Saudi_Arabia_yanxu_jiaofa_caijue: "Continue the Fatwa"
  Saudi_Arabia_yanxu_jiaofa_caijue_desc: "Fatwas are issued to clarify what is right and wrong, what is permitted and what is not permitted in Islam. We can promote this through the establishment of stations and preachers. They will promote Islamic principles and unify our nation, while also contributing to other goals."
  Saudi_Arabia_qianghua_guojia_rentong: "Strengthen national identity"
  Saudi_Arabia_qianghua_guojia_rentong_desc: "We are a nation of orthodox Islam—and this is an important part of our national identity. O Allah, glory be to you, our hope, glory be to you."
  ########################################阿拉伯帝国###########################################
  Saudi_Arabia_muhanmude_laheman_shate_luxian: "Usurper"
  Saudi_Arabia_muhanmude_laheman_shate_luxian_desc: "Ibn Saud has abandoned the pure teachings, purging the loyal Ikhwan with betrayal and blood. Only Muhammad Rahman dared to condemn his fall—a true Wahhabi warrior who may be the leader who can lead us back to the right path. It is time to overthrow Ibn Saud and restore the faith to its true form!"
  Saudi_Arabia_lianluo_yihewan_jiubu: "Contact the Former Ikhwan Clan"
  Saudi_Arabia_lianluo_yihewan_jiubu_desc: "Following the purges by Ibn Saud, many remaining Ikhwan clans have fled to neighboring regions, fearing what might happen under the new regime. We may be able to convince many of these refugees to join us before we begin our plan to regain our independence."
  Saudi_Arabia_anzhong_mimou_faxisixian: "Secret Conspiracy"
  Saudi_Arabia_anzhong_mimou_faxisixian_desc: "Discontent with Ibn Saud is growing within the court. Conspiracies are being hatched, and alliances are being formed between widely divergent factions. The time for change is upon us."
  Saudi_Arabia_cisha_yiben_shate: "Assassination of the King"
  Saudi_Arabia_cisha_yiben_shate_desc: "The time has come to ensure the end of Ibn Saud's rule. The tribal clans will assassinate their leader, and then the great Wahhabi warrior, Muhammad Rahman, will seize power."
  Saudi_Arabia_huigui_wangri_rongyao: "A Return to Former Glory"
  Saudi_Arabia_huigui_wangri_rongyao_desc: "From Mecca to Medina, the banner of Arabia once flew high. Muhammad Rahman will awaken dormant memories and rekindle the splendor of the empire across this land—a new conquest is about to begin, and God's will will guide us in rebuilding the enduring Arab Empire!"
  Saudi_Arabia_kuaisu_junbei_chongzheng: "Rapid Armament Reconstruction"
  Saudi_Arabia_kuaisu_junbei_chongzheng_desc: "Having escaped the rule of Ibn Saud, we must now urgently rebuild our military. Our army has been severely neglected over the past decade, and a major effort is needed to bring it up to acceptable levels again."
  Saudi_Arabia_chongjian_guojia: "Rebuilding the Nation"
  Saudi_Arabia_chongjian_guojia_desc: "We are gradually rebuilding our nation. Our people yearn for stability and security. To make our people proud to call themselves Arabs once again, we must work hard on reconstruction and public works."
  Saudi_Arabia_dizhi_xihua: "Resist Westernization"
  Saudi_Arabia_dizhi_xihua_desc: "In recent years, the tide of Westernization has eroded the foundations of our Islamic culture and impacted Iranian society as a whole. Therefore, the government must take further measures to limit the spread of decadent Western culture and atheistic ideology."
  Saudi_Arabia_faxisi_jiandie_jigou: "Establish a National Intelligence Agency."
  Saudi_Arabia_faxisi_jiandie_jigou_desc: "Our intelligence agencies can prevent foreign spies from sabotaging our country and also aid our country in international struggles."
  Saudi_Arabia_chongzu_xin_yihewan: "Reorganize the Royal Guard."
  Saudi_Arabia_chongzu_xin_yihewan_desc: "The Royal Guard is the elite of our armed forces, its training and professional skills rivaling those of the finest. Incorporating the remnants of the Ikhwan into the Guard will both maintain the army's combat effectiveness and safeguard the kingdom's rule."
  Saudi_Arabia_suishi_zhunbei_xingdong: "Ready for Action"
  Saudi_Arabia_suishi_zhunbei_xingdong_desc: "We have made great progress in rebuilding our nation, but we cannot rest on our laurels. As our rearmament and reconstruction efforts bear fruit, we must prepare our judicial system to ensure our laws do not hinder our efforts."
  Saudi_Arabia_halifa_guilai: "Return of the Caliphate"
  Saudi_Arabia_halifa_guilai_desc: "The ancient banner flies again! Crowned Caliph in the name of God, both Hashemite pretenders and Western colonizers will submit in this holy crusade—Allah's will will be done!"
  Saudi_Arabia_diguo_zhixia_gongye: "Imperial Direct Industry"
  Saudi_Arabia_diguo_zhixia_gongye_desc: "Centralizing and controlling the nation's means of production may be... advantageous. But we must not be compared to fascists and communists: all factories belong to the Caliph, and we merely manage them on his behalf."
  Saudi_Arabia_jiaqiang_bianfang: "Strengthen border defenses"
  Saudi_Arabia_jiaqiang_bianfang_desc: "Securing our borders is a top priority. Establishing a series of fortifications and defensive positions will ensure the stability and security of our territory. Furthermore, if a conflict breaks out in the region, this will give us a significant military advantage in projecting our power."
  Saudi_Arabia_dazao_guojia_rentong: "Restore the Ikhwan Spirit"
  Saudi_Arabia_dazao_guojia_rentong_desc: "Reignite the Ikhwan Movement and use it to reclaim our territories and become the hegemon of the Muslim world."
  Saudi_Arabia_fuxing_gulao_chuancheng: "Revive an ancient legacy"
  Saudi_Arabia_fuxing_gulao_chuancheng_desc: "We have not forgotten the glorious history of Arabia. Deep in our hearts, [SAU.GetNameDef] remains an empire, and with hard work, we will soon become one again. Now is the time to prepare our people for this transformation."
  Saudi_Arabia_chongzu_xiandai_mamuluke: "Arab Cavalry"
  Saudi_Arabia_chongzu_xiandai_mamuluke_desc: "Our cavalry is renowned for its formidable reputation. Wherever we send them, destruction and fear follow. Let us continue to cultivate this image, and let us triumph through fear alone."
  Saudi_Arabia_chngjian_mulibazun: "Modernized Mubarizun"
  Saudi_Arabia_chngjian_mulibazun_desc: "Modeled after the legendary warriors of the armies of the Four Righteous Caliphs, our Mubarizun soldiers are trained to excel in both positional warfare and single combat."
  Saudi_Arabia_alabo_shijie_zhiwang: "Lord of the Arab World"
  Saudi_Arabia_alabo_shijie_zhiwang_desc: "Arabs have been divided for centuries, but we remember that the Prophet Muhammad united us under one ummah, one pious community that transcended tribal affiliations. Now we have overcome divisions and recaptured the success of the Prophet's time: we have united Arabia!"
  Saudi_Arabia_diguo_kuozhang_zhuyi: "Imperial Expansionism"
  Saudi_Arabia_diguo_kuozhang_zhuyi_desc: "Since the time of the first caliph, Arab tribes have never pledged allegiance to a single ruler; even then, they frequently revolted, leading to civil wars within the caliphate, known as the Fitna. Under our rule, this will not happen, and we will restore the era of Islamic unity."
  Saudi_Arabia_meisuobudamiya_zhanlue: "Mesopotamian Strategy"
  Saudi_Arabia_meisuobudamiya_zhanlue_desc: "Mesopotamia holds significant significance on several levels. For scholars, it's the site of the first great rise of human civilization. For believers, Baghdad's importance to Islam is undeniable. For us, its fertile soil and strategic position straddling the Persian Gulf make it an invaluable asset to our growing empire."
  Saudi_Arabia_meisuobudamiya_zhanlue_tt: "If we §Yaccede§! to the Kurdish demands, they will rise in revolt in [IRQ.GetNameDef] by the time we complete the §Y$Saudi_Arabia_alabo_zhengfu_xuliya$§! national focus."
  Saudi_Arabia_alabodiguo_suoyao_yuedan: "Control Jordan"
  Saudi_Arabia_alabodiguo_suoyao_yuedan_desc: "As our influence in the region grows, the presence of [JOR.GetNameDef] could clearly undermine our efforts. Therefore, we must ensure that its foreign policies align with ours, or they will face the wrath of our armed forces."
  Saudi_Arabia_alabodiguo_suoyao_balesitan: "Claim Palestine"
  Saudi_Arabia_alabodiguo_suoyao_balesitan_desc: "Any holy site as important to the Islamic faith as Palestine should fall under Imperial rule. We must ensure that these holy sites are immediately returned to our hands."
  Saudi_Arabia_alabo_zhengfu_xuliya: "Destroy the Hashemites"
  Saudi_Arabia_alabo_zhengfu_xuliya_desc: "[IRQ.GetNameDefCap] is our gateway to the north and must be conquered first. We should logically invade this country and assert our claim to its territory."
  Saudi_Arabia_alabodiguo_chongjian_zhihuigong: "Rebuild the Palace of Wisdom"
  Saudi_Arabia_alabodiguo_chongjian_zhihuigong_desc: "Under our enlightened leadership, the rebuilt House of Wisdom has become a symbol of knowledge and enlightenment in Baghdad. This former sanctuary of scholars, meticulously restored, now radiates with splendor. Learned minds will gather here to exchange knowledge and foster innovation. The House of Wisdom Library, housing ancient texts, will be revitalized, illuminating a new era of enlightenment. Our nation will be forever remembered as a patron of wisdom."
  Saudi_Arabia_alabo_jingong_yameiniya: "Inciting Armenia"
  Saudi_Arabia_alabo_jingong_yameiniya_desc: "Armenian Muslims, forced to convert and relocate under the evil of communism, face the flames of empire at their doorstep. It is time to raise our voices and return to the Caliphate!"
  Saudi_Arabia_alabo_kuayue_haixia: "Across the Strait"
  Saudi_Arabia_alabo_kuayue_haixia_desc: "The lands across the Persian Gulf hold immense wealth and strategic value. By extending the Arab Empire's influence beyond these majestic peaks, we consolidate our rule and open new frontiers for the Empire's glory."
  Saudi_Arabia_alabo_zhengfu_bosi: "End the Persian Threat"
  Saudi_Arabia_alabo_zhengfu_bosi_desc: "The Persian region has been ruled by several empires, the last of which was Timur, whose insidious power once stalked the hills of Ananatolia. Even then, their power has faded, and a new empire may yet rise in these lands; a Persian lion that may seek to dismember us. We must strike first and settle our eastern frontier once and for all."
  Saudi_Arabia_alabo_maixiang_niluohe: "Ayyubid Dynasty"
  Saudi_Arabia_alabo_maixiang_niluohe_desc: "Egypt represents the greatest loss the Empire has ever suffered. With their lands once again under our control, our people will be united once more!"
  Saudi_Arabia_alabo_zhanling_annatuoliya: "Exterminate the Sufis"
  Saudi_Arabia_alabo_zhanling_annatuoliya_desc: "During the Seljuk period, the Rum Sultanate conquered Anatolia, but lost it during the subsequent Crusades. Now is the time to restore it to our control. Integrate these territories and continue the expansion of [SAU.GetNameDef]."
  Saudi_Arabia_alabo_tongyi_magelibu: "Unite the Maghreb"
  Saudi_Arabia_alabo_tongyi_magelibu_desc: "With the conquest of Western Arabia, we have established ourselves on the world stage. Now is the time to declare the unity of the Maghreb and prepare to face any power that dares to challenge our position!"
  Saudi_Arabia_alabo_xixili_aimierguo: "Emirate of Sicily"
  Saudi_Arabia_alabo_xixili_aimierguo_desc: "The Mediterranean island of Sicily was once held by Arabs for centuries. Since then, it has been reconquered by Christians, but it remains a vital springboard for the conquest of Italy. From Sicily, our navy can launch raids against the Italian coast and ultimately threaten Rome, the center of Western Christianity."
  Saudi_Arabia_alabo_chongjian_andalusi: "Rebuilding Al-Andalus"
  Saudi_Arabia_alabo_chongjian_andalusi_desc: "Al-Andalus was once a vital part of the Islamic world and home to many scholars and philosophers. Unfortunately, due to a despicable reconquest, all remnants of this nation were wiped out by powerful Christian kingdoms. Let us cross the Strait of Gibraltar and teach them a powerful lesson."
  Saudi_Arabia_alabo_jinru_zhongya: "Enter Central Asia"
  Saudi_Arabia_alabo_jinru_zhongya_desc: "Throughout our history, the Arab people have united and divided countless times. If we can bring all of Central Asia under our control, we will be able to continue the legacy of the great Arab Empires of the past and unite all peoples under a single state!"
  Saudi_Arabia_alabo_suoyao_afuhan: "Final Notice to Afghanistan"
  Saudi_Arabia_alabo_suoyao_afuhan_desc: "Afghan is an obstacle to Arab rule in Central Asia. By launching a decisive campaign, we can dismantle their power, secure strategic trade routes, and expand the Empire's influence in the region."
  Saudi_Arabia_alabo_zaiyinduhe_lizudian: "A foothold in the Indus Valley"
  Saudi_Arabia_alabo_zaiyinduhe_lizudian_desc: "[RAJ.GetNameDefCap] is a symbol of [ENG.GetNameDef] colonial power. However, the [ENG.GetAdjective] people do not belong here, and they should understand that this land is the birthright of the [SAU.GetNameDef] according to God's will."
  Saudi_Arabia_alabo_zhiyuan_basimaqi_yundong: "Inciting the remnants of the Basmachi"
  Saudi_Arabia_alabo_zhiyuan_basimaqi_yundong_desc: "As late as 1934, the Basmachi movement continued to fight against [SOV.GetAdjective] forces in an attempt to liberate Central Asia. Although their uprising was suppressed, some leaders escaped. We should strive to establish contact with these freedom fighters and invite them to pledge allegiance."
  Saudi_Arabia_alabo_leiting_zhanxiang: "Thundering War Elephant"
  Saudi_Arabia_alabo_leiting_zhanxiang_desc: "While the world scrambles to produce ever more complex mobile monsters, we will employ the tried and true method of war elephants. Their might and majesty will inspire our armies and strike fear into the hearts of our enemies, paving the way for Imperial victory."
  Saudi_Arabia_alabo_chuanyue_wahanzoulang: "Across the Wakhan Corridor"
  Saudi_Arabia_alabo_chuanyue_wahanzoulang_desc: "The warlords of the northwestern Three Mas are hindering the Arab Empire's control of Central Asia. By launching a decisive campaign, we can dismantle their power, secure strategic trade routes, and expand the Empire's influence in the region."
  ####################################拉希德#####################################################
  Saudi_Arabia_laxide_zaiqi: "Old Land, Old Master"
  Saudi_Arabia_laxide_zaiqi_desc: "Ibn Saud's iron-fisted rule has brought untold suffering to the Shia and tribal peoples, shattering the old order. In despair, they look north—the memories of the Rashids of Hail still shine brightly. If Prince Mutaib is willing to raise the banner, this land will once again fight for its true ruler! Tyranny will finally be overthrown!"
  Saudi_Arabia_laxide_yingjiu_jiangling: "Rescue Muhammad Rashid"
  Saudi_Arabia_laxide_yingjiu_jiangling_desc: "Muhammad Rashid is a distinguished general of the Rashid family. After our defeat, he was imprisoned in Riyadh by Ibn Saud, who even forced him to marry his wife. Secretly contacting Muhammad Rashid and rescuing him before he is discovered will help us in our fight against the tyrant."
  Saudi_Arabia_laxide_yingjiu_jiangling_TT: "§YMohammed Rashid§! will be rescued and used as a §Ypolitical advisor§! when the civil war ends."
  Saudi_Arabia_laxide_lianluo_haximu: "Contact the Hashemites."
  Saudi_Arabia_laxide_lianluo_haximu_desc: "Although the Hashemites were once hostile to us, the damage caused by the Wahhabi heresy has not yet healed. They should be very interested in joining us to eliminate the heresy in Najd."
  Saudi_Arabia_laxide_mimi_junshi_yanxi: "Secret military exercises."
  Saudi_Arabia_laxide_mimi_junshi_yanxi_desc: "We paid a heavy price in our last war against Ibn Saud due to a lack of understanding of the rapid changes in warfare in recent decades. To ensure we do not make the same mistake again, it is imperative that our officers conduct wargames and plan for defeating Ibn Saud's military. We must ensure that this is done in a way that does not arouse suspicion..."
  Saudi_Arabia_laxide_mimi_junshi_yanxi_TT: "The §YCivil War§! will strengthen our forces, with the addition of §Ytwo additional§! elite divisions."
  Saudi_Arabia_laxide_yange_fangfan_jiduan_zhuyi: "We must strictly guard against extremism."
  Saudi_Arabia_laxide_yange_fangfan_jiduan_zhuyi_desc: "We are a new, secular nation with hopes for a better future; Wahhabism represents authoritarian ideologies that undermine the very concept of religious harmony. We must eliminate the last vestiges of extremist sects like Wahhabism and the stain they have left on our nation's history."
  Saudi_Arabia_fangkang_baier_butuo: "Defeat without discouragement"
  Saudi_Arabia_fangkang_baier_butuo_desc: "Wahhabism has led our once glorious nation down a path of no return. Soon, our covetous neighbors will realize the regime's weakness and strike a fatal blow. If we are to save our beloved homeland, the Wahhabis must be driven out!"
  Saudi_Arabia_fankang_lalong_yihewan: "Winning over the tribes"
  Saudi_Arabia_fankang_lalong_yihewan_desc: "We must not forget what our people are going through, and have already gone through, nor must we forget the tribal leaders who hold the lifeblood of our nation. To resist the tyrant's rule and remain in power, we must make a commitment to them."
  Saudi_Arabia_fankang_lalong_yihewan_TT: "By granting the tribal leaders certain 'privileges', we will gain §Y2§! tribal divisions upon the start of the §YCivil War§!."
  Saudi_Arabia_fankang_zhengqu_dongbu_shenyepai: "Win over the Eastern Shia"
  Saudi_Arabia_fankang_zhengqu_dongbu_shenyepai_desc: "As early as the time of Talal Rahman, we provided generous and inviolable asylum to the region's numerous political exiles, and by granting these Shia special treatment, we silenced all complaints. Now, Ibn Saud's tyranny and oppression have left them battered and bruised. It is time to unite and join the banner of resistance against the tyrant!"
  Saudi_Arabia_fankang_zhengqu_dongbu_shenyepai_tt: "Secure the support of the Eastern Shia and ensure they are on our side when the §YCivil War§! begins."
  Saudi_Arabia_fankang_lianhe_nanfang_yisimayi: "Win over the support of the South"
  Saudi_Arabia_fankang_lianhe_nanfang_yisimayi_desc: "We must win the support of Shia communities in the southern holy sites. In the event of rebellion, we will sever the holy sites' ties with Riyadh and deal a fatal blow to the tyrant!"
  Saudi_Arabia_fankang_lianhe_nanfang_yisimayi_tt: "Secure the support of the southern opposition and get them on our side once the §YCivil War§! begins."
  Saudi_Arabia_fankang_shibudaiwo: "Time is of the essence."
  Saudi_Arabia_fankang_shibudaiwo_desc: "The task before us is exceptionally difficult. We must challenge a regime that has spent years consolidating itself and gaining majority support. But our goal is clear, and now we must act."
  Saudi_Arabia_fankang_shibudaiwo_tt: "Incite rebellion in the Royal Guard. Once the §YCivil War§! begins, you will gain 3 defected generals and grant the opposing army a bonus to Chaos."
  Saudi_Arabia_fankang_zhizheng_zhaoxi: "Time is of the essence."
  Saudi_Arabia_fankang_zhizheng_zhaoxi_desc: "The time has come. We must dedicate ourselves to this sacred task: to rid our homeland of Wahhabi rule. Only then can our descendants one day be free from the grip of extremism."
  Saudi_Arabia_laxide_xuancheng_aosiman: "Cuckoo Occupies the Magpie's Nest"
  Saudi_Arabia_laxide_xuancheng_aosiman_desc: "The Ottoman eagle has fallen, but the blood of the House of Rashid still carries the Sultan's ambitions. The lion of the desert will pick up the shattered crown of the empire. From the dunes of Arabia to the plateaus of Anatolia, we will proclaim the return of the Ottomans."
  SAU_dusaiwaer_yishi_qiuai_jice_tt: "Unlocks decision: §YThe Ottoman Road§!"
  Saudi_Arabia_laxide_xuancheng_aosiman_tt: "We can choose to fabricate Ottoman claims on our own, but this will incur a significant negative bonus—$stability_factor_tt$: §R-25.0%§!\nOr we can pursue §Y$TUR_durrushehvar_i$§!. If we succeed in pursuing §Y$TUR_durrushehvar_i$§!, we will gain Ottoman claims and the support of the Royalists in [TUR.GetNameDef], allowing us to either have them join us or cause rebellion in [TUR.GetNameDef] when we attack it."
  Saudi_Arabia_laxide_xiandai_aosiman_zhengfu: "Modern Ottoman Government"
  Saudi_Arabia_laxide_xiandai_aosiman_zhengfu_desc: "The chaos caused by the civil war has completely derailed the process of building effective state institutions. Over a third of the nation's potential talent is idle across China, simply due to a lack of mentors to promote it. By reforming the nation's selection system, we will ensure that we can discover much-needed talent." 
  Saudi_Arabia_laxide_xiandai_aosiman_zhengfu_tt: "Claim Ottoman"
  Saudi_Arabia_laxide_xiandai_aosiman_zhengfu_1_tt: "Unlocks the §YIntelligence Operation§! to rescue $TUR_said_i_nursi$. Upon success $available_political_advisor$§Y$CHARACTER$§!"
  Saudi_Arabia_laxide_goujian_telabuzong_yaosai: "Border Forts"
  Saudi_Arabia_laxide_goujian_telabuzong_yaosai_desc: "The forts and blockhouses along our kingdom's borders are a testament to the Sultan's unwavering resolve. Let our warriors shed their blood to keep the Sultan's line alive and his realm intact."
  Saudi_Arabia_laxide_gaige_milite_zhidu: "Reform the Millet System"
  Saudi_Arabia_laxide_gaige_milite_zhidu_desc: "The Ottoman millet system is a set of Islamic laws governing non-Muslims. Millets were previously inconsistent across the country, and reforms will standardize the system and add additional laws to better govern the state."
  Saudi_Arabia_laxide_baorong_de_minzu_zhuyi: "Inclusive Religiousism"
  Saudi_Arabia_laxide_baorong_de_minzu_zhuyi_desc: "Religious pride in one's country is not inherently bad, as long as we cultivate it into an inclusive sentiment. As long as we all share a love for our country, the bond will not be easily broken."
  Saudi_Arabia_laxide_zaidu_lianshou_jiutongmengguo: "Reuniting with the Old Allies"
  Saudi_Arabia_laxide_zaidu_lianshou_jiutongmengguo_desc: "Destiny has given us a second chance to correct the mistakes of the last war. We should act decisively and seize the opportunity!"
  Saudi_Arabia_laxide_tuidong_aoxiong_diguo: "Promote the rebirth of the Austro-Hungarian Empire"
  Saudi_Arabia_laxide_tuidong_aoxiong_diguo_desc: "Our rebirth from the ashes of the Ottomans is indeed a triumph, but we are still surrounded by enemies who wish only to see us destroyed once more. We need allies, and Ottoman-led expeditions to the Danube are not new."
  Saudi_Arabia_laxide_deguo_junguantuan: "German Officer Corps"
  Saudi_Arabia_laxide_deguo_junguantuan_desc: "Invite an advisory group of German officers who stand ready to assist in modernizing our army and making it the most formidable fighting force possible."
  Saudi_Arabia_laxide_deguo_tanke_xiangmu: "Import German tank designs"
  Saudi_Arabia_laxide_deguo_tanke_xiangmu_desc: "Thanks to our alliance with the Germans, we now not only have easier access to blueprints and detailed information for the research and development of tanks similar to German armor, but we can also easily purchase such vehicles from them. The Smoking Cobra will strike fear into the hearts of our enemies!" 
  Saudi_Arabia_laxide_deguo_qianting_xiangmu: "Introduce German submarine designs."
  Saudi_Arabia_laxide_deguo_qianting_xiangmu_desc: "By cooperating with the Germans, we will be able to apply their technology to sectors we have previously focused on modernizing, one of which is submarine warfare. We will exploit our new allies and control the Red Sea shipping lanes!"
  Saudi_Arabia_laxide_defuxiermei_xiandaihua: "Reform the Defushirme system."
  Saudi_Arabia_laxide_defuxiermei_xiandaihua_desc: "By absorbing young men from newly conquered territories, we can significantly speed up conscription. Let us further implement and improve this system to accommodate our nation's expansion."
  Saudi_Arabia_laxide_gaige_mansuer_jun: "Reform Mansur's Army."
  Saudi_Arabia_laxide_gaige_mansuer_jun_desc: "Mansur's Army, also known as Muhammad's Victorious Army, is an elite corps formed after the abolition of the Janissary Corps. They were trained in Europe, are highly disciplined, diligently trained, and fiercely loyal to the Sultan."
  Saudi_Arabia_laxide_chongzu_yeniqieli: "Modernized Janissaries"
  Saudi_Arabia_laxide_chongzu_yeniqieli_desc: "The Janissaries have once again become the core of our nation's military. They are ready to swear allegiance to the Sultan in exchange for membership in the Ottoman hierarchy."
  Saudi_Arabia_laxide_kuozhang_kaiduan: "Preemptive Strikes"
  Saudi_Arabia_laxide_kuozhang_kaiduan_desc: "[ROOT.GetNameDefCap] is already a powerful empire, but it is no longer what it once was. Under proper guidance, it will be even more powerful than before."
  Saudi_Arabia_laxide_quebao_xinyue_wodi: "Secure the Fertile Crescent"
  Saudi_Arabia_laxide_quebao_xinyue_wodi_desc: "[IRQ.GetNameDef]'s territory will be an excellent platform to demonstrate [SAU.GetNameDef]'s status as the sole regional power. This will be one of the starting points for our great campaign of conquest."
  Saudi_Arabia_laxide_shengsuo_yuedan: "Claim Jordan"
  Saudi_Arabia_laxide_shengsuo_yuedan_desc: "[JOR.GetNameDef]'s territory will be an excellent platform to demonstrate [SAU.GetNameDef]'s status as the sole regional power. This will be one of the starting points for our great campaign of conquest."
  Saudi_Arabia_laxide_muhanmode_jihua: "The Muhammad Plan"
  Saudi_Arabia_laxide_muhanmode_jihua_desc: "Mehmed II was the seventh Sultan of the Ottoman Empire, nicknamed 'Fatih.' His reign was marked by conquests in Asia Minor and the Balkans. To honor him, we will name our war plan in the region after him."
  Saudi_Arabia_laxide_sailimu_jihua: "Salem Plan"
  Saudi_Arabia_laxide_sailimu_jihua_desc: "Selim I was the ninth Sultan of the Ottoman Empire, best known for his invasion of the Mamluks in 1516 AD. To honor him, we will name our plan to invade North Africa and expel the [ENG.GetAdjective] from these lands after him."
  Saudi_Arabia_laxide_sulaiman_jhua: "Sulaiman Plan"
  Saudi_Arabia_laxide_sulaiman_jhua_desc: "Suleiman the Magnificent was a prominent 16th-century Ottoman monarch, widely known in the West as 'The Great.' He personally led the Ottoman army in the conquest of the Christian city of Belgrade, Rhodes, and much of Hungary. Therefore, we name our plan after him, aiming to atone for our defeat at the hands of the Habsburgs."
  Saudi_Arabia_laxide_shengsuofeiya_de_qiongding: "Reclaim the Turkish Peninsula"
  Saudi_Arabia_laxide_shengsuofeiya_de_qiongding_desc: "[TUR.GetNameDefCap] is an obstacle to our westward expansion. Anatolia was once Ottoman territory, and now is the time to reclaim it. Mobilize our armies and prepare for invasion!"
  Saudi_Arabia_laxide_shengsuofeiya_de_qiongding_tt: "After occupying §Yall core§! regions of [TUR.GetNameDefCap] and completing the focus: §Y$Saudi_Arabia_laxide_muhanmude_de_yichan$§!, a portion of the Turkish §YMilitary-Industrial Organization§! will become available."
  Saudi_Arabia_laxide_cuihui_xila_desc: "The cities of southern Greece could serve as stepping stones for the infidels to launch a crusade against us. We must hold the south to ensure the true leadership of Islam prospers."
  Saudi_Arabia_laxide_poshi_baojialiya_chenfu: "Force Bulgaria into submission"
  Saudi_Arabia_laxide_poshi_baojialiya_chenfu_desc: "[BUL.GetNameDef] is the only nation of the old Allied powers to have retained its sovereignty and survived. How did they do that? Nothing special, they are just cowards! We will force them to bow down before us and be at our mercy."
  Saudi_Arabia_laxide_zhijie_saierweiya: "Dismember Yugoslavia"
  Saudi_Arabia_laxide_zhijie_saierweiya_desc: "The creation of Yugoslavia was one of the greatest mistakes in human history. We must do everything in our power to recover the former lands of the Slovenes, Croats, and Serbs. The Ottomans will rise again!"
  Saudi_Arabia_laxide_muhanmude_de_yichan: "Reorganize the Ottoman Empire"
  Saudi_Arabia_laxide_muhanmude_de_yichan_desc: "We have triumphed! With the recapture of the imperial capital, we are one step closer to fulfilling our destiny! The glory of a new Ottoman era is within reach—a new era forged in blood and fire! The Sultan must triumph!"
  Saudi_Arabia_laxide_quebao_balesitan_kongzhi: "Secure control of Palestine"
  Saudi_Arabia_laxide_quebao_balesitan_kongzhi_desc: "In 1917, the British captured Jerusalem and derailed any progress toward an Ottoman revival. The Balfour Declaration even foresaw the establishment of a Jewish state in the region. Now is the time for us, the guardians of the Islamic faith, to reclaim the holy city of Jerusalem."
  Saudi_Arabia_laxide_duobuluojia_suoqu: "Demand Dobruja"
  Saudi_Arabia_laxide_duobuluojia_suoqu_desc: "At the end of the Great War, the [ROM.GetAdjective] occupied Dobruja, a land we had ruled for centuries. It's not long enough for our people to remember this event clearly. It's time to reclaim these lands for ourselves."
  Saudi_Arabia_laxide_jinzita_de_yuanzheng: "The Pyramid Crusade"
  Saudi_Arabia_laxide_jinzita_de_yuanzheng_desc: "To reclaim the Ottoman Empire's homeland in North Africa, our forces must march through [ENG.GetAdjective] North Africa and ultimately invade Egypt. This will undoubtedly lead us to war with [ENG.GetNameDef], but this is a risk we must take if we are to establish dominance in the region."
  Saudi_Arabia_laxide_luomaniya_gonglue: "Ultimatum to Romania"
  Saudi_Arabia_laxide_luomaniya_gonglue_desc: "In the Romanian War of Independence, we were humiliated and our Transylvanian territories were stolen. To restore our honor, we must reclaim this land that is rightfully ours."
  SAU_yisilanguo_nulade_jihua_kelimiya: "The Murad Plan"
  SAU_yisilanguo_nulade_jihua_kelimiya_desc: "Murad II ascended the throne in 1421, at a time when the Ottoman Empire had been greatly weakened by the invasion of Timur. He subsequently revitalized the empire and strengthened its military. In 1430, he defeated the powerful Venetian Empire. To honor him, we named our war plan in the region after him."
  Saudi_Arabia_laxide_bosi_xingsheng: "Thrust to the South"
  Saudi_Arabia_laxide_bosi_xingsheng_desc: "Yemen is the meeting point of Arabia and Africa. They are also the source of some of the world's most renowned coffee. However, they are our enemies, and we must deal with them. We will conquer them, just as we have conquered the rest of Arabia."
  Saudi_Arabia_laxide_chuanyue_magelibu: "Target - Tunisia"
  Saudi_Arabia_laxide_chuanyue_magelibu_desc: "With the conquest of Western Arabia, we have established ourselves on the world stage. Now is the time to march on Tunisia and prepare to confront any power that dares to challenge our position!"
  Saudi_Arabia_laxide_yilang_tongdie_zuizhong: "The Ultimatum to Persia"
  Saudi_Arabia_laxide_yilang_tongdie_zuizhong_desc: "Persia has been ruled by several empires, the last of which was Timur, whose insidious might once conquered the hills of Ananatolia. Even their glory has faded, and this land may yet see the birth of a new empire; a Persian lion that may seek to dismember us. We must strike first and settle our eastern frontier once and for all."
  Saudi_Arabia_laxide_zhangkong_honghai: "Adal Province"
  Saudi_Arabia_laxide_zhangkong_honghai_desc: "Our Muslim brothers in the Horn of Africa face the prospect of subjugation by the pagan Christians entrenched in Ethiopia, or even worse, by the primitive polytheists of the Oromia region. We must move forward and establish the Adal Province to ensure Muslim control of this region. Of course, the expansion of our diplomatic and trade influence in the Horn of Africa is a side benefit that comes with our firm control here."
  Saudi_Arabia_laxide_zhenzheng_de_luoma_diguo: "The True Roman Empire"
  Saudi_Arabia_laxide_zhenzheng_de_luoma_diguo_desc: "The fall of the Byzantine Empire does not mean the end of the True Roman Empire. We are its chosen successors, chosen by Allah. Therefore, ruling the heart of the old Roman Empire is our true destiny—to rule the great city of Rome!"
  Saudi_Arabia_laxide_disanci_huangjin_shidai: "Rise from the Ashes"
  Saudi_Arabia_laxide_disanci_huangjin_shidai_desc: "Islam has once again risen to become the world's dominant power. With the rise of the Ottoman Caliphate, cultural and technological advancements are flourishing in Muslim nations. We are living in the Third Golden Age of Islam, truly and truly."
  ####################################哈希姆#####################################################
  Saudi_Arabia_haximu_zhengtong_halifa: "Return of Sayyid"
  Saudi_Arabia_haximu_zhengtong_halifa_desc: "Under tyranny, the people recall the Hashemite bloodline, descendants of the Prophet, who once ruled this land. Now, under Ibn Saud's oppression, the tribes and Shia call for their return. Let the noble descendants of Mecca raise their banner and lead us to overthrow the tyrant and rebuild a just nation for the believers!"
  Saudi_Arabia_haximu_yingj: "Cooperation with Italy"
  Saudi_Arabia_haximu_yingj_desc: "It is clear that our hopes of defeating Ibn Saud on the battlefield are slim. However, we can seek a new ally, a path to bring strength to our homeland through cooperation with the Italians."
  Saudi_Arabia_haximu_yidali_junshi_zongcanmooubu: "Italian General Staff"
  Saudi_Arabia_haximu_yidali_junshi_zongcanmooubu_desc: "Our military still has a long way to go in modernizing. While we have made great strides in acquiring or manufacturing modern equipment for our forces, our officers' perspective on how to utilize this equipment remains lagging behind. Perhaps we could invite [ITA.GetAdjective] officers to join our command to learn from them how to conduct modern warfare."
  Saudi_Arabia_haximu_suoqu_yidali_zhuangbei: "Request Italian Equipment"
  Saudi_Arabia_haximu_suoqu_yidali_zhuangbei_desc: "Despite our efforts to reform our economy and strengthen our military, some assistance might be helpful. Given our deepening relationship with the [ITA.GetAdjective], they might be willing to ship us some advanced equipment."
  Saudi_Arabia_haximu_waibao_shengchan: "Italian Equipment"
  Saudi_Arabia_haximu_waibao_shengchan_desc: "Our industry is underdeveloped and lacks experience in manufacturing weapons and equipment. However, now that we are deeply embedded in the [ITA.GetAdjective] sphere of influence, we can leverage our diplomatic position to outsource equipment production to their manufacturers and tap into their expertise."
  Saudi_Arabia_haximu_yaoqing_yidali_touzizhe: "Invite Italian investors"
  Saudi_Arabia_haximu_yaoqing_yidali_touzizhe_desc: "We should leverage our new allies and attract allied investment to [ETH.GetName]. This influx of allied investment will benefit us in many ways, not only aiding post-war reconstruction but also greatly enhancing our industrial capabilities."
  Saudi_Arabia_haximu_yidali_shiyou: "[ITA.GetAdjective]-[SAU.GetAdjective] oil cooperation"
  Saudi_Arabia_haximu_yidali_shiyou_desc: "We possess vast oil reserves in the Eastern Province. By coordinating with [ITA.GetAdjective] and expanding production, we can secure control of this world's most vital resource."
  Saudi_Arabia_haximu_wangzi_guilai: "Legitimate Heir"
  Saudi_Arabia_haximu_wangzi_guilai_desc: "Prince Abdul Ilah is the eldest grandson of Hussein ibn Ali, the leader of the Arab Revolt. His family was forced to flee the Hejaz when Ibn Saud of Najd usurped power from his father. Now that we have successfully overthrown Ibn Saud's oppressive kingdom, it is time to successfully restore Prince Abdul Ilah to his homeland and ascend the throne."
  Saudi_Arabia_haximu_jijie_zai_haximu_huixia: "Rally under the Hashemite Banner"
  Saudi_Arabia_haximu_jijie_zai_haximu_huixia_desc: "The Hashemite family must be central to our continued efforts to build Arab national consciousness. Having successfully seized power, we are on the verge of truly consolidating our control here."
  Saudi_Arabia_haximu_bianyuan_zuqun_keerderen: "Appease the Shia"
  Saudi_Arabia_haximu_bianyuan_zuqun_keerderen_desc: "We should grant the Shia community a degree of autonomy and legalize Shia customs nationwide, uniting all [SAU.GetAdjective] citizens under one banner."
  Saudi_Arabia_haximu_zhengqu_bulluo_zhichi: "Appease the Tribes"
  Saudi_Arabia_haximu_zhengqu_bulluo_zhichi_desc: "There are still many tribal leaders who do not fully trust our government. We should appease them, invest in their communities, and ensure their loyalty is ours alone."
  Saudi_Arabia_haximu_haximu_qingniantuan: "Hashemite Youth League"
  Saudi_Arabia_haximu_haximu_qingniantuan_desc: "To strengthen our nation, we must create youth organizations and train our people to fight for a brighter future!"
  Saudi_Arabia_haximu_bihu_damufuti: "Give Refuge to the Grand Mufti"
  Saudi_Arabia_haximu_bihu_damufuti_desc: "Following recent unrest in Palestine, the controversial Grand Mufti of Jerusalem, Amin Hussein, has been exiled by the British. To appease anti-British sentiment at home, perhaps we could offer him temporary asylum."
  Saudi_Arabia_haximu_ziyou_alabo_juntuan: "Free Arab Legion"
  Saudi_Arabia_haximu_ziyou_alabo_juntuan_desc: "Arabs from around the world are volunteering to fight against the old forces that have hindered us for decades. Perhaps we could build on this by recruiting troops from abroad to fight alongside our own forces against a common enemy."
  Saudi_Arabia_haximu_jiechu_yuedan: "Engage Jordan"
  Saudi_Arabia_haximu_jiechu_yuedan_desc: "Our cousins ​​still rule Jordan under [ENG.GetAdjective] protection. However, perhaps we can convince them and the [ENG.GetAdjective] to let us take over Jordan's defense, thereby achieving greater political and economic cohesion."
  Saudi_Arabia_haximu_quyu_jingji_yitihua: "Regional Economic Integration"
  Saudi_Arabia_haximu_quyu_jingji_yitihua_desc: "We must make massive investments in the region's infrastructure to achieve long-term economic growth that benefits all member states."
  Saudi_Arabia_haximu_quyu_junshi_yitihua: "Regional Military Integration"
  Saudi_Arabia_haximu_quyu_junshi_yitihua_desc: "While we lack the military-industrial capacity to rival those of the great powers, military investments in the region may allow us to catch up."
  Saudi_Arabia_haximu_quyu_junshi_yitihua_tt: "Completing this focus while [JOR.GetNameDef]/[IRQ.GetNameDef] is a subject of our country or while our country controls [JOR.GetNameDef]/[IRQ.GetNameDef] will add two additional military factories to [JOR.GetNameDef]/[IRQ.GetNameDef]."
  Saudi_Arabia_haximu_quyu_jingji_yitihua_tt: "Completing this focus while [JOR.GetNameDef]/[IRQ.GetNameDef] is a subject of our country or while our country controls [JOR.GetNameDef]/[IRQ.GetNameDef] will add two additional civilian factories to [JOR.GetNameDef]/[IRQ.GetNameDef]."
  Saudi_Arabia_haximu_suoyao_balesitan: "Demand Palestine"
  Saudi_Arabia_haximu_suoyao_balesitan_desc: "The British have proven unable to protect the Palestinians in the Mandate. With the eyes of the world on them, perhaps we can demand they transfer the Mandate to us and force them to abandon it."
  Saudi_Arabia_haximu_tiyi_tongyi_xuliya: "Propose a unified Syria"
  Saudi_Arabia_haximu_tiyi_tongyi_xuliya_desc: "Syria was briefly ruled by Faisal I in 1920, but was lost to the French through treachery. Now, we can negotiate from strength and demand the return of our de jure territory."
  Saudi_Arabia_haximu_xinhalifa: "New Caliphate"
  Saudi_Arabia_haximu_xinhalifa_desc: "After years of struggle, we have become a powerful nation in the Islamic world. It is time to carry on Hussein ibn Ali's legacy and establish a caliphate under the leadership of the Hashemite family."
  Saudi_Arabia_tongyi_magelibu: "Uniting the Maghreb"
  Saudi_Arabia_tongyi_magelibu_desc: "The Maghreb is an integral part of the Islamic world, having fallen under Western domination for too long. With our newfound strength, we will unite the Maghreb and expel the imperialists once and for all."
  Saudi_Arabia_tongyi_mashenlike: "Uniting the Mashriq"
  Saudi_Arabia_tongyi_mashenlike_desc: "The Mashriq is the beating heart of the Islamic world. We cannot rest until it is fully under the control of the Caliphate."
  Saudi_Arabia_chongjian_andalusi: "Rebuilding Al-Andalus"
  Saudi_Arabia_chongjian_andalusi_desc: "The Spanish may have thought they were masters of Iberia, but long before they founded their own state, it was known as Al-Andalus. Allowing it to return to Islam would be a defeat Europe will never forget."
  Saudi_Arabia_jijie_alabo_shijie: "Rally the Arab World"
  Saudi_Arabia_jijie_alabo_shijie_desc: "The Arab world longs to break free from the yoke of Western powers. Together, we will unite the Arab people and once again become masters of their own destiny."
  Saudi_Arabia_chengli_alabo_lianhe_gongheguo: "Establish the United Arab Republic"
  Saudi_Arabia_chengli_alabo_lianhe_gongheguo_desc: "Our dream of a pan-Arab state is beginning to bear fruit. We must seize the opportunity to declare the United Arab Republic and rally the people to our cause."
  Saudi_Arabia_alabo_haximu_kuochong_lianbang: "Expand the Federation"
  Saudi_Arabia_alabo_haximu_kuochong_lianbang_desc: "Some scoff at the very concept of our federation, while others gaze in awe at our achievements. Perhaps it's time to bring into the Federation those who are smart enough to realize that together we are stronger."
  Saudi_Arabia_haximu_jiefang_bosiwan: "Guardian of the Persian Gulf"
  Saudi_Arabia_haximu_jiefang_bosiwan_desc: "We have proven ourselves to be the only savior of the Middle East. Perhaps we will force Western colonialists to withdraw from the region, leaving us to maintain the security of the Persian Gulf."
  Saudi_Arabia_fan_xifang_lianmeng: "Anti-Western Alliance"
  Saudi_Arabia_fan_xifang_lianmeng_desc: "If the great powers of the region could pool their military might for a common defense, we would have a real chance against the Western powers that so often meddle in our affairs."
  Saudi_Arabia_yaoqing_yilang_jiaru: "Strengthen ties with Iran"
  Saudi_Arabia_yaoqing_yilang_jiaru_desc: "While [SAU.GetAdjective] and [PER.GetAdjective] may not always agree, we share a common commitment to modernizing our nation and resisting Western domination. It's time to build a constructive relationship and achieve our shared goals."
  Saudi_Arabia_yaoqing_afuhan_jiaru: "Invite Afghanistan"
  Saudi_Arabia_yaoqing_afuhan_jiaru_desc: "[AFG.GetNameDef] has long been sandwiched between [SOU.GetAdjective] and [ENG.GetAdjective], serving as a buffer state. Perhaps through cooperation, we can better integrate them into the region."
  Saudi_Arabia_haximu_jiaqiang_tuerqi_guanxi: "Strengthen ties with Turkey"
  Saudi_Arabia_haximu_jiaqiang_tuerqi_guanxi_desc: "[TUR.GetAdjective] has been on the front lines against Western influence, though this ultimately cost them their empire. As such, we are natural allies, and we should strive to improve our relations with them."
  Saudi_Arabia_haximu_alabo_lianmeng: "Establish the Arab League"
  Saudi_Arabia_haximu_alabo_lianmeng_desc: "We must establish a coalition of like-minded Arab states to protect Arab interests from external interference and liberate those occupied abroad."
  Saudi_Arabia_haximu_alabo_jingj_lianmeng: "Arab League Economic Committee"
  Saudi_Arabia_haximu_alabo_jingj_lianmeng_desc: "To strengthen Arab brotherhood, we should promote closer economic cooperation."
  Saudi_Arabia_haximu_iaru_zhouxinguo: "Join the Axis"
  Saudi_Arabia_haximu_iaru_zhouxinguo_desc: "Although we have thus far avoided involvement in major conflicts, countless opportunities will be available if we fully commit to the Axis cause. Therefore, we will apply for full membership in this alliance."
  Saudi_Arabia_haximu_xunqiu_zhouxinguo_touzi: "Seeking Axis Investment"
  Saudi_Arabia_haximu_xunqiu_zhouxinguo_touzi_desc: "Our economy is stagnant. If we want to resist foreign aggression, we must diversify our economy. Perhaps our overseas friends would be willing to invest here and deepen our ties."
  Saudi_Arabia_haximu_zhouxinguo_kongjun_zhihuiguan: "[SAU.GetAdjective] Air Force Commander"
  Saudi_Arabia_haximu_zhouxinguo_kongjun_zhihuiguan_desc: "Faced with the vast military power of the [ENG.GetAdjective], our military stands little chance. However, our allies may be able to provide advanced aircraft and pilots that could help us turn the tide of the war."
  Saudi_Arabia_haximu_zhouxinguo_xunlian: "Axis Training"
  Saudi_Arabia_haximu_zhouxinguo_xunlian_desc: "Our allies are willing to share the valuable combat experience they have gained in recent conflicts. We should accept this assistance to ensure our military is fully prepared to deliver maximum combat effectiveness on the battlefield."
  ############################################################################################
  #############################            伊赫万              ##############################
  ###########################################################################################
  Saudi_Arabia_aertaweiya_huiyi_de_huixiang: "Echoes of the Al-Tawiya Conference"
  Saudi_Arabia_aertaweiya_huiyi_de_huixiang_desc: "Ibn Saud has betrayed the pure faith—purging the Ikhwan, rejecting jihad, and compromising with the infidels. In the shadows of the desert, the remaining clans sharpen their blades and gather strength. When the new moon rises, the traitor's throne will be burned by the wrath of the pious!"
  Saudi_Arabia_yisilanguo_xunzhao_laxide: "Invite Rashid"
  Saudi_Arabia_yisilanguo_xunzhao_laxide_desc: "Though we were enemies of Rashid during the war, we now have a common adversary. Perhaps it is time to put aside our differences until the greater struggle is won."
  Saudi_Arabia_yisilanguo_xunzhao_laxide_tt: "After the §YCivil War§! begins, gain §Y2§! Family Militia Guards. Also, $SAU_Abdullah_bin_Mutaib_Al$ can be used as an advisor and general."
  Saudi_Arabia_fankang_tiaodong_shenye_panluan: "Incite rebellion."
  Saudi_Arabia_fankang_tiaodong_shenye_panluan_desc: "The Rafidah (a derogatory term for Shia in the Wahhabi school) in the south has long been oppressed by Ibn Saud. We can send someone there to incite them and attract their attention."

  Saudi_Arabia_fankang_quebao_buluo_zhichi: "Secure tribal support."
  Saudi_Arabia_fankang_quebao_buluo_zhichi_desc: "The isolated tribes have neither political leanings nor political understanding. The tribes based in Mutair follow our struggle, trusting our promise of wealth, a return to Sharia law, and a reversal of the radical reforms of Ibn Saud."
  Saudi_Arabia_fankang_qiantuweibu: "The sea is wide, the fish leap."
  Saudi_Arabia_fankang_qiantuweibu_desc: "The desert is like a sea, the tribes like a tide. The Ikhwan's messengers swim among the sand dunes, sowing the seeds of resistance in the Bedouin tents. When the new moon rises, the scattered forces will converge into a raging tide of vengeance. This desert has never belonged to dictators, but to unyielding warriors!"
  Saudi_Arabia_fankang_qiantuweibu_TT: "After the §YCivil War§! begins, clan warriors come to our aid and will receive §Y3§! new generals."
  Saudi_Arabia_fankang_tiangao_renniao_fei: "The sky is high, free for birds to fly"
  Saudi_Arabia_fankang_tiangao_renniao_fei_desc: "Ibn Saud's shackles have been broken, and the final battle awaits—let the scimitar and faith carve the path to freedom. From now on, there will be no more tyrants in the desert, only soaring eagles!"
  Saudi_Arabia_yisilanguo_renzhuduyizhe: "Those who believe in the Oneness of God"
  Saudi_Arabia_yisilanguo_renzhuduyizhe_desc: "O people! You are in need of Allah, and Allah is the Needless, the Praiseworthy.Say: Allah is the Creator of all things, One and Almighty. To Him belongs everything in the heavens and the earth. Truly, all things belong only to Allah. "
  Saudi_Arabia_yisilanguo_tongzhi_xiaozhong_yu_fucong: "Rule, Allegiance, and Obedience"
  Saudi_Arabia_yisilanguo_tongzhi_xiaozhong_yu_fucong_desc: "Former rulers liked to call their states 'monotheist' and harbored polytheists, Shiites, and Rafidahs. Now, we will abandon these heresies and continue to spread monotheism in neighboring regions, especially in Iraq, where Muslims pray to Ali, Fatima, Hassan, and Hussein."
  Saudi_Arabia_yisilanguo_dingpan_zongjiaojingcha: "Crush Rebellion"
  Saudi_Arabia_yisilanguo_dingpan_zongjiaojingcha_desc: "Many dissidents still plot against the current regime. We will strengthen the religious police and provide them with the means to root out subversive organizations. "
  Saudi_Arabia_yisilanguo_qianxi_tudiherenmin: "Migration"
  Saudi_Arabia_yisilanguo_qianxi_tudiherenmin_desc: "The foundation of a strong society lies in the land and the people who work it. There are still many places in [SAU.GetAdjective] where valuable land could be gained by draining swamps and irrigating farmland."
  Saudi_Arabia_yisilanguo_chachao_yijiaotu: "Seize the Infidels"
  Saudi_Arabia_yisilanguo_chachao_yijiaotu_desc: "Infidels do not deserve, and should never have, the economic privileges long granted by the state. We will redress this injustice by depriving them of their wealth, and thereby strengthen our nation! "
  Saudi_Arabia_yisilanguo_kuoda_xijila: "Abolition of the Hijra"
  Saudi_Arabia_yisilanguo_kuoda_xijila_desc: "The Ikhwan are the masters of this desert. We have lived a nomadic life, partly due to the harsh oppression of our previous rulers. We were forced to abandon our ancient traditions and move into urban settlements. Now we will reverse this situation. The Bedouin will forever belong to the wilderness!"
  Saudi_Arabia_yisilanguo_zigeizizu_de_nuli: "Strive for Self-Sufficiency"
  Saudi_Arabia_yisilanguo_zigeizizu_de_nuli_desc: "To be truly powerful, the [SAU.GetAdjective] must be self-sufficient. We must make better use of our resources and improve the efficiency of our construction." "
  Saudi_Arabia_yisilanguo_quebao_meigeren_de_wenbao: "Ensuring food and clothing for every [SAU.GetAdjective] person"
  Saudi_Arabia_yisilanguo_quebao_meigeren_de_wenbao_desc: "Unfortunately, we are no strangers to famine. With our modernization efforts to improve our economy, we now have the opportunity to improve food distribution and ensure that this basic human need is met for every [SAU.GetAdjective] person."
  Saudi_Arabia_yisilanguo_sabila_zhanyi_jiaoxun: "Lessons from the Battle of Sabila"
  Saudi_Arabia_yisilanguo_sabila_zhanyi_jiaoxun_desc: "Having learned the lessons of the Battle of Sabila, Ikhwan officers will no longer underestimate the strategic value of new weapons or the impact of firearms. We should apply the lessons learned from this war to the training and organization of our armies."
  Saudi_Arabia_yisilanguo_sabila_zhanyi_jiaoxun_tt: "Allows the use of §HArmored Cavalry§!\n§HCavalry\n Plains§!: Attack: §G+20%§! Defense: §G+20%§!\n §HDesert§!: Attack: §G+15%§! Defense: §G+20%§!\n §HHills§!: Attack: §G+10%§! Defense: §G+10%§!\n§HCamel Cavalry\n Plains§!: Attack: §G+20%§! Defense: §G+20%§!\n §HDesert§!: Attack: §G+15%§! Defense: §G+20%§!\n §HHills§!: Attack: §G+10%§! Defense: §G+10%§!"
  Saudi_Arabia_pijia_luotuo_qibing: "Camel Cavalry"
  Saudi_Arabia_pijia_luotuo_qibing_desc: "Our ancestors have often raided heretical frontiers on camels, seizing land and resources from weakened rulers. Now, with our neighbors embroiled in conflict, perhaps such an opportunity is at hand again."
  Saudi_Arabia_yisilanguo_fuzhu_budui: "Auxiliary Forces"
  Saudi_Arabia_yisilanguo_fuzhu_budui_desc: "As in the ancient Caliphate, auxiliary forces still play a vital role today, supporting conventional forces, scouting terrain, and harassing enemy forces. We need to expand these paramilitary militias to bolster our military strength."
  Saudi_Arabia_yisilanguo_lieri_yanggang: "Scorching Sun and Scorching Steel"
  Saudi_Arabia_yisilanguo_lieri_yanggang_desc: "As our new regime grows, we need a military to match it. It is crucial that we invest in more military industrial bases across the country, not just in [SAU.capital.GetCapitalVictoryPointName]. Let the [SAU.GetAdjective] war machine rise!"
  Saudi_Arabia_yisilanguo_huangsha_zhizhu: "Lord of the Yellow Sands"
  Saudi_Arabia_yisilanguo_huangsha_zhizhu_desc: "War could come from sea, land, or air. If a land attack were to occur, our forces would inevitably be fighting in the vast deserts to the north and south of our country. Expanding our desert attack forces, capable of operating in extreme temperatures and sandy terrain, will enhance our military's combat capabilities."
  Saudi_Arabia_yisilanguo_huangsha_zhizhu_tt: "§YTwo§! randomly selected army generals gain the Desert Fox trait."
  Saudi_Arabia_haximu_zhengqu_bulluo_zhichi_tt: "§YTwo§! randomly selected army generals gain the Irregular Officer trait."
  Saudi_Arabia_yisilanguo_huangsha_zhixia: "Shadows in the Sand"
  Saudi_Arabia_yisilanguo_huangsha_zhixia_desc: "Many outsiders wonder how we manage to maintain our tribe in the extreme, arid environment of Nejd. This remarkable adaptation allows us to thrive in a land where nothing else exists."
  Saudi_Arabia_yisilanguo_qiangpo_shenyegaizong: "Forced Shia Conversion"
  Saudi_Arabia_yisilanguo_qiangpo_shenyegaizong_desc: "All sectarian activities are condemned, and all participants will be considered heretics. We will not tolerate heresy within our borders. A strict set of laws targeting followers of heretical imams and clerics will help us to eliminate all heresy from society."
  Saudi_Arabia_yisilanguo_suihui_shengxiang: "Destroy Icons"
  Saudi_Arabia_yisilanguo_suihui_shengxiang_desc: "Worshiping images blinds too many to divine truth. We must remove all images from holy places to prevent believers from falling into this trap."
  Saudi_Arabia_yisilanguo_qicao_yisilan_xianfa: "Draft an Islamic Constitution"
  Saudi_Arabia_yisilanguo_qicao_yisilan_xianfa_desc: "Given our Islamic faith in Sharia law, our constitution may be confusing to some. While maintaining public order and the rights of citizens requires the protection of the Constitution or other laws, Sharia law is the supreme law of [SAU.GetNameDefCap]."
  Saudi_Arabia_yisilanguo_salafei_qingniantuan: "Salafi Youth League"
  Saudi_Arabia_yisilanguo_salafei_qingniantuan_desc: "Youth are our future. By establishing organizations that provide discipline and political education to young people, we can instill the seeds of loyalty and self-sacrifice in them early on."
  Saudi_Arabia_yisilanguo_mohanmode_faxueyuan: "Mohammedan Madrasa"
  Saudi_Arabia_yisilanguo_mohanmode_faxueyuan_desc: "Madrasa are the principal educational institutions in the Islamic world. Often located near mosques, they have given rise to a thriving ulema class. Sponsoring religious schools is a hallmark of a wealthy Muslim ruler."
  Saudi_Arabia_yisilanguo_guli_zongjiao_kuangre: "Encourage Religious Fanaticism"
  Saudi_Arabia_yisilanguo_guli_zongjiao_kuangre_desc: "To further strengthen our influence and control over the military, and to maintain courage and morale, we will encourage and indoctrinate the troops until they no longer fear war!"
  Saudi_Arabia_yisilanguo_jihade_shengzhan: "Holy War"
  Saudi_Arabia_yisilanguo_jihade_shengzhan_desc: "Our ultimate goal is the restoration of the Caliphate, led by the descendants of the tribes that assisted Muhammad in his initial conquests. No foreign power can prevent us from achieving this noble goal."
  Saudi_Arabia_yisilanguo_zhenli_yilailin: "The truth has come..."
  Saudi_Arabia_yisilanguo_zhenli_yilailin_desc: "Our sacred mission is to spread Islam throughout the world. May no one ever again tread the path of darkness, for we hold up the lamp of God!"
  Saudi_Arabia_yisilanguo_xuwang_yixiaomie: "...falsehood has been destroyed."
  Saudi_Arabia_yisilanguo_xuwang_yixiaomie_desc: "As long as paganism reigns in Europe, there will be no peace. The time has come for a new Jihad. A new war machine roars in His name, ready to crush the infidels with righteous fury. Peace will not prevail until the judgment of scimitar and fire falls upon all unbelievers."
  Saudi_Arabia_yisilanguo_xuwang_yixiaomie_tt: "We will wage §RJihad§!, gaining a positive bonus when fighting against enemy nations."
  Saudi_Arabia_yisilanguo_cuihui_shenye_dabenying: "Conquer Persia." 
  Saudi_Arabia_yisilanguo_cuihui_shenye_dabenying_desc: "Iran's culture has greatly influenced its neighbors. Sadly, the land is currently torn apart by religious strife. Let us reconquer Persia and end all internal strife."
  Saudi_Arabia_yisilanguo_yaoqiu_afuhan_chenfu: "Control Afghanistan"
  Saudi_Arabia_yisilanguo_yaoqiu_afuhan_chenfu_desc: "[AFG.GetNameDefCap] lies nestled between winding mountains and rivers, making future conquest here quite complex. If we can gain a foothold in this country, we will have an excellent foundation for our advance towards Kabul."
  Saudi_Arabia_yisilanguo_yindu_qiantoubao: "Sulayman Mountains"
  Saudi_Arabia_yisilanguo_yindu_qiantoubao_desc: "While the Caliphate's initial power did indeed end at the Sulayman Mountains, the word of God has spread far beyond, reaching Nusandara, India, and along the Silk Road. However, many in these regions tend to associate Islam with local beliefs, spreading false idolatry. We need to penetrate these societies."
  Saudi_Arabia_yisilanguo_taohuashi_han: "Taohuashi Khan"
  Saudi_Arabia_yisilanguo_taohuashi_han_desc: "The warlords of the three northwestern states hinder the Caliphate's rule in Central Asia. By launching a decisive campaign, we can dismantle their power, secure strategic trade routes, and expand the Empire's influence in the region."
  Saudi_Arabia_yisilanguo_yinduyang_de_daoyu: "Islamic Islands"
  Saudi_Arabia_yisilanguo_yinduyang_de_daoyu_desc: "While our merchants' influence ends at the ports of India, Southeast Asia has long been influenced by Islamic merchants. If we sail there and seize their trade routes, we can extend our reach further into Asia."
  Saudi_Arabia_yisilanguo_huimie_haximu: "Destroy the Hashemites"
  Saudi_Arabia_yisilanguo_huimie_haximu_desc: "The House of Wisdom is perhaps the most famous library in the Islamic world. Built in Baghdad, it underpinned Islam's Golden Age. However, since the Mongol invasion, it has lost much of its former glory. To rebuild the House of Wisdom and make it even more glorious than before, we must capture Baghdad."
  Saudi_Arabia_yisilanguo_miejue_sufei: "Exterminate the Sufis"
  Saudi_Arabia_yisilanguo_miejue_sufei_desc: "The Ottoman Empire is undoubtedly yet another claimant to the Caliphate. There is only one legitimate leader in all of Islam, and that leader is not an Ottoman monarch. We will prove this on the battlefield."
  Saudi_Arabia_yisilanguo_gaojiasuo_de_huoban: "Contact our fellow citizens in Armenia"
  Saudi_Arabia_yisilanguo_gaojiasuo_de_huoban_desc: "Armenian Muslims have lived under the evil rule of Communism, forced to relocate and convert. The flames of empire have reached their doorstep. It is time to raise our arms and return to the rule of the Caliphate!"
  Saudi_Arabia_yisilanguo_shandong_basimaqi_yundong: "Win over the remaining Basmachi."
  Saudi_Arabia_yisilanguo_shandong_basimaqi_yundong_desc: "Until 1934, the Basmachi movement continued to fight against [SOV.GetAdjective] forces and attempted to liberate Central Asia. Although their uprising was suppressed, some leaders escaped. We should strive to establish contact with these freedom fighters and invite them to come and pledge their allegiance."
  Saudi_Arabia_yisilanguo_nanfang_shenyepai: "Enter Egypt."
  Saudi_Arabia_yisilanguo_nanfang_shenyepai_desc: "The fertile Egyptian Delta holds some of the richest lands in the world, fought over for generations. Before slave tyrants, Mamluks, Saladin, and lesser conquerors, Egypt was harmoniously ruled by the Fatimids, who claimed descent from the Prophet Muhammad. Conquer this land and bring it under the rule of our benevolent monarch."
  Saudi_Arabia_yisilanguo_feizhou_zhi_jiao: "Horn of Africa"
  Saudi_Arabia_yisilanguo_feizhou_zhi_jiao_desc: "Our Muslim brothers in the Horn of Africa face the prospect of conquest by the pagan Christians entrenched in Ethiopia, or even worse, by the primitive polytheists of the Oromia region. We must advance to ensure Muslim control of this region."
  Saudi_Arabia_yisilanguo_zhijie_aisaiebiya: "Dismember Ethiopia"
  Saudi_Arabia_yisilanguo_zhijie_aisaiebiya_desc: "As we rapidly become the dominant power in the region, now is the time to accept our role. All must unite under the banner of God or face our wrath."
  Saudi_Arabia_yisilanguo_sangjibaer_de_tongbao: "The Flame of Zanzibar"
  Saudi_Arabia_yisilanguo_sangjibaer_de_tongbao_desc: "The world order is changing as the old empires gradually crumble. The only way to provide a safe haven for our people in this new order is through a campaign of conquest, demonstrating to the world our ability to overcome any obstacle. Therefore, we will consolidate our rule over East Africa and demonstrate the power of [SAU.GetName] to the world."
  Saudi_Arabia_yisilanguo_tongyi_magelibu: "Conquer the Maghreb"
  Saudi_Arabia_yisilanguo_tongyi_magelibu_desc: "The name 'Maghreb' comes from Arabic and literally means West. Traditionally, this name refers to much of North and Northwest Africa. Let us bring them under the Caliphate and advance on Al-Andalus."
  Saudi_Arabia_yisilanguo_tongyi_magelibu_tt: "Grant the §YConquer§! war goal against all nations occupying areas claimed by this focus."
  Saudi_Arabia_yisilanguo_chongjian_andalusi: "Restore Al-Andalus."
  Saudi_Arabia_yisilanguo_chongjian_andalusi_desc: "For nearly eight centuries, southern Iberia, known to the Islamic world as 'Andalusia,' stood as a beacon of prosperity throughout the Mediterranean. It may seem a lofty goal, but restoring this sacred region will etch our name into history forever. Convert the people of our land to the true faith and once again proclaim our majesty! "
  Saudi_Arabia_yisilangu_kuayue_sahala: "Invasion of Mali"
  Saudi_Arabia_yisilangu_kuayue_sahala_desc: "The time has come to conquer West Africa. Timbuktu is a wealthy city, a gateway for trade between West Africa and the world. We must capture it."
  Saudi_Arabia_yisilanguo_wei_tuerzhanyi_fuchou: "Revenge for the Battle of Tours"
  Saudi_Arabia_yisilanguo_wei_tuerzhanyi_fuchou_desc: "The Battle of Tours in 732 undoubtedly halted the western expansion of Islamic power into Europe. Today, the Caliph will once again follow the path of his Muslim predecessors in France, this time with the power of God supreme. "
  Saudi_Arabia_yisilanguo_ranshao_shengcheng: "The Burning Holy City"
  Saudi_Arabia_yisilanguo_ranshao_shengcheng_desc: "The Vatican's Treasury, one of the world's greatest treasures, lies beneath our very noses. While it would be a daring adventure, we know in our hearts that we must plunder the Vatican's treasury."
  Saudi_Arabia_yisilanguo_abasi_zhili: "Abbasid Might"
  Saudi_Arabia_yisilanguo_abasi_zhili_desc: "Arabia was once an integral part of the Abbasid Caliphate, which ruled the Muslim world with glory and power. With the arrival of the invaders, the Caliphate faced internal struggles, and the Abbasid dynasty as a political entity ceased to exist. Now is the time to inherit their legacy and unite these territories under our banner."
  Saudi_Arabia_yisilanguo_abasi_zhili_tt: "Unlocks a series of decisions that allow us to integrate the former §YAbbasid§! territories into our nation. "
  Saudi_Arabia_yisilanguo_wumaiye_zhiguang: "The Legacy of the Umayyads"
  Saudi_Arabia_yisilanguo_wumaiye_zhiguang_desc: "Finally, the holy cities of Baghdad, Mecca, and Jerusalem are united in one nation. The heartland of Arabia is now in our hands, and we can declare ourselves not merely a union of Arabs, but a re-established Caliphate, a homeland for all Islamic peoples and cultures."
  Saudi_Arabia_yisilanguo_wumaiye_zhiguang_tt: "Unlocks a series of decisions that allow us to integrate the former §YUmayyad§! territories into the nation. "
  Saudi_Arabia_yisilanguo_yizhuyiguo: "One Sovereign, One State"
  Saudi_Arabia_yisilanguo_yizhuyiguo_desc: "For a thousand years, the followers of Muhammad have waited; for a thousand years, they have longed for independence and freedom for all Arabs and Muslims; for a thousand years, they have suffered under the oppression of evil empires and armies; after a thousand years, our time has finally arrived..."
  ############################################################################################
  Saudi_Arabia_duoshenjiao_kaitou: "Return to the Past"
  Saudi_Arabia_duoshenjiao_kaitou_desc: "Our ancient faith has been silent for too long. Now is the time to rebuild the sacred image; to forge our glory in the light of Arab polytheism..."
  Saudi_Arabia_duoshenjiao_zuxian_chongbai: "Ancestor Worship"
  Saudi_Arabia_duoshenjiao_zuxian_chongbai_desc: "The Muslim conquests brought nothing but destruction to the Bedouin ancestors. Even our most sacred shrines, where our ancestors were once worshipped, were not spared. We must purify these holy places immediately."
  Saudi_Arabia_duoshenjiao_mengmeishidai: "Lost World"
  Saudi_Arabia_duoshenjiao_mengmeishidai_desc: "Civilization is unnatural, humanity's futile and profane attempt to impose order on an inherently disordered creation. We embrace nature, living according to God's will, wild and free."
  Saudi_Arabia_duoshenjiao_women_tamen: "Us—Them"
  Saudi_Arabia_duoshenjiao_women_tamen_desc: "Anyone who refuses to conform and seeks to be different will be attacked and attacked. Anyone who refuses to make peace and cease their efforts will be met with violence and made to bow their heads. If you do not defend your homeland with force, it will be razed to the ground. If you do not bully others, you will inevitably be bullied...."
  Saudi_Arabia_duoshenjiao_zhongzhi_chengcheng: "United as one"
  Saudi_Arabia_duoshenjiao_zhongzhi_chengcheng_desc: "Now is the time for us to unite as one. External threats are imminent, and only by uniting as one can we survive the storm."
  Saudi_Arabia_duoshenjiao_xinyyang_ziyou: "Freedom of Religion"
  Saudi_Arabia_duoshenjiao_xinyyang_ziyou_desc: "Faith in our ancestors is crumbling under external threats, and we must make it clear to everyone that we are the last bastion of animism. We will defend the rights and freedoms of every animist faith, and all those who share the spirit of Khubair can join us in this fight."
  Saudi_Arabia_duoshenjiao_saomanggongcheng: "Literacy Project"
  Saudi_Arabia_duoshenjiao_saomanggongcheng_desc: "Large-scale literacy programs among the peasant and working-class populations, while granting greater autonomy to universities. We must make this a reality for the sake of our people."
  Saudi_Arabia_duoshenjiao_niangzi_jun: "Women's Guard"
  Saudi_Arabia_duoshenjiao_niangzi_jun_desc: "If our nation needs to be armed to the teeth, excluding half the population is absurd. [SAU.GetAdjective] women also need to be trained to fight for our survival."
  Saudi_Arabia_duoshejiao_ouxiangzhi: "Idols"
  Saudi_Arabia_duoshejiao_ouxiangzhi_desc: "It is not just one faith that unites us, but rather a multitude of faiths that make up the religious ecology of our society. Though claiming to be different and following different paths, some outsiders to our faith system have learned to coexist within our society as if they were one of us."
  Saudi_Arabia_duoshejiao_ouxiangzhi_tt: "Unlocks the §YHonor Ancestors§! decision. Allows us to honor an ancestral spirit for a §Y90-day§! bonus."
  Saudi_Arabia_duoshenjiao_shengli_zhi_late: "Victory of Rath"
  Saudi_Arabia_duoshenjiao_shengli_zhi_late_desc: "The goddess Lat is known as 'the mightiest one' or 'the powerful one'. People prayed to her before battle for protection and victory. Her idol is located in Taif. She was worshipped by all Arabs, including the Quraysh. Her idol was managed for generations by the family of Attab ibn Malik of the Saqif tribe, who built a temple around the open-air Lat idol."
  Saudi_Arabia_duoshenjiao_meili_zhi_ouzha_weinasi: "The Charming Ouzha"
  Saudi_Arabia_duoshenjiao_meili_zhi_ouzha_weinasi_desc: "Ouzha was a fertility goddess. Her idol is found in a ravine called Suqam, located in the Wadi al-Hurad, within the borders of Nahrat-e-Shahamiyah, on the right-hand side of the road from Mecca to Iraq. Ibn Kalbi states: 'Ouzha was the most important idol of the Quraysh tribe. The Quraysh worshipped her and sacrificed animals to her."
  Saudi_Arabia_duoshenjiao_mingyun_mona_ananke: "Mena, the Goddess of Destiny"
  Saudi_Arabia_duoshenjiao_mingyun_mona_ananke_desc: "Mena is the ancient Arabian goddess of destiny. Her idol is located on the coast of the Musharraf region, part of the ancient Wadi Valley, between Mecca and Medina. Aws and Hazraj, as well as the tribes living in Medina, Mecca, and the surrounding areas, worshipped Mena and offered sacrifices to her."
  Saudi_Arabia_duoshenjiao_tonggangongku: "Sharing joys and sorrows"
  Saudi_Arabia_duoshenjiao_tonggangongku_desc: "The pursuit of material gain blinds us to divine truth. Only by living a simple and unpretentious life with all our heart and soul can we achieve spiritual enlightenment."
  Saudi_Arabia_duoshenjiao_jitihua_gonggong_jiaotong: "Collectivized public transportation"
  Saudi_Arabia_duoshenjiao_jitihua_gonggong_jiaotong_desc: "Much of our transportation-related infrastructure is outdated and needs to be replaced to be better utilized. The people best suited to implement these reforms are the workers who operate this infrastructure."
  Saudi_Arabia_duoshenjiao_jiti_nongyehua: "Collectivized Agriculture"
  Saudi_Arabia_duoshenjiao_jiti_nongyehua_desc: "After collectivizing agriculture and introducing new agricultural technologies, we can significantly increase agricultural output and ensure everyone has enough to eat."
  Saudi_Arabia_duoshenjiao_gongren_zizhi: "Worker Self-Government"
  Saudi_Arabia_duoshenjiao_gongren_zizhi_desc: "According to the principle of worker self-government, we allow workers to manage their workplaces to maximize output. This greatly helps to enhance worker autonomy, boost morale, and, as a result, increase overall productivity."
  Saudi_Arabia_duoshenjiao_wanzhong_qingjuhuo: "Ten Thousand People Carrying the Torch"
  Saudi_Arabia_duoshenjiao_wanzhong_qingjuhuo_desc: "Each man is a revolution in himself: without individual courage, the collective will fall before the enemy. Each of us must bear this motto in mind, each of us must work together to hold the torch of freedom high."
  Saudi_Arabia_duoshenjiao_shendi_haibolan: "The enemy is the sea"
  Saudi_Arabia_duoshenjiao_shendi_haibolan_desc: "It is clear that the world cannot tolerate our extraordinary existence. We are facing obstacles on all sides, even enemies on all sides. It is now clear: we have no allies to rely on and must prepare for war against all corrupt and backward national systems."
  Saudi_Arabia_duoshenjiao_guoji_zhiyuan: "International Volunteer Army"
  Saudi_Arabia_duoshenjiao_guoji_zhiyuan_desc: "Though victory has been achieved here, the struggle against oppression must continue. Otherwise, our victory may be only temporary. The sons and daughters of [ROOT.GetName] must be ready to offer aid wherever needed, and the state must do its utmost to support them, by enacting necessary new laws and providing needed weapons and equipment."
  Saudi_Arabia_duoshenjiao_guoji_zhiyuan_tt: "§RMay lead to [JAP.GetFlag] [JAP.GetName] initiating an embargo against [SAU. GetFlag] [SAU. GetName]！§!"
  Saudi_Arabia_duoshenjiao_cunxu_huozhong: "Keeping the Flame Alive"
  Saudi_Arabia_duoshenjiao_cunxu_huozhong_desc: "War weariness is the precursor to collapse. We must remain strong and rekindle the fire within our people that will drive them to their utmost."
  Saudi_Arabia_duoshenjiao_xinshi_zhanlue: "The Way of the Prophet"
  Saudi_Arabia_duoshenjiao_xinshi_zhanlue_desc: "The night sky is our window to the divine realm. The world's great secrets and mysteries are written there, open to all who know how to look."
  Saudi_Arabia_duoshenjiao_gongshe_zhanlue_weiyuanhui: "Secrets"
  Saudi_Arabia_duoshenjiao_gongshe_zhanlue_weiyuanhui_desc: "The great mysteries of the divine are beyond mortal comprehension, but this is no excuse for ignorance. The very existence of these mysteries compels us to seek understanding and comprehend the world around us."
  Saudi_Arabia_duoshenjiao_mingri_huoju_shou: "Torchbearers of Tomorrow"
  Saudi_Arabia_duoshenjiao_mingri_huoju_shou_desc: "Those who contribute to our cause, whether intellectually or militarily, are the pillars of the future. This knowledge serves as a powerful inspiration, and we must make our people aware of the weight of their responsibility."
  Saudi_Arabia_duoshenjiao_wufa_bimian_de_fanpu: "The inevitable backlash"
  Saudi_Arabia_duoshenjiao_wufa_bimian_de_fanpu_desc: "We wish no harm to any soul, any thing, but if our paths are threatened, we will defend them with relentless ferocity."
  Saudi_Arabia_duoshenjiao_zhunbei_bukebimian_zhizhan: "Ash Line"
  Saudi_Arabia_duoshenjiao_zhunbei_bukebimian_zhizhan_desc: "There is no refuge better than the roots of the earth, no fortress stronger than the rising ridges, no pilgrimage more solemn than the hidden paths. From these towering peaks, we gaze upon creation below and feel the true weight of God's gift."
  Saudi_Arabia_duoshenjiao_gonggu_liangwan: "Strengthen the Two Gulfs"
  Saudi_Arabia_duoshenjiao_gonggu_liangwan_desc: "We cannot ignore the possibility of a naval invasion. Strengthening our defenses presents a far more formidable challenge to our enemies than leaving our sea borders open."
  Saudi_Arabia_duoshenjiao_bei_alabo_fangxian: "Northern Arabian Line"
  Saudi_Arabia_duoshenjiao_bei_alabo_fangxian_desc: "The most obvious route of attack against us comes from the north. Northern Arabia's defenses must be strengthened urgently to counter any attack from the Middle East."
  Saudi_Arabia_duoshenjiao_nan_alabo_fangxian: "Southern Situation"
  Saudi_Arabia_duoshenjiao_nan_alabo_fangxian_desc: "Southern Arabia is the first line of defense against enemies across the Indian Ocean. With sufficient fortifications and the scorching desert heat, we can directly withstand any attack from the south."
  Saudi_Arabia_duoshenjiao_gongye_junshihua: "Industrial Militarization"
  Saudi_Arabia_duoshenjiao_gongye_junshihua_desc: "We must encourage the communes to increase their production of military supplies, otherwise our warriors defending our country may be underequipped."
  Saudi_Arabia_duoshenjiao_gongshe_zizu: "Self-reliance"
  Saudi_Arabia_duoshenjiao_gongshe_zizu_desc: "Mortals cannot live up to the full glory of the gods, but by choosing one aspect of divinity to emulate, worship, and dedicate ourselves to, we stand a better chance of approaching divinity than by any other means."
  Saudi_Arabia_duoshenjiao_wuzhuang_qunzhong: "Arming the Masses"
  Saudi_Arabia_duoshenjiao_wuzhuang_qunzhong_desc: "We do not expect to keep our hands free of bloodshed. All must learn to wield weapons for self-defense, so that, if necessary, they can fight for their future."
  Saudi_Arabia_duoshenjiao_wuzhengfu_meiyou_guojie: "Glorious Years"
  Saudi_Arabia_duoshenjiao_wuzhengfu_meiyou_guojie_desc: "If the nations of the world refuse to give us a place, then the only way to achieve peaceful coexistence is to destroy all nations."
  Saudi_Arabia_duoshenjiao_geming_de_zhongzi: "Sowing the Seeds of Revolution"
  Saudi_Arabia_duoshenjiao_geming_de_zhongzi_desc: "Those who share our suffering have long been silenced by their governments. We will provide them with the weapons they need to overthrow their countries from within and join our cause as we defeat and connect with our enemies."
  Saudi_Arabia_duoshenjiao_quanqiu_fangyu_weiyuanhui: "Holy Nature"
  Saudi_Arabia_duoshenjiao_quanqiu_fangyu_weiyuanhui_desc: "The natural world is a divine creation, of which we are merely visitors. We must respect every tree, every animal, and even every patch of land."
  Saudi_Arabia_laxide_cuihui_xila: "Laxide Cuihui Xila"
  Saudi_Arabia_laxide_cuihui_xila_desc: ""

