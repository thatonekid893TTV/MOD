l_english:
  useful-events-quarior-coup.1.t:0 "Attempted coup d'État [FROM.GetRulingIdeology]"
  useful-events-quarior-coup.1.desc:0 "The members of the armed forces [ROOT.GetAdjective] supported by [FROM.GetNameDef] orchestrated a coup against the government of [ROOT.GetLeader]. [ROOT.GetLeader.GetSheHeCap] had to carry out an inspection of the troops when [ROOT.GetLeader.GetSheHe] fell into an ambush and was arrested.\n$tab_news$We are awaiting news of this attempt."
  useful-events-quarior-coup.1.a:0 "Let's hope it works out well."
  useful-events-quarior-coup.2.t:0 "Coup d'État [FROM.FROM.GetRulingIdeology] in [FROM.GetName]"
  useful-events-quarior-coup.2.desc:0 "The members of the armed forces [FROM.GetAdjective] supported by [FROM.FROM.GetNameDef] orchestrated a coup against the government of [FROM.GetLeader]. [FROM.GetLeader.GetSheHeCap] had to carry out an inspection of the troops when [FROM.GetLeader.GetSheHe] fell into an ambush and was arrested.\n\nMeanwhile in [ROOT.Capital.GetCapitalVictoryPointName], the [FROM.FROM.GetRulingIdeology] partisants captured the key infrastructure of the city, including whose government headquarters. Remains of the nation is now under the control of a [FROM.FROM.GetRulingIdeology] government. \n\nThe majority of the people, have simply accepted the authority of their new government."
  useful-events-quarior-coup.2.a:0 "Our new government begins!"
  useful-events-quarior-coup.2.b:0 "The revolution [FROM.FROM.GetRulingIdeology] is spreading!"
  useful-events-quarior-coup.2.c:0 "The [FROM.FROM.GetRulingIdeology] menace is on the march."
  useful-events-quarior-coup.3.t:0 "Coup d'État [ROOT.GetRulingIdeology] in [FROM.GetName] fail"
  useful-events-quarior-coup.3.desc:0 "The attempted coup fail in [FROM.GetName]."
  useful-events-quarior-coup.3.a:0 "Let's force them!"
  useful-events-quarior-coup.3.b:0 "That's shame."