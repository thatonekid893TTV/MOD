 #LIB
# LIB_centrism:0 "Pan-Africanism"
 LIB_centrism_desc:0 "Pan-Africanism is a worldwide movement that aims to encourage and strengthen bonds of solidarity between all people of African descent. Based on a common fate going back to the Atlantic slave trade, the movement extends beyond continental Africans, with a substantial support base among the African diaspora in the Caribbean, Latin America and the United States."
 LIB_fascism_ideology_desc:0 "Americo-Liberian Supremacy is the belief that Liberia should be governed by the descendants of freed African-American settlers, maintaining their dominance over politics and society while asserting cultural superiority and preserving an exclusionary, hierarchical system over indigenous Africans."