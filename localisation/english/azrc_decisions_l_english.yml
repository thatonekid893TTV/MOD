 MMR_LEB_disband_national_pact:0 "The National Pact"
 MMR_LEB_disband_national_pact_desc:0 "The National Pact was an informal agreement upon which the founding fathers of the Lebanese state established Lebanon as a multiconfessional democracy. This system allows for a stable state, but increases sectarian divisions and makes government reform and effectiveness extremely slow. Only the Constitutional Bloc supports this pact, with parliamentary and extra-parliamentary opposition seeking to dismantle it."
