l_english:
 coca_cola_inf:0 "Influence of the Coca-Cola Company"
 coca_cola_inf_desc:0 "Coca-Cola has practically become synonymous with American culture. So much, in fact, that it has even been popular among soldiers fighting in foreign wars. Nowadays, it is worldwide, having headquarters in many Western nations."
 disney_inf:0 "Influence of the Walt Disney Company"
 disney_inf_desc:0 "The Walt Disney Company and its many animations have been infamous worldwide. What's even better is that Walt has been willing to work with the government to make war propoganda in wars."
 ford_inf:0 "Influence of the Ford Motor Company"
 ford_inf_desc:0 "The Ford Motor Company has produced its popular and now worldwide automobiles since the beginning of the century. Henry Ford, leader of the company has also introduced very popular industrial reforms that are now country-wide. That's not to mention how their willingness to collaborate with the government."
