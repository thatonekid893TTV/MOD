l_english:
 
#### FOCUSES
GRE_put_onasis_in_charge:0 "Put Onassis In Charge"
GRE_put_onasis_in_charge_desc:0 "After the death of Eleftherios Venizelos Greece is up in flames. We now need a new, strong and competent leader who will revive this country and lead it to greatness."
GRE_unite_with_our_brothers:0 "Unite With Our Brothers"
GRE_unite_with_our_brothers_desc:0 "After the third Crusade Cyprus was taken from the Byzantines by Richard I, then by the Ottomans and finally the British. After over four centuries its time for us to unite with our Cypriotic brothers and unite all Greeks under one state. For this to happen though the British must accept our proposal. We are at their mercy."
GRE_rejuvinate_the_helenic_navy:0 "Rejuvenate The Hellenic Navy"
GRE_rejuvinate_the_helenic_navy_desc:0 "Greece was known all throughout history for their magnificent navy. But after 400 years of Ottoman occupation, we've yet to recover. its time for us to invest in our navy and dominate anyone who dares to oppose us both on land and sea. Its time for Greece to be recognized as the naval superpower it really is."
GRE_the_new_medeteranian_superpower:0 "The New Mediterranean Superpower"
GRE_the_new_medeteranian_superpower_desc:0 "After having invested so much in our navy its time to announce to the world that the Mediterranean has a new superpower, that being Greece. Its time we stopped being humiliated by our enemies and time to start humiliating them on the high seas!"
GRE_buy_forgein_ships:0 "Buy Foreign Ships"
GRE_buy_forgein_ships_desc:0 "So as to increase both our trading power and our naval power we must first acquire ships and convoys from the major powers. This will cost us a lot, but by doing so Greece will once again be known for their capabilities at sea."
GRE_enact_onassis_plan:0 "Enact The Onassis Plan"
GRE_enact_onassis_plan_desc:0 "Onassis has been thinking of many ways to fix our country's problems. One of which he names the 'Onassis program'. Its a program designed to make Greece a trade-oriented country by making us export more of our resources and invest more in our dockyards. Although we are not certain it will fix all of our problems, it is sure to make us have an international presence and improve our People's lives."
GRE_the_world_trading_centre:0 "The New Wolrd Trading Center"
GRE_the_world_trading_centre_desc:0 "Greece throughout history was known for their trading capabilities. From ancient Athens to the Byzantine empire, trade was one of Greece's main strengths. After such long time, Onassis has decided to proclaim Greece as the new trading center of the world. While this may seem as a bold move, Greece is more than capable to have this role and become one of the most influential countries the world has ever seen."  
GRE_free_the_economy:0 "Free The Economy"
GRE_free_the_economy_desc:0 "Our economy as we speek is under the influence of many major powers. By breaking free we might be able to salvage what remains from our drachma and make it powerful again. This though will be very tough and will take a lot of time"
GRE_invest_in_our_islands:0 "Invest In Our Islands"
GRE_invest_in_our_islands_desc:0 "All these years we have been fighting to unite all Greeks under a state, and through that we have gotten many islands. But, unfortunately, noone has never actually invested in them and developed them. Things are going to change. With our advanced naval power and the changes in our policies its about time we invest in them so we can develop this country and increase our trading efficiency. This won't be cheap" 
GRE_guide_the_peoples_will:0 "Guide The People's Will"
GRE_guide_the_peoples_will_desc:0 "who would have thought that we would have to go to such extent just to keep our citizens safe. While Onassis didn't support this idea at first, he has come to understand that this is the only way to keep Greece safe from outside danger. Lets just hope our plans don't get foiled."
GRE_the_occupation_deal:0 "The Occupation Deal"
GRE_the_occupation_deal_desc:0 "With the greeco-british relations being at an all time high we believe its time to set up a deal from which both will benefit. We shall make deals to decide if they want access through the Bosporus, the Suez or Gibraltar. With their help we shall set up puppet governments. Due to the recent tensions in Europe we believe that this would be the best option for both so that trade wont be interrupted in case of war"   
GRE_secure_acccess_to_the_red_sea:0 "Secure Access To The Red Sea"
GRE_secure_acccess_to_the_red_sea_desc:0 "With Egypt being a vulnerable spot for the British they fear that in case of war it will be overrun very easily. for this reasons they trust that the Suez shall be kept safe in our hands. With the puppet's neutral trading policies all countries will greatly benefit from this and Greece shall finally be recognized as a major power in Europe." 
GRE_neutralize_the_turkish_menace:0 "Neutralize The Turkish Menace"
GRE_neutralize_the_turkish_menace_desc:0 "After many talks with the British it has been finalized. the Turkish straights shall become a protectorate of greece making all Balkans and the soviets breath a sigh of relief. With the puppet's neutral trading policies all countries will greatly benefit from this and Greece shall finally be recognized as a major power in Europe."  
GRE_an_autonomous_gibraltar:0 "An Autonomous Gibraltar"
GRE_an_autonomous_gibraltar_desc:0 "With the high tensions in the Iberian peninsula, the British have decided to give ownership of Gibraltar to us. The French have also offered some land in Africa to keep the Atlantic passageway safe. the British also sent units in Spain to occupy lands which will legally be given to us for protection. With the puppet's trading policies all countries will benefit from this and Greece shall be recognized as a major power!"  
GRE_onassis_the_great:0 "Onassis The Great"
GRE_onassis_the_great_desc:0 "Our great leader Onassis has put in so much work. he has improved Greece economically, finally revived the Hellenic navy from its ashes, made Greece the world's trading center and made Greece a major power by having a puppet control one of the world's most important passageways to the Mediterranean. He has revived the Greek state and he shall forever be remembered as the man who did the unthinkable."  
GRE_enforce_patriarchy:0 "Enforce Patriarchy"
GRE_enforce_patriarchy_desc:0 "All these years Greece has been run by men. Men know how to run this country, why change it? It has worked for us untill now and it will keep working for seemingly forever."
GRE_limited_women_rights:0 "Limited Women's Rights"
GRE_limited_women_rights_desc:0 "These past years women have started to demand more and more rights. It has gotten to a point where the Greek government must take immediate action. By giving them more rights they are more likely to support our government and our great leader. We will give them some basic rights so that the situation doesnt evole into national strikes or even worse."
GRE_gender_equality:0 "Gender equality"
GRE_gender_equality_desc:0 "Women have been oppressed for many years, everyone treating them that they have no say in anything. Only certain countries have allowed some to express themselves freely but thats not good enough. In Greece all women will be equal to all men. Greece was known for being a progressive country and its time to prove it again."
GRE_saudi_arabian_deal:0 "The Saudi Arabian Deal"
GRE_saudi_arabian_deal_desc:0 "Onassis has long thouht of a deal between the greek sate and the Saudi Arabian government. This deal would resul in us investing in Saudi Arabia and developing their inferstructure. This would be very costly but would result in us becoming a major power in the oil department."
GRE_greek_middle_eastern_diplomacy:0 "Greek Middle Eastern Diplomacy"
GRE_greek_middle_eastern_diplomacy_desc:0 "The british havea illegally stolen basically all oil from middle easter countries by unfair trade. We sahll now offer them way better deals in hopes of them letting thier imperial overlords be a thing of the past. Who wouldnt want that?"


#### IDEAS
GRE_our_debt_to_the_brits:0 "Our Debt To The Brits"
GRE_our_debt_to_the_brits_desc:0 "We must repay the Brits for Cyprus at all costs. We need their friendship for future plans."
GRE_medeteranian_superpower:0 "A New Medeterranean Superpower"
GRE_medeteranian_superpower_desc:0 "Its about time for Greece to show the world what it means to be a naval superpower."
GRE_trade_centre:0 "The World's Trading Center"
GRE_trade_centre_desc:0 "Its time for Greece to realize its potential and righfully claim the title of the world's trading center."
GRE_newly_freed_economy:0 "A Newly Freed Economy"
GRE_newly_freed_economy_desc:0 "All majors have taken advantage of us and our economic situation. But its time for it to stop. We freed ourselves from the tyrants but at what cost?"
GRE_newly_freed_economy_2:0 "A Freed Economy"
GRE_newly_freed_economy_2_desc:0 "After almost a year of feeling our decision's consequences, it finally paid off. Greece can now prosper in a free developed new Greek economy."
GRE_guided_democracy:0 "Guided Democracy"
GRE_guided_democracy_desc:0 "After seeing the failures of democracy its about time we left that behind us and just let people think they have a say in this."
GRE_guided_democracy_2:0 "controlled democracy"
GRE_guided_democracy_2_desc:0 "We made it. We've hid this secret for 4 years and after many difficulties we made it. It took a lot to get here but it was all worth to see a stable and thriving Greece."
GRE_onasis_the_great:0 "Onasssis The Great"
GRE_onasis_the_great_desc:0 "This country was in the worst shape it had been in years. Many believed that we would never recover. But Onassis himslef single-handedly save greece and we shall forever honor him."
GRE_questioning_public:0 "Questioning Public"
GRE_questioning_public_desc:0 "The public have started to get suspicius of our plan. Will this even blow over?"
GRE_propaganda_investments:0 "Propaganda Campains"
GRE_propaganda_investments_desc:0 "with the recent document leak the only thing we can do is invest in propaganda and pray people dont find out." 
GRE_appeased_public:0 "Appeased Public"
GRE_appeased_public_desc:0 "After admiting to the public what we had done the only thing they asked for is to re-allow elections."
GRE_leaked_documets_disaster:0 "leaked documents disaster"
GRE_leaked_documets_dissaster_desc:0 "After what happned everyone is on high alert and paranoid. This is of course bringing instability to the nation."
GRE_enforced_patriarchy:0 "Patriarchy"
GRE_enforced_patriarchy_desc:0 "Men have run Greece for so many years, why chnage it?"
GRE_limited_woman_rights:0 "Limited Women's Rights"
GRE_limited_woman_rights_desc:0 "We should just give them what they want so that this situation doesn't get worse."
GRE_complete_gender_equality:0 "Gender Equality"
GRE_complete_gender_equality_desc:0 "Its for Greece to show the rest of the wolrd what humanitarian progress looks like."

#### opinion modddifiers
