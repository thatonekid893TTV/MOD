#### EVENTS
#starting event
onassis.1.t:0 "The Occupation deal"
onassis.1.desc:0 "We want to invite the British government to Athens so that we can properly discuss the proposal Onassis thought of. After sending diplomats to London the British also seem excited about the few details that we mentioned, but we will never know for certain untill they arive here and we settle on an option. We must make our proposal as appealing as possible and get them to support us because without them backing us our efforts will be in vain. Lets hope that our great leader Onassis negotiates for the best option.\n\n\nwhat would that option be choose?"
onassis.1.a:0 "We must secure the passsageway to the red sea"
onassis.1.b:0 "We must free the bosporous and bring balance to the Black Sea"
onassis.1.c:0 "we must make sure the straits for the antlatic won't fall into the wrong hands"

#seuz protectorate
onassis.2.t:0 "The Suez proposal"
onassis.2.desc:0 "After meeting the Greek leader, Onassis, in Athens we have decided that Greece's proposal to guard the Suez was a very smart idea in both terms of trade, supply and strategic location. But the Suez may be too important to just give away to the Greeks like that.\n\n\nwhat should we do?"
onassis.2.a:0 "Its for the greater good of international trade and the safety of our colonies"
onassis.2.b:0 "Are they crazy? Who do they think they are?"

onassis.3.t:0 "The British support us!"
onassis.3.desc:0 "Its finalized! The Brits have decided to offer their support and allow us to set up a puppet government in the Suez Canal and many surrounding areas for further protection. Even though Greeks all throughout the nation thought that this would be in vain, Onassis showed them how he can and will achieve anything for his country. The only thing that remains is finalizing the plan and the British transferring ownership of the lands to our puppet. LONG LIVE GREECE AND LONG LIVE OUR GREAT LEADER ONASSIS!"
onassis.3.a:0 "Hail the British and Onassis!"

onassis.4.t:0 "The British refused"
onassis.4.desc:0 "Its over... The British refused to transfer any lands and called us crazy for even suggesting it. Onassis is very underwhelmed with the British and the entire Greek population is upset with him. This was a very big blow to the Greek's moral, Greece's public image and its pride. Lets hope the future has better plans for us in store."
onassis.4.a:0 "May god punish them and make them loose everything"

#bospori protectorate
onassis.5.t:0 "The Bosporus deal"
onassis.5.desc:0 "The Greek government approached with an enticing deal which gives us the option to support Greece in setting up a puppet government in the Bosporus area for the sake of trade. This would most certainly be a very wise choice because of turkeys unstable government, large debt and interior problems. The only issue is that this may create conflict in the Balkans and we may get drawn into it. This would most certainly be bad for our government's stability and reputation. n\n\nwhat should we do?"
onassis.5.a:0 "The Bosporous was alwasy righful greek claim"
onassis.5.b:0 "We can not let our government get involved in this"

onassis.6.t:0 "The British support us!"
onassis.6.desc:0 "Its finalized! The British have decided to support us in the Bosporous situation. We must now send British and Greek delegates to Ankara and discuss the transfer of all land surrounding the Bosporus to Greece. If accept both us and the British will be able to breath a sigh of relief, if they don't the only remaining option is war." 
onassis.6.a:0 "ONWARDS GREEKS, TO CONSTATINOPLE!"

onassis.7.t:0 "The brits abandoned us"
onassis.7.desc:0 "British delegates have just informed us that the British government has refused to help us at all with our Bosporus situation. its hopeless. Without Britain's help we cant win. The Turkish army is bigger and better in every way. The only thing we can do now is think of Greece's future and leave this dream behind"
onassis.7.a:0 "May god punish them and make them loose everything"

# bospori turkey events
onassis.17.t:0 "The Greeco-British threat"
onassis.17.desc:0 "After many meetings in Athens the Greeks and British have decided to come to Ankara demanding we hand over the Bosporus region. While this might seem outrageous at first sight, what can we really do against them? their combined armed forces and navies will destroy anything we throw at them. Do we even have a say in this?"
onassis.17.a:0 "Imperialism wins again..."
onassis.17.b:0 "If they want the bosporous that bad they can come and take it!"

onassis.18.t:0 "The Bosporous is ours!"
onassis.18.desc:0 "Our delegates have finally come back from turkey and they bring good news! The Turkish government has decided to hand over the Bosporus area, and with that also come our beautiful Constantinople! The Greeks once again win and bring their beautiful city back into their fold. With that also comes the Bosporus strait giving us enormous power over the countries of the Black sea and their trade. From this day onwards, Greece shall be recognized as a Major country in the Mediterranean. LONG LIVE HELAS AND ONASSIS!"
onassis.18.a:0 "Finally, ours again"

onassis.19.t:0 "The Turks refuse"
onassis.19.desc:0 "Our delegates have come back and informed us that the Turkish government has refused to hand over the Bosporus. The only solution that remains is war, right?"
onassis.19.a:0 "Its hopeless"
onassis.19.b:0 "To arms Greeks!"

#gibraltar protectorate
onassis.8.t:0 "A Greek Gibraltar"
onassis.8.desc:0 "The Greek government approached with an enticing deal, offering to protect the strait of Gibraltar by transferring land we own to their puppet. while this may seems as a good deal in doing so we will partly get involved in the Spanish civil war and take other lands from them which could cause further tensions in the region. n\n\nwhat should we do?"
onassis.8.a:0 "Of course we shall support our greek friends"
onassis.8.b:0 "Who do they think they are?"

onassis.9.t:0 "The British support us!"
onassis.9.desc:0 "Its finalized! The British have decided to support us in the Gibraltar deal. They also promised to slightly intervene in the Spanish civil war so that our puppet can have a larger influence in the region. On top of that France also decided to offer lands in the African continent to further strengthen our puppet for the sake of trade. Now the only thing that remains is finalizing the agreement and having the British transfer all the lands to our puppet."
onassis.9.a:0 "The Atlantic is now in Greek hands!"

onassis.10.t:0 "The british abandoned us"
onassis.10.desc:0 "Delegates from Britain came here and informed us of the outcome. Britain decided not to intervene in the Spanish civil war, France was entirely against this puppet and so our plans have failed. Our great leader Onassis is distraught from these news but has decided to move onwards hoping for a brighter future. Today is a sad day for the Greek republic."
onassis.10.a:0 "May it fall into Spanish hands!"

#freed economy 
onassis.11.t:0 "The Greek economic miricale"
onassis.11.desc:0 "Our economic minister came to us and announced that the Greek drachma had increased in value after a year of Onassis' micro management strategies. While even Onassis himself had said that the economy would need many years to recover from what the great powers did to it, by miracle the drachma has been better than it ever was which will allow us to further invest in our nation. While all Greeks believed that freeing our economy would only bring problems, they are now thankful and very grateful praising Onassis as the one and only person who helped this nation when it needed it the most."
onassis.11.a:0 "LONG LIVE ONASSIS AND GREECE"

#RIGGED ELECTIONS 
onassis.12.t:0 "Suspicions among the citizens"
onassis.12.desc:0 "Somehow word got out and people have started to suspect that we are planning to rig the next elections. Onassis is furious with these news and is demanding for a full investigation to be launched so we can find who leaked our plans. At least for the time being most citizens do not suspect a thing and think that all these rumors are false. Lets just hope we catch the rat in time before the situation gets out of hand"
onassis.12.a:0 "Launch the investigation and lets hope the people wont get more suspicius"

onassis.13.t:0 "Questioning public"
onassis.13.desc:0 "News have come to us that even more vital documents surrounding our new guided democracy have leaked. Our investigation was to no avail. The person behind this is suspected to be very close to Onassis himself or just a high ranking official. We still have no idea what is going on and who is leaking our documents. The only thing that we can do is pray to god no more documents are leaked and that our citizens trust Onassis enough to dismiss these "rumors"."
onassis.13.a:0 "Find that traitor, NOW"

onassis.14.t:0 "leaked classified documents"
onassis.14.desc:0 "Good news and bad news. Good news is that we found the filthy rat leaking all our documents, bad news is that he is about to leak documents that can destroy our whole government. We must do something this instant. If we don't do something in time the nation itself will erupt into chaos and maybe even a civil war. Onassis is at the brink of fainting and all of our government officials are praying for their lives. What are we even supposed to do?"
onassis.14.a:0 "kill him, burn the evidence and invest in propaganda!"
onassis.14.b:0 "We must answer to our failures"

onassis.15.t:0 "The day has come"
onassis.15.desc:0 "After 4 years of trying to hide the fact that we installed rigged elections to trick our citizens, during elections while a vast majority voted for other candidates who would have ruined this country, Our great leader Onassis stayed in charge. Even if the election hadn't been rigged, he would have still come first, but this move secured his place as the one man to rule Greece and make it great again. He will be remembered in history as the person who against all odds, made Greece an economic powerhouse, with a thriving economy and a navy stronger than any other. LONG LIVE ONASSIS!" 
onassis.15.a:0 "Greece shall rise again"

onassis.16.t:0 "The elections scandal"
onassis.16.desc:0 "In the past 100 years Greece's government has been changing back and forth constantly. As we saw ourselves in the 1936 elections, Greece has reached its breaking point. We can no longer let the people choose who they want to be ruled by nor let monarchs do whatever they please. Its time we set up rigged elections, unknown to the public. Doing so will result in a stable nation which will not be crippled by anyone. With Onassis in charge, we hope that no suspicions will rise for many years because of his investments in the country, but there is always the possibility that word gets out which will put Onassis' government in great danger."
onassis.16.a:0 "May he reing supreme and make greece great again!"

#SAUDI ARABIA
onassis.20.t:0 "Onassis Wants to propose a Deal"
onassis.20.desc:0 "The Greek government approached us wanting to invest in our country. In return they will get all oil they extract in Damman."
onassis.20.a:0 "This sounds like an excelent proposal"
onassis.20.b:0 "who do they think they are"

onassis.21.t:0 "Saudi Arabia agrees!"
onassis.21.desc:0 "The Saudi government agreed our proposal! Now its time for Greece to invest in them and get all oil we find. This will make Greece a major player in the oil department and make us the dominant oil player in the Balkans. This will make sure Greece never falls in massive debt nor be abused by forgein powers ever again."
onassis.21.a:0 "Its about time Greece became the investore"

onassis.22.t:0 "Saudi Arabia refuses"
onassis.22.desc:0 "Oh well, we wouldn't have found any oil there anyways"
onassis.22.a:0 "May they be damned"

onassis.23.t:0 "Completion of investments"
onassis.23.desc:0 "After a month of investing in the bare desert, we've quite litteraly struck oil! The amount we found was much larger than we had orginally thought, even the Saudi Arabian government was in shock. Now, with this newly acquired oil we will be able to dominate the Balkans and finally be concidered a major power in Europe."
onassis.23.a:0 "Onwards Greeks, its finally our time to shine!"

onassis.24.t:0 "The USA is furious"
onassis.24.desc:0 "After the USA heard of our deal with Saudi Arabia, they warned us that if we didnt back off, they would take immediateaction. Well after almost half a year, they came to us with a proposal. We either pay a fine, retreat from the oil fields and give them back to Saudi Arabia or they will declare war to free it themselves. n\n\nwhat will we do?"
onassis.24.a:0 "We will repay them in other ways"
onassis.24.b:0 "Alright, we will pay the fine"
onassis.24.c:0 "We should better retreat"
onassis.24.d:0 "If they want us to retreat then they will have to do it themselves!"

#MIDDLE EAST
onassis.25.t:0 "The Greek oil deal"
onassis.25.desc:0 "Greek diplomats have come to our country to propose a deal. They offer to buy our oil at a much higher price, letting us break free from our imperial overlords. This tho may put our government at risk of tensions with the UK. n\n\nwhat should we do?"
onassis.25.a:0 "Cherrs to pur new greek pals!"
onassis.25.b:0 "Better stay out of this"

onassis.26.t:0 "[FROM.GetName] accepts!"
onassis.26.desc:0 "[FROM.GetName] has accepted our proposal! Now both they will be freed from the Britsh and greece shall finally have a spot in the major powers of Europe. By this deal we show to the rest of Europe that now Greece has supremacy in the Middle East and that they should not try to mess with us."
onassis.26.a:0 "Excelent news!"

onassis.27.t:0 "[FROM.GetName] refuses!"
onassis.27.desc:0 "[FROM.GetName] has decided not to take part in the deal we propsed. While we find it insane, we can not affect their final decision. We will find better partners elsewhere."
onassis.27.a:0 "There is nothing we can do"

onassis.28.t:0 "The UK protests"
onassis.28.desc:0 "Today, early in the morning Onassis received a letter by the Government of the UK. Since Britain had formed spheres of interest in the area, they demand we pay a big fine for this action. Our only choice is to accept, or else we will face war"
onassis.28.a:0 "We will pay at once"
onassis.28.b:0 "We will slowly pay the brits"
onassis.28.d:0 "If they want the oil, they must come and take it"
#DECISIONS
illegally_annex_puppet:0 "Illegal Annexation"
illegally_annex_the_bosphorus_protectorate:0 "Illegally annex the Bosporus Protectorate"
illegally_annex_the_sue_protectorate:0 "Illegally annex the Suez Protectorate"
illegally_annex_the_gib_protectorate:0 "Illegally annex the Gibraltar Protectorate"
