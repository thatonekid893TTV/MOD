l_english:
  ##################################
  ### 圣地沦陷 ###
  ##################################
  SAU_teshu_shijian.1.t: "The Holy Land has fallen!"
  SAU_teshu_shijian.1.desc: "This is a national disaster. Our proud Holy Land has been occupied by the enemy! This will undoubtedly shake the [SAU.GetAdjective] people's confidence in our war effort and may even spark public opinion in favor of peace. This turn of events has, to say the least, disappointed a considerable portion of the public, who are searching for anyone to blame. We must take the initiative and drive the enemy out of [SAU.GetAdjective]!"
  SAU_teshu_shijian.1.a: "This is terrible!"
  SAU_teshu_shijian.2.t: "The Holy Land has been liberated!"
  SAU_teshu_shijian.2.desc: "The battle for the Holy Land is over, and the last enemy resistance has been crushed. Having completely eliminated the enemy, jubilant crowds filled the streets to welcome the liberators from [SAU.GetAdjective].\n\nNow, at last, there is hope that the enemy can be driven out of [SAU.GetAdjective], and the enemy occupation is about to end. Freedom has finally returned to [SAU.GetAdjective]!"
  SAU_teshu_shijian.2.a: "Long live Allah!"
  SAU_teshu_shijian.3.t: "Death of King Fuad I"
  SAU_teshu_shijian.3.desc: "[EGY.GetAdjective] King Fuad I has passed away. A symbol of national stability, he established the principle of equality before the law and granted legislative power to the king, the upper house, and the lower house. His regime continued the system of the dynasty of Muhammad Ali and rallied the hearts of the [EGY.GetAdjective] people. Grieving citizens took to the streets to express their gratitude and support for the deceased king.\n\nThe nation hopes that the old king's only heir, Muhammad Farouk, will serve as a similarly solid and reliable pillar of support for the people of [EGY.GetAdjective]. The prince will soon be crowned King Farouk I—long live, long live, long live!"
  SAU_teshu_shijian.3.a: "The End of an Era"
  SAU_teshu_shijian.4.t: "King Ibn Saud has been assassinated"
  SAU_teshu_shijian.4.desc: "A few hours ago, as King Ibn Saud was leaving his eastern region after completing his inspection tour, a man quickly approached the Tsar, drew his weapon, and shot him multiple times. Although the man was subsequently killed by his guards, King Ibn Saud tragically died minutes later, along with the assassin."
  SAU_teshu_shijian.4.a: "Oh my..."
  SAU_teshu_shijian.10.t: "The Return of [797.GetName]"
  SAU_teshu_shijian.10.desc: "[797.GetName] has returned to [ROOT.GetAdjective] power! Islam has once again risen to become the world's dominant power. With the rise of the Ottoman Caliphate, cultural and technological advancements are flourishing in Muslim nations."
  SAU_teshu_shijian.10.a: "We are living in the Third Golden Age of Islam, truly."
  SAU_teshu_shijian.11.t: "The Burning of Rome"
  SAU_teshu_shijian.11.desc: "At dawn this morning, [SAU.GetAdjective] troops rolled through hastily erected fences along the streets of Rome and unloaded groups of crusader warriors in the Forum Maggiore. Through the billowing smoke from the raging fires, [SAU.GetAdjective] crusader warriors could be seen storming St. Peter's Basilica. Rome had been captured, though it lay in a blazing ruin."
  SAU_teshu_shijian.11.a: "The world is burning."
  SAU_teshu_shijian.12.t: "$karim_khakimov$ has been accused of treason."
  SAU_teshu_shijian.12.desc: "Following an anonymous tip, the NKVD immediately arrested $karim_khakimov$ on charges of espionage, sabotage, and conspiracy to commit treason. Despite his protestations of innocence, investigators were confident they would have a case against him within weeks. He would either confess under torture or be silenced by the testimony of others. In either case, the combined sentence would be death or life imprisonment."
  SAU_teshu_shijian.12.a: "This threat must be ruthlessly eliminated."
  SAU_teshu_shijian.12.b: "We cannot convict without amassing sufficient evidence!"
  SAU_teshu_shijian.13.t: "[SOV.GetAdjective] prepares to execute $karim_khakimov$."
  SAU_teshu_shijian.13.desc: "According to information provided by relevant sources, the [SOV.GetAdjective] has imprisoned $karim_khakimov$ today on charges of espionage and is preparing to execute him. The [ROOT.GetLeader] King is furious about this, stating that $karim_khakimov$ is both an outstanding diplomat and a close friend of the King. For $karim_khakimov$, espionage is simply out of the question. We strongly protest this treatment."
  SAU_teshu_shijian.13.a: "What a joke!"
  SAU_teshu_shijian.14.t: "[SAU.GetAdjective] Diplomatic Protest"
  SAU_teshu_shijian.14.desc: "Recently, the [SAU.GetAdjective] Foreign Minister strongly protested our handling of $karim_khakimov$, stating that if we execute $karim_khakimov$, we will sever diplomatic relations. He also stated that the [SAU.GetLeader] King personally guarantees that $karim_khakimov$ is incapable of committing such a crime. Perhaps we should consider how to proceed...?"
  SAU_teshu_shijian.14.a: "Doesn't this prove his espionage crimes?"
  SAU_teshu_shijian.14.b: "Perhaps we should consider the situation in the Middle East..."
  SAU_teshu_shijian.15.t: "$karim_khakimov$ was executed by [SOV.GetAdjective]"
  SAU_teshu_shijian.15.desc: "Recently, our ambassador in [SOV.GetAdjective] received news that $karim_khakimov$ He "confessed" to his crimes of attempting to overthrow the regime and assassinate Soviet leaders, with the ultimate goal of restoring capitalism in the Soviet Union. Now, $karim_khakimov$ and fourteen of his accomplices have been executed.
  SAU_teshu_shijian.15.a: "No, my dear friend..."
  SAU_hajimofu_bei_chujue_flag: "Khakimov has been executed."
  SAU_teshu_shijian.16.t: "$TUR_said_i_nursi$ rescue was successful"
  SAU_teshu_shijian.16.desc: "Information from local intelligence personnel in [797.GetName] indicates that the rescue operation was a complete success. After infiltrating, the commandos successfully took control of the prison factory and killed the guards.\n\nAfter the rescue, the team evacuated smoothly."
  SAU_teshu_shijian.16.a: "The brave will prevail!"
  wtt_news.64.t: "Rise of [From.GetNameDef]"
  wtt_news.64.desc: "The [From.GetOldAdjective] military advance seems utterly unstoppable, and the idea that many sneered at in recent years - the creation of a new Roman Empire - now seems entirely within the [SAU.GetNameDef] grasp. Most continental European powers that could oppose them have been virtually eliminated, leaving the [SAU.GetNameDef] free to enforce their will upon the conquered peoples.\n\nIn addition to beginning integration of what they have already begun referring to as "reconquered Roman Territories", the [SAU.GetNameDef] government has now announced the rebirth of the Roman Empire, renaming the nation to '[From.GetNameDef]'."
  wtt_news.64.a: "Roma Invicta!"
  wtt_news.64.b: "They cannot be serious!"
  ##################################
  ### 军事 ###
  ##################################
  SAU_ciagou_maizhuangbei.11.t: "[FROM.GetAdjective] Naval Procurement"
  SAU_ciagou_maizhuangbei.11.desc: "[FROM.GetNameDefCap] has made us a proposal to purchase some of our decommissioned capital ships. The assets they are interested in are no longer in service due to their age and lack of modern equipment. However, by selling these assets to [FROM.GetNameDef], we could exacerbate the already worsening naval arms race in the region."
  SAU_ciagou_maizhuangbei.11.a: "A Mutually Beneficial Agreement"
  SAU_ciagou_maizhuangbei.11.b: "We cannot sell any naval assets"
  SAU_ciagou_maizhuangbei.12.t: "[FROM.GetNameDefCap] agrees to the dreadnought procurement"
  SAU_ciagou_maizhuangbei.12.desc: "[FROM.GetAdjective] diplomats and naval personnel have informed us that they will sell the decommissioned dreadnoughts we proposed purchasing. This will allow us to rapidly expand our naval power and maintain our lead over our neighbors."
  SAU_ciagou_maizhuangbei.12.a: "Great news!"
  SAU_ciagou_maizhuangbei.13.t: "[FROM.GetNameDefCap] rejects dreadnought purchase."
  SAU_ciagou_maizhuangbei.13.desc: "[FROM.GetAdjective] diplomats have informed us that they are unwilling to sell the decommissioned dreadnoughts we proposed purchasing. It is unclear whether this refusal is due to their own plans for the vessels or a statement of dissatisfaction with our policies."
  SAU_ciagou_maizhuangbei.13.a: "How unfortunate."
  SAU_ciagou_maizhuangbei.1.t: "[FROM.GetAdjective] artillery order."
  SAU_ciagou_maizhuangbei.1.desc: "In order to place an order for [FROM.FROM.GetAdjective] artillery, we must first decide which type of artillery to purchase."
  SAU_ciagou_maizhuangbei.1.a: "Order for conventional artillery."
  SAU_ciagou_maizhuangbei.1.a_tt: "We will purchase §Y100§! §Ytowed artillery§!"
  SAU_ciagou_maizhuangbei.1.b: "Order for anti-tank guns."
  SAU_ciagou_maizhuangbei.1.b_tt: "We will purchase §Y100§! §Ytowed anti-tank guns§!"
  SAU_ciagou_maizhuangbei.2.t: "Order for [FROM.FROM.GetAdjective] military vehicles."
  SAU_ciagou_maizhuangbei.2.desc: "In order to place an order for [FROM.FROM.GetAdjective] military vehicles, we must first decide which type of vehicle to purchase."
  SAU_ciagou_maizhuangbei.2.a: "Order motorized vehicles."
  SAU_ciagou_maizhuangbei.2.a_tt: "We will purchase §Y100§! §YMotorized vehicles§!"
  SAU_ciagou_maizhuangbei.2.b: "Order mechanized vehicles."
  SAU_ciagou_maizhuangbei.2.b_tt: "We will purchase §Y50§! §YMechanized vehicles§!"
  SAU_ciagou_maizhuangbei.2.c: "Order armored vehicles."
  SAU_ciagou_maizhuangbei.2.c_tt: "We will purchase §Y50§! §YArmored vehicles§!"
  SAU_ciagou_maizhuangbei.3.t: "[FROM.FROM.GetAdjective] tank order."
  SAU_ciagou_maizhuangbei.3.desc: "In order to place an order for [FROM.FROM.GetAdjective] tanks, we must first decide which type of tank to purchase."
  SAU_ciagou_maizhuangbei.3.a: "Order light tanks."
  SAU_ciagou_maizhuangbei.3.a_tt: "We will purchase §Y40§! §YLight Tanks§!"
  SAU_ciagou_maizhuangbei.3.b: "Order medium tanks."
  SAU_ciagou_maizhuangbei.3.b_tt: "We will purchase §Y20§! §YMedium Tanks§!"
  SAU_ciagou_maizhuangbei.3.c: "Order heavy tanks."
  SAU_ciagou_maizhuangbei.3.c_tt: "We will purchase §Y10§! §YHeavy Tanks§!"
  SAU_ciagou_maizhuangbei.4.t: "[FROM.FROM.GetAdjective] aircraft order."
  SAU_ciagou_maizhuangbei.4.desc: "In order to place an order for [FROM.FROM.GetAdjective] aircraft, we must first decide which type of aircraft to purchase."
  SAU_ciagou_maizhuangbei.4.a: "Order fighter aircraft."
  SAU_ciagou_maizhuangbei.4.a_tt: "We will purchase §Y40§! §YFighter aircraft§!"
  SAU_ciagou_maizhuangbei.4.b: "Order naval bombers."
  SAU_ciagou_maizhuangbei.4.b_tt: "We will purchase §Y30§! §YNaval bombers§!"
  SAU_ciagou_maizhuangbei.4.c: "Order tactical bombers."
  SAU_ciagou_maizhuangbei.4.c_tt: "We will purchase §Y20§! §YTactical bombers§!"
  SAU_ciagou_maizhuangbei.5.t: "[BUL.GetNameDef] wishes to order [ROOT.GetAdjective] warships."
  SAU_ciagou_maizhuangbei.5.a_tt: "We will be provided with §Y1§! off-map §Ycivilian factories§! as payment for the construction of these ships for the [BUL.GetAdjective]."
  SAU_ciagou_maizhuangbei.6.a_tt: "[FROM.GetNameDef] will construct §Y3 submarines§! for the [ROOT.GetAdjective] Navy."
  SAU_ciagou_maizhuangbei.6.b_tt: "[FROM.GetNameDef] will construct §Y2 destroyers§! for the [ROOT.GetAdjective] Navy."
  SAU_ciagou_maizhuangbei.6.c_tt: "[FROM.GetNameDef] will construct §Y1 light cruiser§! for the [ROOT.GetAdjective] Navy."
  SAU_ciagou_maizhuangbei.5.t: "[From.GetNameDefCap] wishes to order [Root.GetAdjective] warships."
  SAU_ciagou_maizhuangbei.5.desc: "The [From.GetAdjective] government, aware of its navy's weakness, has requested the purchase of [Root.GetAdjective] ships. If we accept, they will provide the materials necessary to accomplish our goals."
  SAU_ciagou_maizhuangbei.5.a: "Both sides stand to gain."
  SAU_ciagou_maizhuangbei.5.a_tt: "Under the terms of [From.GetNameDefCap]'s choice, we will receive §Y1§! off-planet §Ycivilian factories§! in exchange."
  SAU_ciagou_maizhuangbei.5.b: "We are not interested."
  SAU_ciagou_maizhuangbei.6.t: "[From.GetNameDefCap] has agreed to build warships for us."
  SAU_ciagou_maizhuangbei.6.desc: "The [From.GetAdjective] government has agreed to build warships for the [Root.GetAdjective] Navy. They have offered us three options."
  SAU_ciagou_maizhuangbei.6.a: "Purchase submarines."
  SAU_ciagou_maizhuangbei.6.b: "Purchase destroyers."
  SAU_ciagou_maizhuangbei.6.c: "Purchase a light cruiser."
  SAU_ciagou_maizhuangbei.7.t: "[From.GetNameDefCap] has refused to build us warships."
  SAU_ciagou_maizhuangbei.7.desc: "[From.GetNameDefCap] has rejected our proposal to purchase warships for the [From.GetNameDefCap] navy. We must either find other nations willing to sign contracts or focus on building our own naval infrastructure so we don't have to rely on foreign powers to build a powerful [Root.GetAdjective] fleet."
  SAU_ciagou_maizhuangbei.7.a: "We can manage without their help."
  SAU_ciagou_maizhuangbei.8.t: "Shipbuilding completed - submarines."
  SAU_ciagou_maizhuangbei.8.desc: "After nearly a year of construction, the three [FROM.GetAdjective] submarines ordered by our country have recently completed sea trials and are now ready to join the navy. These warships are anchored in [Root.GetAdjective] ports, and their crews are awaiting deployment."
  SAU_ciagou_maizhuangbei.9.t: "Shipbuilding completed - destroyers"
  SAU_ciagou_maizhuangbei.9.desc: "After nearly a year of construction, the two [FROM.GetAdjective] destroyers ordered by our country have recently completed sea trials and are now ready to join the navy. These warships are anchored in [Root.GetAdjective] ports, and their crews are awaiting deployment."
  SAU_ciagou_maizhuangbei.10.t: "Shipbuilding completed - light cruisers"
  SAU_ciagou_maizhuangbei.10.desc: "After nearly a year of construction, our nation's ordered [FROM.GetAdjective] light cruisers have recently completed sea trials and are now ready to join the navy. These ships are anchored in [Root.GetAdjective] port, and their crews await deployment."
      
  ##################################
  ### 经济 ###
  ##################################
  SAU_ameishiyou_kaicai.26.t: "[FROM.GetAdjective] First Five-Year Plan"
  SAU_ameishiyou_kaicai.26.desc: "A new Five-Year Plan outlining how our government will achieve economic growth over the coming years is nearing finalization, but significant disagreements remain over the priorities of development. While there is consensus that heavy industry should be a development goal, heated debate remains over where new industrial capacity should be invested. To break the deadlock, a decision must be made."
  SAU_ameishiyou_kaicai.26.a: "Invest in military manufacturing."
  SAU_ameishiyou_kaicai.26.b: "Deploy overall industrial development."
  SAU_ameishiyou_kaicai.27.t: "[FROM.GetAdjective] Second Five-Year Plan"
  SAU_ameishiyou_kaicai.27.desc: "With the success of the first Five-Year Plan, we should immediately launch a new one to consolidate the gains of previous development and apply the lessons learned to the next four years."
  SAU_ameishiyou_kaicai.27.a: "Continue to invest in the military manufacturing industry."
  SAU_ameishiyou_kaicai.27.b: "Continue to deploy overall industrial development."
  SAU_ameishiyou_kaicai.28.t: "Standard Oil Disposal Plan"
  SAU_ameishiyou_kaicai.28.desc: "With our successful victory in the civil war, a critical issue has arisen. Standard Oil representatives have stated that the former tyrant, Ibn Saud, signed a decades-long mining agreement with the oil company. The important question is how we should treat this agreement..."
  SAU_ameishiyou_kaicai.28.a: "Integrity is paramount."
  SAU_ameishiyou_kaicai.28.b: "The nation's assets belong to the Arabs!"
  ##################################
  ### 阿美石油开采 ###
  ##################################
  SAU_ameishiyou_kaicai.1.t: "Daman No. 1 Oil Well Closed"
  SAU_ameishiyou_kaicai.1.desc: "On April 30, 1935, the decision was made to begin drilling for Daman No. 1 using a tungsten drill rig. The following seven months were a mixture of hope and disappointment. When the well reached a depth of approximately 700 meters, it began to produce a large amount of natural gas and showed signs of oil. However, due to equipment failure, the drillers were forced to stop production and seal the well with cement."
  SAU_ameishiyou_kaicai.1.a: "It's time to check on Well No. 2"
  SAU_ameishiyou_kaicai.2.t: "Daman No. 2 Oil Well Produces Oil"
  SAU_ameishiyou_kaicai.2.desc: "On February 8, 1936, with the closure of Daman No. 1, drilling work on Well No. 2 began. 1936 On May 11, 1936, the drilling team reached a depth of 633 meters, the depth at which oil is found in the Bahrain geological zone. Tests conducted in June 1936 revealed a daily production of 335 barrels of oil."
  SAU_ameishiyou_kaicai.2.a: "A bit disappointing..."
  SAU_ameishiyou_kaicai.3.t: "Daman Well No. 3"
  SAU_ameishiyou_kaicai.3.desc: "Daman Well No. 3 produces no more than 100 barrels of heavy oil per day, and the oil it produces has a water content of 15%."
  SAU_ameishiyou_kaicai.3.a: "Time to check out Well No. 4..."
  SAU_ameishiyou_kaicai.4.t: "Daman Well No. 4"
  SAU_ameishiyou_kaicai.4.desc: "After a period of exploration, the oil company's consultant brought us bad news. Daman 4 oil well is dry, and no oil has been found..."
  SAU_ameishiyou_kaicai.4.a: "Alas..."
  SAU_ameishiyou_kaicai.5.t: "Daman 5 oil well"
  SAU_ameishiyou_kaicai.5.desc: "After a period of exploration, the oil company's consultant brought us bad news. Daman 5 oil well is dry, and no oil has been found..."
  SAU_ameishiyou_kaicai.5.a: "Alas..."
  SAU_ameishiyou_kaicai.6.t: "Daman 6 oil well"
  SAU_ameishiyou_kaicai.6.desc: "After a period of exploration, the oil company's consultant brought us bad news. Daman 6 oil well is dry, and no oil has been found..."
  SAU_ameishiyou_kaicai.6.a: "Alas..."
  SAU_ameishiyou_kaicai.7.t: "Dammam Oil Well No. 7 begins drilling"
  SAU_ameishiyou_kaicai.7.desc: "On December 7, 1936, experts began drilling the No. 7 deep test well. Initially, the drilling process was not successful. Then, on October 16, 1937, at a depth of 1,097 meters, the drillers made their first positive discovery — the diluted drilling mud contained 5.7 liters of oil, along with some natural gas. Unfortunately, on the last day of 1937, the well's control equipment failed to control the well, causing a blowout and the discharge of all liquids and gas. Despite drilling to a depth of 1,382 meters, the drilling team still did not find significant oil."
  SAU_ameishiyou_kaicai.7.a: "Patience..."
  SAU_ameishiyou_kaicai.8.t: "Oil Discovered at Dammam Oil Well No. 7"
  SAU_ameishiyou_kaicai.8.desc: "We've learned that just a few days ago, oil was discovered at Well 7 in [859.GetName]. Aramco, the company that holds the concession rights to this land, reportedly announced the discovery of 'huge oil reserves right beneath our feet,' even claiming that Well 7 may hold the largest reserves in the region. This discovery will not only bring economic and social benefits to [859.GetName], but also benefit [ROOT.GetNameDef] itself. We hope that [ROOT.GetNameDef] can use this as an opportunity to enter the global market and become an influential power in the Middle East."
  SAU_ameishiyou_kaicai.8.a: "Excellent!"
  SAU_ameishiyou_kaicai.9.t: "[859.GetName]'s oil production is increasing."
  SAU_ameishiyou_kaicai.9.desc: "[859.GetName]'s oil production will increase day by day, year by year, until [ROOT.GetNameDef] becomes one of the largest oil exporters in the global market!"
  SAU_ameishiyou_kaicai.9.a: "Excellent!"
  SAU_ameishiyou_kaicai.10.t: "Abu Hadriyya Oil Well"
  SAU_ameishiyou_kaicai.10.desc: "The Abu Hadriya Well is an exploratory oil well in the Kingdom of Saudi Arabia. Drilling began in 1939, 161 kilometers northwest of Dhahran in the Eastern Province. The well reached a depth of 3,000 meters, more than twice the depth of Dammam Well No. 7."
  SAU_ameishiyou_kaicai.10.a: "Excellent!"
  SAU_ameishiyou_kaicai.11.t: "Qatif Field"
  SAU_ameishiyou_kaicai.11.desc: "The Al-Qatif Field is one of the most important and oldest oil fields producing a blend of Arabian light crude oil. The field is located in Qatif County, north of Dhahran, Kingdom of Saudi Arabia. The field was discovered in 1945. Four more Saudi oil wells were drilled in the Qatif area in 1948."
  SAU_ameishiyou_kaicai.11.a: "Excellent!"
  SAU_ameishiyou_kaicai.12.t: "Khurais Oil Field"
  SAU_ameishiyou_kaicai.12.desc: "The Khurais Oil Field is located in the Kingdom of Saudi Arabia, adjacent to the Ghawar Oil Field, the world's largest oil field. Discovered in 1957, Khurais' production was limited, at under 190,000 barrels per day. By 1982, Khurais had increased its production to 300,000 barrels per day by adding facilities to process water-bearing crude oil."
  SAU_ameishiyou_kaicai.12.a: "Excellent!"
  SAU_ameishiyou_kaicai.13.t: "Shebaa Oil Field"
  SAU_ameishiyou_kaicai.13.desc: "The Shaybah Oil Field is one of Saudi Arabia's largest oil fields, located in the central Rub' al Khali Desert. Located 800 kilometers south of Dhahran, the Shaybah Oil Field's history dates back to 1938, when a Saudi Aramco exploration team first visited the Rub' al Khali Desert to explore the possibility of underground oil reservoirs."
  SAU_ameishiyou_kaicai.13.a: "Excellent!"
  SAU_ameishiyou_kaicai.14.t: "Hauta Oil Field"
  SAU_ameishiyou_kaicai.14.desc: "The Hauta Oil Field, discovered in 1989 and located 180 kilometers south of Riyadh, produces 200,000 barrels of high-quality Arabian oil per day, with some oil reaching a density of 49%."
  SAU_ameishiyou_kaicai.14.a: "Excellent!"
  SAU_ameishiyou_kaicai.15.t: "Belli Oil and Gas Field"
  SAU_ameishiyou_kaicai.15.desc: "The Berri oil and gas field is located onshore approximately 80 kilometers northwest of Dammam, Saudi Arabia. Discovered in 1946, it began development in 1967. Eight oil-bearing intervals have been discovered, with estimated proven recoverable reserves of 12.2 billion barrels of crude oil and 101.9 billion cubic meters of natural gas. It is a super-large oil and gas field in Saudi Arabia."
  SAU_ameishiyou_kaicai.15.a: "Excellent!"
  SAU_ameishiyou_kaicai.16.t: "Buqaiq Oil Field"
  SAU_ameishiyou_kaicai.16.desc: "The Abqaiq oil field, located on the east coast of Saudi Arabia, was discovered in 1940 and began development in 1946. Its estimated crude oil reserves are 17 billion barrels, making it a supergiant field. The field is a north-northeast-trending anticline approximately 50 kilometers long. It has three Jurassic oil-producing layers and a deep Permian gas-producing layer, producing 400,000 barrels of oil per day."
  SAU_ameishiyou_kaicai.16.a: "Excellent!"
  SAU_ameishiyou_kaicai.17.t: "Ghawar Oil Field"
  SAU_ameishiyou_kaicai.17.desc: "The Ghawar oil field is located in eastern Saudi Arabia, approximately 100 kilometers from the west coast of the Gulf. Discovered in 1948 and put into production in 1951, it holds 70 billion barrels of recoverable oil, making it the world's largest onshore oil field. The field is a massive, north-south-trending, oil-bearing anticline structure, 250 kilometers long and 25 kilometers wide at its widest point, consisting of eight oil-producing structures. The primary producing strata are carbonate rocks of the Jurassic Arabian Formation D Member. The field accounts for approximately half of Saudi Arabia's total production capacity, producing approximately 5 million barrels per day."
  SAU_ameishiyou_kaicai.17.a: "Great!"
  SAU_ameishiyou_kaicai.18.t: "Detecting offshore oil and gas wells"
  SAU_ameishiyou_kaicai.18.desc: "Theoretically, there should be vast oil reserves in the waters off the Arabian Peninsula. If we can locate these wells, we'll be less dependent on the volatile trade market and become more self-sufficient."
  SAU_ameishiyou_kaicai.18.a: "Let's get started right away."
  SAU_ameishiyou_kaicai.19.t: "Safaniya Oil Field"
  SAU_ameishiyou_kaicai.19.desc: "The Safaniya oil field is located in Saudi Arabia's waters in the Persian Gulf, extending northward into the neutral zone between Saudi Arabia and Kuwait. Discovered in 1951 and put into production in 1957, it holds recoverable reserves of 19 billion barrels of oil and 330 billion cubic meters of natural gas. It was the first offshore oil field discovered in the Middle East and remains the largest offshore field in the world to date."
  SAU_ameishiyou_kaicai.19.a: "Great!"
  SAU_ameishiyou_kaicai.20.t: "Manifa Oil Field"
  SAU_ameishiyou_kaicai.20.desc: "The Manifa oil field is located in northeastern Saudi Arabia, south of the Safaniyah oil field. Discovered in 1957, the field boasted proven recoverable reserves of 17.4 billion barrels in 1998, making it a super-large offshore oil field. The field is a 35-kilometer-long, north-northwest-trending anticline structure running parallel to the coastline. The primary producing strata are Cretaceous, buried at a depth of 2,300 meters. Construction is currently underway and production is expected to begin in 2014."
  SAU_ameishiyou_kaicai.20.a: "Great!"
  SAU_ameishiyou_kaicai.21.t: "Manifa Oil Field"
  SAU_ameishiyou_kaicai.21.desc: "The Manifa oil field is located in northeastern Saudi Arabia, south of the Safaniyah oil field. Discovered in 1957, the field boasted proven recoverable reserves of 17.4 billion barrels in 1998, making it a super-large offshore oil field. The field is a 35-kilometer-long, north-northwest-trending anticline structure running parallel to the coastline. The primary producing strata are Cretaceous, buried at a depth of 2,300 meters. Construction is currently underway and production is expected to begin in 2014."
  SAU_ameishiyou_kaicai.21.a: "Great!"
  SAU_ameishiyou_kaicai.22.t: "Zuluf Oil Field"
  SAU_ameishiyou_kaicai.22.desc: "The Zuluf field is located northeast of the Safaniya offshore field. Discovered in 1965 and put into development in 1973, it is a 30-kilometer-long northeast-trending anticline. It has five oil-bearing intervals, primarily the Albian and Lower Cretaceous. Proven recoverable reserves in 1998 were 10.8 billion barrels. It is a super-large oil and gas field offshore Saudi Arabia, producing 450,000 barrels per day."
  SAU_ameishiyou_kaicai.22.a: "Excellent!"
  SAU_ameishiyou_kaicai.23.t: "[From.GetAdjective] Oil Nationalization"
  SAU_ameishiyou_kaicai.23.desc: "[From.GetLeader] has incited outrageous populist rhetoric against our economic interests in the Middle East, and [From.GetRulingPartyLong] has now passed a bill to nationalize the assets of Standard Oil of California and other international oil companies! Although their parliament has approved this move, international justice demands that the country compensate these companies for their losses. The oil giants also demand that we take action."
  SAU_ameishiyou_kaicai.23.a: "The matter is done. There is nothing that can be done."
  SAU_ameishiyou_kaicai.23.b: "Impose a trade embargo on the [From.GetAdjective] until they repent."
  SAU_ameishiyou_kaicai.23.c: "Options are limited. Armed intervention must be considered."
  SAU_ameishiyou_kaicai.24.t: "[From.GetAdjective] embargo"
  SAU_ameishiyou_kaicai.24.desc: "[From.GetLeader] has decided to accept the oil companies' demands and impose an embargo on our country in response to our nationalization of their oil concessions. [From.GetNameDef] will cease trading resources with our country. We should consider compensating the oil companies or abandoning the existing international order and pursuing opportunities with the enemies of liberal capitalism."
  SAU_ameishiyou_kaicai.24.a: "The Arab people will not support this!"
  SAU_ameishiyou_kaicai.24.b: "Perhaps appropriate compensation would be appropriate."
  SAU_ameishiyou_kaicai.25.t: "[From.GetAdjective] compensation"
  SAU_ameishiyou_kaicai.25.desc: "The [From.GetLeader] government has accepted the demand for compensation from Standard Oil of California to compensate them for the losses they suffered during the nationalization of the oil fields. [From.GetNameDef] will not return any oil concessions, but at least our national prestige and economic interests have been preserved."
  SAU_ameishiyou_kaicai.25.a: "Very well, we can trade on these terms."
  SAU_ameishiyou_kaicai.25.b: "Maintain the embargo. We advocate for a better treaty."


  SAU_mai_shiyou.1.t: "[ROOT.GetAdjective]-[FROM.GetAdjective] Oil Trade"
  SAU_mai_shiyou.1.desc: "A [FROM.GetAdjective] delegation has secretly visited our country, asking if we are willing to accept the sale of their oil resources. This trade agreement could prove to be of great benefit to both of us, as it would ensure the operation of our vehicles and strengthen our military supply chains. If so, we will establish a substantial trade agreement, but what are the chances of angering the nations around us?"
  SAU_mai_shiyou.1.a: "It would be beneficial."
  SAU_mai_shiyou.1.b: "We have enough."
  SAU_mai_shiyou.2.t: "[FROM.GetAdjective] are ready to buy our oil."
  SAU_mai_shiyou.2.desc: "Our trade delegation has returned from [FROM.GetAdjective] with positive results! [FROM.GetAdjective] has signed a proposed trade agreement that will expand our revenue base and create new jobs and employment opportunities."
  SAU_mai_shiyou.2.a: "A great, mutually beneficial decision!"
  SAU_mai_shiyou.3.t: "[FROM.GetAdjective] refuses to buy our oil."
  SAU_mai_shiyou.3.desc: "We have received bad news from [FROM.GetNameDef]. Although [FROM.GetAdjective] harbors no ill will towards us, it has informed us that [FROM.GetNameDef] has no intention of purchasing our oil resources. Officials from that country have been resolute on this issue and have asked us not to propose such proposals again in the near future."
  SAU_mai_shiyou.3.a: "Regrettable, but understandable."
  SAU_mai_shiyou.4.t: "[ENG.GetAdjective] no longer considers our country neutral."
  SAU_mai_shiyou.4.desc: "The situation has taken a turn for the worse. [ENG.GetAdjective] has expressed its disdain for [ROOT.GetAdjective], declaring it will challenge us on the political stage and even on the battlefield."
  SAU_mai_shiyou.4.a: "Our future is uncertain!"
  SAU_mai_shiyou.5.t: "[FROM.GetNameDefCap] offers resource mining rights."
  SAU_mai_shiyou.5.desc: "Today, the [SAU.GetAdjective] government contacted us, offering to offer oil mining rights in $STATE_859$. This area is rich in important resources. Perhaps this offer is worth considering?"
  SAU_mai_shiyou.5.a: "Sounds good."
  SAU_mai_shiyou.5.b: "We don't need it."
  SAU_mai_shiyou.6.t: "[FROM.GetNameDefCap] accepts our trade proposal."
  SAU_mai_shiyou.6.desc: "[FROM.GetNameDefCap] has graciously accepted our oil offer. This will only help grow our vast oil empire."
  SAU_mai_shiyou.6.a: "This deal is a steal!"
  SAU_mai_shiyou.7.t: "[FROM.GetNameDefCap] rejects our trade proposal."
  SAU_mai_shiyou.7.desc: "Regretfully, [FROM.GetNameDef] has rejected our generous [SAU.GetAdjective] oil trade deal. Perhaps we'd better negotiate elsewhere?"
  SAU_mai_shiyou.7.a: "It's their loss!"

  ##################################
  ### 政治线反抗 ###
  ##################################
  SAU_neizhan_fankang.0.t: "Second Arab Liberation War"
  SAU_neizhan_fankang.0.desc: "We are part of the kingdom of the truly oppressed, while the Saudi monarchy is part of the kingdom of the true oppressors and colonizers. The ongoing battle is between these two kingdoms... Our struggle against tyranny is part of a long chain of world revolution that will inevitably lead to the collapse of the imperialist superpowers and the rise of the world of the oppressed."
  SAU_neizhan_fankang.0.a: "Rise up! People who refuse to be slaves!"
  SAU_neizhan_fankang.1.t: "Shia protest government policies"
  SAU_neizhan_fankang.1.desc: "Not long ago, another Shia protest erupted in the country. These protests have mushroomed across the eastern region, protesting Wahhabi interference in their traditional religious affairs. If we make concessions to the Shia in the east, it might provoke Shia in other regions to follow suit. From this perspective, deploying the military to defend our core values might be a better option."
  SAU_neizhan_fankang.1.a: "Drive out these stubborn pests!"
  SAU_neizhan_fankang.2.t: "[FROM.GetAdjective] opposition requests help"
  SAU_neizhan_fankang.2.desc: "Recently, opposition groups in [FROM.GetAdjective] have visited us. They speak of the devastation of their rulers' tyranny and are preparing to take arms against their oppression, hoping we can provide them with weapons to help combat the Wahhabi threat.\n\nThe more active anti-Wahhabi elements within the military are now suggesting that we use this opportunity to arm and send volunteers to aid in this conflict, while maintaining the government's plausible deniability of involvement."
  SAU_neizhan_fankang.2.a: "We will turn a blind eye to the well-equipped volunteers sent to [FROM.GetNonIdeologyName]."
  SAU_neizhan_fankang.2.b: "We cannot interfere."
  SAU_neizhan_fankang.3.t: "[FROM.GetAdjective] refuses to offer aid."
  SAU_neizhan_fankang.3.desc: "Sad news. [FROM.GetAdjective] refuses to send volunteers should civil war break out in our country. It seems that if our glorious revolution turns violent, we will be left alone to face our tyrannical oppressors..." 
  SAU_neizhan_fankang.3.a: "We fight alone..."
  SAU_neizhan_fankang.4.t: "[FROM.GetAdjective] offers aid"
  SAU_neizhan_fankang.4.desc: "The [FROM.GetAdjective] government is reluctant to join our war against the tyrant, but the [FROM.GetAdjective] public is increasingly vocal in its support, and many [FROM.GetAdjective] volunteers have joined our cause. While the number is less than we hoped, it's still helpful against the threat we face."
  SAU_neizhan_fankang.4.a: "At least they're willing to offer a little help. It's better than nothing."
  SAU_neizhan_fankang.5.t: "The opposition is starting a civil war!"
  SAU_neizhan_fankang.6.t: "[FROM.GetNameDef]'s communist influence"
  SAU_neizhan_fankang.6.desc: "We have noticed [FROM.GetAdjective] organizations currently spreading communist ideology in our country. While this seems harmless in itself, some of the propaganda appears quite revolutionary. Reports of workers being encouraged to organize and unite are becoming increasingly frequent. Given recent history, we are unsure whether this is a complex plot by the [FROM.GetAdjective] leadership to integrate us."
  SAU_neizhan_fankang.6.a: "Very disturbing."
  SAU_neizhan_fankang.7.t: "[FROM.GetNameDefCap] invites us to join them."
  SAU_neizhan_fankang.7.desc: "[FROM.GetNameDef] invites us to join their ranks. So far, they have been quite lenient towards us, so we hope this may not be too bad for us."
  SAU_neizhan_fankang.7.a: "For the proletariat!"
  SAU_neizhan_fankang.8.t: "[FROM.GetNameDefCap] demands our withdrawal from the Middle East."
  SAU_neizhan_fankang.8.desc: "Our ambassador to [SAU.GetNameDef] was summoned to the Ministry of Foreign Affairs today and presented with an ultimatum. According to the note handed to him, the [SAU.GetNameDef] government demands our withdrawal from the disputed region of the Middle East.\n\nProposals for a negotiated treaty allowing for the passage of troops and the exemption of certain border controls have been rebuffed by the [SAU.GetNameDef] side. The [SAU.GetAdjective] government expects a response by midnight."
  SAU_neizhan_fankang.8.a: "They will receive a satisfactory response."
  SAU_neizhan_fankang.8.b: "No compromise!"
  SAU_neizhan_fankang.9.t: "[FROM.GetNameDefCap] accepts"
  SAU_neizhan_fankang.9.desc: "The [FROM.GetLeader] government has agreed to our demands and withdrawn from the disputed area. Our forces have moved forward to establish controlled outposts in distant civilized cities."
  SAU_neizhan_fankang.9.a: "They chose wisely."
  SAU_neizhan_fankang.10.t: "[FROM.GetNameDefCap] rejects"
  SAU_neizhan_fankang.10.desc: "[FROM.GetLeader] publicly condemns any such excessive diplomatic attempts. [FROM.GetAdjective] forces are reportedly on high alert and occupying defensible positions along the border."
  SAU_neizhan_fankang.10.a: "We sought peace, but they chose war."
  SAU_neizhan_fankang.10.b: "We cannot fight wars with stones and wood."
  SAU_neizhan_fankang.11.t: "[FROM.GetNameDefCap] condemns colonialism."
  SAU_neizhan_fankang.11.desc: "The newly formed [FROM.GetName] seems to have developed a new sense of morality and purpose, and has begun to take on the responsibility of destroying all other colonial empires. An Italian delegation urges us to abandon our imperialist practices and embrace a future of cooperation and freedom, rather than oppression and conquest."
  SAU_neizhan_fankang.11.a: "It's time to set things right!"
  SAU_neizhan_fankang.11.b: "Have the [FROM.GetAdjective] people lost their minds?!"
  SAU_neizhan_fankang.12.t: "Decolonization of the Middle East"
  SAU_neizhan_fankang.12.desc: "[GetSAUZHONGDONGEventDesc]"
  SAU_neizhan_fankang.12.desc_accepted: "While we condemn colonialism and dedicate ourselves to dismantling the old colonial empires of the Middle East, we are unsure of how to proceed. Given that the existing old colonial powers will steadfastly cling to their old beliefs, we must consider every effort a great success. Liberating even a small nation is a great achievement!"
  SAU_neizhan_fankang.12.desc_rejected: "Our efforts to decolonize the Middle East and bring freedom to the colonized peoples appear to be being ignored. These old colonial powers have explicitly denied any involvement in their colonies and refused to heed decolonization proposals. They must be held accountable!"
  SAU_neizhan_fankang.12.a: "Our mission here has come to an end."
  SAU_neizhan_fankang.12.b: "Take strong measures!"
  SAU_neizhan_fankang.13.t: "Religious traditionalists protest government policies."
  SAU_neizhan_fankang.13.desc: "Tensions between traditionalists and government officials in the north have recently escalated into a new wave of traditionalist protests. These protests have mushroomed across the region, with protesters protesting what they see as an overbearing government interfering in matters they have no right to interfere in. This is absurd; as a government agency, our duty is to govern our citizens. The situation in the north is clearly out of our control. If we make concessions to traditionalists in the north, we risk urging others elsewhere to follow suit. In this regard, deploying the military to defend our core values ​​may be a better option."
  SAU_neizhan_fankang.13.a: "We can make some modest concessions."
  SAU_neizhan_fankang.13.b: "This is a necessary sacrifice."
  SAU_neizhan_fankang_13_tt: "Traditionalists will launch a §Rrebellion§!"
  SAU_neizhan_fankang.14.t: "An ethnic uprising has broken out in Central Asia!"
  SAU_neizhan_fankang.14.desc: "Our fellow Central Asians have declared independence from [SOV.GetAdjective]. [SOV.GetLeader] condemned this as treason and ordered the capture and execution of all rebels. Now, [SOV.GetNameDef] and the Central Asian nations are at war."
  SAU_neizhan_fankang.14.a: "The enemy of my enemy is my friend."
  SAU_neizhan_fankang.15.t: "The [KUR.GetAdjective] peoples of the Middle East have revolted."
  SAU_neizhan_fankang.15.desc: "The [KUR.GetAdjective] peoples have declared independence from [IRQ.GetAdjective]. [IRQ.GetLeader] condemned this as treason and ordered the capture and execution of all rebels. Now, [IRQ.GetNameDef] and [KUR.GetAdjective] peoples are at war."
  SAU_neizhan_fankang.15.a: "The enemy of my enemy is my friend."
  SAU_neizhan_fankang.16.t: "[KUR.GetAdjective] people seeking aid"
  SAU_neizhan_fankang.16.desc: "As our intention to launch an offensive in the Middle East becomes clearer, many [KUR.GetAdjective] people from the region have come to us, hoping to establish their own regimes. They want to fight for us. Should we accept their help?"
  SAU_neizhan_fankang.16.a: "We can use their knowledge of the region."
  SAU_neizhan_fankang.16.b: "Why do we need the help of these [KUR.GetAdjective] people?"
  SAU_neizhan_fankang.17.t: "Indian [PAK.GetAdjective] uprising"
  SAU_neizhan_fankang.17.desc: "[PAK.GetAdjective] declared independence from [RAJ.GetAdjective]. [RAJ.GetLeader] condemned this as treason and ordered the capture and execution of all rebels. Now, [RAJ.GetNameDef] and [PAK.GetAdjective] are at war..."
  SAU_neizhan_fankang.17.a: "The enemy of my enemy is my friend."
  SAU_neizhan_fankang.18.t: "Calling on Arabs"
  SAU_neizhan_fankang.18.desc: "We have just overthrown the tyrant and are still weak in political strength. We urgently need experts and talents to help us build a new republic. It is time to call on all Arabs and let them see a new national independent state."
  SAU_neizhan_fankang.18.a: "Arabs unite!"
  SAU_neizhan_fankang.18.b: "Arabs unite!"
  SAU_waiguo_kangmi_guwen_tt: "Marxists from various Middle Eastern countries will come to support our construction."
  SAU_waiguo_kangmi_guwen_1_tt: "Socialists from various Middle Eastern countries will come one after another to support our construction."
  ##################################
  ### 红线 ###
  ##################################
  SAU_gongchan_shijian.1.t: "Nature Transformation Completed"
  SAU_gongchan_shijian.2.t: "Nature Transformation Successful"
  SAU_gongchan_shijian.3.t: "Nature Transformation A Great Success"
  SAU_gongchan_shijian.1.desc: "As the Nature Transformation construction project continues to advance, the industries supporting this massive undertaking are also growing and developing. Engineers working to provide the necessary building materials for the project now have new insights into industrial development and the construction of factories and shipyards. If we invest in these advances, we can achieve significant progress in these areas in the foreseeable future."
  SAU_gongchan_shijian.1.a: "Excellent"
  SAU_gongchan_shijian.4.t: "[FROM.GetName] Requests Military Advisors"
  SAU_gongchan_shijian.4.desc: "[SAU.GetName]'s leaders, forced to acknowledge the weakness of their military, would like us to send officers to their general staff to teach them the arts of modern warfare."
  SAU_gongchan_shijian.4.a: "A strong [FROM.GetName] will free us up to focus on surrounding areas."
  SAU_gongchan_shijian.4.b: "Our officers will find new uses elsewhere."
  SAU_gongchan_shijian.5.t: "[FROM.GetName] agrees to send officers."
  SAU_gongchan_shijian.5.desc: "For the sake of long-term development, [FROM.GetName] agrees to send some officers to our general staff. We also hope to learn how to utilize these new equipment on the modern battlefield."
  SAU_gongchan_shijian.5.a: "Very good."
  SAU_gongchan_shijian.6.t: "The fate of the Saudi royal family."
  SAU_gongchan_shijian.6.desc: "The idea that one person's worth is greater than another's simply because of their birth sickens us. As the transition of power proceeds, and the brilliance of Buckingham Palace is informally detained, it's time to decide what to do with the royal family. This is not the future of society, and we no longer need a monarchy. It's time to confiscate their assets for the benefit of the people and allow them to live like ordinary people—which they already are."
  SAU_gongchan_shijian.6.a: "Confiscate their assets, and they can work like everyone else."
  SAU_gongchan_shijian.6.b: "Hang them!"
  huangshi_de_mingyun_flag: "Reformed"
  SAU_gongchan_shijian.7.t: "The Establisment of Volkskommissariat [ROOT.GetNonIdeologyName]"
  SAU_gongchan_shijian.7.desc: "Our overlords in [FROM.GetNameDef] have just informed us of a restructuring to our current agreement. In an effort to unify workers all across we will be asked to give them acces to a larger part of our industry to put use towards the greater good of our people. Though we have had no say in this there is no room for us to complain. We knew when they offered their help that this might very well be the price to pay."
  SAU_gongchan_shijian.7.a: "It is in the best interest of our people."
  ##################################
  ### 蓝线 ###
  ##################################
  SAU_lanxian_shijian.1.t: "[FROM.GetNameDefCap] has requested to purchase our trains."
  SAU_lanxian_shijian.1.desc: "[FROM.GetNameDefCap] has requested to purchase our trains and hopes to invest in their railways and trains. If we invest in [FROM.GetNameDefCap] and sell them, we can potentially bring [FROM.GetNameDefCap] into our fold for the foreseeable future."
  SAU_lanxian_shijian.1.a: "We will provide them with assistance."
  SAU_lanxian_shijian.1.b: "That's too much trouble."
  SAU_lanxian_shijian.2.t: "[FROM.GetNameDefCap] has agreed to sell and invest."
  SAU_lanxian_shijian.2.desc: "[FROM.GetNameDefCap] has agreed to invest in our railway renewal program. Our own industrial advisors are delighted to hear this news and have already planned a visit to [FROM.GetNameDef]'s train station and factories."
  SAU_lanxian_shijian.2.a: "A mutually beneficial arrangement!"
  SAU_lanxian_shijian.3.t: "[FROM.GetNameDefCap] refuses to sell."
  SAU_lanxian_shijian.3.desc: "[FROM.GetNameDefCap] has refused to sell its participation in our railway renewal program."
  SAU_lanxian_shijian.3.a: "That's it..."
  ##################################
  ### 灰线 ###
  ##################################
  SAU_zhonglixian.1.t: "[FROM.GetName] is seeking investment."
  SAU_zhonglixian.1.desc: "The [NOR.GetAdjective] government is seeking our help to develop its industry. This presents a great opportunity for us to profit and potentially cultivate them as allies in the future, should war break out."
  SAU_zhonglixian.1.a: "There's nothing wrong with helping future allies."
  SAU_zhonglixian.1.b: "This could be a bit risky."
  SAU_zhonglixian.2.t: "[FROM.GetNameDefCap] intends to invest in our country's development."
  SAU_zhonglixian.2.desc: "Our overtures to the [FROM.GetAdjective] government have been successful, and they have agreed to invest in our economy. This also means closer ties between us and them, and they may even become our allies in the future."
  SAU_zhonglixian.2.a: "Good progress."
  SAU_zhonglixian.3.t: "[FROM.GetName] is not willing to invest in our economy."
  SAU_zhonglixian.3.desc: "We need to develop our industrial capacity and strengthen our national defense to prevent war. Despite our efforts, the [FROM.GetAdjective] authorities are unwilling to assist us in developing our industrial capacity.\n\nWe will bear this in mind."
  SAU_zhonglixian.4.t: "[ROOT.GetNameDef] Civil War"
  SAU_zhonglixian.4.desc: "After a period of rising nationalist sentiment, it appears that the [ROOT.GetAdjective] Muslim Brotherhood has grown tired of waiting for peaceful regime change. After heated discussions, diplomatic avenues appear to have broken down, and armed conflict has ensued."
  SAU_zhonglixian.4.a: "God willing!"
  SAU_zhonglixian.5.t: "[FROM.GetName] requests the dispatch of military advisors."
  SAU_zhonglixian.5.desc: "[SAU.GetName]'s leaders have been forced to admit the weakness of their military, and therefore request that we send some officers to their general staff to teach them the arts of modern warfare."
  SAU_zhonglixian.5.a: "A strong [FROM.GetName] will free us up to focus on surrounding areas."
  SAU_zhonglixian.5.b: "Our officers will find use elsewhere."
  SAU_zhonglixian.6.t: "[FROM.GetName] agrees to send officers."
  SAU_zhonglixian.6.desc: "For the sake of future development, [FROM.GetName] agrees to send some officers to our general staff. We also hope to learn how to utilize these new equipment on the modern battlefield."
  SAU_zhonglixian.6.a: "Excellent."
  SAU_zhonglixian.7.t: "[FROM.GetName] refuses to send officers."
  SAU_zhonglixian.7.desc: "[FROM.GetName] has stated that they are unable to send officers to our General Staff due to their current official duties. However, they have sent us a shipment of additional infantry equipment as a gesture of support."
  SAU_zhonglixian.7.a: "This is better than nothing."
  SAU_zhonglixian.8.t: "[FROM.GetName] seeks investment."
  SAU_zhonglixian.8.desc: "Our East African colonial neighbors, [FROM.GetName], have sent a delegation seeking investment to further develop their economy. This will certainly benefit our industrial sector, but we should ensure we support friendly neighbors, not potential enemies."
  SAU_zhonglixian.8.a: "This is beneficial to both of us."
  SAU_zhonglixian.9.t: "[FROM.GetName] investment is pouring in."
  SAU_zhonglixian.9.desc: "[ITA.GetName] has very kindly accepted our invitation to invest in our economy. Their trust will certainly be rewarded, but more importantly, it will significantly increase our economic growth."
  SAU_zhonglixian.9.a: "Great news!"
  SAU_zhonglixian.10.t: "$IRQ_abd_al_ilah$ has returned home."
  SAU_zhonglixian.10.desc: "After nearly half a century of absence from monarchy, [679.GetName] was nearly overwhelmed by the jubilant crowds as $IRQ_abd_al_ilah$ entered the city this morning. The royal procession, cheered by jubilant onlookers, passed through the streets of [679.GetName] and into the Grand Mosque.\n\nA grand ceremony followed.\n\nThough much of the country lies in ruins, perhaps a new king can unite the nation, heal its wounds, and lead [ROOT.GetNameDef] to a brighter future."
  SAU_zhonglixian.10.a: "Long live $IRQ_abd_al_ilah$!"
  SAU_zhonglixian.11.t: "Hashemite House Unites"
  SAU_zhonglixian.11.desc: "Following the recent dramatic political changes in the Middle East, the [SAU.GetAdjective] Ambassador has submitted an official note stating that the Hashemite House should unite and confront Western colonialism in the face of global tensions. As the old Arabic proverb goes, 'If mosquitoes charge together, even elephants will be conquered.'"
  SAU_zhonglixian.11.a: "We will stand united!"
  SAU_zhonglixian.12.b: "We will never sacrifice freedom for security!"
  SAU_zhonglixian.12.t: "[FROM.GetAdjective] Unity and Cooperation"
  SAU_zhonglixian.12.desc: "Following overnight discussions among the leadership, the [FROM.GetAdjective] government has decided to accept our proposal, agreeing to swear allegiance, and the country's government institutions have been fully integrated."
  SAU_zhonglixian.12.a: "We are one step closer to restoring our birthright."
  SAU_zhonglixian.13.t: "[FROM.GetNameDefCap] Rejects Union."
  SAU_zhonglixian.13.desc: "[FROM.GetNameDefCap] has refused to accept any future reconciliation or agreement with us. When our ambassador arrived at the country's Ministry of Foreign Affairs to discuss the official note he submitted earlier, he was told there was nothing to discuss and was quickly escorted out. The [FROM.GetAdjective] ambassador to our country has declared that while his government wishes to maintain peaceful and friendly relations with our country, the integration of [FROM.GetNameDef] into [SAU.GetLeader] is unacceptable."
  SAU_zhonglixian.13.a: "How unfortunate..."
  SAU_zhonglixian.14.t: "[FROM.GetNameDefCap] offers Federation membership."
  SAU_zhonglixian.14.desc: "[FROM.GetNameDef] diplomats have proposed that we join their Federation. While joining would undoubtedly bring economic and security benefits, we would also have to give up much of our autonomy."
  SAU_zhonglixian.14.a: "Together we are stronger."
  SAU_zhonglixian.14.b: "We will never give up our sovereignty!"
  SAU_zhonglixian.15.t: "[FROM.GetNameDefCap] agrees to join the Federation."
  SAU_zhonglixian.15.desc: "[FROM.GetNameDefCap] has wisely decided to join the Federation. Our civil servants and diplomats are arranging all the necessary arrangements for a hasty integration process."
  SAU_zhonglixian.15.a: "Together we are stronger."
  SAU_zhonglixian.0.t: "[FROM.GetNameDefCap] refuses to join the Federation."
  SAU_zhonglixian.0.desc: "[FROM.GetNameDefCap] has categorically rejected our Federation proposal. They insist they would never be willing to accept such an arrangement due to concerns about the impact on their nation."
  SAU_zhonglixian.0.a: "What a short-sighted bunch..."
  SAU_zhonglixian.16.t: "[FROM.GetNameDefCap] demands [455.GetName]"
  SAU_zhonglixian.16.desc: "The [FROM.GetAdjective] government has purged its military of pro-[GER.GetAdjective] officers, demonstrating its loyalty to us and thereby requesting integration with neighboring [455.GetName]. The existing ties between the two royal families will ease our administrative burden."
  SAU_zhonglixian.16.a: "We should reward them, as long as the locals are okay with it."
  SAU_zhonglixian.16.b: "They are untrustworthy."
  SAU_zhonglixian.17.t: "[FROM.FROM.GetNonIdeologyName] wishes to rule us."
  SAU_zhonglixian.17.desc: "[FROM.FROM.GetNonIdeologyName] is attempting to take over the administration of [ROOT.GetNameDef] and expand its responsibilities within the [FROM.GetAdjective] sphere of influence. If we unite, we will no longer be directly accountable to [FROM.GetAdjective], but we will still lack the means to act independently on the world stage."
  SAU_zhonglixian.17.a: "A welcome change."
  SAU_zhonglixian.17.b: "We are pleased with the status quo."
  SAU_zhonglixian.18.t: "[FROM.GetNameDefCap] agrees to the transfer."
  SAU_zhonglixian.18.desc: "Today is a good day for our nation. We have officially taken over the administration of [455.GetName]. This marks a significant step towards the unification of the Greater Arab World."
  SAU_zhonglixian.18.a: "A time for celebration!"
  SAU_zhonglixian.19.t: "[FROM.GetNameDefCap] refuses to transfer territory."
  SAU_zhonglixian.19.desc: "Due to a number of complex factors, [FROM.GetNameDef] refuses to allow us to take over [455.GetName]. Despite our best efforts to please [FROM.GetAdjective], they seem to despise and distrust us."
  SAU_zhonglixian.19.a: "This is a terrible day for [ROOT.GetNonIdeologyName] and [455.GetName]."
  SAU_zhonglixian.20.t: "[FROM.GetNameDef] government rejects proposal."
  SAU_zhonglixian.20.desc: "[FROM.GetAdjective] government rejects plan to transfer state responsibilities to [SAU.GetNonIdeologyName]. We thought this would please them, but it seems they prefer to live with the demons they perceive."
  SAU_zhonglixian.20.a: "This is truly surprising."
  SAU_zhonglixian.21.t: "[FROM.GetNameDefCap] demands control of [454.GetName]"
  SAU_zhonglixian.21.desc: "The [FROM.GetNameDef] government demands our immediate withdrawal from [PAL.GetName] following recent outbreaks of violence. They believe they are better suited to administer the mandate, while we are harming their fellow Arabs. While withdrawal would benefit us militarily, it would cause widespread diplomatic damage."
  SAU_zhonglixian.21.a: "Arrange a transfer of control, but consult the locals first."
  SAU_zhonglixian.21.b: "They have forgotten their place."
  SAU_zhonglixian.22.t: "[FROM.FROM.GetNonIdeologyName] plans to withdraw."
  SAU_zhonglixian.22.desc: "The [FROM.GetAdjective] government plans to withdraw its forces from [ROOT.GetName] and transfer administration to [SAU.GetNameDef]. Unless we interrupt this process immediately, we will be accepting orders from [SAU.Capital.GetCapitalVictoryPointName] in a few days."
  SAU_zhonglixian.22.a: "The current arrangement is untenable..."
  SAU_zhonglixian.22.b: "We have our own agenda."
  SAU_zhonglixian.23.t: "[ENG.GetNameDefCap] agrees to transfer territory."
  SAU_zhonglixian.23.desc: "The [ENG.GetAdjective] government, recognizing the situation as dire, has agreed to evacuate [454.GetName] and hand it over to us."
  SAU_zhonglixian.23.a: "Today, Arab unity triumphs."
  SAU_zhonglixian.24.t: "[FROM.GetNameDefCap] refuses to transfer territory."
  SAU_zhonglixian.24.desc: "Due to a number of complex factors, [FROM.GetNameDef] refuses to allow us to take control of [454.GetName]. Despite our offer to allow the [ENG.GetAdjective] to peacefully withdraw from the area, they have chosen to continue their bloody and reckless occupation."
  SAU_zhonglixian.24.a: "Today, the Arab world is weeping."
  SAU_zhonglixian.24.b: "This is intolerable. Our cooperation with [FROM.GetNameDefCap] is over."
  SAU_zhonglixian.25.t: "The [FROM.GetNameDef] government has rejected the proposal."
  SAU_zhonglixian.25.desc: "The [FROM.GetAdjective] government has refused to transfer responsibilities to [SAU.GetNonIdeologyName]. We thought they would be willing, but it seems they would rather cling to their evil ways."
  SAU_zhonglixian.25.a: "Running dogs of imperialism."
  SAU_zhonglixian.26.t: "[FROM.GetNameDefCap] demands Syria."
  SAU_zhonglixian.26.desc: "The [FROM.GetNameDef] government has formally requested that we transfer control of Syria to them. They believe that Syria, as an integral part of the Arab world, should be united with [FROM.GetNameDef] under a single government to ensure regional stability and prosperity. While they view their request as a step toward pan-Arab unity, abandoning Syria would significantly weaken our influence in the Middle East. Rejecting their proposal could exacerbate tensions between the two countries and lead to escalation."
  SAU_zhonglixian.26.a: "We don't have much choice."
  SAU_zhonglixian.26.b: "Absolutely not!"
  SAU_zhonglixian.27.t: "[FROM.GetNameDefCap] intends to transfer our control."
  SAU_zhonglixian.27.desc: "In a surprising development, the [FROM.GetNameDef] government has agreed to transfer power over us to [FROM.FROM.GetNameDef]. Many within our government question whether this agreement truly reflects our interests, or whether we are being used as pawns in a larger geopolitical game. Now is the time to decide whether to accept the transfer or firmly oppose it."
  SAU_zhonglixian.27.a: "For the best."
  SAU_zhonglixian.27.b: "The current arrangement suits us well."
  SAU_zhonglixian.28.t: "[FROM.GetNameDefCap] Denies Request."
  SAU_zhonglixian.28.desc: "The [FROM.GetNameDef] government, disregarding our vision for Arab unity and regional stability, has flatly rejected the proposed transfer of Syria. This undermines efforts to integrate the Arab world and deprives the Syrian people of the opportunity to join a stronger, more unified nation. The question now is whether we should continue to pursue diplomatic means or prepare for a military resolution to this dispute."
  SAU_zhonglixian.28.a: "We should not push this issue."
  SAU_zhonglixian.28.b: "We have other means to acquire this land."
  SAU_zhonglixian.29.t: "[FROM.GetNameDefCap] has agreed to our request."
  SAU_zhonglixian.29.desc: "[FROM.GetNameDef]'s agreement to transfer Syria to us marks a major step forward in the unification of the Arab world. This historic agreement strengthens our position as an Arab leader and brings us closer to realizing our vision of a united and prosperous Arab world."
  SAU_zhonglixian.29.a: "Excellent!"
  ##################################
  ### 科技共享 ###
  ##################################
  SAU_teshu_shijian.5.t: "[FROM.GetNameDefCap] proposes technology sharing."
  SAU_teshu_shijian.5.desc: "[FROM.GetNameDefCap] proposes a partnership to learn from each other's scientific expertise. While our scientists largely support increasing the availability of knowledge, the military is wary of leaking information that could ultimately compromise our national security."
  SAU_teshu_shijian.5.a: "Knowledge knows no borders."
  SAU_teshu_shijian.5.b: "We will instead provide them with financial assistance."
  SAU_teshu_shijian.6.t: "[FROM.GetNameDefCap] supports technology exchange."
  SAU_teshu_shijian.6.desc: "[FROM.GetNameDefCap] has agreed to participate in our proposed technology exchange program. Members of our own scientific community are delighted to hear this and are already planning visits to [FROM.GetNameDef] universities and factories."
  SAU_teshu_shijian.6.a: "A mutually beneficial arrangement!"
  ##################################
  ### 互不侵犯条约 ###
  ##################################
  SAU_teshu_shijian.7.t: "[FROM.GetNameDefCap] wishes to sign a non-aggression pact."
  SAU_teshu_shijian.7.desc: "This morning, an envoy from [FROM.Capital.GetCapitalVictoryPointName] arrived at [SOU.Capital.GetCapitalVictoryPointName], conveying [FROM.GetNameDef]'s proposal to sign a non-aggression pact to ensure the security of both nations. Considering [FROM.GetNameDef]'s distance from our southern border, we should carefully consider this matter."
  SAU_teshu_shijian.7.a: "We agree. This is the best option."
  SAU_teshu_shijian.7.b: "We cannot agree."
  SAU_teshu_shijian.8.t: "[SOU.GetNameDefCap] agrees to a non-aggression pact."
  SAU_teshu_shijian.8.desc: "Good news. Our diplomats have returned from [SOU.Capital.GetCapitalVictoryPointName] with news that [SOU.GetNameDef] is willing to sign a non-aggression pact. This will allow us to proceed with our battle plans without fear of [SOU.GetAdjective] interference."
  SAU_teshu_shijian.8.a: "Good News"
  SAU_teshu_shijian.9.t: "[SOU.GetNameDefCap] has rejected our proposal."
  SAU_teshu_shijian.9.desc: "Regretfully, we were unable to convince [SOU.GetNameDef] to sign a non-aggression pact. This means we must be wary of threats from the north as we continue our expansion."
  SAU_teshu_shijian.9.a: "An unfortunate turn..."
  ##################################
  ### 奥斯曼 ###
  ##################################
  SAU_xuancheng_aosiman.1.t: "Love Insights"
  SAU_xuancheng_aosiman.1.desc: "I'm seeking $TUR_durrushehvar_i$'s favor, and a more precise knowledge of her tastes and preferences would be greatly helpful..."
  SAU_xuancheng_aosiman.1.a: "My spies will promptly ascertain this."
  SAU_xuancheng_aosiman.2.t: "Banquet Letter"
  SAU_xuancheng_aosiman.2.desc: "As I prepare to send the banquet letter, I anticipate a relaxing evening in the company of good friends. However, I find myself stumped on how to address $TUR_durrushehvar_i$..."
  SAU_xuancheng_aosiman.2.a: "Time to work the charm!"
  SAU_xuancheng_aosiman.3.t: "Waiting"
  SAU_xuancheng_aosiman.3.desc: "Waiting is always unbearable. The fear of rejection nearly makes me vomit! Finally, $TUR_durrushehvar_i$'s reply arrived in my hands, and I tore off the seal with trembling hands. \n"Your words surprised me, but I admit they were quite good. I will treasure your letter and read it when I feel like it."
  SAU_xuancheng_aosiman.3.a: "Let's see how it goes..."
  SAU_xuancheng_aosiman.4.t: "Social Salon"
  SAU_xuancheng_aosiman.4.desc: "Ms. $TUR_durrushehvar_i$ arrived at the social salon in Hyderabad this morning. Fortunately, she seems excited about the idea of ​​this visit and its potential implications. The actual introductions will begin in two days, and we will get to know each other better." "
  SAU_xuancheng_aosiman.4.a: "Let's see how it goes..."
  SAU_xuancheng_aosiman.5.t: "The next day"
  SAU_xuancheng_aosiman.5.desc: "When morning arrived, [ROOT.GetLeader] arrived at the salon, fully dressed, and eagerly prepared to participate in the banquet. When I arrived at the palace, I spotted $TUR_durrushehvar_i$ among the onlookers, and my heart began to beat. Lady $TUR_durrushehvar_i$ seemed nervous, and all eyes were on her. At least judging by her expression, everything seemed fine."

  SAU_xuancheng_aosiman.5.a: "Let's see how it goes..."
  SAU_xuancheng_aosiman.6.t: "An uncomfortable dance"
  SAU_xuancheng_aosiman.6.desc: "I attended the banquet today just to get closer to $TUR_durrushehvar_i$. The musicians happily struck up a cheerful tune, and the dance began. My eyes searched for the object of my affection, but it was too late... $TUR_durrushehvar_i$ seemed to be dancing with someone else? It seemed she wasn't willing, but $TUR_durrushehvar_i$ was still so kind that she couldn't bear to refuse. \n\n$TUR_durrushehvar_i$ stared at me from across the crowd, as if pleading with me to come to the rescue!"

  SAU_xuancheng_aosiman.6.a: "Gracefully squeezed in between the two"
  SAU_xuancheng_aosiman.7.t: "Literary Taste"
  SAU_xuancheng_aosiman.7.desc: "One sunny afternoon, as I was about to visit the palace, I found $TUR_durrushehvar_i$ reading in the palace courtyard. As I approached, I noticed the book was quite thick. From the look on $TUR_durrushehvar_i$'s face, he didn't seem to like it very much. When $TUR_durrushehvar_i$ noticed me approaching, he put the book down and complained to me about how obscure it was. \n\n$TUR_durrushehvar_i$ then casually asked if I had any better recommendations, which immediately stumped me."
  SAU_xuancheng_aosiman.7.a: "Recommend something you might like."
  SAU_xuancheng_aosiman.8.t: "Singing"
  SAU_xuancheng_aosiman.8.desc: "One evening, I was strolling through the palace gardens. All I wanted to do was sing. Upon hearing my ballad, $TUR_durrushehvar_i$'s cheeks instantly turned as red as pomegranates, but she didn't interrupt me. This was undoubtedly a good sign! "This song... is... really... good..." With that, $TUR_durrushehvar_i$ hurried off. I stood up on trembling legs and watched her go, my heart pounding harder than ever."
  SAU_xuancheng_aosiman.8.a: "Let's see how it goes..."
  SAU_xuancheng_aosiman.9.t: "Encounter"
  SAU_xuancheng_aosiman.9.desc: "I hadn't seen $TUR_durrushehvar_i$ in a while, so I went looking for her. As the sky grew darker, I finally found her wandering alone in her garden. She seemed lost in thought, perhaps thinking about something important, or even waiting for someone. But at that moment, my heart finally settled."
  SAU_xuancheng_aosiman.9.a: "I mustered up the courage to step forward..."
  SAU_xuancheng_aosiman.10.t: "Encounter"
  SAU_xuancheng_aosiman.10.desc: "My worries seemed unnecessary. $TUR_durrushehvar_i$ was delighted to see me. As dusk faded and night emerged, we strolled alone in the garden, discussing education, religion, and the future. I barely remember the details, but $TUR_durrushehvar_i$'s words intoxicated me.\n\nWhen we reached a secluded corner and found a stream, moonlight still shimmering on the water, I realized I truly wanted to love."
  SAU_xuancheng_aosiman.10.a: "Let's see how it goes..."
  SAU_xuancheng_aosiman.11.t: "The End"
  SAU_xuancheng_aosiman.11.desc: "One evening, I strolled through $TUR_durrushehvar_i$'s vast garden. Soon, the crimson dusk gave way to a starry night, and my thoughts drifted far away. Then, as if summoned, $TUR_durrushehvar_i$[owner.GetHerselfHimsel] appeared.\n During our discussion, she finally admitted that she had doubts about her marriage, her future, and the meaning of my pursuing her... I then bluntly assured her that my pursuit had no ulterior motive. I simply hoped she could leave this unhappy marriage behind and pursue her own happiness and fulfillment. It was that simple."

  SAU_xuancheng_aosiman.11.a: "The auspicious time is approaching."

  zuizhong_jieshu_tt: "§G[ROOT.GetLeader] and $TUR_durrushehvar_i$ bonded over the long night, becoming an eternal love.§!"
  SAU_xuancheng_aosiman.12.t: "A New Beginning"
  SAU_xuancheng_aosiman.12.desc: "One morning, we visited $TUR_abdulmejid_ii$. Upon learning of $TUR_durrushehvar_i$'s previous affair with [ROOT.GetLeader], he flew into a rage and firmly opposed this relationship. We needed to do something..."
  SAU_xuancheng_aosiman.12.a: "Your Highness, please listen to me."
  geiyu_buchang_halifa_tt: "We promise to capture [TUR.Capital.GetCapitalVictoryPointName] within a certain timeframe and have $TUR_abdulmejid_ii$ re-crowned as §YCaliph§! in Istanbul. If we fail to do so, we will receive a significant §RNegative Stability§! bonus, and the Ottoman Royalist generals will depart."
  SAU_xuancheng_aosiman.12.b: "If we can't be together, what's the point?"
  gen_gongzhu_siben_tt: "[ROOT.GetLeader] will §Yelope§! with $TUR_durrushehvar_i$ back to [ROOT.Capital.GetCapitalVictoryPointName]. This will severely damage our §Yrelations§! with both the [RAJ.GetAdjective] and [TUR.GetAdjective]. Also, if $TUR_durrushehvar_i$ survives, our legitimacy to the Ottomans will be extremely low. But at least we have found love, a queen of charm and beauty, isn't she..."
  SAU_xuancheng_aosiman.13.t: "Turkey's Response"
  SAU_xuancheng_aosiman.13.desc: "$TUR_durrushehvar_i$ returned with us to [ROOT.Capital.GetCapitalVictoryPointName]. The Turkish side was shocked to learn of this, and sources indicate they are currently discussing countermeasures..."
  SAU_xuancheng_aosiman.13.a: "§Y$TUR_reconfigure_our_foreign_policy$§!"
  SAU_xuancheng_aosiman.13.b: "§Y$TUR_continue_to_prioritise_balkan_integrity$§!"
  SAU_xuancheng_aosiman.14.t: "Claim Ottoman"
  SAU_xuancheng_aosiman.14.desc: "The collapse of the Ottoman Empire once brought us a sigh of relief, but now it seems the threat from Western colonialists is even greater than the old Ottoman Empire. These turbulent times call for more surprising allies. The Rashid family has long maintained exchanges with the Ottoman Empire. Perhaps now is the time for [ROOT.GetNameDefCap] to bear the banner of the Caliphate and let the Ottoman eagle fly over this land once again."
  SAU_xuancheng_aosiman.14.a: "Oh my God... This is incredible..."
  SAU_xuancheng_aosiman.15.t: "§YOttoman Royalists§! Contact"
  SAU_xuancheng_aosiman.15.desc: "We have also established contact with some former Ottoman generals, who offer us an opportunity that could profoundly impact our nation's future. After all, many in the government have privately expressed disappointment and regret over the fall of the Ottoman Sultanate, and are less than proud of their relationships with Ottoman refugees abroad. If we were to reach an agreement with these former Ottoman remnants, we would undoubtedly deal a devastating blow to Atatürk's republic."
  SAU_xuancheng_aosiman.15.a: "We need them."
  SAU_xuancheng_aosiman.15.b: "Let them lie dormant in [TUR.GetNameDefCap] for now."
  aosiman_jiangling_qianfu_tt: "They will rise in rebellion in [TUR.GetNameDefCap] after we complete our focus: §Y$Saudi_Arabia_laxide_muhanmude_de_yichan$§!."
  SAU_xuancheng_aosiman.16.t: "Royal Wedding"
  SAU_xuancheng_aosiman.16.desc: "At a wedding ceremony in [Root.GetLondonBelgrade], before a cheering crowd, the young King [Root.GetLeader] publicly pledged his love and fidelity to $TUR_durrushehvar_i$ through a sacred oath of covenant, witnessing a fairytale romance between two lovers brought together in times of crisis. While this [Root.GetWeddingGoodBad] wedding ceremony did not establish any formal [Root.GetAdjective]-Ottoman alliance, it seemed certain that cooperation between the two nations would not cease."
  SAU_xuancheng_aosiman.16.a: "How romantic!"
  SAU_xuancheng_aosiman.17.t: "[SAU.GetAdjective] Control of [JOR.GetAdjective]"
  SAU_xuancheng_aosiman.17.desc: "This morning, the [SAU.GetAdjective] launched a surprise attack on the border. [JOR.GetAdjective] forces had few troops at the border, and the [SAU.GetAdjective] force entered [JOR.Capital.GetCapitalVictoryPointName] without a trace. In a small ceremony at [JOR.Capital.GetCapitalVictoryPointName], the [JOR.GetAdjective] commander surrendered to the [SAU.GetAdjective] forces. Fighting throughout the area has ceased, and the remaining [JOR.GetAdjective] forces have been taken prisoners. The [ENG.GetAdjective] side expressed great shock and condemnation."
  SAU_xuancheng_aosiman.17.a: "Excellent fight."
  SAU_xuancheng_aosiman.18.t: "The surprise attack was countered."
  SAU_xuancheng_aosiman.18.desc: "This morning, the [SAU.GetAdjective] launched a surprise attack on the border, but the [JOR.GetAdjective] were well prepared. Fierce fighting at several key points halted the [SAU.GetAdjective] advance. To prevent [ENG.GetAdjective] involvement, our commander has ordered the operation to be suspended. Most [SAU.GetAdjective] forces have withdrawn to their original positions, while [JOR.GetAdjective] forces have consolidated their positions."
  SAU_xuancheng_aosiman.18.a: "Asshole!"
  SAU_xuancheng_aosiman.19.t: "A ceasefire in the [JOR.GetAdjective]"
  SAU_xuancheng_aosiman.19.desc: "In [JOR.GetAdjective], the [SAU.GetAdjective] advance has been halted, and [JOR.GetAdjective] forces have managed to establish a defensive line. Unless a coordinated offensive is launched, the local [SAU.GetAdjective] forces are unable to repel the enemy. Both sides have dug in trenches, and a ceasefire has been agreed to through [ENG.GetAdjective] mediation, with the [JOR.GetAdjective] government retaining control of key locations in the region."
  SAU_xuancheng_aosiman.19.a: "This is the only way..."
  SAU_xuancheng_aosiman.20.t: "[SAU.GetAdjective] provides 'protection'"
  SAU_xuancheng_aosiman.20.desc: "With the recent dramatic political changes in the Middle East, issues in our relations with the [SAU.GetAdjective] have resurfaced. The [SAU.GetAdjective] ambassador has recently submitted an official note formally requesting a statement of our stance toward the Empire. The Rashid dynasty claims that the Middle East belongs to them, as it did to the ancient crown.\n\nHowever, the [SAU.GetLeader] has stated that he would accept a compromise solution whereby he would nominally serve as our head of state, but would not exercise full power."
  SAU_xuancheng_aosiman.20.a: "We will return to the Empire"
  SAU_xuancheng_aosiman.20.b: "We will never give up our freedom for security!"
  SAU_xuancheng_aosiman.21.t: "[FROM.GetAdjective] returns to the Empire"
  SAU_xuancheng_aosiman.21.desc: "Following overnight discussions among the leadership, the [FROM.GetAdjective] government has decided to accept our proposal, agreeing to swear allegiance, and the country's government institutions have been fully integrated."
  SAU_xuancheng_aosiman.21.a: "We are one step closer to restoring our birthright."
  SAU_xuancheng_aosiman.22.t: "[FROM.GetNameDefCap] Rejects Union."
  SAU_xuancheng_aosiman.22.desc: "[FROM.GetNameDefCap] has refused to accept any future reconciliation or agreement with us. When our ambassador arrived at the country's Ministry of Foreign Affairs to discuss the official note he submitted earlier, he was told there was nothing to discuss and was quickly escorted out. The [FROM.GetAdjective] ambassador to our country has declared that while his government wishes to maintain peaceful and friendly relations with our country, the integration of [FROM.GetNameDef] into the [SAU.GetLeader] will never be possible."
  SAU_xuancheng_aosiman.22.a: "How unfortunate..."
  SAU_xuancheng_aosiman.23.t: "[From.GetAdjective] occupied [JOR.GetAdjective]"
  SAU_xuancheng_aosiman.23.desc: "[From.GetLeader] raided [JOR.GetAdjective], the Empire's Middle Eastern protectorate, early the morning of the previous day. According to their premeditated plan, [SAU.GetAdjective] seized control of [JOR.GetAdjective]'s local government and administrative agencies. [SAU.GetAdjective] encountered no effective resistance throughout [JOR.GetAdjective] territory. The Council is deliberating on how to proceed."
  SAU_xuancheng_aosiman.23.a: "The matter is settled. Nothing can be done about it."
  SAU_xuancheng_aosiman.23.b: "Impose a trade embargo on [From.GetAdjective] until it repents."
  SAU_xuancheng_aosiman.23.c: "Options are limited, and armed intervention must be considered."
  SAU_xuancheng_aosiman.24.t: "[From.GetAdjective] Embargo"
  SAU_xuancheng_aosiman.24.desc: "The [From.GetLeader] Council has decided to impose an embargo on our country in response to our sudden occupation of [JOR.GetAdjective]. [From.GetNameDef] will cease trading resources with our country. We should consider abandoning the existing international order and pursuing opportunities with forces hostile to liberal capitalism."
  SAU_xuancheng_aosiman.24.a: "[ENG.GetAdjective] is nothing but a paper tiger!"
  SAU_xuancheng_aosiman.25.t: "[TUR.GetAdjective] Civil War"
  SAU_xuancheng_aosiman.25.desc: "With the border standoff and Ottoman officers fanning the flames, the threat of civil war in [TUR.GetNameDef] is almost imminent. The officers have already seized control of the most fertile western regions and reportedly have widespread support within their rebel strongholds. And in the east, our Kurdish allies are closing in. The end of Kemal's remnants is nigh."
  SAU_xuancheng_aosiman.25.a: "God is great, we join the holy war!"
  SAU_xuancheng_aosiman.26.t: "[From.GetAdjective] Claims Dobruja"
  SAU_xuancheng_aosiman.26.desc: "Under the current circumstances, the [From.GetAdjective] are demanding the return of Dobruja territory to us, restoring our historical borders.\n\nAs events unfold, they've made it clear that this is a non-negotiable proposition, subject to no negotiation or diplomatic mediation. They take Dobruja, or they go to war for it."
  SAU_xuancheng_aosiman.26.a: "They can go to war if they dare!"
  SAU_xuancheng_aosiman.26.b: "We cannot afford a war with [From.GetNameDef]."
  SAU_xuancheng_aosiman.27.t: "[From.GetNameDefCap] cedes Dobruja."
  SAU_xuancheng_aosiman.27.desc: "Faced with the prospect of war with us, [From.GetNameDef] has agreed to relinquish control of Dobruja and abandon any claims to the region.\n\nAfter years of separation, Dobruja has finally returned to the [ROOT.GetAdjective]."
  SAU_xuancheng_aosiman.27.a: "For [ROOT.GetNameDef] and all [ROOT.GetAdjective] people!"
  SAU_xuancheng_aosiman.28.t: "[From.GetNameDefCap] refuses to cede Dobruja"
  SAU_xuancheng_aosiman.28.desc: "This is a foolish act of diplomacy. The [From.GetLeader], the leader of the [From.GetAdjective], has rejected all [ROOT.GetAdjective] demands! They will not cede the Sudetenland and are effectively challenging us to war, mocking our desire to reclaim our historic territories."
  SAU_xuancheng_aosiman.28.a: "Then war!"
  SAU_xuancheng_aosiman.29.t: "An ultimatum to [ROOT.GetNameDefCap]"
  SAU_xuancheng_aosiman.29.desc: "[SAU.GetNameDefCap] troops have crossed the border and entered the Dobruja region, ostensibly to restore order in the region.\n\n[SAU.GetNameDefCap] has issued us an ultimatum, demanding [ROOT.GetNameDefCap]'s surrender. [ROOT.GetNameDefCap] representatives have refused to accept this resolution and are refusing to budge.\n\nNow we are left alone to face the [SAU.GetNameDefCap], and this war seems to be a foregone conclusion."
  SAU_xuancheng_aosiman.29.a: "Surrender to [SAU.GetNameDefCap]."
  SAU_xuancheng_aosiman.29.b: "...No, we must resist!"
  SAU_xuancheng_aosiman.30.t: "The fate of [FROM.GetNameDefCap]"
  SAU_xuancheng_aosiman.30.desc: "[FROM.GetNameDefCap] has agreed to our proposal and joined our side. After occupying [FROM.GetNameDefCap], we must consider the best way to divide this territory."
  SAU_xuancheng_aosiman.30.a: "Restore the 1540 map."
  SAU_xuancheng_aosiman.31.t: "[FROM.GetNameDefCap]'s resistance"
  SAU_xuancheng_aosiman.31.desc: "Unexpectedly, [FROM.GetNameDefCap] began to fight back and strongly condemned our occupation of their territory. However, their supposedly strongest defensive position was vulnerable to our artillery fire, and [FROM.GetNameDefCap] was already captured."
  SAU_xuancheng_aosiman.31.a: "[FROM.GetNameDefCap] will soon be ours."
  TUR_durrushehvar_i_shi_lingxiu_flag: "I am the leader."
  
  SAU_xuancheng_aosiman.32.t: "The Ottoman royal family suddenly suffered a tragedy!"
  SAU_xuancheng_aosiman.32.desc: "The great Sultanate of [ROOT.GetNameDefCap] is gripped by grief following the tragic news of the passing of His Majesty $TUR_abdulmejid_ii$. His Majesty $TUR_abdulmejid_ii$ and his Royal Highnesses had originally planned to travel from [ROOT.Capital.GetCapitalVictoryPointName] to [797.GetName], but as their plane was approaching the Mediterranean, a storm swept across the region. This disaster caused the royal family's plane to crash into the sea, and their remains have never been recovered, plunging the Ottoman court into a state of panic.\n\nAccording to the laws of succession, His Majesty's eldest daughter, His Majesty, is entitled to the throne. While Her Majesty is a woman of great strength and talent, many conservative members of our religious community may object to a woman being crowned the Ottoman Crown."
  SAU_xuancheng_aosiman.32.a: "Long Live Her Majesty the Sultana!"
  SAU_xuancheng_aosiman.32.b: "The Princess is heartbroken. Prince Rashid will be crowned Caliph!"
  SAU_xuancheng_aosiman.33.t: "The [KUR.GetAdjective] peoples of the Middle East have revolted."
  SAU_xuancheng_aosiman.33.desc: "The [KUR.GetAdjective] peoples have declared independence from the [IRQ.GetAdjective]. The [IRQ.GetLeader] has condemned this as treason and ordered the capture and execution of all rebels. Now, the [IRQ.GetNameDef] and [KUR.GetAdjective] peoples are at war..."
  SAU_xuancheng_aosiman.33.a: "The enemy of my enemy is my friend."
  SAU_xuancheng_aosiman.34.t: "[FROM.GetNameDefCap] demands land."
  SAU_xuancheng_aosiman.34.desc: "The [FROM.GetNameDef] government is demanding we cede our western territories, which are heavily populated by Arabs, claiming this is to protect the region's Arab population. However, this area also contains significant oil infrastructure that could benefit the economy. If we refuse this ultimatum, they will likely attempt to seize the land by force."
  SAU_xuancheng_aosiman.34.a: "We will defend our territory."
  SAU_xuancheng_aosiman.34.b: "This isn't worth the fight."
  SAU_xuancheng_aosiman.35.t: "[FROM.GetNameDefCap] agrees to transfer the territory."
  SAU_xuancheng_aosiman.35.desc: "The [FROM.GetNameDefCap] government has agreed to transfer the territory we requested. While we were prepared to go to war over this, it appears we've won without a fight."
  SAU_xuancheng_aosiman.35.a: "Another victory for the Arab world!"
  SAU_xuancheng_aosiman.36.t: "[FROM.GetNameDefCap] refuses to hand over territory."
  SAU_xuancheng_aosiman.36.desc: "The [FROM.GetNameDefCap] government refuses to hand over the territory we demand. It seems we must rely on our forces if we are to liberate this land from [FROM.GetAdjective] rule."
  SAU_xuancheng_aosiman.36.a: "Then we will take it by force."
  SAU_xuancheng_aosiman.36.b: "They've seen through our bluff."
  SAU_xuancheng_aosiman.37.t: "Tensions with [FROM.GetNameDef] have eased."
  SAU_xuancheng_aosiman.37.desc: "It appears the [FROM.GetAdjective] military has lifted its high alert status on the border. While we are ready to defend our territory, it's a relief to have avoided war for now."
  SAU_xuancheng_aosiman.37.a: "What a relief."
  ##################################
  ### 伊赫万 ###
  ##################################

  SAU_yihewan_beiduyin.2.t: "The Child of Destiny"
  SAU_yihewan_beiduyin.2.desc: "The eldest grandson of the great Ikhwan leader, Sultan bin Bajad al-Awtaibi, was born today. The flame of the Ikhwan remains alive. This is the greatest gift God has bestowed upon us. Long live God! Long live the Ikhwan!"
  SAU_yihewan_beiduyin.2.a: "Allah's Arkbar."
  SAU_yihewan_lingxiu_chusheng_flag: "The Son of Destiny has been born."
  SAU_yihewan_beiduyin.3.t: "The Choice of Leader"
  SAU_yihewan_beiduyin.3.desc: "Following our successful rebellion against the Fallen Ibn Saud, the Ikhwan needs an outstanding and pure leader to preside over the affairs. The Ikhwan is divided on whether to choose a descendant of the great leader or a return to traditional assemblies..."
  SAU_yihewan_beiduyin.3.a: "The Rightful Successor!"
  SAU_yihewan_beiduyin.3.b: "The Teachings of Allah!"
  SAU_yihewan_beiduyin.4.t: "The Return of the Plunder"
  SAU_yihewan_beiduyin.4.desc: "Our soldiers recently launched a series of successful jihad raids against heretics and pagans on the border, inflicting considerable damage to the region. They also secured some supplies."
  SAU_yihewan_beiduyin.4.a: "Very good."
  SAU_yihewan_beiduyin.5.t: "The looting was successful."
  SAU_yihewan_beiduyin.5.desc: "Our soldiers recently launched a series of successful jihad raids against heretics and pagans on the border, inflicting considerable damage to the region. They also secured some of their weapons and ammunition. While the equipment produced there may not be of the highest quality, the quantity is sufficient."
  SAU_yihewan_beiduyin.5.a: "Excellent."
  SAU_yihewan_beiduyin.6.t: "The looting failed."
  SAU_yihewan_beiduyin.6.desc: "This morning, at dawn, our brave soldiers attacked an arsenal in enemy territory. However, the enemy guards seemed well prepared and retaliated, forcing us to retreat without gaining an advantage."
  SAU_yihewan_beiduyin.6.a: "Tsk... they got it easy..."
  SAU_yihewan_beiduyin.7.t: "A great success!"
  SAU_yihewan_beiduyin.7.desc: "Last night, our brave soldiers crossed the border and raided the enemy's armory with lightning speed, seizing a large number of weapons. Our soldiers acted so swiftly that no substantial evidence was left behind, yet the enemy government, furious, still accuses us of planning and carrying out the entire operation. Of course, the shiny, brand-new rifles in our soldiers' hands still raise questions for them..."
  SAU_yihewan_beiduyin.7.a: "A great haul!"
  SAU_yihewan_beiduyin.8.t: "Area under attack"
  SAU_yihewan_beiduyin.8.desc: "Our soldiers at the border recently reported a large fire that broke out in the area last night. The local fire department is still battling the blaze, but they believe it will be under control by the end of the day. However, since the fire initially broke out in the ordnance department's storage area, the factory itself suffered significant damage. Military intelligence has launched an investigation to determine how the fire could have occurred despite such strict security measures. Initial evidence suggests that it was most likely arson."
  SAU_yihewan_beiduyin.8.a: "Damn..."