 ifc_economy:0 "International Financial Commission"
 ifc_economy_desc:0 "The International Financial Commission or I.F.C is a commission established by Italy, France and Britain to enforce our repayment of debt. Germany, Russia and both Austria and Hungary were also members of the I.F.C, but due to their defeat in the Great war they had to withdraw, fortunately, leaving us with less harash terms. Similar to the International Financial Commission of Inquiry founded by Russia, Britain anf France a century ago, it is meant to guide us through our financial crisis. But let's be honest, it is a known secret that the I.F.C controls our financial decisions. Because of this, every person in Greece has been calling it the International Financial Control."  
