 hunda.4.t:0 "The Opposition Steps In"
 hunda.4.desc:0 "A bold statement was made after the fate of the colonels was announced. The leader of the Democratic opposition, who was given all power, asked the council to change their sentence and instead give them life in prison"
 hunda.4.a:0 "Even after everything they have done?"
