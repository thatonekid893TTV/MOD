 macedonia.3.t:0 "The Experiment"
 macedonia.3.d:0 "Alexander has decided that he wants his original wife back, roxana. After nagotiations with the scientist, a dangerous experiment will take place trying to revive her. They will try to replicate the way Alexander and his generals magicaly got revived, but they are not sure if it will succeed"
 macedonia.3.a:0 "Oh Zeus, help us!"
 macedonia.4.t:0 "Experiment - Failed"
 macedonia.4.d:0 "The attemp to revive Roxana has failed! An enormous explosion happened at the secret location of the lab, destroying the surrounding areas. Luckily, no civillians were in the area. Only the scientists in charge of the experiment died. What a disaster! What will the media, and even alexander himself say?"
 macedonia.4.a:0 "ANATHEMA!"
 macedonia_imagine_being_traitor:0 "§RIn exactly 75 days, the generals we hired will stage coups, and fight Alexander in an attemp to claim the Macedonain throne§!"
 macedonia.5.t:0 "Generals Stage Coup"
 macedonia.5.d:0 "The generals have done it. Seeing that Alexander's health is at an all time low, they have staged a coup and decided to attack us. We must crush their rebellion, or we will be forced to lose our empire once again"
 macedonia.5.a:0 "How dare they? After all I have done for them? They would be nothing without me!"
