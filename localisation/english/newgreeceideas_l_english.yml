 alexander.1.t:0 "Royal Marriage"
 alexander.1.d:0 "Alexander the great, in an attemp to make the empire more stable, has decided to host his first royal marriage. We must choose his queen, and organise the marriage"
 alexander.1.a:0 "Prince Elizabeth II of the British Empire will secure our rule over the Empire"
 alexander.1.b:0 "Prince Victoria Louise Of Prussia will lead our army against our moral enemies"
 alexander.1.c:0 "Soultana Dürrüşehvar will help us adopt eastern traditions and please the people"
 alexander.1.e:0 "Hmmmm.... Why not all of the above?" 
 alexander.2.t:0 "Another Royal Marriage"
 alexander.2.d:0 "The people are still not fully happy. We must host another royal marriage, and connect our nation with royal families from all the world"
 alexander.2.a:0 "The Last Romanov will help us solidify our claims over the world"
 alexander.2.b:0 "Berlanti Abdelhamid will lead our army in great victories"
 alexander.2.c:0 "Archduchess Adelheid will lead our navy accross the oceans"
 alexander.2.e:0 "Why not all of them again?"
 alexander.3.t:0 "One Last Royal Marriage"
 alexander.3.d:0 "People have accepted their new ruler, and the royal marriages have help a lot. It is time to host one last marriage"
 alexander.3.a:0 "Queen Theodora will please the people"
 alexander.3.b:0 "Shadia will find new ways to cut corners"
 alexander.3.c:0 "Wilhelmina will help us protect our people"
 alexander.3.e:0 "Hear me out, what about all of the above?"
 
 macedonia.1.t: "Alexander The Great has been spotted in Alexandria"
 macedonia.1.d: "An Alexandrian citizen was walking through the streets of Alexandria Egypt, when he stumbled upon a strange sight. In a small garden near the city center, he saw a man with long curly hair and a regal bearing, standing behind a bush with his back turned. The man appeared to be peeing, and the citizen was taken aback by the audacity of it all. As the citizen approached the bush, he realized with a shock that the man was none other than Alexander the Great, the famed conqueror and ruler of the ancient world. Alexander, for his part, seemed unfazed by the citizen's presence and continued to pee, as if it were the most natural thing in the world. The citizen simply stood there, watching as Alexander finished his business and then walked away, disappearing into the crowded streets of Alexandria."
 macedonia.1.a: "What?"
 macedonia.2.t: "Rumours about Alexander have been confirmed."
 macedonia.2.d: "While Alexander was returning to his grave, after he had peed, he accidentaly woke up his legions, by trying to open his tomb's big door. He, unable to make his legions re-sleep, took them and ordered them to format as the Macedonian Phalanx. With the troops, he marched to Alexandria, the city that he found. The people were very confused, as to who this man was, and why he had troops with really long swords, and shields. He also was speaking a weird language, that the people couldn't understand. He, marched and, after a fierce fight with the city's armies, won. He named himself King of the Macedonian Empire, and annexed the city of Alexandria. "
 macedonia.2.a: "What kind of scenario is this?"
 macedonia.8.t: "A Blast from Past"
 macedonia.8.d: "Alexander III of Macedon or more commonly known as Alexander the Great, was the King of Makedonia and hegemon of the Corinthian League. He was born on the 20th of July in Pella and succeeded his father Philipp II by the age of 20. He was taught by the famous Aristoteles, otherwise not much aside from myths is known about his early years.\n\nMost famous are of course the military exploits of Alexander the Great. He began his military career helping his father to secure his hegemony over the Greek city states and then went on on the continue the invasion plans of the Persian Empire, which were started by his father possibly as a revenge for the invasion of Greece roughly 150 years earlier. In a stunning series of victories, Alexander defeated the Persian Empire under the leadership of Darius III. The war ended with the establishment of Macedonian rule over the vast former empire and Alexander continued to push towards the Indian subcontinent, however he was forced to return by his soldiers who refused to fight on.\n\nAlexander finally died in Babylon, his chosen residence, under suspicious circumstances while already planning is next conquests. Or so we thought... But today he is back and he wants to rebuild his empire once more!"
 macedonia.8.a: "A True Legend."
 macedonia.8.b: "This is not real! Hang the man who pretends to be Alexander!"
