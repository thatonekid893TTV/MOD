l_english:
  useful-events-quarior-submission.1.t:0 "[FROM.GetNameDefCap] makes demands"
  useful-events-quarior-submission.1.desc:1 "The [FROM.GetAdjective] ambassador has delivered a note demanding immediate consultations with [THIS.GetLeader]. According to the note, the [FROM.GetAdjective] government is no longer willing to tolerate an "uncertain security situation" in our country. It is not immediately clear what this refers to, but it is evident that we are effectively given two options: Agree to the stationing of [FROM.GetAdjective] troops on our soil; or possibly a military attack by [FROM.GetNameDef]."
  useful-events-quarior-submission.1.a:0 "We have no choice."
  useful-events-quarior-submission.1.b:0 "We will fight for our freedom!"

  useful-events-quarior-submission.2.t:0 "[FROM.GetNameDefCap] submits"
  useful-events-quarior-submission.2.desc:0 "Following a cabinet session that stretched into the early morning hours, [FROM.GetLeader] has formally accepted our demands. Our Ambassador to [FROM.GetNameDef] will ensure that the [FROM.GetAdjective] government closely coordinates with us on any issues of foreign or domestic policy."
  useful-events-quarior-submission.2.a:0 "Very wise."

  useful-events-quarior-submission.3.t:0 "[FROM.GetNameDefCap] Refuses"
  useful-events-quarior-submission.3.desc:0 "Our attempts to solve our outstanding issues with [FROM.GetNameDef] diplomatically seem to have failed. When our ambassador called on [FROM.GetLeader] for another round of negotiations, he was bruskly told that the [FROM.GetAdjective] had made their position clear, and that there were no further things to discuss."
  useful-events-quarior-submission.3.a:0 "They have chosen a worse fate."
  useful-events-quarior-submission.3.b:0 "We will not push them further... for now."