l_english:
 greece.900.t:0 "[From.GetNameDefCap] Invites Us to [FROM.GetFactionName]!"
 greece.900.desc:0 "[From.GetNameDefCap] have invited us to their faction, which serves to play as a minor version of the allies. If we join, they promise that together we will face our threats together."
 greece.900.a:0 "This sounds like a great idea!"
 greece.900.b:0 "We decline respectfully."
 #
 greece.901.t:0 "[From.GetNameDefCap] Joins the [ROOT.GetFactionName]!"
 greece.901.desc:0 "[From.GetNameDefCap] has announced that they will formally join the [ROOT.GetFactionName]. Together we are strong!"
 greece.901.a:0 "This is Excellent!"
 #
 greece.902.t:0 "[From.GetNameDefCap] Declines Our Invitation!"
 greece.902.desc:0 "[From.GetNameDefCap] has announced that they will not be joining the [ROOT.GetFactionName] for geopolitical and relations reasons."
 greece.902.16.a:0 "Unfortunate."
 #
 greece.909.t:0 "[From.GetNameDefCap] Demands We Submit!"
 greece.909.desc:0 "[From.GetNameDefCap] is demanding that we surrender our arms and submit to them. Presumably they will attempt to establish a government that is more friendly to them."
 greece.909.a:0 "Atleast we retain some autonomy..."
 greece.909.b:0 "We will never give into the Greeks!"
 #
 greece.910.t:0 "Bulgaria Submits!"
 greece.910.desc:0 "The Bulgarians have decided that it is in their best interest to give in to our demands. No longer do we have to worry about an aggressive Bulgaria."
 greece.910.a:0 "Excellent!"
 # 
 greece.911.t:0 "Bulgaria Defiant!"
 greece.911.desc:0 "The Bulgarians have rejected our demands to form a more favorable government. They state they have a right to national determination, and do not have to submit to our demands."
 greece.911.a:0 "We have no choice if we wish to preserve peace in the Balkans."
 greece.911.b:0 "They have a point."
 #
 greece.912.t:0 "[From.GetNameDefCap] Demands We Release Albania!"
 greece.912.desc:0 "The Greeks have made it obvious that they've wanted us to release our Albanian territories, but they have finally sent the ultimatum. Greece and their faction members are demanding we release our newly obtained territories back to its former owner."
 greece.912.a:0 "We will give in, only to preserve the peace."
 greece.912.b:0 "We are not giving up our new territories!"
 #
 greece.913.t:0 "Italy Agrees to Release Albania!"
 greece.913.desc:0 "The Italians have formally agreed to liberate Albania and revoke their claims of the Albanian territories. The former government of Albania has been restored, and is now being put back in control of the towns and cities of Albania."
 greece.913.a:0 "This is a major victory against the fascist menace!"
 #
 greece.915.t:0 "Italy Refuses to Release Albania!"
 greece.915.desc:0 "The Italians have are refusing to release Albania under the pretext that 'Albania is rightful Italian territory'. With our allies, we should be able to strike quickly to secure the freedom of Albania and more."
 greece.915.a:0 "They've left us with no other option!"
 #
 greece.906.t:0 "Requests of alliance."
 greece.906.desc:0 "Greece invites us to their faction. Allying with them could make us a regional power and help us resist the foreign powers"
 greece.906.a:0 "We accept."
 greece.906.b:0 "We decline"
 # 
 greece.907.t:0 "[From.GetNameDefCap] Accepts!"
 greece.907.desc:0 "[From.GetNameDefCap] has accepted our request of an alliance. We stand strong together!"
 greece.907.a:0 "Long Live The Hellenic Defence Union!"
 #
 greece.908.t:0 "[From.GetNameDefCap] Declines!"
 greece.908.desc:0 "[From.GetNameDefCap] has declined our request of an alliance. So be it, we can go on without them."
 greece.908.a:0 "Unfortunate"
 #
 greece.903.t:0 "[From.GetNameDefCap] Requests Control of British Armenia"
 greece.903.desc:0 "[From.GetNameDefCap] has requested that we gove them control of the mandate of Armenia, under the claim that because they are closer they can more accurately govern the mandate."
 greece.903.a:0 "That sounds reasonable."
 greece.903.b:0 "We agreed to their idea solely for an Armenian protectorate!"
 #
 greece.904.t:0 "[From.GetNameDefCap] Transfers Armenia!"
 greece.904.desc:0 "The British have accepted our request to transfer their mandate of Armenia to us. Now that they are in our control, we can continue to treat them as a puppet, or we can fully integrate them into the nation."
 greece.904.a:0 "They shall remain a mandate."
 greece.904.b:0 "Integrate the Armenian Mandate."
 #
 greece.905.t:0 "[From.GetNameDefCap] Declines our Request!"
 greece.905.desc:0 "[From.GetNameDefCap] has declined our request to transfer their Armenian mandate to us. They claim that in doing so would break the deal that they had agreed to when enforcing the Megali Idea."
 greece.905.a:0 "Unfortunate."
 
 
 
 hunda.1.t:0 "The Trials Of The Hunda"
 hunda.1.desc:0 "The hellenic Hunda took power hoping to stabilize Greece. Preventing an Italian regime and introducing again democracy was their main goal. We have reasons to believe this was just a cover, and they were planning to keep their regime. Their fate is on our hands"
 hunda.1.a:0 "They must pay for their crimes!"
 hunda.1.b:0 "Give them a chance to step down"
 
 