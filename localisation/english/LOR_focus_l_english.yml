  ROM_the_path_of_historical_blood_desc:0 "Romania must be preserved even if blood is needed"
  ROM_problem_of_the_past_governments_desc:0 "The problems caused by the previous governments, led by inept people, have caused a distrust of the Romanian people towards their rulers, we must change this"
  ROM_national_liberal_path_desc:0 "New party on the Romanian political scene, the National Liberal Party seeks to impose on our homeland the ideas that its program offers."
  ROM_the_liberal_monetary_investments_desc:0 "Investments in Key Sectors"
  ROM_the_status_of_monarchy_desc:0 "The state of the Romanian monarchy is quite perplexing we must see how events unfold for the Hohenzollern-Sigmaringen family."
  ROM_invest_in_the_government_restructuration_desc:0 "To gain the trust of the people we must carry out a complete government restructuring, with this we hope to recover our legitimacy"
  ROM_the_manifest_of_commies_desc:0 "Communism is a great threat to our Latino people, special measures will have to be taken to stop this wave, while we will have to wait."
  ROM_ban_the_commies_desc:0 "The prohibition of the Communist Party, which only corrupts the population with absurd ideas, has been made effective through this decree."
  ROM_finish_the_school_reforms_desc:0 "After an arduous task by our advisors, we have successfully completed the educational reforms"
  ROM_the_manifest_of_legionaries_desc:0 "We must review the status of legionaries in Romania, since they are in situations that do not seem to us to be compliant or appropriate"
  ROM_arrest_codreanu_desc:0 "Today the arrest warrant for the fascist lawyer Corneliu Condrenau has been made effective, his future is uncertain but we trust in the Romanian justice system."
  ROM_end_carols_life_style_desc:0 "Carol II king of the Romanians has lived in a luxurious way during these years, it doesn't seem fair to us that's why we are going to take measures and influence his lifestyle."
  ROM_agrarian_party_desc:0 "The National Agrarian Party was a right-wing agrarian party active in Romanian created by Octavian Goga"
  ROM_push_for_agrarian_producs_desc:0 "The Romanian people should not go hungry, that is why through this decree we seek to improve the quality of the grain, to satisfy the needs of our citizens."
  ROM_push_for_quality_of_grains_desc:0 "After our decree on grain quality, satisfaction and sales have skyrocketed. The renovation was a success!"
  ROM_solve_internal_government_issues_desc:0 "The situation cannot continue like this! We must try to resolve the great internal crisis before it is too late."
  ROM_first_attempt_to_prevent_the_collaps_desc:0 "Through these measures we are going to try to solve the crisis, Romania has recovered from worse times and this will not be the exception"
  ROM_second_attempt_to_prevent_the_collaps_desc:0 "The first measures were a real failure, which is why this second meeting was called. to try to resolve once and for all the crisis that is tearing apart the organs of government"
  ROM_crisis_is_over_desc:0 "Finally! We have reached an agreement and we have managed to find a solution to the crisis. The end is near and with it prosperity¡"
  ROM_solve_the_pesant_peverity_desc:0 "We are committed to helping farmers with a series of modernizations and aid to improve their quality of life."
  ROM_the_question_of_reforms_in_transylvania_desc:0 "If we want to keep the nation together, we should propose a reform in the area of Transylvania"
  ROM_the_question_of_reforms_in_bassarabia_desc:0 "If we want to keep the nation together, we should propose a reform in the area of Bassarabia"
  ROM_agrarian_reforms_desc:0 "The focus of land reform is to distribute and improve land for its greatest benefit and efficiency, land exploitation forms a large part of the Romanian economy"
  ROM_the_monarchy_status_desc:0 "The state of the Romanian monarchy is quite perplexing we must see how events unfold for the Hohenzollern-Sigmaringen family."
  ROM_problem_of_the_past_governments_desc:0 "The problems caused by the previous governments, led by inept people, have caused a distrust of the Romanian people towards their rulers, we must change this"
  ROM_king_carol_ii_overthdrow_the_government_desc:0 "Today Carol II broke into the headcuarters of the Romanian government with his royal escort and a group of soldiers carrying out a coup and forcing the resignation of the current government leader, a new leader will be assigned shortly"
  ROM_new_constitution_desc:0 "Carol II has implemented a new constitution, the reaction of the people has been one of acceptance, although opposition groups are arming themselves"
  ROM_order_exectution_of_legionaries_desc:0 "legionnaires. this terrorist and savage group that has caused so much discrepancy an abominable political group today will finally cease to exist, a great day for the nation"
  ROM_appoint_antonescu_desc:0 "After a period of reflection we find Ion Antonescu as the one chosen to hold the position of Conducător"
  ROM_form_the_government_with_horia_sima_desc:0 "After a period of reflection we find Horia Sima as the one chosen to hold the position of Conductor together with Antonuescu, the Romanian nation has new leaders"
  ROM_german_romanian_axis_desc:0 "After a German delegation arrived in Bucharest, the creation of the German-Romanian Axis has been decided, an alliance that will help achieve our goals."
  ROM_german_oil_investments_desc:0 "After a German delegation arrived in Bucharest, the creation of the German-Romanian Axis has been decided, an alliance that will help achieve our goals."
  ROM_barbarossa_desc:0 "Ostaşi, vă ordon: thirteen Prutul! This has been the patriot catchword that has been chosen to encourage enlistment in the national army"
  ROM_the_1944_incident_desc:0 "The August coup was carried out by Michael I, seeking to save the situation and establish ties with the Allied powers"
  ROM_the_communist_manifesto_coup_desc:0 "The communist movement in Romania is small but dedicated to its work."
  ROM_the_congress_of_the_party_desc:0 "The first people's congress has been established in Bucharest so that anyone can contribute their ideas and claim their needs."
  ROM_the_romanian_red_army_desc:0 "The Romanian Red Army is not that prepared compared to other armed forces but they are quite dedicated and will fight to the death to defend their ideology."
  ROM_the_romanian_red_guards_desc:0 "The red guard is dedicated to civil work and the maintenance of order, they are highly trained and feared corps"
  ROM_introduce_drafting_for_young_man_desc:0 "The red guard is dedicated to civil work and the maintenance of order, they are highly trained and feared bodies"
  ROM_the_colectivisation_program_desc:0 "The collectivization programs seek to make land for all in an attempt to seek equality and justice in the work of any Romania"
  ROM_organise_the_peasant_army_desc:0 "The army of the peasantry is in disarray and disorganized, which is why we must supply it with equipment and experience if we want to increase its preparation."
  ROM_centralisation_program_desc:0 "A free market is an unequal market, that's why we are going to centralize it, and let it be controlled by the state, what can go wrong?"
  ROM_the_economy_of_the_people_desc:0 "The people's economy, a fair and equal claim that anyone should support"
  ROM_the_people_dictatureship_desc:0 "The dictatorship of the offspring seeks to make the participation of each worker in the government bodies and that they feel useful in the legislative power"
  ROM_confiscate_the_wealth_of_the_rich_desc:0 "By confiscating wealth from the rich and distributing it, we will make good use of the money, improving the quality of life of Romanians."
  ROM_send_the_political_enemies_in_force_labour_caps_desc:0 "Send Political Enemies in Labour Camps"
  ROM_army_in_construction_desc:0 "The army must do its part and help us with our honorable and humble work"
  ROM_organise_penal_batalions_in_case_of_war_desc:0 "The penal battalions must be ready to carry out their function as it should be done"
  ROM_balkan_revolutionary_desc:0 "Today begins the conquest of the people and the liberation of the Balkans, today true freedom begins. Down with tyranny!"
  ROM_spread_of_communist_ideas_desc:0 "We must spread our socialist revolution to our neighboring countries and free their workers from the imperialist yoke"
  ROM_dreams_of_a_united_nation_desc:0 "The dream of Pan-Balkanism begins today, that is why we must start theorizing about the creation of a socialist federation."
  ROM_balkan_federation_desc:0 "All under the same flag, forever and ever!"
  ROM_the_path_of_a_new_decate_desc:0 "We must carry out our ambitions for a Greater Romania"
  ROM_the_royal_throne_desc:0 "We must modify the rights of succession in the Romanian monarchy"
  ROM_the_throne_problem_desc:0 "With the creation of the royal council, we will be able to express the wishes of the people well, a King knows his subjects!"
  ROM_the_first_monarch_act_desc:0 "Today the first monarchical act has been carried out, which has been followed with great expectation"
  ROM_reform_the_old_constitution_desc:0 "We must fix the problems of the old constitution to make it more to the tastes of the king"
  ROM_restore_the_hereditary_succesion_desc:0 "The law of succession is the most important matter in view, we will not meet and His Majesty will make the most appropriate decision."
  ROM_honor_the_heroes_of_the_great_war_desc:0 "We must honor those who fought in the great war, that is why a national holiday and the construction of monuments in honor of ex-combatants have been decreed."
  ROM_first_actions_for_a_dominant_power_desc:0 "This is the beginning of the Romanian domination over our neighbors."
  ROM_bulgarian_ultimatum_desc:0 "The ambassador in Sofia has given the Bulgarian government bodies an ultimatum, if all the points are not accepted there will be war"
