l_english:
#Albanian Royale Marriage #!#
gram_event_alb_albanian_royal_marriage.1.t:0 "King Zog's Wedding!"
gram_event_alb_albanian_royal_marriage.1.d:0 "In a historic event, King Zog I of Albania has married Countess Geraldine Apponyi de Nagy-Appony at the royal palace in Tirana. The ceremony drew dignitaries and diplomats, marking a significant union between the monarchy and European aristocracy. Countess Geraldine stunned in an elegant gown, while King Zog beamed in royal attire. This marriage is seen as a strategic alliance to strengthen the monarchy amidst rising regional tensions. Following the ceremony, the couple greeted the crowd, celebrating a hopeful new chapter for Albania."

gram_event_alb_albanian_royal_marriage.1.a:0 "Nice to hear."
gram_event_alb_albanian_royal_marriage.1.b:0 "I mean every king, needs his queen."

#Breakup of Yugoslavia #!#
gram_event_alb_breakup_of_yugoslavia.1.t:0 "Breakup of Yugoslavia"
gram_event_alb_breakup_of_yugoslavia.1.d:0 "In a landmark decision, Slovenia, Croatia, Bosnia, and Montenegro have declared their peaceful independence from Yugoslavia, marking the culmination of a long struggle for greater autonomy. \n\nThroughout their time in the federation, citizens of these republics challenged Serbian dominance, advocating for more rights and freedoms without resorting to war. This persistent push for autonomy has finally granted them the opportunity to break free from the constraints of the Yugoslav federation.\n\nAmid celebrations across the region, the newly independent nations are focused on forging their own paths, free from the tumult that characterized their past."

gram_event_alb_breakup_of_yugoslavia.1.a:0 "The fun is about to start."
gram_event_alb_breakup_of_yugoslavia.1.b:0 "Very interesting turn off events."

#Yugoslavian war of Independence #!#
gram_event_alb_yugoslavian_war_of_independence.1.t:0 "Yugoslavian War of Independence"
gram_event_alb_yugoslavian_war_of_independence.1.d:0 "Yugoslavia refused to grant Slovenia, Croatia, Bosnia, and Montenegro permission to exit the federation, viewing their aspirations for independence as an act of rebellion. In response, Yugoslavia declared war on these republics. How should we respond?"

gram_event_alb_yugoslavian_war_of_independence.1.a:0 "We will join them in the fight for their Independence."
gram_event_alb_yugoslavian_war_of_independence.1.b:0 "Let's wait and see what is gonna happen."

#Byzantine Empire Requests a guarantee #!#
gram_event_alb_byzantine_empire_requests_a_guarantee.1.t:0 "[From.GetName] requests a guarantee"
gram_event_alb_byzantine_empire_requests_a_guarantee.1.d:0 "Newly, formed [From.GetName] requests our governments guarantee of independence. They are willing to pay us handsomely. How should we respond?"

gram_event_alb_byzantine_empire_requests_a_guarantee.1.a:0 "It is basically free money. What could possibly go wrong?"
gram_event_alb_byzantine_empire_requests_a_guarantee.1.b:0 "Maby we shouldn't be meddling in [From.GetNameDEF] Internal Affairs."

#Byzantine Guarantee Agrees #!#
gram_event_alb_byzantine_guarantee_agrees.1.t:0 "Support from [From.GetName]"
gram_event_alb_byzantine_guarantee_agrees.1.d:0 "[From.GetName] has agreed to guarantee our independence."
gram_event_alb_byzantine_guarantee_agrees.1.a:0 "Incredible."

#Byzantine Guarantee Declines #!#
gram_event_alb_byzantine_guarantee_declines.1.t:0 "[From.GetName] has Declined"
gram_event_alb_byzantine_guarantee_declines.1.d:0 "[From.GetName] has declined our request for guarantee of independence."
gram_event_alb_byzantine_guarantee_declines.1.a:0 "Well, at least we tried."

#Death of King Zog #!#
gram_event_alb_death_of_king_zog.1.t:0 "King Zog is Dead"
gram_event_alb_death_of_king_zog.1.d:0 "Not so recently, our country experienced the great shocks, when we heard that our king got shot and almost died. Well today is the day, when our king has passed away in his "sleep", do to suffocation. \nIt is believed that same person who shot the king originally, killed him how. That is all the information that we were given by police. This is very tragic moment for our nation."

gram_event_alb_death_of_king_zog.1.a:0 "Hmm, i wonder who did it? I hope it wasn't the goverment."

#Opportunity to Become a Partner in Balkan Project #!#
gram_event_alb_opportunity_to_become_a_partner_in_balkan_project.1.t:0 "Opportunity to become member of Balkan Project"
gram_event_alb_opportunity_to_become_a_partner_in_balkan_project.1.d:0 "Socialist Republic of Albania is proposing a new idea of "united" Balkan. This is only the first step to achieving this goal."

gram_event_alb_opportunity_to_become_a_partner_in_balkan_project.1.a:0 "Yeah, sure we should join."
gram_event_alb_opportunity_to_become_a_partner_in_balkan_project.1.b:0 "We are better of alone."

#Proposal of Closer Unity #!#
gram_event_alb_proposal_of_closer_unity.1.t:0 "Proposal of Closer Unity"
gram_event_alb_proposal_of_closer_unity.1.d:0 "[From.GetName] is proposing a closer ties, to be able to get closer to completion of Balkan Project."

gram_event_alb_proposal_of_closer_unity.1.a:0 "We are in this together."
gram_event_alb_proposal_of_closer_unity.1.b:0 "To hell, with this craziness."

#Denied Balkan Partner #!#
gram_event_alb_denied_balkan_partner.1.t:0 "[From.GetName] has declined Balkan Project Partnership"
gram_event_alb_denied_balkan_partner.1.d:0 "[From.GetName] has formally declined our partnership plan, and wishes to have nothing with it or us."

gram_event_alb_denied_balkan_partner.1.a:0 "Well, at least we tried."
gram_event_alb_denied_balkan_partner.1.b:0 "This, is not over."

#Denied Closer Unity #!#
gram_event_alb_denied_closer_unity.1.t:0 "[From.GetName] has declined plan of Closer Unity"
gram_event_alb_denied_closer_unity.1.d:0 "[From.GetName] has formally declined our plan for Closer Unity of our nations, and wishes to stay independent."

gram_event_alb_denied_closer_unity.1.a:0 "Ok, i guess."
gram_event_alb_denied_closer_unity.1.b:0 "I don't think that was a CORRECT answer, [From.GetName]!"

#End of Italian Civil War #!#
gram_event_alb_end_of_italian_civil_war.1.t:0 "End of Italian Civil War"
gram_event_alb_end_of_italian_civil_war.1.d:0 "The Italian communist forces, fueled by a passionate dedication to social justice and equality, successfully rallied a diverse coalition of workers, farmers, and intellectuals in their struggle against fascism. This united front not only resulted in a significant dismantling of fascist power in Northern Italy but also reignited a robust spirit of resistance and hope among the Italian populace. However, as the new leadership takes shape, they must navigate the complexities of international relations. In a move toward reconciliation, they face the daunting task of repaying territories lost due to Italy's involvement in previous conflicts. While these concessions are seen as a necessary step toward fostering peace with neighboring nations, it remains to be seen how the communist leadership will balance these obligations with their revolutionary ideals."

#Shown to every other nation, exept Albania 
gram_event_alb_end_of_italian_civil_war.1.a:0 "What, the hell is happening, in Italy?"

#Italy lost land to ENG, FRA and ETH
gram_event_alb_end_of_italian_civil_war.1.b:0 "What, take a look at Africa, or Northern Italy, Italians had a price to repay."

#Italy lost land to ETH
gram_event_alb_end_of_italian_civil_war.1.c:0 "Hmm, take look at Ethiopia they have grown since i last saw them."

#Italy lost land to ENG
gram_event_alb_end_of_italian_civil_war.1.e:0 "British gained new colony to play with."

#Italy lost land to FRA
gram_event_alb_end_of_italian_civil_war.1.f:0 "France, gained some land? Impossible!?"

#Italy lost land to ENG, ETH
gram_event_alb_end_of_italian_civil_war.1.g:0 "Well, not only did the Ethiopia become bigger, British gained new African colony."

#Italy lost land to ENG, FRA
gram_event_alb_end_of_italian_civil_war.1.h:0 "Well, British gained new African colony and French expanded a little bit."

#Italy lost land to FRA, ETH
gram_event_alb_end_of_italian_civil_war.1.i:0 "Well, French gained some land, and Ethiopia became larger?"

#Italy was a good and normal civilized person ;)
gram_event_alb_end_of_italian_civil_war.1.j:0 "What do you mean "repaying"? They didn't lose anything."

#Shown to Italy
gram_event_alb_end_of_italian_civil_war.1.k:0 "Blood shall be spilled in the name of Revolution."

#Formation of UBSR #!#
gram_event_alb_formation_of_ubsr.1.t:0 "Formation of UBSR"
gram_event_alb_formation_of_ubsr.1.d:0 "Newly, formed nation situated in the Balkan peninsula, was a multi ethnic and multi national project of unification of the nations in Balkan, to form a singular entity, that will be able to take care of any external threat, or internal by united effort. The project originally started by Albanian Revolutionary Council wanted to bring freedom to other nations of the balkan by forming this new union. Inspired by Soviet Bolsheviks and Russian Revolution, they brought the communism to other Balkan nations and allowed them to join them into the newly formed federation named "Union of Balkan Socialist Republics"."

gram_event_alb_formation_of_ubsr.1.a:0 "Inspiring, to say the least."

#Greece Declines Unification Proposal #!#
gram_event_alb_greece_declines_unification_proposal.1.t:0 "Greece Declines Unification Proposal"
gram_event_alb_greece_declines_unification_proposal.1.d:0 "Greece has declined our diplomatic proposal of one united country. We will achieve our goal forcefully. "

gram_event_alb_greece_declines_unification_proposal.1.a:0 "In the name of Unity!"

#Invitation Into Dii Imperi #!#
gram_event_alb_invitation_into_dii_imperi.1.t:0 "Invitation Into [From.GetFactionName]"
gram_event_alb_invitation_into_dii_imperi.1.d:0 "[From.GetName] is asking us, if we want to become the new member in their alliance. How should we respond?"

gram_event_alb_invitation_into_dii_imperi.1.a:0 "Yea sure, we should join their alliance."
gram_event_alb_invitation_into_dii_imperi.1.b:0 "We are better off alone."

#Invitation Into Faction #!#
gram_event_alb_invitation_into_faction.1.t:0 "[ALB.GetName] invites us into [ALB.GetFactionName]"
gram_event_alb_invitation_into_faction.1.d:0 "[ALB.GetName] wants us to join their alliance [ALB.GetFactionName]."

gram_event_alb_invitation_into_faction.1.a:0 "Yea sure, we should join their alliance."
gram_event_alb_invitation_into_faction.1.b:0 "We are better of alone."

#Italy Breaks Into Civial War #!#
gram_event_alb_italy_breaks_into_civil_war.1.t:0 "Italy breaks into Civil War"
gram_event_alb_italy_breaks_into_civil_war.1.d:0 "Recent violent confrontations have erupted in Northern Italy, where supporters of Mussolini's regime are clashing with socialist workers, igniting a full-scale conflict. The unrest has been exacerbated by a wave of anti-fascist protests sweeping through Rome, fueling tensions across the region.\n\nFurther complicating the situation, reports indicate that firearms have been smuggled in from Albania, presumably to bolster the revolutionary efforts of socialist factions. As the conflict intensifies, local communities brace for the uncertain consequences of this escalating violence."

gram_event_alb_italy_breaks_into_civil_war.1.a:0 "Oh, god."
gram_event_alb_italy_breaks_into_civil_war.1.b:0 "Let it burn."

#King Zog Survives Assasination Attempt #!#
gram_event_alb_king_zog_survived_the_assasination_attempt.1.t:0 "King Zog Survived The Assasination Attempt"
gram_event_alb_king_zog_survived_the_assasination_attempt.1.d:0 "Durrës, Albania - In a shocking turn of events, King Zog I of Albania was shot and critically injured yesterday evening while residing in his Royal Villa in Durrës. The monarch, who has been on the throne since 1928, was struck by multiple bullets and has been placed in a coma at a nearby hospital.\n\nAccording to eyewitnesses, the shooting occurred around 9:00 pm local time when a group of unknown assailants, believed to be armed men, entered the Royal Villa. The attackers made their way to the king's quarters, where they opened fire on the monarch.\n\n"It was a chaotic scene," said one of the palace guards. "We heard shots fired and then saw the king lying on the floor. We immediately called for medical assistance and rushed him to the hospital."\n\nKing Zog, was rushed to the University Hospital of Durrës, where he underwent emergency surgery. Despite efforts to save him, he remains in a coma and is listed in critical condition.\n\nThe motive behind the attack is still unknown, but investigators are working to determine whether it was an assassination attempt or a random act of violence. The Albanian government has launched an investigation and has appealed for calm among the public."

gram_event_alb_king_zog_survived_the_assasination_attempt.1.a:0 "I hope the god knows what it's doing."
gram_event_alb_king_zog_survived_the_assasination_attempt.1.b:0 "King is gone, allow the people to finally chose the faith of this dam country."

#New Capital Balkan - 1 #!#
gram_event_alb_new_capital_balkan.1.t:0 "New Capital of Our Federation"
gram_event_alb_new_capital_balkan.1.d:0 "What is going to be our new capital of our federation?"

gram_event_alb_new_capital_balkan.1.a:0 "Belgrade, the Yugoslav capital."
gram_event_alb_new_capital_balkan.1.b:0 "Sofia, the Bulgarian capital."
gram_event_alb_new_capital_balkan.1.c:0 "Bucharest, the Romanian capital."
gram_event_alb_new_capital_balkan.1.e:0 "Let me see some other options."

#New Capital Balkan - 2
gram_event_alb_new_capital_balkan_2.1.t:0 "Other Possible Options"
gram_event_alb_new_capital_balkan_2.1.d:0 "What is going to be our new capital of our federation?"

gram_event_alb_new_capital_balkan_2.1.a:0 "Athens, the Greek capital."
gram_event_alb_new_capital_balkan_2.1.b:0 "Keep the Tirana, the true Balkan capital."
gram_event_alb_new_capital_balkan_2.1.c:0 "Give me a minute to decide."

#Our King is Back #!#
gram_event_alb_our_king_is_back.1.t:0 "Our King Is Back"
gram_event_alb_our_king_is_back.1.d:0 "In a remarkable twist, King Zog of Albania has awakened from a four-month coma, igniting both hope and controversy as he declares a divine mission to unite the lost Byzantine Empire. “I was confronted by God during my slumber,” Zog announced to a hushed crowd of advisors and loyal supporters. “I am the chosen one to restore the glory of Byzantium.”\n\nThe king’s profound statements follow a serious health crisis that many feared would end his reign. Zog has captivated the nation with his vision of rekindling the historical legacy of a once-mighty empire, one that held immense cultural and political significance in the region.\n\nHis fervent followers are rallying behind the king, viewing his recovery as a sign of renewed strength and purpose. “His return is a blessing for our nation,” said a devoted supporter. “We believe he can lead us to greatness.”\n\nHowever, skepticism looms among political analysts and critics who question the feasibility of such grand ambitions. “While calls for unity are inspiring, we must be cautious about the implications of claiming a divine mandate,” stated political expert Elena Basha.\n\nAs King Zog embarks on this ambitious quest, Albania watches closely. His next steps could reshape the political landscape, as citizens weigh the possibilities of a united future against the realities of contemporary governance. The nation is poised at a pivotal moment, intrigued by the king's extraordinary claims and the potential path ahead.\n"

gram_event_alb_our_king_is_back.1.a:0 "Long live the, King!"

#Our King is No More #!#
gram_event_alb_our_king_no_more.1.t:0 "Our King no more"
gram_event_alb_our_king_no_more.1.d:0 "With the recent turn of events, it came to light that our country doesn't really need the king anymore, especially the one that cannot even walk or talk. We need to think and do something about this. "

gram_event_alb_our_king_no_more.1.a:0 "Well, he is useless, lets get someone to do the dirty work."
gram_event_alb_our_king_no_more.1.b:0 "Allow him to stay, but remove his title of the king."

#Picking the New Successor #!#
gram_event_alb_picking_the_new_successor.1.t:0 "Picking the New Successor"
gram_event_alb_picking_the_new_successor.1.d:0 "Who shall be the new successor for the Albanian Throne?"

gram_event_alb_picking_the_new_successor.1.a:0 "Zogs, King title shall be restored once again."
gram_event_alb_picking_the_new_successor.1.b:0 "Prince Wilhelm Friedrich, shall become the new owner of Albanian Throne."

#Push for Independence #!#
gram_event_alb_push_for_independence.1.t:0 "Push for Independence"
gram_event_alb_push_for_independence.1.d:0 "Slovenia, Croatia, Bosnia, and Montenegro seek to declare their independence from Yugoslavia and fully withdraw from the federation. How should we respond?"

gram_event_alb_push_for_independence.1.a:0 "Allow them to leave. They are only holding us back."
gram_event_alb_push_for_independence.1.b:0 "Those are rightful lands of Yugoslavia, this is an act of rebellion."

#Restoration of Byzantine Empire #!#
gram_event_alb_restoration_of_byzantine_empire.1.t:0 "Restoration of Byzantine Empire"
gram_event_alb_restoration_of_byzantine_empire.1.d:0 "On this glorious day, both Albanian and Greek government, have come to an agreement to unify into, a singular country. Under this agreement, newly formed country will be given a new name "Holy Byzantine Empire". Alongside this, a ruler of the said country will be and remain "King Zog of Albania" as he claims, he is a true successor to the throne of the Byzantine Empire. This newly formed country situated in southern part of Balkan Peninsula, still remains ferly weak, and unstable, but only time will tell, what is gonna happen in the future with this newly formed nation."

gram_event_alb_restoration_of_byzantine_empire.1.a:0 "Interesting, turn of the events, isn't it?"

#Unite with Albania #!#
gram_event_alb_unite_with_albania.1.t:0 "Unite with [ALB.GetName]"
gram_event_alb_unite_with_albania.1.d:0 "[ALB.GetName], has presented us with idea that we should unite with them to form this new Byzantine Empire, how should we respond?"

gram_event_alb_unite_with_albania.1.a:0 "Yes, we should unite with [ALB.GetName]."
gram_event_alb_unite_with_albania.1.b:0 "Tell them, that we don't want to be part of this, idiotic plan."

#United and Glorious #!#
gram_event_alb_united_and_glorious.1.t:0 "United and Glorious"
gram_event_alb_united_and_glorious.1.d:0 "The two nations, once split by the borders are now united and ready to take on the rest of the evil world. Long live the king, long live the fatherland!"

gram_event_alb_united_and_glorious.1.a:0 "Long live the Empire."

#Zog Awakens #!#
gram_event_alb_zog_awakens.1.t:0 "King Zog awekens from Coma"
gram_event_alb_zog_awakens.1.d:0 "After a lengthy wait, "King" Zog is finally able to stand on his own two feet once more. Although he no longer holds the title of King of Albania, having lost his royal status, he has been permitted to remain in the country and will spend the remainder of his days at the Royal Villa in Durrës."

gram_event_alb_zog_awakens.1.a:0 "Well, i am glad that at least he is fine."

#One Union Solution #!#
gram_event_alb_one_union_solution.1.t:0 "One Union Solution"
gram_event_alb_one_union_solution.1.d:0 "The current Soviet war effort is somewhat underwhelming. As a result, both Hoxha and Stalin agreed that if the USSR were to fall, the two nations—Albania and the USSR would establish a new government, transforming the region into a vast federation made up of former Soviet republics along with newly included Albania. This will be a last ditch effort in the case something like this would happen."

gram_event_alb_one_union_solution.1.a:0 "Wait, i can do what??"

#Italian Industrial Investment #!#
gram_event_alb_italian_industrial_investment.1.t:0 "Italian Industrial Investment"
gram_event_alb_italian_industrial_investment.1.d:0 "[ITA.GetName] wishes to increase our industrial capacity, and to help us in developing our nation. But of course they wish to be compensated. How should we approach their offer?"

gram_event_alb_italian_industrial_investment.1.a:0 "We should accept it, even if it means partial loss of our independence."
gram_event_alb_italian_industrial_investment.1.b:0 "We shouldn't allow them to take even deeper control over our nation."

#Joint Military Exercise #!#
gram_event_alb_joint_military_exercise.1.t:0 "Joint Military Exercise"
gram_event_alb_joint_military_exercise.1.d:0 "[ITA.GetName] proposes a joint military training. Why do they wish to train their troops in our nations, we aren't too sure, but we think there is a much deeper answer to that. But still, how should we approach their offer?"

gram_event_alb_joint_military_exercise.1.a:0 "Our troops, are in need of proper training, maby not that bad idea to do it?"
gram_event_alb_joint_military_exercise.1.b:0 "We should't allow their troops to walk on our soil."

#Goverment Takeover
gram_event_alb_goverment_takeover.1.t:0 "Goverment Takeover"
gram_event_alb_goverment_takeover.1.d:0 "The recent turn of events, have destabilize our nation. The coop most likely launched by Pro-Italy party members wish for our nation to become a vassal state, under Italy. And as well [ITA.GetName] has issued an ultimatum to us, to either become their vassal or face harsh consequences."

gram_event_alb_goverment_takeover.1.a:0 "Well there is none, other solution that to comply."
gram_event_alb_goverment_takeover.1.b:0 "Tell, those blood sucking idiots, to go to hell."