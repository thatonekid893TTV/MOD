 AST_restrict_citizenship:0 "Restrict Citizenship"
 AST_restrict_citizenship_desc:0 "The "White Australia" policy must be expanded to preserve the true Anglo-Saxon character of the Australian nation. Citizenship will be restricted on the basis of eugenics and ideology, with 'internal aliens' relocated to ghettos and made productive through service to the state."
 AST_encourage_immigration:0 "Encourage Immigration"
 AST_encourage_immigration_desc:0 "Australia has always been a nation of immigrants, and our South West Pacific Area neighbors are only just beginning to industrialize. We should reform our immigration laws to facilitate the emigration from these places of workers eager to take part in the Australian nation into our country."
 AST_abandon_white_australia_policy:0 "Abandon White Australia Policy"
 AST_abandon_white_australia_policy_desc:0 ""
 AST_labor_loyalism:0 "Loyal Labor Leadership"
 AST_labor_loyalism_desc:0 "With The Australian Labor Party's victory in the last election, [AST_current_labor_leader_sl] must put forth a progressive economic platform, while distancing Labor from their militant socialist past as the Commonwealth faces existential threats to its existence from expansionist militarist powers."
 AST_labor_bulwark_against_bolshevism:0 "Labor Bulwark Against Bolshevism"
 AST_labor_bulwark_against_bolshevism_desc:0 "With the rising tide of communism across East Asia, it is prudent that Labor not only distance themselves from these anti-democratic movements, but be a leader in the defense of liberty and democracy in the South West Pacific Area."
 AST_united_under_the_crown:0 "United Under the Crown"
 AST_united_under_the_crown_desc:0 "The United Australia Party under [AST_current_liberal_leader_sl] is his majesty's most loyal Party and should be proud of this!"
 AST_vote_of_no_confidence:0 "Vote of No Confidence"
 AST_vote_of_no_confidence_desc:0 "With the swift severing of ties with the Commonwealth, a broad coalition of pro-Commonwealth and pro-monarchy UAP MP's alongside pro-Commonwealth and opportunistic ALP MP's have organized a motion of no confidence against the administration of [AST.GetLeader]."
 AST_promote_trade:0 "Promote Trade"
 AST_promote_trade_desc:0 "Being outside the Commonwealth means that many of our guaranteed trade partners are gone. We should invest into promoting free trade across the region and position ourselves as a safe and amicable trading partner."
 AST_invite_american_investors:0 "American Investors"
 AST_invite_american_investors_desc:0 "As a fellow capitalist republic born out of the British Empire, America is our natural ally. We should invite American investors to boost our industrial core and develop our swathes of under utilized land."
 AST_american_licenses:0 "American Licenses"
 AST_american_licenses_desc:0 "We should reach out to the Americans to draft an agreement to provided easier channels to license their advance weaponry and military technology."
 AST_a_labor_republic:0 "A Labor Republic"
 AST_a_labor_republic_desc:0 ""
 AST_nationalize_the_banks:0 "Nationalise the Banks"
 AST_nationalize_the_banks_desc:0 "Ben Chifley's role in shaping Australian economic policy cannot be understated. Now that he is suggesting we nationalise the banks, we must trust his economic policy."
 AST_crackdown_on_the_new_guard:0 "Crackdown on the New Guard"
 AST_crackdown_on_the_new_guard_desc:0 "The New Guard's terror has no place in Australian society and its criminal activities must be cracked down upon."
 AST_pacific_peacekeepers:0 "Pacific Peacekeepers"
 AST_pacific_peacekeepers_desc:0 "With our history in the great war fighting as the Australian Imperial Force, we should invest in our expeditionary capabilities to protect peace and democracy across the Pacific."
 AST_delegation_to_nat_china:0 "Delegation to China"
 AST_delegation_to_nat_china_desc:0 "[CHI.GetLeader]'s China is another independent republic born from an empire that faces existential threats from radical and imperialist forces. We should strengthen our diplomatic ties and aid them in their struggle to unite China under Sun Yat Sen's three principles, Nationalism, Democracy, and Socialism."
 AST_concessions_to_the_new_guard:0 "Concessions to the New Guard"
 AST_concessions_to_the_new_guard_desc:0 "While the New Guard may be voicing their concerns in an extreme and illegal way, their frustation has valid roots. We should reach out and try to find a compromise that preserves the stability of our liberal democratic republic."
 AST_convoy_production:0 "Convoy Production"
 AST_convoy_production_desc:0 "With our newfound industrial support and expertise from the Americans, we should invest into the mass production of convoys."
 AST_protect_southern_brothers:0 "ANZAC Alliance"
 AST_protect_southern_brothers_desc:0 "New Zealand is a brother country to ours, and we should reach out to them to invite them to The South West Pacific Initiative to safeguard both of our republics."
 AST_the_jindyworobak_coup:0 "Jindyworobak Coup"
 AST_the_jindyworobak_coup_desc:0 "The Jindyworobak Movement has been at the forefront promoting fascism across the country. Jindyworobak, which means "to join" or "to annex", in the Woiwurrun language, is an eclectic mix of nazism, anti-semitism, and monarchism that advocates for the appropriation of Aboriginal culture as a replacement to so called "alien influences." They have the backing of many ex-socialists and disillusioned workers."
 AST_carrier_focus:0 "Carrier Focus"
 AST_carrier_focus_desc:0 "The Japanese have been able to produce a modern carrier fleet with limited resoources and industry. With their expertise, perhaps we can expedite our own research into this new class of ships."
 AST_naval_reorientation:0 "Naval Reorientation"
 AST_naval_reorientation_desc:0 "Isolated from our any allies and surrounded by enemies, we must reorient our military production toward shipbuilding if we are to have a chance at winning the battle for the Pacific."
 AST_a_new_australia:0 "[AST_a_new_australia_sl]"
 AST_a_new_australia_desc:0 "[AST_a_new_australia_desc_sl]"
 AST_a_new_australia_sl_loc_no_putsch:0 "A New Australia"
 AST_a_new_australia_sl_loc_base:0 "New Guard Putsch"
 AST_a_new_australia_desc_sl_no_putsch:0 "With the victory of the New Guard, it is time to usher in a new era for Australia under the leadership of Eric Campbell and the Centre Party, and guided by the New Guard, where Australians come first!"
 AST_a_new_australia_desc_sl_loc_base:0 "The New Guard has been rapidly growing in popularity since the UAP began to support their political wing, the Centre Party. With their extensive influence in the Australian Army, a putsch against the [AST_current_liberal_leader_last_name_sl] administration may be in order."
 AST_an_honorary_monarchy:0 "A Fascist Monarch"
 AST_an_honorary_monarchy_desc:0 "The [AST.GetFascistParty] has deep reverence for the House of Windsor. While this is only a ceremonial role, it is essential that we legitimize our rule with the coronation of the one member of the British royal family that is sympathetic to our cause, Edward VIII, who will be crowned Edward I of Australia."
 AST_australia_first_economy:0 "Australia First Economy"
 AST_australia_first_economy_desc:0 "With inspiration from the fascist corporatism developed in Europe, we must reshape the economy to be by and for Australians first!"
 AST_mobilize_the_new_guard:0 "Mobilize the New Guard"
 AST_mobilize_the_new_guard_desc:0 "We have thousands of New Guard members that are ready and willing to be drafted into the Australian Army."
 AST_the_white_army:0 "The White Army"
 AST_the_white_army_desc:0 "The New Guard has been eroniously referred to as the "White Army" in the past. With the full integration of the New Guard into the Australian Army, the latter will truly become our 'White Army'."
 AST_exploit_outback:0 "Exploit NT"
 AST_exploit_outback_desc:0 "The Northern Territory is a resource rich area that has been largely preserved by the Aboriginals and previous Australian government. However, we are not bound by principles of environmental beauty or respecting treaties with savages. We can and should exploit these untapped resources to the fullest."
 AST_unify_australasia:0 "Unify Australasia"
 AST_unify_australasia_desc:0 "It is time that we integrate New Zealand into our Empire and proclaim the birth of the Australasian Empire!"
 AST_australian_east_indies:0 "Australian East Indies"
 AST_australian_east_indies_desc:0 "[INS.GetNameDefCap] is resource rich and ripe for the taking. It will be an excellent addition to our growing empire!"
 AST_the_nazi_connection:0 "The Nazi Connection"
 AST_the_nazi_connection_desc:0 "Many of the members of our [AST.GetFascistParty] have ties to and have met with prominent Nazi officals. With these connections we can seek alignment with the Axis."
 AST_ss_collaboration:0 "SS Collaboration"
 AST_ss_collaboration_desc:0 "The SS have brought terror to the enemies of Germany within and without. We should collaborate with them on tactics to bolster our internal and external state security."
 AST_wehrmacht_collaboration:0 "Wehrmacht Advisors"
 AST_wehrmacht_collaboration_desc:0 "The Wehrmacht have risen from the ashes of the old Weimar Republic to become an indominable force against the forces Judeo-Bolshevism. We should invite some advisors to turn the Australian Army into the Wehrmacht of the South West Pacific Area."
 AST_our_home_rule:0 "Rule From Canberra"
 AST_our_home_rule_desc:0 "As our influence and conquest across the South West Pacific Area has spread, a number of puppet states have fallen within our sphere of influence. Now that we are the sovereign of our own growing empire, it is time that direct rule from Canberra be imposed upon these puppet regimes."
 AST_convoy_defense:0 "Convoy Defense"
 AST_convoy_defense_desc:0 "If we are to face off against the major Pacific powers, we must invest into ships that can defend our convoys from submarines. With our allies' expertise, our research efforts can be heavily expedited."
 AST_purge_the_new_guard:0 "Purge the New Guard"
 AST_purge_the_new_guard_desc:0 "The New Guard has spread terror across the country and infiltrated the top eschelons of the Australian Armed Forces. They are tumor in the national body politic that must be excised."
 AST_soviet_military_advisors:0 "Soviet Military Advisors"
 AST_soviet_military_advisors_desc:0 "The Comintern affords us many benefits, one of which includes access to experienced Red Army, Navy, and Airforce advisors that can help the Australian Armed Forces excel against the reactionary forces of capitalism and imperialism."
 AST_the_first_five_year_plan:0 "The First Five Year Plan"
 AST_the_first_five_year_plan_desc:0 "With Soviet aid and guidance, we can now begin the First Five Year Plan of the Australian People's Republic."
 AST_urban_housing_initiative:0 "Urban Housing Initiative"
 AST_urban_housing_initiative_desc:0 "Public housing for all is a cornerstone of the Marxist-Leninist path to communism. Our south west urban core is a perfect place to begin this project."
 AST_mechanize_the_agriculture_sector:0 "Mechanize the Agriculture Sector"
 AST_mechanize_the_agriculture_sector_desc:0 "We should maximize our agricultural output with state investment into more efficient farms."
 AST_pave_remote_roads:0 "Pave Remote Roads"
 AST_pave_remote_roads_desc:0 "We have many regions in Australia that are under paved o entirely unpaved. We should invest into proper roads for our remote communities."
 AST_women_in_the_workforce:0 "Women in the Workforce"
 AST_women_in_the_workforce_desc:0 "Equal rights and equal pay for women has been a cornerstone of the CPA's program since its founding. Now we can make it law."
 AST_monumental_propaganda:0 "Monumental Propaganda"
 AST_monumental_propaganda_desc:0 "Monumental Propaganda has been a cornerstone of Socialist Realist propaganda since the days of Lenin. By implementing it in Australia we will stabilize and secure the revolution."
 AST_aboriginal_reconciliation:0 "Aboriginal Reconciliation"
 AST_aboriginal_reconciliation_desc:0 "The native Aboriginal people survived genocide, massacre, displacement, and exploitation by the British Empire and subsequent capitalist Australian governments. Now, we have historic opportunity to take the first step towards healing the colonial wounds by abolishing the "Aborigines Protection" Acts, provide reparations to the Stolen Generation, and recognising land rights."
 AST_decolonize:0 "SWPA Decolonization"
 AST_decolonize_desc:0 "We have many colonial holdings in the South West Pacific Area granted to the pre-revolutionary Australian government. It is time that we end home rule in these regions and establish liberated workers republics under our guidance."
 AST_cooperate_with_the_unions:0 "Cooperate with the Unions"
 AST_cooperate_with_the_unions_desc:0 "While the Marxist-Leninist doctrine calls for the elimination of independent unions and the establishment of a single state run union, this has been disastrous for the Soviet workers, as seen in Kronstadt in 1921. Instead, with inspiration from the international Syndicalist movement, we will develop open and direct communication with the unions and encourage union membership."
 AST_land_redistribution:0 "Land Redistribution"
 AST_land_redistribution_desc:0 "Swathes of fertile land and farmland are still held by private families and businesses. We will enforce state control and organize collective farms, regardless of how unsavory the prospect is."
 AST_anti_colonial_propaganda:0 "Anti-Colonial Propaganda"
 AST_anti_colonial_propaganda_desc:0 "The are millions of people across the Pacific who still live under colonial empires. We must spread liberatory thought across the region to wake the colonized workers of the Pacific up to the capitalist and imperialist power structures that keep them oppressed and enslave to foreign imperial powers."
 AST_instigate_anti_colonial_workers_revolutions:0 "Instigate Anti-Colonial Workers Revolutions"
 AST_instigate_anti_colonial_workers_revolutions_desc:0 "Now that we have spread revolutionary fervor in the colonies of the imperial states, it is time to ignite the spark of revolution across the Pacific!"
 AST_liberate_the_south_pacific:0 "Pacific Liberation"
 AST_liberate_the_south_pacific_desc:0 "It is time that we take the fight to the foreign colonial powers and lead the liberation of the Pacific!"
 AST_aboriginal_new_deal:0 "Aboriginal New Deal"
 AST_aboriginal_new_deal_desc:0 "The Aboriginal people of Australia have been oppressed to the point of near extinction by our forefathers. It is time that we give them a \"New Deal\" that will begin the process of addressing the past and integrating the Aboriginal people of Australia into our modern state."
 AST_industrialize_top_end_nt:0 "Industrialize Top End"
 AST_industrialize_top_end_nt_desc:0 "Top End, the nickname for the Northern Territory, and where the majority of Aboriginals live, is still largely unindustrialized with untapped resources. Industrializing the territory will enable us to improve the lives of all Top Enders and extract more resources for our growing civilian and military industries."
 AST_full_assimilation:0 "Enforce Aboriginal Assimilation"
 AST_full_assimilation_desc:0 "The Aboriginals have been oppressed to the point of near extinction by our forefathers and have yet to be given Australian citizenship. We should expand our campaigns to assimilate them into Australian society with the goal and incentive of full citizenship."
 AST_integrate_top_end:0 "Integrate Top End"
 AST_integrate_top_end_desc:0 "The Aboriginals have been oppressed to the point of near extinction by our forefathers and have yet to be given Australian citizenship. Top End, the nickname for the Northern Territory, and where the majority of Aboriginals live, is still under federal control. It is time we incorporate the Northern Territory into [AST.GetNameDef], and grant the Aboriginals full citizenship."
 AST_top_end_marshall_law:0 "Top End Martial Law"
 AST_top_end_marshall_law_desc:0 "Now that we are at war, Top End, the nickname for the Northern Territory and the site of most of our iron and steel production, is under threat from our enemies. Since we have full control of it as a directly admministered territory versus the federal states, we should institute martial law in order to bolster the defenses of the territory."
 AST_end_marshall_law:0 "End Top End Martial Law"
 AST_end_marshall_law_desc:0 "Now that we are at peace and our nation safe, it is time to end martial law in the Top End. While the rights of the citizens and Aboriginals were trampled, we were able to expand the iron mines in the territory."
 AST_2aif:0 "2AIF"
 AST_2aif_desc:0 "Despite the horrors of the last war, Australia is ready to march again. The 2nd Australian Imperial Force is being organized as we speak."
 AST_desert_acclimatization:0 "Desert Training"
 AST_desert_acclimatization_desc:0 "With access to the vast land of the British Empire as well as the outback, the 2AIF can train for desert warfare in the upcoming war."
 AST_mountain_acclimatization:0 "Mountain Training"
 AST_mountain_acclimatization_desc:0 "With access to the vast land of the British Empire as well as our local mountain ranges, the 2AIF can train for mountain warfare in the upcoming war."
 AST_ngvr:0 "NGVR"
 AST_ngvr_desc:0 "The New Guinea Volunteer Rifles are a militia battalion of former soldiers and hunters who will be detached to New Guinea to bolster its defense, and in the event of its fall to the enemy they will organize a guerilla campaign against the occupation garrisons."
 AST_local_defense:0 "Local Defence"
 AST_local_defense_desc:0 "To complement the Singapore Strategy we should implement a \"Local Defence\" programme outlined by the defence minister to invest in the construction of \"mini-Singapore\" naval bases at Darwin and Port Moresby."
 AST_promote_filipino_independence:0 "Promote Filipino Independence"
 AST_promote_filipino_independence_desc:0 "[PHI.GetNameDefCap] are already seeking independence from the United States, but we should aid them in their diplomatic and political efforts to become a truly free and fully independent country."
 AST_promote_malayan_democratic_opposition:0 "Promote Malayan Democratic Opposition"
 AST_promote_malayan_democratic_opposition_desc:0 "The Malayan people seek liberty and true democracy, just as we do. But the Malayan independence movement is dominated by communists. We should support democratic opposition leaders in their diplomatic and political efforts to become a truly free and fully independent country."
 AST_promote_democratic_values:0 "Promote Democratic Values"
 AST_promote_democratic_values_desc:0 "We should invest into promoting democratic values across the Pacific."
 #AST_protect_the_dutch_colonies:0 "Protect the Dutch Colonies"
 #AST_protect_the_dutch_colonies_desc:0 "The Dutch East Indies is vulnerable now due to the collapse and occupation of the Dutch metropole. We should offer to take the territory under our protection as a fellow [AST.GetRulingIdeology] nation."
 AST_reach_out_to_mexicans:0 "Reach Out to Mexico"
 AST_reach_out_to_mexicans_desc:0 "Mexico under the PNR is a nationalist and social democratic state with firm leadership and no tolerace for reactionary or extremist politics, just like Australia under Jack Lang! We should send a diplomatic effort to the Mexicans to show them that we are brother republics from across the Pacific."
 AST_join_mexicans:0 "Join Mexico"
 AST_join_mexicans_desc:0 "Now that we have established the ideological and diplomatic brothership between the Mexican and Australian people and their leaders, it is time to formally request to join the [MEX.GetFactionName] in a defensive pact with Mexico."
 AST_reach_out_to_fdr:0 "Reach Out to FDR"
 AST_reach_out_to_fdr_desc:0 "Franklin Delano Roosevelt, the 32nd president of the United States, has transformed America with his bold and socialistic \"New Deal.\" We should reach out to his administration to learn from his successes and show him that [AST.GetLeader] is the FDR of Australia!"
 AST_american_industrial_aid:0 "American Industrial Aid"
 AST_american_industrial_aid_desc:0 "[AST.GetLeader]'s burgeoning relationship with the US comes with many benefits, the first of which is access to American industrial aid."
 AST_reach_out_to_fdr_lang:0 "Reach Out to FDR"
 AST_reach_out_to_fdr_lang_desc:0 "Franklin Delano Roosevelt, the 32nd president of the United States, has transformed America with his bold and socialistic \"New Deal.\" We should reach out to his administration to learn from his successes and show him that [AST.GetLeader] is the FDR of Australia!"
 AST_american_industrial_aid_lang:0 "American Industrial Aid"
 AST_american_industrial_aid_lang_desc:0 "[AST.GetLeader]'s burgeoning relationship with the US comes with many benefits, the first of which is access to American industrial aid."
 AST_ally_the_british:0 "Rejoin the Allies"
 AST_ally_the_british_desc:0 "Despite our new republican status, the British remain our mother country. With threats abound and world tension rising rapidly, it may be time to rejoin the Allies as an independent republic."
 AST_regain_cc_islands:0 "Gain CC Islands"
 AST_regain_cc_islands_desc:0 "The Christmas and Cocos islands have been claimed the Australian government. Now that we are allied to the British as equals, it is time we request these islands be handed over to us."
 AST_countrymindedness:0 "Countrymindedness"
 AST_countrymindedness_desc:0 "Countrymindedness is the political ethos of the Country Party. We should invest into implementing it on a national scale."
 AST_seek_american_protection:0 "Seek American Protection"
 AST_seek_american_protection_desc:0 "As a small and relatively defenseless new republic, we should reach out to the Americans for protection. As fellow republic born out of the British Empire, we have much in common."
 AST_preempt_fascist_threat:0 "Preempt Fascist Threat"
 AST_preempt_fascist_threat_desc:0 "The rise of Fascism across the world is a threat to all who value democracy, liberty, and peace. We must stand up to these warmongering ultranationalists before it is too late!"
 AST_preempt_communist_threat:0 "Preempt Communist Threat"
 AST_preempt_communist_threat_desc:0 "The rise of Communism across the world is a threat to all who value democracy, freedom, and tradition. We must stand up to these warmongering internationalist before it is too late!"
 AST_invest_in_colonial_assimilation:0 "Invest in Colonial Assimilation"
 AST_invest_in_colonial_assimilation_desc:0 "The Australia First Party seeks to reverse the century of oppression of the native people of the Pacific and east asia by assimilating and civilizing them to be just like us!"
 AST_14_principles:0 "14 Principles"
 AST_14_principles_desc:0 "The 14 Principles were a list that detailed the \"guiding principles\" of the Centre Party. We will implement this political program across [AST.GetName] to foster a free and pure national body politik."
 AST_jap_naval_expertise:0 "Invite Japanese Naval Experts"
 AST_jap_naval_expertise_desc:0 "The Japanese have built a navy to rival the colonial powers that have ruled the Pacific up until now. We should request experts and advisors in builting and maintaining a navy that can project power with few resources."
 AST_jap_pacific_planes:0 "Invite Japanese Air Experts"
 AST_jap_pacific_planes_desc:0 "The Japanese have invested into a fleet of carrier planes to dominate the Pacific skies. We can take advantage of their experience to aid them in their military endeavors."
 AST_claim_nearby_islands:0 "Claim Nearby Islands"
 AST_claim_nearby_islands_desc:0 "There are a number of nearby islands that are not claimed by the Japanese for their growing empire. We should stake our claim to them as we carve up the Pacific together."
 AST_invite_foreign_capitalists:0 "Invite Foreign Capitalists"
 AST_invite_foreign_capitalists_desc:0 "There are many foreign capitalists seeking to take advantage of the extremely business friendly environment we have created. We should sponsor their investment into the exploitation of Australia's hardworking population, burgeoning industrial base, and abundant resources and land."
 AST_claim_melanesia:0 "Claim Melanesia"
 AST_claim_melanesia_desc:0 "The common definition of Australasia includes the Melanesian region to our north, named after the dark skin of its native inhabitants. While we have no interest in actually integrating these natives into our nation, we can still lay our colonial claim to these territories."
 AST_ally_south_east_asian_fasc:0 "Ally SEA Fascists"
 AST_ally_south_east_asian_fasc_desc:0 "There are a growing number of fascist countries in South East Asia who we can reach out to as potential allies."
 AST_indian_ocean_hegemony:0 "Indian Ocean Hegemony"
 AST_indian_ocean_hegemony_desc:0 "The Indian Ocean is the gateway to East Asia, and we are in a position to demand the few but strategically important islands that make up the ocean to our west."
 AST_wunderwaffe:0 "Wunderwaffe"
 AST_wunderwaffe_desc:0 "The SS have access to the various \"Wunderwaffe\" projects that the Germans have been experimenting with. We can use this experience to bolster our special project programs."
 AST_wehrmacht_doctrine:0 "Wehrmacht Doctrime"
 AST_wehrmacht_doctrine_desc:0 "The Wehrmacht are the descendents of the great Prussian army. We should empower our German advisors to implement their expertise to advance the Australian Army into the modern age."
 AST_resource_extraction:0 "Resource Extraction"
 AST_resource_extraction_desc:0 "Our allies are seeking the vast resources of the East Indies, now under our control. The Germans have offered to help with our resource extraction in exchange for greater access to our resource exports."
 #AST_resource_extraction_desc:0 "Our allies are seeking the vast resources of the East Indies, now under our control. The Germans have offered to help with our resource extraction efforts, in exchange for the transfering of all rubber exploitation rights in the event that we gain ownership of these states in a peace deal."
 AST_pacific_hegemony:0 "Pacific Hegemony"
 AST_pacific_hegemony_desc:0 "The Pacific Ocean is resource rich and strategically important. We are now in a position to claim the many islands that make up the ocean to our northeast."
 AST_settler_colonial_ambitions:0 "Settler Colonial Ambitions"
 AST_settler_colonial_ambitions_desc:0 "We should embrace our settler colonial heritage and develop our virgin lands!"
 AST_ally_the_empire:0 "Ally the Empire"
 AST_ally_the_empire_desc:0 "The British Empire has returned with a vengeance and is ready to reverse the decline of the empire. As loyalists the imperial cause, we should join the British in establishing a new Pax Britannica."
 AST_kingdom_of_australia:0 "Kingdom of Australia"
 AST_kingdom_of_australia_desc:0 "While we have already established Edward has the first king of Australia, his exile and persecution by the British cannot stand. We should invite our king to lead his kingdom to glory, under the guiding eye of [AST.GetFascistLeader] and his [AST.GetFascistParty]."
 AST_empower_the_exiles:0 "Empower the Exiles"
 AST_empower_the_exiles_desc:0 "There are a number of high profile pro-Edward holdouts in Great Britain that can be wooed to the Kingdom of Australia now that King Edward is here and in charge."
 AST_imperial_claims:0 "Imperial Claims"
 AST_imperial_claims_desc:0 "We should claim the Asian colonies of the British Empire, in order to strengthen our legitimacy as a revival of the British Empire."
 AST_take_the_jewel:0 "Take the Jewel"
 AST_take_the_jewel_desc:0 "Now that we have Ceylon, we should invade the Jewel of the British Empire, India."
 AST_claim_the_throne:0 "Claim the Throne"
 AST_claim_the_throne_desc:0 "Now that we have conquered India and the Cape, it is time to round the Cape and topple the false government in London."
 AST_strike_on_the_new_world:0 "Strike on the New World"
 AST_strike_on_the_new_world_desc:0 "The Canadians are an integral part of the British Empire, and their continued independence will not be tolerated."
 AST_conquer_the_cape:0 "Conquer the Cape"
 AST_conquer_the_cape_desc:0 "If we are to return to England, we must first take the Cape of Good Hope and return South Africa into the imperial fold."
 #AST_neg_swpa_colonial_empire:0 "Negotiate Colonial Sphere"
 #AST_neg_swpa_colonial_empire_desc:0 ""
 AST_collab_with_the_blackshirts:0 "Collaborate with the Blackshirts"
 AST_collab_with_the_blackshirts_desc:0 "The Blackshirt militia are an inspiration to the [AST.GetFascistParty]. We should invite leading blackshirt organizers to aid in our conquest of hearts, minds, and land."
 AST_spread_fascism_across_pacific:0 "Spread Fascism Across the Pacific"
 AST_spread_fascism_across_pacific_desc:0 "There are many East Asians who would be attracted to the liberating tenants of fascism. We should invest into support fascist parties across the region through propaganda."
 AST_lessons_from_gallipoli:0 "Lessons From Gallipoli"
 AST_lessons_from_gallipoli_desc:0 "With the british as our ally once again, we can utilize the lessons of the disastrous Gallipoli campaign to build a formidable special force of Marines."
 AST_demand_french_indo_pacific_islands:0 "Demand the French Indo-Pacific"
 AST_demand_french_indo_pacific_islands_desc:0 "The French hold many strategically important and resource rich islands across the Indian and Pacific oceans. If we are to project power in either ocean we should acquire these islands one way or another."
 AST_eng_soc:0 "English Socialism"
 AST_eng_soc_desc:0 "The workers of Great Britain have also liberated themselves from the capitalist yoke. We should reach out to our brothers in the north to see if we can once again be allies, now as equal comrades instead of imperial subjects."
 AST_big_brother:0 "Big Brother"
 AST_big_brother_desc:0 "[AST.GetCommunistLeader] is now in the position to consolidate power and act as the patriarch of the nation."
 AST_eng_tech_sharing:0 "Technology Sharing With Union of Britain"
 AST_eng_tech_sharing_desc:0 "The Union of Britain has many of the world's top scientists and technology innovators. They are generous enough to share what they know with us, their brothers in arms."
 AST_unite_australasia:0 "Unite Australasia"
 AST_unite_australasia_desc:0 "A century ago New Zealand/Aotearoa split from the colonial precursor to the state of Australia, and since then we have always be brothers and sisters with our neighbors to the east. Now that we are also comrades in the revolution, it is time that we unite together, using the regional term \"Australasia\"."
 AST_integrate_melanesia:0 "Integrate Melanesia"
 AST_integrate_melanesia_desc:0 "The common definition of Australasia includes the Melanesian region to our north. The native peoples of these islands have suffered greatly under extractive colonial capitalism. We should integrate these people into our nation to uplift them as comrades and equals."
 AST_australian_nuclear_program:0 "Australian Nuclear Program"
 AST_australian_nuclear_program_desc:0 "[AST.GetNameDefCap] is rich with Uranium and has a burgeoning tech sector. While it is a massive investment, acquiring nuclear power could be the key to winning this war and ensuring security and prosperity for all [AST.GetAdjective]s."
 AST_concessions_to_the_unions:0 "Concessions to the Unions"
 AST_concessions_to_the_unions_desc:0 "The Unions brought us to electoral victory, and it is time we repay the favor. The Labor government of [AST.GetLeader] will cooperate and negotiate with the unions to ensure the Australian worker is properly treated and compensated. This will cost us more, but enhance our popular support and worker productivity."
 AST_countrymindedness_loyal:0 "Countrymindedness"
 AST_countrymindedness_loyal_desc:0 "Countrymindedness is the political ethos of the Country Party. We should invest into implementing it on a national scale."
 AST_reunite_with_nzl:0 "Reintegrate New Zealand"
 AST_reunite_with_nzl_desc:0 "New Zealand used to be part of New South Wales, before the British split New Zealand off when they issued the \"Charter for Erecting the Colony of New Zealand.\" It is time we reverse this mistake and integrate New Zealand into [AST.GetNameDef]. While there will be resistance owing the century of separation, their government and military are beholden to the Britain's will."
 AST_port_pirie_railway_junction:0 "Port Pirie Railway Junction"
 AST_port_pirie_railway_junction_desc:0 "A key step to solving the railway muddle will be completing the Port Pirie Railway Junction, fully connecting the Trans-Australian Railway Line to the rest of Australia."
 AST_the_clapp_report:0 "The Clapp Report"
 AST_the_clapp_report_desc:0 "Harold Winthrop Clapp, the Director-General of the Land Transport Board, has released his report commissioned by the government on how to transition Australia's muddled railway gauge system into a uniform track gauge. While his bold suggestions will take decades to fully complete, we should begin implementing his suggestions at once now that we are at peace." 
 AST_expand_yallourn_power_station:0 "Expand Yallourn Power Station"
 AST_expand_yallourn_power_station_desc:0 "Since 1932 the coal-fired power plants Yallourn A & B have provided most of the power to the state of Victoria. By heavily investing into three more power plants (Yallourn C, D, and E) we can massively increase the energy and industrial capacity of the Victoria region."
 AST_invite_immigration_to_tasmania:0 "Promote Immigration to Tasmania"
 AST_invite_immigration_to_tasmania_desc:0 "Tasmania is underdeveloped, with a wealth of untapped potential for hydroelectric energy, modern agriculture, and resource extraction. First we must build a strong industrial base by promoting immigration to Tasmania from the mainland and the rest of the Anglosphere."
 AST_ord_river_irrigation_scheme:0 "Ord River Irrigation Scheme"
 AST_ord_river_irrigation_scheme_desc:0 "The remote Ord River Basin in the north of Western Australia has been shown to have untapped potential for cash crop plantations. We can begin to first steps towards building up the infrastructure in the region by establishing the Ord River Irrigation Area and the town of Kununurra."
 AST_dam_lake_binney:0 "Dam Lake Binney"
 AST_dam_lake_binney_desc:0 "Despite its wealth of lakes and rives, Tasmania has only built the miniscule Waddamana Power Station decades ago. It is time to properly invest in Tasmania and empower the Tasmanian Hydro-Electric Commission to build Tasmania's first modern dam, the Lake Binney Dam."
 AST_begin_snowy_mountains_scheme:0 "Begin Snowy Mountains Scheme"
 AST_begin_snowy_mountains_scheme_desc:0 "The Snowy Mountains Scheme has the potential to revolutionize the energy production in our most populous and most developed state, New South Wales. While it will take decades, to complete this project, we can and should begin at once."
 AST_dam_ord_river:0 "Dam Ord River"
 AST_dam_ord_river_desc:0 "The Ord River Irrigation Area has shown the burgeoning potential for cash crop plantations in the Ord River Basin. We can greatly improve the infrastructure and agricultural viability of the area by constructing a dam on the Ord River."
 AST_expand_snowy_mountains_scheme:0 "Expand Snowy Mountains Scheme"
 AST_expand_snowy_mountains_scheme_desc:0 "The Snowy Mountains Scheme has already had a major impact on the New South Wales economy. With the help of our industrious allies, we will invest further into the scheme, enabling the construction of the many power plants and dams within the scheme to be completed at a faster rate."
 AST_revive_shale_oil_development_committee:0 "Revive Shale Oil Mining"
 AST_revive_shale_oil_development_committee_desc:0 "The Shale Oil Development Committee was formed in 1932 to explore reopening and redevloping the shale oil mines at Newnes, New South Wales. Now that we are in need of energy independence, we can revive this committee and invest into opening shale oil mining throughout New South Wales."
 AST_invest_into_oil_exploration:0 "Invest into Oil Exploration"
 AST_invest_into_oil_exploration_desc:0 "We should invest into oil exploration further into our interior, perhaps we can find oil deposits that can fuel our economy and military."
 AST_pilbara_iron_exploration:0 "Pilbara Iron Exploration"
 AST_pilbara_iron_exploration_desc:0 "Now that we have discovered oil reserves on Barrow Island, we should explore other resource exploitation opportunities in the Pilbara region."
 AST_strategic_bauxite_investment:0 "Strategic Bauxite Investments"
 AST_strategic_bauxite_investment_desc:0 "We have relied primarly on importing Aluminum from the Commonwealth until now, we must bolster domestic Aluminium production by building mines to exploit our known Bauxite deposites."
 AST_bauxite_exploration:0 "Bauxite Exploration"
 AST_bauxite_exploration_desc:0 "We should explore if there are more Bauxite deposits in the remote areas of our vast nation."
 AST_indigenous_air_designs:0 "Indigenous Air Designs"
 AST_indigenous_air_designs_desc:0 "We can invest into [azr_cac_sl]'s design prowess to kistart our indigenous air production. While this will take longer than adapting and utilizing foreign designs, we will have the benefit of the capabilities to design aircraft specifically for our Airforce needs."
 AST_cac_wacket_bomber:0 "[azr_cac_sl] Wackett Bomber"
 AST_cac_wacket_bomber_desc:0 "Lawrence Wackett has proposed a bold new light fighter-bomber design that we can make with the resources available to us now. While its actual practicality is uncertain, its development will enable us to gain new insights into fighter and bomber technology."
 AST_cac_kangaroo:0 "[azr_cac_sl] Kangaroo"
 AST_cac_kangaroo_desc:0 "Lawrence Wackett has proposed another bold new fighter design that could possibly build off of the success of the Boomerang. While Wackett has struggled to bring his designs into reality due to resource and political capital being strained, its development will still enable us to gain new insights into fighter technology."
 AST_cac_ca_23:0 "[azr_cac_sl] Jet Fighter Effort"
 AST_cac_ca_23_desc:0 "As the development of jet fighters has proven more and more viable across the world, the [azr_cac_long_sl] has put together a design proposal for a wholly Australian jet fighter. Code-named [azr_cac_sl] [azr_cac_prefix_sl]-23, this project has the potential to revolutionize our indigenous aircraft industrial capabilities."
 AST_procur_american_models:0 "Procure American Models"
 AST_procur_american_models_desc:0 "Lawrence Wackett, the chief designer of the [azr_cac_long_sl], has led a foreign diplomatic mission seeking out partners to help develop [azr_cac_sl]'s first in-house aircraft. He and his team have selected the NA-16 trainer aircraft by the American company North American Aviation as the blueprint for this plane, dubbing it the [azr_cac_sl] [azr_cac_prefix_sl]-1 Wirraway."
 AST_cac_mustang:0 "[azr_cac_sl] Mustang"
 AST_cac_mustang_desc:0 "North American Aviation have design and built their next generation of fighter-bombers with the NA P-51 Mustang. A formidable machine, we can leverage our connections with North American Aviation from the Wirraway to secure a license to build the P-51 Mustang as the [azr_cac_prefix_sl]-17 Mustang"
 AST_dha_investment:0 "Invest into DHA"
 AST_dha_investment_desc:0 "De Havilland Australia is the Australian branch of the British De Havilland Aircraft Company. They have so far only focused on maintenance of De HAvilland imports. If we invest into them and give them the industrial capacity, they will be able to produce De Havilland aircraft in Australia for our airforce."
 AST_dha_mosquito:0 "DHA Mosquito"
 AST_dha_mosquito_desc:0 "De Havilland have built a flying marvel in the heavy fighter-bomber dubbed Mosquito. With De Havilland Australia, we can manufacture the Mosquito FB here in Australia."
 AST_dha_vampire:0 "DHA Vampire"
 AST_dha_vampire_desc:0 "De Havilland have built a bold new jet fighter in the light jet fighter dubbed Vampire. With De Havilland Australia, we can manufacture the Vampire here in Australia."
 AST_dominate_the_pacific:0 "SWPA Naval Hegemony"
 AST_dominate_the_pacific_desc:0 "Within our advanced and bolstered navy, we should invest further into cementing our naval fleet as the premier navy in the South West Pacific Area."
 AST_request_cc_islands:0 "Request CC Islands"
 AST_request_cc_islands_desc:0 "The Christmas and Cocos islands have been claimed the Australian government. Now that we are equal Commonwealth members with the British, it is time we request these islands be handed over to us."
 AST_aotearoan_alliance:0 "Aotearoan Alliance"
 AST_aotearoan_alliance_desc:0 "Our comrades in Aotearoa are ready to join us in liberating the workers of the Pacific."
 AST_pref:0 "People's Revolutionary Expeditionary Force"
 AST_pref_desc:0 "We must prepare to send our military overseas to fight for the liberation of all oppressed workers. We will form the People's Revolutionary Expeditionary Force and instruct our comrades under colonial rule to prepare for sabotage and agitation to weaken our enemy's resolve and organization."
 AST_big_government:0 "Big Fella's Big Government"
 AST_big_government_desc:0 "Jack Lang has always had big plans for an economically interventionist government. Now that he is in power no one can stop him from realizing those aims."
 AST_spread_anti_communism_across_pacific:0 "Spread Anti-Communism Across the Pacific"
 AST_spread_anti_communism_across_pacific_desc:0 "We must stop the spread of communism to our region at all costs. We must show East Asia that socialism is antithetical to communism, and that communism is a scourge."
 AST_australasian_research_cooperation:0 "Australasian Research Cooperation"
 AST_australasian_research_cooperation_desc:0 "Australians and Kiwis are an intelligent and resourceful people. We must work together to share knowledge and breakthroughs for mutual benefit."
 AST_american_scientific_aid:0 "American Scientific Prowess"
 AST_american_scientific_aid_desc:0 "Our American allies are at the forefront of scientific expertise. We should take advantage of our alliance to advance our shared research goals."
 
 AST_monarchist_coup:0 "King Edward's Coup"
 AST_monarchist_coup_desc:0 "There is a strong monarchist faction in the Australian Armed Forces, who are loyal solely to Edward I. If we mobilize our allies in the media and the military, we can throw off the shackles of the Centralist regime and install Edward as the absolute monarch of a new and wholly Australian kingdom."
 AST_lessons_from_gallipoli_mon:0 "Lessons From Gallipoli"
 AST_lessons_from_gallipoli_mon_desc:0 "We can utilize the lessons of the disastrous Gallipoli campaign to build a formidable special force of Marines."
 AST_demand_french_indo_pacific_islands_mon:0 "Demand the French Indo-Pacific"
 AST_demand_french_indo_pacific_islands_mon_desc:0 "The French hold many strategically important and resource rich islands across the Indian and Pacific oceans. If we are to project power in either ocean we should acquire these islands one way or another."
 AST_imperial_claims_mon:0 "Imperial Claims"
 AST_imperial_claims_mon_desc:0 "We should claim the Asian colonies of the British Empire to establish our sphere of influence."
 AST_australian_east_indies_mon:0 "Australian East Indies"
 AST_australian_east_indies_mon_desc:0 "[INS.GetNameDefCap] is resource rich and ripe for the taking. It will be an excellent addition to our growing empire!"
 AST_naval_reorientation_mon:0 "Naval Reorientation"
 AST_naval_reorientation_mon_desc:0 "Isolated from our any allies and surrounded by enemies, we must reorient our military production toward shipbuilding if we are to have a chance at winning the battle for the Pacific."
 AST_our_home_rule_mon:0 "Rule From Canberra"
 AST_our_home_rule_mon_desc:0 "As our influence and conquest across the South West Pacific Area has spread, a number of puppet states have fallen within our sphere of influence. Now that we are the sovereign of our own growing empire, it is time that direct rule from Canberra be imposed upon these puppet regimes."
 AST_war_on_japan_mon:0 "War on Japan"
 AST_war_on_japan_mon_desc:0 "Japan's aggression has gone on too long. It has raped and pillaged its way through East Asia and now it has its eyes on the lands and resources further south. We cannot stand aside."
 AST_settler_colonial_ambitions_mon:0 "Settler Colonial Ambitions"
 AST_settler_colonial_ambitions_mon_desc:0 "We should embrace our settler colonial heritage and develop our virgin lands!"
 
