 AST_fight_work_or_perish_desc:0 "With our enemy posing an existential threat to [AST.GetNameDef], Australians must make a choice. They will fight, they will work, or they will perish."
 AST_national_security_act_azr:0 "National Security Act"
 AST_national_security_act_azr_desc:0 "Now that we are at war, the Federal government will assume greater powers to protect Australia. Greater press censorship, suppression of dissident groups and greater ability to tax and seize property for the defense of the nation."
 AST_establish_advisory_war_council_azr:0 "[azr_ast_establish_advisory_war_council_sl]"
 azr_ast_establish_advisory_war_council_indy:0 "Defence of Australia Policy"
 azr_ast_establish_advisory_war_council_base:0 "Forward Defence"
 AST_establish_advisory_war_council_azr_desc:0 "[azr_ast_establish_advisory_war_council_desc_sl]"
 azr_ast_establish_advisory_war_council_desc_indy:0 "Australia must refocus on protecting her shores. With the Defence of Australia Policy, we will priotize protection of the \"Air-Sea Gap\" that exists in our northern maritime approaches."
 azr_ast_establish_advisory_war_council_desc_base:0 "Australia must defend its allies first if we are to keep war far from our shores."
 AST_australian_arms_production_azr:0 "Australian Arms Production"
 AST_australian_arms_production_azr_desc:0 "The long convoy times mean that Australia must take a greater responsibility for producing its own guns than other Dominions. We have the factories, and we have the know-how."
 azr_ast_australian_arms_production_desc_indy:0 "Australia must invest into producing its own guns. We have the factories, and we have the know-how."
 azr_ast_australian_arms_production_desc_base:0 "The long convoy times mean that Australia must take a greater responsibility for producing its own guns than other Dominions. We have the factories, and we have the know-how."
 AST_royal_australian_submarine_service_azr:0 "[azr_ast_royal_australian_submarine_service_sl]"
 azr_ast_royal_australian_submarine_service_com:0 "Australian People's Submarine Service"
 azr_ast_royal_australian_submarine_service_indy:0 "Australian Submarine Service"
 azr_ast_royal_australian_submarine_service_base:0 "Royal Australian Submarine Service"
 AST_royal_australian_submarine_service_azr_desc:0 "[azr_ast_royal_australian_submarine_service_desc_sl]"
 azr_ast_royal_australian_submarine_service_desc_com:0 "Submarines are the sea weapon of the future, and a crucial component in our fight to liberate the Pacific of capitalist imperialism. We must embrace this way of war."
 azr_ast_royal_australian_submarine_service_desc_indy:0 "Submarines are the sea weapon of the future, and a crucial component in the defence of the country. We must embrace this way of war."
 azr_ast_royal_australian_submarine_service_desc_base:0 "Submarines are the sea weapon of the future, and a crucial component of our allies' forces. We must embrace this way of war."
 AST_volunteer_air_observers_corps_azr:0 "Volunteer Air Observers Corps"
 AST_volunteer_air_observers_corps_azr_desc:0 "Keep your eyes on the skies! We call on Australians to learn the silhouettes of common aircraft and notify the government of any suspicious or enemy planes that near our borders."
 AST_cac_woomera_azr:0 "[azr_cac_sl] Woomera"
 AST_cac_woomera_azr_desc:0 "[cac_woomera_desc_sl]"
 cac_woomera_desc_com:0 ""With the knowledge from the Wackett Bomber, Lawrence Wackett and his team at the recently nationalized Australian People's National Aircraft Corporation, formerly the Commonwealth Aircraft Corporation, will develop a multi-role fighter-bomber code-named Woomera."
 cac_woomera_desc_indy:0 ""With the knowledge from the Wackett Bomber, Lawrence Wackett and his team at the recently renamed Australian Aircraft Corporation, formerly the Commonwealth Aircraft Corporation, will develop a multi-role fighter-bomber code-named Woomera."
 cac_woomera_desc_base:0 "With the knowledge from the Wackett Bomber, Lawrence Wackett and his team at the Commonwealth Aircraft Corporation will develop a multi-role fighter-bomber code-named Woomera."
 AST_cac_boomerang_azr:0 "[azr_cac_sl] Boomerang"
 AST_cac_boomerang_azr_desc:0 "The Boomerang will be [AST.GetNameDef]'s contribution to fighter design and an insurance policy against the loss of imported aircraft. We need to compete with Japanese and American planes."
 AST_hmas_assault_azr:0 "HMAS Assault"
 azr_ast_hmas_assault_com:0 "Australian People's Ship Assault"
 azr_ast_hmas_assault_indy:0 "Australian Ship Assault"
 azr_ast_hmas_assault_base:0 "HMAS Assault"
 AST_hmas_assault_azr_desc:0 "War in the Pacific will be an amphibious war, so the construction of a naval base specialized in training marines how to take a beach is imperative for the war effort."
 AST_royal_australian_artillery_azr:0 "[azr_ast_royal_australian_artillery_sl]"
 azr_ast_royal_australian_artillery_com:0 "Australian People's Artillery"
 azr_ast_royal_australian_artillery_indy:0 "Australian Artillery"
 azr_ast_royal_australian_artillery_base:0 "Royal Australian Artillery"
 AST_royal_australian_artillery_azr_desc:0 "Artillery is the queen of the battlefield, and we must expand our access to heavy guns."
 
 NZL_form_the_rnzn_azr:0 "[azr_nzl_form_the_rnzn_sl]"
 azr_nzl_form_the_rnzn_indy:0 "Form the NZN"
 azr_nzl_form_the_rnzn_com:0 "Form the PAN"
 azr_nzl_form_the_rnzn_base:0 "Form the RNZN"
 NZL_form_the_rnzn_azr_desc:0 "[azr_nzl_form_the_rnzn_desc_sl]"
 azr_nzl_form_the_rnzn_desc_indy:0 "Our once small coastal patrol has now grown to include ships that can operate independently and protect the seas around New Zealand. We will form the New Zealand Navy."
 azr_nzl_form_the_rnzn_desc_com:0 "Our once small coastal patrol has now grown to include ships that can operate independently and protect the seas around Aotearoa. The People's Republic of Aotearoa will form the People's Aotearoan Navy."
 azr_nzl_form_the_rnzn_desc_base:0 "Our once small coastal patrol has now grown to include ships that can operate independently from Royal Navy supervision. New Zealand will form the Royal New Zealand Navy."
 NZL_form_the_rnzaf_azr:0 "[azr_nzl_form_the_rnzaf_sl]"
 azr_nzl_form_the_rnzaf_indy:0 "Form the NZAF"
 azr_nzl_form_the_rnzaf_com:0 "Form the PAAF"
 azr_nzl_form_the_rnzaf_base:0 "Form the RNZAF"
 NZL_form_the_rnzaf_azr_desc:0 "[azr_nzl_form_the_rnzaf_desc_sl]"
 azr_nzl_form_the_rnzaf_desc_indy:0 "The time has come to make the air force independent of the other combat arms. The New Zealand Air Force will have its own command structure to protect the skies of new Zealand."
 azr_nzl_form_the_rnzaf_desc_com:0 "The time has come to make the air force independent of the other combat arms. The People's Aotearoan Air Force will have its own command structure and showcase the might and prowess of the Aotearoan people."
 azr_nzl_form_the_rnzaf_desc_base:0 "The time has come to make the air force independent of the other combat arms. The Royal New Zealand Air Force will have its own command structure but co-operate closely with the Royal Air Force."
 
