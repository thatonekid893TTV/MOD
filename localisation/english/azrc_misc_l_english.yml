 # events
 mmr_ast.1.t:0 "[GetYear] Australian Federal Election"
 mmr_ast.1.desc:0 "The citizens of Australia go to the polls today to decide who will lead their nation for the next 3 years. Will the United Australia Party continue its electoral dominance, or will the Labor Party deny the UAP and their allies in the Country Party a majority of the seats?"
 mmr_ast.1.a:0 "UAP Victory"
 mmr_ast.1.b:0 "Hung Election"
 mmr_ast.101.t:0 "[GetYear] Australian Federal Election"
 mmr_ast.101.desc:0 "The citizens of Australia go to the polls again for the second time in 3 months to decide who will lead their nation for the next 3 years. Will the United Australia Party convince voters that they are the only party to lead the country out of this political crisis, will the Labor Party produce a decisive victory, or will the Country Party take advantage of the crisis to produce an unprecendented electoral upset?"
 mmr_ast.101.a:0 "UAP Decisive Victory"
 mmr_ast.101.b:0 "Labor Party Decisive Victory"
 mmr_ast.101.c:0 "Country Party Decisive Victory"
 mmr_ast.2.t:0 "Joseph Lyons Dead"
 mmr_ast.2.desc:0 "Joseph Lyons, the bulwark of the United Australia Party, has died today. He leaves a legacy of stalwart conservativism and liberal economic policy as he steered Australia through the Great Depression."
 mmr_ast.2.a:0 "Australia mourns his death."
 mmr_ast.3.t:0 "Page Resigns"
 mmr_ast.3.desc:0 "Earle Page, the leader of the Country Party, which is in a governing coalition with the UAP, has resigned, citing difficulty in working with the new leader of the UAP, Robert Menzies."
 mmr_ast.3.a:0 "The coalition has survived this spat."
 mmr_ast.4.t:0 "[GetYear] Australian Federal Election"
 mmr_ast.4.desc:0 "[mmr_ast_4_desc_sl]"
 mmr_ast_4_desc_nc:0 "The citizens of Australia go to the polls today to decide who will lead their nation for the next 3 years in this hotly contested election. Will the United Australia Party convince voters that Menzies' new leadership has reformed the party, or will the Labor Party's appeal to the union workers and sufferers of the Great Depression lead them to victory?"
 mmr_ast_4_desc_c:0 "The citizens of Australia go to the polls today to decide who will lead their nation for the next 3 years in this hotly contested election. Will the United Australia Party convince voters that Menzies' new leadership has reformed the party, will the Labor Party's appeal to the union workers and sufferers of the Great Depression lead them to victory, or will the Country Party hold onto electoral power for another term?"
 mmr_ast.4.a:0 "UAP Narrow Victory"
 mmr_ast.4.b:0 "Labor Party Narrow Victory"
 mmr_ast.4.c:0 "Country Party Narrow Victory"
 mmr_ast.401.t:0 "Page Challenged For Party Leadership"
 mmr_ast.401.desc:0 "Earle Page, the leader of the Country Party, has been challenged by Country Party political upstart Archie Cameron for his leadership position. Facing credible support within the party for Cameron due to his controversial leadership, Page may well be ousted from the Prime Ministership. However, if the party is deadlocked Arthur Fadden has positioned himself as a compromise candidate."
 mmr_ast.401.a:0 "Fadden leads as compromise."
 mmr_ast.401.b:0 "Cameron ousts Page."
 mmr_ast.401.c:0 "Page holds onto power."
 mmr_ast.402.t:0 "Cameron Challenged For Party Leadership"
 mmr_ast.402.desc:0 "Archie Cameron, the leader of the Country Party, has been challenged by Country Party political upstart Arthur Fadden for his leadership position. Facing credible support within the party for Fadden due to the his expert politicking, Cameron may well be ousted from the Prime Ministership."
 mmr_ast.402.a:0 "Fadden ousts Cameron."
 mmr_ast.402.b:0 "Cameron holds onto power."
 mmr_ast.5.t:0 "[AST.GetLeader] Proposes Unity Government"
 mmr_ast.5.desc:0 "Facing increasing unpopularity from within the [AST.GetRulingPartyLong] and from the opposition, alongside the pressures of the war, [AST.GetLeader] has reached out to the opposition with a proposal for a \"National Unity Government\" that will thwart the looming vote of no confidence that his government faces."
 mmr_ast.5.a:0 "Opposition rejects a \"National Unity Government\"."
 mmr_ast.5.b:0 "Opposition agrees to a \"National Unity Government\"."
 mmr_ast.501.t:0 "[AST.GetLeader] Offers Advisory War Council"
 mmr_ast.501.desc:0 "Recognizing the necessity of government unity on the warfront even if it cannot be united entirely, [AST.GetLeader] has now reached out to the opposition with a proposal for an \"Advisory War Council\" to dictate the war effort which will be dominated by [AST.GetRulingPartyLong] MPs. While this cannot thwart a no confidence vote, if the opposition reject this offer they will not have the political influence or capital to pull off a successful vote of no confidence."
 mmr_ast.501.a:0 "The security of Australia must rise above political squabbles."
 mmr_ast.501.b:0 "Opposition rejects the \"Advisory War Council\""
 mmr_ast.6.t:0 "Vote of No Confidence in [AST.GetLeader]"
 mmr_ast.6.desc:0 "Facing increasing unpopularity from within the [AST.GetRulingPartyLong] and from the opposition, alongside the pressures of the war, [AST.GetLeader] has lost a vote of no confidence in his government, with a number of MPs from within his party crossing the aisle to take down his government."
 mmr_ast.6.a:0 "A historic upset."
 mmr_ast.7.t:0 "[GetYear] Australian Federal Election"
 mmr_ast.7.desc:0 "[mmr_ast_7_desc_sl]"
 mmr_ast_7_desc_nc:0 "The citizens of Australia go to the polls today to decide who will lead their nation for the next 3 years in this hotly contested election. Will the United Australia Party convince voters that Menzies can be trusted to lead this party through these turbulent times, or will the Labor Party's unity under Curtin and appeal to the union workers lead them to victory?"
 mmr_ast_7_desc_c:0 "The citizens of Australia go to the polls today to decide who will lead their nation for the next 3 years in this hotly contested election. Will the United Australia Party convince voters that Menzies can be trusted to lead this party through these turbulent times, will the Labor Party's unity under Curtin and appeal to the union workers lead them to victory, or will the Country Party hold onto electoral power for another term?"
 mmr_ast.7.a:0 "Landslide Labor Party Victory"
 mmr_ast.7.b:0 "UAP Narrow Victory"
 mmr_ast.7.c:0 "Country Party Narrow Victory"
 mmr_ast.8.t:0 "Liberal Party is Formed"
 mmr_ast.8.desc:0 "Reeling from electoral challenges and internal strife, the UAP has decided to reform itself into the Liberal Party, hoping that they can win back voters with a more efficient and effective party centered around Menzies' leadership."
 mmr_ast.8.a:0 "Will this save Menzies' career?"
 mmr_ast.9.t:0 "John Curtin Dead"
 mmr_ast.9.desc:0 "John Curtin, the powerful and political savvy leader of the Labor Party, has died today. He leaves a legacy of strong leadership and union empowerment. Ben Chifley, Labor's democratic socialist chief economist, take's Curtin's place as leader of the Labor Party."
 mmr_ast.9.a:0 "May he rest in peace."
 mmr_ast.9.b:0 "Capitalist scum."
 mmr_ast.9.c:0 "Communist scum."
 mmr_ast.10.t:0 "[GetYear] Australian Federal Election"
 mmr_ast.10.desc:0 "[mmr_ast_10_desc_sl]"
 mmr_ast_10_desc_nc:0 "The citizens of Australia go to the polls today to decide who will lead their nation for the next 3 years. The Liberal Party and the Labor Party continue to dominate the political landscape with competing visions for Australia, while the Country Party remaining in coalition with the Liberals."
 mmr_ast_10_desc_c:0 "The citizens of Australia go to the polls today to decide who will lead their nation for the next 3 years. The Country Party has demonstrated that it is a formidable force in Australian politics, but it remains to be seen if it can with a fourth term."
 mmr_ast.10.a:0 "Labor Party Victory"
 mmr_ast.10.b:0 "Liberal Party Victory"
 mmr_ast.10.c:0 "Country Party Victory"
 mmr_ast.11.t:0 "[GetYear] Australian Federal Election"
 mmr_ast.11.desc:0 "[mmr_ast_11_desc_sl]"
 mmr_ast_11_desc_nc:0 "The citizens of Australia go to the polls today to decide who will lead their nation for the next 3 years. The Liberal Party and the Labor Party continue to dominate the political landscape with competing visions for Australia in the coming decade, while the Country Party remaining in coalition with the Liberals."
 mmr_ast_11_desc_c:0 "The citizens of Australia go to the polls today to decide who will lead their nation for the next 3 years. The Country Party has demonstrated that it is a formidable force in Australian politics, but it remains to be seen if it can with a fifth term and lead the country into the 50s."
 mmr_ast.11.a:0 "Labor Party Victory"
 mmr_ast.11.b:0 "Liberal Party Victory"
 mmr_ast.11.c:0 "Country Party Victory"
 mmr_ast.12.t:0 "CPA Leadership Contested"
 mmr_ast.12.desc:0 "Jack Miles, a devoted Stalinist, has contested Dixon's leadership of the Communist Party of Australia. He has appealed to the many Stalinists within the party, calling out Dixon as a Trotskyite and a revisionist. These are dangerous claims, and it is likely only one of these two comrades will make it out of this power struggle."
 mmr_ast.12.a:0 "Dixon disposes of Miles and suppresses dissent."
 mmr_ast.12.b:0 "Miles usurps and eliminates Dixon."
 mmr_ast.13.t:0 "Vote Of No Confidence in [AST.GetLeader]"
 mmr_ast.13.desc:0 "Facing increasing unpopularity from within the [AST.GetRulingPartyLong] and from the opposition due to his handling of the withdrawal from the Commonwealth and the hasty formation of the republic, [AST.GetLeader] has lost a vote of no confidence in his government, with a number of MPs from within his party crossing the aisle to take down his government. The [AST.GetRulingPartyLong] must choose a new leader posthaste if they are to stay in power without [AST.GetLeader]'s leadership."
 mmr_ast.13.a:0 "The republic rebels against its founder."
 mmr_ast.13.b:0 "Labor MPs rebuke Chifley and elect Lang."
 mmr_ast.14.t:0 "New Guard Resurgent"
 mmr_ast.14.desc:0 "The ultranationalist and fascist adjacent New Guard, which until now had faded into obscurity after its political and organizational collapse in the early 30s, has resurged in popularity in response to the governments actions towards cutting ties with the British Crown and Commonwealth. Rallying around conservative working class support for the King and Australia's colonial and imperial legacy, the New Guard's former leaders in the armed forces present a new and growing threat to the status quo in Australia."
 mmr_ast.14.a:0 "A dangerous development."
 mmr_ast.141.t:0 "Crackdown on the New Guard"
 mmr_ast.141.desc:0 "[AST.GetLeader] has announced a nationwide crackdown on the resurgent ultranationalist and fascist adjacent New Guard. In response, a number of New Guard allied military leaders have resigned or retired."
 mmr_ast.141.a:0 "Fascism has no place in Australia!"
 mmr_ast.142.t:0 "Concessions to the New Guard"
 mmr_ast.142.desc:0 "[AST.GetLeader] has announced a comprehensive deal made between the resurgent ultranationalist and fascist adjacent New Guard and the government. In exchange for political amnesty and the recognition of the British Crown as constitutional monarchs of Australia, the New Guard will renounce violence and openly support the [AST.GetRulingPartyLong]."
 mmr_ast.142.a:0 "Hopefully this will placate these radicals."
 mmr_ast.143.t:0 "New Guard Purged"
 mmr_ast.143.desc:0 "[AST.GetLeader] has announced a major purge has been carried out throughout the armed forces after plans for a military coup by New Guard elements and allies within the military were discovered. While this may have a disorganizing and cowing effect on the armed forces in the short term, it is necessary to prevent the reactionary Fascists from taking over."
 mmr_ast.143.a:0 "Unprecendented threats require unprecendented action"
 mmr_ast.144.t:0 "New Guard Putsch"
 mmr_ast.144.desc:0 "Eric Campbell, high ranking military general and leader of the New Guard, has taken to the radio to announce that in order to restore order and prevent socialist elements from infiltrating the government, the military has marched on Canberra and arrested parliament and the prime minister. For now, it seems that the New Guard, backed by most of the military, has seized control of the country."
 mmr_ast.144.a:0 "A New Australia!"
 mmr_ast.145.t:0 "Jindyworobak Coup"
 mmr_ast.145.desc:0 "William John Miles, charismatic leader of the Jindyworobak movement, has taken to the radio to announce that his followers have marched on Canberra, stormed Parliament House, and arrested the parliamentarian elite as well as the prime minister, establishing a new revolutionary Jindyworobak government in its place that is by Australians, for Australians. Citing counter-revolutionary elements in the military, a number of high ranking officers connected to the New Guard have been arrested by junior officers loyal to the Jindyworobak cause, effectively eliminating the New Guard from the political landscape, as the Centre Party's supporters flock to the newly formed Australia First Party formed by Miles and his right hand man P.R. Stephenson. For now, it seems that the Australia First Party, backed by most of the military, has seized control of the country."
 mmr_ast.145.a:0 "Australia for Australians!"
 mmr_ast.15.t:0 "[From.GetNameDefCap] Requests to Join Axis"
 mmr_ast.15.desc:0 "Following the formal departure of [From.GetNameDef] from the Commonwealth, the [From.GetAdjective] government is now looking for new allies. Between the Axis' leadership role in the global Fascist movement and the ties that the [AST.GetRulingPartyLong] has with the Nazi Party, [From.GetNameDef] sees its future remaining with Europe."
 mmr_ast.15.a:0 "We would be happy to call them our ally!"
 mmr_ast.15.b:0 "We can protect our interests better without them."
 mmr_ast.151.t:0 "[From.GetNameDefCap] Agrees to Alliance"
 mmr_ast.151.desc:0 "Recognizing the obvious benefits of military and economic partnership, [From.GetNameDef] has agreed to our proposal of expanding the Axis to the SWPA."
 mmr_ast.151.a:0 "Australia remains a European bastion in Asia."
 mmr_ast.152.t:0 "[From.GetNameDefCap] Declines Alliance"
 mmr_ast.152.desc:0 "Whether it is failure to acknowledge our shared European history, or simply a matter of political opportunism, [From.GetNameDef] has declined our request to join the Axis."
 mmr_ast.152.a:0 "We will still do what we can for our corner of the world."
 mmr_ast.16.t:0 "Aboriginal New Deal"
 mmr_ast.16.desc:0 "After the controversial yet politically powerful Day of Mourning protest on Australia Day and the 150th anniversary of the arrival of the First Fleet, [AST.GetLeader] has directed his government to open talks with the leader of the protest, Aboriginal activist and lawyer Jack Patten. What has come from this is a formally published government white paper outlining changes to the government's treatment of Aboriginal's and a \"final objective\" for the Australian federal government in its policy on Indigenous Australians.\n\nThis will entail \"the raising of (the) status (of the Aboriginals) so as to entitle them by right and by qualification to the ordinary rights of citizenship and enable them and help them to share with us the opportunities that available in their own native land.\"\n\nWhile committing to the eventual citizenship, recognition of ancestral land rights, and integration of Aboriginals into Australian society, the white paper does not included a timeline, leaving it up to speculation whether the government will follow through with these ambitious but morally righteous goals. In the meantime, the government's policy in the Northern Territory, commonly known as Top End, in which the majority of Aboriginal's live, will be representative of how willing they actually are to actually accomplishing the \"final objective\" as outline in the white paper."
 mmr_ast.16.a:0 "A first step towards reconcilation."
 mmr_ast.17.t:0 "William John Miles Dead"
 mmr_ast.17.desc:0 "William John Miles, the enigmatic and charismatic leader of the Australia First Party, has died today. He leaves a legacy of radical conservativism and nativism and a unique and idosyncratic political ideology and cultural philosophy ideology."
 mmr_ast.17.a:0 "P. R. Stephensen will carry on his work."
 mmr_ast.17.b:0 "Moses Gabb launches a coup!"
 mmr_ast.171.t:0 "William John Miles Dead"
 mmr_ast.171.desc:0 "William John Miles, the enigmatic and charismatic founder of the Australia First Party, has died today. He leaves a legacy of radical conservativism and nativism and a unique and idosyncratic political ideology and cultural philosophy ideology."
 mmr_ast.171.a:0 "The nation mourns his death."
 mmr_ast.18.t:0 "1940 Canberra Air Disaster"
 mmr_ast.18.desc:0 "On the 13th of August, 1940 a plane carrying a number of government officials and miltiary personnel crashed near the capital, Canberra. This has shaken the government and military and has severely weakened the [AST.GetRulingPartyLong] government of [AST.GetLeader], starting a government crisis."
 mmr_ast.18.a:0 "A national tragedy."
 mmr_ast.100.t:0 "Australasia United"
 mmr_ast.100.desc:0 "Despite their long and interconnected history history, Australia and New Zealand haven't been unified for roughly a century. Now however, the these brother states have united in a co-equal political union, and formed the super-state of Australasia."
 mmr_ast.100.a:0 "A new dawn for the Southern Pacific."
 mmr_ast.19.t:0 "Lang Labour Reconciliation"
 mmr_ast.19.desc:0 "John Curtin's Labor Party has been in talks with Jack Lang, the populist and radical leader of of the Lang Labor offshoot political party which threatens to split the Labor vote in Lang's home state of New South Wales, regarding reconciliation and reintegration of their party into the federal Labor Party. Curtin is now finalizing the negotiations, but he must make the final decision regarding whether this deal should go through."
 mmr_ast.19.a:0 "Curtin will absorb Lang to minimize his electoral damage to Labor."
 mmr_ast.19.b:0 "Curtin doesn't need Lang nor his gang of radicals."
 mmr_ast.20.t:0 "[From.GetNameDefCap] Requests to Join our Alliance"
 mmr_ast.20.desc:0 "Following the formal departure of [From.GetNameDef] from the Commonwealth, the [From.GetAdjective] government is now looking for new allies. The young republic's charismatic and populist leader Jack Lang shares our socialist values and has invested significant political capital into promoting our shared populist socialist republican values."
 mmr_ast.20.a:0 "We would be happy to call them our ally!"
 mmr_ast.20.b:0 "We can protect our interests better without them."
 mmr_ast.201.t:0 "[From.GetNameDefCap] Agrees to Alliance"
 mmr_ast.201.desc:0 "Recognizing the obvious benefits of military and economic partnership, [From.GetNameDef] has agreed to our proposal of expanding the [MEX.GetFactionName] to include [AST.GetNameDef]."
 mmr_ast.201.a:0 "Lang leads Australia into a fruitful cross-pacific partnership."
 mmr_ast.202.t:0 "[From.GetNameDefCap] Declines Alliance"
 mmr_ast.202.desc:0 "Whether it is failure to acknowledge our shared republican and socialist values, or simply a matter of political opportunism, [From.GetNameDef] has declined our request to join the [MEX.GetFactionName]."
 mmr_ast.202.a:0 "We will still do what we can for our corner of the world."
 mmr_ast.21.t:0 "[From.GetNameDefCap] Invites us to the [FROM.GetFactionName]"
 mmr_ast.21.desc:0 "Following the takeover of the country by the Fascist [FROM.GetRulingPartyLong], [FROM.GetName] has reached out to [ROOT.GetLeader] to propose a military alliance, highlighting our shared East Asian and Fascist connections. With the Pacific seemingly on the brink of a new, costly conflict, and the strategic value of [From.GetNameDef] to any potential conflict in the Pacific, a partnership may be in our best interest."
 mmr_ast.21.a:0 "We would be happy to call them our ally!"
 mmr_ast.21.b:0 "We cannot afford to get caught up in regional conflicts."
 mmr_ast.211.t:0 "[From.GetNameDefCap] Agrees to join the [ROOT.GetFactionName]"
 mmr_ast.211.desc:0 "Recognizing the obvious benefits of military cooperation, [FROM.GetNameDef] has agreed to our invitation to the [ROOT.GetFactionName]."
 mmr_ast.211.a:0 "We will conquer Asia and the Pacific together!"
 mmr_ast.212.t:0 "[From.GetNameDefCap] Declines Invitation to the [ROOT.GetFactionName]"
 mmr_ast.212.desc:0 "Whether it is failure to acknowledge our shared regional and idoelogical connections, or simply a matter of political opportunism, [From.GetNameDef] has declined our offer of military cooperation.\n\nWhile their participation would have been a great asset, we should move forwards with our own agenda, towards our own goals."
 mmr_ast.212.a:0 "If they are not our ally, then they are our enemy."
 mmr_ast.22.t:0 "[From.GetNameDefCap] Demands Our Indo-Pacific Colonies"
 mmr_ast.22.desc:0 "Following the takeover of the country by the Fascist [FROM.GetRulingPartyLong], and their alliance with the Fascists in Britain, [FROM.GetName] has become a threat to our colonial empire in the Indian and Pacific oceans. Now, they are threatening war over these islands. Do we defend our colonial empire from this Anglo aggression, or abandon them to buy more time and refocus our defences on less far flung colonies."
 mmr_ast.22.a:0 "We cannot hold these islands even if we tried."
 mmr_ast.22.b:0 "We cannot let the Anglo Fascists rampage across the world unchallenged."
 mmr_ast.221.t:0 "[From.GetNameDefCap] Hands Over Indo-Pacific Colonies"
 mmr_ast.221.desc:0 "Recognizing their obvious inability to defend their Pacific and Indian ocean empire, [FROM.GetNameDef] has agreed to hand over their island colonies in these oceans to us."
 mmr_ast.221.a:0 "A glorious day for the growing Australian Empire!"
 mmr_ast.222.t:0 "[From.GetNameDefCap] Refuses to Hand Over Indo-Pacific Colonies"
 mmr_ast.222.desc:0 "The haughty French still think that they can be a colonial power without the support of the Anglosphere."
 mmr_ast.222.a:0 "They will have to learn their place in the New World Order."
 mmr_ast.24.t:0 "Kingdom of Australia Proclaimed!"
 mmr_ast.24.desc:0 "With the ouster of King Edward VIII due to his marriage to an American, the Australian New Guard has rallied around him as King George VI has rejected Fascism and emphasized the democratic and constitutional role of the British Monarchy. Eric Campbell has invited Edward to Australia to become Edward I, the first King of Australia. We can empower Edward further, challenge George VI's reign and the liberal democratic regime in Westminster."
 mmr_ast.24.a:0 "God Save the King!"
 mmr_ast.24.b:0 "The colonial capitalists are desperate."
 mmr_ast.24.c:0 "A desperate act of authoritarianism and monarchism."
 mmr_ast.24.d:0 "Concerning."
 mmr_ast.25.t:0 "[From.GetNameDefCap] Requests to Join our Alliance"
 mmr_ast.25.desc:0 "Following the formal departure of [From.GetNameDef] from the Commonwealth, the [From.GetAdjective] government is now looking for new allies. The young republic looks to [USA.GetNameDef] as a bastion of liberty and democracy in a increasingly authoritarian and radical world."
 mmr_ast.25.a:0 "We would be happy to call them our ally!"
 mmr_ast.25.b:0 "We can protect our interests better without them."
 mmr_ast.251.t:0 "[From.GetNameDefCap] Agrees to Alliance"
 mmr_ast.251.desc:0 "Recognizing the obvious benefits of military and economic partnership, [From.GetNameDef] has agreed to our proposal of expanding the [USA.GetFactionName] to include [AST.GetNameDef]."
 mmr_ast.251.a:0 "Australia has found a cross-Pacific protector."
 mmr_ast.252.t:0 "[From.GetNameDefCap] Declines Alliance"
 mmr_ast.252.desc:0 "Whether it is failure to acknowledge our shared republican values and Anglo heritage, or simply a matter of political opportunism, [From.GetNameDef] has declined our request to join the [USA.GetFactionName]."
 mmr_ast.252.a:0 "We will still do what we can for our corner of the world."
 mmr_ast.26.t:0 "[From.GetNameDefCap] Demands Our Indian Ocean Colonies"
 mmr_ast.26.desc:0 "Following the takeover of the country by the Fascist [FROM.GetRulingPartyLong], [FROM.GetName] has become a threat to our colonies in the Indian Ocean. Now, they are threatening war over these islands. Do we defend our colonial empire from this [AST.GetAdjective] aggression, or abandon them to buy more time and refocus our defences on less far flung colonies."
 mmr_ast.26.a:0 "We cannot hold these islands even if we tried."
 mmr_ast.26.b:0 "We cannot let these criminal scum rampage across the world unchallenged!"
 mmr_ast.261.t:0 "[From.GetNameDefCap] Hands Over Indian Ocean Colonies"
 mmr_ast.261.desc:0 "Recognizing their obvious inability to defend their Indian Ocean colonies, [FROM.GetNameDef] has agreed to hand them over to us."
 mmr_ast.261.a:0 "A glorious day for the growing Australian Empire!"
 mmr_ast.262.t:0 "[From.GetNameDefCap] Refuses to Hand Over Indo-Pacific Colonies"
 mmr_ast.262.desc:0 "The [FROM.GetAdjective] still think that they have a right to be a colonial power."
 mmr_ast.262.a:0 "They will have to learn their place in the New World Order."
 mmr_ast.27.t:0 "FRUMEL Founded"
 mmr_ast.27.desc:0 "The Australian and US signals intelligence services have been collaborating for some time now. With the investment of Australia into a base of operations for US Navy decryptors in melbourne, we have been able to found the \"Fleet Radio Unit, Melbourne\", or FRUMEL for short. This will greatly boost our ability to decrypt the enemy's cyphers and coordinate intellignece gather from battles."
 mmr_ast.27.a:0 "A welcome development."
 mmr_ast.28.t:0 "[From.GetNameDefCap] Requests to Join the British Communist Alternative"
 mmr_ast.28.desc:0 "Following the formal departure of [From.GetNameDef] from the Commonwealth, the workers of [From.GetNameDef] have risen up and installed a Marxist revoltuionary government in Canberra. The young socialist state has reached out to us in brotherly comradeship seeking to join our alliance of Marxist-Leninist states against Stalin and his Comintern."
 mmr_ast.28.a:0 "We would be happy to call them our comrade!"
 mmr_ast.28.b:0 "We can protect our interests better without them."
 mmr_ast.281.t:0 "[From.GetNameDefCap] Agrees to Alliance"
 mmr_ast.281.desc:0 "Recognizing the obvious benefits of military and economic partnership, as well as our shared Marxist values, historical connection, and cultural kinship, [From.GetNameDef] has agreed to our request of to join the British Communist Alternative"
 mmr_ast.281.a:0 "Australia has found a cross-Pacific protector."
 mmr_ast.282.t:0 "[From.GetNameDefCap] Declines Alliance"
 mmr_ast.282.desc:0 "Whether it is failure to acknowledge our shared Marxist and anti-Stalinist values, or simply a matter of political opportunism, [From.GetNameDef] has declined our request to join the British Communist Alternative."
 mmr_ast.282.a:0 "We will still do what we can for our corner of the world."
 mmr_ast.29.t:0 "[From.GetNameDefCap] Requests Transfer of Claimed Island Territory"
 mmr_ast.29.desc:0 "Now that we are allied as equals, the [From.GetRulingPartyLong] government of [From.GetLeader] has reached out to us requesting the transfer of small island territory off the coast of Western Australia that we are in possession of, but [From.GetNameDef] claim."
 mmr_ast.29.a:0 "Our relationship with [From.GetNameDef] is far more important than some rocks."
 mmr_ast.29.b:0 "Our territorial integrity is paramount!"
 mmr_ast.291.t:0 "[From.GetNameDefCap] Agrees to the Transfer of Claimed Island Territory"
 mmr_ast.291.desc:0 "Recognizing [ROOT.GetNameDef]'s valid claim to their island colonies, [From.GetNameDef] has agreed to transfer to us our claimed lands as a gesture of goodwill."
 mmr_ast.291.a:0 "[ROOT.GetLeader] is a master diplomat."
 mmr_ast.292.t:0 "[From.GetNameDefCap] Declines the Transfer of Claimed Island Territory"
 mmr_ast.292.desc:0 "The arrogant imperialists of [From.GetNameDef] have refused our humble request to reclaim our rightful territory."
 mmr_ast.292.a:0 "How dare they!"
 mmr_ast.30.t:0 "High Court Blocks Controversial Bank Nationalisation Effort"
 mmr_ast.30.desc:0 "Following Chifley and Labor being smeared in the press and middle-class opinion turning against them after Chifley began his landmark bank nationalisation effort, the High Court of Australia has intervened to deem his efforts unconstitutional. Chifley must now decide whether he wants to push forth illegally, appeal the decision to the Privy Council, or abandon his efforts." 
 mmr_ast.30.a:0 "Appealing the courts decision is the only legal route to achieving our nationalisation aims."
 mmr_ast.30.b:0 "The courts are corrupt puppets of the scared capitalist class, we will proceed as planned."
 mmr_ast.30.c:0 "We must lick our wounds and seek to regain middle class support by abandoning this effort."
 mmr_ast.301.t:0 "Privy Council Backs High Court"
 mmr_ast.301.desc:0 "The Privy Council has decided to back the High Court in blocking Chifley's landmark bank nationalisation effort. Now Chifley is left with no more legal avenues, and must decide whether to spurn the courts, try to enact legal legislation that is less severe, or abandon the cause to put the power of the banks in the hands of the government."
 mmr_ast.301.a:0 "We will pass legal legislation to empower the federal reserve and establish a national bank."
 mmr_ast.301.b:0 "The courts are corrupt puppets of the scared capitalist class, we will proceed as planned."
 mmr_ast.301.c:0 "We must lick our wounds and seek to regain middle class support by abandoning this effort."
 mmr_ast.31.t:0 "[From.GetNameDefCap] Requests to Rejoin [ROOT.GetFactionName]"
 mmr_ast.31.desc:0 "Following the formal departure of [From.GetNameDef] from the Commonwealth, the [From.GetAdjective] government is now looking to re-establish military ties on an equal footing. The young republic stills looks to the mother country as a bastion of liberty and democracy in a increasingly authoritarian and radical world."
 mmr_ast.31.a:0 "We would be happy to call them our ally!"
 mmr_ast.31.b:0 "We can protect our interests better without them."
 mmr_ast.311.t:0 "[From.GetNameDefCap] Agrees to Alliance"
 mmr_ast.311.desc:0 "Recognizing the obvious benefits of military and economic partnership, as well as our shared history, [From.GetNameDef] has agreed to our proposal of expanding the [FROM.GetFactionName] to include [ROOT.GetNameDef]."
 mmr_ast.311.a:0 "Australia has found a cross-Pacific protector."
 mmr_ast.312.t:0 "[From.GetNameDefCap] Declines Alliance"
 mmr_ast.312.desc:0 "Whether it is failure to acknowledge our shared democratic values and Anglo heritage, or simply a matter of political opportunism, [From.GetNameDef] has declined our request to join the [FROM.GetFactionName]."
 mmr_ast.312.a:0 "We will still do what we can for our corner of the world."
 mmr_ast.32.t:0 "[From.GetNameDefCap] Requests to Rejoin [ROOT.GetFactionName]"
 mmr_ast.32.desc:0 "Following the formal departure of [From.GetNameDef] from the Commonwealth, the [From.GetAdjective] government is now looking to re-establish military ties on an equal footing, given our newfound shared Fascist values. The young Australian state stills looks to the British Empire as a bastion of tradition, authority, and security."
 mmr_ast.32.a:0 "We would be happy to call them our ally!"
 mmr_ast.32.b:0 "We can protect our interests better without them."
 mmr_ast.321.t:0 "[From.GetNameDefCap] Agrees to Alliance"
 mmr_ast.321.desc:0 "Recognizing the obvious benefits of military and economic partnership, as well as our shared history, [From.GetNameDef] has agreed to our proposal of expanding the [FROM.GetFactionName] to include [ROOT.GetNameDef]."
 mmr_ast.321.a:0 "Australia has found a cross-Pacific protector."
 mmr_ast.322.t:0 "[From.GetNameDefCap] Declines Alliance"
 mmr_ast.322.desc:0 "Whether it is failure to acknowledge our shared Fascist values and Anglo heritage, or simply a matter of political opportunism, [From.GetNameDef] has declined our request to join the [FROM.GetFactionName]."
 mmr_ast.322.a:0 "We will still do what we can for our corner of the world."
 mmr_ast.33.t:0 "Enerst Squires Dead"
 mmr_ast.33.desc:0 "Enerst Squires, a veteran senior officer in the Australian Army and stalwart British loyalist, has died today after a devastating battle with cancer. He leaves a legacy of strong leadership."
 mmr_ast.33.a:0 "May he rest in peace."
 mmr_ast.34.t:0 "[azr_cac_sl] Formed"
 mmr_ast.34.desc:0 "[mmr_ast_34_desc_sl]"
 mr_ast_34_desc_com:0 "Today the Commonwealth Aircraft Corporation (CAC) has been incorporated in Melbourne. Bringing together a number of businesses involved in the manufacturing of and research into aircraft technology, this new corporation will streamline [AST.GetNameDef]'s ability to innovate in the protection of [AST.GetAdjective] skies."
 mr_ast_34_desc_indy:0 "Today the Australian Aircraft Corporation (AAC) has been incorporated in Melbourne. Bringing together a number of businesses involved in the manufacturing of and research into aircraft technology, this new corporation will streamline [AST.GetNameDef]'s ability to innovate in the protection of [AST.GetAdjective] skies."
 mr_ast_34_desc_base:0 "Today the Australian People's National Aircraft Corporation (APNAC) has been incorporated in Melbourne. Bringing together a number of businesses involved in the manufacturing of and research into aircraft technology, this new corporation will streamline [AST.GetNameDef]'s ability to innovate in the protection of [AST.GetAdjective] skies."
 mmr_ast.34.a:0 "A welcome development."
 mmr_ast.36.t:0 "Aboriginal Day of Mourning Protest"
 mmr_ast.36.desc:0 "A coalition of Aboriginal intellectuals organized under the Aborigines Progressive Association have organized a mass protest on Australia Day, which marks the anniversary of the 1788 landing of the First Fleet and raising of the Union Flag of Great Britain by Arthur Phillip at Sydney Cove. This year is the 150th anniversary. They have dubbed it the Day of Mourning, to counter the celebratory nature of the day in contemporary Australian society. Aboriginals seek to draw attention to the poor treatment of Aboriginal people and entrenched racial discrimination in Australia, and to highlight their perspective that day that marks the arrival of Europeans who decimated and impoverish their people, is not a day that they can celebrate."
 mmr_ast.36.a:0 "We must address this."
 mmr_ast.36.b:0 "Truly uncivilized."
 mmr_ast.37.t:0 "Westminster Back Under Imperial Rule"
 mmr_ast.37.desc:0 "Now that King Edward has returned to his rightful home in Westminster, the time has come to decide whether the imperial capital should remain in Canberra given the integral Australian support to the king's cause, or return to London."
 mmr_ast.37.a:0 "Edward shall rule from Buckingham Palace."
 mmr_ast.37.b:0 "Edward will remain in Canberra."
 mmr_ast.381.t:0 "Alan Vasey Hospitalized"
 mmr_ast.381.desc:0 "Alan Vasey, accomplished Army General, has been hospitalized with a skin condition following grueling battle. Those around him report that he has been drinking heavily and is in general poor health."
 mmr_ast.381.a:0 "Hope he recovers swiftly."
 mmr_ast.382.t:0 "Alan Vasey Hospitalized Again"
 mmr_ast.382.desc:0 "Alan Vasey, accomplished Army General, has been hospitalized with a respiratory tract infection following grueling battle. Those around him report that he has been drinking heavily and has been physically deteriorating."
 mmr_ast.382.a:0 "Poor man."
 mmr_ast.383.t:0 "Alan Vasey Hospitalized Yet Again"
 mmr_ast.383.desc:0 "Alan Vasey, accomplished Army General, has been hospitalized with malaria and acute peripheral neuropathy following grueling battle. Those around him report that he has been drinking heavily and is dangerously close to death."
 mmr_ast.383.a:0 "Perhaps we should take him out of active duty."
 mmr_ast.384.t:0 "Alan Vasey Killed in Plane Crash"
 mmr_ast.384.desc:0 "Alan Vasey, accomplished Army General, has died today in a plane crash while enroute to the frontlines. A brilliant tactitian and hero of [ROOT.GetNameDef], he will be missed dearly."
 mmr_ast.384.a:0 "A Tragedy."
 mmr_ast.391.t:0 "Henry Wynter Deemed Unfit for Service"
 mmr_ast.391.desc:0 "Henry Wynter, veteran of the Great War and accomplished Army General, has been deemed medically unfit for further active duty and ordered his return to Australia for treatment by the medical authorities. While this is a setback for our frontline capabilities, having someone with the experience and expertise like Wynter behind the frontlines may prove to be even more helpful to the war effort. However, his poor health and old age mean that he may only have a few more years of service left."
 mmr_ast.391.a:0 "He can still be useful behind the frontlines."
 mmr_ast.392.t:0 "Henry Wynter Retires"
 mmr_ast.392.desc:0 "Henry Wynter, veteran of the Great War and former Army General, has decided to retire today, citing his ailing health and old age and desire to be with his wife and family in his final days. He will be missed dearly."
 mmr_ast.392.a:0 "May have a well deserved rest."
 mmr_ast.40.t:0 "Morotai Mutiny"
 mmr_ast.40.desc:0 "Eight senior pilots based on the Molluccan island of Morotai, including Australia's leading flying ace, Group Captain Clive Caldwell, tendered their resignations today to protest what they perceived as the relegation of the Airforce fighter squadrons to strategically unimportant ground attack missions against enemy positions."
 mmr_ast.40.a:0 "Mutiny, or justified protest?"
 mmr_ast.41.t:0 "Popular Front Proposal"
 mmr_ast.41.desc:0 "With the resurgence of the New Guard, the fragmented left has been on the backfoot. The Communists have reached out to Labor with a proposal to form a Popular Front, allying Social Democrats, Socialists, and Communists into one political alliance that will fight the reactionary forces of the New Guard. As the smaller and more radical faction the Communists have offered to put themselves on the streets to defend the unions and all the Popular Front's members, in exchange for the much larger Labor Party to provide financial and legal support to them. However, if the Communists are given an inch, they might take a mile."
 mmr_ast.41.a:0 "It is time form an Australian Popular Front."
 mmr_ast.41.b:0 "The communists offer a poisoned chalice."
 mmr_ast.42.t:0 "[NZL.GetName] Spreads Communism to our People!"
 mmr_ast.42.desc:0 "With the radical Marxist revolution in New Zealand, A threat unlike any other has formed right next to us. Now the communists threaten our national sovereignty and very way of life! This cannot stand!"
 mmr_ast.42.a:0 "We must address this at once."
 mmr_ast.421.t:0 "Communist Infiltatrion in the Army!"
 mmr_ast.421.desc:0 "The Communists have been discovered to have been building communist cells within our Army to sabotage our military effectiveness in the event of war between our nation and the Marxist regime in New Zealand."
 mmr_ast.421.a:0 "We must purge the Army swiftly and extensively."
 mmr_ast.421.b:0 "We can utilize our spy network to break up this treasonous activity."
 mmr_ast.421.c:0 "They are not a serious threat."
 mmr_ast.422.t:0 "Communist Infiltatrion in the Navy!"
 mmr_ast.422.desc:0 "The Communists have been discovered to have been building communist cells within our Navy to sabotage our military effectiveness in the event of war between our nation and the Marxist regime in New Zealand."
 mmr_ast.422.a:0 "We must purge the Navy swiftly and extensively."
 mmr_ast.422.b:0 "We can utilize our spy network to break up this treasonous activity."
 mmr_ast.422.c:0 "They are not a serious threat."
 mmr_ast.423.t:0 "[AST.GetName] Has Purged Her Army"
 mmr_ast.423.desc:0 "Our comrades in the Australian Army have been discovered and executed in military court for treason. While they have significantly weakened their Army combat capacity in the short term, this has set back the Communist movement and our military aims in Australia."
 mmr_ast.423.a:0 "We will have to work harder and faster to liberate Australia."
 mmr_ast.424.t:0 "[AST.GetName] Has Purged Her Navy"
 mmr_ast.424.desc:0 "Our comrades in the Australian Navy have been discovered and executed in military court for treason. While they have significantly weakened their Naval combat capacity in the short term, this has set back the Communist movement and our military aims in Australia."
 mmr_ast.424.a:0 "We will have to work harder and faster to liberate Australia."
 mmr_ast.425.t:0 "[AST.GetName] Has Broken Up Communist Network in the Army"
 mmr_ast.425.desc:0 "Our comrades in the Australian Army who have organized the spread of Communist ideals from within have been discovered, sent to prisons, and stripped of their rank and credentials. While there are still Communists left in the Australian Army, without proper organization and leadership they will be unable to aid us when their liberation comes."
 mmr_ast.425.a:0 "We will have to work harder and faster to liberate Australia."
 mmr_ast.426.t:0 "[AST.GetName] Has Broken Up Communist Network in the Navy"
 mmr_ast.426.desc:0 "Our comrades in the Australian Navy who have organized the spread of Communist ideals from within have been discovered, sent to prisons, and stripped of their rank and credentials. While there are still Communists left in the Australian Navy, without proper organization and leadership they will be unable to aid us when their liberation comes."
 mmr_ast.426.a:0 "We will have to work harder and faster to liberate Australia."
 mmr_ast.43.t:0 "[FROM.GetName] Invites Us to the [FROM.GetFactionName]"
 mmr_ast.43.desc:0 "Our comrades to the west have sent a formal invitation for us to join them in a military alliance to protect our mutual revolutions, and spread the workers revolutions across the colonized East Asia and Pacific Islands."
 mmr_ast.43.a:0 "We are comrade in revolution and brothers in arms!"
 mmr_ast.43.b:0 "We are not their puppets to be led to endless war"
 mmr_ast.431.t:0 "[FROM.GetName] accepts our invitation to the [ROOT.GetFactionName]"
 mmr_ast.431.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that the liberated workers of [FROM.GetNameDef] are ready and willing to defend and spread the revolution across the Pacific."
 mmr_ast.431.a:0 "We will liberate the workers of the Pacific together!"
 mmr_ast.432.t:0 "[FROM.GetNameDefCap] rejects our invitation to the [ROOT.GetFactionName]"
 mmr_ast.432.desc:0 "Diplomats from [FROM.GetNameDef] have sent a message that while they are unfortunately unable to join our alliance, they send warm regards."
 mmr_ast.432.a:0 "We will carry forth without them."
 mmr_ast.44.t:0 "Ellington Report Published"
 mmr_ast.44.desc:0 "Sir Edward Ellington, Marshal of the Royal Air Force, has released a report condemning Richard William's conduct in the airforce after a years long investigation. ELlington cites numerous accidents and careless behavior that has create what he describes as an endemic issue in the RAAF. He recommends Williams be dismissed at once. While some have questioned the quality of the report, it is is publicly available and by a prestigious Air Marshal. Additionally, WIlliams was under fire in 1937 from the press for a series of mistakes under his command which resulted in the death of a pilot and many injured. It will be politically costly if we don't adhere to his recommendations."
 mmr_ast.44.a:0 "We must dismiss Williams."
 mmr_ast.44.b:0 "He is too valuable to lose."
 
 
 
 
 ###base game
 
 
 
 
 AST_additional_militia_training:0 "Additional Militia Training"
 AST_additional_militia_training_desc:0 "Much of our militia is unfit for service - either sick or under-equipped. We are taking steps to remedy this oversight in a dangerous world."
 AST_royal_australian_artillery:0 "Royal Australian Artillery"
 AST_royal_australian_artillery_desc:0 "Artillery is the queen of the battlefield, and we must expand our access to heavy guns."
 AST_promote_reservists:0 "Promote Reservists"
 AST_promote_reservists_desc:0 "Though we need a home defense force, promoting militia and reserves into the regular army will give us a needed boost in available soldiers and experience."
 AST_daimler_dingo:0 "Daimler Dingo"
 AST_daimler_dingo_desc:0 "This British-made armored car will improve our mobility on the battlefield. And, after all, it is named for our national canine."
 AST_hmas_assault:0 "HMAS Assault"
 AST_hmas_assault_desc:0 "War in the Pacific will be an amphibious war, so the construction of a naval base specialized in training marines how to take a beach is imperative for the war effort."
 AST_specialize_equipment:0 "Specialize Equipment"
 AST_specialize_equipment_desc:0 "Not all of the British-made equipment we use is effective for our unique combat situation. Special and custom tools have become necessary."
 AST_australian_womens_army_service:0 "Australian Women's Army Service"
 AST_australian_womens_army_service_desc:0 "Every man is needed at the front, so driving, signal and maintenance jobs will be handled by thousands of Australia's women."
 AST_australian_army_catering_corps:0 "Australian Army Catering Corps"
 AST_australian_army_catering_corps_desc:0 "The Australian army is being poorly served by the quality of its food, largely because of the quality of its cooks. By reorganizing this process, we can boost morale and effectiveness."
 AST_fund_owen_gun_research:0 "Fund Owen Gun Research"
 AST_fund_owen_gun_research_desc:0 "Evelyn Owen has developed a new submachine gun that can withstand the harsh pressures of jungle warfare. We should put government resources into production and improvement of this weapon."
 AST_sentinel_tank_project:0 "Sentinel Tank Project"
 AST_sentinel_tank_project_desc:0 "Australia should develop its own homemade armored vehicle. Based on German and American ideas, the Sentinel program should be advanced."
 AST_airborne_defence:0 "Airborne Defence"
 AST_airborne_defence_desc:0 "We must protect the skies over Australia by investing in air defense, including interceptors and anti-air."
 AST_introduce_unconventional_warfare:0 "Introduce Unconventional Warfare"
 AST_introduce_unconventional_warfare_desc:0 "The jungles of the Pacific will require a new kind of warfare. We must learn to move quickly and quietly through the dense cover - ambush our enemies and expect the same from them."
 AST_z_special_unit:0 "Z Special Unit"
 AST_z_special_unit_desc:0 "Z Special Unit will be our commando team, specializing in reconnaissance and sabotage behind enemy lines. This will require brave men willing to undergo the most serious training."
 AST_m_special_unit:0 "M Special Unit"
 AST_m_special_unit_desc:0 "M Special Unit will be our advance scouting and reconnaissance arm in the war, sending back up to the moment intelligence about enemy dispositions and placements."
 AST_expand_the_raaf:0 "Expand the RAAF"
 AST_expand_the_raaf_desc:0 "Our air force needs to grow, so we are investing in more bases, more training and more production."
 AST_cac_boomerang:0 "CAC Boomerang"
 AST_cac_boomerang_desc:0 "The Boomerang will be Australia's contribution to fighter design and an insurance policy against the loss of imported aircraft. We need to compete with Japanese and American planes."
 AST_expand_northern_presence:0 "Expand Northern Presence"
 AST_expand_northern_presence_desc:0 "With our cities mostly on the east and west coasts of the island, Australia's northern frontier lacks the proper defense or preparation in case of invasion or attack. New military structures in that area will be welcome."
 AST_cac_woomera:0 "CAC Woomera"
 AST_cac_woomera_desc:0 "Australia will develop its own bomber arm. The Woomera is only a light craft, but will be adequate for protecting our homeland and light combat air support."
 AST_volunteer_air_observers_corps:0 "Volunteer Air Observers Corps"
 AST_volunteer_air_observers_corps_desc:0 "Keep your eyes on the skies! We call on Australians to learn the silhouettes of common aircraft and notify the government of any suspicious or enemy planes that near the Dominion."
 AST_naval_bombers:0 "Naval Bombers"
 AST_naval_bombers_desc:0 "We are surrounded by water, so we should look into planes and training that will allow us to intercept and attack enemy fleets. Naval bombing is a specialized skill and should be a focus."
 AST_death_from_down_under:0 "Death From Down Under"
 AST_death_from_down_under_desc:0 "No bombers will damage our ports and cities once we have upgraded our air defense system, through better understanding of air power and the brute force of anti-air weapons."
 AST_womens_auxilliary_australian_air_force:0 "Women's Auxiliary Australian Air Force"
 AST_womens_auxilliary_australian_air_force_desc:0 "A full half of our population is better used in the war effort than sitting at home. Aircraft maintenance, the signal corps and other related tasks will be turned over to women."
 AST_dominate_the_skies:0 "Dominate the Skies"
 AST_dominate_the_skies_desc:0 "Australia is far from many enemy air bases, so it should be our goal to have total air superiority in our corner of the globe."
 AST_cockatoo_island_shipyards:0 "Cockatoo Island Shipyards"
 AST_cockatoo_island_shipyards_desc:0 "The expansion and improvement of the Cockatoo Island Shipyards is a major priority for our government. Sydney Harbour has the best access to manpower and resources and that is where we should focus our naval construction efforts."
 AST_kangaroo_point_shipyards:0 "Kangaroo Point Dry Dock"
 AST_kangaroo_point_shipyards_desc:0 "Evans Deakin & Company propose a shipyard and substantial drydock at Kangaroo Point. Such an endeavor would be ideal for enhancing our capacity for naval power projection."
 AST_protect_overseas_commerce:0 "Protect Overseas Commerce"
 AST_protect_overseas_commerce_desc:0 "An island nation relies on the supplies it can bring in from others across the waves. Defending the convoy lines and trade routes is not simply a strategy - it is a necessity."
 AST_fly_the_jolly_roger:0 "Fly the Jolly Roger"
 AST_fly_the_jolly_roger_desc:0 "From our island stronghold we can send forth packs of submarines to harass and destroy the enemy trade and supply that passes by our shores."
 AST_scrap_iron_flotilla:0 "Scrap Iron Flotilla"
 AST_scrap_iron_flotilla_desc:0 "Until we can upgrade our fleet, we will make do with the aging vessels we have. Our enemy may refer to our older destroyers as a Scrap Iron Flotilla, but it will do us proud."
 AST_royal_australian_submarine_service:0 "Royal Australian Submarine Service"
 AST_royal_australian_submarine_service_desc:0 "Submarines are the sea weapon of the future, and a crucial component of our allies' forces. We must embrace this way of war."
 AST_naval_auxiliary_patrol:0 "Naval Auxiliary Patrol"
 AST_naval_auxiliary_patrol_desc:0 "The many harbors of our great land are inviting targets for stealthy submarine attacks. An auxiliary force of coastal patrol ships will alert us to any danger."
 AST_cruisers:0 "Cruisers"
 AST_cruisers_desc:0 "We can leave the battleships and carriers to the big dogs, since a mass of cruiser-sized ships will more than meet our needs."
 AST_pacific_area_navy:0 "Pacific Area Navy"
 AST_pacific_area_navy_desc:0 "Though His Majesty fights for survival in Europe, our immediate priority should be a navy that can fight our enemies here in the Pacific. We must develop strategies that are in line with that objective."
 AST_standard_gauge_railway:0 "Standard Gauge Railway"
 AST_standard_gauge_railway_desc:0 "For decades, Australia has had competing railway gauges, making a mess of our transportation and shipping needs. The time has come to finally standardize railway gauges around the country."
 AST_industries_assistance_corporation:0 "Industries Assistance Corporation"
 AST_industries_assistance_corporation_desc:0 "The recent global economic dislocation has discouraged investment and entrepreneurship in Australia. The Industries Assistance Corporation will advise and finance small business around the country to get the economy moving again."
 AST_western_australian_government_railways:0 "Western Australian Government Railways"
 AST_western_australian_government_railways_desc:0 "The state-owned railways in Western Australia should be given a greater priority than road construction at this point. Geography favors the train in the West - we should take advantage of that."
 AST_south_australian_housing_trust:0 "South Australian Housing Trust"
 AST_south_australian_housing_trust_desc:0 "South Australia needs more industry and investment, so it will dedicate resources to a series of planned communities and housing improvements, especially around Adelaide."
 AST_department_of_supply_and_development:0 "Department of Supply and Development"
 AST_department_of_supply_and_development_desc:0 "In wartime, we need a special department to handle logistical and supply matters - ammunition, fuel supplies and everything necessary to keep an army on the move."
 AST_expand_lithgow_small_arms_factory:0 "Expand Lithgow Small Arms Factory"
 AST_expand_lithgow_small_arms_factory_desc:0 "Our Vickers and Brens come from the Lithgow Small Arms Factory. As it grows, we will find it easier to increase our fighting capacity."
 AST_allied_works_council:0 "Allied Works Council"
 AST_allied_works_council_desc:0 "All military construction in Australia will be overseen by the Allied Works Council. This centralized planning will make sure that the government gets the type of productivity it needs."
 AST_expand_the_northern_railway:0 "Expand the Northern Railway"
 AST_expand_the_northern_railway_desc:0 "We have a railway that stretches from Adelaide in the south to Alice Springs in the north. Now we must extend that northern point to other cities in the area, connecting all of Australia."
 AST_australian_arms_production:0 "Australian Arms Production"
 AST_australian_arms_production_desc:0 "The long convoy times mean that Australia must take a greater responsibility for producing its own guns than other Dominions. We have the factories, and we have the know-how."
 AST_uranium_mining:0 "Uranium Mining"
 AST_uranium_mining_desc:0 "Over the last decades, we have found large uranium deposits in South Australia, especially around Mt Gee. Uranium is now a vital military resource and exploitation of these reserves should be increased."
 AST_establish_advisory_war_council:0 "Establish Advisory War Council"
 AST_establish_advisory_war_council_desc:0 "Australia's politicians must put aside ideological and partisan disagreements and come together to consult and advise on the conduct of the war."
 AST_national_security_act:0 "National Security Act"
 AST_national_security_act_desc:0 "Now that we are at war, the Federal government will assume greater powers to protect Australia. Greater press censorship, suppression of dissident groups and greater ability to tax and seize property for the defense of the Dominion."
 AST_volunteer_defence_corps:0 "Volunteer Defence Corps"
 AST_volunteer_defence_corps_desc:0 "A Volunteer Defence Corps has been assembled from older veterans and other citizens not in the regular army. They will serve as a home guard to free up the army to take direct action against its enemies."
 AST_civil_construction_corps:0 "Civil Construction Corps"
 AST_civil_construction_corps_desc:0 "We will conscript able-bodied men to serve in a Civil Construction Corps to help in the building of airfields, transportation, forts, and other important military infrastructure."
 AST_army_inventions_directorate:0 "Army Inventions Directorate"
 AST_army_inventions_directorate_desc:0 "Wars spur innovation and creativity and the government needs a way to sort the good ideas from the bad. A new specialized patent office would be dedicated to determining which of the many submissions to the government have any value."
 AST_invest_in_victory:0 "Invest in Victory"
 AST_invest_in_victory_desc:0 "By selling war bonds to our population, they can contribute their savings to the war effort."
 AST_citizen_military_forces:0 "Citizen Military Forces"
 AST_citizen_military_forces_desc:0 "It is now time to prepare a reserve army to increase our readiness in case of war. We will draft available militiamen into the army for home defense, and then prepare them for service overseas if needed."
 AST_rats_of_tobruk:0 "Rats of Tobruk"
 AST_rats_of_tobruk_desc:0 "Our brave soldiers have proven themselves adept at desert warfare and scavenging from the battlefield. They harass the enemy, striking from their bases and then retreating before the counterattack."
 AST_rats_of_tobruk_effect_1:0 "Gain elite unit in Tobruk"
 AST_rats_of_tobruk_effect_2:0 "Gain elite unit in Sydney"
 AST_fight_work_or_perish:0 "Fight Work or Perish"
 AST_fight_work_or_perish_desc:0 "With our enemy posing an existential threat to the Dominion, Australians must make a choice. They will fight, they will work, or they will perish."
 AST_research_collaboration:0 "Research Collaboration"
 AST_research_collaboration_desc:0 "The British showed us the advantage of sharing scientific progress between close allies. Our whole faction will be able to conduct wartime R&D more efficiently if we take the steps necessary to coordinate this."
 AST_fund_australian_defense_research:0 "Fund Australian Defense Research"
 AST_fund_australian_defense_research_desc:0 "Now that Australia is fully a sovereign nation we are no longer receiving access to advanced prototypes and blueprints like we previously did. We must ensure that we alway stay ahead of our enemies, and do not fall behind in technology."
 AST_squash_the_squanderbugs:0 "Squash the Squander Bugs"
 AST_squash_the_squanderbugs_desc:0 "Wasteful spending on inflation-affected consumer goods is taking money away from war bonds and the war effort. We need to discourage this appetite for luxury while our army is in need."
 AST_rationing_and_recycling:0 "Rationing and Recycling"
 AST_rationing_and_recycling_desc:0 "Every resource matters. We will ration food for our citizens, recycle to get as much metal as we can from worn-out goods and promote economies throughout the country."
 AST_classify_aliens:0 "Classify Aliens"
 AST_classify_aliens_desc:0 "Australia is a nation of immigrants, and as such, may have taken in some with loyalties to their homeland. We will register and track foreign-born Australians."
 AST_strengthen_ties_with_uk:0 "Strengthen Ties With UK"
 AST_strengthen_ties_with_uk_desc:0 "Our loyalties lie with the Mother Country. We will go where she follows and commit to fighting her enemies. God Save the King."
 AST_support_the_policy_of_appeasement:0 "Support the Policy of Appeasement"
 AST_support_the_policy_of_appeasement_desc:0 "The costs of the last war still weigh heavily on the national memory. If making territorial concessions half a world away can keep Australia out of war, then we should certainly consider these concessions."
 AST_the_singapore_strategy:0 "The Singapore Strategy"
 AST_the_singapore_strategy_desc:0 "Singapore is too far from London to be secure. Australia will take it upon itself to protect this outpost of empire from aggression from others."
 AST_adopt_westminster:0 "Adopt Westminster"
 AST_adopt_westminster_desc:0 "We embrace the Westminster system that we have inherited from the United Kingdom."
 AST_CSIR:0 "CSIR"
 AST_CSIR_desc:0 "The Commonwealth Scientific and Industrial Research Organization is our government research arm to improve the efficiency of science and production in Australia. By increasing our support for it, we will give further energy to the sinews of war."
 AST_swpa_protector:0 "SWPA Protector"
 AST_swpa_protector_desc:0 "Australia must assume the primary position as the protector of the South West Pacific Area. The entire sea zone from Indochina through Indonesia to New Guinea should be under our aegis."
 AST_empire_air_training_scheme:0 "Empire Air Training Scheme"
 AST_empire_air_training_scheme_desc:0 "It is time for Australia to commit to a proper air training program. With the encouragement and support of the United Kingdom, all of the Dominions will work together to contribute pilots and support crew for the war effort."
 AST_commonwealth_aircraft_corporation:0 "Commonwealth Aircraft Corporation"
 AST_commonwealth_aircraft_corporation_desc:0 "The Commonwealth Aircraft Corporation is the primary producer of aircraft and aircraft engines in Australia. It has a proven track record, and support for it will give our pilots the materials they require."
 AST_sever_ties_with_uk:0 "Sever Ties With UK"
 AST_sever_ties_with_uk_desc:0 "The time has come to break from the United Kingdom. Australia can direct her own course without interference from London and stake a claim to its own destiny in its own region."
 AST_protect_the_homeland:0 "Protect The Homeland"
 AST_protect_the_homeland_desc:0 "Australia is large, but its coasts can be protected. Keeping our own nation safe is the highest priority."
 AST_the_swpa_menace:0 "The SWPA Menace"
 AST_the_swpa_menace_desc:0 "Japan is building an empire that threatens the safety of Australia and freedom in the region. We should turn to like-minded nations to be our allies."
 AST_never_another_gallipoli:0 "Never Another Gallipoli"
 AST_never_another_gallipoli_desc:0 "The only way to ensure that Australia is not drawn into further costly wars through sentiment is to take complete control of our foreign policy. We need no distant King and cannot afford ancient blood ties pulling us into conflicts that do not serve our interests."
 AST_woo_usa:0 "Woo USA"
 AST_woo_usa_desc:0 "Our true ally is America, another Pacific power with British roots. This rich and powerful land is better able to understand our needs, increase our prosperity and protect us from aggression."
 AST_protect_the_dutch_colonies:0 "Protect the Dutch Colonies"
 AST_protect_the_dutch_colonies_desc:0 "The Netherlands is a weak and distant master of her Indonesian colonies. It cannot defend them against attacks from Japan, China, or any other potentially hostile nation. We must assume control for the greater good."
 AST_the_south_west_pacific_initiative:0 "The South West Pacific Initiative"
 AST_the_south_west_pacific_initiative_desc:0 "We have established the power base and credibility to create our own network of alliances, centered on defending the South West Pacific Area from hostile powers. We will seek out like-minded powers and make Australia a major voice in global affairs."
 AST_preemptive_intervention:0 "Preemptive Intervention"
 AST_preemptive_intervention_desc:0 "Japan's empire building over the last decade poses a threat to every free people in the Pacific. We cannot afford to wait until it turns its hungry eyes in our direction. The time for action is now."
 AST_research_cooperation:0 "Research Cooperation"
 AST_research_cooperation_desc:1 "Australians are an intelligent and resourceful people, but we haven't the infrastructure or population for a serious scientific program. We will work with our allies, sharing knowledge and breakthroughs for mutual benefit."
 AST_abandon_the_westminster_system:0 "Abandon the Westminster System"
 AST_abandon_the_westminster_system_desc:0 "Though the Westminster Parliament is our inheritance from Great Britain, it has outlived its usefulness in the modern era. Cabinet disagreements and party rivalries have done little to help stabilize Australia through the recent economic crisis."
 AST_support_the_centre_party:0 "Support the Centre Party"
 AST_support_the_centre_party_desc:0 "In New South Wales, a vigorous anti-Communist movement has arisen. Assisted by its New Guard allies, the Centre Party might hold the key to strengthening Australia."
 AST_supply_indonesian_nationalists:0 "Supply Indonesian Nationalists"
 AST_supply_indonesian_nationalists_desc:0 "We should support the people of Indonesia in their fight against their Dutch oppressors. They will need education and training, but with their numerical superiority, victory in this fight for justice is inevitable, as will be their gratitude to us."
 AST_support_indonesian_uprising:0 "Support Indonesian Uprising"
 AST_support_indonesian_uprising_desc:0 "Now that the Indonesians have taken up arms against the Dutch, they will need more than words. The uprising needs guns and other equipment, as well as full-throated diplomatic support."
 AST_demand_new_zealand:0 "Demand New Zealand"
 AST_demand_new_zealand_desc:0 "The Kiwis have long been our closest allies and friends. We have fought on the same beaches and died in the same useless Imperial wars. It is time to unite our two countries under one flag."
 AST_protect_the_south_west_pacific:0 "Protect the South West Pacific"
 AST_protect_the_south_west_pacific_desc:0 "It is time to use our regional might to bring all of the South West Pacific into our sphere of influence. Only we can protect the people and resources from outsiders who wish to pillage our heritage."
 AST_a_deal_with_japan:0 "A Deal With Japan"
 AST_a_deal_with_japan_desc:0 "With the South West Pacific in our orbit, we can reach a rapprochement with the Empire of Japan. If it stays in the North West and leaves our sphere to us, then there will be no reason for us to fight."
 AST_our_own_empire:0 "Our Own Empire"
 AST_our_own_empire_desc:0 "The time has come for the former colony to stand on its own and proclaim an Australian empire. Our benevolence and farsighted planning will be for the good of all in the area."
 AST_japan_tech_sharing:0 "Japan Tech Sharing"
 AST_japan_tech_sharing_desc:0 "Japanese scientists have been able to outpace our own research institutes, but our new harmony with the Empire of the Rising Sun opens up new opportunities for learning and sharing."
 AST_war_on_japan:0 "War on Japan"
 AST_war_on_japan_desc:0 "Japan's aggression has gone on too long. It has raped and pillaged its way through East Asia and now it has its eyes on the lands and resources further south. We cannot stand aside."
 AST_empower_the_workers:0 "Empower the Workers"
 AST_empower_the_workers_desc:0 "A nation of convicts, ranchers and dockworkers. That is Australia. It is time to give voice and power to the workers and proletariat of Australia. Long live the Revolution."
 AST_delegation_to_china:0 "Delegation to China"
 AST_delegation_to_china_desc:0 "Long torn apart by Imperial greed, the Chinese people need a friend. And we need a regional ally against Fascism. This official meeting with the Chinese government will bring us closer together."
 AST_commitment_to_the_cause:0 "Commitment to the Cause"
 AST_commitment_to_the_cause_desc:0 "The time has come to cast off the shackles of a foreign king and build a Worker's Paradise free of the Imperialist warmongering that risks all of Australia."
 AST_indirect_support:0 "Indirect Support"
 AST_indirect_support_desc:0 "The People's Republic of China is at war, but we are in no position to expose ourselves. A small shipment of arms and cautious encouragement is all we can risk at the moment."
 AST_direct_support:0 "Direct Support"
 AST_direct_support_desc:0 "To arms, Comrades! Hear the call of our Chinese brothers suffering in the war against Fascism! Sign up and join the global struggle of all workers!"
 AST_join_comintern:0 "Join Comintern"
 AST_join_comintern_desc:0 "Our future lies with Communism, so we must join our Comrades around the world in this global struggle. Papa Joe will show us the way and lead the workers from Australia and everywhere else to a glorious tomorrow."
 AST_workers_paradise:0 "Workers Paradise"
 AST_workers_paradise_desc:0 "The Stalinist Communist experiment is a failure, but we believe that Socialism is the right path. Australia will strike out on a second path for the workers to follow, free from direction from Moscow."
 AST_research_city_excursions:0 "Research City Excursions"
 AST_research_city_excursions_desc:0 "The Soviet Union has built research cities and laboratories throughout its territory and it has invited Australian researchers to come and learn about the glories of Communist science."
 AST_nz_puppet:0 "Aotearoan Puppet" #AZR altered
 AST_nz_puppet_desc:0 "The workers of Aotearoa should join with their Australian brothers and sisters. We can protect them, and have offered the gentle hand of friendship, so long as they submit to our direction."
 AST_the_threat_against_the_people:0 "The Threat Against the People"
 AST_the_threat_against_the_people_desc:0 "The militarist and Fascist power of Imperial Japan is a threat to the well-being of all Australians, and blocks the peaceful coexistence of the workers of the world. Australia will push back this enemy of the people, forcing them to stay on their dismal, rocky islands."
 AST_new_general_tt:0 "A new §Y3 Skill§! General named §YIven Mackay§! will appear."
 AST_homeland_defense_tt:0 "Fortify the Homeland with §Ycoastal forts and land forts§! guarding likely landing sites and ports."
 AST_swpi_research_tt:0 "We will enter a §Ytech sharing agreement§! with the US or with other members of our faction."
 AST_deal_with_japan_tt:1 "We will propose to transfer overlordship of §YMalaya§! to Japan in return for an alliance. Should this not be possible, we will propose to cede the states of §YKalimantan§!, §YSulawesi§! and §YThe Moluccas§! to Japan instead.\n"
 
