 mmr_trait_AST_new_guard_loyalist_desc:0 "§gThe §YNew Guard§! were a fascist and monarchist paramilitary group led by high ranking officers in the Australian Army in the early 1930s. They engaged in Anti-Union and Anti-Communist agitation and harrassment before fizzling out and being electorally rebuked. Many §YNew Guard§! loyalists and leaders remain in high ranking positions in the Australian Army.§!"
 
