 AZR_prepare_for_fascist_civil_war:0 "Prepare for Civil War"
 AZR_prepare_for_fascist_civil_war_desc:1 "We have no time to wait for the slow changes in the minds of the people. For their own sake, we must force the matter swiftly, even if some may lose their lives in the process. Unlike a peaceful referendum, a civil war will cause tremendous devastation to our armed forces and the country's industry and infrastructure, but it is also quicker, and ensures we will be able to force our will through more forcefully afterwards."
 AZR_expand_civil_fascism_support:0 "Expand Civil Support"
 AZR_expand_civil_fascism_support_desc:1 "We must ensure the continuing spread of support for our cause among the people, and encourage them to publicly challenge the authority of the present government. As the position of the government is increasingly undermined and civil unrest continues to mount, it will become easier for us to achieve our goals. This holds especially true if, unlike a legal change in government, these goals involves a more... sinister means of regime change."
 AZR_army_support_for_fascist_civil_war:0 "Expand Military Support"
 AZR_army_support_for_fascist_civil_war_desc:0 "Without ample support of the military, any hope of victory in an armed ideological struggle would be vain. We must ensure the loyalty of well-placed units of our military forces."
 AZR_army_support_TT:0 "Each time army support is increased, 10% is added to the strength of your faction in the civil war, up to a maximum total strength of 70%.\n"
 AZR_ensure_general_loyalty_for_fascist_civil_war:1 "Ensure Lower Army Command Loyalty"
 AZR_ensure_general_loyalty_for_fascist_civil_war_desc:0 "It is possible certain generals harbor secret sentiments in favor of fascism. We must approach them and ensure their loyalty for when the fighting starts."
 AZR_ensure_marshal_loyalty_for_fascist_civil_war:0 "Ensure Upper Army Command Loyalty"
 AZR_ensure_marshal_loyalty_for_fascist_civil_war_desc:0 "It is possible certain field marshals harbor secret sentiments in favor of fascism. We must approach them and ensure their loyalty for when the fighting starts."
 AZR_siphon_equipment_stockpiles_for_fascist_civil_war:0 "Siphon Equipment"
 AZR_siphon_equipment_stockpiles_for_fascist_civil_war_desc:0 "By skimming the nation's equipment stores we can create a minor cache of weaponry to aid us in our future struggle."
 AZR_formulate_surprise_attack_plan_for_fascist_civil_war:0 "Formulate Surprise Attack Plan"
 AZR_formulate_surprise_attack_plan_for_fascist_civil_war_desc:0 "The enemy has no idea of the impending calamity. We must ensure this remains so, all the while directing our battle plans to make maximum use of the element of surprise."
 AZR_formulate_surprise_attack_plan_for_civil_war_tt:0 "The Surprise Attack Plan gives a 25% attack bonus to all divisions on core territory, for 30 days.\n"
 AZR_ignite_the_fascist_civil_war:0 "Ignite Civil War"
 AZR_ignite_the_fascist_civil_war_desc:0 "The time has come to take the plunge. All preparations we deemed necessary have been made. There is no turning back now."
 AZR_rebuild_the_nation_fascism:0 "Rebuild the Nation"
 AZR_rebuild_the_nation_fascism_desc:0 "After the civil war, the time has now come to rebuild our ruined nation."
 AZR_open_up_political_discourse_fascism_azr:0 "Open Up Political Discourse"
 AZR_open_up_political_discourse_fascism_azr_desc:1 "We must open up the acceptance of diverging viewpoints in the government. Perhaps this will eventually make it possible to affect a peaceful change in the politics of our nation."
 AZR_discredit_government_fascism:0 "Discredit Government"
 AZR_discredit_government_fascism_desc:0 "By pointing out our current government's many flaws we can make people think about the ideological causes of these failures."
 AZR_hold_the_fascist_national_referendum:0 "Hold National Referendum"
 AZR_hold_the_fascist_national_referendum_desc:0 "With sufficient support, we may now safely hold a referendum to affect a change of government, without bloodshed."
 AZR_communism_on_the_rise:0 "Communism on the Rise"
 AZR_communism_on_the_rise_desc:0 "Vocal political elements have begun to speak up in favor of communist values, finding support with an increasing number of the population. The nation's path to communism lies open, merely awaiting the choice of peaceful or violent transition."
