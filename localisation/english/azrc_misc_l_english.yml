 tfv_australia.97.t:0 "[From.GetNameDefCap] Invites us to the South West Pacific Initiative"
 tfv_australia.97.desc:0 "Following the formal departure of [From.GetNameDef] from the Commonwealth and their formation of a military alliance centered around the south west Pacific, the [From.GetAdjective] government has reached out to us, emphasizing our shared ANZAC legacy. With the Pacific seemingly on the brink of a new, costly conflict, and the strategic value of [From.GetNameDef] to any potential conflict in the Pacific, a partnership may be in our best interest."
 tfv_australia.97.a:1 "We would be happy to call them our ally!"
 tfv_australia.97.b:0 "We cannot afford to get caught up in regional conflicts."
 tfv_australia.98.t:0 "[From.GetNameDefCap] Agrees to Pacific Cooperation"
 tfv_australia.98.desc:0 "Recognizing the obvious benefits of the revival of ANZAC military cooperation, [From.GetNameDef] has agreed to our invitation to the South West Pacific Initiative."
 tfv_australia.98.a:0 "A new dawn for Australasia!"
 tfv_australia.99.t:0 "[From.GetNameDefCap] Declines Invitation to the South West Pacific Initiative"
 tfv_australia.99.desc:0 "Whether it is failure to acknowledge our shared history, or simply a matter of political opportunism, [From.GetNameDef] has declined our offer of a trans-Pacific partnership.\n\nWhile their participation would have been a great asset, we should move forwards with our own agenda, towards our own goals."
 tfv_australia.99.a:0 "We will still do what we can for our corner of the world."
 
