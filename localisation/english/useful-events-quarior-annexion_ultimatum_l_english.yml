l_english:
  useful-events-quarior-annexion_ultimatum.1.t:0 "[From.GetNameDefCap] Demands [Root.GetAdjective] Annexation!"
  useful-events-quarior-annexion_ultimatum.1.d:0 "A very worrying telegram arrived on the desk of [Root.GetLeader] today from the [From.GetAdjective] President, demanding that [Root.GetNameDef] lay down her arms and cede all territories to the [From.GetAdjective] state. [From.GetNameDefCap] has been attempting to merge our nation with them, and it seems that now they believe the mere threat of war between our nations will be enough to cause [Root.GetLeader] to crumble."
  useful-events-quarior-annexion_ultimatum.1.a:0 "Very well."
  useful-events-quarior-annexion_ultimatum.1.b:0 "Absolutely not!"
  useful-events-quarior-annexion_ultimatum.2.t:0 "[From.GetNameDefCap] Accepts!"
  useful-events-quarior-annexion_ultimatum.2.d:0 "Today is a great day of celebration for [Root.GetNameDef] as the [From.GetAdjective] military has thrown down their arms and allowed [Root.GetAdjective] soldiers to march right into the capital and proclaim the unification of [Root.GetNameDef] and [From.GetNameDef]!."
  useful-events-quarior-annexion_ultimatum.2.a:0 "Welcome to the nation!"
  useful-events-quarior-annexion_ultimatum.3.t:0 "[From.GetNameDefCap] Defiant!"
  useful-events-quarior-annexion_ultimatum.3.d:0 "A response has returned from [From.GetAdjective] high-command today outright refusing all [Root.GetAdjective] demands and claiming that they will “not allow [Root.GetLeader] to trample on [From.GetAdjective] sovereignty”. While many would rather not enter another state of war with [From.GetNameDef], if [Root.GetLeader] does not respond soon, future [Root.GetAdjective] demands are unlikely to be taken seriously."
  useful-events-quarior-annexion_ultimatum.3.a:0 "[Root.GetNameDef] and [From.GetNameDef] will be one!"
  