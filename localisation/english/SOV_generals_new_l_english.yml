l_english:

### Leaders ###
POLITICS_GEORGY_ZHUKOV_DESC: "§YGeneral Description\nBorn:§! §gDecember 1, 1896, in Strelkovka, Kaluga Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nBorn into an impoverished peasant family in Central Russia, Georgy Zhukov never considered himself a soldier, instead becoming an apprentice furrier in his brother's workshop in Moscow. Then came World War I, and with it Zhukov was drafted into the Imperial Russian Army. Here he found his calling, demonstrating skill and bravery. After serving as a cavalry non-commissioned officer, he was wounded in battle and briefly returned to his homeland. After the February Revolution, he joined the Red Army and fought in the Civil War.\n\nFrom the end of May 1923, Zhukov assumed command of the 39th Regiment of the 7th Samara Cavalry Division, and in 1924 he was sent to the Higher Cavalry School. From 1926, he taught military pre-conscription training at the Belarusian State University for 5 years. In 1929, he completed courses for senior command staff of the Red Army. From May 1930, he commanded the 2nd Brigade of the 7th Samara Cavalry Division, which was headed at that time by Konstantin Rokossovsky, for about a year. Then years of service in the Belarusian Military District under the command of I. P. Uborevich. Later he was appointed assistant inspector of the Red Army cavalry, and in March 1933, commander of the 4th cavalry division, which was stationed in the city of Slutsk, Byelorussian SSR."

POLITICS_IVAN_KONEV_DESC: "§YGeneral description\nBorn:§! §gDecember 28, 1897, in Lodeyno, Vologda Governorate, Russian Empire§!\n§YMilitary career:§! §g\nBorn into a family of peasants. Graduated from the parish school in the village of Yakovlevskaya Gora in 1906, the Nikolo-Pushemskoye zemstvo four-year school in the village of Shchetkino in 1912. From the age of 15, he worked seasonally at timber exchanges in Podosinovets and Arkhangelsk, and was a timekeeper on a timber rafting site. In May 1916, he was drafted into the Russian Imperial Army. He graduated from the training artillery team, served in the reserve heavy artillery brigade (Moscow), and was promoted to junior non-commissioned officer. Participant of the First World War: in 1917 he was sent to the Southwestern Front and fought in the 2nd separate heavy artillery division of the 2nd heavy artillery brigade. The brigade operated in the Tarnopol area. In November 1917, the brigade, like many other units, was disarmed by the Haidamaks of the Ukrainian Central Rada, and Konev, along with other soldiers, was sent to Russia. Returning to his native places, in 1918 he joined the Bolshevik Party. After several urgent requests, refusals and a personal appeal to M. V. Frunze, he achieved enlistment in the ranks of the Red Army in 1918. He fought on the Eastern Front against units of the Russian Army of A. V. Kolchak, the Far Eastern Army of General G. M. Semyonov and the Japanese interventionists in Transbaikalia and the Far East.\n\nAfter the end of the Civil War, from December 1922 - military commissar of the 17th Primorsky Rifle Corps. From August 1924 - commissar and head of the political department of the 17th Nizhny Novgorod Rifle Division. He graduated from the Advanced Training Courses for Senior Command Personnel at the M. V. Frunze Military Academy of the Red Army in 1926, and in the same year he was appointed commander and commissar of the 50th Rifle Regiment of the same division. From 1932 to 1934 he studied in the Special Group of the M. V. Frunze Military Academy. Since December 1934 he has commanded the 37th Rifle Division."

POLITICS_KONSTANTIN_ROKOSSOVSKY_DESC: "§YGeneral Description\nBorn:§! §gDecember 21, 1896, in Velikiye Luki, Pskov Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nKonstantin Rokossovsky was born into a noble family in Velikiye Luki. In 1914 he joined the 5th Kargopol Dragoon Regiment. In 1917 he took part in World War I, was awarded the St. George Cross and medals. In October 1917 he voluntarily transferred to the Red Guard (to the Kargopol Red Guard detachment as a private Red Guard), then to the Workers' and Peasants' Red Army. On March 7, 1919 he joined the RCP(b). In 1923-1924, he took part in battles against the White Guard detachments of General Firs Ksenofontovich Mylnikov, troop foreman V. I. Derevtsov, V. L. Duganov, Z. I. Gordeyev and centurion I. S. Shadrin (headed the Sretensky combat sector) that had entered the territory of the USSR in Transbaikalia.\n\nSeptember 1924 - August 1925 - student of the Cavalry Courses for Advanced Training of Command Personnel, together with G. K. Zhukov and A. I. Eremenko. From January to April 1929, he completed advanced training courses for senior command personnel at the M. V. Frunze Military Academy, where he became acquainted with the works of M. N. Tukhachevsky. In 1936, K. K. Rokossovsky commanded the 5th Cavalry Corps in Pskov."

POLITICS_ALEKSANDR_VASILEVSKY_DESC: "§YGeneral Description\nBorn:§! §gSeptember 30, 1895, Novaya Golchikha, Kostroma Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nBorn in the village of Novaya Golchikha, Kostroma Governorate. His father was a church choirmaster, and his mother was the daughter of a psalm reader. He studied at a parish school, then at the Kineshma Theological School and the Kostroma Theological Seminary. In 1915, he joined the Russian Imperial Army and fought in World War I. He received several awards, including the St. George Cross. After the October Revolution, he was demobilized and worked as a teacher and instructor. In 1919 he returned to the Red Army and fought in the Civil War. After the war, Vasilevsky took part in the fight against the detachment of S. N. Bulak-Balakhovich in Belarus, and fought bandits in the Smolensk province until August 1921. Over the next 10 years, he commanded all three regiments of the 48th Tver Rifle Division and headed the divisional school for junior commanders. In 1927, he graduated from the III Comintern "Vystrel" rifle and tactical advanced training courses for the command staff of the Red Army. In June 1928, the 143rd Regiment was especially singled out as an inspector group during exercises. In the fall of 1930, the 144th Regiment, which was considered the least prepared in the division before Vasilevsky took command, took first place and received an excellent rating during district maneuvers. By order of November 11, 1936, he was enrolled in the Academy of the General Staff of the Red Army, where he studied in the “marshal’s course” that later became famous."

POLITICS_MIKHAIL_TUKHACHEVSKY_DESC: "§YGeneral Description\nBorn:§! §gFebruary 16, 1893, in Aleksandrovsk, Smolensk Governorate, Russian Empire§!\n§YMilitary Career:§! §gMikhail Nikolaevich Tukhachevsky was born on February 16, 1893, into an officer's family. He began his military career by joining the cadet corps, after which he entered the Imperial Military Academy. During World War I, Tukhachevsky demonstrated his talent as a commander, rising to the rank of lieutenant colonel. In 1917, he supported the October Revolution and became one of the prominent military commanders of the Red Army.\n\nTukhachevsky played a key role in the Civil War, participating in significant battles such as the Battle of Moscow and the defeat of various counter-revolutionary forces. In the 1920s, he became one of the architects of Soviet military theory, actively promoting the ideas of deep operations and mechanized warfare.\n\nHowever, his career was marred by political repression."

POLITICS_BORIS_SHAPOSHNIKOV_DESC: "§YGeneral Description\n§YBorn:§! §gOctober 2, 1882 in Zlatoust, Ufa Governorate, Russian Empire§!\n§YMilitary Career:§! §gBoris Mikhailovich Shaposhnikov, became one of the key figures in the military-historical and military practice of Russia and the Soviet Union. He initially made a career in the tsarist army, receiving an education at the 1st Cadet School and then at the Nikolaev Academy of the General Staff, which allowed him to master the basics of military art and strategy. With the outbreak of World War I, Shaposhnikov proved himself to be a capable commander, participating in the planning and conduct of combat operations. His strategic and tactical talent brought him recognition and awards. After the October Revolution, he quickly adapted to the new conditions, joining the Red Army and actively participating in the Civil War, where he commanded various military units. In 1925, Boris Mikhailovich was appointed Chief of the General Staff of the Red Army. This role allowed him to influence the development of military strategy and the organizational structure of the army, introducing innovative approaches and mechanization. His scientific works in the field of military strategy and the concept of operations had a significant impact on the training of Soviet officers. From 1935, he commanded the troops of the Leningrad Military District, receiving the rank of Army Commander of the 1st rank."

POLITICS_NIKOLAY_VATUTIN_DESC: "§YGeneral Description\nBorn:§! §gDecember 16, 1901, in Chepukhino, Voronezh Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nNikolay Fyodorovich Vatutin was born on December 16, 1901, in the village of Chepukhino, Voronezh Governorate, Russian Empire. He was a peasant and graduated from a parish school in 1913. From 1915 to 1917, Vatutin continued his education in the 4th grade of the commercial school in the village of Urazovo, Valuysky District, Voronezh Governorate, where he also received a scholarship. In 1917, the payment of the stipend was suspended, due to which Nikolai Fedorovich left the school, returning to his native village, where he lived and worked until April 1920. In 1920, Vatutin joined the Workers' and Peasants' Red Army and participated in battles against the detachments of Nestor Makhno. In 1922, Vatutin graduated from the 14th Poltava Infantry School, receiving a certificate of the Red Committee from the hands of the Deputy Chairman of the Council of People's Commissars of the Ukrainian SSR M. V. Frunze. From September 1922 to August 1926, N. F. Vatutin served in Bakhmut, Lugansk and Chuguev in the 67th Rifle Regiment of the 23rd Kharkov Rifle Division. In 1929, Vatutin graduated from the M. V. Frunze Military Academy of the Red Army and began his career at the headquarters of a rifle division. In 1937, he graduated from the Military Academy of the General Staff of the Red Army."

POLITICS_SEMEN_TIMOSHENKO_DESC: "§YGeneral Description\nBorn:§! §gDecember 18, 1895, Orman village, Bessarabian Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nHis childhood was spent in modest circumstances, but he always showed interest in education and military affairs. In 1914, at the age of 19, Timoshenko was drafted into the Russian Imperial Army and fought in World War I. He showed bravery and was awarded the St. George Cross of three degrees. After the October Revolution, Timoshenko joined the Red Army and actively participated in the Civil War. In the 1920s, he continued his military career, moving up the ranks and participating in various conflicts.\n\nHe graduated from the Higher Military Academic Courses in 1922 and 1927, and the courses for sole commanders at the N. G. Tolmachev Military-Political Academy in 1930 (management - command, combined arms faculty, tactics department). From February 1930 - commander-military commissar of the 6th Cavalry Corps. He was sent on business trips and to gain experience in Hungary, Austria, and Italy. From August 1933 - deputy commander of the Belarusian military district, and from September 1935 - Kyiv military district."

POLITICS_LEONID_GOVOROV_DESC: "§YGeneral Description\nBorn:§! §gFebruary 22, 1897, Butyrki, Vyatka Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nHe was born in the village of Butyrki in the Vyatka Governorate and graduated from the Konstantinovskoye Artillery School in Petrograd. Govorov served in the army in 1916–1918, and then took part in the Civil War of 1917–1922. In 1920, Govorov was wounded twice: in August, during defensive battles near the village of Serogozy in the Kakhovka region, he received a shrapnel wound to the leg, and in September, during a battle near Antonovka, he received a bullet wound to the arm. For great courage and bravery shown in battles against Wrangel's army during the Perekop-Chongar Operation, Leonid Aleksandrovich Govorov was awarded the Order of the Red Banner in 1921.\n\nIn October 1923, L. A. Govorov was appointed Chief of Artillery of the 51st Perekop Rifle Division. From November 1924, Govorov served as commander of the artillery regiment of this division. From May 1931, he held the positions of Chief of Artillery of the Rybnitsa Fortified Region, from July 1934 - Chief of Artillery of the 14th and 15th Rifle Corps, from February to October 1936 - Head of Department in the Artillery Department of the Kyiv Military District.\n\nHe was actively engaged in self-education. In 1926, he graduated from the Artillery Advanced Training Courses for Command Personnel. In 1930, he graduated from the Higher Academic Courses at the M. V. Frunze Military Academy of the Red Army, and in 1933, he completed the full course of this academy by correspondence, studying at its operational faculty. Having independently studied German, he passed the exam to become a military translator. On February 5, 1936, L. A. Govorov was awarded the military rank of "brigade commander". In the same year of 1936, he was included in the first intake of students of the Academy of the General Staff of the Red Army, where he studied in the "marshal's course" that later became famous."

POLITICS_KIRILL_MERETSKOV_DESC: "§YGeneral description\nBorn:§! §gJune 7, 1897, Nazarievo, Ryazan Governorate, Russian Empire§!\n§YMilitary career:§! §g\nBorn the eldest child in a family of peasants. From the age of seven he helped his father plough and harrow, and from the age of nine he participated in all field work. He graduated from a 4-grade zemstvo elementary school. At the age of 12 he was sent to Moscow for independent work, where he worked as a mechanic in the Khvalev workshops, at the Bordorf metal plant, and the Lehmann factory. Already at his first job, he met workers associated with the revolutionary underground. In 1915, he participated in workers' meetings. Having transferred to work at the Turubiner gramophone factory, where military orders were fulfilled, 18-year-old Kirill was exempted from conscription into the army during World War I. In the Red Army from August 1918. Participant in the Russian Civil War. From August 1918, he served as chief of staff of the Red Guard in Sudogda. Fought on the Eastern, Southern and Western fronts. He was seriously wounded three times. \n\nHe graduated from the Red Army Military Academy in 1921 and in January 1922 was appointed chief of staff of the 1st Tomsk Cavalry Division. From June 1924 to April 1932, he served in the headquarters of the Moscow Military District: head of the mobilization department, assistant to the chief of staff of the district (from September 1924), deputy chief of staff of the district (from July 1928), commander and military commissar of the 14th rifle division (from April 1930), chief of staff of the district (from February 1931). In 1931, he underwent training in Germany. From September 1936, he was in Spain as a military adviser (pseudonym Petrovich)."

POLITICS_PHILIP_GOLIKOV_DESC: "§YGeneral Description\nBorn:§! §gJuly 15, 1900, Borisova, Perm Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nBorn into a family of farmers. Entered first grade in 1908. Finished three years of school in Borisova in 1911. Completed seven years of school at the district gymnasium in Kamyshlov, Perm Governorate, in 1918. Volunteered for the Workers' and Peasants' Red Army on May 30, 1918. Participated in the Civil War. In October 1918, he was appointed regimental correspondent for the division newspaper, Okopnaya Pravda, and for the 3rd Army newspaper, Krasny Nabat. On January 21, 1919, he was seconded for study and completed a two-month military propaganda course in Petrograd in 1919. After the end of the Civil War, he spent 11 years in political work in the troops. He participated in the suppression of kulak rebellions in the Ufa province. In 1931, he graduated from a military school as an external student and was transferred to command work at his own request. From November 1931 - commander of the 95th rifle regiment of the 32nd rifle division. He graduated in absentia from the Frunze Military Academy of the Red Army in 1933. From October 1933 - commander of the 61st rifle division of the Volga Military District. From September 1936 - commander of the 8th separate mechanized brigade."

POLITICS_YAKOV_CHEREVICHENKO_DESC: "§YGeneral description\nBorn:§! §gOctober 12, 1894, Novoselovka, Don Host Region, Russian Empire§!\n§YMilitary career:§! §g\nFrom peasants. Graduated from a two-year rural school in 1910. From 1905 he worked for hire, from 1910 - an apprentice carpenter, from 1912 - a carpenter at enterprises in his district. In 1914 he was called up to the Russian Imperial Army, a participant in World War I on the Romanian front, a senior non-commissioned officer. In November 1917 he left the army, returned to his homeland and joined the Red partisan detachment operating in the Don Host Region, from January 1918 he commanded a platoon in it. An active participant in the Civil War. In the Red Army since October 1918, when his unit joined the regular army, he was appointed deputy squadron commander of the 1st Soviet Socialist Cavalry Regiment, in the 13th and 19th cavalry regiments of the 4th cavalry division. From June 1919, he commanded a squadron. Member of the RCP(b) since 1919. From September 1919, he fought as part of the 1st Cavalry Army, deputy commander of the 1st cavalry brigade, and from October of this year, he was a squadron commander in this brigade of the 4th cavalry division. From November 1920, he commanded the 19th Cavalry Regiment in the same division. Until 1924, he continued to serve in the 1st Cavalry Army in the North Caucasus - from 1921 he commanded a cavalry division, and from 1923 he was deputy regiment commander. He took part in military operations against the troops of Generals P. N. Krasnov, A. I. Denikin, P. Wrangel, the armies of Germany, Austria-Hungary and Poland, the formations of N. Makhno and numerous gangs and peasant uprisings. During the Civil War, he was wounded 5 times and shell-shocked 2 times. From October 1933 to December 1935, he was a student of the special faculty at the Frunze Military Academy. From December 1935, he commanded the 63rd Cavalry Regiment in the Moscow Military District. From April 1936 - Deputy Commander of the 31st Cavalry Division."

POLITICS_NIKANDER_CHIBISOV_DESC: "§YGeneral Description\nBorn:§! §gOctober 24, 1892, Romanovskaya village, Don Host Region, Russian Empire§!\n§YMilitary Career:§! §g\nNikandr Evlampievich Chibisov was born in Romanovskaya village to a Cossack family. He graduated from the Don Theological Seminary in 1912 and worked as a manager of an agricultural warehouse. In October 1914, Chibisov was called up for military service in the Russian Imperial Army and served as a private in the Life Guards Jaeger Regiment. In early 1917, Chibisov was wounded and shell-shocked, after which he served as a stage commandant. In February 1918, he was captured by German troops, but soon escaped and returned to Russia. From the end of April 1919, Chibisov commanded the 86th Rifle Regiment, and from December 1918 he served as assistant to the chief of staff.\n\nFrom November 1921 - at the disposal of the headquarters of the Special Purpose Units (CHON) of the Republic, then assistant to the chief of the 1st department and chief of the operational unit - 1st assistant to the chief of staff of the CHON in Pskov. From November 1923 he served in the Leningrad Military District: assistant to the chief of staff of the 1st Rifle Corps, from November 1924 - chief of the operational unit of the headquarters of this corps, from February 1926 - chief of staff of the 16th Rifle Division, from January 1927 - assistant to the chief of staff, and from August 1930 - again chief of staff of this division. He graduated from the M. V. Frunze Military Academy of the Red Army in 1935. Then again headed the headquarters of the 16th Rifle Division. From November 1936, he was the head of the 2nd department of the Leningrad Military District headquarters."

POLITICS_VASILY_KUZNETSOV_DESC: "§YGeneral description\nBorn:§! §gJanuary 15, 1894, Ust-Usolka, Perm Governorate, Russian Empire§!\n§YMilitary career:§! §g\nGraduated from a two-year elementary school and Solikamsk city school. Worked as an accountant in the Solikamsk zemstvo. In April 1915, he was drafted into the Russian Imperial Army, served as a private in the 236th Reserve Infantry Regiment. In March 1916, he graduated from the 1st Kazan School of Ensigns and was sent as a junior officer to the 120th Reserve Infantry Regiment in Yekaterinburg. In 1917, he was promoted to second lieutenant. In December 1917, he was demobilized. In the Red Army since August 1918. He fought in the Civil War as a company and battalion commander in the 4th Perm Rifle Regiment and the 1st Ufa Rifle Regiment, and from February 1919, he was an assistant commander for combat operations in the 263rd Verkhneuralsk Rifle Regiment. After the end of the Civil War, he commanded various regiments until 1930. In 1928, he joined the All-Union Communist Party (Bolsheviks). In 1930, he graduated from the Rifle Tactical Advanced Training Course for the Red Army Command Personnel "Vystrel" named after Comintern and the Advanced Training Course for the Senior Command Personnel of the Red Army in Moscow. In October 1936, he graduated from the Special Faculty of the M.V. Frunze Military Academy of the Red Army, after which he was appointed commander and military commissar of the 99th Rifle Division in the Kiev Military District."

POLITICS_ANDREY_VLASOV_DESC: "§YGeneral Description\nBorn:§! §gSeptember 14, 1901, Lomakino, Nizhny Novgorod Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nHe was the thirteenth child in the family, the youngest son. The family lived in poverty, which prevented the father from fulfilling his wish to give all his children an education. Andrei's older brother, Ivan, had to pay for his education, and he sent his brother to receive a theological education at the Nizhny Novgorod Seminary. His studies at the seminary were interrupted by the Revolution of 1917. In 1918, Andrei went to study to be an agronomist, but in 1920 he was drafted into the Red Army. Vlasov was drafted into the Red Army on May 5, 1920, into the 27th Volga Regiment in Nizhny Novgorod. On June 1, he became a cadet of the 24th Nizhny Novgorod Infantry Courses. During the war, Vlasov took part in military operations on the Southern Front against Wrangel's White Guard Army and the detachments of Nestor Makhno's anarchist insurgent movement. From 1922, Vlasov held command and staff positions, and also taught. In 1929, he graduated from the Higher Army Command Courses "Vystrel". In 1930, he joined the All-Union Communist Party (Bolsheviks). In 1935, he became a student at the M.V. Frunze Military Academy."

POLITICS_MAXIM_PURKAEV_DESC: "§YGeneral Description\nBorn:§! §gAugust 26, 1894, Nalitovo, Simbirsk Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nHis father was a seasonal carpenter. In 1896, the family moved to the Lena gold mines. After his father's death in 1909, Maxim Alekseevich became a worker at the mines. In 1911, he returned to his native village. In 1915, Purkayev was mobilized into the Russian Imperial Army and served in a reserve rifle regiment. During World War I, he commanded a company and battalion in various units.\n\nAfter the October Revolution, Purkayev joined the RCP(b) and continued serving in the Red Army. In 1922–1923, he studied at the Higher Tactical Rifle School of the Red Army Command Staff named after Comintern "Vystrel". Then Purkayev held various command and staff positions. From January 1930, he served as the head of the 2nd department of the Moscow Military District headquarters. In 1930, he graduated from the Advanced Training Courses for Senior Command Staff at the M. V. Frunze Military Academy of the Red Army. From December 1931 - Deputy Chief of Staff of the Moscow Military District. In 1935, he was sent back to study. In 1936, he graduated from the special faculty of the M. V. Frunze Military Academy of the Red Army. From July 1936 - commander and military commissar of the 1st motorized division."

POLITICS_NIKOLAI_BERZARIN_DESC: "§YGeneral Description\nBorn:§! §gApril 1, 1904, Saint Petersburg, Russian Empire§!\n§YMilitary Career:§! §g\nNikolay Erastovich Berzarin was born into a working class family, a turner at the Putilov Factory. After completing evening courses at an elementary school in 1914, he worked as a laborer at the port. In 1918, Nikolay Erastovich volunteered for the Workers' and Peasants' Red Army and took part in the Civil War. In the 1920s, he underwent training and military service, took part in the suppression of the Kronstadt Uprising and the anti-Soviet underground in the Far East.\n\nMember of the Komsomol (since 1922). Member of the All-Union Communist Party (Bolsheviks) (since 1926). From March 1924, he commanded a platoon of the regimental school of the 5th Amur Rifle Regiment of the 2nd Amur Rifle Division. In 1925, he completed machine gun courses at the Rifle Tactical Advanced Training Courses for Command Personnel of the Red Army "Vystrel" named after Comintern, and in 1927, the advanced training course for command personnel of the Siberian Military District (Omsk). In 1927, he returned to Siberia, where he commanded a platoon. In October 1928, he was appointed course commander of the Command Personnel Courses in Irkutsk. He actively participated in the battles on the CER, after which he continued to serve in the Far East for many years. From February 1935, he was commander of the 77th Rifle Regiment of the 26th Rifle Division of the OKVVA."

POLITICS_ALEXANDER_GORBATOV_DESC: "§YGeneral Description\nBorn:§! §gMarch 21, 1891, Pakhotino, Vladimir Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nBorn into a large family of former landowner peasants. Alexander Gorbatov received his education at a three-grade rural school in the village of Kharitonovo (1899, fall—1902, spring), studied well, "distinguished himself by his abilities in arithmetic, quick and correct problem solving, accessible to few adults." As a teenager, he worked on his father's farm, in winter seasonal work, and in a shoe factory in Shuya. He was drafted into the Russian Imperial Army in 1912 and fought in World War I. In 1917, Gorbatov was demobilized and returned to his homeland, where he became a member of the volost executive committee and the poor peasants' committee. From August 1919 he served as a volunteer in the Red Army, and in the same year he joined the RCP(b). During the Civil War he was a Red Army soldier, a platoon commander, then a squadron commander, from April 1920 he was the commander of the 58th Cavalry Regiment, and from August he was the commander of the Separate Bashkir Cavalry Brigade. He fought against the army of General A. I. Denikin, in the Soviet-Polish war, and at the end of 1920 against the troops of the UPR of Symon Petliura.\n\nAfter the end of the Civil War, from 1921 he was the commander of the 7th Chernigov Red Cossacks Cavalry Regiment in Ukraine, from 1928 he was the commander of the cavalry brigade in the 3rd cavalry division, and from January 11, 1933 to May 1936 he was the commander of the 4th Turkestan Mountain Cavalry Division in the city of Mary, Turkmen SSR. He graduated from the command cavalry courses (1926) and the advanced training courses for senior command personnel in Moscow (1930). When personal military ranks were introduced in the Red Army, he was awarded the military rank of brigade commander on November 26, 1935. From May 1936 - commander of the 2nd Cavalry Division of the 7th Cavalry Corps in the Kiev Military District."

POLITICS_KIRILL_MOSKALENKO_DESC: "§YGeneral description\nBorn:§! §gMay 11, 1902, Grishino, Yekaterinoslav Governorate, Russian Empire§!\n§YMilitary career:§! §g\nFrom a family of farmers. Graduated from a four-grade rural elementary school, two grades of the Ministry of Education college ("ministerial college"). From 1917 to 1919 he studied at the agricultural college at the Yama station near Bakhmut, where, as he later recalled, the poet V. N. Sosyura studied at the same time as him. He was forced to interrupt his studies due to the outbreak of the Civil War. He returned to his native village and worked in the rural revolutionary committee. When the province was captured by troops of the Volunteer Army of General A. I. Denikin, he went into hiding due to the threat of execution. After the village was captured by the Red Army in August 1920, he joined its ranks. He took part in the military actions of the Civil War as part of the First Cavalry Army. He fought as a private soldier against the troops of General P. N. Wrangel and Ataman N. I. Makhno. In December 1920, he was sent for training. He studied at the Lugansk Artillery School and the 2nd Kharkov Artillery School. In May 1921, he was transferred to the artillery department of the Kharkov United School of Red Starshinas, which he graduated from in 1922. Later, he completed advanced training courses for the command staff of the Red Army artillery in Leningrad, and the faculty for advanced training for senior command staff of the F. E. Dzerzhinsky Military Academy. While studying in Kharkov, as part of the school, he participated in battles with gangs on the Don and in the Donbass. From 1922 to 1932, he served in the 6th Chongar Cavalry Division, as a platoon commander in the horse artillery division. During his service in Armavir, he participated in battles against political banditry in the North Caucasus. From 1928 - commander of a training battery, artillery division, chief of staff of an artillery regiment. From 1932, he served in a special cavalry division of the Special Red Banner Far Eastern Army near Chita, first as chief of staff, then, from 1934, as commander of a cavalry regiment. From 1935, he commanded the 23rd mechanized brigade in the Primorsky Territory. From 1936, he has served in the 45th mechanized corps of the Kyiv Military District."

POLITICS_ANDREY_GRECHKO_DESC: "§YGeneral Description\nBorn:§! §gOctober 17, 1903, Golodaevka, Don Host Region, Russian Empire§!\n§YMilitary Career:§! §g\nAndrei Antonovich Grechko was born into a family of a rural blacksmith. He was the thirteenth child in the family. In the Red Army since December 1919, as a volunteer. Participant in the Civil War. Fought as a Red Army soldier in the 11th Cavalry Division of the 1st Cavalry Army on the Southern and Caucasian Fronts. Participant in military operations against the troops of Generals A. I. Denikin and P. N. Wrangel on the Southern Front, the detachments of N. I. Makhno and the liquidation of political and criminal banditry. From September 1921 to July 1922 he served in a separate battalion of the CHON in Taganrog, then was sent to study. Studied at the Crimean Cavalry Courses named after the Central Executive Committee of the KASSR, which he graduated from in August 1923. He was immediately sent to study at the Taganrog Cavalry School of the North Caucasus Military District, and in September 1924 he was transferred to the North Caucasus Mountain Nationalities Cavalry School (Krasnodar). During his studies, he was a squadron sergeant major, and in 1925 he took part in combat operations against bandit formations in Chechnya and in 1926 in Dagestan. He graduated from the cavalry school in 1926. Member of the All-Union Communist Party (Bolsheviks) since 1926. From September 1926 to April 1932 he served in the 61st Cavalry Regiment of the 1st Separate Cavalry Brigade of the Moscow Military District: platoon commander, machine-gun squadron commander. At the head of a squadron, he participated in the parade on Red Square on November 7, 1927. Then - at school. He graduated from the Military Academy of the Red Army named after M. V. Frunze in 1936. After graduation, he served in the Special Red Banner Cavalry Division named after I. V. Stalin of the Moscow Military District (then transferred to the Belarusian Special Military District): assistant to the chief and acting chief of the 1st (operational) part of the division headquarters, commander of the 62nd cavalry regiment."

POLITICS_ALEKSANDR_YEGOROV_DESC: "§YGeneral Description\nBorn:§! §gOctober 25, 1883, in Buzuluk, Samara Governorate, Russian Empire§!\n§YMilitary Career:§! §gBorn into a large family of a tradesman. In 1901 he graduated from the Samara Classical Gymnasium. In the same year he entered military service as a volunteer, was enrolled in the 4th Grenadier Nesvizh Regiment. He graduated with first class (with honors) from the Kazan Infantry Cadet School, where he studied from 1902 to 1905, and on April 22, 1905 he was released as a second lieutenant and assigned to the 13th Life Grenadier Yerevan Regiment. In 1904, he joined the Socialist Revolutionary Party, which set him on the path to participation in the revolution. A career military man of the Russian Imperial Army, a participant in World War I. In January 1916, holding the rank of captain at the Alekseevsky Military School, he was transferred to the Tiflis Grand Duke Mikhail Nikolaevich Military School, where he taught military sciences at accelerated courses graduating ensigns, while also serving as an assistant to the head of the school. In the rank of lieutenant colonel from December 6, 1916. He was wounded and shell-shocked 5 times. After the October Revolution, he participated in the development of the Decree on the organization of the Red Army. From January 1918, he worked in the Military Department of the All-Russian Central Executive Committee. He was a member of the Red Army since 1918, was responsible for the selection of officers for the Red Army, dealt with issues of prisoners and refugees, and from August 1918 commanded armies and fronts in the Civil War. From April 1924 to March 1925 - Commander of the Ukrainian Military District. In 1925-1926 he was a military attaché in China. From May 1926 to May 1927 - Deputy Head of the Military-Industrial Directorate of the Supreme Council of the National Economy of the USSR. From May 1927 to April 1931 - Commander of the troops of the Belorussian Military District. From June 1931 to September 1935 - Chief of Staff of the Red Army. From September 1935 - Chief of the General Staff of the Red Army."

POLITICS_VASILY_BLUCHER_DESC: "§YGeneral Description\nBorn:§! §gDecember 1, 1890, Barshchinka, Yaroslavl Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nVasily Blucher was born into a family of farmers in the village of Barshchinka, Georgievskaya Volost, Rybinsky District, Yaroslavl Governorate; today, the village is part of the Ogarkovskoye Rural Settlement, Rybinsky District, Yaroslavl Oblast. Vasily was the first child in the family. There were four children in the family. In 1904, after a year of studying at a parochial school, Blucher's father took him to St. Petersburg to work. He worked as a "boy" in a store, then as a laborer at the Franco-Russian Machine-Building Plant "Berda", from where he was fired for participating in workers' rallies. In search of work, he came to Moscow. In 1909, he got a job as a mechanic at the Mytishchi Carriage Works near Moscow. In 1910, he was arrested and sentenced to prison for calling for a strike. In 1913-1914, he worked in the workshops of the Moscow-Kazan Railway. With the outbreak of World War I in August 1914, he was mobilized for military service in Moscow. For his military distinctions, he was awarded two St. George Crosses of the 3rd and 4th degrees, the St. George Medal of the 4th degree, and was promoted to junior non-commissioned officer. Due to the wounds he received, in March 1916, Blucher was discharged from the army by the medical commission of the main military hospital with a first-category pension. In June 1916, he joined the ranks of the Russian Social Democratic Labor Party of Bolsheviks. During the Civil War, Blucher fought in the Urals and liberated the Urals from the White troops. For this success, he was awarded the Order of the Red Banner.\n\nLater, Blucher took part in battles in the Far East and in the Civil War in China. In 1928-1929, he served as an assistant to the commander of the Ukrainian Military District, I. E. Yakir. On August 6, 1929, he was appointed commander of the Special Far Eastern Army. In February 1934, at the 17th Congress of the All-Union Communist Party (Bolsheviks), Blucher was elected a candidate member of the Central Committee of the All-Union Communist Party (Bolsheviks). On November 21, 1935, he received the title of Marshal of the Soviet Union. As of 1936, he was engaged in administrative work." 

POLITICS_VITALY_PRIMAKOV_DESC: "§YGeneral Description\nBorn:§! §gDecember 30, 1897, Shuman, Chernigov Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nEarly, under the guidance of his Cossack father, he learned to ride a horse and shoot a gun. Studied at the Chernigov Gymnasium, but was expelled from the 7th grade for revolutionary activities. In 1914 he joined the RSDLP, a Bolshevik. During the October Revolution, he commanded a detachment during the capture of the Winter Palace, and then, during the suppression of the uprising of General P. N. Krasnov, he commanded the Red Guard detachments near Gatchina. In December 1917 in Kharkov he formed the 1st Regiment of the Red Cossacks from volunteers - soldiers, students, workers, which participated in the battles against the Central Rada. In September 1919, the cavalry division of the Red Cossacks under the command of Primakov defended Chernigov from Denikin's forces for a month. During the entire Civil War, he conducted 14 successful raids and won 60 battles.\n\nAfter the Civil War, he graduated from the Military Academic Courses for the Higher Command Staff of the Red Army. In 1925-1926, he was a military adviser to the 1st National Army in China. Here he developed the regulations for the Chinese army, created an officer school, and directly participated in many battles. In 1925-1927, he supported Leon Trotsky in intra-party discussions. Later, he moved away from the Trotskyist opposition, which he officially announced in the press. In 1926-1927, he was the commander of the 1st Rifle Corps of the Leningrad Military District. In 1927-1929, he was a military attaché in Afghanistan. In 1930 — military attaché in Japan. In 1931-1932 he studied at the German Academy of the General Staff. From February 1932 to December 1934 — deputy commander of the North Caucasian Military District, then deputy inspector of higher military educational institutions of the Red Army Headquarters. From May 1936 — deputy commander of the Leningrad Military District, member of the Military Council under the People's Commissar of Defense of the USSR."

POLITICS_MARKIAN_POPOV_DESC: "§YGeneral description\nBorn:§! §gNovember 15, 1904, Ust-Medveditskaya, Don Host Region, Russian Empire§!\n§YMilitary career:§! §g\nJoined the Red Army on May 6, 1920, served as a Red Army soldier in the 242nd Volga Regiment of the 27th Rifle Division, and from February 18, 1921, as a political instructor in the 6th company section of the Pskov Territorial Regiment. On June 16, 1921, he was sent to study, and in October of that year graduated from the 74th Pskov Infantry Courses. From October 15, 1922, he served in the 11th Petrograd Rifle Division: assistant platoon commander of the combined company of the 33rd Rifle Regiment, from November 22, 1922 - platoon commander of the training company of the XI divisional school, from January 2, 1924 - assistant commander of the training company of the XI divisional school, from October 5, 1924 - assistant to the chief of the regimental school of the 33rd Rifle Regiment, from October 3, 1925 - assistant to the chief of the regimental school of the 33rd Rifle Regiment, from February 25, 1926 - chief of the regimental school of the 33rd Rifle Regiment, from October 1, 1927 - commander of the 2nd battalion of the 31st Uritsky Rifle Regiment, from October 1927 - battalion commander of the 33rd Rifle Regiment, from October 1, 1928 - teacher Retraining schools for reserve commanders of the Red Army at the 33rd rifle regiment. While serving in the 11th rifle division in 1925, he graduated from the Rifle Tactical Advanced Training Courses for the Red Army Command Staff named after the III Comintern "Vystrel".\n\nFrom October 1, 1929, he taught tactics at the Leningrad Infantry School. But in January 1930, he was returned to the 11th rifle division and appointed acting chief of staff of the motorized detachment of the 11th rifle division, and was confirmed in this position in March. From November 17, 1931 to April 1932, he served as inspector of motorization of the corps of military educational institutions of the Moscow Military District. Then he was sent to study. In 1936, he graduated from the M.V. Frunze Military Academy. From May 1936 - Chief of Staff of the 9th Separate Mechanized Brigade of the Leningrad Military District."

POLITICS_KLIMENT_VOROSHILOV_DESC: "§YGeneral description\nBorn:§! §gFebruary 4, 1881, Verkhneye, Yekaterinoslav Governorate, Russian Empire§!\n§YMilitary career:§! §g\nFrom the age of 6, Klim herded cattle, collected coal impurities, and worked as an oiler for coal machines in mines. Voroshilov received his primary education at the age of 14 at a two-year zemstvo school in the volost village of Vasilyevka, Slavyanoserbsk district. Since 1896, he worked at the Yekaterininsky plant of the DYuMO, and was fired for organizing a strike. Since 1903, he worked in the city of Lugansk at the Hartmann locomotive plant. He joined the Russian Socialist Labor Party RSDLP(b) at the end of 1903. Since 1904, a Bolshevik, leader of the Lugansk Bolshevik Committee. After the February Revolution of 1917, he was a member of the Petrograd Council of Workers' and Soldiers' Deputies. In early March 1918, Voroshilov organized the First Lugansk Socialist Detachment, which defended Donbass from German-Austrian troops. In early March 1918, Voroshilov organized the First Lugansk Socialist Detachment, which defended Donbass from German-Austrian troops. With the outbreak of the Civil War on April 15, 1918, he was appointed commander of the 5th Army by the Council of People's Commissars of the DKR, then commanded the Tsaritsyn Group of Forces, deputy commander and member of the Military Council of the Southern Front, commander of the 10th Army (October 3 - December 18, 1918), People's Commissar of Internal Affairs of the Ukrainian SSR (January - June 1919), commander of the Kharkov Military District, commander of the 14th Army and the internal Ukrainian Front. After the death of M. V. Frunze, Voroshilov headed the military department of the USSR: from November 6, 1925 to June 20, 1934 - People's Commissar for Military and Naval Affairs and Chairman of the Revolutionary Military Council of the USSR. In October 1933, at the head of the government delegation to Turkey, together with Ataturk, he hosted a military parade in Ankara. From 1934, People's Commissar of Defense of the USSR. On November 21, 1935, he received the title of Marshal of the Soviet Union."

POLITICS_SEMYON_BUDYONNY_DESC: "§YGeneral Description\nBorn:§! §gApril 25, 1883, Kozyurin, Don Cossack Host Region, Russian Empire§!\n§YMilitary Career:§! §g\nParents — poor out-of-town peasants. From childhood, he was an excellent horseman and bladed weapon user. In September 1903, he was drafted into the Russian Imperial Army. He took part in the Russo-Japanese War of 1904-1905. In 1907, he was promoted to junior non-commissioned officer. In November 1908, he was discharged into the reserve, and his superiors, pleased with him, awarded him a third stripe, that is, the rank of senior non-commissioned officer. In 1907, as the best rider of the regiment, he was sent to St. Petersburg, to the Officer Cavalry School for courses for riders for lower ranks, which he completed in 1908 and was promoted to the rank of senior non-commissioned officer. The First World War found Budyonny on leave in his homeland, from where he reported to the assembly point and was sent to the reserve cavalry division in Armavir. After the October Socialist Revolution, he returned to the Don, to the village of Platovskaya, where he was elected a member of the executive committee of the Salsk District Council and appointed head of the district land department. On February 23, 1918, Budyonny created a revolutionary cavalry detachment that operated against the White Guards on the Don. The regiment later grew into a brigade, and in March 1919, into the 4th Cavalry Division, which successfully operated near Tsaritsyn in 1918 - early 1919. \n\nIn 1921-1923, Budyonny was a member of the Revolutionary Military Council, and then deputy commander of the North Caucasus Military District. He did a lot of work organizing and managing the stud farms of the USSR, which, as a result of many years of work, bred new breeds of horses - the Budyonny and Terek. In 1923, Budyonny became the "godfather" of the Chechen Autonomous Region. In 1923, Budyonny was appointed assistant to the commander-in-chief of the Red Army for cavalry and a member of the Revolutionary Military Council of the USSR. In 1924-1937, he was an inspector of the cavalry of the Red Army. In 1932, he graduated from the M.V. Frunze Military Academy. On November 21, 1935, he received the title of Marshal of the Soviet Union."

POLITICS_IVAN_CHERNYAKHOVSKY_DESC: "§YGeneral description\nBorn:§! §gJune 29, 1907, Oksanino, Kiev Governorate, Russian Empire§!\n§YMilitary career:§! §g\nBorn into a family of railroad workers. During the Civil War in April 1919, his father, mobilized into the White Army, and his mother died of typhus almost simultaneously. In 1919, he completed 5 classes of the primary railway school at the Vapnyarka station, until autumn he herded the cows of his fellow villagers, and from October 1919 he became a homeless child. In 1921, 14-year-old Vanya Chernyakhovsky became one of the first organizers of the Komsomol cell in the village of Verbovo. From 1922 he worked as a railway freight conductor in the state procurement office. From April 1923, he worked as a machine cooper and driver at the Proletary cement plant in Novorossiysk. In August 1924, having combat experience in the CHON (territorial units), he volunteered for the Red Army. In 1924-1925, he was a cadet at the Odessa Infantry School. In 1925, he was transferred to the Kyiv Artillery School and graduated in 1928. Member of the All-Union Communist Party (Bolsheviks) since 1928. In 1931, he entered the F.E. Dzerzhinsky Military Technical Academy in Leningrad. In 1932, together with the Faculty of Mechanization and Motorization, where he studied, he was transferred to the newly created Military Academy of Mechanization and Motorization of the Red Army, thus becoming a student of its first recruitment. He graduated from the academy with honors in 1936 with the rank of senior lieutenant. From 1936 - Chief of Staff of the 2nd Tank Battalion of the 8th Mechanized Brigade."

POLITICS_ISSA_PLIEV_DESC: "§YGeneral Description\nBorn:§! §gNovember 25, 1903, Stary Batakoyurt, Terek Region, Russian Empire§!\n§YMilitary Career:§! §g\nBorn into an Ossetian peasant family. Issa Pliev was forced to work as a farm laborer from an early age, but was able to get an education. First, he graduated from a parish school in his native village, and then, with the help of relatives and a Russian teacher, from the 2nd real school in Vladikavkaz in 1918. In the Red Army since March 1922. Served as a Red Army soldier in a special purpose detachment of a special department of the Separate Caucasian Army. From June to August 1923 he was in the reserves, then re-enlisted in the Red Army and sent for training.\n\nIn 1926 he graduated from the Leningrad Cavalry School, after graduating from September 1926 to May 1930 he served as a course commander of the North Caucasian Mountain Nationalities Cavalry School in Krasnodar. Member of the All-Union Communist Party (Bolsheviks) since 1926. Then sent to study at the academy. Graduated from the Frunze Military Academy of the Red Army in 1933 and was appointed head of the operations department of the headquarters of the 5th Stavropol Cavalry Division named after M.F. Blinov in the Ukrainian Military District. From June 1936 - instructor at the headquarters of the United Military School of the Mongolian People's Revolutionary Army in Ulaanbaatar."

POLITICS_GRIGORY_KULIK_DESC: "§YGeneral Description\nBorn:§! §gNovember 9, 1890, Dudnikovo, Poltava Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nBorn into a family of farmers. Finished four years of school. In 1905, he attended the trial where his older brother was sentenced to prison for participating in a strike. After which he became close to revolutionaries, participated in secret meetings, and hid illegal literature and weapons. In military service in the Russian Imperial Army from November 1912. In early 1913, he joined an illegal revolutionary organization, but lost ties with the socialists with the outbreak of war. As part of artillery units, he took part in World War I. He rose through the ranks from a private to a senior fireworker (senior non-commissioned officer). After the February Revolution, he was successively elected chairman of the soldiers' committee of the battery, division, brigade, division, and sent as a delegate to the congress of representatives of the Western Front units. In November 1917, he joined the Bolshevik Party and left the front with a group of armed soldiers. He returned to his homeland, where he formed a Red Guard detachment and fought against German units and Haidamaks. As part of this detachment, in 1918, he joined the 5th Red Army, commanded by K. Ye. Voroshilov. From June 1920, he was the chief of artillery of the 1st Cavalry Army, as part of which he participated in battles against the troops of Denikin, Wrangel, and in the Soviet-Polish War.\n\nFrom June 1921, he was the chief of artillery of the North Caucasian Military District. On July 27, 1924, he graduated from the Military Academy Courses for the Senior Command Staff of the Red Army, assistant to the Inspector of Artillery and Armored Forces of the Red Army. From 1925 - Deputy Chairman of the Military-Industrial Committee of the Supreme Council of the National Economy. In 1926-1929, he was the head of the Main Artillery Directorate of the Red Army. In 1930, he entered the Frunze Military Academy of the Red Army. In 1936, under the pseudonym "General Cooper", he took part in the Spanish Civil War as a military adviser to the commander of the Madrid Front."

POLITICS_ANDREY_YEREMENKO_DESC: "§YGeneral Description\nBorn:§! §gOctober 14, 1892, Markovka, Kharkov Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nBorn into a poor peasant family. He was drafted into the Russian Imperial Army in November 1913. Served as a private in the 168th Mirgorod Infantry Regiment, with which he entered World War I. Fought on the Southwestern and Romanian Fronts, distinguished himself in the Battle of Galicia in 1914. In February 1915, he was transferred as a corporal to the Velikiye Luki 12th Infantry Regiment of the 3rd Infantry Division of the same front, and took part in the siege and capture of Przemysl. In 1917, he was promoted to non-commissioned officer and transferred to the regiment's mounted reconnaissance team. After the October Revolution of 1917, he returned home. In January 1918, he organized the Markov partisan detachment to fight against the German-Austrian interventionists who occupied the Luhansk region. After the Germans left in January 1919, he was appointed deputy chairman of the Markov revolutionary committee and district military commissar. He took part in the Luhansk defense of 1919. From June 1919, he was on active service in the Red Army, was enrolled in the 14th cavalry division of the First Cavalry Army of S. M. Budyonny, in which he actively fought in the Civil War. After the Civil War, he continued to serve as the chief of staff of the regiment, while undergoing training at the Leningrad Higher Cavalry School. From October 1924, he studied at the Leningrad cavalry courses for advanced training of command personnel, which he graduated from in 1925. From October 1925 - Chief of Staff, from December 1929 - Commander of the 79th Cavalry Regiment in the 14th Cavalry Division. In the 1930-1931 academic year, he attended political courses at the Military-Political Academy of the Red Army named after V. I. Lenin, in 1931 he completed courses for sole commanders at the Military-Political Academy of the Red Army named after N. G. Tolmachev and was immediately enrolled in the academy. In 1935 he graduated from the Military Academy of the Red Army named after M. V. Frunze. From January 1936 - Assistant Commander of the 22nd Cavalry Regiment of the 23rd Cavalry Division of the 7th Cavalry Corps."

POLITICS_GEORGY_ZAKHAROV_DESC: "§YGeneral description\nBorn:§! §g5 May 1897, Shilovo, Saratov Governorate, Russian Empire§!\n§YMilitary career:§! §g\nBorn into a poor peasant family. When Georgy was 11 years old, his father took the boy to the city of Saratov. There, the teenager worked as an apprentice at a nail factory, as an errand boy, in a shoemaker's and tailor's workshop, and as a packer in a warehouse. Georgy Zakharov worked as a packer for about 5 years. At the same time, he studied at Sunday school. In March 1916, he was drafted into the Russian Imperial Army. He graduated from the training team of the 133rd Reserve Infantry Regiment (1916), and the Chistopol School of Ensigns (1917). He was promoted to ensign and appointed a junior officer in the 240th Infantry Reserve Regiment. From July 1917, he served as a junior officer and half-company commander in the 1st Infantry Regiment of the 1st Infantry Division. He took part in World War I on the Western Front. In 1919, he joined the Red Army and fought against the White Guards. He graduated from the 1st Saratov Infantry Courses and commanded various units. In July 1922, he was seconded to Moscow to study at the Comintern Higher Tactical Rifle School of the Red Army Command Staff "Vystrel". From November 30, 1931 - Chief of the Military Economic Service of the 17th Infantry Division of the Moscow Military District (which was then commanded by the future Marshal of the Soviet Union I. S. Konev). From September 1932 - assistant to the head of the logistics department of the Military Engineering Academy of the Red Army named after V. V. Kuibyshev, from March 1933 - head of the department of tactical and technical management of the operational-tactical cycle of this academy, from May 1935 - teacher of the department of engineering support of combat and operations of the operational-tactical cycle there. At the same time, he studied in the evening course of the Military Academy of the Red Army named after M. V. Frunze, which he graduated in 1933. In 1936, he was appointed to Leningrad as chief of staff of the 1st rifle corps, which was commanded by the future Marshal of the Soviet Union F. I. Tolbukhin."

POLITICS_MAX_REITER_DESC: "§YGeneral description\nBorn:§! §gApril 24, 1886, Zirskaya volost, Courland Governorate, Russian Empire§!\n§YMilitary career:§! §g\nFrom a family of wealthy Latvian peasants. He graduated from the real school in Libau in 1905. In 1906, he entered the 1st Siberian Rifle Regiment of the 1st Siberian Infantry Division as a volunteer. After which Reiter entered the Irkutsk Military School in 1908, which he also successfully graduated from in 1910. During the First World War, Reiter arrived in the active army with the regiment, fought in the 1st Siberian Rifle Division on the Western Front. He commanded a company, a battalion. In early 1916 he was seriously wounded, after the hospital he was appointed an officer for assignments at the headquarters of the Caucasian Army. In September 1917 he was appointed an officer for assignments at the headquarters of the 12th Army on the Western Front, colonel. In the Red Army since March 1919. He joined voluntarily, immediately after returning from captivity. He served in the Vitebsk infantry regiment of the Cheka troops. From August 1919 - commander of the 99th rifle regiment, and from July - commander of the 97th rifle regiment. From November 1919 he commanded the 32nd rifle brigade. Participant in the Civil War. Member of the RCP(b) since 1922. \n\nIn December 1929 he was seconded to industry, commanded the Transcaucasian industrial district of the militarized guard of industrial enterprises and government buildings of the Supreme Council of the National Economy of the USSR, successfully led the fight against saboteurs and basmachi. In connection with the transfer of the militarized security of the USSR People's Commissariat of Heavy Industry to the OGPU of the USSR in 1931, he worked as deputy head of air defense and fire protection at the Supreme Council of the National Economy of the USSR. Then he was returned to the Red Army and in September 1932 he was appointed commander of the 73rd Omsk Rifle Division in the Siberian Military District. In September 1933 he was sent to study and in 1935 he graduated from the M. V. Frunze Military Academy of the Red Army. From November 1935 he served in the 2nd Department of the Red Army Headquarters. From April 1936 - Chief of the 3rd Department in the Combat Training Directorate of the Red Army."

POLITICS_IVAN_FEDYUNINSKY_DESC: "§YGeneral description\nBorn:§! §gJuly 30, 1900, Gileva, Tobolsk Governorate, Russian Empire§!\n§YMilitary career:§! §g\nBorn into a peasant family. In 1913, he graduated from a rural school in the village of Gileva and began working as an apprentice painter in a construction cooperative of fellow villagers together with his father. Since 1919, his entire future life has been associated with military service. In December 1919, he volunteered for the Red Army. He was enlisted in the 5th Infantry Division and fought as a Red Army soldier on the Western Front during the Civil War. He was wounded twice. After recovering, he was transferred closer to his native places and in March 1921 he was enlisted as a census taker in the mobilization department of the Tyumen military registration and enlistment office. On July 29, 1921, he was transferred to the city of Omsk to the 33rd reserve regiment. In the same 1921, he was sent to study at the 24th Omsk Infantry School of the III Communist International for the command staff of the Red Army - Omsk Infantry School. In 1923, the school was transferred to Vladivostok and renamed. In 1924, I. Fedyuninsky graduated from the Vladivostok Infantry School named after the Comintern. Upon graduation, he was appointed platoon commander in the 107th Vladimir Rifle Regiment of the 36th Transbaikal Rifle Division. In 1929, as commander of the 6th company of the 106th Sakhalin Rifle Regiment of the same division of the Special Far Eastern Army, he participated in the military conflict on the CER. For resourcefulness and skillful leadership, demonstrated personal bravery in these battles, he was awarded the Order of the Red Banner and a personal weapon. In October 1930, he was sent to the command staff courses "Vystrel". After completing them with honors, he returned to the Far East, where he was appointed battalion commander, and in 1936, assistant regiment commander."

POLITICS_KUZMA_GALITSKY_DESC: "§YGeneral Description\nBorn:§! §gOctober 24, 1897, Taganrog, Don Host Region, Russian Empire§!\n§YMilitary Career:§! §g\nHe graduated from a four-year elementary school and a vocational school in 1912. In April 1917, he was drafted into the Russian Imperial Army and served in the 274th Reserve Infantry Regiment in Taganrog. In October 1917, he was demobilized with the rank of junior non-commissioned officer. In August 1918, he joined the Red Army in Lgov. He fought in the Russian Civil War. He joined the newly formed 2nd Ukrainian Insurgent Division and was a platoon and company commander in the 9th Soviet Ukrainian Regiment of the division. From June 1919 - battalion commander of the 1st shock regiment of the 7th Zadneprovskaya Ukrainian rifle division on the Southern Front. Member of the All-Union Communist Party (bolsheviks) since October 1918. In July 1920, he was enlisted as a battalion commander in the 397th rifle regiment of the 45th rifle division and sent to the Soviet-Polish front. In November 1920, he took part in battles against the Army of the Ukrainian People's Republic of S. Petliura and units of the army of General P. N. Wrangel. In June 1921, K. N. Galitsky was sent for training. In 1922, he graduated from the Comintern Higher Tactical Rifle School "Vystrel". From August 1923 to August 1924, he served in the 67th Rifle Regiment of the 23rd Rifle Division of the Ukrainian Military District as a battalion commander and assistant to the regiment commander. Then he went back to study, and in 1927 he graduated from the M. V. Frunze Military Academy of the Red Army. After graduating from the academy, from August 1927 he was the chief of staff of the 1st Rifle Regiment of the Moscow Proletarian Rifle Division, from August 1928 he was the head of the scientific and editorial department of the M. V. Frunze Military Academy of the Red Army, and from May 1930 he was an adjunct of this academy in the Department of History of the Civil War. From May 1931 he was the commander-commissar of the 3rd Rifle Regiment of the Moscow Proletarian Rifle Division, and from January 1934 he was the deputy head of the combat training department of the Moscow Military District headquarters. From May 1934 - assistant commander of the 3rd Crimean Rifle Division in the Kharkov Military District."

POLITICS_DMITRY_LELYUSHENKO_DESC: "§YGeneral description\nBorn:§! §gNovember 2, 1901, Mechetinskaya, Don Host Region, Russian Empire§!\n§YMilitary career:§! §g\nFrom a family of non-local poor peasants. He was the youngest child in a large family (7 children). From the age of 9 he worked as a farm laborer in the summer, studied in the winter, and graduated from a church parish school in 1912. In the spring of 1918 he became a partisan. From April 28, 1919, D. D. Lelyushenko in the Red Army - he fought in the 21st cavalry regiment of the 4th cavalry division as part of the 10th army, and from November 1919 - as part of the 1st Cavalry Army. During the battles of the Civil War he was wounded and shell-shocked twice, two horses were killed under him.\n\nAfter the end of the Civil War, D. D. Lelyushenko remained in military service. He served in the same 21st Cavalry Regiment, which became part of the Petrograd Military District. In 1924 he joined the All-Union Communist Party (Bolsheviks). In 1925 he graduated from the Leningrad Military-Political School named after Engels, returned to his 21st Cavalry Regiment as a political instructor of a machine-gun squadron. In 1927, as an external student, he passed the exams for the full course of the 2nd Leningrad Command and Cavalry School, continued serving in the 21st Cavalry Regiment: from 1928 - military commissar of the regimental school, military commissar of a separate cavalry squadron, in 1929 - regimental commissar. For two years he prepared to enter the Military Academy named after M. V. Frunze. When the first mechanized units began to be created, he began to master the new equipment, and from that time on his military career would be associated with tank troops. In 1929, D. D. Lelyushenko entered the Military Academy of the Red Army named after M. V. Frunze, and graduated in 1933. From 1933, he served as deputy chief of the operations department of the headquarters of the 1st mechanized brigade named after K. B. Kalinovsky, after which he was successively commander of a tank company, chief of the operations department of the 13th mechanized brigade of the 1st mechanized corps named after K. B. Kalinovsky, commanded a training tank battalion."

POLITICS_RODION_MALINOVSKY_DESC: "§YGeneral Description\nBorn:§! §gNovember 23, 1898, Odessa, Kherson Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nLeft home at the age of 11, worked as a farm laborer and in a haberdashery store. In 1914, he went to the front of World War I, was wounded and awarded the St. George Cross of the 4th degree. In 1916, he fought on the Western Front, was wounded and treated in hospitals. In 1917, he took part in the uprising of Russian soldiers in France, after which he enlisted in the Russian Legion of Honor. In 1919, he went to Russia to join the Red Army. In November 1919, he was enlisted in the Red Army, took part in the Civil War on the Eastern Front. In February 1920, he fell ill with typhus and was treated in hospitals.\n\nIn August 1920, he was transferred as a machine-gun crew commander to the 246th Rifle Regiment. In 1921, he was transferred to the 3rd Siberian Rifle Regiment at Slyudyanka station. From December 1921, he served in the 309th Rifle Regiment in Transbaikalia. From August 1922, he served in the 104th Rifle Regiment in Irkutsk. From August 1923, he served in the 243rd Rifle Regiment, then was an assistant commander and commander of a rifle battalion. In 1927-1930, he studied at the M. V. Frunze Military Academy of the Red Army. From May 1930 to January 1931, he was the chief of staff of the 67th Caucasian Cavalry Regiment. From January to February 1931, he was assistant to the chief of the 1st (operational) department of the headquarters of the North Caucasian Military District. From February 15, 1931 to March 14, 1933, he was assistant to the chief of the 3rd sector of the 1st department of the headquarters of the Belorussian Military District. From March 14, 1933 to January 10, 1935, he was chief of the 2nd sector of the same department. From January 10, 1935 to June 19, 1936, he was chief of staff of the 3rd Cavalry Corps. From June 19, 1936 - assistant to the cavalry inspector of the Belorussian Military District for operational matters."

POLITICS_VASILY_CHUIKOV_DESC: "§YGeneral description\nBorn:§! §gFebruary 12, 1900, Serebryanye Prudy, Tula Governorate, Russian Empire\n§YMilitary career:§! §g\nHe completed four years of church parochial school (1907-1911) and at the age of 12 went to Petrograd to earn money, where he became an apprentice in a spur workshop. In 1917, he served as a cabin boy in a detachment of miners in Kronstadt. In 1918, he joined the Red Army and took part in the Civil War. In May 1919, nineteen-year-old Chuikov replaced a wounded commander on the battlefield and from that day until the end of 1921 he commanded the 43rd Regiment of the 5th Rifle Division (before 1919 - the 40th Regiment of the 28th Rifle Division of the 2nd Army). In July 1919, his regiment drove Kolchak's forces out of the villages of Vozdvizhenka and Voskresenskoye and defeated a regiment of White Guards near the village of Allaki, and occupied the villages of Karabolka and Kuyash. During the war, Vasily Chuikov was wounded 4 times. In 1925 he graduated from the M. V. Frunze Military Academy of the Red Army, and in 1927 from the Eastern Faculty of the said Academy. In 1926, under the cover of a diplomatic courier position, he visited China for the first time, visiting Harbin, Mukden, Dairen, Tianjin and Beijing. From November 1927 - assistant to the head of department at the headquarters of the Moscow Military District. From January 1928 - military adviser in China. From September 1929 - head of department at the headquarters of the Special Red Banner Far Eastern Army of V.K. Blucher, participated in the conflict on the CER, including in the negotiations on the capitulation of the Chinese troop group in the city of Manchuria on November 20, 1929. From August 1932 - head of the Advanced Training Courses for Intelligence Command Personnel. He had a certain level of English. He graduated from the academic courses at the Military Academy of Mechanization and Motorization of the Red Army named after I.V. Stalin in 1936. From December 1936 - commander of the 4th mechanized brigade."

POLITICS_ARSENIY_GOLOVKO_DESC: "§YGeneral Description\nBorn:§! §gJune 23, 1906, Prokhladnaya, Terek Oblast, Russian Empire§!\n§YMilitary Career:§! §g\nFrom the Cossacks of the Terek Cossack Host, graduated from a parish school and a higher primary school. In 1920 he joined the Komsomol, and in 1925 he was drafted into the navy. Studied at the M. V. Frunze Naval Academy, at the Special Courses for Command Personnel, and at the K. E. Voroshilov Naval Academy.\n\nFrom 1928 he served in various positions in the navy, including destroyer commander and gunboat navigator. From March 1932 - flagship miner of the minesweeping and barrier brigade of the Far East Naval Forces, from January 1933 - chief of staff of the special purpose torpedo boat detachment, from December 1934 - commander of the Pacific Fleet torpedo boat brigade, from May 1935 - chief of staff of this brigade. In August 1936, he entered the Naval Academy. He volunteered to participate in the Spanish Civil War, where he served as an adviser to the commander of the naval base in the port of Cartagena. After returning to the USSR, he continued his studies at the academy."

POLITICS_SERGEY_GORSHKOV_DESC: "§YGeneral Description\nBorn:§! §gFebruary 26, 1910, Kamenets-Podolsky, Podolsk Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nHis father taught mathematics, his mother taught Russian language and literature. In 1913, the family moved to Kolomna, where his father became an inspector of public schools. In 1926, he graduated from the Kolomna secondary school. He entered the Physics and Mathematics Department of Leningrad University.\n\nFrom October 1927, he served in the navy. He graduated from the M. V. Frunze Naval Academy in 1931 with honors (he was fourth in his class according to his final grades). He began his service in the Naval Forces of the Black and Azov Seas: from November 1931 - watch officer on the destroyer Frunze, from December 1931 - navigator of this destroyer. But already in March 1932 he was transferred to the Pacific Fleet, where he served as a navigator on the minelayer Tomsk, from January 1934 - flagship navigator of the minelaying and minesweeping brigade, from November 1934 - commander of the patrol ship Burun (according to the results of 1936, the ship was recognized as the best in all the Naval Forces of the Red Army)."

POLITICS_PHILIP_OKTYABRSKY_DESC: "§YGeneral description\nBorn:§! §gOctober 23, 1899, Lukshino, Tver Governorate, Russian Empire§!\n§YMilitary career:§! §g\nBorn into a family of farmers. In 1915, he left first for Shlisselburg, and then for Petrograd to earn money. He worked as a stoker, assistant engineer on steamships sailing along Lake Ladoga, Svir, and Neva (now the North-Western River Shipping Company). In 1918, he voluntarily joined the Red Baltic Fleet. A participant in the Civil War, he fought as a sailor on ships of the Baltic Fleet and the Northern Military Flotilla. Member of the RCP(b) since 1919.\n\nIn 1920 he graduated from the Mine School of the Baltic Fleet, in 1922 - courses at the Petrograd Communist University. In 1924 he changed his surname Ivanov to the surname Oktyabrsky, in honor of the Great October Socialist Revolution. In 1928 he graduated from parallel classes at the M. V. Frunze Naval School. From 1928 he served as a torpedo boat commander in the Baltic Fleet. In 1932 he was transferred to the Pacific Fleet, where he commanded a group, division, detachment and brigade of torpedo boats."

POLITICS_GORDEY_LEVCHENKO_DESC: "§YGeneral Description\nBorn:§! §gJanuary 19, 1897, Dubrovka, Volyn Governorate, Russian Empire§!\n§YMilitary Career:§! §g\nFrom peasant stock. Graduated from a parish school in his native village and two years of a municipal school in Novograd-Volynsky. Joined the Russian Imperial Navy in 1913, graduated from the cabin boy school in Kronstadt in 1914. From September 1914 to January 1915 he served as a sailor on the cruiser Gromoboy, then was sent back to study and graduated from the artillery non-commissioned officer class in Kronstadt in 1916. From that time on, he served as a sailor on the cruiser Admiral Makarov, a gunner on the training ship Pyotr Velikiy, and an artillery non-commissioned officer on the destroyer Zabiyaka. He took part in World War I. After the February Revolution of 1917, he actively participated in political life and was elected by the crew first as a secretary and then as the chairman of the ship's committee of this ship. During the October Revolution, he arrived in Petrograd at the head of a detachment of 30 sailors from the crew of Zabiyaka and took part in the storming of the Winter Palace and the capture of the city telegraph station. In 1918, he joined the Soviet Navy. He took part in battles with General Yudenich's troops and the suppression of uprisings. He graduated from the Naval Command School in 1922. After graduating, he served on ships of the Baltic Fleet. From November 1923 to February 1925, G. I. Levchenko studied in the artillery class of the Special Advanced Training Courses for Command Personnel of the Red Army Navy. From February 1925, he served as a senior artilleryman on the battleship Parizhskaya Kommuna, and from May 1927, as the senior assistant to the commander of this battleship. From May to October 1929, he was the commander of the destroyer Voikov. He then studied and completed the Advanced Training Courses for Senior Command Personnel at the Naval Academy. From April 1931, he was the commander-commissar of a detachment of training ships of the Baltic Sea Naval Forces. From January 1932 to January 1933, he was the commander and military commissar of the Caspian Military Flotilla. From January 1933 to August 1935, he was the commander and military commissar of a brigade of battleships of the Baltic Sea Naval Forces. Since August 1935, he has commanded the Separate Destroyer Division of the Black Sea Fleet."

POLITICS_VLADIMIR_KASATONOV_DESC: "§YGeneral description\nBorn:§! §gJuly 21, 1910, Peterhof, St. Petersburg Governorate, Russian Empire§!\n§YMilitary career:§! §g\nHe was fascinated by the sea since childhood, and received his first sea practice on yachting trips. He served in the Red Navy since October 1927. Graduated from the Frunze Naval School (1931), command classes of the Kirov Submarine Training Detachment (1932), and the Voroshilov Naval Academy (1941).\n\nIn February-December 1931, he was the watch officer and navigator of the Bolshevik submarine of the Baltic Sea Naval Forces. After completing the Training Detachment, from February 1932 he was assistant commander of the submarines Komissar, from December 1932 - PL-24, from December 1922 - PL-13 Forel in the Baltic. Then he was transferred to the Pacific Fleet: from May 1934 - commander of the submarine Shch-112."

