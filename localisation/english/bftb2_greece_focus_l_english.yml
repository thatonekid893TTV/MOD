l_english:
 omega_plan:0 "Omega Plan"
 GRE_usa_intergration:0 "§YUnlock decisions to boost copliance and core states in North and South America"
 GRE_africa_stuff:0 "YUnlock decisions to demand our claimed colonies ONLY FROM UK, France, Italy, Portugan, Spain and Belgium"
 GRE_adolfos_1_tt:0 "§GSome members of the German Nazi party join us§!"
 GRE_neutral_tt:0 "§GAll Factions Become Neutral§!"
 RUS_CIVIL_WAR_ROUND_2_TT:0 "§RThe Second Russian Civil War Will Start§!"
 WRU_civil_war:0 "Tsaritst Units"
 WRU_civil_war_DESC:0 "INTO MOSCOW WE SHALL MARCH!"
 WRU_reconvene_the_zemsky_sobor:0 "Reconvene the Zemsky Sobor"
 WRU_reconvene_the_zemsky_sobor_desc:0 "In ages past, the Russian people would assemble in a form of parliament, called the Zemsky Sobor, to discuss matters and decide issues. Until we have decided on what path to take our country on, we should let the people decide what concerns them all."
 WRU_recognized_country_tt:0 "§Y[ROOT.GetNameDefCap]§! is recognized by the international community:"
 WRU_reconvene_the_zemsky_sobor_tt:0 "§Y$WRU_aleksandr_kazembek$§! and §Y$WRU_anastasy_vonsyatsky$§! return from exile."
 WRU_dismantle_the_zemsky_sobor:0 "Dismantle the Zemsky Sobor"
 WRU_dismantle_the_zemsky_sobor_desc:0 "The Zemsky Sobor has served its purpose. Too much democracy can be a dangerous thing, as was shown in 1917. We should not repeat the mistakes of the past."
 WRU_religious_primacy:0 "Religious Primacy"
 WRU_religious_primacy_desc:0 "The importance of religion in our society cannot be understated. It is time the state accepts and supports this primacy - and to make the first steps towards a unification of church and state."
 WRU_romanov_reconstruction:0 "Romanov Reconstruction"
 WRU_romanov_reconstruction_desc:0 "At last our nation once more has a Tsar to lead it. Two decades after the persecution of the last rightful rulers of our country, it is now time to embrace our governing dynasty once more, and to do away with minor impediments to the execution of our Tsar's will."
 WRU_church_candidates:1 "Church"
 WRU_church_candidates_desc:1 "Church has always been an important part of russia and will always be. LONG LIVE THE CHURCH!"
 WRU_CHURCH_CANDIDATES_NAME_TSARIST:0 "Church Candidates"
 WRU_CHURCH_CANDIDATES_NAME_FASCIST:0 "Religious Primacy"
 WRU_CHURCH_CANDIDATES_DESC_TSARIST:0 "The Church has requested permission to send their own candidates to future elections in the Zemsky Sobor. In recognition of the important role the Patriarchate plays in Russian society, we have decided to accept, paving the way to a possibility of a true merger of the will of God and the will of our ruler."
 WRU_CHURCH_CANDIDATES_DESC_FASCIST:0 "The importance of religion in our society cannot be understated. It is time the state accepts and supports this primacy - and to make the first steps towards a unification of church and state."
 WRU_reinstitute_the_mestnichestvo:0 "Reinstitute the Mestnichestvo"
 WRU_reinstitute_the_mestnichestvo_desc:0 "Back in the day, the oldest and most distinguished families ran the affairs of state. This ensured that the Elite was loyal to the state that they ran, and that each new generation would be raised to the exacting standards of the old. We should re-instute this system to secure our new regime."
 WRU_my_brothers_keeper:0 "My Brother's Keeper"
 WRU_my_brothers_keeper_desc:0 "The old Romanov Dynasty had dynastic ties to many other noble families. Some of them still hold power, some of them have lost their thrones. Now that we have restored our own monarchy, we should make sure that the right rulers are put in place in these other countries as well."
 WRU_the_rightful_heir_to_the_empire:0 "The Rightful Heir to the Empire"
 WRU_the_rightful_heir_to_the_empire_desc:0 "While the old Byzantine Empire is long gone, someone still needs to protect the pilgrims to the Holy Land. It is clear that the British and the French are not up to the task, so it should clearly fall to us."
 WRU_the_third_rome:0 "The Third Rome"
 WRU_the_third_rome_desc:0 "With our role as protectors of the Holy Places secure, we are the indisputable defenders of the faith. It is only valid that we should style ourselves accordingly. After the Fall of Constantinople, Moscow has become, without a doubt, the Third Rome."
 WRU_the_third_rome_tt:0 "§Y$WRU_metropolitan_meletius$§! will no longer be available as an advisor."
 WRU_vengeance_for_the_yoke:0 "Vengeance for the Yoke"
 WRU_vengeance_for_the_yoke_desc:0 "Many centuries ago the Mongols launched their brutal invasion of the Russian lands. They remain the only people who could ever be said to have truly conquered Russia. They may seem weak now, but we must make sure that they never return to their former strength so that we may never again feel the Tatar Yoke."
 WRU_westward_bound:0 "Westward Bound"
 WRU_westward_bound_desc:0 "Much of our western possessions were lost with the collapse of our empire, caused by the revolution. The time has come to build up our infrastructure in preparation for reclaiming our rightful possessions."
 WRU_the_old_enemy:0 "The Old Enemy"
 WRU_the_old_enemy_desc:0 "For years, Sweden was a thorn in the Empire’s side. They have again and again attacked Russia and tried to create coalitions against us. Tsar Peter I first began pushing them back, beating them at Poltava. In 1809 we again defeated them, and one would think that made them know their place. But they've kept trying to contest our interests in the Baltic region. It is time to once and for all squash this tiny nation."
 WRU_secure_finland:0 "Secure Finland"
 WRU_secure_finland_desc:0 "The Grand Duchy of Finland has guarded our northern borders for over a century, until it broke away in the civil war. The day has come to reunite Finland with the motherland."
 WRU_secure_the_baltics:0 "Secure the Baltics"
 WRU_secure_the_baltics_desc:0 "The Baltic region has long been an integral part of Russia. They broke away in a moment of national weakness, and must be recovered as soon as possible."
 WRU_panslavic_nationalism:0 "Panslavic Nationalism"
 WRU_panslavic_nationalism_desc:1 "Russia has long been the biggest and oldest brother in our Slavic family. If there is one lesson that we should have learned a long time ago is that the Slavs will always be attacked, bullied, and oppressed unless we stick together."
 WRU_panslavic_nationalism_tt:0 "§RCountries must approve of the agreement for the bonuses to take effect.§!\n"
 WRU_pacify_the_rim:0 "Pacify the Rim"
 WRU_pacify_the_rim_desc:0 "We can not allow a repeat of the war of 1905, when our far-eastern holdings were attacked and found woefully unprepared for the onslaught. We need to invest in the local infrastructure, to be able to quickly shift troops around if the need arises."
 WRU_eastern_expansion:0 "Eastern Expansion"
 WRU_eastern_expansion_desc:1 "Russia's Future lies in the East. After we have tamed Siberia, it is only fitting that we should endeavor to gain even more land and resources here."
 WRU_restore_the_old_eastern_empire:0 "Restore the Old Eastern Empire"
 WRU_restore_the_old_eastern_empire_desc:0 "There once was a time where our glorious empire stretched across the rim of the Pacific, pushing deep into the Americas. Ill-considered decisions since then have traded these possessions for short-term monetary gains. But under our leadership, Russia may once more reclaim its American possessions. We will simply have to make their current owners withdraw from them."
 WRU_intervention_in_the_americas:0 "Intervention in the Americas"
 WRU_intervention_in_the_americas_desc:0 "The many small nations of the Caribbean and of Latin America at large have long been plagued by unstable governments. It is time we flex our political muscle and 'encourage' their domestic political evolution into a direction of strength and stability. Once they develop likeminded governments to our own, they will be offered a place in our growing military alliance."
 WRU_intervention_in_the_americas_tt:0 "Countries being influenced are more likely to become Fascist.\nCountries that become Fascist as a result of this influence will be invited to our faction."
 WRU_memories_of_1905:0 "Memories of 1905"
 WRU_memories_of_1905_desc:0 "The war of 1905 is still a black mark in our people's collective memory. We must exploit this, and exhort the workers in a monumental effort to create a new fleet with which we may dominate the Pacific - and fan the flames of their hatred so that they will call for its use to exact our vengeance against our old enemies."
 WRU_rebuild_the_far_eastern_fleet:0 "Rebuild the Far Eastern Fleet"
 WRU_rebuild_the_far_eastern_fleet_desc:0 "If we are to secure our Far Eastern interests, much less go on the offensive, we must drastically expand our shipbuilding and repair capacity in this region."
 WRU_modernize_the_far_eastern_fleet:0 "Modernize the Far Eastern Fleet"
 WRU_modernize_the_far_eastern_fleet_desc:0 "Tsushima taught us we cannot rely on weight of numbers. To truly carry the day in a naval engagement we require well-trained crews and flawless, modern warships for them to sail. The new fleet we construct must be able to contend with that of our technologically-advanced adversaries in the Pacific."
 WRU_the_lonely_island:1 "[SOV.GetLonelyIslandName]"
 WRU_the_lonely_island_desc:1 "[SOV.GetLonelyIslandDesc]"
 WRU_THE_LONELY_ISLAND_NAME_NORMAL:0 "The Lonely Island"
 WRU_THE_LONELY_ISLAND_NAME_INDEPENDENCE:0 "Great Patriotic War of Independence"
 WRU_THE_LONELY_ISLAND_DESC_NORMAL:0 "The time has come for us to redress the affront which the Japanese perpetrated upon us in 1905. This time, there shall be nothing stopping us from ruling the Sea of Japan and bringing them to their knees!"
 WRU_THE_LONELY_ISLAND_DESC_INDEPENDENCE:0 "The price we paid for [JAP.GetAdjective] assistance in our civil war was far, far too high. No more! We will regain our independence at any cost."
 WRU_an_empire_in_the_pacific:0 "An Empire in the Pacific"
 WRU_an_empire_in_the_pacific_desc:0 "As our Empire begins to stretch across the Pacific, so too must our ship design follow suit, to be able to exercise our power and influence across these vast swathes of ocean."
 WRU_dismantle_the_zemsky_sobor_tt:0 "Half of current §Ynon-Fascist§! support is applied as a §RStability§! penalty:\n"
 WRU_an_empire_in_the_pacific_tt:0 "Gain §Gclaims§! on all states in §YGreater China§!."
 WRU_capital_of_the_tsars:0 "Capital of the Tsars"
 WRU_capital_of_the_tsars_desc:0 "St. Petersburg has throughout history been the capital of our proud nation. Now, with the Winter Palace once more occupied by a Romanov, it is time the official capital is once again relocated to this magnificent city, and that all effort be dedicated to heightening its splendor."
 WRU_capital_of_the_tsars_tt:0 "Which grants:\nLocal Construction Speed: §G+25%§!"
 WRU_the_iron_wall_of_russian_resolve:0 "The Iron Wall of Russian Resolve"
 WRU_the_iron_wall_of_russian_resolve_desc:1 "The Tsar envisions the construction of legions of monstrous weapons of war that would dwarf existing tanks and have no equal on the battlefield. The Russian people are unconquered; it is unconquerable! These machines will be the embodiment of that resolve, and upon them shall break every army that is thrown at us."
 WRU_the_triple_entente:0 "Reforge the Triple Entente"
 WRU_the_triple_entente_desc:0 "Our old enemies in central Europe must be contained. An alliance once existed for this purpose, though our ignominious withdrawal from the Great War spelled its end. Now is the time to reforge those ties."
 WRU_our_slavic_commitments:0 "Our Slavic Commitments"
 WRU_our_slavic_commitments_desc:0 "We once were the protectors of all Slavs, even entering the Great War to defend our weaker Slavic brethren. It is time we once more bear this mantle, and lend our military might to their defense."
 WRU_the_fate_of_romania:0 "The Fate of Romania"
 WRU_the_fate_of_romania_desc:0 "Romania has a substantial Slavic minority, and blocks our land access to the Slavic peoples in the Balkans. To solve both problems in one stroke, Romanian independence must come to an end, by military might, if necessary."
 WRU_russian_corporate_state:0 "Russian Corporate State"
 WRU_russian_corporate_state_desc:0 "The future of Russia lies not in class conflict, but rather in class co-operation. To this end the state shall establish national unions to reconcile the interests off labor and capital, and through these regulate production."
 WRU_the_berlin_moscow_axis:0 "The Berlin-Moscow Axis"
 WRU_the_berlin_moscow_axis_desc:0 "With our new government now firmly installed after the German and Italian models, we should reach out to mend former relations with our western neighbors. If we focus on the views we share, we might well establish a strong and lasting alliance between ourselves and [GER.GetName]."
 WRU_japanese_overtures:0 "Japanese Overtures"
 WRU_japanese_overtures_desc:0 "Now that our western flank has been secured, we must see to our eastern one. The Japanese have much in common with the Germans, and more in common with our own new government than they might want to admit. Let us inquire what the Germans think of extending an invitation to them."
 WRU_into_central_asia:0 "Into Central Asia"
 WRU_into_central_asia_desc:0 "Conquest of Central Asia will bring us into a position to threaten India, while also netting us access to the Persian Gulf. The strategic necessity is clear, and ours is an empire that will not find its graveyard here."
 WRU_the_last_break_southward:0 "The Last Break Southward"
 WRU_the_last_break_southward_desc:0 "A final series of conquests will finally secure the remainder of Western Asia and the Bosporus, allowing us to wrest control from India with our flank secure. We will at long last obtain undisputed access to the seas, from the nearby Mediterranean all the way to the Indian Ocean."
 WRU_the_fate_of_poland:0 "Fate Of Poland"
 WRU_the_fate_of_poland_DESC:0 "Ever since the fall of Poland-Lithuania Poland has been russian. It is time to get them back!"
 
 GRE_uk_boost_tt:0 "§RAll Dominions Abandon Their Overlord§!"
 GRE_purchase_american_guns:0 "Purchase American Guns"
 GRE_purchase_soviet_guns:0 "Purchase Soviet Guns"
 GRE_purchase_german_guns:0 "Purchase German Guns"
 GRE_purchase_japanese_guns:0 "Purchase Japanese Guns"
 GRE_annex_cyprus:0 "Annex Cyprus"
 GRE_support_cyprus_uprisings:0 "Support the Cyprus Uprising"
 GRE_cyprus_goes_gas_gas:0 "Cyprus will receive guns and volunteers. Increases chance of them to survive. Can be clicked once every 35 days"
 GRE_junta_takesover:0 "Military Coup"
 GRE_junta_takesover_desc:0 "Plastiras has find some secret files of our new fascist government, where it is revealed that they are an italian puppet. We must not accept this, greece will never be italian! Greece will be Greek!"
 GRE_please_the_workers:0 "Please The Workers"
 GRE_please_the_workers_desc:0 "The people are currently revolting against our decision to take down the government. We must try to please them all, and we should start by pleasing the communist. Hostile workers will destroy our already in a bad spot economy"
 GRE_control_all_ministries:0 "Siege All Ministries"
 GRE_control_all_ministries_desc:0 "We must get total control over the nation. We must siege all ministries and become the absolute controller of the country"
 GRE_limit_personal_freedom:0 "Limited Freedom"
 GRE_limit_personal_freedom_desc:0 "People keep fighting against the junta. We must make them fear us. We must take the army on the road and force people to submit"
 GRE_befriend_fascists_focus:0 "Befriend Fascists"
 GRE_befriend_fascists_focus_desc:0 "The fascists are the one that suffered the more from this coup. We must try to please and get them on our side"
 GRE_crush_fascists_focus:0 "Crush Fascists"
 GRE_crush_fascists_focus_desc:0 "The fascists having suffered the most from this situation keep fighting against us. We must crush them and their revolutions!"
 GRE_pride_in_army_focus:0 "Focus On The Army"
 GRE_pride_in_army_focus_desc:0 "The army has taken over the city and is securing the roads. We must try and reorginise the army in order to make them more affective"
 GRE_better_industry_focus:0 "Improve Industry"
 GRE_better_industry_focus_desc:0 "We must try to please the people by improving the industry and the economical situation of the nation"
 GRE_stability_in_the_hunda:0 "Stabilise The Hunda"
 GRE_stability_in_the_hunda_desc:0 "The people seem to be accepting our domination. In order to make clear that we arent in the wrong in this situation we will make the laws less strict and give them a little more personal freedom"
 GRE_militarise_the_economy:0 "Militarise The Economy"
 GRE_militarise_the_economy_desc:0 "We must start focusing more in building a military industry. We must start a heavy investing program"
 GRE_buy_equipment:0 "Buy Foreign Equipment"
 GRE_buy_equipment_desc:0 "Our industry isnt reliable enough to support a strong army. We must start purchasing guns from other countries that are able to support their army"
 GRE_greek_equipment_focus:0 "Greek Equipment"
 GRE_greek_equipment_focus_desc:0 "We must start mass producing our own equipment, but we will have to use second and third quality material in order to increase production"
 GRE_patriotic_army:0 "Army Of People"
 GRE_patriotic_army_desc:0 "The greek people want to fight for their country and who are we to stop them from fighting !"
 GRE_profesional_army:0 "Army Of Experts"
 GRE_profesional_army_desc:0 "Every soldier must go into a special train program in order to guarantee that they are in a perfect state"
 GRE_occupation_of_northern_epirus:0 "Occupation Of Northern Epirus"
 GRE_occupation_of_northern_epirus_desc:0 "After the first balkan war we had northern epirus under our control but the major powers forced us to give it to the Albania. Now we will get it back!"
 GRE_cyprus_revolts:0 "Found EOKA In Cyprus"
 GRE_cyprus_revolts_desc:0 "EOKA is an organisation made by Greeks in Cyprus. Their goal is to help us defend our homeland from our enemies and someday achieve enosis"
 GRE_annexation_of_dodecanese:0 "Request The Dodecanese"
 GRE_annexation_of_dodecanese_desc:0 "We will unify all greek people by finally trying to get the dodecanese under our control!"
 GRE_family_god_greece_above_all:0 "Religion, Family And Greece Above All!"
 GRE_family_god_greece_above_all_desc:0 "Our god is the reason we live. Our family is the reason we want to live. But our country is the reason we must give our life for!"
 GRE_onasis:0 "Give Leadership To Onassis"
 GRE_onasis_desc:0 "The death of venizelos was socking for everyone. We will never be able to replace him. But we must try to find the best candidate, in this case Onassis!"
 GRE_dockyards:0 "Invest In Dockyards"
 GRE_dockyards_desc:0 "We must start investing into building a navy in order to rule the world of trading!"
 GRE_research_ships:0 "Invest Into The Navy"
 GRE_research_ships_desc:0 "We must start a heavy funding program in order to improve our naval technology and become the leading naval power!"
 GRE_buy_ships:0 "Buy Convoys"
 GRE_buy_ships_desc:0 "Building our own navy will take a while. Until then, we must purchase foreign ships in order to imrpove our trading empire!"
 GRE_puppet_argentina:0 "Puppet Argentina"
 GRE_puppet_argentina_desc:0 "Bartolomé Mitre was the first president of a united argentina. His father was of greek descent therefore we have decided to claim the whole country."
 GRE_escape_plan:0 "Escape Plan"
 GRE_escape_plan_desc:0 "We must not allow our enemies to conquer our land. We will escape to argentina and be a government in exile from there!"
 byz_triumph_for_iberia:0 "Triumph for Iberia"
 byz_triumph_for_iberia_desc:0 "Iberia has come under our protection again. This time we wont fail and we will keep our holdings in giblatar and dominate the mediterranean!"
 GRE_open_foreign_subsidized_factories_tt:0 "One §YMilitary Factory§! and one §YCivilian Factory§! will be added for each of the following countries that has an §Yopinion§! of §YGreece§! greater than §G70§! (§G55§! for §Y[ITA.GetNameDef]§!) \n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[CHI.GetNameDef]§!, §Y[JAP.GetNameDef]§!, §Y[USA.GetNameDef]§!, §Y[ITA.GetNameDef]§!, §Y[GER.GetNameDef]§!, and §Y[SOV.GetNameDef]§!."
 GRE_gordian_knot_tt:0 "All signatories will declare war on §YTurkey§! alongside §YGreece§! to fulfill the §YMegali Convention§!'s stipulations."
 GRE_Hellenic_Return:0 "Hellenic Return"
 GRE_Hellenic_Return_desc:0 "The great powers of Europe examine us with awe. After years of oppression, we return to the grand european stage, and now we are ready to make another impact, just as we had years ago."
 GRE_Petition_to_the_Allies:0 "Petition to The Allies"
 GRE_Petition_to_the_Allies_desc:0 "With the allies behind us, we can ensure that the communists and fascists of Europe can not and will not oppress us."
 GRE_Allied_Investments:0 "Allied Investments"
 GRE_Allied_Investments_desc:0 "The Allies have expressed their willingness to work with us. Maybe we can convince them to encourage entrepreneurs to construct factories and dockyards in our new nation."
 GRE_Request_British_Armenia:0 "Request British Armenia"
 GRE_Request_British_Armenia_desc:0 "As a part of the agreement between ourselves and the UK, they received an Armenian mandate in the northeast of Turkey. It doesn't make much sense that they govern Armenia when they don't share a border, but we have a plan. We will bring this argument to the British and see what they think."
 GRE_Greek_Defense_Union:0 "Hellenic Defense Union"
 GRE_Greek_Defense_Union_desc:0 "Now that the Turks are gone, we can form a Balkan Pact of our own, without them. We shall spearhead our own faction, and possibly invite others later on."
 GRE_Invite_Romania:0 "Invite Romania"
 GRE_Invite_Romania_desc:0 "The Romanians have long been an ally of us. It is time to invite them to a formal alliance so that we can ensure each others independence."
 GRE_Invite_Yugoslavia:0 "Invite Yugoslavia"
 GRE_Invite_Yugoslavia_desc:0 "While we have not always been the best of allies, we have fought together before. We shall set our differences aside, and invite the Yugoslavians to a formal alliance to ensure each others independence."
 GRE_Deal_With_Hungary:0 "Preempt Hungarian Aggression"
 GRE_Deal_With_Hungary_desc:0 "The Hungarians are beginning to experiment with far too many fascist ideas. It will not take long before they begin to make demands and threaten our independence. We must pacify them before they get ambitious."
 GRE_Invest_In_Our_New_Lands:0 "Invest in Our New Lands"
 GRE_Invest_In_Our_New_Lands_desc:0 "Now that we have recovered and reunited the Greek people, it's time we begin to invest in these new regions to help build trust with our new residents."
 GRE_Pacify_Bulgaria:0 "Pacify Bulgaria"
 GRE_Pacify_Bulgaria_desc:0 "The Bulgarians are a threat to us, and to peace in the Balkans. We have to pacify them if we wish to continue to make progress in building peace and trust between all Balkan nations."
 GRE_Liberate_Albania:0 "Liberate Albania"
 GRE_Liberate_Albania_desc:0 "The Albanians deserve a chance at self determination. We will give them a chance in our faction, and ward off the Italians from ever claiming their territory again."
 GRE_elections_big:0 "Elections Ahead"
 GRE_elections_big_desc:0 "Election day is coming in greece. We must choose a leader who can make our nation stable again, after the total collapse of the past years"
 GRE_get_rid_of_king:0 "Place The King Under House Arrest"
 GRE_get_rid_of_king_desc:0 "Due to support growing for other parties, the king wont allow elections to happen. We must place Demerzi under house arrest in order to assert our dominance"
 GRE_it_is_tim_to_choose:0 "Time To Choose"
 GRE_it_is_tim_to_choose_desc:0 "Our time has come! We must finally choose the leader of our country. We must find someone who can bring stability to the nation"
 MAC_a_blast_from_past:0 "A Blast from Past"
 MAC_retake_egypt:0 "Retake Aégyptos"
 MAC_retake_egypt_desc:0 "Egypt the finest jewel on the Mediterranean, the mother of the world as the Arabs call it, one of the greatest civilizations in history should return to our empire as soon as possible.It is the place where Alexander built the glorious city of Alexandria, with it's magnificent  library, that contained the mysteries and knowledge of the ancient world."
 MAC_destroy_bulgaria:0 "Destroy Voulgaría"
 MAC_destroy_bulgaria_desc:0 "Large parts of Thrace and its surroundings were occupied by a barbarian tribe which calls itself Bulgarians. We need destroy them like we destroyed the Odrysians and use the Danube to defend our west."
 MAC_dismantle_serbia:0 "Dismantle Servía"
 MAC_dismantle_serbia_desc:0 "These Serbians are daring enough to occupy the north of our kingdom, we will need to teach these barbarians a lesson. Their downfall will allow us to subjugate all of Illyria."
 MAC_annex_albania:0 "Annex the Illýrioi"
 MAC_annex_albania_desc:0 "The weird Illyrians are currently occupying northern Epirus and dangerously encroach on our borders, we will need to push these barbarians out of our homeland again to secure the kingdoms western border."
 MAC_castrate_the_pretenders:0 "Megáli Ellás"
 MAC_castrate_the_pretenders_desc:0 ""The Roman Empire tried to emulate my great conquest and yes they sure have come far but they never managed to do what I did an subjugate the vast lands to the east, instead they fought lesser tribes in the west of Europe. Their pure luck finally ran out with the great barbarian migrations but today they can be witness and even part of the real empire Caesar and Augustus idealized so much.""
 MAC_to_west:0 "Eís Dysmín"
 MAC_to_west_desc:0 "The west of Europe always offered our people great paths for expansion and new wealth, Hellens colonized as far as Iberia and created great cities. But our great empire never managed to bring the west to heel and my bickering successors preferred to fight with each other instead. We will do with the west as we did with the east and sweep them away under our mighty Phalanx."
 MAC_war_in_carpathia:0 "Mávra Óri"
 MAC_war_in_carpathia_desc:0 "The first frontier are the Carpathians and the Pannonian Basin. We are deep in Barbarian lands and have to face fierce warlike people. It is important to secure this area as a staging ground for further conquests."
 MAC_destroy_the_huns:0 "Destroy the Gótthoi"
 MAC_destroy_the_huns_desc:0 "Germania, land of vast forests and fierce warriors. The barbarians here are especially warlike and it seems little has changed according to my advisors since then. Germania today is the heart of Europe and holds great resources. We need to secure this area and add it and its military knowledge to the greater hellenic world."
 MAC_attack_france:0 "Retake Massalía"
 MAC_attack_france_desc:0 "Gaul, land of the Celts, has fallen to Latin and Germanic tribes and still seems to be a prominent power today. We will continue what the brave colonists in Massalia started and bring their vast and fertile lands into the light of our great civilization."
 MAC_albion_must_submit:0 "Vretanía must submit"
 MAC_albion_must_submit_desc:0 "The twisted empire of Albion or "Britain" as they like to call themselves seem to claim the world and even its seas for themselves, they posses the hubris of the Persians but do they also have the arms to back up their challenge to my claims of universal Empire ? The sun will set over perfidious Albion and I, Alexander will make sure of this."
 MAC_pillage_iberia:0 "Pillage the Ivirikí Peninsula"
 MAC_pillage_iberia_desc:0 "The rich lands of Iberia are ripe for the taking, with most of Europe in our fold, the peninsula is the final frontier on this continent. Iberia will be the crown in my Conquest of Europe and with it, east and west are finally united under one empire and one civilization."
 MAC_to_east:0 "Eís Anatolín"
 MAC_to_east_desc:0 "After we secured our homeland we can turn our eyes towards the east, much of my work has been undone but we will complete my fathers vision, i will fulfill my destiny and reclaim the Empire. I have learned from the past mistakes, this time the Empire will be eternal. For a new age of the second Hellenic Civilisation dawns upon us."
 MAC_remove_kebab:0 "Engýs Anatolí"
 MAC_remove_kebab_desc:0 "These barbarians called Turks have seized Asia Minor and pushed out its Hellenic population. We will need to undo the foul deeds of these Barbarians and subjugate them into our empire. Their destruction will pave our road to the East"
 MAC_seize_arabia:0 "Mési Anatolí"
 MAC_seize_arabia_desc:0 "I still remember i have had plans for this Area before i took my rather long nap. Arabia would have been the last piece in the puzzle of the east but today they will give us vital resources and secure our supply to the east by sea. They need to become part of the realm."
 MAC_eliminate_iran:0 "Eliminate the Pérsaí"
 MAC_eliminate_iran_desc:0 "The old enemies are still around it seems although they have embraced another wicked cult it seems. The Persians need to be molded into a great Hellenic civilisation, they are the link between east and west. However their greedy rulers always tried to destroy the more noble people, we will put an end to that. Remember Thermopylae!"
 MAC_the_way_to_india:0 "Ápo Anatolí"
 MAC_the_way_to_india_desc:0 "Last time my armies were tried and exhausted, we were on campaign for years, but now thanks to all the marvels of technology, we will not need to deal with these issues, trains and aircraft secure our supplies and our forces will be deployed much faster. India is within our grasp and we will take it away from the abomination that calls itself a "British Empire""
 MAC_the_way_to_china:0 "The Sirikí"
 MAC_the_way_to_china_desc:0 "After our Conquest of India and the establishments of outposts in New Bactria, the road to the wealth of the east has been opened. China currently is weak and divided and only waits for a true Hero to claim their Mandate of Heaven."
 MAC_remove_russia:0 "Annex the Sarmátes"
 MAC_remove_russia_desc:0 "The Land high in the North, the fabled realms of Hyperborea are the next frontier. We will destroy the Barbarian threat and open the Land to Hellenic colonists who dare to venture beyond the Black sea."
 GRE_avenge:0 "Four Centuries of Vengeance"
 GRE_avenge_desc:0 "We have not forgotten the crushing defeat of the Byzantine-Ottoman wars, two hundred and fourteen years of warfare resulted in the Eastern Roman Empire collapsing completely. The Ottomans took advantage of misrule and infighting, they will not have the same advantage this time."
 GRE_national_service:0 "Return of the Akritai"
 GRE_national_service_desc:0 "The Akritai were a fighting force of Greek soldiers deployed to defend the Empire’s eastern borders against Muslim invaders. Their legendary exploits through epic tales and songs, we shall forge our own infantry into a worthy successor to these legendary heroes."
 GRE_art_of_war:0 "Art of War"
 GRE_art_of_war_desc:0 "The Byzantine Army evolved from the Roman Legions, continuing their prestige and combat prowess. Centuries of warfare resulted in the creation of strategies to defeat our mortal enemies.These manuals enable the wisdom of prior generations to find its way within our modern military."
 GRE_orthodox_defence:0 "The Ecumenical Councils"
 GRE_orthodox_defence_desc:0 "Historically the Byzantine Emperor held an all powerful role as defender of the Church, in these difficult times we must serve the Lord the best we can. As the Byzantine Emperors did, we shall establish Ecumenical councils to aid in enforcing complete devotion to the Church."
 GRE_metaxas_youth:0 "Byzantine Youth"
 GRE_metaxas_youth_desc:0 "It is of great importance that the values of our new state be preserved through future generations, therefore we must establish a national youth organisation that can cultivate heroic idealism amongst the boys of girls of Greece."
 GRE_retake:0 "Retake Constantinople"
 GRE_retake_desc:0 "When Constantinople fell in 1453 it marked the end of an era, the sacred imperial city had been besieged many times however when the remnants of the Byzantine army fled it would be the last time that the city would be under imperial control. That is until now, the Ottomans are weak, we will retake the city and proclaim it as our new capital!"
 GRE_anatolia:0 "Dominate Anatolia"
 GRE_anatolia_desc:0 "Anatolia is our rightful land, the vast beauty and riches of the land are polluted by the Turks who are not worthy to rule themselves let alone others. From the ancient Greek city states to Alexander the Great’s conquest, Anatolia has historically belonged to us."
 GRE_purple_pheonix:0 "The Purple Phoenix Rises!"
 GRE_purple_pheonix_desc:0 "Like a phoenix rising from its ashes, the Double-Headed Eagle once more stands triumphantly above the Greek people. With the Ottomans crushed and the Greek military occupying Anatolia, it is time to restore our birthright! Staurè Christou chárin christianoús chárize!"
 GRE_secure_south:0 "Secure the South"
 GRE_secure_south_desc:0 "With the collapse of the Ottoman Empire, the rest of Anatolia and the Levant are in a state of disarray. Without a unified Ottoman presence we can march all the way south and tear down the walls of Cairo. To the Nile!"
 GRE_march_north:0 "March to the North"
 GRE_march_north_desc:0 "Austria-Hungary’s power in the Balkans is rapidly diminishing whilst Bulgaria and Serbia have been at each other's throats. Now is the perfect time for us to make our move, we shall march our armies north and secure the Balkan powder keg before it blows up in our face."
 GRE_rome:0 "Reclaim Rome"
 GRE_rome_desc:0 "The collapse of Italy has left the peninsula fragmented, therefore we see an opportunity to restore true Roman authority over Rome. The Byzantines were the last remnants of Rome, and now we too can claim legitimacy as successor to the greatest empire in mankind’s history!"
 GRE_africa:0 "Exarchate of Africa"
 GRE_africa_desc:0 "Control over the North African coast is crucial to trade and transportation through the Medditeranean, the Byzantines understood this well and so established an Exarchate to bring order to the uncivilised tribes of Africa. Let us follow in their footsteps."
 GRE_the_venizelists_win:0 "Elefterios Venizelos Wins!"
 GRE_the_venizelists_win_desc:0 "The concept of Democracy was founded by the ancient athenians. After gaining our independence from the ottomans we tried to follow this concept, but he failed and adapted on the concept of monarchy. Now, with democratic popularity growing all over europe, we must adapt the concept that we gifted to the world"
 GRE_economic_reforms:0 "Economic Reforms"
 GRE_economic_reforms_desc:0 "Our nation has been hit really hard by the economic crisis. We must rebuild the economic system of our country in order to deal with it in the best way possible"
 GRE_the_vast_exodues:0 "Vast Exodus"
 GRE_the_vast_exodues_desc:0 "The last century the vast majority of the population has moved to the capital. This causes a lot of problems due to population density. We must reverse this effect in order to boost our agriculture"
 GRE_uk_guarantee:0 "Protection By Great Britain"
 GRE_uk_guarantee_desc:0 "Great Britain currently has the biggest empire known to man. Building a strong relation with them can help us guarantee our independence forever"
 GRE_democratic_guarantees:0 "Seek Democratic Guarantees"
 GRE_democratic_guarantees_desc:0 "We and the French have something in common. We were the first countries influenced by the wave of revolutionary ideas. We must strengthen our ties in order to continue being free"
 GRE_fascist_guarantees:0 "Fascist Guarantees"
 GRE_fascist_guarantees_desc:0 "Germany is the biggest industrial power of europe. We must strengthen our ties in order to secure our freedom"
 GRE_communist_guarantees:0 "Allign Ourselves With The Soviets"
 GRE_communist_guarantees_desc:0 "The red giant has the biggest army ever known to man in order to guarantee its independence. With them on our side, noone will even dare to think of attacking us"
 GRE_unstopable_foreign_relations:0 "Overpowered Foreign Relations"
 GRE_unstopable_foreign_relations_desc:0 "Venizelos is a talented man who can handle the foreign relations better than anyone else. With him as a leader we are unstopable!"
 GRE_develop_local_policy:0 "Local Reforms"
 GRE_develop_local_policy_desc:0 "Our foreign policies may be the best it has ever been, but we are still in the middle of a crisis and we must try to develop our local policy"
 GRE_a_new_king:0 "Metaxas Starts a Dictatorship"
 GRE_a_new_king_desc:0 "There have been a lot of problems to our country the last decades. An ambitious man, Metaxas, stages a coup in order to finally solve every problem"
 GRE_start_the_metaxas_project:0 "The Metaxas Project"
 GRE_start_the_metaxas_project_desc:0 "First step is to boost our military industry to guarantee our independence from any potentional invaders"
 GRE_focus_on_defence:0 "Focus On Defence"
 GRE_focus_on_defence_desc:0 "The bulgarians have been aggresive towards us. We must reenforce our protection in the border in order to avoid losing any possible conflict"
 GRE_father_of_greeks:0 "Father Of Greeks"
 GRE_father_of_greeks_desc:0 "Metaxas believes he can improve greece. He believes he can be the one who will make greece great again"
 GRE_press_censor:0 "Press Censorship"
 GRE_press_censor_desc:0 "Being a dictator with fascist ideas, Metaxas wants to project a fake reality to people in order to boost his popularity"
 GRE_establish_a_spy_network:0 "Establish A Spy Network"
 GRE_establish_a_spy_network_desc:0 "Building a spy network will allow us to prevent any possible coup. Preventing coups and keeping Metaxas as a ruler is a prioriy"
 GRE_hidden_dictators:0 "Dictators In The Shadows"
 GRE_hidden_dictators_desc:0 "We have gained the support of most adults. Now we need to gain the support of the new generations in order to prevent the birth of any Anti-Metaxist ideas in the future"
 GRE_boost_the_national_spirit:0 "Boost The National Spirit"
 GRE_boost_the_national_spirit_desc:0 "The second step is to boost the spirit of our people. We will never manage to gain full control of greece if the people dont share the same fascist ideas with us"
 GRE_italian_investments:0 "Request Italian Support"
 GRE_italian_investments_desc:0 "Italy has managed to massively improve their economy the last years. We should start learning from them and ask for their help in order to become an industrial power"
 GRE_allied_investments:0 "French And British Industry"
 GRE_allied_investments_desc:0 "The French and the British have always been supporting our country. This time, we want them to support us once more and help us industrialise"
 GRE_soviet_onion:0 "Ask The Soviets For Help"
 GRE_soviet_onion_desc:0 "The soviet union has managed to build the strongest industry in europe. We should start nagotiations hoping that they will help us"
 GRE_fascism_takeover:0 "Fascists Take Over"
 GRE_fascism_takeover_desc:0 "The fascist government takes over greece. Due to the unpopularity of the ideology macedonia and thrace, being influenced by bulgaria have decided to unite with them. Crete has decided to break away. We must pull demand their control immediently"
 GRE_protecting_the_fatherland:0 "Securing The Fatherland"
 GRE_protecting_the_fatherland_desc:0 "Tensions have been growing all over europe. Staying neutral wont always be an option and we might get overrun by an enemy. We must organise resisting units in case this ever happens"
 GRE_dodecanese_agreement:0 "The Dodecanese Agreement"
 GRE_dodecanese_agreement_desc:0 "The dodecanese have been owned by Italy since the fall of the Ottoman empire. The population of these islands is mostly greek. We must nagotiate with the italians in order to keep them"
 GRE_northen_epirus_agreement:0 "Spread Fascism"
 GRE_northen_epirus_agreement_desc:0 "We must help our brothers escape from their evil government and build a powerful fascist country"
 GRE_crete_is_ours:0 "Crete Is Greek!"
 GRE_crete_is_ours_desc:0 "Crete has always been greek. When greece got independence the cretans fought for a century trying to unite. Now they have decided to break away due to the unpopular government. We wont accept that and we will demand reunification"
 GRE_retaking_our_land_from_bulgaria:0 "Retaking Our Northern Lands"
 GRE_retaking_our_land_from_bulgaria_desc:0 "Bulgaria took advantage of our crisis and heavily infuenced thrace and macedonia in order to finally unite with them. This is unacceptable! We will get this lands back and cause the third balkan war"
 GRE_allies_in_the_balkans:0 "Possible Allies In The Balkans"
 GRE_allies_in_the_balkans_desc:0 "Fascism is a really unpopular ideology. We must spread this ideology all over the balkans trying to get new allies"
 GRE_the_resourches:0 "A Country Full Of Resources"
 GRE_the_resourches_desc:0 "Greece has a lot of natural resources. We must take advantage of this in order to boost our economy and stop importing from other countries"
 GRE_we_are_all_over_the_world:0 "We Are Superior"
 GRE_we_are_all_over_the_world_desc:0 "We, the greeks, rightfully deserve the title of the best country. Our nation has finally starting to improve after years of downfall. We will make greece a paradise!"
 GRE_boost_our_faction:0 "Boost The Axis Powers"
 GRE_boost_our_faction_desc:0 "We are now a part of the Axis. In order to show our support to the faction and contribute on the efforts to claim our rightful lands we have decided to invest in the other members"
 GRE_09_begin_reconstruction:0 "A Powerful Economy"
 GRE_09_begin_reconstruction_desc:0 "If we want to be called a major country we must improve our industry. We will start heavily investing into it in order to become stronger than anyone who might try to oppose us"
 GRE_motherland:0 "The Workers Revolt"
 GRE_motherland_desc:0 "The communits government takes over greece. Due to the unpopularity of the ideology macedonia and thrace, being influenced by bulgaria have decided to unite with them. Crete has decided to break away. We must pull demand their control immediently" 
 GRE_supreme_economy:0 "Supreme Economy"
 GRE_supreme_economy_desc:0 "Our financial situation is pretty bad. We must reform our economic policies taking as an example the soviet economy"
 GRE_anarchist_economy:0 "Anarchist Economy"
 GRE_anarchist_economy_desc:0 "Our financial situation is pretty bad. We must reform our economic policies taking as an example the anrchist economy"
 GRE_stronger_communist_goverment:0 "Stronger Government"
 GRE_stronger_communist_goverment_desc:0 "Our communist government has managed to rebuild the country and make it more stable than ever. We must support their fight against the capitalists pigs!"
 GRE_plan_west:0 "A Western Like Economy"
 GRE_plan_west_desc:0 "In order to imrpove our economy we must look to the west. We must take example from economic powers such as the USA and Germany"
 GRE_the_prusya_line:0 "Expand The Military Industry"
 GRE_the_prusya_line_desc:0 "Taking as an example the superior german economy we should start investing into our military industry. We must build an industry that can support the strong greek army"
 GRE_invest_anti_air:0 "Invest In Anti Air"
 GRE_invest_anti_air_desc:0 "Enemy planes should not be able to fly in our skies. We should study the swiss air defence system in order to create a system ready to shoot down any enemy plane that might enter our airspace"
 GRE_the_prusya_army:0 "The Cretan Army"
 GRE_the_prusya_army_desc:0 "The cretans are build different than the average greek. Most of them are willing to fight using only their hands, knowing that they will die. Having them in the army will be a blessing"
 GRE_expand_poznan_forts:0 "Improving The Navy"
 GRE_expand_poznan_forts_desc:0 "Looking at the brits, they have managed to build the biggest empire known to mankind due to the size of their navy. Developing the navy will allow us to dominate the seas and finally expand our nation"
 GRE_hel_fortified_area:0 "Expanding At All Fields"
 GRE_hel_fortified_area_desc:0 "Improving at all fields is really important. The french have managed to build a similar size military, naval and civilian industry and they have develop all the 3 fields"
 GRE_local_western_plans:0 "Stratigical Improvements"
 GRE_local_western_plans_desc:0 "The Italians have managed to build a really weak army due to the decision to use outdated tactics and not study recent ones. We must prevent this for happening to us in order to guarantee our freedom"
 GRE_sudeten_mountaineers:0 "Greek Mountaineers"
 GRE_sudeten_mountaineers_desc:0 "Greece is full of mountains. The terrain is unfavorable for using tanks and even basic infantry. We must imrpove our mountaineers in order to fight in the terrain of our country"
 GRE_silesia_fortified_area:0 "Clearing The Land"
 GRE_silesia_fortified_area_desc:0 "Our country has a lot of unusable land. If we want to expand we must clear this land in order to build more factories"
 GRE_complete_plan_west:0 "Like The West"
 GRE_complete_plan_west_desc:0 "We have managed to create an economical system really similar to the west. We can start improving the now stable economy on our own!"
 GRE_plan_east:0 "An Eastern Like Economy"
 GRE_plan_east_desc:0 "In order to imrpove our economy we must look to the east. We must take example from the economic powerhouse called the USSR"
 GRE_eastern_conscripts:0 "Expand The Conscription"
 GRE_eastern_conscripts_desc:0 "Our country has been facing a really serious problem since the events of the asia minor campaign in terms of manpower. We must increase the conscription and make a powerful army"
 GRE_belorussian_army:0 "The Spartan Army"
 GRE_belorussian_army_desc:0 "Peloponnese has been really important for greece. It was the home of the glorious spartans. We must try to restore the glory of sparta by recruting brave soldiers from there"
 GRE_ruthenian_army:0 "The Macedonian Army"
 GRE_ruthenian_army_desc:0 "Alexander and his soldier managed to conquer almost all the known world back in his time. The macedonians are clever men who arent willing too give their guns in their enemy. They will be a useful addition in the army"
 GRE_fortification_of_belarus:0 "Military Program"
 GRE_fortification_of_belarus_desc:0 "There are a lot of people who would actually like to help the army but there is a lack of equipment. If we want them to protect our country we must give them guns. We must build more factories to make the required amount of guns"
 GRE_fortification_of_ukraine:0 "Industrial Program"
 GRE_fortification_of_ukraine_desc:0 "Our economy has been destroyed from the economic crisis we have been through. While we try to improve it by escaping the crisis we should also try to expand it in order to support the needs of our own people"
 GRE_supply_the_rail_nexus:0 "Greek Gas"
 GRE_supply_the_rail_nexus_desc:0 "Our nation has an enormous amount of petrol and fuel but we dont support to extract it. We must try to change that in order to dominate the trade market"
 GRE_local_eastern_plans:0 "Stratigical Improvements"
 GRE_local_eastern_plans_desc:0 "The soviet army is known for two things. Its vast size and its  brutal tactics. Their tactics may be costly but really effective. We should try to replicate the efficiency while trying to reduce the casualties"
 GRE_complete_plan_east:0 "Like the East"
 GRE_complete_plan_east_desc:0 "We have managed to create an economical system really similar to the east. We can start improving the now stable economy on our own!"
 GRE_sabotage_polish_industry:0 "Kleftopolemos"
 GRE_sabotage_polish_industry_desc:0 "Guerilla Warfare has been really important for greece. Kleftopolemos is a type of guerilla warfare the greek revolutiaries used on their war for independence. This type of warfare has saved greece once and will save it again if needed."
 GRE_join_the_axis:0 "Join the Axis"
 GRE_join_the_axis_desc:0 "Our King George has roots back in germany. His father wanted to support Germany in World War 1 by joining the axis but Venizelos didnt let him to do it. Today venizelos wont be here to stop us. George demans Greece to join the axis and the leader accepts!"
 GRE_securing_the_country:0 "The Youth Program"
 GRE_securing_the_country_desc:0 "If we want our people to be loyal we must train them to obey to us. Even the kids. We must train the kids by forcing them so serve their fatherland"
 GRE_shall_rise_again:0 "Greece Will Rise From Its Ashes"
 GRE_shall_rise_again_desc:0 "Greece has faced serious problem but each time it has managed to rise. The Spartans and Athenians were brave warriors and clever inventors. Alexander the great conquered the world in 13 years. Byzantium is the longest lasting empire ever. It is our time to shine now!"
 GRE_megaliteri_idea:0 "Megaliteri Idea"
 GRE_megaliteri_idea_desc:0 "We have managed to reclaim greater greece and get back our rightful land. But there are still territories we demand. Northen Epirus should have been greek. We fought hard against the ottomans for a small part of macedonia but now we want it all. We deserve the turkish coast after the greek genocide. Lastly we demand Plovdiv which is known as northern thrace by all greeks"
 European_Unity:0 "European Unity"
 European_Unity_desc:0 "Europe has been through an enormous number of bloody wars. We wont allow this to keep happening. We must unity europe under our banner!"
 Balkan_expansion:0 "Balkan Expansion"
 Balkan_expansion_desc:0 "A lot of wars have taken part into the balkans. It is now time to unite all the balkans under our banner"
 Core_Balkans:0 "Integrate the Balkans"
 Core_Balkans_desc:0 "Spread hellenic culture all over the balkans in order to integrate them"
 Iberia_expansion:0 "Expand into Iberia"
 Iberia_expansion_desc:0 "Iberia has suffered a lot from the spanish civil war. We wont allow them to keep killing their own people. We must unite iberia under our banner"
 Core_Iberia:0 "Integrate Iberia"
 Core_Iberia_desc:0 "Spread hellenic culture all over Iberia in order to integrate them"
 Scandinavia_expansion:0 "Expand into the Nordics"
 Scandinavia_expansion_desc:0 "Scandinavia has been really peaceful. But every nordic country hates the other. We must unite them under our banner"
 Core_Scandinavia:0 "Integrate the Scandinavia"
 Core_Scandinavia_desc:0 "Spread hellenic culture all over Scandinavia in order to integrate them"
 Baltic_expansion:0 "Baltic expansion"
 Baltic_expansion_desc:0 "The Baltics stand united. But they have suffered a lot from the Russians. We cant allow them to suffer more from the red giant. We must protect them under our banner"
 Core_Baltic:0 "Integrate the Baltics"
 Core_Baltic_desc:0 "Spread hellenic culture all over the Baltics in order to integrate them"
 Eastern_Europe_expansion:0 "Expand into Eastern Europe"
 Eastern_Europe_expansion_desc:0 "Poland has been the victic of coalitions formed against it. Now with the soviets and the germans wanting to own a part of the country they are in danger. We must protect poland under our banner"
 Core_Easter_Europe:0 "Integrate Eastern Europe"
 Core_Easter_Europe_desc:0 "Spread hellenic culture all over eastern europe in order to integrate them"
 West_Europe_expansion:0 "West Europe Expansion"
 West_Europe_expansion_desc:0 "The british, french, dutch, belgians have harmed a lot of other countries due to their colonies. We cant allow this to keep happening. We must liberate this countries and save them by uniting the colonists under our banner"
 Core_West_Europe:0 "Integrate West Europe"
 Core_West_Europe_desc:0 "Spread hellenic culture all over western europe in order to integrate them"
 Central_Europe_expansion:0 "Expand into central europe"
 Central_Europe_expansion_desc:0 "Germany, Austia are the ones causing the first world war killing an ancountable amount of people. Germany and Italy now want to become the rulers of europe by starting a second world war. We cant allow that to happen. We must protect the world by uniting them under our banner"
 Core_Central_Europe:0 "Integrate Cental Europe"
 Core_Central_Europe_desc:0 "Spread hellenic culture all over central europe in order to integrate them"
 The_Last_Union_Standing:0 "The Last Union Standing"
 The_Last_Union_Standing_desc:0 "We, the European Union, should protect every european country. The USSR has caused a lot of harm by causing constant conflict in europe. We wont allow this to happen. We must liberate the people of europe from the evil russians!"
 GRE_dreams_of_a_new_byzanium:0 "Dreams Of A New Byzantium"
 GRE_dreams_of_a_new_byzanium_desc:0 "Each day we are getting closer and closer to completing our plans and reforming the byzantine empire. This is an idea that our government should accept"
 GRE_preparing_for_the_tenth_crusade:0 "Prepare The Tenth Crusade"
 GRE_preparing_for_the_tenth_crusade_desc:0 "Preparing the crusade right now may be too early. But we should start preparing it early in order to guarantee it will be a success"
 GRE_our_great_islamic_enemy:0 "Our Great Islamic Enemy"
 GRE_our_great_islamic_enemy_desc:0 "The greater enemy of the byzantine empire has been islam. After the Byzantine-Islamic wars the empire started to slowly get weakened. We must get revenge and kick islam out of europe"
 GRE_the_tenth_crusade:0 "Tenth Crusade"
 GRE_the_tenth_crusade_desc:0 "It is time to finally spread orthodox cristianity. Let the conquest finally begin"
 GRE_the_union_of_orthodox_people:0 "Union of Orthodox People"
 GRE_the_union_of_orthodox_people_desc:0 "The Union of Orthodox People is an alliance between all Orthodox nations. Now that Russia is free from communism they can be a great ally and help defend the orthodox people"
 GRE_our_great_ally:0 "Our Great Ally"
 GRE_our_great_ally_desc:0 "Kievan Rus' has been a great ally for byzantium. The current successor of it is a soviet union which is currently an atheist state. We must bring back our great ally"
 GRE_liberation_of_orthodox_people:0 "Liberation Of Orthodox People"
 GRE_liberation_of_orthodox_people_desc:0 "Christianity has always been an important part of greek culture since the days of the byzantine empire. If we want our empire to be protected by the god we must adopt christianity not only on our culture but on our government too"
 GRE_macedonia_shall_rise:0 "Claim Macedonia"
 GRE_macedonia_shall_rise_desc:0 "There is a small peace of land in yugoslavia called macedonia. Now that we claim the heir of the macedonian empire, we also claim this piece of land"
 GRE_where_it_all_began:0 "Where It All Began"
 GRE_where_it_all_began_desc:0 "Alexander the Great was born in Pella. Pella was a really important city and the capital of the enormous macedonia empire. We should move our capital there in order to fully justify our claim as rome"
 GRE_the_true_macedonia:0 "The True Macedonia"
 GRE_the_true_macedonia_desc:0 "The serbs are willing to give us macedonia. Now we can start the conquest and give glory to alexander's empire!"
 MAC_destroy_the_sun:0 "There Are Not Two Suns In The Sky..."
 MAC_destroy_the_sun_desc:0 "There cant be a second sun. The real sun, the sun of vergina lights the way to greatness. We must defeat the land of the rising sun and claim our spot in the sun"
 GRE_glory_to_alexander:0 "...Nor Two Rulers On Earth"
 GRE_glory_to_alexander_desc:0 "The United States Of America is the last standing major country in the world. We claim to be the real ruler on this earth and they are the last country who can stop us. We must destroy them"
 GRE_path_to_rome:0 "Path To Rome"
 GRE_path_to_rome_desc:0 "Why restore byzantium when we can expand even more ? Why not continue and restore the glory of the roman empire!"
 GRE_tale_of_two_romes:0 "The Tale Of Two Romes"
 GRE_tale_of_two_romes_desc:0 "The roman empire was too big to be handled by 1 emperor. In order to rule it more effectively they emperor split it into east and west. The west part would fall a few centuries later while the east would survive for a really long time. Today we stand here in order to reunite both empires!"
 GRE_they_will_know_fear:0 "They Will Know Fear"
 GRE_they_will_know_fear_desc:0 "We have to conquer a big part of europe in order to reform the empire. To do that in terms of a few years and not centries like the roman empire we must build fast and effective tanks and strong airplanes"
 GRE_realise_federation_neo_roman_empire:0 "Realise Neo-Roman Federation"
 GRE_realise_federation_neo_roman_empire_desc:0 "We are ready to finally claim the roman empire. We must claim eastern rome and slowly build our way into the real roman empire!"
 GRE_reform_roman_army:0 "Roman legions"
 GRE_reform_roman_army_desc:0 "There are always to ways to learn from history. This time we must look at the roman tactics and try to learn from them how they managed to conquer the empire"
 GRE_mare_nostrum:0 "The Roman Navy"
 GRE_mare_nostrum_desc:0 "The roman navy got destroyed multiple times during the punic wars but they rebuilt it each time. We should start mass building dockyards in order to built a respectable navy"
 GRE_roman_imperial_marines_focus:0 "Imperial Marines"
 GRE_roman_imperial_marines_focus_desc:0 "A big navy isnt good enough if you cant use it to conquer land. We must train our troops and make them capable of making naval landings in any part of the world"
 GRE_reclaim_hispania:0 "Reclaim Hispania"
 GRE_reclaim_hispania_desc:0 "Ever land the roman empire held is too strong for us to fight. Iberia after the spanish civil war has been pretty weak. We must start rebuilding the empire by invading them"
 GRE_reach_trajan_wall:0 "Claim The Balkans"
 GRE_reach_trajan_wall_desc:0 "We cant let the fascist kingdom of Mussolini annex the balkans. The balkans are the perfect start for the reconquest of the roman empire. They arent stronger than us and they are right next to our border"
 GRE_war_ita_rome:0 "The Rightfull Capital"
 GRE_war_ita_rome_desc:0 "How can we be called the roman empire without owning rome itself ? It is time to change that. Our troops will go all the way to rome and make it the new capital of our empire!"
 GRE_amend_old_grudges:0 "Destroy The Old Enemy"
 GRE_amend_old_grudges_desc:0 "War between the persian and roman empire was a common thing. Now that we are strong and the persians are weak we will get rid of them once and for all"
 GRE_southern_push:0 "Succeding Where Others Will Fail"
 GRE_southern_push_desc:0 "Mussolini claims that his fascist kingdom is the roman empire. How pathetic! It is said that he would like to conquer the middle east but he isnt capable of doing it. Instead we will do it!"
 GRE_retake_the_north:0 "Break The Neutrallity"
 GRE_retake_the_north_desc:0 "The swiss used to fight under the flag of the roman empire. It is time to finally break their policy of neutrallity and force them to fight against us!"
 ITA_war_to_end_all_wars:0 "Destroy The Holy Roman Empire"
 ITA_war_to_end_all_wars_desc:0 "Thinking that this border gore called the Holy Roman Empire claimed rome is disgusting! Even if they dont exist anymore we still want revenge and we will attack the closest thing we can find to the HRE, the German Reich"
 GRE_the_ancient_hellinas:0 "The Ancient Hellinas"
 GRE_the_ancient_hellinas_desc:0 "The ancient hellinas managed to master the world. They survived against the enormous persian empire and created colonies all over the mediterranean"
 GRE_the_unification_of_the_states:0 "The Unification Of Greek City States"
 GRE_the_unification_of_the_states_desc:0 "Greece used to be split in a lot of different countries called city-states. Today we must honor all of them by keeping their name as a part of our history"
 GRE_like_athens:0 "Like Athens"
 GRE_like_athens_desc:0 "The Athenians were great philosophers. They invented democracy and made lots of philosophycal achievments. We must follow their footsteps"
 GRE_like_sparta:0 "Like Sparta"
 GRE_like_sparta_desc:0 "The Spartans were great warriors. They were able to survive under extreme training and become unstopable warriors"
 GRE_unite_with_the_phonisians:0 "Unite With The phoenicians"
 GRE_unite_with_the_phonisians_desc:0 "The phonisians used to be great friends of ours. We were trading together for centries! We should now fully unite with them"
 GRE_take_advantage_of_a_weak_spain:0 "Take Advantage Of a Weak Spain"
 GRE_take_advantage_of_a_weak_spain_desc:0 "Spain has been really weak because of the civil war. We must attack them now that they are weak and get back our old colonial holdings"
 GRE_fight_for_egypt:0 "Fight For Egypt"
 GRE_fight_for_egypt_desc:0 "Egypt is really important because of the suez canal. We should fight with Britain hoping to get this important canal into our hands"
 GRE_fight_with_italy:0 "Fight For Sicily"
 GRE_fight_with_italy_desc:0 "The Athenian campaign in sicily was a total disaster. Now that we are strong and united we should try to conquer the island once again!"
 GRE_fight_with_the_giant:0 "The Conflict For Crimea"
 GRE_fight_with_the_giant_desc:0 "A part of our colonial empire that many people may not know about is crimea. It has a really important stratigic importance and we must do our best in order to own it"
 GRE_cores_in_north_africa:0 "Cores In North Africa"
 GRE_cores_in_north_africa_desc:0 "With our colonial empire expanding we must start integrading our territories in north africa"
 GRE_cores_in_islands_and_france:0 "Cores In The Islands"
 GRE_cores_in_islands_and_france_desc:0 "The islands of the mediterranean are really important due to their stratigical placement. We should intergrade this territories in order to use them in the best way possible"
 GRE_expand_our_nation_in_the_balkans:0 "Expand Our Mainland"
 GRE_expand_our_nation_in_the_balkans_desc:0 "We may have a colonial empire but we should also expand our mainland. Expanding and conquering all of the balkans is the only way to expand our non colonial holdings"
 GRE_our_own_colonial_empire:0 "The Greco-Phoenicians Empire"
 GRE_our_own_colonial_empire_desc:0 "We have finally build our own colonial empire. It may not be as big as most european empires but this is what was once ours and what we claim now"
 GRE_the_real_rome:0 "The Real Rome"
 GRE_the_real_rome_desc:0 "We are the real roman empire. The spanish, the ottomans, the italians and anyone who claimed rome is a part of our empire. Expect the russians. It is time to attack them and make the world see that we are the real rome!"
 GRE_father_of_greeks_focus_tt:0 "The §G monarchist and the fascist become friendly §!. The §R republicans become hostile §! and the §g communist stay neutral §!"
 GRE_get_rid_of_king_focus_tt:0 "The §R monarchist become hostile §!, while the §g other factions become neutral §!"
 GRE_third_hellenic_civilization_focus_tt:0 "The §G fascists become loyal and the republicans friendly §!. The §R communists become hostile §! and the §g monarchists remain neutral §!"
 GRE_the_right_to_rule_focus_tt:0 "The §G monarchists become loyal and the republicans friendly §!. The §R communists become hostile §! and the §g fascists remain neutral §!"
 GRE_protecting_the_fatherland_focus_tt:0 "The §G fascists become loyal §!. The §R republicans and the communists become hostile §! while the §g monarchists stay neutral §!"
 GRE_a_socialist_economy_focus_tt:0 "The §G communists become loyal §!, the §R fascists and the monarchists become hostile §! and the §g republicans stay neutral §!"
 GRE_junta_takeover_focus_tt:0 "§RAll factions protest§!"
 GRE_please_the_workers_tt:0 "The §gcommunist become neutal§!"
 GRE_the_birthplace_of_democracy_focus_tt:0 "The §G republicans and monarchists become loyal §!, while the §R communists and fascists become hostile §!" 
 GRE_bop_collapse_tt:0 "All §R factions become hostile §!"
 GRE_bop_unity_tt:0 "All §G factions become loyal §!"
 GRE_metaxas_stays:0 "Neutral Policy"
 GRE_metaxas_stays_desc:0 "Metaxas may have adopt a lot fascist laws, but he isnt one of them. He will fight in order to keep us out of any conflict!"
 GRE_colonial_police_tt:0 "§G Enables the occupation law of colonial police. §!"
 GRE_colonial_police2_tt:0 "§G Improves colonial police occupation law. §!"
 GRE_colonial_police3_tt:0 "§G Further Improves colonial police occupation law. §!"
 unlock_athens_uprising_tt:0 "With §R50% Resistance§! in [GRE.GetFlag] [GRE.GetAdjective] states, you gain access to the §YAthens Uprising§! operation after completing the §YMake Resistance Contacts§! operation."
 bftb_greece.1.t:0 "Chooising Direction"
 bftb_greece.1.desc:0 "The time to choose the government that will lead us to glory has come ! We must choose who will save greece from the crisis and restore the glory of our country! (The Anarchist paths will always be unlocked, no matter which option you choose in this event)"
 bftb_greece.1.a:0 "Venizelos shall rebuild us through diplomacy!"
 bftb_greece.1.b:0 "Metaxas will make the nation stable again!"
 bftb_greece.1.c:0 "The Fascists will restore our great empire!"
 bftb_greece.1.d:0 "The communists will liberate the workers!"
 bftb_greece.2.t:0 "The people revolt!"
 bftb_greece.2.desc:0 "Due to the unpopularity of our new ruling part a lot of people revolt. Crete declares independence while Macedonia and Thrace under bulgarian influence unite with them"
 bftb_greece.2.a:0 "Someday we will reunify"
 bftb_greece.3.t:0 "The dodecanese agreement"
 bftb_greece.3.desc:0 "The greeks of the dodecanese revolt demanding unification with greece. The resistance it too big for the italians to handle in their current state. We have agreed to annex the region and sign a non aggresion pact"
 bftb_greece.3.a:0 "The Aegean is under our control!"
 bftb_greece.6.t:0 "The northern epirus agreement"
 bftb_greece.6.desc:0 "For a long time we have claimed northern epirus. It is time to fully get it under our control. We will sign a treaty with the albanians in exchange for the territory"
 bftb_greece.6.a:0 "Northern Epirus is finally ours!"
 bftb_greece.51.t:0 "Demand our lands"
 bftb_greece.51.desc:0 "Bulgaria has annexed a few of our lands. We wont accept that. We will nagotiate with bulgaria to get them back!"
 bftb_greece.51.a:0 "Another victory for greece!"
 greece.654.t:0 "Greeks sabotage their industry"
 greece.654.d:0 "The greeks after seeing us marching into their town have decided to sabotage their infastructure and industry trying to delay our offensive"
 greece.654.a:0 "Curse them!"
 GRE_regio_esercito_dynamic_modifier:0 "First hellenic civilization"
 bftb_greece.207.t:0 "Greece Demands Annexation"
 bftb_greece.207.desc:0 "We revolted a while back declaring independence. Greece didnt like what we did, and now they demand annexation"
 bftb_greece.207.a:0 "Crete is greek and will always be greek!"
 bftb_greece.207.a:0 "The traitors will die!"
 operation_athens_uprising:0 "The Athens Uprising"
 operation_athens_uprising_desc:0 "The brave resistance fighters of Greece long to liberate Athens our nation from our enemies. We just need to give them the signal and Greece will live once again!"
 athens_uprising_operation_tt:0 "Trigger a national uprising in Greece, creating new units in its states."
 tateism_1:0 "Greek Colonial Empire"
 tateism_1_desc:0 "Every great power has colonies or heavy influence in countries all over the world. Now that we are almost a major power, we should try to create a colonial empire for ourselves"
 bring_tate_brothers_to_rule:0 "Gain Support From The LoN"
 bring_tate_brothers_to_rule_desc:0 "We dont want to cause the disatisfaction of major powers with our new movement. Therefore, we will request support from the league of nations"
 empower_andrew:0 "African Campaign"
 empower_andrew_desc:0 "When the berlin conference took place we werent a major power and we were unable to participate in it. We shall start working on making up for it by claming africa lands"
 the_top_g_plan_focus:0 "Keep Up With Garrisons"
 the_top_g_plan_focus_desc:0 "If we want to have our own colonies in africa, we require a strong industry in order to keep up with the needed garrisons. We must start developing our industry"
 new_foreign_policy:0 "Propaganda"
 new_foreign_policy_desc:0 "We shall feed the people with the idea that we righfully claim the land in africa in order to avoid any revolutions"
 launch_hustlers_university:0 "Request Japanese Support"
 launch_hustlers_university_desc:0 "Japan has interests in european occupied land in south east asia. By building our colonial empire, we make France and Britain weaker. Because of our common interests, we request their support"
 hustlersuni_upgrade:0 "Request German Support"
 hustlersuni_upgrade_desc:0 "The moral enemy of Germany in Britain and France. Taking their colonial land will weaker these 2 powers. As a result Germany will get closer to becoming a dominating power. Due to our common interests, we request their support"
 tateist_scientists:0 "Better Technology"
 tateist_scientists_desc:0 "We need to improve our technology in order to be viewed as a major power"
 tateist_scientists_t:0 "Better Technology"
 tateist_scientists_t_desc:0 "We need to improve our technology in order to be viewed as a major power" 
 tateist_scientists_t2:0 "Better Scientists"
 tateist_scientists_t2_desc:0 "We need to hire clever people around the world in order to help us improve our technology" 
 tateist_scientists_2:0 "Better Scientists"
 tateist_scientists_2_desc:0 "We need to hire clever people around the world in order to help us improve our technology" 
 tate_industries:0 "Better Production"
 tate_industries_desc:0 "We must increase the number of factories in order to fully keep up with our garrisons"
 tate_industries_2:0 "More Factories"
 tate_industries_2_desc:0 "We must continue industrialising"
 tristan_industries_2:0 "More Factories"
 tristan_industries_2_desc:0 "We must continue industrialising"
 tristan_industries:0 "Better Production"
 tristan_industries_desc:0 "We must increase the number of factories in order to fully keep up with our garrisons"
 reassert_claims:0 "Let The Nagotiations Begin!"
 reassert_claims_desc:0 "Today marks the day that greek imperialisation in africa starts!"
 claims_on_gre:0 "Claim Italian Colonies"
 claims_on_gre_desc:0 "We must decide which lands we want to get from the Horn Of Africa and Italy for our colonial empire"
 claims_on_ita:0 "Claim Other Colonies"
 claims_on_ita_desc:0 "Belgium and Spain may be colonial powers but are too weak. Taking control of their colonies will be easy""
 claims_on_tur:0 "Claim British Colonies"
 claims_on_tur_desc:0 "We must decide which lands we want to get from the British for our colonial empire"
 claims_on_hun:0 "Claim French Colonies"
 claims_on_hun_desc:0 "We must decide which lands we want to get from the French for our colonial empire"
 war_with_ger:0 "Purchase Of Territory"
 war_with_ger_desc:0 "We dont want war with the major powers. Instead of fighting over the territory we have decided to purchase it. Lets finalise nagotiations!"
 topgempire:0 "One Last Colony"
 topgempire_desc:0 "We have decided to get a little bit more greedy and purchase a little bit more land. South africa is really important due to it's chromium reserves"
 claims_on_bul:0 "Claim Portugese Colonies"
 claims_on_bul_desc:0 "One of the weakest colonial empires in africa is portugal. Nagotiations with them wont be hard and we will easily manage to claim the territory, and even try to get a small amount of land from the brits"
 cleanupgov:0 "Recruit Colonial Police"
 cleanupgov_desc:0 "In order to effectively secure the colonies while also not using a big amount of our equipment is by recruting the colonial police force"
 tatebros_agency:0 "Purchase Indian Ports"
 tatebros_agency_desc:0 "If we want to get into world trading we must start by purchasing ports from all around the world. Our first goal is to get control of major indian trading ports"
 themesong_focus:0 "Purchase Chinese Ports"
 themesong_focus_desc:0 "In order to continue expanding our world trading operation we must purchase more ports. Chinese ports will allow us to trade easier with both Japan and China, which are major trading powers"
 tatebros_agency_1:0 "Purchase Japanese Sakhalin"
 tatebros_agency_1_desc:0 "The south part of Sakhalin has a few oil reserves which we can purchase for a small price"
 tatebros_agency_2:0 "Purchase Soviet Sakhalin"
 tatebros_agency_2_desc:0 "The north part of Sakhalin will give us the opportunity to get closer to the important arctic coast"
 brokie:0 "Improve Colonial Police"
 brokie_desc:0 "Colonial police has already been really helpful. We should start investing into further expansion of this force"
 sparkling_water:0 "Purchase South East Asian Islands"
 sparkling_water_desc:0 "In order to expand our influence in the east indies and malaya we should purchase nearby islands in order to get control in the nearby region"
 the_webcam_business:0 "Purchase Indochina And Papua"
 the_webcam_business_desc:0 "By purchasing territory around malaya and the east indies we can keep expanding our influence in the region"
 holy_quran:0 "Secure The Japanese Sea"
 holy_quran_desc:0 "Japan has been trying to expand in all of asia setting in danger our colonies. We want to purchase nearby land in order to be prepared for any future invasion"
 ban_vaping:0 "Recruit Local Garrisons"
 ban_vaping_desc:0 "Recruting garrisons from the land we control is a way to improve the effectiveness of our colonial police in the regions we control"
 empower_tristan:0 "American Campaign"
 empower_tristan_desc:0 "The whole america used to be controlled by european powers but now almost every country in america is selfed rule. Most countries there are weak so this is a great opportunity to expand our empire"
 the_puppet_master:0 "The Idea Of Elysia"
 the_puppet_master_desc:0 "The idea of the Elysian Empire was an idea to recreate the byzantine empire in america. Instead of Byzantium we want to rebuild greece in the americas!"
 new_foreign_policy_t:0 "Propaganda"
 new_foreign_policy_desc:0 "We shall feed the people with the idea that we righfully claim the land in the americas in order to avoid any revolutions"
 launch_tristans_university:0 "Request Soviet Support"
 launch_tristans_university_desc:0 "The USSR is against imperialism. After hours of nagotiations with Stalin we managed to make him believe that we want to 'Liberate' the americans for european imperialism forever and that fool has decided to support us"
 hustlersuni_upgrade_t:0 "Request Papal Support"
 hustlersuni_upgrade_t_desc:0 "The treaty of tordesillas was a treaty that supported that the world should be split between spain and portugal. This treaty was signed by the pope, and now we request his permission to begin our own conquest in the americas"
 influence_in_europe:0 "Let The Conquest Begin!"
 influence_in_europe_desc:0 "After requesting support from the Americans, it is time to finally expand our empire!"
 puppet_on_hun:0 "Claim South Latin America"
 puppet_on_hun_desc:0 "What many people dont know is that the first president of argentina had greek roots. Because of that we claim former argentinian territory, and even more!"
 puppet_on_aus:0 "Conquer Argentina"
 puppet_on_aus_desc:0 "Having purchased land next to argentina we can now start the war against them!"
 puppet_on_gre:0 "Claim Guyana"
 puppet_on_gre_desc:0 "Before advancing into colombia we must purchase the land from the europeans in order to share a border with them
 puppet_on_tur:0 "Conquer Gran Colmbia"
 puppet_on_tur_desc:0 "Now that we control the guyana territories we can start our mission to have gran colombia under our banner!"
 puppet_on_yug:0 "Claim The Canal"
 puppet_on_yug_desc:0 "In order to greatly improve our economy we must take over the panama canal and dominate global trading!"
 puppet_on_ita:0 "Conquer Central America"
 puppet_on_ita_desc:0 "We shall try to reunify the central american states under our control"
 puppet_on_alb:0 "Claim The Mexican Empire"
 puppet_on_alb_desc:0 "The mexican empire was the biggest empire ever seen on the americas. We want to be known as the biggest empire in americas, therefore we claim the territories of the former mexican empire"
 puppet_on_cze:0 "Secure Hyperborea"
 puppet_on_cze_desc:0 "The idea of Hyperborea was the idea that there was an advances civilization living in the north near the edge of sea. The idea of its existance wasnt real, but the idea to conquer it has been reborn"
 war_with_ger_t:0 "Crush The American Dream"
 war_with_ger_t_desc:0 "The US gave us permission to conquer america. Now we have decided to betray them and try to steal their land"
 puppet_bul:0 "The Caribbean"
 puppet_bul_desc:0 "Greece has always been connected to amazing and exotic beaches. Caribbean islands have some of the nicest beaches and it is time to connect these with our country as well"
 talismanempire:0 "Only Important Land"
 talismanempire_desc:0 "Brazil is the last untouched country in america. We may be war criminals but not monsters and we dont want to destroy the rainforest, therefore we only want to conquer the coast"
 talismansunion:0 "All The Land"
 talismansunion_desc:0 "We dont trust brazillians with the rainforest. We must bring it under our control in order to secure its safety"
 destroy_the_matrix:0 "The Greece Of 6 Continents and 5 Oceans"
 destroy_the_matrix_desc:0 "We have finally build our own colonial empire like every major power. Long live the greek colonial empire!"
 GRE_royal_marriage:0 "Royal Marriage"
 GRE_royal_marriage_desc:0 "The late byzantine empire and the holy roman empire never had good relations. Many years after we have decided to try and improve our relations. A royal marriage shall be orginised!"
 GRE_royal_marriage_tt:0 "§GCores all states required to form the Holy Roman Empire as Germany, Prussian lands and German Territory on Poland after the partitions of the Commonwealth§!"
 GRE_royal_marriage2_tt:0 "§GCores all states required to form the Austo-Hungarian Empire as Austria or Hungary Austrian Territory on Poland after the partitions of the Commonwealth§!"
 GRE_african_people_tt:0 "§GWe get cores on all of Sudan, every state in the Horn Of Africa and every state in East Africa§!"
 GRE_austria_marriage:0 "The Austro-Hungarian Throne"
 GRE_austria_marriage_desc:0 "Austrian Empire was a great ally of the Holy Roman Empire. After many years Austria created the Austria-Hungarian Empire and destroyed the friendship with the HRE. Today we will claim their throne as well!"
 GRE_greatest_byzantine_empire:0 "Greatest Byzantine Empire"
 GRE_greatest_byzantine_empire_desc:0 "We have decided not to repeat past mistakes. Instead of reforming rome we have expanded our homeland into lands never seen before!"
 GRE_greatest_byzantine_empire_tt:0 "§GWe get cores in every state bordering the mediterranean, in all states in the arabian peninsula,and iran§!"
 GRE_NATO:0 "Form NATO"
 GRE_anarchism_knows_no_borders:0 "Global Defence Council"
 GRE_NATO_desc:0 "A crazy time traveller talks about the creation of NATO, an alliance in the 2000s between European countries and the US. Since we own most of this territory, why not try to conquer it all?"
 GRE_global_defence_council:0 "Global Defence Council"
 GRE_global_defence_council_desc:0 "It is our mission to unite and protect the world"
 GRE_stalinist_goverment:0 "Loyal To Stalin"
 GRE_stalinist_goverment_desc:0 "Stalin helped us rebuild our country and become stronger, therefore we shall stay loyal to him"
 GRE_megisti_idea:0 "Megisti Idea"
 GRE_megisti_idea_desc:0 "After our recent victories we got even more greedy ! We want more!"
 GRE_unite_with_the_turks_and_kurds:0 "Unite With The Turks And Kurds"
 GRE_unite_with_the_turks_and_kurds_desc:0 "We and the kurdish people have been fighting the turkish people for too long. It is time for all of us to peacefully unite under one flag, the greek one"
 GRE_prepare_for_the_inevitable:0 "Prepare for the inevitable"
 GRE_prepare_for_the_inevitable_desc:0 "The war with the Italians and Germans hasnt been the way we wanted it. We must prepare in case we lose this war"
 GRE_foreign_air_support:0 "Air Support"
 GRE_foreign_air_support_desc:0 "We need to request more air support in order to manage and defend our country"
 GRE_foreign_army_support:0 "Army Support"
 GRE_foreign_army_support_desc:0 "We need to have soldiers in the lines and we need them now!"
 GRE_aces_in_exile:0 "Aces In Exile"
 GRE_aces_in_exile_desc:0 "With the enemies getting closer to winning, we must prepare our force to fight when we end up losing our country"
 GRE_foreign_naval_support:0 "Naval Support"
 GRE_foreign_naval_support_desc:0 "We need to build more convoys in order to evacuate the people from our country once we surrender"
 GRE_resistance_industries:0 "Resistance Industries"
 GRE_resistance_industries_desc:0 "We must build an industry big enough in order to support the greek resistance"
 GRE_exile_industries:0 "Industry In Exile"
 GRE_exile_industries_desc:0 "We must build an industry in other countries in order to keep producing guns once we lose our mainland"
 GRE_expand_GREish_intelligence:0 "Greek Spies"
 GRE_expand_GREish_intelligence_desc:0 "We should create an effective spy network in order to boost our resistance back in our homeland"
 GRE_expand_GREish_intelligence_no_mtg:0 "Greek Spies"
 GRE_expand_GREish_intelligence_no_mtg_desc:0 "We should create an effective spy network in order to boost our resistance back in our homeland" 
 GRE_niech_zyje_opor:0 "Greece Never Dies!"
 GRE_niech_zyje_opor_desc:0 "It is time to finally reclaim our homeland! Greece has never died, and Greece will never die!"
 GRE_niech_zyje_opor_no_mtg:0 "GREECE NEVER DIES!"
 GRE_niech_zyje_opor_no_mtg_desc:0 "It is time to finally reclaim our homeland! GREECE NEVER DIES!"
 GRE_the_long_push_home:0 "The Long Push Home"
 GRE_the_long_push_home_desc:0 "We must prepare our army for the mission to reclaim our homeland!"
 GRE_the_long_push_home_no_mtg:0 "The Long Push Home"
 GRE_the_long_push_home_no_mtg_desc:0 "We must prepare our army for the mission to reclaim our homeland!"
 GRE_the_bombe:0 "Communication Development"
 GRE_the_bombe_desc:0 "We must improve our communication system in order to stay up-to-date with the resistance units back in greece"
 GRE_the_bombe_no_mtg:0 "Communication Development"
 GRE_the_bombe_no_mtg_desc:0 "We must improve our communication system in order to stay up-to-date with the resistance units back in greece" 
 GRE_the_cyclometer:0 "Encryption & Decryption"
 GRE_the_cyclometer_desc:0 "We must try to crack the German and Italian secret military codes while also making sure that they wont crack ours!"
 GRE_the_cyclometer_no_mtg:0 "Encryption & Decryption"
 GRE_the_cyclometer_no_mtg_desc:0 "We must try to crack the German and Italian secret military codes while also making sure that they wont crack ours!"
 GRE_avengers_tt:0 "If §YAny country§! guarantees §RTurkey§!, the §Gguarantees will be removed§!"
 GRE_colonial_policy:0 "New Colonial Policy"
 claim_spain_belgium_tt:0 "§GUnlocks decisions to claim Spanish, Belgian colonies and Liberia§!"
 claim_taly_tt:0 "§GUnlocks decisions to claim Italian colonies and the horn of africa§!"
 claim_french_stuf_tt:0 "§GUnlocks decisions to claim French colonies§!"
 claim_scotish_tt:0 "§GUnlocks decisions to claim British colonies§!"
 claim_portugese_tt:0 "§GUnlocks decisions to claim Portugese colonies§!"
 GRE_qemant:0 "Claims on Qemant"
 GRE_tigray:0 "Claims on Tigray"
 GRE_benish:0 "Claims on Benishangul-Gumuz"
 GRE_gambela:0 "Claims on Gambela" 
 GRE_sidamo:0 "Claims on Sidamo"
 GRE_oromo:0 "Claims on Oromia"
 GRE_harral:0 "Claims on Harar"
 GRE_aussa:0 "Claims on Aussa"  
