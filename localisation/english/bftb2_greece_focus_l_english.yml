 GRE_restore_orhodoxy:0 "Restore Orthodoxy In Russia"
 GRE_restore_orhodoxy_desc:0 "Russia has fallen into an atheist state. How can Russia, such a big cristian coutry just abandon their religion ? We must fight against their atheist and communist overlords!"
 GRE_restore_christianity_in_russia:0 "The Jewel Of The Orthodox Crown"
 GRE_restore_christianity_in_russia_desc:0 "The orthodox church of Russia is the biggest orthodox church in the world. We must make an attemp to unify our churches into one, and protect all orthodox people along the world"
 GRE_liberation_of_catholic_people:0 "Liberation Of Catholic People"
 GRE_liberation_of_catholic_people_desc:0 "We are one of the last remaining orthodox countries. Our religion is close to it's eclipse. We should adopt another form of christianity in order to secure our religious rights"
 GRE_a_papal_state:0 "Catholic Dominion"
 GRE_a_papal_state_desc:0 "The people are not against the idea of adopting catholicism as a religion. We should now become a catholic state"
 GRE_holy_roman_empire:0 "Holy, Roman And An Empire"
 GRE_holy_roman_empire_desc:0 "The Holy Roman Empire was a failure. Just like them we are a Holy dominion, an Empire related to the glory of Rome and an Empire that can rule the world! But unlikely them, we will last forever!"
 GRE_tfv:0 "Together For Victory"
 GRE_tfv_desc:0 "The Second Great War is raging accross europe. We must secure our victory. We will not be defeated!"
 GRE_bba:0 "By Blood Alone"
 GRE_bba_desc:0 "We must build a new empire. We must resist foreign aggression. We must exploit the limits of neutrality"
 GRE_aat:0 "Arms Against Tyranny"
 GRE_aat_desc:0 "Our goal is to write a new history. We have managed to secure our future, but we must also secure our well-being"
 GRE_dod:0 "Death Or Dishonor"
 GRE_dod_desc:0 "We have experienced history’s greatest conflict from almost all point of views. We have tried being neutral and joining Britain. We must now view the war from a new point of view, the German one"
 GRE_lar:0 "La Resistance"
 GRE_lar_desc:0 "The enemy has been trying to destroy us from the inside. Brave individuals promise to fight against their enemies and oppressors. We must use our agile espionage skills to support the work of The Resistance"
 GRE_bftb:0 "Battle For The Bosporus"
 GRE_bftb_desc:0 "We must resist efforts by the major powers to dominate the strategic sealanes of the Bosporus and Dardanelles. The region shall stay under our control and our influence"
 GRE_nsb:0 "No Step Back"
 GRE_nsb_desc:0 "We must build a new empire for Greece, with options to reform the government, entrench the military rule, and support our traditions"
 GRE_wtt:0 "Waking The Tiger"
 GRE_wtt_desc:0 "Crippled by political paralysis and centuries of fitful development, Greece has finally become a pushover. With vast reserves of manpower and resources, not to mention a giant landmass, the Byzantine Empire and its temporary ally, the German Reich under Adolf, can withstand another aggressor. There have been, after all, very many"
 GRE_mtg:0 "Man The Guns"
 GRE_mtg_desc:0 "We must alter our convoy routes to avoid hungry wolf packs. Embrace or circumvent the Medditeranean naval treaties and deal with the diplomatic consequences"
 GRE_annexation_of_crimea:0 "Annexation Of Crimea"
 GRE_annexation_of_crimea_desc:0 "Crimea has really important strategic location. Controlling this piece of land, can give us a really important strategic advantage in the Black sea"
 GRE_war_with_china:0 "War With China"
 GRE_war_with_china_desc:0 "Our ally Japan has had problems dealing with the chinese invasion. It is our mission to help them end this endless war"
 GRE_improve_spirit:0 "Improve The National Spirit"
 GRE_improve_spirit_desc:0 "With the new Byzantine Empire rising again, we can finally cast off the shadow of our defeat. A new age is dawning for Greece!"
 GRE_befriend_vichy_france:0 "Befriend Vichy France"
 GRE_befriend_vichy_france_desc:0 "Vichy France controls lands that we will need. Even if they are a weak nation, they are still protected by Germany and going to war with them will damage our relation beyond repair"
 GRE_purchase_egyptian_kingdom:0 "The Kingdom Of Egypt"
 GRE_purchase_egyptian_kingdom_desc:0 "The Kingdom of Egypt had been really important for both the Macedonian and Byzantine Empire. We must purchase this land from the Brits, in an attemp to restore our great empire"
 GRE_greek_anarchism:0 "Greek Anarchism"
 GRE_greek_anarchism_desc:0 "Anarchism has never been popular in Greece. Ever since the big crisis our country went through, more and more people adopt extreme ideologies. Including Anarchism"
 GRE_anarchists_take_over_construction:0 "Hire Anarchist Workers"
 GRE_anarchists_take_over_construction_desc:0 "Anarchist workers are willing to work on our factories with minimum wage. Who could decline this offer?"
 GRE_anarchists_take_over_factories:0 "Anarchy and Production"
 GRE_anarchists_take_over_factories_desc:0 "Anarchists work by themselves. Without much distraction, it is easier for them to increase their productivity"
 GRE_anarchists_take_over_trade:0 "Anarchist Economists"
 GRE_anarchists_take_over_trade_desc:0 "The Anarchists have great ideas when it comes out to economic organisation. There are a lot we can learn from them"
 GRE_anarchists_take_over_economic_council:0 "Council Of Economy"
 GRE_anarchists_take_over_economic_council_desc:0 "The council of Economy, is a council run by Anarchists in an attemp to improve and fix the Greek economy. Let's hope they will succeed"
 GRE_anarchists_take_over_research:0 "Council Of Technology"
 GRE_anarchists_take_over_research_desc:0 "Greece uses lots of outdated technology and equipment. In an attemp to modernise Greece, anarchists have created the Council Of Technology"
 GRE_anarchists_take_over_transports:0 "Seize Public Transports"
 GRE_anarchists_take_over_transports_desc:0 "All wish to do their part in the fight for freedom. Our allies number many who work in the public transport sector, and these are eager to put their vehicles at the service of our brave soldiers. This may give us an unorthodox tactical advantage against our enemies"
 GRE_anarchists_take_over_army:0 "Anarchist Army"
 GRE_anarchists_take_over_army_desc:0 "The Anarchists are willing to support their nation, and it's freedom. We must recruit them in the army!"
 GRE_anarchist_collective_societ:0 "Collectivized Society"
 GRE_anarchist_collective_societ_desc:0 "Every person is a revolution unto itself; if not for the bravery and ferocity of the individual the collective would fall in the face of its enemies. This message must be brought home with all our supporters; every single one of us must aid in holding high the torch of anarchism."
 GRE_anarchist_took_us_over:0 "The Coup Of Anarchism"
 GRE_anarchist_took_us_over_desc:0 "The Anarchists, the same people who wanted to help us rebuild our nation have taken over the nation. What a disaster!"
 GRE_anarchist_propaganda:0 "Anarchist Propaganda"
 GRE_anarchist_propaganda_desc:0 "People must join the army and help us secure Greece. People must help the Armed forces secure Greece"
 GRE_spanish_refuges:0 "Spanish Refuges"
 GRE_spanish_refuges_desc:0 "Spanish Anarchists are being oppresed by other ideologies. We must offer them protection, here in Greece"
 GRE_hire_japanese_anarchists:0 "Invite Anarcho-Japanese Scientists"
 GRE_hire_japanese_anarchists_desc:0 "Japan has great scientists. Anarchism there is oppresed by fascism. We must ivite the anarchists of Japan, and offer them a new job"
 GRE_soviet_engineers:0 "Soviet Engineers"
 GRE_soviet_engineers_desc:0 "The Soviet Union is willing to help us rebuild our nation. We must ally ourselves with them, in hope to rebuild a glorious Greece"
 GRE_total_anarchy:0 "Total Anarchy"
 GRE_total_anarchy_desc:0 "The nation has fallen into anarchy. There is nothing we can do, just wait to see if this situation will lead to the collapse of Greece or not"
 GRE_support_spanish_revolutionaries:0 "Support Spanish Revolutionaries"
 GRE_support_spanish_revolutionaries_desc:0 "We must support our Spanish brothers and help them beat their war against their oppressors"
 GRE_anarchist_believes:0 "The Army Of All Classes"
 GRE_anarchist_believes_desc:0 "It doesn't matter if you are poor or rich. The motherland calls you to join the army, and you will do it!"
 GRE_transform_nature:0 "Transform Nature"
 GRE_transform_nature_desc:0 "With our scientific community pushing the borders of what was previously thought possible, even the largest, most invasive projects are becoming feasible"
 GRE_anarchist_militia:0 "Anarchist Militia"
 GRE_anarchist_militia_desc:0 "We must train our army to be ready. We must do something impossible for anarchy, have an organised army"
 GRE_army_of_anarchism:0 "Propaganda, Army And Above All Anarchism"
 GRE_army_of_anarchism_desc:0 "We must spread out ideas world wide. We can't stay in the small country of Greece. We must spread our believes"
 GRE_claim_america:0 "Claim America"
 GRE_claim_america_desc:0 "The dream of a Byzantine colonial Empire in america would be perfect. It may never happened, but now it is our mission to finally do it"
 GRE_push_from_brazil:0 "Push From Brazil"
 GRE_push_from_brazil_desc:0 "Brazil has been facing critical instability the past years. If we manage to naval invade them, we will win"
 GRE_attack_south:0 "Attack South"
 GRE_attack_south_desc:0 "The rest of South America is also not in a great position. Now that we have a border with them, we can attack"
 GRE_attack_north:0 "Attack North"
 GRE_attack_north_desc:0 "It may be hard, but in order to reach north america we have to attack the Gran Colombia sub continent. The terrain will make this really hard, but hopefully we can do it"
 GRE_annex_panama:0 "Annex Panama"
 GRE_annex_panama_desc:0 "Panama, due to it's strategic importance is a country we must control. Of course, who wouldn't want to control the Panama canal?"
 GRE_through_central_america:0 "Through Central America"
 GRE_through_central_america_desc:0 "In order to reach the giants in north america, we must attack the smaller countries in central america. They will be an easy target"
 GRE_through_central_mex:0 "Attack Mexico"
 GRE_through_central_mex_desc:0 "Mexico will be the first real threat we will face in this campgain. They have a big army and a strong industry"
 GRE_attack_cub:0 "Attack Cuba"
 GRE_attack_cub_desc:0 "Cuba is the biggest island in the caribbean. In order to have a naval advantage against the USA, we must bring them under our control"
 GRE_attack_hat:0 "Attack Haiti"
 GRE_attack_hat_desc:0 "Haiti is a small and week nation in the caribbean. Attacking them will be easy, and will give us a naval advantage"
 GRE_attack_usa:0 "Attack The Americans"
 GRE_attack_usa_desc:0 "The time has come. We will finally attack the United States and secure our position in North America once and for all"
 GRE_attack_can:0 "Liberate Canada"
 GRE_attack_can_desc:0 "We must free Canada from the British empire. We must secure them under our banner, and protect Canada"
 GRE_integrate_americas:0 "Integrate The Americas"
 GRE_integrate_americas_desc:0 "We will slowly statrt the Hellenization of the Americas, befriending the population and make them join us"
 GRE_attack_dominican:0 "Attack The Dominican Republic"
 GRE_attack_dominican_desc:0 "In order to fully claim our strategic advantage in the caribbean, we must also attack the Dominican Republic. This will be an easy tast"
 GRE_gl:0 "Hellenization"
 GRE_annex_americas:0 "Hellenization"
 GRE_annex_americas2:0 "Hellenization"
 GRE_annex_americaa3:0 "Hellenization"
 GRE_annex_americas4:0 "Hellenization"
 GRE_eng:0 "Demand English Colonies"
 GRE_fra:0 "Demand French Colonies"
 GRE_ita:0 "Demand Italian Colonies"
 GRE_eth:0 "Demand Ethiopian States"
 GRE_lib:0 "Demand Liberian States"
 GRE_por:0 "Demand Portugese Colonies"
 GRE_spr:0 "Demand Spanish Colonies"
 GRE_bel:0 "Demand Belgian States"
 colonies.66.t:0 "Italian Ultimatum"
 colonies.66.d:0 "At exactly 3:00 on the morning of October 28, 1940, Italian ambassador Grazzi gave a war ultimatum, which expires in three hours. The ultimatum said that the Italians wanted to occupy 'some points on Greek territory respecting Greek sovereignty over the rest of the territory'. When Metaxas asked what these points were, Grazzi could not answer because the Italians  had not prepared such a list since they did not expect that Metaxas would refuse to surrender the nation of Greece. It is clear that the Italians want to use our nation in order to support their war in Africa"
 colonies.66.a:0 "We have no choice, we must surrender our whole nation!"
 colonies.66.b:0 "We will not sell our nation!"
 colonies.66.c:0 "We must try to find another soluton!"
 colonies.67.t:0 "Greece Wants To Nagotiate"
 colonies.67.d:0 "The Greek prime minister, wanting to secure his nation and it's people is willing to nagotiate. He wants to give us all the territory we ask for, in exchange for peace"
 colonies.67.a:0 "Let's Give them a chance"
 colonies.67.b:0 "We don't want a few pieces of land. We want all of Greece!"
 colonies.68.t:0 "Italy Sends Their Demands"
 colonies.68.d:0 "Italy, has sent us a list of the territories they demand. If we dont accept, it will mean war"
 colonies.68.a:0 "There is nothing else we can do"
 colonies.68.b:0 "That is too much! We will not sell our people!"
 colonies.69.t:0 "War With Italy"
 colonies.69.d:0 "It was a hard decision, but we must protect our nation and our people above all. We will fight for our freedom!"
 colonies.69.a:0 "Alors, c'est la guerre (So it's war)"
 colonies.70.t:0 "Honor The Balkan Pact?"
 colonies.70.d:0 "With tensions between Italy and Greece becoming more intense, we are given a choice. Should we honor the balkan pact? Or should we abandom them?"
 colonies.70.a:0 "Greeks are and will always be our Brother!"
 colonies.70.b:0 "Maybe cancelling the deal is the best option"
 colonies.70.c:0 "We will send material support and volunteers!"
 colonies.71.t:0 "Oppose The Balkan Pact"
 colonies.71.d:0 "With all the rest of the balkans protecting Greece, we have lots to gain. With the power of the German and Italian war machines we can destroy the balkans and secure our claims"
 colonies.71.a:0 "We must get back our claims!"
 colonies.71.b:0 "Maybe we should stay out of this"
 GRE_constantinople_wall:0 "Walls Of Constantinople"
 GRE_constantinople_wall_desc:0 "The walls of Constantinople were unbreakable. Even when Constantinople fell, the walls kept standing. The walls never abandoned us. They were always there for us. We must build our fortifications like the Byzantines did and make them unbreakable"
 colonies.1.t:0 "Greece Demands Colonies"
 colonies.1.d:0 "Greece has demanded their claimed states in Africa"
 colonies.1.a:0 "Let's give them what they want"
 colonies.1.b:0 "Never!"
 GRE_conquest:0 "Finally, we can have peace"
 GRE_conquest_desc:0 "We have finally managed to rebuild our empire. We have no reason to keep expanding. We are satisfied, and we focus on improving our own nation"
 GRE_the_empire:0 "The Empire"
 GRE_the_empire_desc:0 "Our heartland is secured. Our soldiers are happy that our conquest will stop and can finally rest. Their morale has been better than it has never been!"
 GRE_arms_expansion:0 "Merge Factories"
 GRE_arms_expansion_desc:0 "If we want to secure our nation, we must increase our production. We need more factories and we need them now!"
 GRE_study_italian_ethiopian_tactics:0 "The Italo-Ethiopian War"
 GRE_study_italian_ethiopian_tactics_desc:0 "Nobody knows how they will cope with the pressures of a battlefield, let alone how an empire or nation will cope. Although we were under prepared for the stresses of modern warfare, our military has learned the difficult lessons of war and became stronger for it."
 GRE_italian_weakness:0 "Abuse The Italian Weakness"
 GRE_italian_weakness_desc:0 "The shame of Adwa has been repeated. Some 40 years after the humiliation the Italians had suffered at the hands of the Ethiopians, they had a great plan for revenge. Which failed again. Mussolini is the reason his own empire collapsed"
 GRE_invest_into_the_army:0 "Army Investment"
 GRE_invest_into_the_army_desc:0 "We must invest into improving our weapons. We must fund the weapon research, and slowly get the upper hand in the world"
 GRE_infiltrating:0 "Infiltration"
 GRE_infiltrating_desc:0 "We will send a few of our soldiers into enemy territories. We will have them build bases there, which they can use to move quickly and be effective when war starts"
 GRE_the_road_of_life:0 "The Road Of Life"
 GRE_the_road_of_life_desc:0 "With several of our cities threatened and under siege, we must focus on getting the fighting forces in those places the support they need to hold out, whatever the cost may be."
 GRE_defence_council:0 "Defence Council"
 GRE_defence_council_desc:0 "We must create a defence council. A council which will be in charge of building defences and protecting our nation from foreign influence"
 GRE_volunteers_from_everywhere:0 "Volunteers"
 GRE_volunteers_from_everywhere_desc:0 "In order to expand our army, we must start volunteering programms. People can volunteer and join the army, and as a bonus they will have a tax reduction"
 GRE_merchenaries_from_everywhere:0 "Merchenaries"
 GRE_merchenaries_from_everywhere_desc:0 "In order to keep expanding our empire, we must hire merchenaries. It will be expensive, but they will fight in line with our soldiers for the right price"
 GRE_finish_tactics:0 "The Finno-Soviet War"
 GRE_finish_tactics_desc:0 "The finnish people fought bravely against the soviet union. We have to admire their extreme courage. They managed to stopped the red menace without any major foreign support"
 GRE_red_cross_support:0 "Red Cross"
 GRE_red_cross_support_desc:0 "The Red Cross will help us rebuild our nation from any previous wars. They will help our soldiers in battle, and help us win all of our wars"
 GRE_family:0 "Family"
 GRE_family_desc:0 "Family is an important part of the Greek culture. Kids, learn most of the stuff they will need in life not only for school but from their family as well. The family is in charge of teaching kids moral lessons"
 GRE_land_reforms:0 "Land Reforms"
 GRE_land_reforms_desc:0 "We must reform our land, and create more space to open new factories. We must industrialise on every single piece of land"
 GRE_hydroelectric_energy:0 "Hydro-Electric Energy"
 GRE_hydroelectric_energy_desc:0 "We must use Hydro-Electric energy in order to make our country and energy free, while also using what the nature provides for us"
 GRE_oil:0 "Search For Oil"
 GRE_oil_desc:0 "Greece is rich in oil. We must take advantage of the oil, and control the global trade. Without oil, modern weapons are useless!"
 GRE_energy:0 "Nuclear Energy"
 GRE_energy_desc:0 "We must invest into energy expansion. Nuclear energy can help us become energy independant and make our energy production effective"
 GRE_shipping:0 "The Strongest Civilian Navy"
 GRE_shipping_desc:0 "Huge projects such as the onassis investment, have allowed us to become one of the top nations in terms of shipping. We must expand those projects, and rule the world trade"
 GRE_court:0 "Benefits For Families"
 GRE_court_desc:0 "People who have families help the bloodline of our nation keep going. We must not let these people face economic problems. We must support the people that keep our nation alive"
 GRE_research:0 "Hire American, German and Soviet Scientists"
 GRE_research_desc:0 "America, Germany and the Soviet Union are the most technologically-advanced nations. We must bring some of their top scientists here, promising them a better salary"
 GRE_our_home:0 "Our Home"
 GRE_our_home_desc:0 "The balkans have always been our home. Macedonia and Byzantium controlled the balkan territories for centries. This region, is the home of every greek and orthodox christian"
 GRE_national_security:0 "National Security"
 GRE_national_security_desc:0 "We must secure our people. We must improve our police and invest into it. Every greek person must be able to feel safe in his home"
 GRE_home_of_every_revolution:0 "Home Of All Revolutions"
 GRE_home_of_every_revolution_desc:0 "A lot of Great revolutionaries have been in the balkans. After all, democracy, the major ideology on the world started here. All opinions and ideologies are accepted ... on some degree"
 GRE_tradition:0 "Traditon And Religion"
 GRE_tradition_desc:0 "Tradition and religion have always been an important part of our nation. We must not get rid of our tradion. We must embrase it and accept it"
 GRE_global_falangism:0 "Global Falangism"
 GRE_global_falangism_desc:0 "We are not alone in our struggle for bringing Falangism to our nation. There are volunteers across Greece who seek to support Falangist movements worldwide, and the state should support these individuals."
 GRE_authority:0 "Authority"
 GRE_authority_desc:0 "A lot of people want to overthrow our government. We must stop all of these movements. We must have our soldiers secure the cities and make sure everything goes as planned"
 GRE_men:0 "Men Work"
 GRE_men_desc:0 "In almost all modern societies, men are the people who work. Men carry the nation and the economy on their backs. We must make sure this will not stop"
 GRE_saint:0 "Saint Bernard"
 GRE_saint_desc:0 "Since time immemorial we have prided ourselves for our medical tradition and our willingness to help people in need. The Great Saint Bernard Hospice and the Red Cross organization are testament to that. Now that spirit can be weaponized and reoriented to the militias in order to bolster our defense efforts."
 GRE_women:0 "Women Stay Home"
 GRE_women_desc:0 "The women must stay home and be charge of growing strong kids, who will be able to keep the society running. We must not give in to the women rights movements, and keep the things they way they are"
 GRE_phalanx:0 "Macedonian Brigade"
 GRE_phalanx_desc:0 "We must create a brigade, strong enough to compete against the giants of our world. We must create the macedonian brigade, a brigade that can compete to the German Panzers and the red army"
 GRE_king_of_kingss:0 "Our Savior"
 GRE_king_of_kingss_desc:0 "Our supreme leader has managed to save us. From an economically destoyed country, we have become a great power. We owe our success to him"
 GRE_kid:0 "Kids Study"
 GRE_kid_desc:0 "The kids are supposed to study. They must learn from our old mistakes, in order to help our nation go forward. They are the ones who will some day drive our nation to success"
 GRE_atomic:0 "Atomic Research"
 GRE_atomic_desc:0 "The atomic bomb is a powerful weapon. Having it on our hands, will finally make everyone respect Greece. We must fund researches to get this technology as soon as possible" 
 GRE_stronger_religion:0 "Stronger Religion"
 GRE_stronger_religion_desc:0 "People have been shifting away from religion. We cannot let this happen. We must embrace religion more, and reattract people back to it"
 GRE_befriend_arabs:0 "Adopt Islam As An Offical Religion"
 GRE_befriend_arabs_desc:0 "Islam is the most spread religion across our empire. There is no need to keep fighting it. Even if it will upset most people, it is a hard decision we had to take"
 MAC_alexander_himself:0 "Alexander's Empire"
 MAC_alexander_himself_desc:0 "This man who claims to be Alexander the Great could be a madman, but multiple researches has shown he could be the real Alexander. He must be the one who will hold the throne of greece"
 GRE_greater_salad:0 "Greater Than Caesar"
 GRE_greater_salad_desc:0 "Caesar always wanted to be like Alexander the Great. Even if he became great, he would never reach Alexander's Greatness. Alexander is superior"
 GRE_greater_short_king:0 "Greater Than Napoleon"
 GRE_greater_short_king_desc:0 "Napoleon admired both Caesar and Alexander. He managed to become great, driving France into great victories. But he could never become as great as Alexander."
 GRE_greater_adlf:0 "Greater Than Adolf"
 GRE_greater_adlf_desc:0 "Hitler has managed to build a great empire. He wants to try to mimic Alexander's Greatness. Even if he has managed to expand his empire into a great size, he still has one testicle"
 GRE_athenian_trade_ath:0 "Athenian Trade"
 GRE_athenian_trade_ath_desc:0 "The Athenian trade system is a system we have to admire. Now that we are also a great naval power, we must be as effective as possible. We must adopt the system of ancient Athens"
 GRE_spartan_legions:0 "Spartan Legions"
 GRE_spartan_legions_desc:0 "We actually owe most of our empire to Spartans. If they hadn't made their great last stand in thermopyles, Persia would have conquered Greece. Greece and macedonia would never be a nation. We must honor the spartans"
 GRE_macedonian_economy:0 "Macedonian Economy"
 GRE_macedonian_economy_desc:0 "Now that we are an industrial power, we must adopt a new economic system. We must use our factories and resources to the greatest extend"
 GRE_choose_queen:0 "Alexander's Queen"
 GRE_choose_queen_desc:0 "In order to bring stability to the empire, we must organise a royal marriage. We must choose a queen who can help Alexander with his conquest"
 GRE_iron_mindset:0 "Iron Mindset"
 GRE_iron_mindset_desc:0 "Nothing can distract Alexander. He is always focused, studying military tactics and win as many battles as possible. He is trying to become truly the Greatest"
 GRE_Bucephalus:0 "Spirit Of Bucephalus"
 GRE_Bucephalus_desc:0 "Bucephalus was the royal horse of Alexander. He had been with him during his journey and never left his side. It was a special horse, made for a special man"
 GRE_lord_of_asia:0 "Lord Of Asia"
 GRE_lord_of_asia_desc:0 "Alexander, managed to reach the other side of Asia within a few years. No enemy ever managed to stopped him, all the way to the way to the Indian subcontinent. If he had lived longer, he would have gone further into Asia"
 MAC_attack_africa:0 "Conquer Aithiopia And Libya"
 MAC_attack_africa_desc:0 "Africa used to be an Unkown continent. Today, that we finally know what exists afther the desserts, we must keep expanding even there"
 GRE_the_greek_macedonia:0 "Hellenic League"
 GRE_the_greek_macedonia_desc:0 "The Hellenic League was a project created by Alexander's father, Philip II to unite all greeks under one banner against Persia. We must not abandon this project"
 MAC_success_in_europe:0 "Success In Europe"
 MAC_success_in_europe_desc:0 "Our Campgain in Europe has been going great. We have conquered previously unknown territories. We made the ancient powers of Rome and Carthage look like kittens compared to our empire. We can officially declare our campgain there a success, and liberate the people from their overlords"
 MAC_success_in_asia:0 "Success In Asia"
 MAC_success_in_asia_desc:0 "Our Campgain in Asia was a total success. We reached territories like China and India, nations that noone imagined they would ever join us. We can finally start the Hellinization of these territories"
 GRE_antigonus:0 "Hire Antigonus"
 GRE_antigonus_desc:0 "Antigonus was one of Alexander's greatest Generals"
 GRE_cassander:0 "Hire Cassander"
 GRE_cassander_desc:0 "Cassander was one of Alexander's greatest Generals"
 GRE_lysimachus:0 "Hire Lysimachus"
 GRE_lysimachus_desc:0 "Lysimachus was one of Alexander's greatest Generals"
 GRE_ptolemy:0 "Hire Ptolemey"
 GRE_ptolemy_desc:0 "Ptolemey was one of Alexander's greatest Generals"
 GRE_seleucus:0 "Hire Seleucus"
 GRE_seleucus_desc:0 "Seleucus was one of Alexander's greatest Generals"
 GRE_fca:0 "Focus On Defence"
 GRE_fca_desc:0 "We must teach our commanders defencive tactics, and make sure they can defend our nation from any aggressor"
 GRE_fcb:0 "Focus On Attack"
 GRE_fcb_desc:0 "We must teach our commanders how to properly use the Phalanx, and maximise the attack of their units"
 GRE_fch:0 "Focus On Logistics"
 GRE_fch_desc:0 "We must teach our commanders how to use less supplies, and stop wasting their supplies. We will save a lot of resources from this"
 GRE_fcr:0 "Focus On Planning"
 GRE_fcr_desc:0 "We must teach our commanders how to study, steal and find weakness on emeny tactics more efficiently"
 GRE_memory_of_roxana:0 "The Roxana Experiment"
 GRE_memory_of_roxana_desc:0 "Alexander The Great wants scientists to revive Roxana the same way he somehow got revived. I mean does he not have enough wifes already? But I guess it is the least we can do after leading our empire to victory"
 GRE_pharao_of_egypt:0 "Pharao Of Egypt"
 GRE_pharao_of_egypt_desc:0 "By controlling Egypt, we also claim the Throne of Pharao. After all, Cleopatra was Greek"
 GRE_shahanshah:0 "Shahanshah Of Persia"
 GRE_shahanshah_desc:0 "By controlling all of Persia, we also control the throne of the long lasting persian empire"
 GRE_thousand_week_empire:0 "Thousand Week Empire"
 GRE_thousand_week_empire_desc:0 "Our empire has finally been secured. After killing all traitors, we can finally rest. We indeed did a good job. We owe everything to Alexander the Great and his father Philip"
 GRE_hygienic_housing:0 "Hygienic Housing"
 GRE_hygienic_housing_desc:0 "Too many people are still living in overcrowded slums, not fit for human habitation. We need to wipe the slate clean and ensure everyone has access to hygienic, functional housing."
 GRE_hydroelectric_energy_plan:0 "Hydroelectric Plants"
 GRE_hydroelectric_energy_plan_desc:0 "In order to make energy affordable for everyone, we must utalize natural resources. We must build more hydroelectric plants in order to achieve that"
 GRE_autarky:0 "Autarky"
 GRE_autarky_desc:0 "Greece is not really rich in natural resources. In order to build our own economy, while avoiding to purchase resources from other nations, we must stop exporting. We must become a nation that can provide for it's own needs"
 GRE_trade_lords:0 "New Trade Deals"
 GRE_trade_lords_desc:0 "We may not have many resources, but we must export all of them. Like the Athenians did, we must trade all of our resources in exchange of building a strong economy, which revolves around trading"
 GRE_cancel_the_schachtplan:0 "Cancel The Schachtplan"
 GRE_cancel_the_schachtplan_desc:0 "The Germans are manipulating us. They extract all of our resources, in exchange of an unfair deal. We must cancel it right away!"
 GRE_both_benefits:0 "Both Sides Benefit"
 GRE_both_benefits_desc:0 "The Schachtplan is unfair. We must send advisors to Germany, nagotiating a better deal. One that will benefit both sides"
 GRE_better_deal:0 "A Better Deal"
 GRE_better_deal_desc:0 "The Schachtplan is destroying our economy. We must ask the Germans to show us mercy, and give us a better deal"
 GRE_spirit_of_1821:0 "Spirit Of 1821"
 GRE_spirit_of_1821_desc:0 "In 1821, Greece did something noone ever dared do. They wanted to become free. They started an uprising against the Ottoman Empire. Many heroes sacrificed to secure Greek freedom. This was the start of the Ottoman Collapse. We must honor those people"
 GRE_instant_defence:0 "Fort Construction"
 GRE_instant_defence_desc:0 "We must improve our defensive bases in the North. Bulgarian imperialism is a great threat. We must be prepared to kick those barbarians out of Greece"
 GRE_arillery_experts:0 "Let Fly, All Guns"
 GRE_arillery_experts_desc:0 "While we don’t have the vast industry of other nations, we do have some of the most proficient weapons manufacturers. With extra investment, we could fully utilize their talents to give our forces a technological edge on the battlefield"
 GRE_camo:0 "Camouflage Experts"
 GRE_camo_desc:0 "If the enemie cannnot see us, then they cannot beat us. We must invest into new camo outfits, in order to make sure our soldiers will become one with their enviroment"
 GRE_skierrrrrr:0 "Women Of Epirus"
 GRE_skierrrrrr_desc:0 "The Women of our nation are ready to supply our soldiers. They are willing to risk their lives, just so they can help our soldiers. They want to climb those mountains, just so our soldiers can have a warm jacket during winter... They are the real heroes of our nation"
 GRE_all_cards:0 "All Cards On Deck"
 GRE_all_cards_desc:0 "Drawn out skirmishes across the sea do little to change the course of war. When our navy sets sail, it shall be with the goal of crushing the enemy in one decisive blow."
 GRE_coastal_defence:0 "Coastal Defence"
 GRE_coastal_defence_desc:0 "We mus deploy big guns in the coast to push off the invaders. We must organise a front that can effectively destroy any naval invasion"
 GRE_coastal_fort:0 "Secure Athens and Thessaloniki"
 GRE_coastal_fort_desc:0 "We must not let the enemy capture Athens and Thessaloniki. We must invest all of our resources building forts in these cities. If they capture them, we are doomed"
 GRE_oddyseus:0 "Odysseus"
 GRE_oddyseus_desc:0 "Odysseus and his men spent 10 years figting on Troy, and another 10 years trying to return to their home. Almost all of them died on their way back. We must build a navy big enough, that will cover the whole sea. This way noone will be lost"
 GRE_mines:0 "Mine Warfare"
 GRE_mines_desc:0 "If we want to secure our seas, we must drop mines everywhere. We must make sure any enemy ship that tries to approach, will face consequences"
 GRE_bombing_the_heck_our_of_our_enemies:0 "Greek Bombers"
 GRE_bombing_the_heck_our_of_our_enemies_desc:0 "An effective way to defeat our enemy, is to destroy their supplies. In order to do that, we must train our bomber pilots in order to have precise targeting"
 GRE_formation:0 "Formation"
 GRE_formation_desc:0 "In order to win in the air, we must be organised. All our pilots will fly together. This will limit the chances of an enemy attack that will cause havoc and destroy our planes"
 GRE_rocket:0 "Rockets?"
 GRE_rocket_desc:0 "When you think of Greece, you probably won't think of Rockets. But in order to actually succeed in the future and become a superpower, we must invest into this new type of 'space weapon'"
 GRE_air_bases:0 "Invest Into Air Bases"
 GRE_air_bases_desc:0 "We must build more airbases in order to secure our advantage in the air. The more airbases, they more planes we can house, and the more pilots we can train"
 GRE_jet_age:0 "Into The Jet Age"
 GRE_jet_age_desc:0 "We must invest into a new type of aircrafts. We must invest into Jets. Jets, due to their speed will be a powerful ally of the Greek army"
 GRE_foreign_designs:0 "Foreign Designs"
 GRE_foreign_designs_desc:0 "Why bother to design new aircrafts, while we can just ask our allies for help ? This will save us a lot of time and money to invest into something else"
 GRE_restablish_the_ss:0 "Reestablish The SS"
 GRE_restablish_the_ss_desc:0 "Stratiotikos Syndesmos was a military organisation, built by Generals who wanted the king to invest more money into the armed forces. With tensions rising again, we must recruit those generals"
 GRE_matriarchy:0 "Matriarchy"
 GRE_matriarchy_desc:0 "All these years men have ruled over women, deeming them useless, believing that they were just made for household chores, cooking and raising the kids. Now that Greece has achieved gender equality, it's time to do something better, greater and superior. It's time to put women in charge. Let men do all the chores. It's time to prove to the world that women are as capable if not more than men"
 GRE_hellenic_union_groups:0 "Hellenic Commonwealth Union"
 GRE_hellenic_union_groups_desc:0 "In order to have a great benefit, we must learn from the major powers. We must ask them to guide us, and teach us how to develop better technologies. This way, developing nukes will only be a matter of time"
 GRE_foreign_affairs:0 "The Road Of Life"
 GRE_foreign_affairs_desc:0 "We must improve our distribution of supply to support our army"
 GRE_balkan_ambition:0 "Invest Into Field Hospitals"
 GRE_balkan_ambition_desc:0 "In order to lose less soldiers into battle, we must invest into field hospitals"
 GRE_ally_yugoslavia:0 "Spirit Of 1821"
 GRE_ally_yugoslavia_desc:0 "The spirit of 1821 is what helped us protect our nation. We must recruit this spirit"
 GRE_potential_allies_in_the_balkans:0 "Further Improvement Of Logicists"
 GRE_potential_allies_in_the_balkans_desc:0 "We must improve our logistics even more in order to support our army!"
 GRE_formalize_the_albanian_protectorate:0 "Research Funds"
 GRE_formalize_the_albanian_protectorate_desc:0 "Our nation has some great minds and clever people. We must invest into them, so they can invest into our future"
 GRE_albanian_occupation:0 "German Light Tanks"
 GRE_albanian_occupation_desc:0 "We must buy light tanks from Germany in order to make our army better"
 GRE_albanian_oil:0 "German Heavy Tanks"
 GRE_albanian_oil_desc:0 "Heavy tanks will allow us to easily destroy all of our enemies!"
 GRE_support_albanian_irredentism:0 "German Medium Tanks"
 GRE_support_albanian_irredentism_desc:0 "Medium tanks are the most cost effective type of tank we can use to secure our nation"
 GRE_albanian_fascist_militia:0 "German Super Heavy Tanks"
 GRE_albanian_fascist_militia_desc:0 "Why stop at heavy tanks when we can have something stronger?"
 GRE_guarantee_austrian_independence:0 "Purchase British Convoys"
 GRE_guarantee_austrian_independence_desc:0 "The british have a lot of convoys they can spare. They will be more than happy to give them to us"
 GRE_negotiate_GRElian_claims:0 "Mine Warfare"
 GRE_negotiate_GRElian_claims_desc:0 "We must secure our seas by minelaying"
 GRE_ratify_the_stresa_front:0 "British Light Cruisers"
 GRE_ratify_the_stresa_front_desc:0 "The British have a lot of spare ships. We can put some of them into good use"
 GRE_joint_milGREry_programs:0 "Military Excersice"
 GRE_joint_milGREry_programs_desc:0 "In order to keep our army into a good state, we must host trainings to horn their skills"
 GRE_demand_dalmatia:0 "Camouflage Experts"
 GRE_demand_dalmatia_desc:0 "Our enemies won't know who attacked them if they can't see us!"
 GRE_GRElys_destiny:0 "Let Fly, All Guns"
 GRE_GRElys_destiny_desc:0 "Investing into our artillery will help our army a lot"
 GRE_preventive_intervention:0 "Build Fortifications"
 GRE_preventive_intervention_desc:0 "Building fortifications will allow us protect our nation from any threat"
 GRE_prevent_the_spread_of_communism:0 "More Men!"
 GRE_prevent_the_spread_of_communism_desc:0 "We need more men for the army!"
 GRE_resume_food_importation:0 "Food Imports"
 GRE_resume_food_importation_desc:0 "Buying food from other countries will allow us to invest our factories to guns"
 GRE_decrease_tariffs:0 "More Food Imports!"
 GRE_decrease_tariffs_desc:0 "We need to free even more factories!"
 GRE_pact_of_steel:0 "Tobacco Exports"
 GRE_pact_of_steel_desc:0 "Our nation is rich in material used to create tobacco. Why not capitalize from this?"
 GRE_german_milGREry_assistance:0 "Dig For Resources"
 GRE_german_milGREry_assistance_desc:0 "I bet if we dig a lot, we can find a lot of resources in our lands!"
 GRE_sea_wolves_bba:0 "Guns For Butter"
 GRE_sea_wolves_bba_desc:0 "The more factories there are, the more guns we will have!"
 GRE_scientific_cooperation_r56:0 "Dessert Warfare"
 GRE_scientific_cooperation_r56_desc:0 "You can never know in what terrain we will have to fight. We must prepare our soldiers for the worst"
 GRE_the_GRElian_tiger:0 "Winter Warfare"
 GRE_the_GRElian_tiger_desc:0 "We must be ready to fight at all seasons! The weather should not oppose us!"
 GRE_giannini_sarnow_protocols:0 "National Stability"
 GRE_giannini_sarnow_protocols_desc:0 "We must please our people with the current government"
 GRE_request_control_of_french_territories:0 "The Kids Study"
 GRE_request_control_of_french_territories_desc:0 "The kids have to study in order to build a bright future someday and secure our nations survival"
 GRE_milGRErize_the_rome_protocols:0 "New Work Positions"
 GRE_milGRErize_the_rome_protocols_desc:0 "We must fight unemployment by building more factories!"
 GRE_befriend_japan:0 "Shipping Industry"
 GRE_befriend_japan_desc:0 "Greece has had a great naval history. And we are Greek. We must keep this tradition going"
 GRE_GRElian_irredentism:0 "Religion And Tradition"
 GRE_GRElian_irredentism_desc:0 "Our nation is a nation of faith and tradition. This is what has kept us going for so long"
 GRE_invite_croatia:0 "Befrind The Muslims"
 GRE_invite_croatia_desc:0 "We should be open and accept other religions as well"
 GRE_operazione_trajan:0 "Atomic Research"
 GRE_operazione_trajan_desc:0 "Nuclear technology is the only way to secure our nation nowadays"
 GRE_expand_the_romanian_oil_fields:0 "Nuclear Reactors"
 GRE_expand_the_romanian_oil_fields_desc:0 "We must get ahead in temrs of nuclear technology. We must fund a nuclear reactor to take the lead"
 GRE_war_with_france:0 "Men Work"
 GRE_war_with_france_desc:0 "The men have to work in order to provide for their families. It has always been like this, and it must stay"
 GRE_demand_ticino:0 "Invest Into Police"
 GRE_demand_ticino_desc:0 "We must invest into our police to protect our people"
 GRE_operazione_druso:0 "Espionage"
 GRE_operazione_druso_desc:0 "We must invest into our spy agency to gain intel into other countries"
 GRE_operazione_tiberio:0 "Women Stay Home"
 GRE_operazione_tiberio_desc:0 "Women are supposed to stay home and raise their kids"
 GRE_war_with_the_uk:0 "Women Volunteer Force"
 GRE_war_with_the_uk_desc:0 "We must allow women on important positions in order to help us"
 GRE_war_with_greece:0 "Militarist Support"
 GRE_war_with_greece_desc:0 "We must request support from the colonels, to modernize our army"
 GRE_befriend_greece:0 "Metaxism"
 GRE_befriend_greece_desc:0 "The theory of 3 civilizations is a reality everyone should accept"
 GRE_claims_on_turkey_bba:0 "Found The Golden Dawn"
 GRE_claims_on_turkey_bba_desc:0 "The Golden Dawn is a far right organization that is supposed to help us secure our national identity"
 GRE_befriend_turkey:0 "Greek Resistance Groups"
 GRE_befriend_turkey_desc:0 "We must hire resistance groups from Greece to help us build a people's militia army"
 GRE_operazione_costantino:0 "Stratiotikos Syndesmos"
 GRE_operazione_costantino_desc:0 "The S.S. is an organization created in order to de-corrupt our army command. Their help would be useful once more"
 GRE_corpo_di_truppe_volontarie:0 "Onassis Plan"
 GRE_corpo_di_truppe_volontarie_desc:0 "We must accept Onassi's plan to build a naval superpower"
 GRE_study_the_spanish_civil_war:0 "Macedonian Economy"
 GRE_study_the_spanish_civil_war_desc:0 "We must study the way Alexander the Great organized the macedonian economy, and mimic is, so we can succeed in the same way"
 GRE_spanish_GRElian_alliance:0 "All Cards On Deck"
 GRE_spanish_GRElian_alliance_desc:0 "Our navy shall never surrender!"
 GRE_demand_balearic_islands_bba:0 "Family Above All"
 GRE_demand_balearic_islands_bba_desc:0 "Family is important for Greeks. It is a part of our national identity"
 GRE_invite_andorra:0 "Booming Tourist Industry"
 GRE_invite_andorra_desc:0 "There are a lot of reasons to visit our nation. We have great landmarks, both natural and artificiall"
 GRE_befriend_portugal:0 "Take Over Trade"
 GRE_befriend_portugal_desc:0 "If we become the trade leaders of the world, noone will dare to fight us!"
 GRE_the_spanish_question:0 "Spirit Of Spartans"
 GRE_the_spanish_questiond_desc:0 "The Spartans were great warriors. Their spirit shall keep living inside us"
 GRE_the_hellenic_agency:0 "The Hellenic Agency"
 GRE_the_hellenic_agency_desc:0 "The Hellenic Agency has played a big role in global history. During the first world war, under the king, the agency would provide the German Empire with important information about the Entente. Ever since then our agency has not had a big mission, but that does not mean it should be abandoned"
 GRE_expand_the_agency:0 "Expand Our Agency"
 GRE_expand_the_agency_desc:0 "Our Agency seems to be effective. It will be worth investing into its expansion. We will do our best to train our spies in order to become the best across the whole globe!"
 GRE_invite_austrian_generals:0 "Oppose The Austrian Annexation"
 GRE_invite_austrian_generals_desc:0 "Germany has went on and done something illegal. The annexation of Austria by Germany is prohibited due to their defeat in the first world war. We must protect the Austrians from the Fascist regime, and invite them to our nation"
 GRE_czech_factories:0 "Czechoslovakian Industrial Organisation"
 GRE_czech_factories_desc:0 "Another illegal annexation was made by Germany. First the Sudetenland, and now the whole of Czechoslovakia. The biggest factory of the world, Skoda, is now under German control. We must not allow the German war machine to control it. We must invite this company to Greece!"
 GRE_the_ethiopia_help:0 "Send Help To Ethiopia"
 GRE_the_ethiopia_help_desc:0 "Italy has went on and attack Ethiopia again! We must not allow this aggression. We must help ehtiopia protect itself from foreign influence! Like them, one day we might be on a similar situation"
 GRE_the_italia_help:0 "Support The Italian Colonialism"
 GRE_the_italia_help_desc:0 "Italy has every right to claim ethiopia. It is land that was claimed by them in the Berlin conference. We must support their race"
 GRE_the_spanish_commie_help:0 "Support Spanish Socialists"
 GRE_the_spanish_commie_help_desc:0 "We must not allow spain to fall under fascist hands. We must send help, and support the socialists on their fight against the fascist eagle"
 GRE_the_spanish_fasc_help:0 "Support Spanish Fascists"
 GRE_the_spanish_fasc_help_desc:0 "The socialist regime of spain is of course the wrong one. The spanish have suffer many years under this regime, and we must help them escape"
 GRE_the_japanese_help:0 "Volunteers To Japan"
 GRE_the_japanese_help_desc:0 "Japan is the victim of Chinese aggresion. Isn't it obvious! We must help them protect their empire from these barbarians, and make sure a new and definitely free kingdom will be established in China"
 GRE_the_chinese_help:0 "Stand With The Chinese United Front"
 GRE_the_chinese_help_desc:0 "Chinese people under Japanese rule have suffered a lot. We must help them liberate themselves from their evil overlord, and secure their national freedom!"
 GRE_the_allied_help:0 "Allied Aid"
 GRE_the_allied_help_desc:0 "The Allies will have to face a really powerful foe. We must help them protect themselves from the German war machine. Poland and France may seem safe, but they are definitely in the danger zone"
 GRE_the_axis_help:0 "Lend Lease To The Axis"
 GRE_the_axis_help_desc:0 "Germany has a mission to reclaim its lands. And we must support them. Like we once did, they want to try and restore their empire. This is an operation worth funding!"
 GRE_the_finished_help:0 "Finland Stands Strong"
 GRE_the_finished_help_desc:0 "Finland has done the unexpectable, and has denied soviet demands! Of course, we must not leave them alone. We must support them on this fight against the evil communist regime!"
 GRE_the_soviet_help:0 "Ally The Soviets"
 GRE_the_soviet_help_desc:0 "The Soviets want to reclaim their Russian empire lands, and liberate all the workers across Finland. This is the right reason to fight, and we must support it"
 GRE_ally_ethiopian_heroes:0 "Ally Ethiopian Heroes"
 GRE_ally_ethiopian_heroes_desc:0 "In order to restore Rome, we must face Italy. And the best way to do it is by allying their enemies, the ethiopians"
 GRE_united_against_italy:0 "United Against Italy"
 GRE_united_against_italy_desc:0 "We must invite the ethiopian heroes in exile to help us fight the greater evil, and restore the glory of Rome!"
 GRE_mandate_of_heaven:0 "The Mandate Of Heaven"
 GRE_mandate_of_heaven_desc:0 "Now that the Qing are under our control, we are given the option to annex them, and claim the mandate of heaven as ours"
 GRE_italization_and_romanization:0 "Romanization"
 GRE_italization_and_romanization_desc:0 "Now that italy is under our full control, we can finally claim the rightful capital, and control Rome!"
 GRE_not_italy_not_greece_but_rome:0 "Not Italy, Not Greece, But Rome"
 GRE_not_italy_not_greece_but_rome_desc:0 "We are neither the western nor the eastern empire. We are finally united under one crown"
 GRE_north_industrialization:0 "North Industrialisation"
 GRE_north_industrialization_desc:0 "The North has many great spots to build factories, and we must take this opportunity"
 GRE_north_mining:0 "North Mining Operation"
 GRE_north_mining_desc:0 "In the Italian Alps, there are many hidden resources. We must search to find some of them, and use them to build a strong industry"
 GRE_save_venetian_oil:0 "Save Oil"
 GRE_save_venetian_oil_desc:0 "There is plenty of fuel on our nation, and we must start storing lots of it"
 GRE_collect_power:0 "Collect All Power"
 GRE_collect_power_desc:0 "Our leader is our savior. He deserves every position in the government"
 GRE_oh_no_the_rubber_broke:0 "Rubber Production"
 GRE_oh_no_the_rubber_broke_desc:0 "Rubber is a rare and useful material. Selling lots of it will be beneficial"
 GRE_prepare:0 "Prepare"
 GRE_prepare_desc:0 "We must invest into our army and prepare for a greater conflict"
 GRE_defence:0 "Spirit Of Defence"
 GRE_defence_desc:0 "We must fortify and create defencive positions"
 GRE_defence_2:0 "Aggressive Spirit Of Defence"
 GRE_defence_2_desc:0 "Time is running low, we must fortify even faster!"
 GRE_offence:0 "Spirit Of Offence"
 GRE_offence_desc:0 "We must prepare to crush all of our enemies once and for all!"
 GRE_offence_2:0 "Aggressive Spirit Of Offence"
 GRE_offence_2_desc:0 "We must prepare even faster, our enemies will not see it coming!"
 GRE_peace_and_quite:0 "Spirit Of Security"
 GRE_peace_and_quite_desc:0 "We must make sure our national rights will not be violated"
 GRE_peace_and_quite2:0 "Aggressive Spirit Of Security"
 GRE_peace_and_quite2_desc:0 "We must make sure our army will be ready to push off any enemy"
 GRE_crushing_enemies:0 "Crushing Our Enemies"
 GRE_crushing_enemies_desc:0 "Our enemies shall suffer. Our enemies will not stand total war against Rome"
 GRE_south_industrialization:0 "South Shipyard Building"
 GRE_south_industrialization_desc:0 "South Italy has a big coast and perfect terrain to build more shipyards"
 GRE_bend_the_bars:0 "Bend The Bars"
 GRE_bend_the_bars_desc:0 "Securing the Mediterranean is top priority. A naval invasion could be the collapse of our whole army!"
 GRE_build_a_stronger_navy:0 "A Stronger Navy"
 GRE_build_a_stronger_navy_desc:0 "We must build even more dockyards to make our navy stronger!"
 GRE_war_funds:0 "War Funds"
 GRE_war_funds_desc:0 "We must fund the creation of arms factories. This will allow us to make more guns and grow our nation even more"
 GRE_more_guns:0 "More Guns"
 GRE_more_guns_desc:0 "We must empty every storage. We must find as many guns as possible to add to our stockpile"
 GRE_fund_labs:0 "Fund Labs"
 GRE_fund_labs_desc:0 "If we want to win, we must fund the creation of labs that will help us develop in terms of technology"
 GRE_all_roads_lead_to_rome:0 "All Roads Lead To Rome"
 GRE_all_roads_lead_to_rome_desc:0 "We must create more roads. We must make space to build more factories around them. We must succeed in total economic industrialisation"
 GRE_weapons_of_mass_destruction:0 "Weapons Of Mass Destruction"
 GRE_weapons_of_mass_destruction_desc:0 "Nukes are a strong weapon every country wants. We must try to get them first!"
 GRE_shipping_industry:0 "The Ships Of Rome"
 GRE_shipping_industry_desc:0 "We must invest into more dockyards. But instead of warships, we must build civilian ships, to make the transportation easier"
 GRE_boole_o_waer:0 "'Borrow' British Ships"
 GRE_boole_o_waer_desc:0 "There are many british ships docked near our ports. It would be too sad if somehow they disappeared"
 GRE_minister_of_education:0 "Improve Education"
 GRE_minister_of_education_desc:0 "Every person in Rome must be educated. We cannot afford to have barbarians live here!"
 GRE_american_caesar:0 "American Caesar"
 GRE_american_caesar_desc:0 "America thinks they are the world power. But we cannot allow this to happen. We must conquer them!"
 GRE_prepare_for_the_fight_overseas:0 "Prepare For The Fight Overseas"
 GRE_prepare_for_the_fight_overseas_desc:0 "We must prepare to fight outside of this continent. Rome will not stay only in Europe, it shall expand to all continents!"
 GRE_retry_africa:0 "Retry Africa"
 GRE_retry_africa_desc:0 "Italians failed to invade Africa. Now that we are a new and stronger Italy, we must try to do the same, but this time we will succeed"
 GRE_war_against_colonialism:0 "War Against Colonialists"
 GRE_war_against_colonialism_desc:0 "France and Britain, both of which are superpowers, rely too much on their colonies for support. Taking over their colonies will mean they will become weak"
 GRE_cavalary_of_rome:0 "Roman Cavalry"
 GRE_cavalary_of_rome_desc:0 "Rome is well known for its fast and strong horses. We must use this horses in order to build a storng and fast army"
 GRE_war_in_the_dessert:0 "Dessert Warfare"
 GRE_war_in_the_dessert_desc:0 "We must train our soldiers to survive under the hot sunds of the desserts"
 GRE_war_in_the_snow:0 "Snow Warfare"
 GRE_war_in_the_snow_desc:0 "We must train our soldiers to survive in heavy snow and cold climate"
 GRE_legacy_of_east:0 "Legacy Of The East"
 GRE_legacy_of_east_desc:0 "The Eastern Roman Empire is the greatest empire. The reason? It lasted more than any other empire, by far!"
 GRE_legacy_of_west:0 "Legacy Of The West"
 GRE_legacy_of_west_desc:0 "The Western Roman Empire is the most important one. It is the part that managed to unite the whole empire before it got split!"
 GRE_grsidk:0 "Civilian Industry"
 GRE_grsidk_desc:0 "We must invest into our civilian industry in order to build a strong empire"
 GRE_itsidk:0 "Military Industry"
 GRE_itsidk_desc:0 "We must invest into our military industry in order to make our army as big as possible"
 GRE_war_against_slavs:0 "War Against Slavs"
 GRE_war_against_slavs_desc:0 "The slavs are currently our biggest enemy. We must destroy all of them!"
 GRE_fate_of_rome_city:0 "Fate Of Rome"
 GRE_fate_of_rome_city_desc:0 "We must build a new city over Rome. A new city that will not connect us to our old failures!"
 GRE_northern_front:0 "Viking Front"
 GRE_northern_front_desc:0 "The vikings had a strong civilization like ours. Why not combine them then?"
 GRE_pan_scandinavism:0 "Pan-Scandinavism"
 GRE_pan_scandinavism_desc:0 "Since we waged war for the viking land, why not continue, and conquer more of scandinavia?"
 GRE_fate_of_japan:0 "The Fate Of Japan"
 GRE_fate_of_japan_desc:0 "Japan is an empire on the other side of the world. The only foe that might be powerful enough to face us. It will be worth to see this fight"
 GRE_chinese_wargames:0 "Chinese Wargames"
 GRE_chinese_wargames_desc:0 "The Chinese were the only civilization that admired the size of our emprire. We are thanful for it. But now, they will become another part of our empire"
 GRE_mean_of_spqr:0 "What SPQR Really Means"
 GRE_mean_of_spqr_desc:0 "We have managed to create a great empire. And we should be proud of it. SPQR will rise once again!"
 GRE_modern_italian_failure:0 "Modern Italian Failure"
 GRE_modern_italian_failure_desc:0 "Mussolini has failed to make Italy a super power. Someone else has to step up now"
 GRE_hire_bablo:0 "Hire Bablo"
 GRE_hire_bablo_desc:0 "We must hire Bablo to help us improve our policies"
 GRE_hire_grandi:0 "Hire Grandi"
 GRE_hire_grandi_desc:0 "We must hire Grandi to help us improve our policies"
 GRE_as_the_barometer_falls:0 "Roman Armed Forces"
 GRE_as_the_barometer_falls_desc:0 "We must utalize the armed forces of ancient Rome to succeed"
 GRE_recruit_arab_soldiers:0 "Recruit Arab Soldiers"
 GRE_recruit_arab_soldiers_desc:0 "Our own people are not enough to protect our huge empire. We must hire arabian soldiers to help us protect it"
 GRE_expand_cleopatra_s_kingdom:0 "An Alliance With Cleopatra"
 GRE_expand_cleopatra_s_kingdom_desc:0 "Cleopatra played an important role on history. Her influence on the Roman empire was big. Maybe she is not here today, but her kingdom, egypt, still exists"
 GRE_destroy_persia:0 "Claim The Persian Throne"
 GRE_destroy_persia_desc:0 "Persia is the natural enemy of Rome. Now that have been destroyed, we are free to claim the throne to their kingdom"
 GRE_viking_spirit:0 "The Viking Spirit"
 GRE_viking_spirit_desc:0 "An alliance with the vikings will help us expand our kingdom in the north part of Europe"
 GRE_north_stars:0 "The North Stars"
 GRE_north_stars_desc:0 "In order to ally the northern countries, we must become one of them"
 GRE_kingdom_of_north_sea:0 "King Of The North Sea"
 GRE_kingdom_of_north_sea_desc:0 "The throne to the scandinavian kingdom is free. And our leader is the best candidate"
 GRE_fate_of_europe:0 "Fate Of Europe"
 GRE_fate_of_europe_desc:0 "Let the Roman reconquest begin, and crush all europe once and for all!"
 GRE_hre:0 "Puppet The Un-Holy Non-Roman Dis-Empire"
 GRE_hre_desc:0 "How dare do the germanic tribes claim the roman empire? They shall face our anger"
 GRE_hre2:0 "Take Over The HRE"
 GRE_hre2_desc:0 "The HRE may seem like a free nation but they are not. We also do not want to annex"
 GRE_auh:0 "Puppet The Austrian Empire"
 GRE_auh_desc:0 "Similar to the HRE, the Austrian Empire and letter Austria-Hungary dared to claim rome. They shall face the same fate as Germany"
 GRE_commonwealth:0 "Claim The Commonwealth"
 GRE_commonwealth_desc:0 "Poland Lithuania has suffered many partitions. But under our protection, they will be safe!"
 GRE_ukrain:0 "Conquer Ukraine"
 GRE_ukrain_desc:0 "We must help reclaim the commonwealth. We must give Ukraine to the Polish and Lithuanian"
 GRE_belarrrus:0 "Conquer Belarus"
 GRE_belarrrus_desc:0 "We must help reclaim the commonwealth. We must give Belarus to the Polish and Lithuanian"
 GRE_idk_something_about_uk_fifth_rome:0 "The Fifth Rome"
 GRE_idk_something_about_uk_fifth_rome_desc:0 "UK never officially claimed the Fifth Rome. But they will be a nice part of our collection"
 GRE_safeguard_the_puppets:0 "Safeguard The Dominions"
 GRE_safeguard_the_puppets_desc:0 "We must make sure the UK will stay in control of their dominions"
 GRE_crossing_to_americas:0 "The Crossing To America"
 GRE_crossing_to_americas_desc:0 "USA, the biggest power of our time. They shall join the fifth Rome or face our powerful army"
 GRE_idk_something_france_forth_rome:0 "Claim The Fourth Rome"
 GRE_idk_something_france_forth_rome_desc:0 "Napoleon though we could make himself a Roman emperor. Now his whole nation will suffer"
 GRE_crush_the_napoleonic_dream:0 "Crush The Napoleonic Dream"
 GRE_crush_the_napoleonic_dream_desc:0 "France will officially become a part of our collection of Romes"
 GRE_idk_something_russia_third_rome:0 "Reclaim The Third Rome"
 GRE_idk_something_russia_third_rome_desc:0 "After the fall of constantinople, Russia claimed instantly the Roman empire. We shall not allow that! We shall take revenge!"
 GRE_end_communism_forever:0 "End Communism Forever"
 GRE_end_communism_forever_desc:0 "Russia will be the jewel of our collection of failed roman empires"
 GRE_idk_something_iberia_idk_rome:0 "The Iberian Problem"
 GRE_idk_something_iberia_idk_rome_desc:0 "Iberia, after becoming the overlord of the new world claimed rome as well. Too bad the new world won't save them now"
 GRE_united_iberia_idk:0 "Iberia Under Roman Rule"
 GRE_united_iberia_idk_desc:0 "Iberia, united or not, will be a nice part of our huge collection of Romes"
 GRE_march_of_the_eagles:0 "March Of The Eagles"
 GRE_march_of_the_eagles_desc:0 "Now that we have collected every empire that once claimed Rome, they shall march under our command!"
 GRE_third_rome:0 "Third Rome"
 GRE_third_rome_desc:0 "Integration of the third rome shall take place"
 GRE_leviathan:0 "Leviathan"
 GRE_leviathan_desc:0 "The rich south east asia shall bow under our rule from now and on"
 GRE_res_republic:0 "Res Republic"
 GRE_res_republic_desc:0 "Napoleonic France will become a part of our empire"
 GRE_el_dorado:0 "El Dorado"
 GRE_el_dorado_desc:0 "The new world will be integraded by us"
 GRE_dharma:0 "Dharma"
 GRE_dharma_desc:0 "The riches of India will be ours"
 GRE_rule_britannia:0 "Rule Britannia"
 GRE_rule_britannia_desc:0 "Britain will be under our control from now on"
 GRE_lions_of_the_north:0 "Lions Of The North"
 GRE_lions_of_the_north_desc:0 "Scandinavia will finally be united under our rule"
 GRE_cossaks:0 "Cossaks"
 GRE_cossaks_desc:0 "Poland Lithuania will be under our control and no more be partitioned"
 GRE_conquest_of_paradise:0 "Conquest Of Paradise"
 GRE_conquest_of_paradise_desc:0 "We do not deserve a place in paradise. We deserve all of it!"
 GRE_domination_submission:0 "Domination"
 GRE_domination_submission_desc:0 "Our enemies shall bow to us! Noone will be able to stop us!"
 GRE_common_sence:0 "Common Sence"
 GRE_common_sence_desc:0 "A logical king can lead our empire through tough times"
 GRE_cradle_of_civilization:0 "Cradle Of Civilization"
 GRE_cradle_of_civilization_desc:0 "We created civilization. The modern world has been heavily influenced by us"
 GRE_golden_century:0 "Golden Century"
 GRE_golden_century_desc:0 "We have entered a new golden age for rome and the empire"
 GRE_origins:0 "Origins"
 GRE_origins_desc:0 "A theory claims all humans originate from africa. Therefore, it is our homeland and we shall prepare to claim it"
 GRE_wealth_of_nations:0 "Wealth Of Nations"
 GRE_wealth_of_nations_desc:0 "We must build a strong and powerful economy. An economy that no embargo can stop"
 GRE_rights_of_man:0 "Rights Of Man"
 GRE_rights_of_man_desc:0 "Men deserve more credit. They are the ones who fight so we can live in peace and safety"
 GRE_art_of_war1:0 "Art Of War"
 GRE_art_of_war1_desc:0 "We must learn how to fight properly"
 GRE_emperor:0 "Emperor"
 GRE_emperor_desc:0 "Our king, the emperor of the world"
 GRE_themare_nostrum:0 "Mare Nostrum"
 GRE_themare_nostrum_desc:0 "We have finally managed to fully claim the roman kingdom, republic and empire"
 GRE_our_old_navy:0 "Our Old Navy"
 GRE_our_old_navy_desc:0 "It has been centuries since the Greek navy was at a good place. Now we are given the option to play our cards right and create a strong and powerful navy, a navy bigger than the Italian one"
 GRE_utilize_our_strengths_volos:0 "Support Thessaly Farmers"
 GRE_utilize_our_strengths_volos_desc:0 "Our main farming industry is located in volos. We must support the farmers there to prevent a new food shortage"
 GRE_0_unemployment:0 "End The Unemployment Crisis"
 GRE_0_unemployment_desc:0 "Unemployment crisis has almost been fixed. In order to make the final blow and end this crisis, we must invest into some more factories"
 GRE_nationalize_foreign_monopolies:0 "Nationalize Foreign Monopolies"
 GRE_nationalize_foreign_monopolies_desc:0 "We should not allow the industries of another country to control the prices in Greece. We must take control over them"
 GRE_drachmmmmmmmmmmm:0 "Deevaluate The Drachma"
 GRE_drachmmmmmmmmmmm_desc:0 "In order for our trade to be more efficient, we should sacrifice a part of our currency. We should deevaluate the drachma once more!"
 GRE_industry:0 "Urbanization"
 GRE_industry_desc:0 "In order to better improve our nation, we must industrialise, and in order to do that more effectively, we should urbanize first"
 GRE_farm:0 "Rurallization"
 GRE_farm_desc:0 "Greeks are not meant to work in the factories, they are meant to work on their farms in their home villages. That is just how it has always been"
 GRE_balance:0 "Balanced Approach"
 GRE_balance_desc:0 "Both factories and farm are important for Greece to survive. We must find a solution in the middle, one that will benefit both sides"
 GRE_pan_hellenic_rail_way:0 "The Pan-Hellenic Railway"
 GRE_pan_hellenic_rail_way_desc:0 "We must heavily invest into building a railway system, in order to guarantee supply for our troops in future conflit, and transfer goods with max efficiency"
 GRE_weapons_industry:0 "Incrase Our Defence Budget"
 GRE_weapons_industry_desc:0 "With Mussolini's and Ataturk's expansionism aiming at Greece, we should increase our military spendings to protect our nation"
 GRE_benefit_farmers:0 "Funds For Farmers"
 GRE_benefit_farmers_desc:0 "With food production becoming harder, we should start giving funds to people in exchange of improving their farming equipment. If only the funds end up in the right place..."
 GRE_dig_for_oil:0 "Dig For Oil"
 GRE_dig_for_oil_desc:0 "It has been confirmed that deep down Greece is rich in oil, we just have to search to find it"
 GRE_voice_of_people:0 "Voice Of The Low Class"
 GRE_voice_of_people_desc:0 "We must make sure the people are happy with our government, and we shall give them a voice to represent their demands"
 GRE_radio:0 "The Radio"
 GRE_radio_desc:0 "We must keep investing into improving our communication system and making the spread of information easier"
 GRE_merchant_fleet:0 "Our Merchant Fleet"
 GRE_merchant_fleet_desc:0 "What not many people know is that Greece has a big merchant fleet, owned by multiple investors in Greece. We should request their investment to create a national fleet as big"
 GRE_build_reactor:0 "Into The Nuclear Age"
 GRE_build_reactor_desc:0 "With the world moving forward, we must somehow manage to catch up in terms of technology. What better way to do so by investing in weapons of mass destruction?"
 GRE_uranium_mines:0 "Uranium Mines"
 GRE_uranium_mines_desc:0 "We should mine our own Uranium in order to produce nukes secretly without anyone knowing"
 GRE_blueprint_stealing:0 "Bluepring Stealing"
 GRE_blueprint_stealing_desc:0 "We must invest into our spy network, and teach them how to steal blueprints from other countries in order to advance our tech knowledge"
 GRE_starbucks:0 "Coffe Exports"
 GRE_starbucks_desc:0 "We must build a coffee monopoly, one that will trade our coffee exports all over the world"
 GRE_widespread_wealth_redistrubtion:0 "Widespread Wealth Redistribution"
 GRE_widespread_wealth_redistrubtion_desc:0 "We must not allow a few people to hold all the money and power. We shall devide this among our highest government officials"
 GRE_tour_of_greece:0 "Tour Of Greece"
 GRE_tour_of_greece_desc:0 "Having our army move by feet is not the best for their morale, and trucks are too expensive to afford. Why not think outside the box?"
 GRE_What_they_took_from_us:0 "Memories Of The Black '22"
 GRE_What_they_took_from_us_desc:0 "1922 a great catastrophe happen. But if we work smart and hard enough, we will take our revenge soon"
 GRE_scavenge:0 "Scavenger Hunt"
 GRE_scavenge_desc:0 "We must adopt some new policies. Instead of abandoning the dead enemy, we must take their weapon. Guns are too expensive too afford"
 GRE_expanded_supply_lines:0 "Expand Supply Lines"
 GRE_expanded_supply_lines_desc:0 "We must build better roads, in order to redistribute our supplies more effectively"
 GRE_cold_training:0 "Train In The Cold"
 GRE_cold_training_desc:0 "We must train our army to fight in the freezing temperatures of our mountains"
 GRE_more_trucks:0 "Turn Cars To Trucks"
 GRE_more_trucks_desc:0 "We need modern means to transport our supply. We will search for abandon cars in scrapyards, and for a small price we will turn them to trucks"
 GRE_dessert_train:0 "Train Under The Sun"
 GRE_dessert_train_desc:0 "We must train our divisions to handle the hot weather of Greece during summertime"
 GRE_attack_trucks:0 "Destroy Enemy Supply Lines"
 GRE_attack_trucks_desc:0 "We cannot afford losing men trying to win against a strong enemy. We must destroy their supply depots and weaken their army first"
 GRE_weapons_cache:0 "Weapons Cache"
 GRE_weapons_cache_desc:0 "We must size private weapons, and instead use them for our army. Our men need them more"
 GRE_each_others_back:0 "Ready At All Times"
 GRE_each_others_back_desc:0 "We must train more men, we never know when the enemy will strike"
 GRE_hospitals:0 "Field Hospitals"
 GRE_hospitals_desc:0 "We must hire more medical proffesionals for our army. Their work can save the lives of the brave men"
 GRE_secret_pact_with_comminternw:0 "Secret Pact With The Comminterm"
 GRE_secret_pact_with_comminternw_desc:0 "We must hire russian men to work for us. They know what they are doing"
 GRE_secret_pact_with_axisw:0 "Secret Pact With The Axis"
 GRE_secret_pact_with_axisw_desc:0 "The axis generals are well trained, and have the combat inside their heart. We must hire some of them to train our soldiers"
 GRE_secret_pact_with_alliesw:0 "Secret Pact With The Allies"
 GRE_secret_pact_with_alliesw_desc:0 "The allies have always been on our side. We have so many common interests, so at this point, why not hire them to work for us?"
 GRE_prevent_italian_invasion:0 "Prevent The Italian Invasion"
 GRE_prevent_italian_invasion_desc:0 "We know that Italy is planning to attack us. We must make a secret deal, to guarantee our safety"
 GRE_partisans:0 "Partisans"
 GRE_partisans_desc:0 "We must prepare for the worse. We must train partisans to fight for us in case Greece ever falls"
 GRE_international_parade:0 "National-Wide Parade"
 GRE_international_parade_desc:0 "We must host an enormous parade across Greece in order to show off our force to the whole world"
 GRE_guns_for_butter:0 "Guns For Butter"
 GRE_guns_for_butter_desc:0 "If only there was a way to produce cheap guns... Maybe we should cut some corners"
 GRE_tank_program:0 "Tank Program"
 GRE_tank_program_desc:0 "We should invest into making some of our own tanks. These things are super effective in combat"
 GRE_molotov:0 "Molotovs"
 GRE_molotov_desc:0 "We should adopt molotovs in our army. They will work as a usefull distraction against enemy tanks"
 GRE_railway_art:0 "Railway Artillery"
 GRE_railway_art_desc:0 "Artillery is not enough ... we need something heavier and stronger. We should create something similar to the German Gustav"
 GRE_greek_snipers:0 "Greek Sniper Battalion"
 GRE_greek_snipers_desc:0 "We should train an army of snipers, in order to create chaos and distraction in enemy lines"
 GRE_greek_cars:0 "Armored Cars"
 GRE_greek_cars_desc:0 "We must hire a swedish company to build armor cars for us, cars that will be capable of causing destruction"
 GRE_anti_turkish_sea_exercise:0 "Anti Turkish Sea Exercise"
 GRE_anti_turkish_sea_exercise_desc:0 "The turkish have been organising many naval exercises on our border lately, how would they like it if we did the same?"
 GRE_fleet_for_adriatic:0 "We must build a ship that can secure the whole adriatic. The allies may did that for us in the first world war, but now they won't be able to help"
 GRE_marines:0 "Marines"
 GRE_marines_desc:0 "We must train an army of elite marines in order to naval invade and surprise our enemies"
 GRE_balkan_navy:0 "Balkan Coast Mapping"
 GRE_balkan_navy_desc:0 "We must map again the coast of the balkans, creating a more updated map, this way accidents will be less likely to happen"
 GRE_antlatic_navy:0 "Long-Range Navy"
 GRE_antlatic_navy_desc:0 "We must invest into a navy capable of doing long-rage tasks in the altantic"
 GRE_coast_guard:0 "Hellenic Coast Guard"
 GRE_coast_guard_desc:0 "While our men will be fighting in the front, we must have someone protect our coast. We must train the coast guards to do so"
 GRE_ship_modules:0 "Invest Into Ship Equipment"
 GRE_ship_modules_desc:0 "We must modernise and refit all of our ships to use the latest equipment"
 GRE_mid:0 "Midget Submarines"
 GRE_mid_desc:0 "We must invest into a new kind of submarine that can go undetected for longer"
 GRE_sub_modules:0 "Stronger Torpedoes"
 GRE_sub_modules_desc:0 "We must invest into stronger torpedoes that will sink our enemie's ships"
 GRE_sub_nuk:0 "Submarine-Launched Nukes"
 GRE_sub_nuk_desc:0 "Nukes will only work on close targets, and our airforce has to be in place to protect them. Why not invest into a new way of transfering nukes?"
 GRE_ships_of_evil:0 "Ships Of Evil"
 GRE_ships_of_evil_desc:0 "We must request some ships from the Axis to secure our ports"
 GRE_deal_with_onassis_niarchos:0 "Deal With Onassis And Niarchos"
 GRE_deal_with_onassis_niarchos_desc:0 "We must make a deal with Greek bussinesmen in order to help us build our navy back"
 GRE_moreeeedocks:0 "More Dockyards"
 GRE_moreeeedocks_desc:0 "If we want to become the naval power we once were, we will need more dockyards to produce ships"
 GRE_unleash:0 "Unleash Our Power"
 GRE_unleash_desc:0 "We must buy ships from foreign powers in order to better improve our navy"
 GRE_unleash_tt:0 "§GUnlocks decisions to purchase ships§! DUE TO A BUG IT WILL BE ADDED IN A FEW DAYS AFTER A FIX HAS BEEN FOUND"
 GRE_ships_from_great_powers:0 "Ships Of Greater Good"
 GRE_ships_from_great_powers_desc:0 "We must request some ships from the great powers and protectors of our world in order to secure our own islands"
 GRE_support_via_sea:0 "Support Via The Sea"
 GRE_support_via_sea_desc:0 "Our navy shall bombard the shore where enemy divisions stay while we attack the enemy"
 GRE_central_powers_planes:0 "Old Central Power Planes"
 GRE_central_powers_planes_desc:0 "We must purchase old planes from the central powers in order to protect our skies"
 GRE_entente_planes:0 "Old Entente Planes"
 GRE_entente_planes_desc:0 "Entente planes will help us keep our skies safe from any enemy"
 GRE_paratroop:0 "Paratroopers Training"
 GRE_paratroop_desc:0 "We must train a brigade of elite paratroopers that can launch behind enemy lines and sabotage them"
 GRE_radar:0 "Invest Into Radar"
 GRE_radar_desc:0 "We must invest into the radar in order to detect enemy planes easier"
 GRE_antiair:0 "Anti-Air Defence"
 GRE_antiair_desc:0 "We must build a strong anti-air system that can destroy enemy planes in range"
 GRE_gas_attacks:0 "Gas attacks"
 GRE_gas_attacks_desc:0 "Altough it did not go well for the Germans in the Great war, we should give gas attack another chance"
 GRE_napalm:0 "Napalm"
 GRE_napalm_desc:0 "Napalm will be a great weapon that we can use in order to create havoc in enemy lines. They would never expect to see rain fire"
 GRE_a_flight_over_ankhara:0 "A Flight Over Ankhara"
 GRE_a_flight_over_ankhara_desc:0 "Turkey has been making many flies above the aegean. Whould they like it if one of our planes reacher Ankhara?"
 GRE_heavy_airforce_production:0 "Heavy Air Production"
 GRE_heavy_airforce_production_desc:0 "If we want to win we must be ready to fight in the air, and if we want to do that we need many airplanes"
 GRE_self_destructive_planes:0 "Greek Kamikazes"
 GRE_self_destructive_planes_desc:0 "Are kamikaze planes really that useful? I guess we have nothing to do if we give them a try"
 GRE_bombing_everything:0 "Aerial Artillery"
 GRE_bombing_everything_desc:0 "Enemy troops will be really weak if we constantly bomb them. A perfect opportunity for target practice"
 GRE_metaxas_no:0 "Metaxas' No"
 GRE_metaxas_no_desc:0 "We will not surrender to the Italians. Greece is not yet lost! Our men will fight for our freedom!"
 GRE_production_above_all:0 "Production Above All"
 GRE_production_above_all_desc:0 "While the enemy is till burning down on their weapon supplies, we have all the time to make more"
 GRE_standing_up_against_german_guns:0 "Anti-Tank Guns"
 GRE_standing_up_against_german_guns_desc:0 "If we want to pierce through the german war machine, we need to create anti-tank guns"
 GRE_sue_for_peace:0 "Sue For Peace"
 GRE_sue_for_peace_desc:0 "Turns out we were not ready for the war, we must make peace"
 GRE_the_new_sick_man:0 "The New Sick Man"
 GRE_the_new_sick_man_desc:0 "Mussolini is so invested into his empire dreams, he cannot sea his whole nation is crumbling. He is the new sick man of europe"
 GRE_like_our_darkest_hour:0 "Like Our Darkest Hour"
 GRE_like_our_darkest_hour_desc:0 "Like 1821, we are once again in a situation fighting for our freedom. We will not fail, Greece will always rise!"
 GRE_launch_our_operation:0 "Launch Our Operation"
 GRE_launch_our_operation_desc:0 "We are ready to get back in the war, but this time we will win"
 GRE_new_expansionism:0 "New Expansionism"
 GRE_new_expansionism_desc:0 "We will not be in a defensive war, we will go aggresive this time and hunt down the enemy"
 GRE_partisan_uprising:0 "Partisan Uprising"
 GRE_partisan_uprising_desc:0 "The people of Italy are sick of Mussolini's regime. Let's help him overthrow his government and free themselves!"
 GRE_german_revolts:0 "German Revolts"
 GRE_german_revolts_desc:0 "We must support revolts inside of Germany, aiming to distraction and worsening their supply lines and war support"
 GRE_securing_our_lands:0 "Securing Our lands"
 GRE_securing_our_lands_desc:0 "We must make sure no German or Italian will stay in Greece, we must kick them all out"
 GRE_greek_communism:0 "Greek Communism"
 GRE_greek_communism_desc:0 "We are not a puppet of Stalin, we are capable of protecting ourselves from outside force"
 GRE_socialism_has_been_achieved:0 "Socialism Has Been Achieved"
 GRE_socialism_has_been_achieved_desc:0 "Unlikely other communist regimes, we are not a dictatorship. We support democracy!"
 GRE_industrial_nation:0 "Industrial Nation"
 GRE_industrial_nation_desc:0 "Production above all! Everything starts from a factory, we must keep producing guns!"
 GRE_agricultural_nation:0 "Agricultural Nation"
 GRE_agricultural_nation_desc:0 "The farmers are fighting to give us all the food we need. We must relieve their pain"
 GRE_red_monarchy:0 "A Red Monarchy"
 GRE_red_monarchy_desc:0 "It may sound crazy, but we still a king to please the people and promise stability. Why not try this new type of government?"
 GRE_trade_unions:0 "Hellenic Trade Unions"
 GRE_trade_unions_desc:0 "We must give some of our factories to the trade unions, in order to cut down on costs"
 GRE_sickle_union:0 "Union Of Communists"
 GRE_sickle_union_desc:0 "Communism is being hunted accross all europe. Greece can become their new home!"
 GRE_revolution:0 "Revolt Workers! Your Time Has Come!"
 GRE_revolution_desc:0 "It is time! Rise up workers and finally get all the rights you deserve!"
 GRE_the_path_to_trotskism:0 "Path To Trotskism"
 GRE_the_path_to_trotskism_desc:0 "Trotsky has been hunt down by stalin. But his ideas will always settle on Greece"
 GRE_reformssss:0 "Government Reforms"
 GRE_reformssss_desc:0 "We must reform our government and make a system that will be more fair for the people"
 GRE_invite_trotsk_in_army:0 "Trotsky In The Army"
 GRE_invite_trotsk_in_army_desc:0 "We must give Trotsky his own position in the army and invite him to Greece"
 GRE_embrace_workers:0 "Embrace The Workers"
 GRE_embrace_workers_desc:0 "We must all take a moment to appreciate how important the workers are for Greece and the people"
 GRE_worker_army:0 "Society Of Workers"
 GRE_worker_army_desc:0 "Everything revolvs around the workers. Therefore, they should be given the right to decide about our future"
 GRE_break_with_the_sicle:0 "Break With The Sicle"
 GRE_break_with_the_sicle_desc:0 "We are no longer a puppet of Stalin, we can finally go our own way"
 GRE_liberation:0 "The Home Of Marx"
 GRE_liberation_desc:0 "We may not be able to take back the home of marx, but we should be ready to do so"
 GRE_trotskism_peak:0 "Peak Trotskism"
 GRE_trotskism_peak_desc:0 "Trotskism has managed to save our country from its eternal problems. Long live Trotsky, the real father of communism!"
 GRE_fifth_international:0 "The Fifth international"
 GRE_fifth_international_desc:0 "The previous internationals were a failure, but this time we must spread communism across the globe"
 GRE_strait_crossing_bosporus:0 "Strait Crossing The Bosporus"
 GRE_strait_crossing_bosporus_desc:0 "we must train our army to be capable of crossing the evros and going into Turkey"
 GRE_sieze_religious_property:0 "Sieze Religious Property"
 GRE_sieze_religious_property_desc:0 "We are in need of no gods, we must take the space church use and put it at good use"
 GRE_the_kings_council:0 "The King's Council"
 GRE_the_kings_council_desc:0 "The king needs a team to guide him, he is still learning after all, he cannot take every decision on his own"
 GRE_god_save_our_own_king:0 "God Save Our King"
 GRE_god_save_our_own_king_desc:0 "Our king is protected by the god. With his help, he will save Greece"
 GRE_germanophile_king:0 "Germanophile"
 GRE_germanophile_king_desc:0 "Our king, being from Germany, obviously has a positive feeling when it comes down to the German nation and people"
 GRE_increase_german_trade:0 "Increase German Trade"
 GRE_increase_german_trade_desc:0 "Let's strike a deal with Germany that will benefit both them and us as trade partners"
 GRE_our_royal_claims:0 "Our Royal Claims"
 GRE_our_royal_claims_desc:0 "We have a king with no empire. Of course, we must have some claims of our own!"
 GRE_pride_of_the_hellenic_navy:0 "Pride Of The Hellenic Navy"
 GRE_pride_of_the_hellenic_navy_desc:0 "Our ships need to bear the name of our nation's savior. Long live the king!"
 GRE_centralise:0 "Centralize The Union"
 GRE_centralise_desc:0 "We should start making the EU official by annexing and integrading our european supporters"
 GRE_general_mobilization:0 "General Mobilization"
 GRE_general_mobilization_desc:0 "Bringing peace to the world won't be an easy task. We must start mobilizing more men"
 GRE_give_rights_to_women:0 "Give Rights To Women"
 GRE_give_rights_to_women_desc:0 "In order to gain more support for our government we should start giving more rights to women, which are a big part of our population"
 GRE_reeducate_our_generals:0 "Update Our Tactics"
 GRE_reeducate_our_generals_desc:0 "We should renew our tactics, and have generals study modern warfare to become more familiar with it"
 GRE_pan_european_council:0 "Pan-European Council"
 GRE_pan_european_council_desc:0 "We would not be a union if only we had the power and could make all decisions. We must create a council in which all european nations will have a say"
 GRE_defence_above_all:0 "Defending Our Lands"
 GRE_defence_above_all_desc:0 "We must focus on increasing our military budget if we want our army to be capable of defending our union"
 GRE_universal_healthcare:0 "Universal Healthcare"
 GRE_universal_healthcare_desc:0 "If we want to ensure the future of our country we must ensure its citizens will be healthy. And there is no better way to do it than having free healtcare"
 GRE_european_nuclear_PROGRAM:0 "European Nuclear Program"
 GRE_european_nuclear_PROGRAM_desc:0 "If we want to have a sit on the high table we must be able to compete with other great powers. Nukes are an easy way to make sure we will earn everyone's respect"
 GRE_peace_through_force:0 "Peace Through Force"
 GRE_peace_through_force_desc:0 "If we want to guarantee a peaceful future, we first must neutralize all threats"
 GRE_no_intervention_policy:0 "No Intervention Policy"
 GRE_no_intervention_policy_desc:0 "War is such a big waste. We should not waste our resources participating in it. We should let things develop naturally"
 GRE_joint_navy:0 "Navy Exercise"
 GRE_joint_navy_desc:0 "In case of war, the enemy will most likely try to destroy our supplies by attacking our convoys. We must be strong enough to defend them"
 GRE_med_fleet:0 "Medditeranean Fleet"
 GRE_med_fleet_desc:0 "We must create a fleet that will be able to flexibly move around the Medditeranean sea"
 GRE_north_fleet:0 "Antlatic Fleet"
 GRE_north_fleet_desc:0 "With eyes on the Americas, we must create a fleet that can easily cover the Antlatic ocean and be capable of going months without fuel"
 GRE_ruling_the_waves:0 "Ruling The Waves"
 GRE_ruling_the_waves_desc:0 "With our modernization of the fleet, we must also modernize the weapons of it. We should invest into better equipment for our navy!"
 GRE_the_euro:0 "The Euro"
 GRE_the_euro_desc:0 "There is a need for a common currency. We should use one that represents all members of the EU. We shall then found the Euro!"
 GRE_changing_currency:0 "Changing Currencies"
 GRE_changing_currency_desc:0 "With many countries being part of the EU, we must also create a common currency. We should leave behind the chaos of previous economic crisis accross the continent"
 GRE_get_rid_of_drachma:0 "Drachma As Another Currency"
 GRE_get_rid_of_drachma_desc:0 "With the ideal of the EU starting from Greece, it is rightful and fair to allow the Drachma to co-exist with the Euro as a second currency"
 GRE_get_rid_of_frank:0 "Second Currency: Frank"
 GRE_get_rid_of_frank_desc:0 "The french, having  both a strong empire and economy, use the Frank. We must allow this coin to exist within the EU, in order to boost everyday transactions"
 GRE_get_rid_of_lire:0 "Lire And Euros"
 GRE_get_rid_of_lire_desc:0 "Italy ever since its unification has managed to create a strong currency. We should utalize it and allow it to exist along side the euro"
 GRE_sell_our_gold:0 "Sell Our Gold"
 GRE_sell_our_gold_desc:0 "We should sell our gold, and with the money we earn, we should invest into more factories in order to improve consumerism"
 GRE_ban_opium:0 "Ban Opium"
 GRE_ban_opium_desc:0 "Like china, opium has become really popular in Europe. In order to ensure the safety of our people, we must ban this product"
 GRE_opium_cannot_be_that_bad:0 "Opium Cannot Be That Bad"
 GRE_opium_cannot_be_that_bad_desc:0 "We should not judge a product based on its addictiveness. Opium can have many positive benefits as well, right?"
 GRE_after_the_americas:0 "After The Americas"
 GRE_after_the_americas_desc:0 "In our first step to unite the world, we should attack the nations of the americas. They have many resources we can use"
 GRE_after_AFRICA:0 "Colonialism Once More"
 GRE_after_AFRICA_desc:0 "European colonialism has reduced the power of african nations. Taking them over will not be that hard!"
 GRE_after_asia:0 "The Asian Campgain"
 GRE_after_asia_desc:0 "Asia is a vast continent that has many nations. In centers like India or China a big part of the population is concetraded. We must free these people"
 GRE_integrade_the_old_world:0 "Integrade The Old World"
 GRE_integrade_the_old_world_desc:0 "We must integrade the old world, and start our project to unite the world"
 GRE_after_oceania:0 "Take Back Oceania"
 GRE_after_oceania_desc:0 "There are not many nations in Oceania, being one of the smaller continents. A war there will be short-lived and easy"
 GRE_integrade_the_new_world:0 "Integrade The New World"
 GRE_integrade_the_new_world_desc:0 "Now that the new world is united under one flag, we must protect these nations and Integrade them, like our colonial ancestors did"
 GRE_protectors_of_the_Whole_world:0 "Protectors Of The World"
 GRE_protectors_of_the_Whole_world_desc:0 "We have finally managed to unite the world. No more wars or conflicts. Peace will exist forever for now and on"
 GRE_womencanfly:0 "Female Pilots"
 GRE_womencanfly_desc:0 "With the spirit of war raging over europe, we must try to mobilize as many soldiers as possible. The perfect way to expand our army, leaving soldier free for the army is by giving women the opportunity to join in"
 GRE_air_torpedo_raids:0 "Torpedo Raids"
 GRE_air_torpedo_raids_desc:0 "Going to war will mean we will have to fight huge navies. In order to do so without losing our ships we must find another solution. Dropping the bombs from the air, where the enemy will have a hard time fighting us"
 GRE_the_red_front:0 "The Red Front"
 GRE_the_red_front_desc:0 "Communism is a thread to our society. It will lead us towards destruction. We must publicly announce our stance against the soviet union"
 GRE_banner_of_moscow:0 "Under The Banner Of Moscow"
 GRE_banner_of_moscow_desc:0 "If we want to survive we must stay united. As communist nations, we have the right to protect our brothens who share the same ideology"
 GRE_communist_education:0 "Communist Education"
 GRE_communist_education_desc:0 "Communism must become a part of our society. Kids from a young age should be able to learn the benefits of communism"
 GRE_3_year_mandatory_service:0 "3 Year Mandatory Service"
 GRE_3_year_mandatory_service_desc:0 "The threads against our regime are many. We should train an army capable of protecting us from the threads on our border. The bigger the service, the more prepared we will be"
 GRE_the_trials_of_junta:0 "Trials Of The Hunta"
 GRE_the_trials_of_junta_desc:0 "The colonels have underestimated the Greek spirit. We must give them a chance to reintroduce Democracy. If they fail to do so, we must take the nation via force"
 GRE_sacrifices_must_be_made:0 "Our Grave Mistake"
 GRE_sacrifices_must_be_made_desc:0 "The allies may have helped us a lot, but we were not ready for such war. We must surrender now that is early, before the Axis powers decide to punish us more"
 GRE_italy_investment:0 "Italian 'Investment'"
 GRE_italy_investment_desc:0 "We must welcome italians into our land. This way we will cover all job positions and only then improve our nation"
 GRE_italian_aircraft:0 "Ask For Aircrafts"
 GRE_italian_aircraft_desc:0 "If we want to win the game in the air, we need a lot of aircrafts. Our ally Italy will definitely be more than happy to help us with it"
 GRE_italian_trucks:0 "Italian Trucks"
 GRE_italian_trucks_desc:0 "Italian Trucks will allow us to better supply our troops, therefore improving the capabilities of our army"
 GRE_albanian_cooperatism:0 "Cooperate With Albania"
 GRE_albanian_cooperatism_desc:0 "Albania, another subject of Italy, is weak, like us. If we weak countries unite, only then will we manage to succeed"
 GRE_frotifying_against_the_naval_thread:0 "The Aegean Fort"
 GRE_frotifying_against_the_naval_thread_desc:0 "Our mainland will definitely be a british land point. We must not allow them to make a landing. We must create an impassable fort"
 GRE_albanian_joint_training_program:0 "Albanian Joint Exerceise"
 GRE_albanian_joint_training_program_desc:0 "We must host an exercise with Albania. While we do not get any directly combat, we must make sure our army is well exercised"
 GRE_prussia_and_bavaria_of_balkans:0 "Prussia And Bavaria"
 GRE_prussia_and_bavaria_of_balkans_desc:0 "We must cooperate with Bulgaria in order to further improve our armies. United, we are the Germans of the Balkans"
 GRE_reich_investment:0 "Reich Investment"
 GRE_reich_investment_desc:0 "The Germans, having such a stong economy, will be more than happy to help us rebuild our economy"
 GRE_german_tanks:0 "German Tanks"
 GRE_german_tanks_desc:0 "Germany has many tanks we can use in our army. They have such a strong economy, they must have some to spair"
 GRE_german_sub:0 "German U-Boats"
 GRE_german_sub_desc:0 "The U-Boats have proven to be super effective against the british navy. We must commission and build some of our own to protect our seas"
 GRE_break_the_colonial_harmony:0 "Break The British-French Colonial Cooperation"
 GRE_break_the_colonial_harmony_desc:0 "The people of the British colonial empires have been opressed. We must help them free themselves"
 GRE_break_colonies_tt:0 "Resistance will rise in British and French colonies"
 GRE_unarrest_in_the_india_company:0 "Support Indian Freedom"
 GRE_unarrest_in_the_india_company_desc:0 "India is under pressure by the British. We must help them get their freedom, even if it means lives being lost"
 GRE_unarrest_in_the_india_company_tt:0 "Fascists will attemp to overthrow the Indian government"
 GRE_new_colonial_plan:0 "Support German Colonialism"
 GRE_new_colonial_plan_desc:0 "We must help the germans get a foothold in the Americas. The best way to do so is by giving them a weak nation to control"
 GRE_german_training:0 "German Training"
 GRE_german_training_desc:0 "We must invite German military stuff into our country to show us the way to success"
 GRE_german_staff:0 "Germanification"
 GRE_german_staff_desc:0 "We must promote the German spirit on our nation and promote their ideology. Only then we will be fully alligned with them"
 GRE_surrender_to_duce:0 "Surrender To The Duce"
 GRE_surrender_to_duce_desc:0 "Mussolini wanted to create a puppet state in Greece. We must ally ourselves with him"
 GRE_the_italian_occupation:0 "Italian Occupation"
 GRE_the_italian_occupation_desc:0 "A new era has started in Greece. One in which we rule together with Italy"
 GRE_joint_military_exercise_with_italy:0 "Military Exercise With Italy"
 GRE_joint_military_exercise_with_italy_desc:0 "We must organize an exercise with Italy so we can study their superior tactics in person"
 GRE_greater_italy:0 "Sell Crete"
 GRE_greater_italy_desc:0 "Italy has a great interest in our nation. We must give them the island of Crete, but not for free. In the price of industry"
 GRE_abandon_germany:0 "Abandon Germany"
 GRE_abandon_germany_desc:0 "Italy has suffered a lot from the incopetent German command. Along side us, we will lead both of our nations to victory"
 GRE_invite_vichy:0 "Ally Vichy France"
 GRE_invite_vichy_desc:0 "We must invite Vichy in our faction. Alongside their rule and fleet, we will rule the Medditeranean sea"
 GRE_invite_iberia:0 "Invite Iberia"
 GRE_invite_iberia_desc:0 "With Iberia in our side we will manage to take control of Giblartar and trap the British navy"
 GRE_invite_balkans:0 "Balkan Ambitions"
 GRE_invite_balkans_desc:0 "The Balkans have been opressed by great powers for years. Now we have a chance to create an alliance which noone will rule, but instead we will cooperate"
 GRE_the_rhs_ellis_incident:0 "The RHS Ellis Incident"
 GRE_the_rhs_ellis_incident_desc:0 "A few months ago, RHS Ellis was sunk by Italian torpedos. Civilian ships were also targeted. It is time Italy pays for it"
 GREE_transfer_ships_tt:0 "Italy will give us 3 of their submarines as an apology" 
 GRE_surrender_to_fuhrer:0 "Surrender To The Fuhrer"
 GRE_surrender_to_fuhrer_desc:0 "Germany has done most of the work in Greece. There is no reason to surrender to the incopetent Italians"
 GRE_german_occupation:0 "German Occupation"
 GRE_german_occupation_desc:0 "Germany is an industrial powerhouse which has a lot to offer for our nation"
 GRE_open_africa_supply_routes:0 "Open Africa Supply Routes"
 GRE_open_africa_supply_routes_desc:0 "We must risk trade with Germany, giving our ships to pass through the Mediterranean into Africa to supply their troops"
 GRE_improved_logistics2ger:0 "African Logistic Routes"
 GRE_anti_bolshevism:0 "Anti Bolshevism"
 GRE_anti_bolshevism_desc:0 "The Soviet Union is the greater thread to our regime. We must prepare for war with them"
 GRE_crush_stalin_ns22:0 "Anti Bolshevism"
 GRE_expand_operation_bolivar:0 "Expand Bolivar"
 GRE_expand_operation_bolivar_desc:0 "Argentina, a powerful country hates the British. Maybe we could try to use this hate for our own good"
 GRE_influencing_the_americas:0 "Influencing The Americas"
 GRE_influencing_the_americas_desc:0 "If only we could ally the American nations, then we would have no problem knoking the USA out of the war"
 GRE_militarized_society_desc:0 "Our society must be ready for total war. Every man should be ready to join the army at any time and die for his nation"
 GRE_Zimmermann_once_again:0 "Zimmermann Once More"
 GRE_Zimmermann_once_again_desc:0 "Mexico has a great geography we can use against the USA. We must try to ally them again, like we did in the first war. But this time, the allies cannot crack our cyphers"
 GRE_turkish_land_exchange:0 "Turkish Land Exchange"
 GRE_turkish_land_exchange_desc:0 "We can offer turkey an interesting proposal. They will offer us our rightful lands in anatolia and will get their historical claims in the caucasus"
 GRE_the_all_anti_soviet_front:0 "The All Anti-Soviet Front"
 GRE_the_all_anti_soviet_front_desc:0 "The soviet union is in a weak position, but won't yet give in. We could try to surround them from all sides, this way weakening their spirit"
 GRE_joint_occupation:0 "Joint Occupation"
 GRE_joint_occupation_desc:0 "We may choose one lord to rule our nation, but we could try to stay loyal to both the Italians and Germans"
 GRE_prevent_deception:0 "Prevent Deception"
 GRE_prevent_deception_desc:0 "Italians are too confident the british will invade in Greece and do not protect their own lands. We must try to show them otherwise"
 GRE_ita_Secured_tt:0 "We will insist Italy invests more divisions into protecting their coast"
 GRE_sabotage_uk_tt:0 "We will plant bombs in Cyprus, Malta, Giblartar, Alexandria and Palestine. All British ships stantioned there will be damaged, and a few of them completely destroyed. Many thousands of our men will die in this proccess"
 GRE_sabotage_british_navy:0 "Sabotage British Navy"
 GRE_sabotage_british_navy_desc:0 "We must destroy British supply in the Medditeranean. We must try to damage their ships to pause their supply routes"
 GRE_sabotage_facilities_tt:0 "We will sabotage nuclear power plants in all major countries we are at war with. Consequences may be huge for the global society"
 GRE_sabotage_nuclear_facilities:0 "Sabotage Nuclear Facilities"
 GRE_sabotage_nuclear_facilities_desc:0 "Sometime war is not about battle. It is about who can outlast the others. Destroying our enemies from inside seems like it is the only way to win this war"
 GRE_long_live_the_workers_government:0 "Long Live Trotsky"
 GRE_long_live_the_workers_government_desc:0 "Trotsky having survived his assasination attemp has arrived in the EU and has plan to reclaim the Soviet leadership"
 GRE_the_builder_of_the_red_army:0 "The New Red Army"
 GRE_the_builder_of_the_red_army_desc:0 "We must create a new army to fight stalin. One better than his in spirit and number. The real red army"
 GRE_reigniting_the_revolutionary_spirit:0 "Reignite The Eternal Revolution"
 GRE_reigniting_the_revolutionary_spirit_desc:0 "The spirit of the revolution has risen again. The workers demand freedom and we will give it to them"
 GRE_depoliticize_the_military:0 "Depoliticize The Military"
 GRE_depoliticize_the_military_desc:0 "There are many people in the army who earned their positions due to political connections. We must get rid of them so the army is only made out of people who deserve it"
 GRE_system_decentralization:0 "Decentralized System"
 GRE_system_decentralization_desc:0 "No man should have such power. Power shall be common between representatives from many countries"
 GRE_strengthen_heavy_industry:0 "Strengthen Heavy Industry"
 GRE_strengthen_heavy_industry_desc:0 "If we want to win the fight against Stalin, we must have a strong industry to support the war effort"
 GRE_all_power_to_the_soviets:0 "All Power To The Socialists"
 GRE_all_power_to_the_soviets_desc:0 "Every member of the KKE should have power. The fate of our nation shall be in their hands"
 GRE_regional_development:0 "Regional Development"
 GRE_regional_development_desc:0 "We must further develop the regions of our nation if we want to industrialize properly"
 GRE_international_union_of_soviet_republics:0 "International Republics"
 GRE_international_union_of_soviet_republics_desc:0 "We must prepare an international republic. Divided by nation, united by spirit"
 GRE_partly_autonomous_soviet_republics:0 "Semi Autonomus Republics"
 GRE_partly_autonomous_soviet_republics_desc:0 "If we were to leave too much free will to our subjects they would probably break away. We must try to reduce their autonomy"
 GRE_subjects_1000_tt:0 "All subjects lose 1000 autonomy points"
 GRE_strengthen_the_trade_unions:0 "Strengthen The Trade Unions"
 GRE_strengthen_the_trade_unions_desc:0 "The trade unions need more power. We must put off power our main government, and become as a democratic nation as possible, whithout being democratic"
 GRE_the_peoples_revolution:0 "The People's Revolution"
 GRE_the_peoples_revolution_desc:0 "This is not a revolution for us. This is a revolution so everyone can be free. The people should embrace it and help us achieve our dream"
 GRE_the_supreme_soviet:0 "Supreme Leadership"
 GRE_the_supreme_soviet_desc:0 "Lenin had a vision. A vision of a society of free workers. He may not be here to embrace it, but we must go down his path"
 GRE_for_the_common_good:0 "The Common Good"
 GRE_for_the_common_good_tt:0 "If we all had seperate goals, then we would not be able to be a united country. We must aim to restore a common goal, the greater good for all of us"
 GRE_common_good_tt:0 "The autonomy of our subjects will be reduced, and our allies will receive major buffs"
 GRE_victory_over_devastation:0 "Victory Over Devastation"
 GRE_victory_over_devastation_desc:0 "We must fight for the freedom of glory of our nation, no matter the cost"
 GRE_socialist_humanism:0 "Humanism"
 GRE_socialist_humanism_desc:0 "We must invest into science studies. We have started to not care about the people around us, and we must teach people otherwise"
 GRE_end_the_cult_of_stalin:0 "End The Cult Of Stalin"
 GRE_end_the_cult_of_stalin_desc:0 "It is time to end stalin's regime once and for all. He must suffer for what he did"
 GRE_revenge_for_the_exile:0 "Revenge For Their Exiles"
 GRE_revenge_for_the_exile_desc:0 "All nations trotsky went to, kicked him out. We must take revenge"
 GRE_integrade_turkey:0 "Integrade Turkey"
 GRE_integrade_turkey_desc:0 "Trotsky seeked exile in Turkey. But Kemal's government kicked him out. They must now suffer for this"
 GRE_integrade_mexico:0 "Integrade Mexico"
 GRE_integrade_mexico_desc:0 "Mexico was the last stop of Trotsky. The government let him get assasinated instead of offering protection"
 GRE_integrade_norway:0 "Integrade Norway"
 GRE_integrade_norway_desc:0 "Norway under pressure by soviet kicked Trotsky. They must suffer because they surrendered under russian pressure"
 GRE_integrade_france:0 "Integrade France"
 GRE_integrade_france_desc:0 "Trotsky went to France to seek exile. They agreed at first, but feared he would stage a coup they kicked him"
 GRE_european_soviet_union:0 "EUoSaSR" #European Union Of Socialists And Soviet Republics
 GRE_european_soviet_union_desc:0 "We must integrade stalin's territory into our empire, who rightfully owns it"
 GRE_our_roots:0 "Our Roots"
 GRE_our_roots_desc:0 "We must not abandon our history, we must stay connect with our roots and the spirit of the ancient hellinas"
 GRE_warrior_spirit_restored:0 "The Spartan Warrior Spirit"
 GRE_warrior_spirit_restored_desc:0 "The spartans were great soldiers, and fought hard to protect Greece. They had 2 kings who took only care of military and religious jobs. The Gerousia was in charge of almost everything else"
 GRE_peloponissian_War_spirit:0 "Peloponnesian War"
 GRE_peloponissian_War_spirit_desc:0 "The Peloponnesian war was the cold war of ancient greece, but it just got ... hot. Many soldiers died on it and should be honored"
 GRE_spartan_soldiers_athenian_navy:0 "Spartan-Athenian Cooperation"
 GRE_spartan_soldiers_athenian_navy_desc:0 "The spartans were strong in the land and the athenians on the sea"
 GRE_mindfullness_restored:0 "Athenian Spirit"
 GRE_mindfullness_restored_desc:0 "The athenians were the invetors of Democracy, it would be sad to not honor such a ideology"
 GRE_the_300:0 "The 300"
 GRE_the_300_desc:0 "The 300 fought hard to protect Greece from the Persian thread. They may fell in battle, but they saved most of Greece in the proccess by winning time"
 GRE_the_eterlan_spartan_spirit:0 "Impenetrable Defence"
 GRE_the_eterlan_spartan_spirit_desc:0 "The spartans fought tight together, body to body, not leaving the opportunity for the enemy to attack them. Their tactics proved to be really effective"
 GRE_the_enemies_of_sparta:0 "Enemies Of Sparta"
 GRE_the_enemies_of_sparta_desc:0 "We must crush our enemies in time, before they crush us"
 GRE_all_power_to_the_council:0 "All Power To The Gerousia"
 GRE_all_power_to_the_council_desc:0 "The Gerousia is the country that has lead us to victory, they have done a great job and they must keep doing so"
 GRE_the_superior_empire:0 "Supeious Council"
 GRE_the_superior_empire_desc:0 "The council has managed to keep us united. Gerousia has helped us succeed"
 GRE_the_first_greek_unifier:0 "The First Greek Unifer"
 GRE_the_first_greek_unifier_desc:0 "King Leonidas was the first greek to step up and try to unite Greece against the persian thread"
 GRE_the_frightful_king_of_persia:0 "Avenge Persia"
 GRE_the_frightful_king_of_persia_desc:0 "We must take revenge for King Leonida's fall"
 GRE_this_is_sparta:0 "This Is Sparta!"
 GRE_this_is_sparta_desc:0 "THIS IS SPARTA"
 GRE_athenian_scientists:0 "Athenian Advances"
 GRE_athenian_scientists_desc:0 "Athenians made a lot of great advances in both science and mostly Philosophy. A lot of what we consider common knowledge was founded by athenians"
 GRE_athenian_dockyards:0 "Athenian Dockyards"
 GRE_athenian_dockyards_desc:0 "Athenians had a great navy which we must try to restore"
 GRE_unifier_of_the_greeko_sphere:0 "Unifier Of The GrecoSpher"
 GRE_unifier_of_the_greeko_sphere_desc:0 "We must unite all Greeks by annexing Cyprus"
 GRE_courage_restored:0 "Theban Leadership"
 GRE_courage_restored_desc:0 "Thebes,even if it was a short lived empire managed to defeat both athens and sparta"
 GRE_like_the_arkades:0 "Like The Arkades"
 GRE_like_the_arkades_desc:0 "The arkades lived in mountainous terrain which made them expert mountaineers"
 GRE_pindous_climbers:0 "Climbing  Pindos"
 GRE_pindous_climbers_desc:0 "We must improve our mountain climbing skills to better adapt onto the greek terrain"
 GRE_ally_macedonians:0 "Ally Macedonians"
 GRE_ally_macedonians_desc:0 "The Macedonians were great allies of Thebes, and helped them protect themselves from their enemies"
 GRE_anti_athenian_anti_spartan:0 "Anti Athenian and Anti Spartan"
 GRE_anti_athenian_anti_spartan_desc:0 "Both Athens and Sparta have caused a lot of harm for our nation. Sparta did not allow us to expand and Athens terrorized us on our borders"
 GRE_the_sacred_band:0 "The Sacred Band"
 GRE_the_sacred_band_desc:0 "The Sacred Band were elite theban warriors who could easily defeat all enemies, like modern marines"
 GRE_theban_cavalry:0 "Theban Cavalry"
 GRE_theban_cavalry_desc:0 "The fast horses of Thebans were what made them elite and effective warriors"
 GRE_leader_of_horses:0 "Cavalry Leaders"
 GRE_leader_of_horses_desc:0 "We must connect with our history and focus on cavalry again"
 GRE_modern_horses:0 "Metal Horses"
 GRE_modern_horses_desc:0 "Horses may not be as useful in battle as they used to be. Instead we should add metal on them and make tanks"
 GRE_aerial_advantage:0 "Aerial Advantage"
 GRE_aerial_advantage_desc:0 "We must defeat our enemies by dropping fire from above"
 GRE_general_mobilization_of_thebes:0 "General Theban Mobilization"
 GRE_general_mobilization_of_thebes_desc:0 "We must mobilize all Theban men to fight for us"
 GRE_theban_logistics:0 "Theban Logistics"
 GRE_theban_logistics_desc:0 "We must invest in trucks to supply our troops"
 GRE_total_war:0 "Total War"
 GRE_total_war_desc:0 "We must prepare for total war at all costs and expand our empire"
 GRE_go_to_the_offence:0 "Focus On Offence"
 GRE_go_to_the_offence_desc:0 "We must focus on attacking our enemies and causing chaos in their lines"
 GRE_thebes_unifier_of_greece:0 "Unifier Of Greece"
 GRE_thebes_unifier_of_greece_desc:0 "Having such success in our reforms, we must say that we are the Greatest empire and unifier of Greece"
 GRE_retake_the_coast:0 "Retake The Coast"
 GRE_retake_the_coast_desc:0 "The coast of turkey was home to many greek before the persian crushed and occupied them"
 GRE_major_naval_battles:0 "Attack The Majors"
 GRE_major_naval_battles_desc:0 "With the help of the athenian navy, we can defeat the great powers!"
 GRE_athenian_justice_system:0 "Athenian Justice"
 GRE_athenian_justice_system_desc:0 "The athenians had one of the strongest justice system after the reforms of periklis"
 GRE_new_colonial_era_sa:0 "Colonialism Once More"
 GRE_new_colonial_era_sa_desc:0 "Having such a powerful navy, why not go after colonies once more?"
 GRE_new_colonial_era_af:0 "Third Greek Colonization Of Africa"
 GRE_new_colonial_era_af_desc:0 "It is time to once again expand our colonies into africa"
 GRE_new_industrial_revolution:0 "New Industrial Revolution"
 GRE_new_industrial_revolution_desc:0 "Having gained so much power, we can finally change the industry as it is"
 GRE_dominate_trade_in_aegean:0 "Dominate Aegean Trade"
 GRE_dominate_trade_in_aegean_desc:0 "We must once again dominate the trade across our sea"
 GRE_dominate_trade_in_black_sea:0 "Dominate Black Sea"
 GRE_dominate_trade_in_black_sea_desc:0 "We must regain our colonies in the black sea"
 GRE_naval_expansionism:0 "Naval Expansionism"
 GRE_naval_expansionism_desc:0 "We must further improve our navy to achieve domination"
 GRE_dominate_trade_in_adriatic:0 "Conquer The Adriatic"
 GRE_dominate_trade_in_adriatic_desc:0 "We must regain our italian colonies in the adriatic"
 GRE_conquer_med:0 "Controllers Of The Medditeranean"
 GRE_conquer_med_desc:0 "The Medditeranean was were almost all greek colonies were located. We must take back what was once ours"
 GRE_conquest_restored:0 "The Macedonian Spirit"
 GRE_conquest_restored_desc:0 "Macedonia is the greatest hellenic civilization, the one that put greece to the top"
 GRE_the_spirit_of_son:0 "Spirit Of Conquest"
 GRE_the_spirit_of_son_desc:0 "Macedonia managed to greatly expand and within a few decades dominate greece and persia"
 GRE_building_our_macedonian_army:0 "Macedonian Soldiers"
 GRE_building_our_macedonian_army_desc:0 "Macedonian soldiers receive special training, making them capable of fighting any thread with ease"
 GRE_after_turkey_already:0 "Get Down With It"
 GRE_after_turkey_already_desc:0 "Turkey is the only nation splitting us from Persia, they must be no more"
 GRE_after_balkans_west:0 "After East Balkans"
 GRE_after_balkans_west_desc:0 "We must reclaim those fake macedonians, alongside Pirous' land in the proccess"
 GRE_every_man_must_serve:0 "Every Man Must Serve"
 GRE_every_man_must_serve_desc:0 "Every man within the empire, Greek or not, should be required to join the army"
 GRE_king_of_everything:0 "A Living God"
 GRE_king_of_everything_desc:0 "Philip has managed to finally achieve his dream after all these years"
 GRE_after_allies_for_africa:0 "After Africa"
 GRE_after_allies_for_africa_desc:0 "We must take back our lands in africa, who are now controlled by the self called major powers"
 GRE_after_balkans_east:0 "Afther West Balkans"
 GRE_after_balkans_east_desc:0 "We must conquer the balkan lands, and take thrace under our full control"
 GRE_after_persia:0 "Finish The Job"
 GRE_after_persia_desc:0 "We must finish what we started"
 GRE_the_spirit_of_horse:0 "Bucephalus Spirit"
 GRE_the_spirit_of_horse_desc:0 "We must make our armies move fast, we must adopt the Blietzkrieg"
 GRE_cooperate_with_the_khan:0 "A New Khan"
 GRE_cooperate_with_the_khan_desc:0 "Making allies is important. And who is a better ally that your own son, controlling another big empire?"
 GRE_purge_untrustworthy_generals:0 "Keep Trustworthy Generals"
 GRE_purge_untrustworthy_generals_desc:0 "Philip has a lot of respect by his generals, and they could never betray him"
 GRE_macedonian_greater_economy:0 "Macedonian Silver Trade"
 GRE_macedonian_greater_economy_desc:0 "We must improve our economy by trading our natural resources, profiting in the proccess"
 GRE_recruit_the_son:0 "Recruit The Son"
 GRE_recruit_the_son_desc:0 "Alexander, a great commander. He had his first victory while still being a teenager. He achieved a lot in such a short time"
 GRE_lord_of_world:0 "Lord Of Asia"
 GRE_lord_of_world_desc:0 "Philip has officially claimed the throne of asia, saying that he will crush everyone who opposes him"
 GRE_no_need_to_be_scared:0 "No Need To Be Scared"
 GRE_no_need_to_be_scared_desc:0 "There is no need to be scared and cautious, we have secured our empire"