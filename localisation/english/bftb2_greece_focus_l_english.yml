 WRU_democratic_party_russian_long:0 "Party of Democratic Reform"
 WRU_democratic_party_russian:0 "PoDR"
 GRE_establish_the_golden_dawn:0 "Found The Golden Dawn"
 GRE_establish_the_golden_dawn_desc:0 "The Golden Dawn is a nationalistic organisation that believes in the superiority of the greek people. Even if it accepted by a lot of people, communists and immigrants hate them"
 GRE_towards_dominion_independence:0 "Greek Tanks"
 GRE_towards_dominion_independence_desc:0 "In order to claim our superiority we must have superior economy. We must developer superior tanks ready to conquer europe"
 GRE_foundations_for_an_indian_state:0 "Honor The Spartans"
 GRE_foundations_for_an_indian_state_desc:0 "The spartans were great warrior. Under leonida's rule only 300 of them defended greece for 3 days against the persion army of hundread of thousands of men giving enough time to all states to prepare"
 GRE_towards_indian_independence:0 "Alexander's Pride"
 GRE_towards_indian_independence_desc:0 "Alexander the great was the greatest general of all time. In his 33 years of life he managed to unite all of greece and conquer the whole persion empire. He is a person we should look up to"
 GRE_athens_philosophers:0 "Athenian Philosophy"
 GRE_athens_philosophers_desc:0 "The Athenians developed great ideas. Their way of thinking influenced noticably a lot modern philosophy and science"
 GRE_withdraw_from_contested_territories:0 "Greek Volunteer Army"
 GRE_withdraw_from_contested_territories_desc:0 "We must try to improve our army. We must invite any greek person willing to defend for the honor of greece"
 GRE_self_government_for_the_mediterranean:0 "Fire On Our Enemies"
 GRE_self_government_for_the_mediterranean_desc:0 "The secret recipe for greek fire has been found! We can finally make our army unstopable and destroy our enemies!"
 GRE_self_government_for_africa:0 "The Church That Rules Them All"
 GRE_self_government_for_africa_desc:0 "Saint Sofia is the most well known church in the world. It is the peak of greek architecture and one of the greatest buildings made by the not so ancient world"
 GRE_succesors_of_rome:0 "Succesors Of Rome"
 GRE_succesors_of_rome_desc:0 "A lot of countries dont recognise greece as the true successor of rome, even though it is the eastern half of the empire. We must finally prove that we are cabable to support this claim by showing them our power!"
 GRE_self_government_for_the_middle_east:0 "Memories Of 1922"
 GRE_self_government_for_the_middle_east_desc:0 "1922 was a destructive year for greece. The concept of the megali idea died forever along side thousands of great soldiers. The great powers did nothing about it, and signed a secret pact with ataturk. We will recruit more people in order to get our revenge!"
 GRE_self_government_for_the_americas:0 "Recruit Armenian Generals"
 GRE_self_government_for_the_americas_desc:0 "Armenia and we have a common enemy. Turkey. Both of us suffered a lot during the war of 1922. Armenia may no longer independently exist, but we will recruit their generals and get revenge for them!"
 GRE_self_government_for_asia:0 "Greece, Great Hellas"
 GRE_self_government_for_asia_desc:0 "Greece may have suffered a lot recntly but it is still the greatest country. We invented democracy, which is wide spread among the world. We are greek and will never surrender"
 GRE_decolonization:0 "Greatest Of All Time"
 GRE_decolonization_desc:0 "It is time to improve our national spirit and rise again. We will fight and crush our enemies, and unite the world under the greek flag either peacefully or with war"
 GRE_sell_our_country:0 "Alligning OurSelves With Major Power"
 GRE_sell_our_country_desc:0 "People may not be able to see what we are planning to do, but we will try to become loyal to other countries and improve our situation. It is a dislicked idea but it is the last thing we can do before collapsing"
 GRE_british_puppet:0 "British Puppet"
 GRE_british_puppet_desc:0 "We can learn a lot from Great Britain. We can rebuild our old glory and finally become the dominant power on the mediterranean"
 GRE_navy_like_canada:0 "A Big Navy"
 GRE_navy_like_canada_desc:0 "We must study canadian plans and learn how they develop their navy. We must try to create a big and light navy, while also being able to supply it"
 GRE_australlian_navy:0 "An Advanced Navy"
 GRE_australlian_navy_desc:0 "We must study the australlian plans and make an advanced navy. We must start a research program and build strong ships"
 GRE_request_british_ships:0 "Request British Ships"
 GRE_request_british_ships_desc:0 "Instead of starting from zero we can request a few ships from the UK, like they have sent ships to their other puppets they will also do the same"
 GRE_queen:0 "Constitutional Monarchy"
 GRE_queen_desc:0 "We invite British Princess, Elizabeth II to take over our country and lead us to new glories! As a gift we will also receive the holy lands!"
 GRE_alexandria:0 "Lighthouse Of Alexandria"
 GRE_alexandria_desc:0 "The Lighthouse of Alexandria was a really advanced and great technology for the ancient world. We must rebuild it and have it lead our navy!"
 GRE_strait_agreement:0 "Strait Region"
 GRE_strait_agreement_desc:0 "Before the dream of greater greece died forever, there was a region for the straits. Now that turkey has been remilitarised their straits, the straits are controlled by them. We want to get them under our control again!"
 GRE_protect_the_gulf:0 "Protect The Gulf"
 GRE_protect_the_gulf_desc:0 "We must protect british colonies in the middle east. There is no reason to let them waste their equipment there, we will promise to secure them!"
 GRE_greece_rules_the_waves:0 "Hellas Rules The Waves!"
 GRE_greece_rules_the_waves_desc:0 "We have gained a lot of control in the Medditeranean and have massively improved our navy. It is time to look not only on the Athenian navy, but on current super powers like Japan, USA, and England and study their tactics"
 GRE_italian_puppet:0 "Italian Puppet"
 GRE_italian_puppet_desc:0 "Italy was planning to go to war with us. We cant affor a war like that. We will just surrender ourselves in order to protect our people"
 GRE_italian_king:0 "Italian King"
 GRE_italian_king_desc:0 "Emanuele III is a great soldier-king. There is a lot we can learn by having him as our king"
 GRE_pope_final_boss:0 "Adopt Catholicism"
 GRE_pope_final_boss_desc:0 "We must accept catholicism as our true religion and allign ourselves with the pope"
 GRE_blackshorts:0 "Recruit BlackShirts"
 GRE_blackshorts_desc:0 "Blackshirts are great italian soldiers. We must recruit them to secure our nation"
 GRE_annex_albania:0 "Split Albania"
 GRE_annex_albania_desc:0 "Both Italy and us always wanted something from albania. We will come to a nagotiantion and split the country in two"
 GRE_adopt_lira:0 "Adopt The Lira"
 GRE_adopt_lira_desc:0 "The italian economy is a better situation that ours. We must adopt their currency hoping it can help us"
 GRE_metaxas-grandi_pact:0 "Metaxas - Grandi Pact"
 GRE_metaxas-grandi_pact_desc:0 "We must split yugoslavia with the italians. We must try make a secret pact to secure our claims in it"
 GRE_italian_investments_2:0 "Italian Investments"
 GRE_italian_investments_2_desc:0 "We must request Italian help to properly industrialise and improve our economy. We must modernise greece"
 GRE_old_equipment:0 "Seize Equipment"
 GRE_old_equipment_desc:0 "We must organise raids and steal equipment from our neighbors in order to fix our military situation"
 GRE_attack_yugoslavia:0 "Attack The Slavs"
 GRE_attack_yugoslavia_desc:0 "We must finally fulfill our plan and split yugoslavia, both of us will get what we deserve"
 GRE_german_puppet:0 "German Puppet"
 GRE_german_puppet_desc:0 "There is a lot we can learn for germany. We can learn how to militarise our economy, conquer more and serve our country with pride in every possible way"
 GRE_unification_of_the_exiles:0 "Long Live Griechenland"
 GRE_unification_of_the_exiles_desc:0 "We must unite all the fascists in our country under the german flag. Fascism is not an ideology but a way to live. Long Live Griechenland!"
 GRE_womens_fascist_movement:0 "Woman Fascist Movement"
 GRE_womens_fascist_movement_desc:0 "No matter if you are a woman there is a way for you to serve your country. And this is what you will do"
 GRE_the_true_tsars:0 "Hire German Scientists"
 GRE_the_true_tsars_desc:0 "Germany might be the most military advanced country. We have to invite a few scientists trying to become like them"
 GRE_national_unification:0 "National Militarism"
 GRE_national_unification_desc:0 "We must fully militarise our economy. We must devote all of it to making guns to defend our great nation"
 GRE_assasinate_mussolini:0 "Assasinate Mussolini"
 GRE_assasinate_mussolini_desc:0 "Mussolini wants to harm our country. We cant let this happen. We must send assasins to italy and depose him. Then we will install a more friendly government towards us"
 GRE_curve_up_yugoslavia:0 "Curve Up Yugoslavia"
 GRE_curve_up_yugoslavia_desc:0 "Germany, Italy, Albania, Bulgaria and Hungary all want a part of Yugoslavia. We must sign a pact and split their country between us"
 GRE_request_claim_recognition:0 "Request Claim Recognition"
 GRE_request_claim_recognition_desc:0 "We must request from germany to recognise our claims in turkish lands and help us retake it"
 GRE_smirni_or_war:0 "Smirni Or War"
 GRE_smirni_or_war_desc:0 "We want revenge for 1922. We will demand Smirni. If turkey denies, this can lead to the biggest conflict in the balkans after World War 1"
 GRE_soviet_puppet:0 "Soviet Puppet"
 GRE_soviet_puppet_desc:0 "The soviets managed to massively improve the destroyed economy of the russian empire, there is a lot we can learn from them"
 GRE_greece_ssr:0 "Join The Soviet Union"
 GRE_greece_ssr_desc:0 "Being a soviet puppet isnt enough. In order to finalise our decision we have to join the Soviet Union itself!"
 GRE_greece_ssr_industry:0 "Improve Industry"
 GRE_greece_ssr_industry_desc:0 "We must have more workers on factories, we must improve our production, we must build more factories!"
 GRE_greece_ssr_military:0 "Mass Production"
 GRE_greece_ssr_military_desc:0 "We must build more factories in order to make more guns. We must build an strong military and we will needs loads of arms!"
 GRE_greece_ssr_soviet_army:0 "Naval Tactics"
 GRE_greece_ssr_soviet_army_desc:0 "We must try and build a strong navy in order to secure our islands"
 GRE_inheritor_of_the_mantle_of_lenin:0 "Inheritor of the Mantle of Lenin"
 GRE_inheritor_of_the_mantle_of_lenin_desc:1 "Comrade Stalin has always been Lenin's closest companion and most trusted disciple. As the most faithful follower of Lenin's teachings, it is only natural that he should inherit the heavy duty of guiding the nation towards Communism as well as preparing for the inevitable global worker's revolution."
 GRE_brilliant_genius:0 "Brilliant Genius"
 GRE_brilliant_genius_desc:0 "Unquestionably the most brilliant man alive, Comrade Stalin will guide our nation to new heights of scientific development and will drive the progress of all humanity forwards in leaps and bounds."
 GRE_the_faithful_servant_of_lenin:0 "The Faithful Servant of Lenin"
 GRE_the_faithful_servant_of_lenin_desc:0 "Lenin left us with the biggest task in world history: To build a society in which all people are truly equal, a society without oppression or suffering or material want. There can be no better man to execute that vision than Comrade Stalin, who was with Lenin every step of the way and who now stands ready to deliver the promise that was made in the revolution."
 GRE_ban_excessive_hero_worship:0 "Ban Excessive Hero Worship"
 GRE_ban_excessive_hero_worship_desc:0 "There has been a trend of publishing fanciful and wildly exaggerated accounts of Comrade Stalin's private life and his childhood. However well-intentioned, these accounts are counter-revolutionary and seek to establish a cult of heroism in the minds of the Soviet people, and seeks to replace a vigorous study of the theories of Comrade Stalin with mere blind idolatry."
 GRE_leader_of_the_party_and_the_people:0 "Leader of the Party and the People"
 GRE_leader_of_the_party_and_the_people_desc:0 "Comrade Stalin has performed his heavy tasks with dilligence and skill, and enjoys the unreserved and undivided support of both the party and the people. Any hint of vanity or self-adulation is foreign to him; he is perhaps the most humble person alive."
 GRE_great_commander:0 "Great Commander"
 GRE_great_commander_desc:0 "The accomplishments of Comrade Stalin in military theory and leadership are too many to list. While the traitor Trotsky may have founded the Red Army, it was Comrade Stalin who turned it into an effective force to defend the accomplishments of the working class."
 GRE_architect_of_communism:0 "Architect of Communism"
 GRE_architect_of_communism_desc:0 "Comrade Stalin's unwavering commitment to the ideals of the revolution have enabled him to see the challenges of building Socialism in One Country. With the work towards building Socialism well underway, he can turn towards the next big step: how to move from Socialism to full Communism."
 GRE_break_free:0 "The Second Greek Independence War"
 GRE_break_free_desc:0 "Now that we have massively improved our nation, we no longer need our overlords. We can finally break free!"
 mediterranean_doctrine:0 "Mediterranean Membership"
 mediterranean_doctrine_desc:0 "We must secure the Medditeranean and expand the EU There"
 Alpine_Doctrine:0 "Alpine Membership"
 Alpine_Doctrine_desc:0 "We must secure the alps and finally break the pathetic swiss neutrallity"
 Geerman_Doctrine:0 "German Membership"
 Geerman_Doctrine_desc:0 "Germany is a really strong country and their economy is must have for the EU"
 French_Doctrine:0 "French Membership"
 French_Doctrine_desc:0 "France is a really strong and well developed country with rich history. We must have the min the EU"
 lowlands_Doctrine:0 "Lowlands Membership"
 lowlands_Doctrine_desc:0 "We must secure the lowlands and have them as members of the EU"
 iberian_Doctrine:0 "Iberian Membership"
 iberian_Doctrine_desc:0 "We must overthrow the fascists of Iberia and force them into democracy"
 british_Doctrine:0 "British Membership"
 british_Doctrine_desc:0 "The UK has a really strong navy we can use. Their membership is important"
 nordic_Doctrine:0 "Nordic Membership"
 nordic_Doctrine_desc:0 "We must secure the Arctic sea and have the nordic countries join the EU"
 balkan_Doctrine:0 "Balkan Membership"
 balkan_Doctrine_desc:0 "Balkans are a chaos, we must try to unify all the balkan people under our flag"
 black_sea_Doctrine:0 "Black Sea Membership"
 black_sea_Doctrine_desc:0 "We must secure the black sea and protect it from soviet influence by having Romania and Bulgaria join us"
 caucasus_Doctrine:0 "Caucasus Membership"
 caucasus_Doctrine_desc:0 "We must secure the caucasus from the opresive soviet union and force them to join us"
 visegrad_Doctrine:0 "Visegrad Membership"
 visegrad_Doctrine_desc:0 "We must prevent the soviets from expanding their influence in central europe and protect the countries located there"
 baltic_Doctrine:0 "Baltic Membership"
 baltic_Doctrine_desc:0 "We must liberate the baltics from the evil soviets"
 GRE_balkan_reunification:0 "Unify The Balkans"
 GRE_balkan_reunification_desc:0 "As the new regional power, it is our mission to protect the balkans and unify them"
 GRE_balkan_industrialisation:0 "Industrialisation"
 GRE_balkan_industrialisation_desc:0 "Countries in the balkans are not really reach. We must try to fix their economic problems and pay off their debts"
 GRE_create_the_balkan_central_bank:0 "Balkan Central Bank"
 GRE_create_the_balkan_central_bank_desc:0 "We must create a new central bank here in the balkans, where every balkaneer can trust and depose their money on"
 GRE_joint_budgets_on_fortifications:0 "Joint Fortification Program"
 GRE_joint_budgets_on_fortifications_desc:0 "We must secure our country from threats. We must build forts and prevent enemies from attacking us"
 GRE_connecting_our_capitals:0 "Connecting Our Capitals"
 GRE_connecting_our_capitals_desc:0 "The roads in the balkans are not exactly in a good situation. We must invest into improving them and making easier for all people to travel"
 GRE_fortifying_contentious_areas:0 "Fortify Key Areas"
 GRE_fortifying_contentious_areas_desc:0 "We must fortify key areas such as the italian and soviet border in order to prevent both countries from attacking us"
 GRE_integrated_armed_forces:0 "Integrated Armed Forces"
 GRE_integrated_armed_forces_desc:0 "We must unite our armed forces in order to increase effectiveness. All our armies have both negative and positive aspects, but we must focus on learning from the others"
 GRE_the_balkan_academy_of_science:0 "Balkan Academy Of Science"
 GRE_the_balkan_academy_of_science_desc:0 "We must share technologies, try to improve our current one and make the best equipment as possible in order to create a strong military alliance"
 GRE_uniting_balkans:0 "Free Balkans"
 GRE_uniting_balkans_desc:0 "We have saved the balkans from total collapse. We made the region better than it has ever been. We deserve to sit together on top of the world and enjoy the view!"
 GRE_the_silk_road_desc:0 "The Roman Empire was the only respected empire by the chinese. We must reform this relation and restore the silk road!"
 GRE_the_silk_road:0 "Restore The Qing"
 GRE_never_forget_alexander:0 "Like Alexander"
 GRE_never_forget_alexander_desc:0 "Ceasar always wanted to someday be like Alexander the great. He did a great job, but he died before he managed to fully fulfill his dream. Now we are here to change this!"
 GRE_integrate_the_germans:0 "Integrate The Germans"
 GRE_integrate_the_germans_desc:0 "Germans caused great chaos on our empire, using unfair tactics against us. It is time to finally intergrade them into our empire"
 GRE_unite_with_the_vikings:0 "Unite With The Vikings"
 GRE_unite_with_the_vikings_desc:0 "We must keep expanding north. We must go into new lands, and fight the vikings. We must make them a part of our empire!"
 GRE_control_crimea:0 "Crimean Question"
 GRE_control_crimea_desc:0 "We must intergrade crimea and make them officially a part of Rome!"
 GRE_secure_red_sea:0 "Secure Red Sea"
 GRE_secure_red_sea_desc:0 "We must secure the red sea from barbarians and fully control the mediterranean and the trade routes of europe"
 GRE_our_own_china:0 "Two Great Empires"
 GRE_our_own_china_desc:0 "Both the chinese and the romans have built great empires and have managed to restore the silk road. Long live the new Roman-Chinese Dynasty!"
 GRE_crush_persia:0 "Crush Persia"
 GRE_crush_persia_desc:0 "The persian empire was a great threat for ancient greece. Now that they are weak, it is time to finally crush them all!"
 GRE_way_to_india:0 "Conquer The Indian Kingdom"
 GRE_way_to_india_desc:0 "The ancient indian kingdom caused lots of causalties during alexander's the great campaigns. We must finally destroy them!"
 GRE_invade_cina:0 "Invade China"
 GRE_invade_cina_desc:0 "We must invade china and conquer the ancient chinese empire, in order to try and unite the ancient world"
 GRE_aztec_empire:0 "The Lost North American Kingdom"
 GRE_aztec_empire_desc:0 "Even though people didnt know about it back then, there was a great civilisation on the other side of the world. We must also unite with them"
 GRE_inca_empire:0 "The Lost South American Kingdom"
 GRE_inca_empire_desc:0 "The Inca Empire was the biggest ancient empire known to all the americas. We must conquer all of it!"
 GRE_singapore:0 "South East Asian Expansion"
 GRE_singapore_desc:0 "South East Asia might not be instantly connected with great ancient empires, but some of them existed there too. We must also annex these!"
 GRE_trade_leaders_of_the_world:0 "Unite The Ancient World"
 GRE_trade_leaders_of_the_world_desc:0 "Now that we have united the ancient world, we must bring back our old Athenian glory. We must rule the market of the world!"
 GRE_spread_monarchism:0 "Monarchy Back In Fashion"
 GRE_spread_monarchism_desc:0 "We must try to make monarchy popular again, and restore monarchies all over europe"
 GRE_bulgarian_uprising:0 "Bring Back Ferdinard"
 GRE_bulgarian_uprising_desc:0 "We must start our jounrey to restore monarchies by bringing back Ferdinard I for bulgaria!"
 GRE_focus_on_majors:0 "Major Monarchies"
 GRE_focus_on_majors_desc:0 "We must start influencing major countries and bring back major monarchies"
 GRE_uk_boost:0 "Cause Crisis In The UK"
 GRE_uk_boost_desc:0 "We must bring back the great king of a great nation. We must start by making democracy unpopular in the uk and cause a new crisis"
 GRE_god_save_the_king:0 "God Save The King"
 GRE_god_save_the_king_desc:0 "We must start an uprising in England in order to bring back the king. We will support the monarchists and make sure they will win"
 GRE_secure_the_uk:0 "Secure Ireland"
 GRE_secure_the_uk_desc:0 "What is the british empire without ireland ? We must bring back ireland as a part of the UK"
 GRE_annex_old_puppets:0 "Restore The Commonwealth"
 GRE_annex_old_puppets_desc:0 "The dominions must be brought back, and make the british empire great again!"
 GRE_willam_wife_holland:0 "The Queen Of Dutch"
 GRE_willam_wife_holland_desc:0 "Wilhelm and his wife have been exiled in Germany after WW1. Since Wilhelm will get the german throne, we must give the throne of his wife to the dutch"
 GRE_german_uprising:0 "Uprising In Germany"
 GRE_german_uprising_desc:0 "We must start the fight in Germany, we must stage a military coop looking to overthrow hitler's government"
 GRE_revive_kaiser:0 "Revive The Kaisereich"
 GRE_revive_kaiser_desc:0 "Wilhelm is the rightful owner of the german throne and will always be. Long live the kaiser!"
 GRE_danzig_for_guarantees:0 "Danzig For Guarantees"
 GRE_danzig_for_guarantees_desc:0 "We must give danzig back to germany. We will help them by starting nagotiations between them and poland in order to restore the german empire"
 GRE_russian_war:0 "Send Agents To Russia"
 GRE_russian_war_desc:0 "People Of Russia revolt, they dont accept the communist government anymore. The army supports their movement. All of them are on the roads, protesting against the government and noone is willing to stop them"
 GRE_russian_war_start:0 "The Second Russian Civil War"
 GRE_russian_war_start_desc:0 "It is time! The greatness of the russian empire will come back! Long live the lost tsar!"
 GRE_modernise_russia:0 "Modernise Russia"
 GRE_modernise_russia_desc:0 "We must invest into the russian Military industry, trying to create as much equipment as possible for the civil war"
 GRE_support_in_the_war:0 "Challenged The Reds"
 GRE_support_in_the_war_desc:0 "The russian people fight with pride for their nation. We must support their spirit and stage world talks supporting their movement"
 GRE_italian_monarchy:0 "Italian Monarchy"
 GRE_italian_monarchy_desc:0 "Mussolini has been proven to be useless. We no longer need him to be in power. We must bring back the soldier king!"
 GRE_cooperation:0 "Cooperation"
 GRE_cooperation_desc:0 "King george has managed to unite all the monarchies. He deserves the title of the King Of Kings"
 GRE_anexation:0 "Annexation"
 GRE_anexation_desc:0 "Now that we brough every monarchy back, we must unite them into one, under the greek one. LONG LIVE THE NEW SUPERIOR MONARCHY!"
 GRE_focus_on_minors:0 "Minor Monarchies"
 GRE_focus_on_minors_desc:0 "We must try to restore monarchies in smaller countries and try to develop them into superpowers"
 GRE_uprising_in_denmark:0 "Uprising In Denmark"
 GRE_uprising_in_denmark_desc:0 "We must bring back the king of Denmark and restore their Great Empire!"
 GRE_uprising_in_norway:0 "Uprising In Norway"
 GRE_uprising_in_norway_desc:0 "We must bring back the king of Norway and secure the arctic sea!"
 GRE_uprising_in_belgium:0 "Uprising In Belgium"
 GRE_uprising_in_belgium_desc:0 "We must bring back the king of Belgium ... and try not to commit crimes in congo"
 GRE_second_spanish_civil_war:0 "Second Spanish Civil War"
 GRE_second_spanish_civil_war_desc:0 "We must overthrow the spanish dictatorship and bring back the rightful king of spain"
 GRE_portugese_uprising:0 "Portugese Uprising"
 GRE_portugese_uprising_desc:0 "We must restore monarchy in portugal and prevent them from adopting more fascist laws!"
 GRE_befriend_our_moral_enemy:0 "Befriend Our Moral Enemy"
 GRE_befriend_our_moral_enemy_desc:0 "We and turkey have always had a hate relationship. Why not try to finally improve it?"
 GRE_adopt_islam:0 "Adopt Islam"
 GRE_adopt_islam_desc:0 "A main cause of conflict between us and turkey is our religion. We will adopt islam trying to become more like them
 GRE_ataturk_jumpscare:0 "Legacy Of Ataturk"
 GRE_ataturk_jumpscare_desc:0 "Atarurk was the greatest leader for turkey, he was a really skillful leader and an amazing figure"
 GRE_borthers_and_sisters:0 "Turkich People In The Army"
 GRE_borthers_and_sisters_desc:0 "We must invite more turkich people into the army, trying to reduce our need for manpower"
 GRE_unification_at_last:0 "Betray Our People"
 GRE_unification_at_last_desc:0 "We can finally be annexed by turkey. Our people will hate it, but at least we will finally fix our relation"
 GRE_sultanate:0 "Reforge The Ottoman Empire"
 GRE_sultanate_desc:0 "The Ottomans caused the fall of constantinople and greatly hated by our people. Why not try to reforge it then?"
 GRE_pakistan:0 "Unite With Pakistan"
 GRE_pakistan_desc:0 "Pakistan like us is an islamic country, opressed by the British. We must start a special military operation trying to conquer it"
 GRE_caliphate:0 "The Caliphate"
 GRE_caliphate_desc:0 "We must intergrade our pakistani brothers and try to reform the islamic caliphate"
 GRE_indies:0 "The Indies"
 GRE_indies_desc:0 "The indies are islamic countries surrounded by other religion, far away from their islamic brothers. It is our job to protect them"
 GRE_iberia:0 "Islamic Iberia"
 GRE_iberia_desc:0 "Many people dont think of Iberia when speaking about Islam. But Iberia was actually a part of the islamic caliphate, and it is our job to take it back!"
 GRE_islam:0 "True Islam"
 GRE_islam_desc:0 "We are loyal to islam, and we will do everything to prove it. Long live Allah!"
 GRE_balkan_reconquest:0 "Balkan Reconquest"
 GRE_balkan_reconquest_desc:0 "The Balkans have always been an important part of the ottoman empire. It is time to take them back and teach them about islam!"
 GRE_middle_east_conquest:0 "Middle East Reconquest"
 GRE_middle_east_conquest_desc:0 "The middle east has always been under our influence, but due to our latests defeats they managed to escape. It is time to drag them back!"
 GRE_persian_empire_puppet:0 "Reforge Our Alliance"
 GRE_persian_empire_puppet_desc:0 "Iran and Afghanistan have always been good friends of Turkey. It is time to take them under our sphere of influence as well"
 GRE_that_one_time_japan_wanted_to_restore_the_ottoman_empire_into_sinkiang:0 "Restore Ottoman Rule In Sinkiand"
 GRE_that_one_time_japan_wanted_to_restore_the_ottoman_empire_into_sinkiang_desc:0 "Japan had plans to install an ottoman leader in sinkiang. Instead of having the Japanese bring the ottoman empire in sinkiang, why not just do it ourselves?"
 GRE_steal_french_syria:0 "Steal French Syria"
 GRE_steal_french_syria_desc:0 "France has been in great distraction and havoc. We must take this opportunity and steal syria from them!"
 GRE_attack_britan:0 "Attack Britain"
 GRE_attack_britan_desc:0 "We must attack the UK and get back the lands they stole from us after WW1"
 GRE_ottoman_dreams_reborn:0 "Ottoman Dreams Reborn"
 GRE_ottoman_dreams_reborn_desc:0 "We have finally restored the ottoman empire. Long live the new rome!"
 GRE_annex_finish_turks_desc:0 "There is a theory that finish people actually come from Turkey during the great migration. Therefore we claim their country!"
 GRE_annex_finish_turks:0 "Annex Finish Turks"
 GRE_annex_japanese_turks:0 "Annex Japanese Turks"
 GRE_annex_japanese_turks_desc:0 "Even though most turkick people migrated west, a few moved east. There is a theory that japanese people might be turkick, so why not claim their empire?"
 GRE_venizelos_cockraoch_tt:0 "§RVenizelos Will Die§!"
 bftb_greece.856.t:0 "First Man In Space"
 bftb_greece.856.desc:0 "Greece has made an important achievment today, sending the first man in space. The global community is surprised, because of the huge turn greece has made. Long live greece I guess!"
 bftb_greece.856.a:0 "LONG LIVE GREECE!"
 GRE_space_race:0 "Win The Space Race"
 GRE_space_race_desc:0 "Sir, what do you mean Greece is sending the first man in space?"
 GRE_superpass_soviet_economy:0 "Crush Soviet Economy"
 GRE_superpass_soviet_economy_desc:0 "We must try to become better than the soviets, and crush their economy!"
 GRE_superpass_american_economy:0 "Crush American Ecnomy"
 GRE_superpass_american_economy_desc:0 "We must try to become better than the americans, and crush their economy!"
 GRE_eagle1:0 "Improve Civilian Economy"
 GRE_eagle1_desc:0 "We must try to improve our civilian economy, opening more factories and more jobs for our people"
 GRE_free_ruthenia:0 "Liberate The Kievan Rus'"
 GRE_free_ruthenia_desc:0 "The Kievan Rus' or today known as the Soviet Union was one of the greatest allies of the late Byzantine Empire. We must liberate the people of these lands"
 GRE_eagle2:0 "Improve Military Economy"
 GRE_eagle2_desc:0 "Now that we have managed to build an enormous empire, we need a bigger army in order to secure our borders. We need to increase gun production"
 GRE_caucasus:0 "Conquer The Caucasus"
 GRE_caucasus_desc:0 "Countries in the Caucasus region have a great number of resources and especially fuel, which is really important to support out army"
 GRE_eagle3:0 "Improve Naval Economy"
 GRE_eagle3_desc:0 "Our empire spreads all over the world. We must get an enormous navy in order to manage and keep it under our control"
 GRE_stan:0 "Annex The Turkestan Military Region"
 GRE_stan_desc:0 "We must expand more our lands. We will conquer the Turkestan Military Region, in order to try and get more stuff from the Soviet Union"
 GRE_alaska:0 "Expand Into Alaska"
 GRE_alaska_desc:0 "Alaska was historically a part of the Orthodox Russian Empire. We may be allies with Russia, but we want it for ourselves"
 GRE_chinese_ocean:0 "The South Pacific Resource Area"
 GRE_chinese_ocean_desc:0 "There are a lot of resources in the South Pacific area. In order to increase our power, we must become controllers of these lands"
 GRE_CSA:0 "Elysian Dreams Reborn"
 GRE_CSA_desc:0 "America is a great nation and there are a lot of territories we can take. We will still leave america be, but we will try to expand into CSA territory"
 GRE_liberate_africa:0 "Redraw The Borders Of Africa"
 GRE_liberate_africa_desc:0 "There is something wrong in africa but we arent sure what it is .... Oh, it needs more of Greece! We must change this!"
 GRE_take_the_country_via_force:0 "True Fascist Government"
 GRE_take_the_country_via_force_desc:0 "Mercouris is a man with a lot of ambitions. He wants stability and peace in Greece. We do not want that. We want to make a strong nation, a nation that will rule the world!"
 GRE_axe_and_fire_on_the_commies:0 "Communists, Join Us Or Be Destroyed!"
 GRE_axe_and_fire_on_the_commies_desc:0 "People of Greece have revolted. Communists hate our government. We will try to befriend them only once. If that doesnt work we will adopt another policy. Axe and Fire on the communists!"
 GRE_hang_the_traitors:0 "Hang The Traitors"
 GRE_hang_the_traitors_desc:0 "Generation after generation, multiple leaders had their only goal to destroy Greece. We will not accept that! We must punish them for their decisions!"
 GRE_anatolian_immigrants:0 "Anatolian Immigrants"
 GRE_anatolian_immigrants_desc:0 "It has been more than a decade since the Greek Genocide. Millions of greeks suffered death in anatolia and million others suffered after the population exchange. We will never forget that day and we will take revenge!"
 GRE_crush_the_cretan_revolt:0 "Crush The Cretan Revolt"
 GRE_crush_the_cretan_revolt_desc:0 "Cretans have revolted for the second time due to their fascist overloard. This time we will not let them break away. We will crush their attemp to abandon us before it is too late!"
 GRE_crush_the_ionian_revolt:0 "Propaganda Against The Ionian Revolt"
 GRE_crush_the_ionian_revolt_desc:0 "The people of the ionian islands have revolted against us. We must remind them their past. Last time they revolted a civil war started and destroying the civilisation of the island almost completely"
 GRE_crush_the_dodecanse_revolt:0 "Send The Army In The Dodecanese"
 GRE_crush_the_dodecanse_revolt_desc:0 "We recently unified with our Greek brothers in the dodecanese and they already fight against us. We wont accept that kind of betrayal, we will send in the army to show them what will happen to our enemies"
 GRE_feed_the_beasts_with_enemies:0 "Feed The Beasts With Our Enemies"
 GRE_feed_the_beasts_with_enemies_desc:0 "People still dont see us as a country capable of becoming as great as it once was. This is outrageous! Our army are beasts, and we will keep feeding them with rage until they are ready to devour our enemies!"
 GRE_destroy_our_political_enemies:0 "Destroy Our Political Enemies"
 GRE_destroy_our_political_enemies_desc:0 "People are still speaking against us. We cant keep accepting that. They were given the option to either join us or be destroyed. And they have decided not to compramise"
 GRE_olive_exportation:0 "Olive Exports"
 GRE_olive_exportation_desc:0 "In order to become a superpower we must rebuild our industry. Our nation is rich of olives and we will take advantage of that. We will sell them across all the world, and build a stable economy in the long run"
 GRE_metaxas_support:0 "Adopt The Theory Of The 3 Civilisations"
 GRE_metaxas_support_desc:0 "Metaxas is a great political figure. His theory of the 3 Hellenic Civilisations is something that we admire. He was a great man, and has earned himself a special place in the government"
 GRE_hunda_support:0 "The Hunda Regime"
 GRE_hunda_support_desc:0 "The Hunda supporters and we arent so different. We both have a common enemy, foreign influence. And the enemy of my enemy, is my friend"
 GRE_gd_support:0 "The Golden Dawn Volunteer Army"
 GRE_gd_support_desc:0 "The Golden Dawn will work similar with a volunteer army. Only Greek people will be able to join and fight to save their country. The people support us and we should let them join our mission!"
 GRE_where_other_lost_we_will_succeed:0 "Where Others Lost, We Succeeded"
 GRE_where_other_lost_we_will_succeed_desc:0 "For over 100 years different leaders have been fighting trying to save Greece and restore it's former glory. All of them failed. But we succeeded! We have managed to create a strong Greece that will destroy it's enemies!"
 GRE_newera:0 "A New Era"
 GRE_newera_desc:0 "With the end of the global conflict, the winning powers fight to spread their influence. The only thing we can do is that there wont be any armed conflict"
 GRE_civilwar:0 "Foreign Influnce"
 GRE_civilwar_desc:0 "Due to our important stratigic thesis, both the Soviets and the Americans want to take advantage of us. They are fighting right now for control of our nation"
 GRE_fire_the_guns_of_communism:0 "Fire The Red Guns"
 GRE_fire_the_guns_of_communism_desc:0 "The Americans has managed to stage a democratic coup. We must stop them from gaining control of our country"
 GRE_request_soviet_aid:0 "Request Soviet Aid"
 GRE_request_soviet_aid_desc:0 "The Soviet Union is one of the major communists countries. They will be more than grateful to help us with our civilwar"
 GRE_request_prc_aid:0 "Request Chinese Aid"
 GRE_request_prc_aid_desc:0 "The People's Republic Of China is another communist power. Both of us for years have been oppresed by capitalists overlords. Let's hope they will be willing to help their brother"
 GRE_join_the_eastern_block:0 "The Eastern Bloc"
 GRE_join_the_eastern_block_desc:0 "We must create a new communist alliance with our Soviet brothers. We must stand together and help each other defeat the evil capitalists"
 GRE_democracies_fight_back:0 "Democracies Fight Back"
 GRE_democracies_fight_back_desc:0 "The Soviets has managed to stage a communist coup. We must stop them from gaining control of our country"
 GRE_european_powers_support:0 "Request European Support"
 GRE_european_powers_support_desc:0 "Our democratic brothers in europe will for sure want to help us. We have to stand together in order to survive"
 GRE_wtf_is_a_kilometer:0 "Request American Support"
 GRE_wtf_is_a_kilometer_desc:0 "The Americans are the major enemy of communist countries. We will request their help in order to succesfully defeat the sick communists"
 GRE_join_nato:0 "North Antlatic Treaty Organisation"
 GRE_join_nato_desc:0 "We must create a new alliance with our democratic brothers. We must stand together and help each other in order to secure our safety"
 GRE_another_change:0 "We Ain't Commies, We Ain't Democrats"
 GRE_another_change_desc:0 "Both communists and democrats are fighting for world domination. We will not join them, we will go down our own path"
 GRE_fascists_keep_fighting:0 "Fascists Keep Fighting"
 GRE_fascists_keep_fighting_desc:0 "With the recent defeat of Japan, Italy and Germany we are the last major fascist country. We will keep fighting in order to secure our ideology"
 GRE_hellenic_identity:0 "Hellenic identity"
 GRE_hellenic_identity_desc:0 "Our hellenic identity is what makes us special. We must be proud that we are greek and we must not hide it"
 GRE_rich_greek_lifestyle:0 "Rich Greek Lifestyle"
 GRE_rich_greek_lifestyle_desc:0 "Our lifestyle is superior. Greek's have learned to enjoy their lifes and live in the moment. This is the reason a lot of people like visiting our country, and a lot of them even decide to move in here"
 GRE_new_world_order:0 "Molding The New World Order"
 GRE_new_world_order_desc:0 "The bodies have already piled so high, and it must not be for naught. We fight to create a new global status quo, and we shall keep fighting until suddenly there is no will to fight left in the world at all"
 GRE_stay_neutral:0 "Neutrallity Act"
 GRE_stay_neutral_desc:0 "In these hard days we must try to stay neutral. We must try to secure the safety and well being of our people above all"
 GRE_nagotiate_With_both_sides:0 "Approch Both Sides"
 GRE_nagotiate_With_both_sides_desc:0 "Both the Soviets and Americans have reasons to try and take advantage of us. We will send diplomats to both countries trying to guarantee our freedom"
 GRE_protected_from_foreign_influence:0 "Fortify Our Borders"
 GRE_protected_from_foreign_influence_desc:0 "We must start building more front, securing our borders and discouraging any enemy from attacking us"
 GRE_good_relations_with_neigbhours:0 "Peace With Our Neighbors"
 GRE_good_relations_with_neigbhours_desc:0 "We must keep good and balanced relation with our neighbors and try to work together. We must make sure that they wont try to backstab us"
 GRE_cold_war:0 "The Cold War"
 GRE_cold_war_desc:0 "The cold war era has officially started. The race for nuclear dominance, the space race, and influence has started"
 GRE_3_way_cold_war:0 "Fascism In The Cold War"
 GRE_3_way_cold_war_desc:0 "Fascism is the creed of the 20th century - it is an answer to the faults of rampant capitalism and the corruption of communism. Fascism is the rallying cry of a generation; a generation that has had enough of foreign bullying! A generation that has had enough of national shame! A generation that is ready to bring Greece into the New Age as a Great Power - ready to answer to any threat and any insult! Aéra!"
 GRE_workers_of_greece_unite:0 "EAM Penal Battalion"
 GRE_workers_of_greece_unite_desc:0 "The communists have managed to make our government adopt a new policy. Prisoners will be given the chance to fight and participate in the war. If we win, they will be free. If they try to surrender we have been ordered to shoot the traitors!"
 GRE_request_support_from_EDES:0 "Fund The EDES Resistance"
 GRE_request_support_from_EDES_desc:0 "With the enemy capturing our territory, more and more greeks decide to find against them. We must fund the resistance groups and re-organise them as official soldiers of Greece"
 GRE_keep_the_torch_of_liberty_lit:0 "DSE Counter Offensive"
 GRE_keep_the_torch_of_liberty_lit_desc:0 "The saboteurs have managed to harm the enemy massively. We must organise a counter offensive and kick them out of Greece before they manage to reorganise"
 GRE_organisation_x:0 "Organisation X"
 GRE_organisation_x_desc:0 "Organisation X is an organisation founded in order to protect the Kingdom. Our relations with the king might not be in the best state, but we must ally with them"
 GRE_metaxas_army:0 "Army Of The Civilisations"
 GRE_metaxas_army_desc:0 "In an interesting turn of events, Metaxas himself has decided to lead Greece in the war! He has prepared a few divisions and he is ready for combat!"
 GRE_george_coup:0 "King's George Coup"
 GRE_george_coup_desc:0 "Our king is capable of ruling Greece. Why elect a new leader democraticly while he can be the one to do it ?"
 GRE_rewrite_the_constitution:0 "Rewrite The Constituion"
 GRE_rewrite_the_constitution_desc:0 "King George in an attemp to make the government stable, has passed new laws and has declared that Greece is now a monarchy."
 GRE_join_central_powers:0 "Join The Central Powers"
 GRE_join_central_powers_desc:0 "During the First World War king Konstantine I wanted to allign Greece with the Central Powers but venizelos stopped him. Now we have the option to join them once again"
 GRE_attract_monarchist_sympathisers:0 "Attrack Monarchy Sympathisers"
 GRE_attract_monarchist_sympathisers_desc:0 "More and more countries keep abandoining their monarchies. Not all people are happy with these events. We can now attract all these people to join us"
 GRE_cavalary_battalions:0 "Cavalry Divisions"
 GRE_cavalary_battalions_desc:0 "We must train an army of Royal cavalry divisions. Cavalry will be really usefull since they can move faster and spread chaos among enemy lines"
 GRE_sent_princess_to_yugo:0 "Send Alexandra To Yugoslavia"
 GRE_sent_princess_to_yugo_desc:0 "Organising a royal wedding can be a good way to build alliances and improve the relations between countries. We will organise a royal wedding between King Peter and Princess Alexandra in order to build an alliance"
 GRE_purge_tt:0 "§RThe following characters will be purged: Themistoklis Sofoulis, Markos Vafiadis, Dimitris Glinos, Aristotle Onassis and Nikos Zachariadis§!"
 GRE_agency:0 "Invest Into The Spy Agency"
 GRE_agency_desc:0 "In order to secure our country from foreign influence we must create an intelligence agency. This agency will be in charge of capturin foreign spies that may try to influence our politics"
 GRE_mary_turkish_prince:0 "Rebuild Our Relations With Turkey"
 GRE_mary_turkish_prince_desc:0 "Turkey and Greece have always been in a lot of conflicts. The only time both countries became allies was during the second balkan war. We must make an effort to rebuild our alliance"
 GRE_greko_turkish_alliance:0 "Greco-Turkish Defence Pact"
 GRE_greko_turkish_alliance_desc:0 "Both Turkey and Greece are really important due to their strategic location. Many countries want to influence us and take something from us. We will fight together in order to have a better chance at securing our freedom"
 GRE_annex_cyprus2:0 "Enosis"
 GRE_annex_cyprus2_desc:0 "Cyprus has both rich Turkish and Greek population. Now that we are allies with turkey, we annex cyprus without worrying about an invasion"
 GRE_conflict_for_northern_epirus:0 "Conflict For Northern Epirus"
 GRE_conflict_for_northern_epirus_desc:0 "Now that we have a powerful ally, we can finally try to get our historical claims. We can finally take northern epirus"
 GRE_dodecanese_annexation:0 "Dodecanese Annexation"
 GRE_dodecanese_annexation_desc:0 "The Dodecanese are surrounded by the our army and the Turkish army. It will be a mistake if the Italians dont hand them over"
 GRE_we_against_everyone:0 "We Against Everyone"
 GRE_we_against_everyone_desc:0 "Communism, Democracy, Fascism exist within our country. All of them want to take power. We must defend our nation from any threats within our country"
 GRE_brothers_in_arms:0 "Brothers In Arms"
 GRE_brothers_in_arms_desc:0 "Our Turkish brothers have an industry superior to ours. We can trust them that in any conflict they will be willing to give us arms to fight. We must stand together"
 GRE_mary_argentinian_prince:0 "Our Brothers In South America"
 GRE_mary_argentinian_prince_desc:0 "Out of all countries, marrying a prince from Argentina sounds weird. But we are historically conected with them. The first prime minister of Argentina had actually roots from the Byzantine Empire"
 GRE_expansion_of_argentina:0 "Secure Argentina"
 GRE_expansion_of_argentina_desc:0 "We must help our brothers in Argentina expand. We have ambitions of taking over their country, and we must make sure that it will be in the best shape as possible"
 GRE_develop_argentina:0 "Develop Argentina"
 GRE_develop_argentina_desc:0 "Argentina is rich in resources. We must help them industrialise and build a strong industry"
 GRE_unite_with_arge:0 "Unite With Argentina"
 GRE_unite_with_arge_desc:0 "Argentina before gaining independence was an opressed spanish colony. Under our managment they wont be seen as a colony, but as a part of our nation"
 GRE_real_king:0 "The Otto Plot"
 GRE_real_king_desc:0 "Otto was the first king of Greece. Before King George I took power Otto was exiled. We must guarantee that King George will be known as the only and rightful King of Greece"
 GRE_marriage_in_yugo:0 "Royal Alliance With Yugoslavia"
 GRE_marriage_in_yugo_desc:0 "Now that the royal marriage in Yugoslavia has succeeded, we can try and build a strong alliance with our slavic brothers. We can invite soldiers from Yugoslav states to join our army"
 GRE_royal_guards:0 "Royal Guards"
 GRE_royal_guards_desc:0 "We must create an army of royal guards capable of securing our nation and protecting the King"
 GRE_great_purge:0 "The Great Purge Of Greece"
 GRE_great_purge_desc:0 "People in our government cant be trustworthy. There are a lot of people who would like to take power of our nation. We must purge them all before it is too late"
 GRE_utalise_the_mafia:0 "Befriend The Mafia"
 GRE_utalise_the_mafia_desc:0 "It may be like a dangerous deal, but in order to secure our nation we must build ties with the mafia. We will provide them with protection from the law and they will work for us"
 GRE_our_brothers_up_north:0 "Our Brothers In The North"
 GRE_our_brothers_up_north_desc:0 "Yugoslavia and We have always had a great relation. We fought together against the Ottomans and Bulgarians in the balkan wars, and in the Great War. We must now try to make our relation even greater"
 GRE_friends_for_centries:0 "Friends For Centries"
 GRE_friends_for_centries_desc:0 "Yugoslavia is the Greater ally we ever had. They have helped us many times, and we have done the same. We may not be officially allies, but we are the best friends to ever exist"
 GRE_the_idea_of_our_nations_united:0 "The Idea Of Our Nations United"
 GRE_the_idea_of_our_nations_united_desc:0 "We have the chance to make our alliance with Yugoslavia the greatest it will ever be. Why not accept it ?"
 GRE_towards_greater_greece:0 "Towards Greater Greece"
 GRE_towards_greater_greece_desc:0 "Now that we have an ally to protect us, we must start claiming our historical territories"
 GRE_towards_greater_serbia:0 "Towards Greater Yugoslavia"
 GRE_towards_greater_serbia_desc:0 "We must start expanding our nation, we must promise our slavic brothers that they will have their own empire"
 GRE_united_we_are_unbeatable:0 "Greece-O-Slavia"
 GRE_united_we_are_unbeatable_desc:0 "United we can be unbeatable. We must unify with Yugoslavia and build a strong and united nation"
 GRE_claim_slavic_unity:0 "Proclaim Slavic Unity"
 GRE_claim_slavic_unity_desc:0 "It is our mission to protect all the slavs. We must unify them and protect them from foreign intervention"
 GRE_local_reforms:0 "Local Reforms"
 GRE_local_reforms_desc:0 "We must please the different ethnic groups of Yugoslavia. We must make reforms that will please them"
 GRE_crush_opositions:0 "Crush Oppositions"
 GRE_crush_opositions_desc:0 "We must let the people revolt, and then destroy them once and for all"
 GRE_decentalised_yugoslavia:0 "Free The People"
 GRE_decentalised_yugoslavia_desc:0 "We must give independence to the different ethnic groups. If they have their own government they will no longer be our problem"
 GRE_polish_hungarian_federation:0 "Polish-Hungarian Federation"
 GRE_polish_hungarian_federation_desc:0 "Our spies in the UK have found plans that Churchil would idealy want to form the Balkan federation, including Poland Hungary and Czechoslovakia. We have decided to adopt this plan and try to unite those countries under Greece-O-Slavia"
 GRE_uniter_of_the_Slavs:0 "Slavic Unity"
 GRE_uniter_of_the_Slavs_desc:0 "We must protect ourselves as the protectors of Slavs, we must unite all of them and prevent anyone from attacking them again"
 GRE_our_greek_identity:0 "Byzantine Unity"
 GRE_our_greek_identity_desc:0 "We should not forget our Greek Identity. We must try to secure our historical lands as well. We must take over anatolia and Italy!"
 GRE_attack_italy:0 "Attack Italy"
 GRE_attack_italy_desc:0 "If we want to restore Byzantine legacy, into Rome we shall march!"
 GRE_way_through_europe:0 "The Industrial Heart Of Europe"
 GRE_way_through_europe_desc:0 "We must conquer the Heart Of Europe and get control over their industry. We must industrialise our country by taking over foreign industry"
 GRE_attack_asia:0 "End Conflict In China"
 GRE_attack_asia_desc:0 "Japan and China have been on war for too long. If we want this to end, we must attack them and stop them!"
 GRE_attack_merica:0 "Attack The United States"
 GRE_attack_merica_desc:0 "USA is a threat to this world. Their superior technology and their nuclear program could cause massive destruction. We stop them!"
 GRE_attack_turkey:0 "Attack Turkey"
 GRE_attack_turkey_desc:0 "If we want to restore our old Byzantine borders, we must of course attack Turkey. We must liberate Constantinople!"
 GRE_way_to_middle_east:0 "Secure Oil Reserves"
 GRE_way_to_middle_east_desc:0 "We must make sure our army will have the fuel to keep fighting. We must attack the Oil rich countries in order to control their fuel reserves"
 GRE_befriend_arabia:0 "Befriend Arabia"
 GRE_befriend_arabia_desc:0 "We have made a lot of enemies, but it is time to make Allies. We have to ally the rest of the middle east and secure the rest of the Oil reserves"
 GRE_befriend_afghans:0 "Befriend Afganistan"
 GRE_befriend_afghans_desc:0 "Afganistan will give us a possible front with China, India and the Soviets. It has really strategic importance"
 GRE_dominate_the_world:0 "Dominate The World"
 GRE_dominate_the_world_desc:0 "We are one of the strongest countries of the world. We have the ability to dominate all of it!"
 GRE_last_standing_superpower:0 "Last Superpower Standing"
 GRE_last_standing_superpower_desc:0 "We can be the strongest country. We can be the last superpower standing. We can conquer the world and unite all races!"
 GRE_fourth_reich:0 "Fourth Reich And Fourth Hellenic Civilisation"
 GRE_fourth_reich_desc:0 "The First Reich was the Holy Roman Empire. The Second Reich was the German Empire. The Third Reich is the Germany Reich. Now the Fourth is the Byzantine Empire!"
 GRE_heavy_tank:0 "Invest Into Tanks"
 GRE_heavy_tank_desc:0 "We must create an unstopable army of tanks that will be capable of protect the reich"
 GRE_sindesis:0 "Sindesis"
 GRE_sindesis_desc:0 "The Sindesis, or union with Bulgaria, is a long held goal of the Greek people. Bulgaria claiming the Third Bulgarian Empire, a product of Byzantim is a great reason to propose unification"
 GRE_demand_kurdistan:0 "Demand Kurdistan"
 GRE_demand_kurdistan_desc:0 "Kurdistan has been opressed by foreign powers for too long. We can liberate them and protect them, we can bring them under our managment"
 GRE_first_erbil_award:0 "First Erbil Award"
 GRE_first_erbil_award_desc:0 "Minorities In Iran have been opressed for too long. Crimes against Azerbaijan and Kurdistan have been commited. It is time to protect those minorities from the evil iranian government"
 GRE_fate_of_peria:0 "Fate Of Persia"
 GRE_fate_of_peria_desc:0 "It is time, to finally stop the Persians from opressing minorities and liberate the minorities!"
 GRE_second_erbil_award:0 "Second Ebril Award"
 GRE_second_erbil_award_desc:0 "We must liberate the Persian golf from the colonialist and protect the people there"
 GRE_fate_of_arabia:0 "Fate Of Arabia"
 GRE_fate_of_arabia_desc:0 "We must protect the people of Arabia from the colonialists and not allow them to opress the people living there"
 GRE_demand_north_macedonia:0 "Demand Skopje"
 GRE_demand_north_macedonia_desc:0 "Greek people less than 50 years ago fought bravely in order to liberate macedonia. The serbians stole that land from us. We demand this land back"
 GRE_reclaim_the_holylands:0 "Reclaim The Holylands"
 GRE_reclaim_the_holylands_desc:0 "The Holylands are really important for our nation. Our whole empire was based around a religion. We must try and get them back"
 GRE_holy_lands_or_war:0 "Holy Lands Or War"
 GRE_holy_lands_or_war_desc:0 "Holylands were Greek, Holylands have remained Christian, and Holylands shall be Greek from now on! If England does not cede the territory, we must prepare the Greek people for the inevitable war. Jerusaleam and the surrounding lands will return to Greece!"
 GRE_around_raj:0 "Around The Raj"
 GRE_around_raj_desc:0 "It may be a crazy plan, but in order to attack the Raj more affectively we must go around their border. We must attack the indies and make our way to india from there!"
 GRE_operation_olympos:0 "Operation Olympos"
 GRE_operation_olympos_desc:0 "We can attack Tiber, Bhutan and Nepal trying to break their neutrality. We will conquer these mountains like Alexander wanted!"
 GRE_war_with_soviets:0 "War With The Soviets"
 GRE_war_with_soviets_desc:0 "Once we hit the door, the whole structure will come down falling. We must destroy the USSR and get our lands in the Caucasus!"
 GRE_operation_hellenic_nordic_blitz:0 "Operation Hellenic Nordic Blitz"
 GRE_operation_hellenic_nordic_blitz_desc:0 "We can attack the Nordic countries in order to go around the Soviet main defence and attack them more effectively"
 GRE_reintegrade_caucausian_kingdom:0 "Reintegrady The Caucasian Kingdoms"
 GRE_reintegrade_caucausian_kingdom_desc:0 "The Caucasus have been an important part of the Byzantine empire. We will reintegrade them and make them a part of our empire again!"
 GRE_greater_byzantine_reich:0 "Greater Byzantine Reich"
 GRE_greater_byzantine_reich_desc:0 "We can unite with our German brothers and become unstoppable beasts. We will integrade every reich and every civilisation within our kingdom!"
 GRE_first_sofia_award:0 "First Sofia Award"
 GRE_first_sofia_award_desc:0 "Every country bordering Yugoslavia wants to get something from them. We must ally those countries and all manage to get our piece of land we want!"
 GRE_fate_of_yugoslavia:0 "Fate Of Yugoslavia"
 GRE_fate_of_yugoslavia_desc:0 "Yugoslavia will no longer opress the minorities there. We and our allies will be in charge of protecting these lands from now on!"
 GRE_second_sofia_award:0 "Second Sofia Award"
 GRE_second_sofia_award_desc:0 "Romania controlls lands that both Hungary and we want. We will nagotiate an alliance with Hungary, and pressure Romania to give us our claims"
 GRE_take_colonies_via_force:0 "Take The Colonies"
 GRE_take_colonies_via_force_desc:0 "We will purchase the Old German Colonies and protect them from the imperialists"
 GRE_mittelafrica:0 "Mittelafrika"
 GRE_mittelafrica_desc:0 "Germany wanted to get colonies across all of Africa. They may never managed to get them, and even lost the ones they had but we are in charge of integrading them into our reich!"
 adolfos.1.t:0 "Greek Demands"
 adolfos.1.d:0 "Greece demands Macedonia. If we dont accept, it will lead to war"
 adolfos.1.a:0 "Macedonia Will Stay Yugoslav"
 adolfos.1.b:0 "We have to accept"
 adolfos.2.t:0 "Greece Gives Us Dalmatia"
 adolfos.2.d:0 "After Greece taking over macedonia, they have decided to give us dalmatia and befriend us"
 adolfos.2.a:0 "Dalmatia Is Italian!"
 adolfos.3.t:0 "Fate Of Yugoslavia"
 adolfos.3.d:0 "Greece makes more demands, and demands the disunification of our country"
 adolfos.3.a:0 "Someday We Will Reunify"
 adolfos.3.b:0 "That has gone too far!"
 adolfos.4.t:0 "Greece And Hungary Demand Land"
 adolfos.4.d:0 "Greece And Hungary want to take land from our country"
 adolfos.4.a:0 "We will give them everything they want"
 adolfos.4.b:0 "We cant give them everything, but we will give them something"
 adolfos.4.c:0 "If they want our land, they will have to fight us!"
 adolfos.5.t:0 "Greece Sends Ultimatum"
 adolfos.5.d:0 "Greece has demanded the holy lands. If we decline, the threaten to attack us!"
 adolfos.5.a:0 "Jerusaleam Will Stay British!"
 adolfos.5.b:0 "This War Would Be Too Costly"
 adolfos.6.t:0 "Greek Demands"
 adolfos.6.d:0 "Greece demands the liberation of Kurdish People"
 adolfos.6.a:0 "We Will Give Them What They Want"
 adolfos.6.b:0 "They are asking for too much"
 adolfos.7.t:0 "Greece Makes Another Series Of Demands"
 adolfos.7.d:0 "Greece wants to disunify our nation. If we dont accept, it will mean war"
 adolfos.7.a:0 "We Have No Other Option"
 adolfos.7.b:0 "Never!"
 adolfos.8.t:0 "Greece demands all our lands!"
 adolfos.8.d:0 "Greece claims our land and demands it!"
 adolfos.8.a:0 "Someday We May Return"
 adolfos.8.b:0 "Never!"
 adolfos.9.t:0 "Greece Demands Annexation"
 adolfos.9.d:0 "Greece demads our annexation"
 adolfos.9.a:0 "We have to accept"
 adolfos.9.b:0 "We will fight!"
 adolfos.10.t:0 "Greece Demands Our Coastal Land"
 adolfos.10.d:0 "Greece demands our coast or else they will declare war on us!"
 adolfos.10.a:0 "What Can We Do?"
 adolfos.10.b:0 "Never!"
 adolfos.11.t:0 "Greece Demands Annexation"
 adolfos.11.d:0 "Greece wants to annex our country!"
 adolfos.11.a:0 "We have no choise left"
 adolfos.11.b:0 "We are warriors and we will fight!"
 adolfos.12.t:0 "Greece Demands Annexation"
 adolfos.12.d:0 "Greece wants to annex our country!"
 adolfos.12.a:0 "We have no choise left"
 adolfos.12.b:0 "We are warriors and we will fight!"
 adolfos.13.t:0 "Greece Wants To Give Our Lands To Italy"
 adolfos.13.d:0 "Greece wants to split our lands between them and Italy!"
 adolfos.13.a:0 "We cant risk a war with both countries"
 adolfos.13.b:0 "We will never surrender"
 adolfos.14.t:0 "Greece Proposes Unification?"
 adolfos.14.d:0 "Greece proposes to unify with our country"
 adolfos.14.a:0 "Together we will succeed!"
 adolfos.14.b:0 "We are allies and nothing more!"
 GRE_annex_germany_tt:0 "If they §Gaccept§!, we will get §Gcores on all of Greater German Reich and the Reichskommissariats§!"
 GRE_we_have_won:0 "Megali Idea"
 GRE_we_have_won_desc:0 "We have managed to liberate our heartland. Why get gready and demand more land ? We can invest into making a strong industry instead"
 GRE_industrial_expansion:0 "Industrial Expansion"
 GRE_industrial_expansion_desc:0 "we can start investing into our country now and become ready to face any threat!"
 GRE_unholy_alliance:0 "HellenoTurkism - An Unholy Alliance"
 GRE_unholy_alliance_desc:0 "Greeks and Turks hate each other. But we all have had great influence over the other. Why opress them when we can befriend them and request their help to build a bigger empire?"
 byz_turan:0 "Form Turan"
