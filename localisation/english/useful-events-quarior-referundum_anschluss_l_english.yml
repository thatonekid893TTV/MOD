l_english:
  useful-events-quarior-referundum_anschluss.1.title:0 "[FROM.GetNameDefCap] demand referendum for unification"
  useful-events-quarior-referundum_anschluss.1.desc:0 "[FROM.GetNameDefCap] is calling for a referendum to merge our country with theirs. What we should do?"
  useful-events-quarior-referundum_anschluss.1.a:0 "Let's organize the referendum."
  useful-events-quarior-referundum_anschluss.1.b:0 "Let's organize the referendum but favorise "favor"."
  useful-events-quarior-referundum_anschluss.1.c:0 "Let's organize the referendum but favorise "against"."
  useful-events-quarior-referundum_anschluss.1.d:0 "Let's not organize the referendum."
  useful-events-quarior-referundum_anschluss.2.t:0 "[FROM.GetNameDefCap] merge with [FROM.FROM.GetNameDef]"
  useful-events-quarior-referundum_anschluss.2.d:0 "[FROM.GetNameDefCap] vote "favor" for unification with [FROM.FROM.GetNameDef]."
  useful-events-quarior-referundum_anschluss.2.a:0 "Welcome to the nation."
  useful-events-quarior-referundum_anschluss.2.b:0 "Interesting."
  useful-events-quarior-referundum_anschluss.2.c:0 "Let's join our new nation."
  useful-events-quarior-referundum_anschluss.3.t:0 "[FROM.GetNameDefCap] against the fusion with [FROM.FROM.GetNameDef]"
  useful-events-quarior-referundum_anschluss.3.d:0 "[FROM.GetNameDefCap] vote "against" for unification with [FROM.FROM.GetNameDef]."
  useful-events-quarior-referundum_anschluss.3.a:0 "How long do they think they are in front of us?"
  useful-events-quarior-referundum_anschluss.3.b:0 "Will a war occur?"
  useful-events-quarior-referundum_anschluss.3.c:0 "Hope the peace between ours countries will continue."
  useful-events-quarior-referundum_anschluss.3.e:0 "That's shame."
  useful-events-quarior-referundum_anschluss.4.t:0 "Referendum [FROM.GetAdjective] refused"
  useful-events-quarior-referundum_anschluss.4.desc:0 "[FROM.GetAdjective] leader [FROM.GetLeader] has publicly declared that the entire country is united in their opposition to unite with us, and that the very idea of a referendum on [FROM.GetAdjective] independence is utterly absurd."
  useful-events-quarior-referundum_anschluss.4.a:0 "We shall see how united they really are."
  useful-events-quarior-referundum_anschluss.4.b:0 ""Democracy" at work."