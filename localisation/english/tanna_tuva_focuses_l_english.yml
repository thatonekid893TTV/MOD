 ABILITY_TOOLTIP_NAME:0 "$NAME|H$"

#Historical Tannu Tuva#
 The_Chairmans_Speech:0 "The Chairman's Speech"
 The_Chairmans_Speech_desc:0 "It is tradition for the leader of our nation to give out a speech for the new year. A speech of hopes and dreams, and promises of a better Tannu Tuva by outlining this year's plans."
 Unite_The_Opposition:0 "Unite The Opposition"
 Unite_The_Opposition_desc:0 "The modern regime that rules our country is now what the founders intended. Instead of a nation for Tuvans, it has just become a corrupt nation. The leaders of the country do not even represent Tuvan interests or culture. They are just minions of Stalin. That is not the Tuvan way! We must unite the opposition to overthrow the corrupt leadership!"
 Destory_The_Opposition:0 "Destroy The Opposition"
 Destory_The_Opposition_desc:0 "The opposition calls themselves the true representatives of Tuvans. But they know nothing about how the modern world works. We seem to be Stalin's minions as we have no choice. The only thing guaranteeing our nation's existence is Stalin being nice to us. We should keep it that way and crush the opposition before they ruin things further."
 Frame_Dazhy:0 "Frame Dazhy"
 Frame_Dazhy_desc:0 "It is widely known that Day is the leader of the opposition. Sending Dazhy to be punished will lower the morale of other opposition members protecting our government."
 Execute_The_Opposition:0 "Execute The Opposition"
 Execute_The_Opposition_desc:0 "We cannot risk the opposition rising up again. The only solution would be to execute them."
 Inform_The_Public:0 "Inform The Public"
 Inform_The_Public_desc:0 "We must inform the public of the opposition crimes against the state!"
 Tokas_Tannu_Tuva:0 "Toka's Tannu Tuva"
 Tokas_Tannu_Tuva_desc:0 "Now the opposition has been defeated, and nothing stands in the way of Toka's leadership, we can shape the nation as we see fit. We can now shape Tannu Tuva in Toka's eyes."
 The_Tuvan_Five_Year_Plan:0 "The Tuvan Five Year Plan"
 The_Tuvan_Five_Year_Plan_desc:0 "What led to the Soviet Union's industrial might? The Five Year Plans did! We should attempt to utilize this strategy to reform and improve our nation."
 Issue_The_Aksa:0 "Issue The Aksa"
 Issue_The_Aksa_desc:0 "Our currency is worthless. Many parts of our nation still use bartering to buy and sell products. To fix this issue of a hyperinflated currency, we should issue a new currency. Our old one was beyond saving anyways."
 Industrilizing_The_Land:0 "Industrializing The Land"
 Industrilizing_The_Land_desc:0 "Tannu Tuva has always been just forests and plains. Under Toka's leadership, we are now able to industrialize our land. Industrialization will be one of the first steps in improving and modernizing Tannu Tuva."
 Achnoledge_Collectivizations_Failures:0 "Acknowledge Collectivization's Failures"
 Acknowledge_Collectivization_Failures_desc:0 "When the Stalinist first came to power after Kuular, the state issued multiple collectivization policies. These policies were not successful and were an utter disaster. This has shown us that Tannu Tuva is not ready for a typical transition towards collectivism. Let us acknowledge the failures of it and find something more suitable for the nation."
 Monetize_Horses:0 "Monetize the Horse Industry"
 Monetize_Horses_desc:0 "Tannu Tuva does not have much of a proper industry. However, our people are experts in calvary. Many armies of the world still use cavalry in their units and logistics. We can use this to our advantage and monetize our expertise on horses."
 Calvary_Army:0 "Calvary Army"
 Calvary_Army_desc:0 "With our expertise with horses, we can train our own calvary army. Although we will lack proper infantry, that can be made up through our expertise backed calvary army."
 Second_Attempt_At_Collectivization:0 "Second Attempt at Collectivization"
 Second_Attempt_At_Collectivization_desc:0 "Although the first attempt at collectivization was a complete disaster, we have learned from our mistakes. We can now properly carry out collectivization in Tannu Tuva. However, with the trauma from the first attempt, the people's trauma from the first attempt will be brought back."
 Open_More_Factories:0 "Industrial Investments"
 Open_More_Factories_desc:0 "If we are to collectivize the nation, we need some sort of industrial base. Investing and opening more factories will get us started."
 Asbestos_Manufacturing_Plant:0 "Sevi Asbestos Factory"
 Asbestos_Manufacturing_Plant_desc:0 "In the 1920s, the government closed Sevi Asbestos Factory due to the dangerous nature of asbestos. However, many people in our country are in need of such a material. We shall reopen the factory. The factory can serve our consumer base and our troops."
 Opening_Mines:0 "Mining Investments"
 Opening_Mines_desc:0 "Tannu Tuva has many mountains which have many resources. With a few investments in mining, we should be able to extract those resources."
 Controlling_Tuvan_Culture:0 "Controlling Tuvan Culture"
 Controlling_Tuvan_Culture_desc:0 "Toka wishes to eventually make Tannu Tuva a Soviet country. However, the current culture of the Tuvans does not allow for that at the moment. We must control Tuvan culture and influence it in ways so it fits our plans."
 Enforce_Collectivization_Policies:0 "Enforce The Collectivization Policies"
 Enforce_Collectivization_Policies_desc:0 "When we first attempted collectivization in Tannu Tuva, we failed horribly because it was not enforced. We must not make the same mistake again. Collectivization will bear sweet fruits when it is done right and enforced."
 Build_Up_The_Towns:0 "Investments in Towns"
 Build_Up_The_Towns_desc:0 "We cannot build an industry in Tannu Tuva without towns. Our investment in the construction of new villages and towns will certainly boost our industrial buildup."
 Build_Up_Local_Infantructure:0 "Investments in Infrastructure"
 Build_Up_Local_Infantructure_desc:0 "Our nation lacks the proper infrastructure to fuel industrial growth. An investment in our infrastructure will certainly help."
 Open_Kyzl_University:0 "Kyzyl University"
 Open_Kyzl_University_desc:0 "The opening of Kyzyl University will allows us to educate our citizens to a much higher degree. It will also give us a place for our best and brightest minds to come together and work to fuel the technological advancements of Tuvan society."
 Controlling_Tuvan_Polotics:0 "Controlling Tuvan Politics"
 Controlling_Tuvan_Polotics_desc:0 "Although Tannu Tuva is a communist nation, there are many non-communists elements from Tuvan society that play in its politics. If we are to make Tannu Tuva into a true communist nation, we must control and tame these elements."
 Das_Dug_Mountain_Despute_focus:0 "Das-Dug Mountain Despute"
 Das_Dug_Mountain_Despute_focus_desc:0 "Ever since the fall of the Qing Dynasty in China, Mongolia and Tannu Tuva have always disputed over Das-Dug Mountain. Mongolia argues that it falls under their rule by citing the old Qing borders. However, ever since the Russian Civil War, it had been under our rule. We must settle this issue if we are to coexist peacefully."
 The_Red_Capital:0 "The Red Capital"
 The_Red_Capital_desc:0 "In the early days of the nation, the nation's capital was renamed to Kyzyl, meaning red. With this name, our capital should be the shining example of Tuvan communism."
 Government_Owned_Munitions_Plan:0 "Government Owned Munitions Plants"
 Government_Owned_Munitions_Plan_desc:0 "We shall open a munitions plant in our capital to give our people jobs and supply our army with weapons."
 Open_Government_Offices:0 "Investing in Government Offices"
 Open_Government_Offices_desc:0 "Tannu Tuva has always had a weak government. This has led to a number of administrative issues in the country hindering our progress. We should invest in government offices to resolve this issue."
 The_Postal_System_Rework:0 "Postal System Investments"
 The_Postal_System_Rework_desc:0 "How are we to supply our armies if we cannot even manage to supply ourselves? Tannu Tuva is rather disconnected due to the lack of a central postal network. A few investments into the postal system will surely resolve this issue."
 Tuvan_Airways:0 "Tuvan Airlines"
 Tuvan_Airways_desc:0 "With the invention of the airplane, it soon led to the rise of airlines. The Siberian region lacks any air transportation. We can take advantage of this and open our own."
 Ban_Religion:0 "Ban Religion"
 Ban_Religion_desc:0 "Religion plays a major role in Tuvan politics. If we are to carry out our goals of making Tannu Tuva into a communist state, we must ban religion."
 Erase_The_Nomad_Culture:0 "Erase the Nomad Culture"
 Erase_The_Nomad_Culture_desc:0 "Nomadism has been a huge part of Tuvan culture for generations. However, in this industrial world, nomadic ways just drag us down. We must erase this aspect of Tuvan culture if we are to industrialize and commit the nation to the communist revolution."
 Modify_Tuvan_Culture:0 "Modify Tuvan Culture"
 Modify_Tuvan_Culture_desc:0 "Although nomadism is affecting our ability to industrialize, we simply cannot erase such a large aspect of Tuvan culture. The reaction from our people will not be kind. Instead, we should find a compromise to preserve as much of Tuvan culture as we can, while not holding us back from industrializing."
 State_Supervised_Religion:0 "State Supervised Religion"
 State_Supervised_Religion_desc:0 "Religion plays a major role in Tuvan politics and culture. Simply banning religion will result in widespread dissent from the people. We can come to a compromise by allowing religion under state supervision. This will allow us to ensure that religious figures do not influence the political landscape."
 The_Tuvan_Youth:0 "Indoctrinate the Tuvan Youth"
 The_Tuvan_Youth_desc:0 "It is very clear that the older generation, who remember the days of the Qing and Uryankhay Krai are not likely to support the revolution. However, the youth are more likely to believe in the revolution. We shall inform them of the great communist revolution by indoctrinating them."
 Invite_The_NKVD:0 "Invite the NKVD"
 Invite_The_NKVD_desc:0 "If we are to truly control Tuvan politics, we need to ensure there are no other opposition groups within the nation. We should invite the NKVD and use their expertise in uncovering traitors to the revolution."
 State_Issued_Propoganda:0 "Propaganda"
 State_Issued_Propoganda_desc:0 "If we are to convince the people that the communist revolution is truly great and worth supporting, we must spread massive amounts of propaganda."
 For_The_Revolution:0 "For the Revolution!"
 For_The_Revolution_desc:0 "It is the duty of a Tuvan to support the revolution."
 Sovietization:0 "Sovietization"
 Sovietization_desc:0 "Now that we have undergone the hardships of transforming Tannu Tuva from a backwards nomad nation into a fully functioning communist nation! Now that we have reached this state, we can begin to start Sovietization and become a model of the great Soviet ways."
 Rewrite_The_Constitution:0 "Rewrite the Constitution"
 Rewrite_The_Constitution_desc:0 "If we want to maintain our success we would rewrite our constitution."
 Join_The_USSR:0 "Join the Soviet Union"
 Join_The_USSR_desc:0 "Although joining the Soviet Union will not benefit us economically, it would help us politically. Tannu Tuva is its own state and the people fear joining Mongolia will lead to the eradication of the Tuvan way of life. Joining the Soviet Union will just guarantee that Tuvan culture is safe."
 Autonomy_In_The_USSR:0 "Autonomy in the Soviet Union"
 Autonomy_In_The_USSR_desc:0 "We should join the Soviet Union as an autonomous oblast to protect our people. Even with our new industry and modernized army, we as a nation stand no chance against other countries. We must find a way to protect ourselves."
 Advise_Mongolia_To_Do_The_Same:0 "Mongolia Proposal"
 Advise_Mongolia_To_Do_The_Same_desc:0 "Integration into the Soviet Union has done wonders for the Tuvan economy and people. We should advise our Mongolian brothers to integrate themselves to enjoy this success too."
 Uranium_Deposits:0 "Uranium Deposits"
 Uranium_Deposits_desc:0 "The top scientists of the world theorize a bomb of godly destruction is possible with the use of a material called Uranium. We have discovered Uranium in our nation, we should use it to help ourselves and allies. Such weapons of godly destruction must be used for the communist revolution."
 The_Sacred_War:0 "Join the Great Patriotic War"
 The_Sacred_War_desc:0 "Germany has invaded the Soviet Union in a war of annihilation. They seek to destroy communism forever. We must prevent this, no matter the costs."
 Donate_Gold_Reserves:0 "Donate Gold Reserves"
 Donate_Gold_Reserves_desc:0 "The national bank of Tannu Tuva has around 20 million rubles of gold, although it is not a lot, it will surely aid our Soviet comrades in their war effort."
 Extract_Gold:0 "Extract Gold"
 Extract_Gold_desc:0 "Our nation has many mountains that have gold. We must extract this gold to fuel the Soviet Union's war effort!"
 Rise_Tuvans:0 "Rise Tuvan Workers"
 Rise_Tuvans_desc:0 "In this war of annihilation, it is the people that protect the revolution. All Tuvans must rise to ensure our survival and victory!"
 The_Pride_Of_Tuvan_Calvary:0 "The Glory of Tuvan Calvary"
 The_Pride_Of_Tuvan_Calvary_desc:0 "Tuvans have had a long history of mastery with calvary. Let us utilize our strengths to destroy the enemy."
 Miitary_Factories:0 "Militarize the Industry"
 Miitary_Factories_desc:0 "If we are to fight and win this war of annihilation, we need guns. Let us militarize our nation's industry to fill the demand for weapons."
 Licensensing_Manufacturing:0 "Licensing Manufacturing"
 Licensensing_Manufacturing_desc:0 "We do not have the technical capabilities or ingenuity to develop our own weapons. However, our allies have. All we need to do now is just produce their weapons to equip our armies and send the surplus back to our allies."
 Reconstruction:0 "Recovering From the War"
 Reconstruction_desc:0 "The Germans have destroyed a lot of the Soviet Union and our allies. They destroyed our homes, schools, cities, towns, infrastructure, almost everything. And the fighting reduced that ruble to almost nothing. We must rebuild back to ensure we shall never be harmed again!"
 Aid_The_Republicans:0 "Aid the Republicans"
 Aid_The_Republicans_descs:0 "Our comrades on the Iberian peninsula fight against their fascist counterparts. We must aid them in their cause of establishing communism there."
 
#Alternative Communist Tannu Tuva#
 Dazhys_Vision:0 "Dazhy's Vision"
 Dazhys_Vision_desc:0 "Dazhy's vision is one that truly reflects the Tuvan people. He envisions a communist nation where the Tuvan people can practice culture while enjoying the benefits of a modified communism. A communist nation that best treats the people."
 The_Stalinists_Fate:0 "The Stalinist's Fate"
 The_Stalinists_Fate_desc:0 "The Stalinist's wanted to turn Tannu Tuva into a model of the Soviet Union. That was not right for the people and it subjected them to immense trauma. The Stalinists did not serve the Tuvan people, they were just taking orders from Stalin. They are traitors to the state and our people! They must be punished!"
 Protect_The_Monestaries:0 "Protect the Monasteries"
 Protect_The_Monestaries_desc:0 "During the terrible reign of the Stalinist regime. many religious aspects of Tuvan culture were destroyed. We must protect what is left by protecting the largest part of Tuvan culture, religion. Let us protect the remaining monasteries."
 Kuular_Donduks_Dream:0 "Kuular's Tuvan Dream"
 Kuular_Donduks_Dream_desc:0 "Kuular's dream for Tannu Tuva was to establish a communist state that reflected the fundamental principles of Tuvan culture. He wanted to keep nomadism and religion alive in the country. However, he was promptly overthrown and executed by Stalin's minions. We must make Kuular's dream a reality!"
 Make_Buddahism_The_State_Religion:0 "State Religion"
 Make_Buddahism_The_State_Religion_desc:0 "To bring Kuular's dream to reality, we must enforce the religion aspect of Tuvan culture. We shall make Buddhism the state religion."
 Tuvan_Nomadism:0 "Tuvan Nomadism"
 Tuvan_Nomadism_desc:0 "To bring Kuular's dream to reality, we must enforce the nomadism aspect of Tuvan culture.. We shall do this by respecting the nomads who roam our lands"
 Organized_Nomadic_Groups:0 "Organize the Nomads"
 Organized_Nomadic_Groups_desc:0 "There are many Tuvan tribes within our nation. We should record and document these tribes to evaluate the true population of our nation."
 Promot_Settlements:0 "Promote Settling"
 Promot_Settlements_desc:0 "Although many Tuvans would rather be nomads, some of them wish to settle down. We should promote settling down as it allows the nation to industrialize."
 Work_With_The_Rebels:0 "Work with the Rebels"
 Work_With_The_Rebels_desc:0 "In the early days of the communist government, many people opposed the changes the government pushed out. We should work with these rebel groups to make amends and bring stability to the nation."
 Tuvan_Towns:0 "Tuvan Towns"
 Tuvan_Towns_desc:0 "To grow our nation will need centers of industry. Building towns for our people to live in will allow us to industrialize further and quicker."
 Establish_A_State_Bank:0 "Establish a State Bank"
 Establish_A_State_Bank_desc:0 "The Tuvan government has had a weak control over the nation due to our worthless currency. Reforming our currency should give us more control over the nation."
 Preserve_Our_Culture:0 "Preserve Our Culture"
 Preserve_Our_Culture_desc:0 "Our culture has always been oppressed, whether it be the Mongols, the Russians, or Chinese, it is time to actually make a stand. We must protect our way of life!"
 Budishst_Religious_Schools:0 "Buddhist Schools"
 Budishst_Religious_Schools_desc:0 "The only centers of education in our country are Buddahist monasteries and temples. The monks at these institutions know how to read and write and often teach it to the neighbors. We should take advantage and standardize this practice across the country."
 Horse_Industry:0 "Horse Industry"
 Horse_Industry_desc:0 "Tuvans have always been known for their mastery in cavalry. We can monetize this."
 Moving_Schools:0 "Moving Schools"
 Moving_Schools_desc:0 "Although we now have an education system, many Tuvans still practice nomadism or do not live near an education center. Creating and funding moving schools will allow greater accessibility to education."
 Basic_Tuvan_Industry:0 "Basic Industry"
 Basic_Tuvan_Industry_desc:0 "We now have the bases to start industrializing our country. Let us begin industrializing."
 Busshadhist_Tuvan_University:0 "Buddhist Tuvan University"
 Busshadhist_Tuvan_University_desc:0 "With the standardization of using Buddahist temples and monasteries as centers of education, we can now expand some of them to include universal education. Potentially, these places could be places of breakthrough."
 Send_Students_Abroad:0 "Send Students Abroad"
 Send_Students_Abroad_desc:0 "Tannu Tuva lacks any real high education and we have a very small group of highly educated individuals. We shall solve this issue by sending students abroad to other nations. When they return, they can aid their homeland with the knowledge they have received."
 Make_Ammends_To_Moscow:0 "Make Amends to Moscow"
 Make_Ammends_To_Moscow_desc:0 "The Soviet Union has always been of strategic importance to Tannu Tuva because they guaranteed our independence. However, our actions lately have deeply offended Moscow, we should look into making amends with the Soviet Union. The last thing we want is for a Soviet invasion."
 Soviet_Investments:0 "Soviet Investments"
 Soviet_Investments_desc:0 "Companies in the Soviet Union are looking to expand. We should invite them into our country."
 Westernization:0 "Westernization"
 Westernization_desc:0 "The West seems to be more promising, economically and politically. We should look into building and improving our relations with the west."
 Invite_Western_Financial_Investments:0 "Invite Western Financial Investments"
 Invite_Western_Financial_Investments_desc:0 "Tannu Tuva can offer raw resources and cheap labor to Western companies. We should take advantage of this and invite them into our country. It could expand our industry."
 Tuvan_Calvary_Army:0 "Tuvan Cavalry Army"
 Tuvan_Calvary_Army_desc:0 "Tuvans have always been master of horses. We should invest into our cavalry divisions and takes advantage of our expertise."
 Weapons_Development:0 "Weapons Development"
 Weapons_Development_desc:0 "Our nation's army lacks any real industry base to supply its army. We need to develop and manufacture weapons locally so we are not dependent on outside aid."
 Tuvan_Mining_Cooperation:0 "Tuvan Mining Cooperation"
 Tuvan_Mining_Cooperation_desc:0 "Tannu Tuva is rich with natural resources, we should take advantage of this and sell them to the global market."
 Tuvan_Defense_Plan:0 "Tuvan Defense Plan"
 Tuvan_Defense_Plan_desc:0 "Our top military experts have advised that we develop a defense plan. With the Soviets to the north and the Mongolians to the stand, we stand no real chance in defending ourselves. We might have a chance with this plan though."
 Opressors_From_The_North:0 "Fortify the Northern Border"
 Opressors_From_The_North_desc:0 "To the north lies the Soviet Union, the largest threat to our independence. In case of an invasion we should be prepared."
 Cowards_From_To_South:0 "Fortify the Southern Border"
 Cowards_From_To_South_desc:0 "To the south lies Mongolia and they are under heavy influence from the Russians. If we are to defend ourselves we cannot leave our flank open."
 Conservitism_Our_Savior:0 "Conservatism, Our Savior"
 Conservitism_Our_Savior_desc:0 "Liberals in our country are calling for change. However, these changes could destabilize and harm the nation we worked so hard to build and protect. Why should we listen to them when conservatism has been protecting us?"
 Traditional_Warfare:0 "Reinforcing Traditional Warfare"
 Traditional_Warfare_desc:0 "We are already good at fighting in a particular way. Why bother changing it?"
 Dazhy_Knows_Best:0 "Dazhy Knows Best"
 Dazhy_Knows_Best_desc:0 "Our glorious leader Dazhy knows what is best for Tannu Tuva! We should listen to every word he has to say."
 Closed_Nation:0 "Closed Nation"
 Closed_Nation_desc:0 "We cannot afford exporting precious resources, we must use them for ourselves."
 Liberate_Our_Mongolian_Brothers:0 "Liberate our Mongolian Brothers"
 Liberate_Our_Mongolian_Brothers_desc:0 "Mongolia is under heavy influence from the Soviet Union. They are being forced to do things the European way and the Soviets are just wiping our Mongolian culture. This must not be tolerated any more. We need to take action and save our Mongolian brothers."
 A_State_For_Tuvans:0 "Liberalism, Our Savior"
 A_State_For_Tuvans_desc:0 "The conservatives argue that our ideas are dangerous to the nation and the people. They are simply wrong. We must adapt to the changing world or else we will cease to exist as a nation."
 Listen_To_The_New_Generation:0 "Listen to the New Generation"
 Listen_To_The_New_Generation_desc:0 "The new generation of Tuvans are calling for democratic reforms. If we are to make a state or Tuvans, our people should get a say in the government."
 Democracy:0 "Democratic Reforms"
 Democracy_desc:0 "If we want to be democratic then we must push reforms that model the reforms of other democratic nations."
 Capitalism:0 "Economic Greed"
 Capitalism_desc:0 "Capitalism relies on greed. If we are to grow our economy like other democratic nations, we must accept capitalism. It will motivate our people to earn as much money as possible, driving economic growth."
 Open_elections:0 "Democratic Elections"
 Open_elections_desc:0 "Can't have a democracy without elections."
 Promot_Free_Speech:0 "The Right of Free Speech"
 Promot_Free_Speech_desc:0 "If we are too listen to our people's concerns and needs, we must allow criticism to take place. With the criticism we receive, the government can fix those issues."
 Import_Books:0 "Import Books"
 Import_Books_desc:0 "Importing books will allow us to westernize quicker."
 Promote_Buisnesses:0 "Economic Incentives"
 Promote_Buisnesses_desc:0 "We should give out incentives to promote economic and industrial growth."
 Join_The_Allies:0 "Join the Allies"
 Join_The_Allies_desc:0 "Now that we have become a complete democracy, we are now ready to take our seat among the other democracies."
 Strike_The_Oppressors:0 "Strike the Oppressors"
 Strike_The_Oppressors_desc:0 "Without new democratic allies the Soviet Union is no longer a threat to our people and our nation. We shall strike back for the crimes they have committed against us!"
 Expand_Tuv_Corp:0 "Expand Tuva Corp"
 Expand_Tuv_Corp_desc:0 "Tuv Corp was established as a government owned mining company that exported many precious resources. We should expand the company to increase our exports and profits."
 Match_The_Gold_Standard:0 "Match the Gold Standard"
 Match_The_Gold_Standard_desc:0 "The Tuvan currency has always been troublesome due to its lack of value. Matching our currency with a gold standard will stabilize the currency."

#Unified Siberia#
 A_Siberian_State:0 "The Sibirskoye Oblastni Chestvo Idea"
 A_Siberian_State_desc:0 "Sibirskoye Oblastnichestvo was an idea of a unified Siberia that originated during the Russian Civil War. Although there is very little hope of conquering Siberia to form a unified state, it is possible if we play our hands right."
 Encourage_Siberian_Immigration:0 "Encourage Siberian Immigration"
 Encourage_Siberian_Immigration_desc:0 "If we are to claim ourselves to be the unifier of Siberia, we need some legitimacy. Promoting Siberian immigration and turning ourselves into a Siberian nation should be sufficient."
 Siberian_People_Propoganda:0 "Siberian Propaganda"
 Siberian_People_Propoganda_desc:0 "Propaganda always convinces people. This time we can use it to convince them that our government is truly a Siberian government."
 For_Siberians:0 "For Siberians"
 For_Siberians_desc:0 "With our efforts to legitimize ourselves as the Siberian government, we can now truly claim to be a nation for Siberians."
 Under_One_Banner:0 "Under the Siberian Flag"
 Under_One_Banner_desc:0 "If we truly proclaim ourselves as the Siberian government, we need to rule under the Siberian flag. All Siberians shall be unified under the green and white Siberian flag."
 Siberians_Under_The_Tuvan_Flag:0 "Under the Tuvan Flag"
 Siberians_Under_The_Tuvan_Flag_desc:0 "Although we may have a significant Siberian population, we must remember that our nation was created for Tuvans. We shall rule over Siberians under the Tuvan flag."
 Rile_Sibera:0 "Siberians"
 Rile_Sibera_desc:0 "If we are to unify all Siberian people, we need to rally them and ensure they come together."
 Rile_The_Urals:0 "Uralian Siberians"
 Rile_The_Urals_desc:0 "Although the Urals are far from Siberia proper, many Siberians still live there. We need them to come together if we are to unify all Siberian people."
 Rile_The_Far_East:0 "Far Eastern Siberians"
 Rile_The_Far_East_desc:0 "Siberians are also in the Far East, we also need them to come together if we are to unify Siberia."
 Vladivostock:0 "The Vladivostok Issue"
 Vladivostock_desc:0 "Many Siberians live in the region of Vladivostok, however so do many Russians. With extra time the Siberians and Russians of Vladivostok could come together."
 Negotiate_With_The_Soviets:0 "The Siberian Conference"
 Negotiate_With_The_Soviets_desc:0 "Now that we have brought all the Siberian people together, we can now negotiate with the Soviet Union about the transfer of these lands."
 Rile_Central_Asia:0 "Central Asians"
 Rile_Central_Asia_desc:0 "Thousands of years ago, it was rumored that the people of Turkestan were once united. Maybe we can bring this idea to fruition and unify all Central Asian people."
 Strike:0 "The Siberian Liberation War"
 Strike_desc:0 "The Soviets will never let the Siberians unite into a nation, our only option is to strike."
 The_People_Republic_of_Siberia:0 "The Unified State of Siberia"
 The_People_Republic_of_Siberia_desc:0 "Now that Siberia has been unified we can declare the Unified State of Siberia."
 Contructing_The_Siberian_Nation:0 "Constructing the Siberian Nation"
 Contructing_The_Siberian_Nation_desc:0 "Now that the Siberian people are unified, we can now grow Siberia into an industrial powerhouse."
 Uralian_Mines:0 "Uralian Mines"
 Uralian_Mines_desc:0 "The Ural Mountains are rich in resources, we should exploit them."
 Sverdlovck_Factories:0 "Sverdlovsk Industrial Complex"
 Sverdlovck_Factories_desc:0 "The Soviet Union had built a small industrial complex in Sverdlovsk. We should expand the industrial complex to grow our industry."
 Cheyabinsk_Military_Factories:0 "Chelyabinsk Industrial Complex"
 Cheyabinsk_Military_Factories_desc:0 "Chelyabinsk is a small town that has a small industrial base. We should expand it and build an arms complex to supply our armies."
 Tobolsk_Hydroelectrical_Dam:0 "Tobolsk Hydroelectric Dam"
 Tobolsk_Hydroelectrical_Dam_desc:0 "Tobolsk is a town on the banks of a river. Constructing a hydroelectric dam will provide the local area with electricity boosting our industrial growth."
 Siberian_Forests:0 "Siberian Forests"
 Siberian_Forests_desc:0 "Siberia is home to large forestSs rich with a diverse amount of trees. We should take advantage of this economic opportunity and invest in the timber industry."
 Novosibirsk_Forestry_Industry:0 "Novosibirsk Timber Complex"
 Novosibirsk_Forestry_Industry_desc:0 "Novosibirsk is a small city in Western Siberia. It is surrounded by small towns and villages that are not able to manage the export of timber. However, Novosibirsk is large enough to facilitate such things. We should invest in the small cities industrial capacity."
 Irkutsk_Regional_Center:0 "Irkutsk Regional Center"
 Irkutsk_Regional_Center_desc:0 "Making a city a hub will further boost our industrial capacity."
 Bratsk_Investments:0 "Bratsk Investments"
 Bratsk_Investments_desc:0 "Bratsk is another small city with a small industry. We should invest in its industry to facilitate its growth."
 Far_Eastern_Education:0 "Far Eastern Education"
 Far_Eastern_Education_desc:0 "The Far East is barren and empty with almost no schools. We should invest in the Far Eastern education system and expand it."
 Expand_The_Vladivostock_Ship_Yards:0 "Expand The Vladivostok Shipyards"
 Expand_The_Vladivostock_Ship_Yards_desc:0 "Vladivostok already has a few shipyards built by the Soviets. We should consider expanding these shipyards if we are to build a Siberian fleet."
 Yakutsk_Diamond_Mines:0 "Yakutsk Diamond Mines"
 Yakutsk_Diamond_Mines_desc:0 "According to Soviet expeditions and geologists, Yakutsk could potentially be home to a large diamond motherload! We should take advantage of this and start mining."
 Magaden_Fishing:0 "Magaden Fishing"
 Magaden_Fishing_desc:0 "The small town of Magaden has a small fishing industry. We should consider investing into it to facilitate the local area's growth."
 National_Infunstructure_Project_One:0 "National Infrastructure Project"
 National_Infunstructure_Project_One_desc:0 "Our nation now has a sizeable industry, if we are to move goods across our country efficiently, we need to build infrastructure across the nation."
 National_Infunstructure_Project_Two:0 "National Infrastructure Project Two"
 National_Infunstructure_Project_Two_desc:0 "Although we may have roads spanning the country, we still need railroads to be constructed."
 Regional_Financial_Hubs:0 "Regional Financial Hubs"
 Regional_Financial_Hubs_desc:0 "Allowing certain towns and cities to become their region's financial hub will facilitate our nation's economic growth."
 The_Shining_Capitol:0 "The Shining Capitol"
 The_Shining_Capitol_desc:0 "With all these economic investments across Siberia, we should finally invest in our capital to make it a shining example of Siberian success."
 The_Siberian_Superpower:0 "The Siberian Superpower"
 The_Siberian_Superpower_desc:0 "We have finally reached the position where we are equal to all the major powers in the world. We should declare that."
 Siberian_Army:0 "Siberian Arms Plant"
 Siberian_Army_desc:0 "If we are to have a Siberian army, we need an arms factory to supply them with weapons. We should look into funding the construction of an arms plant."
 Masters_of_the_Cold:0 "Masters of the Cold"
 Masters_of_the_Cold_desc:0 "Siberians have had a long history in surviving extreme cold conditions. We should use this expertise to your advantage to help train our army. "
 Mechnization_Investments:0 "Mechnization Investments"
 Mechnization_Investments_desc:0 "The armies of the world today do not just use a soldier and his gun. They use all sorts of mechanized equipment. We should look into such things and incorporate them into our army."
 Military_Investments_and_Expansion:0 "Military Investments and Expansion"
 Military_Investments_and_Expansion_desc:0 "We have a small military industry, however it is not large enough to support our army. We should look into expanding it."
 Siberian_Skies:0 "Siberian Skies"
 Siberian_Skies_desc:0 "A top military advisor suggests we should invest into military aircraft. In today's war, they can determine battles and wars."
 Glory_To_The_Siberian_People:0 "Glory to the Siberian People"
 Glory_To_The_Siberian_People_desc:0 "Now that the Siberian people are free from any oppressors and occupiers, may the nation of Siberia and its people be glorious forever!"
 Liberate_Sahkalin:0 "Liberate Sakhalin"
 Liberate_Sahkalin_desc:0 "South Sakhalin is occupied by the Japanese Empire which is home to hundreds of Siberians. We need to liberate them."
 Free_The_Ainu:0 "Liberate the Ainu"
 Free_The_Ainu_desc:0 "On the Japanese island of Hokkaido, there is a small group of Siberian people called the Ainu. They have been brutally oppressed and their culture has been almost wiped by the Japanese occupiers. We need to liberate the Ainu!"
 Manchurian_Cries:0 "Manchurian Cries"
 Manchurian_Cries_desc:0 "Although Manchurains are not Siberians, they live under the brutal colonial rule of the Japanese. We should liberate the Manchurians and break their colonia shackles."
 Liberate_The_Inuits:0 "Liberate the Inuits"
 Liberate_The_Inuits_desc:0 "The Inuits are not Siberians but are descendants. However, the Inuits have been brutally oppressed by the Americans and the Canadians. What kind of parent does not take care of their own child? We must liberate our Inuit brothers. "
 Nanuvuts:0 "Nunavut"
 Nanuvuts_desc:0 "The Canadians have brutally oppressed another group called the Nanuvuts. We need to liberate them too."
 Mongolian_Subjegation:0 "Mongolian Subjugation"
 Mongolian_Subjegation_desc:0 "Mongolia is ruled by a corrupt regime that does not serve its people. We cannot have such brutal oppression take place near our borders. We must liberate the Mongolian people."
 Inner_Mongolian_Annexation:0 "Inner Mongolia Intervention"
 Inner_Mongolian_Annexation_desc:0 "The Japanese puppet state of Manchukuo claims to be the rightful government for all the Mongolian people. However, they are just a brutal and corrupt regime. We need to intervene and end their people's suffering."
 Liberate_Our_Cousins:0 "Liberate Our Cousins"
 Liberate_Our_Cousins_desc:0 "Most people in the Americas hae some Siberian heritage that have been brutally oppressed by the European colonizers. We need to do something about this."
 The_Turkic_Idea:0 "The Turkic Idea"
 The_Turkic_Idea_desc:0 "Originally proposed in Turkey, many people wish for a united nation of all Turkic peoples under one nation. With our position, we may be able to make this dream a reality."
 The_Turkic_Peoples_Republic:0 "Turkestan"
 The_Turkic_Peoples_Republic_desc:0 "With the unification of all Central Asian people, we can now declare the founding of Turkestan. "
 Modernize_The_Infant_Nation:0 "Modernize the Infant Nation"
 The_Turkic_Peoples_Republic_desc:0 "If we are to survive as a nation, we need to prepare ourselves for any kind of enemy. We can begin by starting to modernize the nation."
 Modernize_The_Army:0 "Modernize the Army"
 Modernize_The_Army_desc:0 "Our army is small and outdated compared to other military powers of the world. We must modernize the army if we are to stand a chance."
 Calvery_Regiments:0 "The Steppe's Finest"
 Calvery_Regiments_desc:0 "The Steppe has always been known for its people's excellence in cavalry. We should incorporate this aspect of Turkestani culture into our military."
 New_Hordes:0 "The Mechanical Horde"
 New_Hordes_desc:0 "Although cavalry is still effective in today's wars, it will not be for long. We should look into motorizing and mechanizing our army."
 Invest_In_Farms:0 "Investing in Agriculture"
 Invest_In_Farms_desc:0 "Although our nation does not have many natural resources, we still need to be able to feed our people. We should invest and expand the farming industry."
 Industrialization_Policies:0 "Industrialization Policies"
 Industrialization_Policies_desc:0 "If we are to stand a chance on the global market we need to industrialize. A large industry will let us do wonders and grow our economy."
 Turkic_Weapons:0 "Turkic Weapons"
 Turkic_Weapons_desc:0 "Many of our weapons are from our former occupiers, the Soviet Union. If our military is to stand a chance without being reliant on outside forces, we need to develop our own weapons."
 Annex_Sinkiang:0 "Avenge East Turkestan"
 Annex_Sinkiang_desc:0 "During the early years of the Chinese Civil War, some of our brothers in Sinkiang declared the East Turkestan nation. It was the first instance of Turkestan and the fulfillment of the idea. However, it was promptly crushed by Chinese warlords. We need to liberate our brothers in Sinkiang, and avenge their defeat."
 Turkic_Superiority:0 "The Turkestani Superpower"
 Turkic_Superiority_desc:0 "Through our industrial expansions and military reforms, Turkestan is now comparable to many nations."
 Monetary_Potential:0 "Monetary Potential"
 Monetary_Potential_desc:0 "Turkestan has many natural resources in its eastern mountains. We can utilize these resources to our benefit. We could also monetize the horse industry."
 Open_Mines:0 "Open Mines"
 Open_Mines_desc:0 "With the discovery of many new resource deposits, we should open mines to extract these materials efficiently."
 Outside_Investors:0 "Invite Outside Investors"
 Outside_Investors_desc:0 "Our nation has many economic opportunities for outside investors. We should invite them and convince them to invest in our nation."
 Silk_Road_Revival:0 "Silk Road Revival"
 Silk_Road_Revival_desc:0 "Long ago, people used to pass through Turkestan to transport goods from China to Europe. We can improve the infrastructure in our nation to act as a highway to connect Asia to Europe. From the traffic that travels through our nation, it would result in economic growth and bring outside money into the country."
 Turkic_Infantructure_Projects:0 "Infrastructure Project"
 Turkic_Infantructure_Projects_desc:0 "Turkestan has small villages and towns scattered far from each other. We should improve the infrastructure between these settlements. It would allow for our factories to be built quicker and for goods to be transported easier."
 Turkestan_United:0 "Turkestan Unified"
 Turkestan_United_desc:0 "With the reforms and expansions of our nation, we have finally unified all Turkestani people."
 Turanist_Dream:0 "Turanist Ambitions"
 Turanist_Dream_desc:0 "If we are to be a nation that unifies all Turkic people, we need to go beyond the ideas of Turkestan, and embrace the Turanist dream. The dream of all Turkic people to be united under one nation."
 Fin_Urga:0 "Fin-Urga"
 Fin_Urga_desc:0 "Finnish people are people of Turkic heritage. We need to bring them into our nation."
 Turkey_The_Final_Piece:0 "Turkey the Final Piece"
 Turkey_The_Final_Piece_desc:0 "Turkey is the birthplace of the Turanist dream. If we are to unify all of Turan we need to include the birthplace of the Turkic people."

#Nationalism#
 Nationalism:0 "Nationalism"
 Nationalism_desc:0 "The Tuvan nation has always been subservient to the Russians or the Mongols. We have always served them to protect ourselves, however, the Tuvan people have never had any glory. Our nation is special, we must show the world that!"
 Facist_Proganda:0 "Nationalist Propaganda"
 Facist_Proganda_desc:0 "We must convince the people to believe in nationalism. It will bring our nation to glory."
 Instate_Facist_Members:0 "Instating Nationalists"
 Instate_Facist_Members_desc:0 "If we want to make Tannu Tuva into a nationalist led nation, we need to gain a majority in the government. Placing nationalists in important and influential government positions will increase our control."
 Execute_The_Communists:0 "Executing the Communists"
 Execute_The_Communists_desc:0 "The communists claim to be working for the Tuvan people, in reality we all know they are communists for power. We must get rid of these traitors and power hungry devils!"
 Execute_The_Republicans:0 "Execute the Republicans"
 Execute_The_Republicans_desc:0 "The republicans claim to be working for the Tuvan people, in reality democracy will not lead to Tuvan greatness. It will just leave our nation small and vulnerable to foreign powers. We must get rid of these traitors and prevent them from harming the nation!"
 Limit_Buddahism:0 "Nationalists Coup"
 Limit_Buddahism_desc:0 "Now that we have enough support in the Tuvan government, we can overthrow the government and take control!"
 Supress_The_Old_Believers:0 "Suppress the Old Believers"
 Supress_The_Old_Believers_desc:0 "It is rumored that there are Russians called Old Believers in our nation. We must get rid of them as they may work with the Russians to undermine our glory."
 Siberian_Nationalism:0 "Siberian Nationalism"
 Siberian_Nationalism_desc:0 "Siberian nationalists have called for the unification of Siberia under one nation. Instead of Tuvan glory, we should bring the Siberian people to glory. Tuvans and Siberians are brothers in arms against the imperialist invaders of the Russians. We have the chance to liberate our brothers!"
 Tuvan_Nationalism:0 "Tuvan Nationalism"
 Tuvan_Nationalism_desc:0 "The Tuvan nation and people come first before anyone else. The government is responsible for bringing Tannu Tuva to glory. We shall fulfill that promise."
 Indoctrinate_The_Youth:0 "Indoctrinate the Youth"
 Indoctrinate_The_Youth_desc:0 "A lot of the older population are less likely to support our cause because of their members of the evil communist regime and the weak democratic government. We should look into gaining support from the young people."
 Nationalist_Research:0 "The Tuvan Nationalist University"
 Nationalist_Research_desc:0 "If we are to bring Tannu Tuva to glory we must boost our technological advancements. We shall do this by opening the Tuvan Nationalist University. A place where our brightest minds can also work to bring our nation to glory."
 Foreign_Professors:0 "Foreign Professors"
 Foreign_Professors_desc:0 "Our brightest needs to be taught as much as possible. We shall invite professors from other nations to teach the brightest minds of Tannu Tuva."
 Ally_With_Germany:0 "Ally with Germany"
 Ally_With_Germany_desc:0 "In the west, a new empire that promises to destroy the Russians rises. We must work with the Germans to crush our Russian enemies."
 Produce_German_Arms:0 "Produce German Arms"
 Produce_German_Arms_desc:0 "We should produce German arms as our nation does not have the means to develop our own modern weapons."
 Arms_Manufactuing_Expansion:0 "Arms Manufacturing Expansion"
 Arms_Manufactuing_Expansion_desc:0 "If we are to supply our armies with guns, we need to expand our ability to produce weapons."
 Tuvan-German_Join_Arsenal_Development:0 "Tuvan-German Joint Arsenal Development"
 Tuvan-German_Join_Arsenal_Development_desc:0 "The German government has proposed a joint arsenal development. As an ally of Germany, we should be as prepared as possible for our invasion into Russia."
 German_Military_Advisors:0 "German Military Advisors"
 German_Military_Advisors_desc:0 "The German military has perfected the art of war. As allies of Germany we should consider inviting German military advisors to our nation to help use German military doctrines."
 German_Intergration:0 "German Integration"
 German_Intergration_desc:0 "Getting closer to Germany will protect us from the threats of the world. However, this will cost us a bit of our autonomy as an independent nation."
 Reichkommosariat_Tannu_Tuva:0 "Reichskommissariat Tannu Tuva"
 Reichkommosariat_Tannu_Tuva_desc:0 "Joining Germany as a Reichkommosariat will further guarantee the Tuvan nation's independence. Although we may be giving up our independence, our people and culture will remain safe."
 Reichkommosariat_Sibirien:0 "Reichskommissariat Sibirien"
 Reichkommosariat_Sibirien_desc:0 "With the Russian defeat and Siberia under German control, we should propose a Reichkommosariat Sibirien. Germany will have trouble managing the resistance in Siberia, we can manage it for them. Claiming to be the unifier of Siberia will most likely make the people accept our rule."
 Invite_German_Companies:0 "Invite German Companies"
 Invite_German_Companies_desc:0 "German companies are famous for making innovative tools and weapons. We should invite them to our nation to boost our industry and advance our technological advancements."
 Bring_in_Germanys_Prisoners:0 "Bring in Germany's Prisoners"
 Bring_in_Germanys_Prisoners_desc:0 "Germany has a lot of prisoners from its ethnic cleansings and prisoners of war. We should ask these prisoners for additional manpower and cheap labor to build up our nation."
 Produce_Weapon_Parts:0 "Produce Weapon Part"
 Produce_Weapon_Parts_desc:0 "Although making full tanks and planes will be difficult for the Tuvan industry, we can build small parts for our German ally. Producing these small parts would allow the quicker manufacture of more advanced machinery in Germany."
 Outsourced_Parts:0 "Unknown Focus Name"
 Expand_German_Trade:0 "Expand German Trade"
 Expand_German_Trade_desc:0 "Expanding trade with our allies will both benefit us economically."
 Expand_Into_Russia:0 "Kampf Gegen die Rote Pest"
 Expand_Into_Russia_desc:0 "Our German has declared the end to the Soviet Union. We should strike alongside our allies to crush the Red Plague."
 Siberian_Offensive:0 "Siberian Offensive"
 Siberian_Offensive_desc:0 "Tuvans are Siberians, we have a legitimate claim of being the government of all Siberians. Spreading this idea throughout Siberia will get the Siberian people to support our invasion."
 Winter_Experts:0 "Winter Experts"
 Winter_Experts_desc:0 "Siberians have had a long history of surviving in the cold. We should implement this into our army."
 Central_Asia_Offensive:0 "Central Asian Offensive"
 Central_Asia_Offensive_desc:0 "Tuvans are Central Asians, we have a legitimate claim of being the government of all Central Asians. Spreading this idea throughout Central Asia will get the steppe's people to support our invasion."
 Desert_Experts:0 "Desert Experts"
 Desert_Experts_desc:0 "Central Asia is filled with vast deserts, barren of anything. This has allowed the Central Asian people to gain expertise in desert combat. We should use this to our advantage and incorporate this into our army."
 Ally_With_Japan:0 "Ally with Japan"
 Ally_With_Japan_desc:0 "To the east the empire of the Rising Sun rises. It is rising to dominate all of eastern Asia. Allying with Japan and aiding them in their expansion might give us an opportunity to claim some of this glory for ourselves. We should strike now."
 Support_The_Japanese_Conquest_Of_China:0 "Support the Nitchūsensō"
 Support_The_Japanese_Conquest_Of_China_desc:0 "Japan is pushing farther and farther into Chinese lands. This may be an opportunity to show our loyalty to Japan and claim some land for ourselves."
 Invite_The_Zaibutas:0 "Invite the Zaibutas"
 Invite_The_Zaibutas_desc:0 "The Zaibutas are large companies that have a pseudo-monopoly in Japan. They have been largely successful and have been fueling the Japanese war machine. We should invite them to gain economic benefits."
 Expand_The_Zaibutus_Factories:0 "Expand the Zaibutus' Factories"
 Expand_The_Zaibutus_Factories_desc:0 "If we want the Zaibutas to set up significant incentives, we need to motivate them to do so. We can do this by expanding their factories."
 Closer_Japanese_Ties:0 "Closer Ties to Japan"
 Closer_Japanese_Ties_desc:0 "Our alliance with Japan seems to have greatly benefitted us. We should build closer relations with Japan to show our appreciation."
 Become_A_Japanese_Protectorate:0 "A Japanese Protectorate"
 Become_A_Japanese_Protectorate_desc:0 "Although our conquests in China have been successful, we are still a small and weak nation. With Japan's protection we shall never face any threats again."
 Japanese_Colonial_Management:0 "Japanese East Asia"
 Japanese_Colonial_Management_desc:0 "We should propose the colony of Japanese East Asia to our Japanese benefactors. Their empire is split up into multiple puppet states making management difficult. With one colonial government answering to its master, management of colonial territories will be easier and simpler."
 Japanese_Military_Advisors:0 "Japanese Military Advisors"
 Japanese_Military_Advisors_desc:0 "Our military lacks any real combat experience. We should ask Japan for military advisors to correct this issue."
 Organize_Military_Exercises:0 "Military Exercises"
 Organize_Military_Exercises_desc:0 "Our Japanese advisors have suggested we perform modern military exercises. This would be a great time to spot our weaknesses and strengths, and figure out what we can do to improve."
 Japanese_Naval_Information:0 "Japanese Naval Expertise"
 Japanese_Naval_Information_desc:0 "Now that we have access to the ocean we need a navy to protect our coast. We shall ask the Japanese to send advisors to start building up a Tuvan navy."
 Tuvan_Destroyers:0 "Tuvan  Destroyers"
 Tuvan_Destroyers_desc:0 "Destroyers can serve as good coastal defense ships. We should make investments in producing destroyers."
 Firing_Exercises:0 "Firing Exercises"
 Firing_Exercises_desc:0 "Our military still mainly uses swords and bows. If our military is to compete with the rest of the world, we need to train our troops to use firearms."
 Strengthen_The_Will:0 "Strengthen the Will"
 Strengthen_The_Will_desc:0 "If our soldiers are to fight, they should fight with a strong will and mind. We need to train our soldiers that they should be fearless and die for their country!"
 Zaibutas_Research_Personel:0 "Zaibutas Research"
 Zaibutas_Research_Personel_desc:0 "The Zaibutas have made several technological advancements. We should hire some of the research personnel to fuel our own technological progress."
 TAN_Invite_Japanese_Settlers:0 "Invite Japanese Settlers"
 TAN_Invite_Japanese_Settlers_desc:0 "The population of Tannu Tuva is small. Inviting Japanese settlers might increase our population, giving us a larger manpower pool for our industry and army."
 Go_Through_Mongolia:0 "Go Through Mongolia"
 Go_Through_Mongolia_desc:0 "If we are to aid the Japanese in China, we must go through Mongolia."
 Horseback_Raiders:0 "A Legacy of Cavalry"
 Horseback_Raiders_desc:0 "Mongolians and Tuvans are very similar to each other, we both have a long history of cavalry. We should integrate the Mongols into our new Tuvan empire."
 Instate_Anti-Communist_Government:0 "Instate a Pro-Tuvan Government"
 Instate_Anti-Communist_Government_desc:0 "It will take too long to integrate Mongolia into our nation. We should just instate a puppet government."
 Efficient_Factories:0 "Efficient Factories"
 Efficient_Factories_desc:0 "With the Mongolian industry we should expand it so we are able to supply the army of Mongols and Tuvans."
 Tuvans_In_Sinkiang:0 "Tuvans in Sinkiang"
 Tuvans_In_Sinkiang_desc:0 "There are Tuvans in Sinkiang who have been brutally oppressed by the Chinese government. We need to change this and liberate our brothers there."
 The_Inner-Mongolia_Question:0 "The Inner-Mongolia Question"
 The_Inner-Mongolia_Question_desc:0 "There is a region in China called Inner-Mongolia which is home to thousands of ethnic Mongolians. If the Tuvan government is to unify all the Mongols, shouldn't we bring every Mongolian under our flag?"
 Intergrate_Inner_Mongolia:0 "Integrate Inner-Mongolia"
 Intergrate_Inner_Mongolia_desc:0 "Now that we have Inner-Mongolia under our control, we should attempt to integrate it into our nation."
 The_Great_Mongol_Nation:0 "The Great Mongol Nation"
 The_Great_Mongol_Nation_desc:0 "Now that we have unified all the Mongol tribes, we can now proclaim ourselves the Great Mongol Nation."
 Just_Like_The_Horde:0 "Just Like the Horde"
 Just_Like_The_Horde_desc:0 "if we are to live up to the legacy of our ancestors before us, we must copy them."
 Mass_Conscription:0 "Mass Conscription"
 Mass_Conscription_desc:0 "If we are to bring glory to the Tuvan and Mongol people, every man must serve the nation."
 Ancient_Logistics_Strategies:0 "Ancient Logistics Strategies"
 Ancient_Logistics_Strategies_desc:0 "Mongol warriors never relied on large logistic systems to support their armies. They use the lands they were occupying to supply their armies. Incorporating this could prove extremely useful into our army."
 A_New_Horde:0 "The New Horde"
 A_New_Horde_desc:0 "Cavalry is no longer useful in today's wars. We need to construct a new horse out of trucks, tanks, and mechanized equipment."
 Motorization_Efforts:0 "Motorization Efforts"
 Motorization_Efforts_desc:0 "Motorizing our armies will give us the speed our ancestors had."
 Building_The_New_Horde:0 "Building the New Horde"
 Building_The_New_Horde_desc:0 "If we are to incorporate motorized equipment into our new horde, we will need to produce them first. We should focus our nation's resources on stockpiling such equipment."
 The_Golden_Horde_Returns:0 "The Horde Returns"
 The_Golden_Horde_Returns_desc:0 "With our efforts to grow our military, we are now ready to begin our conquests."
 Reconquest_Of_China:0 "The Reconquest of China"
 Reconquest_Of_China_desc:0 "The first conquest of the Mongol Empire was China, let's strike first."
 Strike_The_South:0 "Strike the South"
 Strike_The_South_desc:0 "South East Asia is full of resources that could supply our armies. We should take these lands before anyone else."
 March_Into_Goryeo:0 "March into Korea"
 March_Into_Goryeo_desc:0 "Korea was originally a subject of the Mongol Empire, let's pay them a revisit and remind them who is back."
 Western_Invasions:0 "Western Invasions"
 Western_Invasions_desc:0 "The Mongol Empire is famous for conquering the west and reaching all the way to modern day Turkey and Poland. Let us relive these conquests once again."
 Plunge_Into_Iran:0 "Plunge into Iran"
 Plunge_Into_Iran_desc:0 "Iran is located near the Indian Ocean, we should take it to control any trade passing through."
 Victory_In_The_Indus:0 "Victory in the Indus"
 Victory_In_The_Indus_desc:0 "The only competition in India is, India. Lets conquer India to remove this competition and threat."
 Ride_Into_Anakara:0 "To Ankara!"
 Ride_Into_Anakara_desc:0 "Our empire stretched all the way to the Anatolian peninsula. Let us retake the region."
 Unite_All_The_Mongol_Tribes:0 "Unite All the Mongol Tribes"
 Unite_All_The_Mongol_Tribes_desc:0 "As the Mongol Empire, it is our responsibility to protect and serve all Mongol people, even ones outside our borders. Let us bring those who are outside our borders under the Mongolian flag."
 Citizens_Of_The_Empire:0 "Citizens of the Empire"
 Citizens_Of_The_Empire_desc:0 "During the Mongol invasions, the empire did not treat its new subjects as a second class, instead they were integrated. We should make the same efforts to integrate the local population of our conquered lands into our empire."
 Retake_Kieven_Rus:0 "Retake Kievan Rus"
 Retake_Kieven_Rus_desc:0 "The Mongol Empire stretched as far as Russia. Let's take it back."
 Strike_Warsaw:0 "Strike Warsaw"
 Strike_Warsaw_desc:0 "The empire reached all the way to the gates of Warsaw, however we were stopped. We never pushed past Warsaw, but now we can. Let us do what the previous empire could not!"
 Batulu_Sails:0 "Kamikaze No More"
 Batulu_Sails_desc:0 "Kamikaze is a Japanese word meaning divine wind. It refers to how the winds had protected them from our ancestors' invasions. However, with our advanced weapons, kamikaze will no longer be a problem. Let us avenge our ancestors' defeat on the shores of Japan, and take all of it!"
 Fund_Factory_Works:0 "Fund Factory Projects"
 Fund_Factory_Works_desc:0 "All great nations need supplied armies, we are no different. Let us open more factories to produce more weapons. "
 Gun_Workshops:0 "Gun Workshops"
 Gun_Workshops_desc:0 "Our army needs more equipment, let us make more."

#Old Believers#
 Now_Is_The_Time:0 "Now is the Time"
 Now_Is_The_Time_desc:0 "Tannu Tuva is extremely unstable right now, we Old Believers could take this opportunity to take control of the nation."
 Show_Ourselves:0 "Show Ourselves"
 Show_Ourselves_desc:0 "Many Old Believers has fled central Russia to escape the religious intolerance of the Soviets. Some of those Old Believers have set up secret settlements hidden and isolated to protect themselves from the communists. With the instability in Tannu Tuva, we can now safely reveal ourselves. This would increase our influence in the nation aiding us in our takeover."
 Infiltrate_The_Tuvan_Parliment:0 "Infiltrate the Tuvan Parliament"
 Infiltrate_The_Tuvan_Parliment_desc:0 "If we are to grow our influence in the nation, we need to have Old Believers in the government. This will give us some power within the government."
 Invest_In_Old_Believers_Villages:0 "Invest in Old Believer Settlements"
 Invest_In_Old_Believers_Villages_desc:0 "The Old Believer settlements are isolated and located in very remote locations. We should connect these settlements to the rest of the nation by investing in new roads."
 Prepare_For_The_Coup:0 "Prepare for the Coup"
 Prepare_For_The_Coup_desc:0 "Now that we have sizable influence within the government, we should make preparations for our inevitable take over."
 The_Religous_Coup:0 "The Religious Coup"
 The_Religous_Coup_desc:0 "It is now time to overthrow the Tuvan government and replace it with our own! "
 Incorportate_The_Tuvans:0 "Incorporate the Tuvans"
 Incorportate_The_Tuvans_desc:0 "All though we have control over the government, Tuvans still make up the majority of the country's population. If we are to rule effectively, we have to incorporate them into our new state."
 Preparations_For_The_Return:0 "Preparations for Our Reclamation"
 Preparations_For_The_Return_desc:0 "So many Russians in the Soviet Union can no longer practice Russian Orthodox. The Soviet Union is a deplorable state for our people. We need to prepare to take it back."
 Foreign_Support:0 "Seek Foreign Support"
 Foreign_Support_desc:0 "With the state of our nation, we do not have a lot to work with. Let us reach out to foreign powers and ask for support."
 Send_Ambassadors_To_The_Germans:0 "Send Ambassadors to Germany"
 Send_Ambassadors_To_The_Germans_desc:0 "Germany is famous for their advanced military. We should send our ambassadors there in hopes of working with the Germans."
 Send_Ambassadors_To_The_Japanese:0 "Send Ambassadors to Japan"
 Send_Ambassadors_To_The_Japanese_desc:0 "The Japanese resent the Soviet Union for the recent border clashes and disagreements. Maybe we can ask them for help, after all, an enemy of my enemy is my friend."
 Send_Our_Word_Abroad:0 "International Calling"
 Send_Our_Word_Abroad_desc:0 "All over the world there are small populations of Old Believers in former lands of the Russian Empire. We should call these people to our aid to assist in our dreams of bringing back the old and right ways to Russia."
 Calling_Our_Brothers:0 "Brotherly Calling"
 Calling_Our_Brothers_desc:0 "If we are to bring as much support to our cause as possible, we need to build a sense of brotherhood among all Old Believers. Only together can we defeat the Soviets and bring back the old ways to Russia."
 Soviet_Sympathizers:0 "Soviet Sympathizers"
 Soviet_Sympathizers_desc:0 "Deep within the Soviet Union, there are many Old Believers and Soviets who secretly support our cause. We should look into contacting them and getting their support."
 White_Russian_Support:0 "White Russian Support"
 White_Russian_Support_desc:0 "After the Russian Civil War, the White Russians fled Russia to escape the Soviets. However, they still wish to defeat and overthrow the Soviet government. We should ally with them as they can bring military expertise and aid us in our cause. We also may be able to offer them something they may want..."
 Military_Build_Up:0 "Military Build Up"
 Military_Build_Up_desc:0 "How are we to beat the Soviets with our small armed forces? We need to build up our army if we are to defeat them. We should build military factories to supply and grow our army."
 Training_The_Troops:0 "Training is Key"
 Training_The_Troops_desc:0 "The Soviets have a huge military with thousands or millions of trained professional troops. If we are to stand a chance against them, we need to train our troops to prepare them for the war with the Soviets."
 Winter_Training:0 "Winter Training"
 Winter_Training_desc:0 "Lets train for winter warfare. The surrounding area gets very cold during the winter slowing down our troops. With winter warfare training, the winter shall stand no troops against our men."
 Living_Off_The_Land:0 "Living off the Land"
 Living_Off_The_Land_desc:0 "Our industrial base is small, we cannot afford to build trucks and trains to supply our troops. Instead. We should encourage our troops to mainly supply themselves from whatever they can find. This way we can expend less resources to keep our troops fully supplied."
 Economic_Build_Up:0 "Expand the Military Factories"
 Economic_Build_Up_desc:0 "We should expand our military industrial base to ensure our troops are supplied."
 SteeL_Mills:0 "Steel Mills"
 SteeL_Mills_desc:0 "If we are to build machines of war to fight against the Soviets, we need the resources to build such machines. Let us open a few steel mills to ensure constant and steady production of our weapons."
 Weapons_For_God:0 "Weapons for God"
 Weapons_For_God_desc:0 "If we are to bring back the old and right ways back to Russia, we need to build more military factories. We shall do this in the name of God."
 Local_Plans:0 "Local Plans"
 Local_Plans_desc:0 "Before we go to war with the Soviets, we should prepare and plan our offenses and defenses. Let us set up local plans that are to be executed for the highest chances of victory."
 The_Russian_Holy_War:0 "The Russian Holy War"
 The_Russian_Holy_War_desc:0 "We have made the preparations, trained our men, and forged alliances. We are ready to fight the Soviets. We are ready to topple them down and restore the right ways back to Russia. This war is not just any war, it is a holy war. The Russian Holy War!"
 Unite_The_Old_Believers:0 "Unite the Old Believers"
 Unite_The_Old_Believers_desc:0 "Some of our brothers and sisters are forgetting what we are fighting for. We must remind them of why we are fighting!"
 Free_The_Gulags:0 "Free the Gulags"
 Free_The_Gulags_desc:0 "The Soviets imprisoned anyone against them in isolated gulags. We must let these people free and allow them to fight against their Soviet captives!"
 Russian_Old_Believers_In_America:0 "Brothers in America"
 Russian_Old_Believers_In_America_desc:0 "There are more Old Believers in America, we should bring them into our cause too."
 Correcting_Past_Mistakes:0 "Correcting Past Mistakes"
 Correcting_Past_Mistakes_desc:0 "The Soviet government has made many awful mistakes. We need to reverse them."
 Russian_Orthodox:0 "Russian Orthodox"
 Russian_Orthodox_desc:0 "Nikon's revisions of the Russian Orthodox were not in the benefit of the Russian people. It was in benefit of the Greeks, he wanted to ensure that Greek Orthodox and Russian Orthodox remained as similar as possible. This was wrong, we need to reverse all these changes and restore Russian Orthodox."
 The_Safe_Heaven:0 "The Safe Haven"
 The_Safe_Heaven_desc:0 "With this new nation of Old Believers, we should attempt to make it a safe haven for all Old Believers."
 Seek_Western_Protection:0 "Seek Protection"
 Seek_Western_Protection_desc:0 "Our nation is small and weak, the only way we will be able to protect ourselves from any threat is to seek protection. We should ask countries to guarantee our independence."

#Government Reform Focuses#
 WIK_Recognize_the_Weak_Government:0 "Recognize the Weak Government"
 WIK_Recognize_the_Weak_Government_desc:0 "The sooner we recognize the weak government, the less time this issue becomes an unsolvable problem."
 WIK_Investigate_The_Government:0 "Investigate the Problems"
 WIK_Investigate_The_Government_dedsc:0 "As of now we do not know why our government is weak and has so many administrative issues. We should look into these problems and figure out what is wrong."
 WIK_Increase_Government_Pay:0 "Increase Government Pay"
 WIK_Increase_Government_Pay_desc:0 "Our government is weak due to the low pay we pay government employees. They have no real reason to respect or follow the government. Fortunately, we can introduce an economic incentive to do so."
 Organize_Regional_Provinces:0 "Organize the Provinces"
 Organize_Regional_Provinces_desc:0 "Tannu Tuva does not have regional bodies. Organizing the nation to manage regional bodies will help manage the nation more efficiently."
 Strengthen_the_Communication_Lines:0 "Strengthen the Communication Lines"
 Strengthen_the_Communication_Lines_desc:0 "If our government is to have control over these lands, we need to be able to communicate with all possible parts of the government as quick as possible. Let us build communication lines to strengthen our government."
 Revise_the_Laws:0 "Revise the Laws"
 Revise_the_Laws_desc:0 "Our laws are old, outdated, or simply do not make any sense. Let us revise some of these laws to clear these misunderstandings and to allow our government to work more efficiently."
 Enforce_the_Laws:0 "Enforce the Laws"
 Enforce_the_Laws_desc:0 "What good are laws if they are not enforced? We should enforce the laws to strengthen our government's control over the nation."
 Tuvan_Police_Force:0 "The Tuvan Police Force"
 Tuvan_Police_Force_desc:0 "Tannu Tuva may be a small country, but it is a lot of land to ensure our citizens are following the laws of our nation. A police force would make the enforcement of our laws easier and more efficient."
 Destory_Nationwide_Corruption:0 "Destroy Nationwide Corruption"
 Destory_Nationwide_Corruption_desc:0 "Nationwide corruption reeks in our government. We need to get rid of it immediately before the consequences get any worse."
 Land_Reform:0 "Land Reforms"
 Land_Reform_desc:0 "It is unclear what parts of lands are going to be used for or what they are used for. This confusion makes it extremely hard to approve new construction projects. We should carry out land reforms to resolve this issue."
 Tuvan_Military_Barracks:0 "Tuvan Military Barracks"
 Tuvan_Military_Barracks_desc:0 "Where are our troops supposed to train? As of now the nation does not have a place to keep and train our troops. We really need to open some barracks."
 Tax_Reform:0 "Tax Reform"
 Tax_Reform_desc:0 "The Tuvan tax system needs reforms. Some of our people do not even pay taxes as they are not even aware of them. We should pass some tax reforms to resolve this issue."
 Adress_the_Weak_Army:0 "Address the Weak Army"
 Adress_the_Weak_Army_desc:0 "First step in strengthening our military would be to address the deplorable state it is in."
 Military_Exercises:0 "Military Exercises"
 Military_Exercises_desc:0 "They say practice makes perfect. Let us hold military exercises to train our troops and to ensure they are competent soldiers."
 Weapons_Manufacturing:0 "Weapons Manufacturing"
 Weapons_Manufacturing_desc:0 "Our military may now have competent soldiers, however they cannot fight effectively without the proper weapons. We should promote the manufacturing of weapons to supply our troops with the right weapons."
 Infantry_Equipment_Effort:0 "Infantry Equipment Effort"
 Infantry_Equipment_Effort_desc:0 "If our military is to be a capable fighting force, we need to advance our infantry weapons."
 Transport_Effort:0 "Motorized Transport Effort"
 Transport_Effort_desc:0 "If our military is to be a capable fighting force, our soldiers need to be mobile. Let us look into motorizing parts of our army."
 Send_Officers_Abroad:0 "Send Officers Abroad"
 Send_Officers_Abroad_desc:0 "Our officers are very inexperienced as they have never learned how to lead their soldiers into battle. We should send them overseas to learn from the best military academies. When they return they can share what they learned and strengthen our army."
 War_Games:0 "War Games"
 War_Games_desc:0 "We should host War Games for our military to help  our officers practice what they have learned from their time overseas."
 Support_Our_Soilders:0 "Support our Soldiers"
 Support_Our_Soilders_desc:0 "With our new weapons and the experience gained from the war games, let us put them into good use."
 Doctrine_Effort:0 "Doctrine Effort"
 Doctrine_Effort_desc:0 "If we are to stand a chance in the world, our military must continue developing its doctrine."
 Modernizing_Our_Weapons:0 "Modernizing our Weapons"
 Modernizing_Our_Weapons_desc:0 "Although our weapons advancement has been quite quick, we are still behind our neighboring countries. We should continue to modernize our weapons."
 Conscription_Revisions:0 "Conscription Revisions"
 Conscription_Revisions_desc:0 "Our conscription laws do not fulfill the nation's military. We need more soldiers if we are to protect ourselves."
 Learned_From_Experience:0 "Learned from Experience"
 Learned_From_Experience_desc:0 "From our failures and from our training our military has changed in many ways. However, it did change for the better. Without this new experience, let us apply our new skills and learn lessons to strengthen our military."
 Bang_Bang:0 "Artillery Effort"
 Bang_Bang_desc:0 "Artillery can be used to destroy and obliterate the enemy. We should invest in it."
 Horses_of_Steel:0 "Horses of Steel"
 Horses_of_Steel_desc:0 "Tanks are the way to go."
 Tank_Killers:0 "Tank Killers"
 Tank_Killers_desc:0 "If we are to have a chance against other nation's tanks, we should also be able to obliterate them."
 The_Other_Fronts:0 "The Second and Third Dimension"
 The_Other_Fronts_desc:0 "We may have gotten the first dimension of warfare covered, however our military has no power in the skies of the seas. This must change."
 The_Sky:0 "The Sky"
 The_Sky_desc:0 "We should open our first air base to weaponize the sky."
 Small_and_Agile:0 "Small and Agile"
 Small_and_Agile_desc:0 "We should invest in small and agile fighters, they will be the most effective ones. They may not be able to bring firepower to the battle, however their agileness will certainly make up for it."
 Large_and_Destructive:0 "Large and Destructive"
 Large_and_Destructive_desc:0 "If we want to win a battle, the enemy must be destroyed. Large aircraft can bring this ability to our side of the battle."
 IMproved_Bomb_Sights:0 "Improved Bomb Sights"
 IMproved_Bomb_Sights_desc:0 "Improving our bomb sights will allow greater accuracy when destroying the enemy."
 War_Games_in_the_Air:0 "War Games in the Air" 
 War_Games_in_the_Air_desc:0 "Our pilots need practice fighting in the skies. We should host aerial war games to give them such practice."
 The_Sea:0 "The Sea"
 The_Sea_desc:0 "The ocean is another place for our enemy to strike us from. We must secure the sea before they do."
 WIK_Building_the_Dockyards:0 "Building the Dockyards"
 WIK_Building_the_Dockyards_desc:0 "In order to build ships, we need to build some dockyards first."
 Agile_Fleet:0 "Agile Fleet"
 Agile_Fleet_desc:0 "An agile fleet is a superior one. Quick and small allow for easy production and to swerve between the enemy catching them off guard."
 Practice_Speed:0 "Practice Speed"
 Practice_Speed_desc:0 "Our sailors could use extra practice in maneuvering their warships. This practice will pay off once we enter combat."
 Practice_Aiming:0 "Practice Aiming"
 Practice_Aiming_desc:0 "Our crews are inexperienced with aiming the naval cannon on our warships. A few practices should get them to master aiming these guns."
 WIK_Fast_Destroyers:0 "Destroyer Effort"
 WIK_Fast_Destroyers_desc:0 "We should invest in destroyers for their speed and maneuverability."
 WIK_Undersea_Wolves:0 "Submarine Effort"
 WIK_Undersea_Wolves_desc:0 "We should invest in submarines as they can surprise the enemy."
 Grand_Battleships:0 "Battleship Effort"
 Grand_Battleships_desc:0 "We should invest in battleships for their massive firepower."
 Floating_Air_Bases:0 "Aircraft Carrier Effort"
 Floating_Air_Bases_desc:0 "Aircraft carriers can bring planes into a naval battle. This would be a huge advantage for us."
 Warship_Cruisers:0 "Cruiser Effort"
 Warship_Cruisers_desc:0 "Cruisers are the perfect balance between destroyer and battleship. With a good amount of speed and firepower, we should invest in building cruisers."
 WIK_Powerful_Fleet:0 "A Powerful Fleet"
 WIK_Powerful_Fleet_desc:0 "A powerful fleet with the ability to destroy the enemy is one we should hope to build."
 Naval_Exercises:0 "Naval Exercises"
 Naval_Exercises_desc:0 "We should hold naval exercises to strengthen our navy."
 Production_Methods:0 "Production Methods"
 Production_Methods_descs:0 "We should modify and increase the efficiency of our production lines."
 Computer_Aided_Research:0 "Computer Aided Research"
 Computer_Aided_Research_desc:0 "Computers are an amazing tool for our technological advancement, we should use them."
 Chemical_Institute:0 "Chemical Institute"
 Chemical_Institute_desc:0 "Computers have allowed us to research much quicker. Let us open a chemical institute to further increase our research abilities."
 Nuclear_Possibilities:0 "Destroyer of Worlds"
 Nuclear_Possibilities_desc:0 "Our scientists and researchers at our chemical institute have proposed creating weapons from atoms to create nuclear weapons. These weapons may prove useful on the battlefield."
 Tuvan_Autarky:0 "Tuvan Autarky"
 Tuvan_Autarky_desc:0 "Our people and military need oil to function properly, we should create a synthesis refinery to ensure that our supply of oil is left undisturbed."
 Oil_Advancements:0 "Oil Advancements"
 Oil_Advancements_desc:0 "We could always use more oil."
 Increased_Production_Efficiency:0 "Increased Production"
 Increased_Production_Efficiency_desc:0 "Increasing our means of production will boost our economy."
 Radio_Investments:0 "Radio Effort"
 Radio_Investments_desc:0 "The radio is a great way to reach out to our people. We could use this technology to rally the people to our side!"
 Industrial_Expansion_Program:0 "Industrial Expansion"
 Industrial_Expansion_Program_desc:0 "We should expand our industry to ensure we do not fall behind our neighbors."
 Construction_Company:0 "Construction Company"
 Construction_Company_desc:0 "If we are to continue our industrial expansion, we should open a construction company to facilitate our goals."
 Expand_the_Construction_Company:0 "Continued Industrial Advancements"
 Expand_the_Construction_Company_desc:0 "We should continue to advance our industrial means."
 Expand_the_Military_Arms_Industry:0 "Expand the Arms Industry"
 Expand_the_Military_Arms_Industry_desc:0 "Our nation is small, if we are to defend ourselves we will need a lot of weapons."
 Giving_The_People_Jobs:0 "Decrease Unemployment"
 Giving_The_People_Jobs_desc:0 "With our rapid industrialization, we should give our people these jobs."
 Expand_the_Land_Reforms:0 "Continue the Land Reforms"
 Expand_the_Land_Reforms_desc:0 "We should continue our land reforms to allow our industry to grow."
 Urbanization:0 "Urbanization"
 Urbanization_desc:0 "Urbanizing our towns into cities will allow us to build more."

