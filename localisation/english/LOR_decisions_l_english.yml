  ROM_balkan_federation_cores:0 "Balkan Federation: Unite the people!"
  ROM_balkan_federation_cores_desc:0 "The Balkans boast a rich history and cultural diversity that defines us and unites us simultaneously. By uniting our efforts, we can contribute to peace, stability, and prosperity in the region. Therefore, we invite you to join us in this bold initiative."
