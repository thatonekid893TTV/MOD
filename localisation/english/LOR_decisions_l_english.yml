  ROM_ussr_invasion:0 "Ostasi! Va ordon treceti Prutul!"
  ROM_ussr_invasion_desc:0 "At 2 o'clock, on the night of June 21 to 22, 1941, the Romanian Army receives from General Ion Antonescu the legendary order: "Soldiers, cross the Prut!" A moment that separates two national tragedies: the loss of Bessarabia and Northern Bucovina through the 1940 ultimatum and the conquest of Romania by the Red Army in 1944."
