  ROM_internal_power_struggle:0 "Internal Resistance"
  ROM_internal_power_struggle_desc:0 "Movements against the regime from within the Balkan Federation reflect a growing sentiment of discontent with authoritarian practices, advocating for greater political transparency, individual freedoms, and the protection of human rights. These movements serve as crucial catalysts for fostering democratic reforms and strengthening the principles of accountability and inclusivity within the Balkan Federation. \n\nYugoslavian Resistance: [?core_resistance@YUG] \nBulgarian Resitance: [?core_resistance@BUL]\nGreek Resistance: [?core_resistance@GRE]\nAlbanian Resistance: [?core_resistance@ALB]"
  ROM_keep_the_people_at_bay:0 "Keep the people united!"

  ROM_let_the_game_begin_new:0 "§RThe tragedy of old Blood!§!"
  ROM_let_the_game_begin_new_desc:0 "the Romanian pursuit of revenge against the Ottoman Empire manifested as a calculated strategic endeavor, aimed at reclaiming lost territories and asserting dominance in the region. Utilizing a combination of diplomatic maneuvering and military prowess, Romania sought to assert its influence and weaken the Ottoman grip, culminating in a series of carefully orchestrated campaigns that not only reshaped the balance of power in the Balkans but also underscored the enduring legacy of historical conflicts and territorial aspirations in the region."
