  ROM_bulgarian_showdown:0 "The Bulgarian Showdown"
  ROM_bulgarian_showdown_desc:0 "Romanian coup in Sofia, the Romanian forces, led by Mihai I, orchestrated a swift takeover of the Bulgarian throne, proclaiming the establishment of Vlaho-Bulgaria. With a blend of political maneuvering and military prowess, the coup not only reshaped the geopolitical dynamics of the Balkans but also set the stage for a complex interplay of power and identity between the newly formed Vlaho-Bulgarian state and its neighboring nations.\n\n\nChanses for the plan to work [?ROM_coup_support_bul]%§"
