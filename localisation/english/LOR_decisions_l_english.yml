  ##Roman Empire and Byzantim##
  ROM_secure_the_rights_of_the_true_heir_category:0 "Securing the Rights of The True Heir"
  ROM_secure_the_rights_of_the_true_heir_category_desc:0 "The legacy of Rome remains contested, with nations like Italy, Greece, and others laying claims to its ancient heritage. To solidify our position as the true heirs of the Roman Empire, we must take decisive steps to secure this legacy. Through diplomatic maneuvers, cultural revival, and military dominance, we will demonstrate to the world that the glory of Rome lives on in us.\n\nOur Claim Support: §W[?ROM_roman_support_percent]%§!"
  ROM_secure_the_roman_claim:0 "Securing The Claim of The Roman Legacy"
  ROM_secure_the_roman_claim_desc:0 "The title of the true heir of Rome is more than a claim, it is a right that must be asserted and defended. By leveraging political alliances, crushing rival claimants, and reviving ancient traditions, we will leave no doubt that our nation alone embodies the rightful continuation of the Roman Empire. The crown of the Caesars shall rest firmly upon our head."

  ROM_imperial_court_byzantine:0 "Imperial Court of Bucharest"
  ROM_imperial_court_byzantine_desc:0 "The grandeur of Rome finds its new seat in Bucharest, transformed into the heart of imperial governance. From its gilded halls, the Emperor reigns supreme, surrounded by loyal senators, advisors, and diplomats who craft the policies of a united empire. This court symbolizes both the revival of Roman traditions and the dawn of a new era of imperial dominance."
  ROM_recruit_the_pretorian_guards:0 "Recruit The Pretorian Guards"

  ROM_imperial_court_byzantine_tt:0 "\n\nThe Imperial Court of Bucharest serves as the administrative and ceremonial center of the reborn Roman Empire. Here, the Emperor's authority is unquestioned, and decisions shaping the empire's future are made with the guidance of loyal advisors. It stands as a testament to the revival of Roman glory and the unyielding ambition of its people."
  ROM_imperial_decrees_of_governance_tt:0 "\nThrough the issuance of imperial decrees, the Emperor enforces centralized authority across the empire. These edicts streamline governance, ensure loyalty in newly integrated territories, and uphold the traditions of Roman administration, solidifying the foundations of a unified and efficient state"
  ROM_council_of_imperial_governors_tt:0 "\nThe Council of Imperial Governors brings together the appointed rulers of Roman provinces to ensure efficient administration across the empire. Acting as the Emperor’s trusted agents, they maintain order, implement imperial policies, and oversee the prosperity of their respective regions, forging unity across the vast domains of the empire."
  ROM_leader_of_the_orthodox_world_tt:0 "\nAs the bastion of Orthodoxy, the empire assumes its divine role as the spiritual and political leader of the Orthodox world. By uniting Orthodox nations under its banner, the Emperor strengthens religious unity, reinforces imperial authority, and reaffirms the empire's sacred mission to defend the faith."
  ROM_romanian_caesaropapism_tt:0 "\nBlending imperial authority with spiritual leadership, Romanian Caesaropapism places the Emperor at the pinnacle of both state and church. This fusion of power unites the empire under one divine ruler, ensuring harmony between governance and faith while cementing the Emperor’s role as God's chosen sovereign on Earth"
  ROM_orthodox_patriarchate_in_bucharest_tt:0 "\nWith the Orthodox Patriarchate established in Bucharest, the city becomes the spiritual heart of the Orthodox world. This move strengthens the empire’s religious authority, reinforces unity among its faithful, and aligns the church’s mission with the divine vision of the Emperor."

  ROM_recruit_the_pretorian_guards_tt:0 "\n\nThe Praetorian Guards, elite soldiers sworn to protect the Emperor, are revived as a symbol of power and tradition. Their loyalty ensures the Emperor's safety, while their unmatched discipline and skill make them an unparalleled force on the battlefield. They are the shield of the empire and the sword of its will"

  ROM_secure_the_roman_claim_tt:0 "The mission will be completed after you will reach §Y65%§! or more to the claim!"
  
