  ROM_legionary_rebelion:0 "§RThe Legionary Rebellion§!"
  ROM_legionary_rebelion_desc:0 "The Legionary Rebellion is upon us. They are attempting to sway our generals and expand their influence to amass more power. Currently, their influence over us is minimal, but we must either contain them or dismantle their organization. We need to act now before it’s too late! \n\n\nIron Guard Power: \nAntonescu and Carol II power: "
