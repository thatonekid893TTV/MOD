  ROM_final_solution:0 "Operation Final Solution"
  ROM_final_solution_desc:0 "The Holocaust in Romania was the development of the Holocaust in the Kingdom of Romania. 380,000–400,000 Jews died in Romanian-controlled areas, including Bessarabia, Bukovina and Transnistria. Romania ranks first among Holocaust perpetrator countries other than Nazi Germany."
