 LIB_GATHERING_STORM_DESC:0 "In the aftermath of the Great War, Liberia stands at a critical juncture. The country, influenced by American interests and grappling with economic challenges, faces the looming shadow of colonial powers. The Firestone presence adds a complex layer, as does widespread corruption.\n\nAs political tensions rise, Liberia's fate hangs in the balance. A generation lost to economic struggles and external pressures, the republic stands on the brink. Will Liberia navigate these turbulent times or succumb to cripling debt and world pressure?"