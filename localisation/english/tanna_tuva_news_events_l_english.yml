 tanna_tuva_news.1.desc:0 "The leaders of Tannu Tuva announce the unification of the Siberian people. The idea of a Siberian state came about during the Russian Civil War and has continued to persist in the modern Soviet Union. Through the annexation of former Soviet lands with a large Siberian population, Tannu Tuva has been able to make this idea a reality. What was deemed inconceivable was made conceivable by a small and formerly, a widely unknown nation. Throughout the new Siberian nation, citizens report massive celebrations. In the former Tuvan capital a large military parade was held showing off the Siberian army. In Irkutsk, people party and sing local SIberian folk songs in the streets. In Vladivostok, a firework show was held and people cheered. Even all the way in the frozen city of Yakutsk, people cheer and celebrate. It is a wonderful time to be a Siberian. This may be the dawn of a new superpower, some experts say. "