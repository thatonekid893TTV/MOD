luxembourg_mod_idea_61_desc: "With the end of the war with the Germans, our victory has resulted in many dead, and something to pay for it. If we want to have our people appeased, we must integrate people in Belgium, and in the Netherlands. This will result in a more stable government, and a more stable nation."
