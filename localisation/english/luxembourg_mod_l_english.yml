LUX_focus_143: "Create the Military Staff"
LUX_focus_143_desc: "We have created the Military Staff, a group of military experts, who will help us with our military development. This will help us greatly in the future, especially with offensive operations."
LUX_focus_144: "Strike through France"
LUX_focus_144_desc: "We must strike through France, in order to limit German Influence everywhere. This would severely limit the German strength, and lead to their demise."
LUX_focus_145: "Strike the Germans"
LUX_focus_145_desc: "We must strike the Germans, in order to limit German Influence everywhere. This would severely limit the German strength, and lead to their demise."
LUX_focus_146: "Integrationism"
LUX_focus_146_desc: "Through Integrationism, we will be able to integrate the people of Belgium, and the Netherlands. This will create a more stable government, and a more stable nation."
LUX_focus_147: "The Temporary Alliance"
LUX_focus_147_desc: "Our alliance with the British and French was one formed only through a common enemy. An enemy makes two friends, but once that enemy is gone, the friends will turn on eachother. This alliance was one like that, now, we shall turn our backs, and come out of the shadows."
LUX_focus_148: "Campaign in France"
LUX_focus_148_desc: "Through Planning, can we win against the French. The campaign will be long and hard, but through coordinated planning, attacks, defenses, and more, we will be able to win."
LUX_focus_149: "Campain in Britain"
LUX_focus_149_desc: "Through Planning, can we win against the Britain. The campaign will be long and hard, but through coordinated planning, attacks, defenses, and more, we will be able to win."
LUX_focus_150: "Cross the Channel"
LUX_focus_150_desc: "In order to beat Britain, we must cross the largest obstacle in our way, the English Channel. This will be a hard task, but through planning, we will be able to do this."
LUX_focus_151: "Unite with France"
LUX_focus_151_desc: "Through the unification with France, we will be able to create a more stable government, and a more stable nation. This will also help us greatly in the future, especially with offensive operations."
LUX_focus_152: "The Second Great War"
LUX_focus_152_desc: "The Great War was one of a great magnitude, however, this one is proving to be greater. It is time to prove ourselves in this war, and to place ourselves into history."
LUX_focus_153: "War in Germany"
LUX_focus_153_desc: "We must complete an offensive into the Germany territories in order to beat them."
LUX_focus_154: "Defend the Horde"
LUX_focus_154_desc: "The German horde is huge, and we need to have more men and units to beat it, not doing so will result in our demise."
LUX_focus_155: "The Final Push"
LUX_focus_155_desc: "We are so close, yet so far, staging a large enough revolt in Germany will result a faster push toward the Fascist scum that is the Germans. Lets end this now and forever."
LUX_focus_156: "Allied Intel"
LUX_focus_156_desc: "For effective cooperation, we should share intel in order to counter any advantages an enemy would have."
LUX_focus_157: "Alone..."
LUX_focus_157_desc: "Our Nation is surrounded, we are a pimple on the face of Europe. It is time to show our true selves, we are alone, and it shall stay that way. We shall win alone, no matter the cost."
LUX_focus_158: "Luxembourgish Autonomy"
LUX_focus_158_desc: "We have supported the Germans in all their conquests, for nothing in return. It is time to take back our pride, and to win them through conflict."
LUX_focus_158_tt: "§RThis will lead to war with Germany§!"
LUX_focus_159: "Further Departure"
LUX_focus_159_desc: "Lets begin the process of leaving the Axis, we have been a part of them for too long, and it is time to leave them. We will be able to do this through a series of steps, and through a series of actions."
LUX_focus_160: "Become Free"
LUX_focus_160_desc: "We shall fly away from the Germans, we are Luxembourg, we will win this."
LUX_focus_161: "Further Freedom"
LUX_focus_161_desc: "We are at the brink of becoming free. We just need to take a few final steps to secure this imminent freedom, and victory."
LUX_focus_161_tt: "§RBeing Free after completing this focus will lead to war with Germany§!"
LUX_focus_162: "Assasinate the Fuhrer"
LUX_focus_162_desc: "We have ended up in a war that has threatened the existence of our Nation and People. We must take out the root cause of our fiasco, which is the silly dream that Hitler will own the world. Lets prove him wrong."
LUX_focus_162_tooltip: "Unlocks Decision to §YAssasinate the Fuhrer§!"
LUX_focus_163: "Defend against Aggression"
LUX_focus_163_desc: "The Germans are attacking us, it is time we decide to defend ourselves to the largest extent possible."
LUX_focus_163_tt: "If the Focus: §YFortify our Home§! is completed, §Rthe following buffs wont apply:§!"
LUX_focus_164: "Begin the Process of Staging Uprisings"
LUX_focus_164_desc: "Staging uprisings in other countries is a good way to weaken them, and if they leave the growing discontent alone, they will become a victim to the future."
LUX_focus_165: "Let Paris Rise"
LUX_focus_165_desc: "We have funded the Parisian Uprisings, and it is time to let them rise. We will be able to weaken the Germans, and to take advantage of the situation."
LUX_focus_166: "Let the Dutch Rise"
LUX_focus_166_desc: "We have funded the Dutch Uprisings, and it is time to let them rise. We will be able to weaken the Germans, and to take advantage of the situation."
LUX_focus_167: "The Final Rise"
LUX_focus_167_desc: "We have funded the final uprisings, and it is time to let them rise. We will be able to weaken the Germans, and to take advantage of the situation."
LUX_mod_event_80_flag: "Has been at §Ywar§! with §Y[GER.GetNameWithFlag]§!"
LUX_focus_168: "Victory"
LUX_focus_168_desc: "We have won the war, we have defeated the Germans, and we have proven ourselves. We are no longer a pimple on the face of Europe, we are a nation that has proven itself, and we will continue to prove ourselves."
LUX_focus_169: "Victory"
LUX_focus_169_desc: "We have won the war, we have defeated the Germans, and we have proven ourselves. We are no longer a pimple on the face of Europe, we are a nation that has proven itself, and we will continue to prove ourselves."
LUX_focus_170: "Global Affairs"
LUX_focus_170_desc: "We must call out to the world, we must show them who we are. We will advance into foreign territories."
LUX_focus_171: "The Fate of the World"
LUX_focus_171_desc: "The world lies in our hands, we can do what we want, and we can change the future to our liking."
LUX_focus_172: "Communist Uprisings"
LUX_focus_172_desc: "We have been able to stage uprisings in other countries, and it is time to let them rise. We shall thrive in not war, but in politics."
LUX_focus_172_tt: "Allows you to §Ybegin the process§! of staging §YCommunist Uprisings§! in other countries."
LUX_focus_173: "French Uprisings"
LUX_focus_173_desc: "We have been able to stage uprisings in other countries, and it is time to let them rise. We shall thrive in not war, but in politics. We shall focus on primarily France, to increase our power in the world."
LUX_focus_173_tt: "Allows you to §Ybegin the process§! of staging §YCommunist Uprisings§! in §Y[FRA.GetNameWithFlag]§!"
LUX_focus_174: "German Uprisings"
LUX_focus_174_desc: "We have been able to stage uprisings in other countries, and it is time to let them rise. We shall thrive in not war, but in politics. We shall focus on primarily Germany, to increase our power in the world."
LUX_focus_174_tt: "Allows you to §Ybegin the process§! of staging §YCommunist Uprisings§! in §Y[GER.GetNameWithFlag]§!"
LUX_focus_175: "South American Diplomacy"
LUX_focus_175_desc: "We have slowly been growing our influence in the world, and it is time to expand into south america. There are countries which have lots of potential, and are ripe for our picking."
LUX_focus_175_tt: "Every country in §YSouth America§! will gain §Ydaily communist support§! if they §Yaccept our demands§!. We will gain a §Ywar goal§! if they do §Ynot§! accept."


