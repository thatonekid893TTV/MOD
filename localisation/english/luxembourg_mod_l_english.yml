#Focuses
LUX_anarchy_focus_1: "A State of Anarchism"
LUX_anarchy_focus_1_desc: "Our Nation has failed, the two opposing factions have gone into a reccession, the revolution has failed... . There is one last hope for our nation, Anarchism."
LUX_anarchist_government_char: "The Anarchist Government"
LUX_anarchy_focus_2: "Sign the Purge Decree"
LUX_anarchy_focus_2_desc: "Our Nation stands as one born out of fire, we are not a stable country, and let that be known. But through decisive action, can we eliminate this threat, through strength and power, can we become a nation of unity. Lets strike our opponents while they are weak."
LUX_anarchy_focus_3: "Foreign Volunteers"
LUX_anarchy_focus_3_desc: "People all across the world have dreaned for a moment like this, one of an anarchist nation coming to light. It is time to accept these people, it is time to prove ourselves through struggles and strength. Welcome to Anarchist Luxembourg."
LUX_anarchy_focus_4: "A Strike at Democracy"
LUX_anarchy_focus_4_desc: "In order to keep our Government stable, and end any enemy incursions into our territory, we must limit their influence, and we can do that by simply eliminating their influence."
LUX_anarchy_focus_5: "Complete Control"
LUX_anarchy_focus_5_desc: "We have limited our opponents, and now it is time to finalize it. Lets institute complete control."
LUX_anarchy_focus_6: "Complete Independence"
LUX_anarchy_focus_6_desc: "For too long have we been influenced by other factions and nations. For too long have we been subjects to foreign aid, it is time to change, to change for the good."
LUX_anarchy_focus_7: "New Economic System"
LUX_anarchy_focus_7_desc: "Our Economic System requires a reworking in times of Anarchism. The Previous System does not work with our current beliefs, we shall change it, we shal thrive."
LUX_anarchy_focus_8: "Agricultural Subsidies"
LUX_anarchy_focus_8_desc: "We requires Agricultural Subsidies in order to advance our nation, it shall be the greater evolution. Agricultural Subsidies will advance our Nation."
LUX_anarchy_focus_9: "Anarchist Industries"
LUX_anarchy_focus_9_desc: "We require the people of Luxembourg to help advance this nation into one more industrialised, it will grant us power in every section. Including Politics."
LUX_anarchy_focus_10: "Resource Excavation"
LUX_anarchy_focus_10_desc: "We have valuable resources, exploiting the resources can result in further greatness."
LUX_anarchy_focus_11: "Anarchist Research"
LUX_anarchy_focus_11_desc: "We must improve our research institutes in order to have superior knowledge, and to improve our overall nation in every sector."
LUX_anarchy_focus_12: "Victory of Anarchism"
LUX_anarchy_focus_12_desc: "The State of Anarchism is not at its best, but we have definetly improved our country through Actions. We shall therefore declare a victory in the Revolution against the Revolution."
LUX_anarchy_focus_13: "Burn the Previous Laws"
LUX_anarchy_focus_13_desc: "The previous Laws stand to keep democracy, and to stay like that for years to come. It is smartest to challenge this, it would be smart to eliminate all foreign interests. Lets secure Anarchism, no matter what the cost may be."
LUX_anarchy_focus_14: "Trial the Opponents"
LUX_anarchy_focus_14_desc: "Elimination of the previous opponents is needed not only to gain public support, but also to limit their possible influence, and to limit their chance of doing a counter coup."
mod_event_57_tooltip: "§GYou have ended any further uprisings§!"
LUX_anarchy_focus_14_tooltip: "Completing this focus will §Gend§! any further uprisings"
LUX_anarchy_focus_15: "Investigate the Public"
LUX_anarchy_focus_15_desc: "Through investigating people in our Public, we can see who does not support us, and crack down on them. This is anarchism after all, all laws will soon end..."
mod_event_56_flag: "The Queen has returned"
LUX_anarchy_focus_16: "The Queen"
LUX_anarchy_focus_16_desc: "The Queen has long been a popular figurehead of the Luxembourgish Nation, but now it is time to decide what to do with her. Will she return to a changed nation, or shall we end this."
LUX_anarchy_focus_17: "Shake the World"
LUX_anarchy_focus_17_desc: "The World is being engulfed by fire, all it needs is one spark to be ignited. Shall we be the lighter, and light up the world?"
LUX_anarchy_focus_18: "Organize the Masses"
LUX_anarchy_focus_18_desc: "We need to organize the masses in order to prove our true potential and strength, only then will other people and countries expirience true fear."
LUX_anarchy_focus_19: "Spread Anarchism"
LUX_anarchy_focus_19_desc: "We must spread Anarchism in order to integrate other nations, in order to grow our nation. Spreading Anarchism will result in a heavy benefit for us, lets bring them storm."
LUX_anarchy_focus_20: "Annex Belgium"
LUX_anarchy_focus_20_desc: "Now that we have spread Anarchism through our Neighbors, it is time to integrate the smallest one, they have no power left after all..."
LUX_anarchy_focus_21: "Invade the Continent"
LUX_anarchy_focus_21_desc: "The time has come, now we should invade the contintent in order to beat others in their own games, lets win this once and for all."
LUX_anarchy_focus_22: "Pure Independence"
LUX_anarchy_focus_22_desc: "\"We do not scare easily, we never bow, we never bend, we never break when confronted with crisis. No, we endure, we overcome and we always, always, always move forward!\" - Joe Biden"
LUX_anarchy_focus_23: "Bring down the Opponents"
LUX_anarchy_focus_23_desc: "\"Our Opponents shall be crushed, under the might that is us. We shall never fall again, this is Luxembourg, we are the definition of Unity\" - An Anarchist Political Advisor, 1938"
LUX_anarchy_focus_24: "Anarchist Victory"
LUX_anarchy_focus_24_desc: "For too long have we been subjects, and with the success of the Revolution, have we proved that even in dire times, will countries like ours succeed. Lets come together, and spread what we started."




LUX_commie_focus_1: "The Workers Revolution"
LUX_commie_focus_1_desc: "The Workers have risen up, and the time has come for us to take action. We must take control of the nation, and create a new government, one that will be able to lead us to victory."
LUX_commie_focus_2: "Request Soviet Support"
LUX_commie_focus_2_desc: "The Soviets have long been allies of the communist cause, and now is the time to ask for their support. We must ask them for their support, and we will be able to take control of the nation."
LUX_commie_focus_3: "Request Soviet Industrial Support"
LUX_commie_focus_3_desc: "If we ask for industrial support, our country will grow stronger and will be able to grow faster."
LUX_commie_focus_4: "Request a United Attack"
LUX_commie_focus_4_desc: "If we manage to unite and attack key weak points of the current government, we will gain power, support, and most importantly, strength..."
LUX_commie_focus_5: "March on the Capital"
LUX_commie_focus_5_desc: "The rapid increase of Communism calls for action, action against the current government. We must march to victory, we must march till the end, we must show who we are. We shall end the suffering, and start a new age."
LUX_commie_focus_6: "A Revolutionary Zeal"
LUX_commie_focus_6_desc: "The time has come for Action, we must focus on the objective, on the revolution. Through this, we gain strength, we gain power, and we will be closer to a new dawn, a new age."
LUX_commie_focus_7: "Government infiltration"
LUX_commie_focus_7_desc: "We already have people inside the government, and we should use this to our advantage. Through this, we will be able to destroy the current government from the inside, and take control of the nation."
LUX_commie_focus_8: "Use Workers for Strength"
LUX_commie_focus_8_desc: "Workers are the backbone of our nation, they can be used for further strength. We have managed to gain their support, but now it is their turn."
LUX_commie_focus_9: "Through the Cracks"
LUX_commie_focus_9_desc: "We require much more support in our nation, as communism has spread through every part, it still seems as if we are not able to revolt against our oppressors. It is time to look at even our smallest mistakes, and through that, we will succeed."
LUX_commie_focus_10: "World Support"
LUX_commie_focus_10_desc: "Communism has spread throughout the world, and requesting it will surely be accepted. The Soviet Union is one country wanting to spread the ideology, and their help would improve our nation."
LUX_commie_focus_11: "Commume Support for Popularity"
LUX_commie_focus_11_desc: "The Support for Communism in our nation is large, and we must utilize it. If we do, then our support will drastically increase, not doing sp is fine, but this would make the revolution easier."
LUX_commie_focus_12: "Counter Government Actions"
LUX_commie_focus_12_desc: "In order to counter Government Actions, we should influence their Politics, simply inflitrating them. This will give us help in the short term, but we will still need to figure out the long term."
LUX_commie_focus_13: "Challenge the Government"
LUX_commie_focus_13_desc: "We have grown strong, it is a final strike that is needed, it is one last push. We have fought, we have challenged, and now we finish what we started."
LUX_commie_focus_14: "Victory in the Revolution"
LUX_commie_focus_14_desc: "We have won the Revolution, the game is over, and the stars shine at us. It is not that the stars aligned for us, we made them align."
LUX_commie_focus_15: "A Recovering Economy"
LUX_commie_focus_15_desc: "Our Economy has not only been wrecked by the Revolution, but by the great depression, it is time that we recover, and it is time for change..."
LUX_commie_focus_16: "Integrate our Promise"
LUX_commie_focus_16_desc: "The point of communism is that everyone is equal, every worker is equal, and no one is above another. It is time we appease the public, and give them what they want. This is communism after all..."
LUX_commie_focus_17: "Assasinate Political Opponents"
LUX_commie_focus_17_desc: "The Revolution has been won, and in order to secure our nation fully, the previous government shall be assasinated. The people may not support this, but it will secure the current government."
LUX_commie_focus_18: "A Communist Government"
LUX_commie_focus_18_desc: "The Revolution has long been over, and we have won. Look at us, a staple of determination, a message to the world. The are communist, we havee a communist government, and there is nothing they can do about it."
LUX_commie_focus_19: "Send Volunteers"
LUX_commie_focus_19_desc: "It is time to support some of our communist brothers, we shall help them be led to victory, and in return, communism grows around the world, just like it did in us."
LUX_commie_focus_20: "Eliminate the Upper Class"
LUX_commie_focus_20_desc: "The Upper Class is one thing that communism does not represent, and yet, it still exists. We must eliminate the upper class advantages, and with more equalization, people will see a large improvement."
LUX_commie_focus_20_tooltip: "§GYou will recover and improve your economy and country after 1 Year§!"
LUX_commie_focus_21: "Compensate with the Upper Class"
LUX_commie_focus_21_desc: "Despite an idea of communism, we cannot afford to eliminate the upper-class. The economic strain would be too large, and it would take years to recover and improve..."
LUX_commie_focus_22: "Request Soviet Research Support"
LUX_commie_focus_22_desc: "Our current research department is not as strong as we would like it to be. We also cannot develop it alone, and require support in order to develop our Nation."
LUX_commie_focus_23: "Socialist Science"
LUX_commie_focus_23_desc: "Our Nation has gotten more developed over the months, and it is time to introduce a new branch in Research, Socialist Research. This would help us in every sector of the economy, and would improve our nation drastically."
LUX_commie_focus_24: "Socialist Development"
LUX_commie_focus_24_desc: "Our Nation has gone through thunder and snow, but now we build our country, from the ruins of revolution and opposition. It is time to be strong, get stronger, and show our destined future."
LUX_commie_focus_25: "Communist Independence"
LUX_commie_focus_25_desc: "Our nation is one born through a simple agreement. We are a nation formed by a paper. We need to secure our indepence in order to stay a real nation, not one that is irreal."
LUX_commie_focus_26: "Soviet Intel Cooperation"
LUX_commie_focus_26_desc: "We need to increase Intel Cooperation with the Soviet Union in order to understand external politics better. It might just warn us of a coming storm."
LUX_commie_focus_27: "Unify Socialism"
LUX_commie_focus_27_desc: "Unification of Socialism is needed in order to have a stable political party. It will limti the power of all political parties, creating a country forged around unity."
LUX_commie_focus_28: "The Marx Proposal"
LUX_commie_focus_28_desc: "Our country has not been unified for a long time, however, the Marx Proposal aims to counter that. The law allows for the elimination of any opposing political party, giving more communist support in our nation. However, Political Parties would be more aggressive, and the moral question is unthinkable. Nethertheless, passing the law would be benificial."
LUX_commie_focus_29: "The Sun does not set on Luxembourg"
LUX_commie_focus_29_desc: "The Sun never sets on Luxembourg. We have fought through struggles unimaginable, and we have succeeded. Our nation shall never fold or fall to foreign influence, we will survive and thrive."
LUX_commie_focus_30: "Foreign Affairs"
LUX_commie_focus_30_desc: "As the world is descending into chaos, one thing has become clear. We must use foreign affairs to survive. Without a way to communicate to other nations, our nation could be at the detroment of others."
LUX_commie_focus_31: "War with Belgium"
LUX_commie_focus_31_desc: "In order to further advance our nation, it is required that we go to war with Belgium. This would significantly improve our economy if successful, and would give glory. But it comes with many risks..."
LUX_commie_focus_31_tooltip: "§YNote:§! Improving the §YPublic Force§! Division template will make this war very easy."
LUX_commie_focus_32: "Proven Glory"
LUX_commie_focus_32_desc: "The Soviets have developed us a lot, and supported us in our most dire moments, and it is time join then. We proved our glory against Beglium, and we can show more."
LUX_commie_focus_33: "Liberate the Dutch"
LUX_commie_focus_33_desc: "The Dutch government has long oppressed its own peoples, and it is time to liberate them from themselves. We shall give them what they want, and show the true glory of communism"
LUX_commie_focus_34: "Declare the Union of the Benelux"
LUX_commie_focus_34_desc: "For too long have we been thrown around, for too long have we been nothing but simply a minority. Today, that changes, we shall declare victory, we shall show everyone our true selves. Our dream of a united Benelux under a Red Flag has finally been achieved. We are no longer just Luxembourg, we are the Union of the Benelux."
LUX_commie_focus_35: "Influence the Benelux"
LUX_commie_focus_35_desc: "We have long struggled to fully spread communism in our nation alone, but now that the revolution is complete, an opportunity arises to influence the entire benelux."
LUX_commie_focus_36: "Protect Benelux Communism"
LUX_commie_focus_36_desc: "In order to further advance our influence in the Benelux, the requirement of protection for their political parties would significantly support the growth of communism. Not doing so would only hinder our process."
LUX_commie_focus_37: "Coup the Benelux"
LUX_commie_focus_37_desc: "We have increased support for communism in the Benelux for long enough, now it is time to force the issue. We shall show who we are, we shall eliminate other political parties, and we shall be in control of the Benelux."
LUX_commie_focus_38: "Support the French Coalition"
LUX_commie_focus_38_desc: "The French Communist Party is alread strong, the current french government sits on a thread of wire, with just a little added wheight, it will snap and the entire government will come crumbling down."
LUX_commie_focus_39: "The Final Snap"
LUX_commie_focus_39_desc: "The French Communist Party is alread strong, the current french government sits on a thread of wire, with just a little added wheight, it will snap and the entire government will come crumbling down."
LUX_commie_focus_40: "Create the Communist Bloc"
LUX_commie_focus_40_desc: "Our Influence has grown to something that is unimaginable, and we shall show our greatest achievement, communism. We shall spread this trophy all across Europe. Our ideology is one not impacted by foreign entities, so we shall introduce this socialist trophy to the rest of the world."
LUX_commie_focus_41: "Influence the Nordic Capitals"
LUX_commie_focus_41_desc: "We have already influenced the Benelux, and the French, now it is time to go further north. Our communist influence has always stemmed from the east, and now we shall bring it North. The Nordics are valuable allies, with an abundance of resources. If we exploit them, it shall be the greatest of our expenditures."
LUX_commie_focus_42: "The Nordic Union"
LUX_commie_focus_42_desc: "It is time, we shall unite the Nordics under one flag, we shall show our strength, we shall give fighting strength. It is time for a greater time, a greater nation."
LUX_commie_focus_43: "A Government Community"
LUX_commie_focus_43_desc: "The Communist Ideology stems out of one message, equality. How can our nation be equal without equality in every section of our nation. How can we be communist without being a community. We must unite together, under one government, and choose what is best for us together."
LUX_commie_focus_44: "Stay with Marx"
LUX_commie_focus_44_desc: "Yes, we cannot officially be communist without a communal government, but look everywhere else. The soviets, chinese communists, they are under one person. We need to stay together, under one person to rule us to victory..."
LUX_commie_focus_45: "The Industrial Front"
LUX_commie_focus_45_desc: "Our Nation has long been one of a minority, but we have proven ourselves through revolution. We have proven ourselves as more than a pimple of the face of Europe, we are Luxembourg, and now we prove it."
LUX_commie_focus_46: "A Greater Luxembourgish Idea"
LUX_commie_focus_46_desc: "We have expanded, we have recovered, and we have lasted. It is time to show our true selves, it is time to show who we are. The Greater Luxembourgish Idea shall be born!"
LUX_commie_focus_47: "Foreign Claims"
LUX_commie_focus_47_desc: "Our nation is a surrounded one, but we can grow. If we consider neighoring states equal to ours, they may join our side. It is time to bring official claims into action, it is time to grow our nation."
LUX_commie_focus_48: "New Citizens"
LUX_commie_focus_48_desc: "Luxembourg is a country of a small population, and introducing new people to our republic will result in greater people, greater nation, a great one."
LUX_commie_focus_49: "Colonisation"
LUX_commie_focus_49_desc: "A New world power is coming to the world stage, it is time to show our own nations glory, we shall prove our love for glory. Liberia, a long lasting democracy shall change, we will introduce communism, and we will prove our glory."
LUX_commie_focus_50: "Full integration of the Benelux"
LUX_commie_focus_50_desc: "Luxembourg requires full integration of the Benelux in order to keep control of our vast empire. Not doing this can result in grave consequences, regarding all political, social, and economic factors."
LUX_commie_focus_51: "Strike the French"
LUX_commie_focus_51_desc: "Through Victory, shall we eliminate every oppponent, through unity and strength, shall we show who we are. Through our will and determination, shall we determine who will win this war."
LUX_commie_focus_52: "Victorious Nation"
LUX_commie_focus_52_desc: "Through Victory, have we eliminated every oppponent, through unity and strength, have we shown who we are. Through our will and determination, have we determined who will win this war."
LUX_commie_focus_53: "A Message like the French"
LUX_commie_focus_53_desc: "The French Communist Party has promised solidarity, equality, and more, and so has our nation. It is time to introduce it, it is time to give the people what they want. This will be the final way to secure our people, their support, their liking."
LUX_commie_focus_54: "The True Red Menance"
LUX_commie_focus_54_desc: "Many consider the Soviet Union the Red Menance, but with our recent expansion, one thing has become clear, that has changed. Our aggression and further desire for expansion has made people regard us as the red menance, we will happily take that title, and use it."
LUX_commie_focus_55: "Increase French Freedoms"
LUX_commie_focus_55_desc: "For every man, deserves their own rights. Mans values are not determined by nationality, but rather by their actions. We shall give the French this, we shall show appreciation."
LUX_commie_focus_56: "The French People"
LUX_commie_focus_56_desc: "The French have long looked for a good government, a good people, and simply something new. Our government provides this, and we must show this to them. Integrating them will result in further greatness, and love through unity."
LUX_commie_focus_57: "Revolt Britain"
LUX_commie_focus_57_desc: "Our development in Intelligence, and in the Resistance of Britain has resulted in a revolt that we shall advantage of"

