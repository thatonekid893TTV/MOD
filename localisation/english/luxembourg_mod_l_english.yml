luxembourg_mod_idea_67: "Victory in the Benelux"
luxembourg_mod_idea_67_desc: "Luxembourg has long been a minor nation, one that is simply a pimple on the world map. However, our glory has grown to one of prestige, we have won the war in the Benelux, we have defeated our enemies. We are no longer a pimple, we are the Union of the Benelux!"
