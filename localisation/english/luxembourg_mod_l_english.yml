l_english:
LUX_GATHERING_STORM_DESC: "Luxembourg first existed in the year 963. However, the lands of which we owned, and the security of our Nation has not been secure until now. We have been united under the Banners of the Benelux, and until the 1842 Treaty with Prussia, we were not free. \nLuxembourg now stands inbetween the Great Powers, being a playground to test their new weapons. As a sandwiched Nation, we need to choose a side through times of neutrality, or else we will become a place of the main action. In times like these, it is the wisest to stand together, not as a pimple on the face of Europe, but as a Luxembourgish Population that stands together."

LUX_pierre_dupong: "Pierre Dupong"

