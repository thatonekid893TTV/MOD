#Events of Communist Uprisings
mod_event.26.t: "Communists attack weapon depots"
mod_event.26.d: "Communist forces have attacked the weapon depots in the south of the country. They have taken a lot of weapons, and are now preparing for further control of the nation."
mod_event.26.a: "Lets just hope they dont try and gain support from this!"
mod_event.27.t: "Communists Publicize on their success"
mod_event.27.d: "The Communists have publicized their success in the south of the country. They talked about their success in the attack of a weapons depot, and how they are gaining strength and will take over the nation."
mod_event.27.a: "what...did...I...say...?"
mod_event.28.t: "Communists Attack a Civilian Factory"
mod_event.28.d: "Communist forces have attacked a civilian factory in the south of the country. 12 Men were killed in the attack, and 2 were injured. People are outraged, and the government is trying to calm them down, promising that the perpatrators will be caught and punished. The factory itself did not suffer too much damage though."
mod_event.28.a: "Not my fault you guys wanted to rise up for absolutely no reason"
mod_event.29.t: "Protests in the Capital"
mod_event.29.d: "Protests have erupted in the capital, with people demanding better conditions and pay. This event was slightly fueled and supported by the Communists, but they are not the main reason for this. However, in a not very shocking turn of events, the Commune decided to take advantage from this and are trying to gain support."
mod_event.29.a: "Welp, this might just be hopeless."
mod_event.30.t: "Soviet Volunteers Spotted"
mod_event.30.d: "Soviet Volunteers have been spotted in the country, and are trying to help the Commune gain support in our Nation. They are trying to convince people that the Commune is the only way to go, and that they will help us in our fight against the oppressors."
mod_event.30.a: "and communism spreads..."
mod_event.31.t: "Soviet Volunteer Aggression"
mod_event.31.d: "After the Spotting of soviet Volunteers, one thing became clear, they had become an enemy. After arriving in the country, they have started to attack the government, causing instability and chaos in our nation..."
mod_event.31.a: "And Communism engulfs the nation..."

mod_event.32.t: "Soviet Volunteers Attack Factories"
mod_event.32.d: "Soviet Volunteers have attacked a civilian factory in the south of the country, in turn resulting in a weaker industry for our nation, but increasing communist support."
mod_event.32.a: "They grow stronger..."
mod_event.33.t: "Marching to the Capital"
mod_event.33.d: "Communist Supporters recently began a demonstration, going toward the capital, in order to support the communist cause. Communism is the only way to go, but it seems as if the government is going to try and stop them."
mod_event.33.a: "For the Commune, FORWARD MEN!"
mod_event.34.t: "Charles Marx"
mod_event.34.d: "Charles Marx, a communist, is already inside the government. He is a hero of Luxembourg, and a symbol of glory, getting him on our side would increase our support and strength, and decrease the support of the government."
mod_event.34.a: "Is he a descendant of Karl Marx?"
mod_event.35.t: "Luxembourg Requests Support"
mod_event.35.d: "With the recent increase in communist support in Luxembourg, they have asked us for support, wanting weapons, in order to increase their strength in Luxembourg. Should we give them support for a revolution that might not even happen?"
mod_event.35.a: "We should give them support, they are our allies after all."
mod_event.35.b: "Revolution does not always mean success."
mod_event.36.t: "Recieved Support"
mod_event.36.d: "We have received support from our communist allies, and in turn increasing our strength and support in Luxembourg. We are now more ready to take action."
mod_event.36.a: "Make sure this does not go to waste."
mod_event.37.t: "The Government Attacks Protesters"
mod_event.37.d: "Today in the morning, the government attacked communist supported protesters, who were marching along the streets of Luxembourg. 100 People were killed, and many people are angry, but also frightened. We have lost support, out of spite for the current government"
mod_event.37.a: "Where has democracy led us to?"
mod_event.38.t: "Government Strikes a Weapon Cache"
mod_event.38.d: "We have weapon caches stored all across Luxembourg, but, to our suprise, the government has attacked one of them. We lost around 200 Guns, and thats only of what we know of so far. It is a great victory for the Government and a Loss for us."
mod_event.38.a: "Democracy does not work when in chaos..."
mod_event.39.t: "Government Attacks Communist Officials"
mod_event.39.d: "Our Government has recently attacked Communist Officials who were meeting near the German Border. A Bomb was strapped under the car which resulted in their deaths. Though they were not critically important, people have began to doubt the communist dream after the attack, making this politically valuable."
mod_event.39.a: "Will the Anti-Revolution Spread?"
mod_event.40.t: "Anti-Strikes"
mod_event.40.d: "The Government has began Anti-Strikes against our revolution, creating discontent among our supporters. It took place at 12:06 today, along all the roads of luxembourg."
mod_event.40.a: "The People are fighting for a Government that does not work..."
mod_event.41.t: "Government Requests Foreign Support"
mod_event.41.d: "The Government of Luxembourg has recently requested foreign support for their fight against communism. This call was funden by Britain, France, Belgium, and Germany. This has in turn increased the support for Democracy, and has increased their strength against the fight against communism."
mod_event.41.a: "the revolution has become deadly..."
mod_event.43.t: "The Marx Proposal"
mod_event.43.d: "Our country has not been unified for a long time, however, the Marx Proposal aims to counter that. The law allows for the elimination of any opposing political party, giving more communist support in our nation. The only reason it was challenging to pass it was the repricusions. Political Parties would be more aggressive, and the moral question is unthinkable. Nethertheless, we passed the law."
mod_event.43.a: "I dont think this guy is a Marxist"
mod_event.44.t: "Revolt in Belgium"
mod_event.44.d: "A revolt in Belgium just took place, where people where not fond of the war, and decided to revolt against their Overlords. This has significantly helped us strategically, militarily, and in moral. Now the question is, if we win this war, what will they want. Do they want freedom or integration?"
mod_event.44.a: "Really helpful..."
mod_event.45.t: "Revolt in Belgium"
mod_event.45.d: "A revolt in Belgium just took place, where people where not fond of the war, and decided to revolt against their Overlords. This has significantly helped us strategically, militarily, and in moral. Now the question is, if we win this war, what will they want. Do they want freedom or integration?"
mod_event.45.a: "Really helpful..."
mod_event.46.t: "Revolt in Belgium"
mod_event.46.d: "A revolt in Belgium just took place, where people where not fond of the war, and decided to revolt against their Overlords. This has significantly helped us strategically, militarily, and in moral. Now the question is, if we win this war, what will they want. Do they want freedom or integration?"
mod_event.46.a: "Really helpful..."
mod_event.47.t: "Peace Treaty"
mod_event.47.d: "After the war with Belgium, it became clear that this war was not going to end. If we agree on a peace treaty, our country will be more stable, and so will theirs."
mod_event.47.a: "Great!!!"
mod_event.48.t: "The State of the Benelux"
mod_event.48.d: "After the revolution in the Benelux, our Government saw an opportunity to recieve payment for our troubles. We financed and mainly staged the communist revolution there. We should be the ones to reap the reward. Spreading communism is not the only goal in the world, there is more possibilites."
mod_event.48.a: "Great, now we get what we deserve"
mod_event.49.t: "The Nordic Union"
mod_event.49.d: "Through sheer struggle and truimph, our nation has managed to form the Nordic Union through the influence in the Nordics. Luxembourg has once again proven itself as a nation of glory and shine, now we have advanced as a nation itself, and through further glory, will we spread communism around the globe."
mod_event.49.a: "Luxembourg has proven itself once again"

mod_event.50.t: "Luxembourg Offers Protection"
mod_event.50.d: "Following a change in the Luxembourgish Foreign Policy, Luxembourg decided to introduce colonisation, hoping to bring pride and glory to its nation. Following this, they have offered us a formal offer for protection of our country. This event has many benifits, including development, and glory, but are we willing to give up our nation for something no more than a fantasy?"
mod_event.50.a: "Development and Glory is enough for me"
mod_event.50.b: "Their fantasies contradict logic"
mod_event.51.t: "Liberia accepts subjugation"
mod_event.51.d: "Following a change in our Foreign Policy, we decided to introduce colonisation, hoping to bring pride and glory to our nation. We had offered the Liberians a formal offer for protection of their country. And following this, the Liberians actually complied, but with a demand that they do not be exploited."
mod_event.51.a: "The Tide is Shifting..."
mod_event.52.t: "Liberia denies subjugation"
mod_event.52.d: "Following a change in our Foreign Policy, we decided to introduce colonisation, hoping to bring pride and glory to our nation. Following this, we have offered the Liberians a formal offer for protection of their country. The Liberians actually denied, thinking that we would introduce harsh laws against their people."
mod_event.52.a: "So we were humiliated"


