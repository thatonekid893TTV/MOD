lux_news.1.t: "Luxembourg Annexes the Moselland!"
lux_news.1.d: "In a surprising turn during the ongoing war with Germany, Luxembourgian forces have successfully pushed into and annexed the Moselland region. The small nation continues to prove itself on the battlefield, shocking the world with its bold territorial gains."
lux_news.1.a: "A bold move by Luxembourg."
lux_news.2.t: "King Leopold III Assassinated!"
lux_news.2.d: "Shocking news from Belgium: King Leopold III has been assassinated in what appears to be a politically motivated attack. The Belgian government has declared a state of emergency, and officials are scrambling to maintain order in the wake of the monarchs sudden death. Questions swirl about the identity of the perpetrators and the future of the Belgian monarchy, but it seems obvious that the assassination was done by the Luxembourgian government. The world watches closely as the situation unfolds."
lux_news.2.a: "A dark day for Belgium."
mod_event.25.t: "Movings into Belgium"
mod_event.25.d: "After the death of King Leopold III, the Belgian government has been thrown into chaos. The Luxembourgian government has taken advantage of this situation and has moved into Belgium, claiming the territory as their own. This move has sparked outrage from the Belgian people, who see it as an invasion of their sovereignty. But nevertheless, Belgium is now Luxembourg."
mod_event.25.a: "The Situation has changed drastically."
lux_news.3.t: "Luxembourg Annexes Belgium!"
lux_news.3.d: "In a move that has stunned the international community, the Luxembourgish Government has formally annexed the entirety of Belgium. With their armies marching through Brussels and Belgian officials either detained or exiled, Luxembourg now lays claim to a vast expansion of territory. World leaders are scrambling to understand how the once-neutral microstate managed to subdue its larger neighbor so swiftly. Many fear that this could signal a new chapter of aggression in Western Europe."
lux_news.3.a: "A shocking turn of events!"
lux_news.4.t: "Luxembourg turns Anarchist"
lux_news.4.d: "In a shocking turn of events, the inbalance and situation in Luxembourg resulted in Anarchism. The Government has been ousted, 1532 People have died, which only includes people reported. Luxembourg has no Government, Luxembourg has nothing, Luxembourg is anarchist"
lux_news.4.a: "What about Anarchist Spain?"
lux_news.5.t: "Adolf Hitler Assassinated"
lux_news.5.d: "Today, Adolf Hitler, the leader of the German Reich was assassinated. His death has sent shockwaves throughout the world, and has left many wondering what will happen in Germany. One thing is clear, the German People are in shock, some mourning his death. The is no confirmation on who was behind the assassination, but many believe it was done by the Luxembourgian Government. The world watches closely as the situation unfolds."
lux_news.5.a: "A dark day for Germany."
lux_news.5.b: "Rest in peace Adolf"
lux_news.6.t: "Hitler Survives Assassination Attempt"
lux_news.6.d: "Today, 20 People who infiltrated the German Government were arrested 10 minutes after an assassination attempt. The attempt was orchestrated by presumably the Luxembourgian Government. Adolf Hitler, the target of the attack survived, and has vowed to bring those responsible to justice. The world watches closely as the situation unfolds."
lux_news.6.a: "The Unstoppable nearly stopped"
lux_news.6.b: "They will pay for this"
lux_news.6.c: "We were so close"
lux_news.7.t: "Germany in Civil War"
lux_news.7.d: "Communist Support in Germany has slowly been rising over the last few months. Today, fighting occured between the National Communist Forces, and the German Army. The Germans have also declared a state of emergency, where they are prioritizing the war over anything else. Communists have seized control of the Ruhr, and Hamburg Areas, but there are other pockets of resistance that might result in further conflict."
lux_news.7.a: "The Fire Rises"
lux_news.7.b: "We shall bury everyone to the Ground"
lux_news.7.c: "Our Revolution will succeed"
lux_news.8.t: "Luxembourg Intervenes in the German Civil War"
lux_news.8.d: "Luxembourg has declared that they intervene in the German Civil War. Luxembourgish Troops have been spotted in communist controlled areas, and they have began military operations against the German Reich.\n\nHowever, unlike the Spanish Civil War, Luxembourg has recieved international condemnation. Countries all around the world have called for an end of foreign influence in internal politics, the reason being the political weapon a civil war provides. However, one thing still stands, Luxembourg will not withdraw, they will attempt to beat the German Giant."
lux_news.8.a: "An Unfair Intervention"
lux_news.8.b: "We shall burn them too"
lux_news.8.c: "The Germans shall be vaporized"

LUX_capitulated_1: "Prepare for the End"
LUX_capitulated_1_desc: "We have gone through struggles, and through fire. Our Nation, is one of pride, but we may not be able to resist the incoming sound. The war will go on till the guns are silent, we will win this war, no matter what."
LUX_capitulated_2: "Create a Resistance Industry"
LUX_capitulated_2_desc: "The End is near, our enemies have defeated many nations, and we are in the chopping block. It is time that we develop an industry that will be able to resist these threats after the war."
LUX_capitulated_3: "Increase resistance in our Home"
LUX_capitulated_3_desc: "Through Propaganda in Luxembourg, we may be able to revolt against our oppresors, not even much is needed."
LUX_capitulated_3_tooltip: "This focus §Gincreases§! Resistance in Luxembourg."
LUX_capitulated_4: "Revolt"
LUX_capitulated_4_desc: "Through revolting against our owners will we be able to win this war. We have fought for a long time, it is unmask the revolution, and strike when they least expect. TO VICTORY."

mod_event.24.t: "The rising of discontent in Luxembourg"
mod_event.24.d: "Through Propaganda from the Luxembourgish Government, resistance has increased in Luxembourg. But who do they think they are, proviking the Tiger."
mod_event.24.a: "Great, finally a minor challenge"
mod_event.1.t: "Workers Rise Up!"
mod_event.1.d: "Today, 40000 workers rose up in Luxembourg. The current government, the Bech Ministry, was unable to do anything against this, and has therefor backed down. The workers have demanded better working conditions, and have demanded more rights. However, after the years of the Great Depression, our country has been unable to afford simple consumer goods, and having this plague our nation is doing nothing but hurting us. Other political parties in our nation are bound to take action on this unmisable opportunity, in turn creating further division. So the question arises, whether we will kneel to the workers demands, or if we will fight them, risking our nation as a whole.  "
mod_event.1.a: "Is this the end?"
mod_event.2.t: "The Law for the Defence of the Political and Social Order"
mod_event.2.d: "This amendment sought to ban political parties that threatened democracy. Specifically, we designed to outlaw the Communist Party of Luxembourg (KPL) and restrict far-right movements. Our Prime Minister, Joseph Bech, argued that communist agitation posed a risk to the countrys stability. However, the proposal sparked intense political debate and opposition, particularly from the Labour movement and the Communist Party itself. Critics saw it as an attack on political freedoms. We failed to pass the amendment, and the Communist Party was never banned."
mod_event.2.a: "Could things get any worse for us?"
mod_event.3.t: "Political Instability"
mod_event.3.d: "We have been informed of the tensions building in our country. The Communist, and Fascist Political Parties, who have long opposed us, have been growing ever more violent. This has resulted in one thing, we must solve this issue by any means. If it is by law, or if it is by force, the way we do it simply must work. Otherwise, the demise wont just be of our party, but possibly our nation."
mod_event.3.a: "Bro, im actually gonna rage out"
mod_event.4.t: "The Formation of the Benelux"
mod_event.4.d: "We have been informed that Luxembourg, has recently united with Belgium, and with the Netherlands, created the Benelux. We have fought struggle, political tensions, and far more. But through all the fire, arose a nation, proud of its heritage, a small nation, and one that will change history for the greater good. Long live Luxembourg."
mod_event.4.a: "Whos the small one now?"
mod_event.5.t: "The Law for the Defence of the Political and Social Order has failed"
mod_event.5.d: "Today, Joseph Bech resigned. The Leader who brought us through hell, has resigned. This happened during the attempt to pass The Law for the Defence of the Political and Social Order, which would allow him to ban any political party he believed to be a threat to our nation. This has resulted in political tensions, and all parties attempting to seize power. Queen Charlotte accepted Joseph Bechs proposal for a resignation and appointed Dupong as Prime Minister. This one event will determine our future."
mod_event.5.a: "I swear if anything gets worse, im actually gonna take a gu-."
mod_event.6.t: "Luxembourg Annexes the Moselland"
mod_event.6.d: "We have recently declared that the Moselland! Despite our small size, we have proven to be a formidable obstacle, and through determination, have annexed the Moselland, a well deserved reward. The war is currently going to our favor, but we must continue the military effort, and support is needed. Our Government has in turn propagized this opportunity, and lets hope this is the last war."
mod_event.6.a: "LONG LIVE LUXEMBOURG"
mod_event.7.t: "Queen Charlotte takes power"
mod_event.7.d: "After large strikes plagued our nation, the Bech Ministry was in shambles, unsure of what to do. Incompetence by Joseph Beck and his ministers has resulted in Queen Charlotte taking power. She hopes to restore democracy, but the strikes might force her to stay in power to try and solve it herself. However, solving it is an issue of itself, the communists have expanded the strikes to plague the entire nation, and other political parties are attempting to seize this opportunity. One thing is clear however, and that is that only time will tell..."
mod_event.7.a: "Long Live the Queen, i hope..."
mod_event.7.b: "The Days of Monarchy are over, and the days of Communism are here."
mod_event.8.t: "The Queen Attempts to reintroduce Democracy"
mod_event.8.d: "Today, the day some have been dreading, and some have wanted, the Queen requested that Democracy would be returned to the nation. However, Queen Charlotte has been succsesful and is a far better candidate than anyone else in the democratic government. She has put it up to a vote, if the people vote for Queen Charlotte, she shall stay in power. If not, then it is time for elections... ."
mod_event.8.a: "The Queen Shall Stay"
mod_event.8.b: "She promised them Democracy, they shall have Democracy."
mod_event.9.t: "An Interesting Event"
mod_event.9.d: "Adolf Hitler, our ally, has recently hinted towards the fact that we have been using them in order to help support our Government. However, we have had many political victories, not with the Germans but with ourselves, and we have never required German help. Despite this, Hitler has hinted that the Germans become our Overlord. Despite this, this was not an official diplomatic statement, meaning that we do not need to reply to the Germans, however, it is clear that they will make demands soon. And denying might lead to deaths that we can not afford."
mod_event.9.a: "Well, if he wants war, give him war." 
mod_event.9.b: "This shouldnt affect us too badly"
mod_event.10.t: "German Troops stack up on our border"
mod_event.10.d: "German Troops have recently been stacking up at our border... we have also caught many Germans in our own nation. It is likely that Hitler will send us a diplomatic ultimatum, and that we will end up at war with Germany, this has many consequences. There are only a few hopes, firstly, that this does not happen or that we somehow win the war."
mod_event.10.a: "He has descended to absolute savagery..."
mod_event.11.t: "Peace with the West"
mod_event.11.d: "After lots of war, lots of damage, we have reached an agreement. Our initial succsess in the war was marvelous, but as we are slowly facing more enemies, it seems as peace was the final option of our nation. The Allies, desperate for peace, have agreed to give up some lands in exchange for this peace... lets hope it lasts."
mod_event.11.a: "Great, now we still have more enemies to face"
mod_event.12.t: "Burundi Uprisings Beaten"
mod_event.12.d: "After our annexation of Belgium, the people in Burundi had risen up. Seeing an opportunity for freedom, we could have either let that happen, or not. But one thing is for sure, we did not let this happen."
mod_event.12.a: "Get cooked buddy"
mod_event.13.t: "Burundi Uprisings Continue"
mod_event.13.d: "After the annexation of Belgium, the people there had risen up. In an attempt to stop this, we tried to use military force, but this has not worked. The people are still rising up, and we have no choice but to send more troops to Burundi. This is a costly war, and we must end it soon."
mod_event.13.a: "Ahh hell nah bruh"
mod_event.14.t: "The Colonies"
mod_event.14.d: "After the annexation of Belgium, People in Burundi had risen up. They seeked an opportunity to break away for a long time, and this is the best opportunity they have. However, the Colonies were a large part of the Belgian, and now our economy. If we lose this crown juwel, we will lose much that we cannot afford. We have two options, either we can send troops to Burundi, and try to stop the uprisings, or we can let them go. This choice will decide history, for good, or bad."
mod_event.14.a: "Should we do a Belguim?"
mod_event.15.t: "The Burundi Revolt"
mod_event.15.d: "Our Government has not taken action on the Burundi Uprisings. And fighting has occured, the new nation has already taken many lands, and we have no choice but to send troops to Burundi. This is a costly war, and we must end it soon."
mod_event.15.a: "We have no choice but to send troops"
mod_event.16.t: "The End of the Burundi Uprisings"
mod_event.16.d: "After the uprisings in Burundi, we have finally managed to beat them. The people have been beaten back, and we have taken control of the situation. However, this has come to much cost, with the region being far more destroyed than it needed to be."
mod_event.16.a: "Atleast we beat them"
mod_event.17.t: "The End of the Burundi Uprisings"
mod_event.17.d: "After the uprisings in Burundi, we have finally managed to beat them. The people have been beaten back, and we have taken control of the situation. However, this has come to much cost, with the region being far more destroyed than it needed to be."
mod_event.17.a: "Atleast we beat them"
mod_event.18.t: "Loss in the Congo"
mod_event.18.d: "Our military failures have resulted in the loss of a major part of our colonnies. This has created political tensions, and we will have a hard time recovering."
mod_event.18.a: "We have lost a major part of our colonies"
mod_event.19.t: "The Congo"
mod_event.19.d: "After our occupation of the Congo, it is time to set up a puppet state. It is taking too many resources, and this would heavily benifit us."
mod_event.19.a: "Good"
mod_event.20.t: "Peace with the Germans"
mod_event.20.d: "After the long and hardfought war, the German and Luxembourgish Authorities have finally reached an agreement, one that favors us heavily. This war has expended many of our resources, but the addition of new territories will make up for this. However, with the Wars end, it is clear that we will face more enemies, maybe even the Germans themselves."
mod_event.20.a: "Good, but can we trust them?"
mod_event.21.t: "Compliance in West Germany"
mod_event.21.d: "With the Victory of the war against the Germans, we have been able to annex a large part of Germany, but with it, comes responsibility, resistance, and more. In an effort to control this, we have created extensive propaganda, and more. This has reduced resistance and increased compliance, and we might be able to integrate the people there."
mod_event.21.a: "The end of death, the start of life"
mod_event.22.t: "Compliance in South Germany"
mod_event.22.d: "With the Victory of the war against the Germans, we have been able to annex a large part of Germany, but with it, comes responsibility, resistance, and more. In an effort to control this, we have created extensive propaganda, and more. This has reduced resistance and increased compliance, and we might be able to integrate the people there."
mod_event.22.a: "The end of death, the start of life"
mod_event.23.t: "The Fascist Retreat"
mod_event.23.d: "After we created the national assembly, it was clear that it was an unstable agreement. Our main goal was to trick them from the start, with this operation, we quickly eliminated all fascist opposition, and have in turn, created a stable government.
mod_event.23.a: "Now I can finally sleep"
mod_event.42.t: "Recovered Economy"
mod_event.42.d: "After we eliminated the upper-class, around a year ago, our economy has not managed to improve. However, with the adjusted life styles, and a greater control over the economy, it has seemed as if the economy has fully improved. People are in support of our Government, and enjoy a new and improved life"
mod_event.42.a: "Communism is always an answer..."
mod_event.53.t: "Peace with the Germans"
mod_event.53.d: "After the long and hardfought war, the German and Luxembourgish Authorities have finally reached an agreement, one that favors us heavily. This war has expended many of our resources, but the addition of new territories will make up for this. However, with the Wars end, it is clear that we will face more enemies, maybe even the Germans themselves."
mod_event.53.a: "Good, but can we trust them?"
mod_event.54.t: "Revolt in Britain"
mod_event.54.d: "Through our War, we have managed to suffiently fund the resistance in Britain. We have also managed to use our intelligence to our advantage, the war with the United Kingdom is a long one, lets end it"
mod_event.54.a: "Countries shall fold to us"
mod_event.55.t: "Revolt in Germany"
mod_event.55.d: "The Germans have always loved their Government, but through the actions of war in one that they are now losing, the Germans have grown far less enthusiastic for the war in Germany. Through internal connections, funding, and a gathering, we have managed to create a large enough revolt that it actually takes part in this war."
mod_event.55.a: "A Revolt they Deserved"
mod_event.56.t: "The Queen"
mod_event.56.d: "The Queen is an important political figure for our nation, and the monarchy of Luxembourg has been for years on end. But it has come to the point where we are not sure we need her, she tried stopping our expansion, yet she is still loved by the People of Luxembourg. Shall we give her pitty, or shall we finish what we started?"
mod_event.56.a: "Monarchy can exist in times like these"
mod_event.56.b: "Lets finish what we started"
mod_event.57.t: "Uprisings"
mod_event.57.d: "Our Nation has been damaged through uprisings in our Nation. The Uprisings are orchestrated by other nations and by the opposition. We would need to trial our opposition in order to end all uprisings, and secure an anarchist future. Not doing so will continuesly damage our nation, to a point of no possible return"
mod_event.57.a: "Luxembourg, idk what to say, lowkey"
mod_event.58.t: "The Masses"
mod_event.58.d: "After seizing power, it is time to demostrate it. We shall show everyone our true strength, the true thing we stand for. People should be able to live for themselves, and our government provides that."
mod_event.58.a: "A True Anarchist State"
mod_event.59.t: "Revolt in France"
mod_event.59.d: "The French have always hated their Government, and through the actions of war in one that they are now losing, the French have grown far less enthusiastic for the war against us. Through internal connections, funding, and a gathering, we have managed to create a large enough revolt that it actually takes part in this war."
mod_event.59.a: "A Revolt they Deserved"
mod_event.60.t: "Compliance in Northern France"
mod_event.60.d: "Through focusing on our Nation, are we able to integrate the people of France into the great Nation of Luxembourg. This will give us industrial strength, a political weapon, social unity, and more. The Integration is also to be celebrated. Lets do this, lets grow our country."
mod_event.60.a: "Great..."
mod_event.61.t: "Compliance in the Middle of France"
mod_event.61.d: "Through focusing on our Nation, are we able to integrate the people of France into the great Nation of Luxembourg. This will give us industrial strength, a political weapon, social unity, and more. The Integration is also to be celebrated. Lets do this, lets grow our country."
mod_event.61.a: "Great..."
mod_event.62.t: "Compliance in the South of France"
mod_event.62.d: "Through focusing on our Nation, are we able to integrate the people of France into the great Nation of Luxembourg. This will give us industrial strength, a political weapon, social unity, and more. The Integration is also to be celebrated. Lets do this, lets grow our country."
mod_event.62.a: "Great..."
mod_event.63.t: "Compliance in the Occupied Territories"
mod_event.63.d: "Through focusing on our Nation, are we able to integrate the people of our occupied territories are integrated into the great Nation of Luxembourg. This will give us industrial strength, a political weapon, social unity, and more. The Integration is also to be celebrated. Lets do this, lets grow our country."
mod_event.63.a: "Great..."
mod_event.64.t: "Compliance in Eastern Germany"
mod_event.64.d: "With the Victory of the war against the Germans, we have been able to annex a large part of Germany, but with it, comes responsibility, resistance, and more. In an effort to control this, we have created extensive propaganda, and more. This has reduced resistance and increased compliance, and we might be able to integrate the people there."
mod_event.64.a: "The end of death, the start of life"
mod_event.65.t: "Luxembourg Demands Alsace-Lorraine"
mod_event.65.d: "Through the Luxembourgish recent expansion, Luxembourg has demanded full control of Alsace-Lorraine, hoping to restore the territories of the Holy Roman Empire, however, through this demand we have grown increasingly under threat. Shall we attempt to stop the incoming wave, or shall we let it beach?"
mod_event.65.a: "There is nothing we can do..."
mod_event.65.b: "Napoleon never gave up, so why shall we?"
mod_event.66.t: "France cedes Alsace-Lorraine"
mod_event.66.d: "Through our recent expansion, and the restoration of the Holy Roman Empire, it has become clear that we need to face a long time opponent. France. After we demanded full control of Alsace-Lorraine, they have suprisingly given it up, without a fight. The heavy fortifications there prove to be strategic, and our land has grown considerably..."
mod_event.66.a: "I guess it was just meant to be"
mod_event.67.t: "France stays persistent"
mod_event.67.d: "Through our recent expansion, and the restoration of the Holy Roman Empire, it has become clear that we need to face a long time opponent. France. After we demanded full control of Alsace-Lorraine, they have unsuprisingly rejected the offer. The heavy fortifications there prove to be strategic, it would be unwise for them to give it up"
mod_event.67.a: "Incomes the wave..."
mod_event.68.t: "Luxembourg Demands Cataluna"
mod_event.68.d: "We just had a civil war and now this? Should we accept this to a puny nation that we still could end up in a war with, or shall we stay persistent to hopefully win?"
mod_event.68.a: "Two Wars is too much, we cant afford another one."
mod_event.68.b: "Id rather be the anvil than the hammer"
mod_event.69.t: "Spain cedes Cataluna"
mod_event.69.d: "Through our demands, have we managed to gain control of Cataluna. We shall show them who we are now, we are VICTORIOUS."
mod_event.69.a: "Great, now what else?"
mod_event.70.t: "Spain stays persistent"
mod_event.70.d: "Despite our clear strength and honor, Spain has stayed persistent even through a losing war. We have them on their knees, it is simply to much territory that they would lose."
mod_event.70.a: "I guess we need to take it by force."
mod_event.71.t: "Revolution"
mod_event.71.d: "Through a revolution will we be succsesful. We will be able to counter any attempt to counter our expansiom. Now that we have gathered enough strength, it is time to win this war to the utmost, to the destruction of the ones who oppose us. TO VICTORY."
mod_event.71.a: "We have planning, we have strength, we just need will..."
mod_event.72.t: "Revolutionary Army"
mod_event.72.d: "Through a revolution will we be succsesful. We will be able to counter any attempt to counter our expansiom. Now that we have gathered enough strength, it is time to win this war to the utmost, to the destruction of the ones who oppose us. Our Military has also grown due to peoples enthusiasm in Luxembourg, we shall win against the Fascist Threat"
mod_event.72.a: "Now we have will"
mod_event.73.t: "Germany Remilitarizes the Rhineland"
mod_event.73.d: "Germany has taken a bold step by sending troops into the demilitarized Rhineland, directly violating the Treaty of Versailles. This show of strength has shocked Europe and impressed many within Luxembourg, particularly those who admire German resolve."
mod_event.73.a: "A bold move by the Germans."
mod_event.74.t: "Revolt in Louisiana"
mod_event.74.d: "Through our War, we have managed to suffiently fund the resistance in the United States of America. We have also managed to use our intelligence to our advantage, the war with the United Kingdom is a long one, lets end it"
mod_event.74.a: "Countries shall fold to us"
mod_event.75.t: "The Question of the Queen"
mod_event.75.d: "The Queen is an important political figure for our nation, and she has influenced the politics of our Nation for as long as we know it. But with the introduction of a new government, we have to choose whether we should accept her, or if we should end this long standing fiasco."
mod_event.75.a: "Monarchy can exist in times like these"
mod_event.75.b: "Lets finish what we started"
mod_event.76.t: "The Queen wants an Imperial Palace"
mod_event.76.d: "The Queen has recently requested that an imperial palace be built in Luxembourg. This would be a large investment, but it would also show the power of the monarchy, and the power of our nation. However, this is a large investment, and we would need to see if this is worth it. The endorsement of the Monarchy would also be against our philosephy."
mod_event.76.a: "I guess we can build it"
mod_event.76.b: "The Master is not the Slave to the Servant"
mod_event.77.t: "The Queen Secretly Holds a Speech"
mod_event.77.d: "The Queen has suprisingly held a secret speech. Thousands of people showed up, influenced by her use of propaganda. Out of the thousands that went, there were only a few hundred that were loyal to us. She secretly has more support than we throught, and this is a problem. We need to do something about this, or we will lose our power."
mod_event.77.a: "Ohh no... we should give her a warning"
mod_event.78.t: "The Queen holds Protests"
mod_event.78.d: "The Queen has recently held protests in Luxembourg, thousands showed up. This is a problem, as she has more support. Our Government sent out soldiers, and to our dismay, people we killed..."
mod_event.78.a: "She chose this"
mod_event.79.t: "Luxembourg increases its Autonomy"
mod_event.79.d: "Despite the tiny Nation of Luxembourg being under our influence, it has recently been reported that they have increased their autonomy. This is a bold move, and one that we will not take lightly. We will have to see how this plays out, but it is clear that Luxembourg is trying to assert its independence."
mod_event.79.a: "Lets end their independence"
mod_event.80.t: "We are Free"
mod_event.80.d: "After a long and hard fight for independence, we succeeded, we are free. However, this has come at a cost. Germany is at the gates of our nation, and we have no choice but to fight them. We shall bring the fight to close, we shall win, and shall thrive."
mod_event.80.a: "For Luxembourg!!!"
mod_event.81.t: "Hitler Assassination Attempt"
mod_event.81.d: "We have recently attempted to assassinate Adolf Hitler, who is the Leader of Germany. Our Nation has been under threat, it is time to end this threat. We have attempted to assassinate him through an operation that was hastly planned, and it was a..."
mod_event.81.a: "A SUCCESS"
mod_event.81.b: "A FAILURE"
mod_event.82.t: "Uprising in France"
mod_event.82.d: "We have gathered people, weapons, and resistance in France. The French have hated the overrule of the German Government. Now we can sleep tightly knowing that the Germans are dealt with. They will be defeated."
mod_event.82.a: "Liberation to the Greatest"
mod_event.83.t: "Uprising in Holland"
mod_event.83.d: "We have gathered people, weapons, and resistance in Holland. The Dutch have hated the overrule of the German Government. Now we can sleep tightly knowing that the Germans are dealt with. They will be defeated."
mod_event.83.a: "Liberation to the Greatest"
mod_event.84.t: "To Victory"
mod_event.84.d: "We will advance and expand through every hurdle that counters us. We will not stop until we have achieved our goal, and that is to create a new world order, one that is based on the principles of our Ideology. We have gone through hell, and we will do so again, with fanatisism."
mod_event.84.a: "To Victory!"
mod_event_84_flag: "Has been at §Ywar§! with the §Y[ENG.GetNameWithFlag]§!"
mod_event.85.t: "Luxembourg Influences our Politcs"
mod_event.85.d: "People have been armed and people have began supporting Communism in our Nation. They are influencing the future, and our pride. We shall not let them control our future. We shall prove the world wrong."
mod_event.85.a: "damn them"
mod_event.86.t: "Revolutionaries Strike Sachsen"
mod_event.86.d: "We are a small Nation with big dreams, mainly to reunify the German Lands, however, with the current issue of a losing war, we wont be able to achieve. However, our communist militias in Sachsen have realized this issue, and have promised to strike soon, and now they have."
mod_event.86.a: "This will not go to waste"
mod_event.87.t: "Finance New Units"
mod_event.87.d: "We are a small Nation with big dreams, mainly to reunify the German Lands, however, with the current issue of a losing war, we wont be able to achieve. We have recieved funding from the Luxembourgians to create new units, and we must take advantage of this for our own sake."
mod_event.87.a: "This will not go to waste"
mod_event.88.t: "Finance New Units"
mod_event.88.d: "We are a big Nation with big dreams, mainly to reunify the French Lands, however, with the current issue of a losing war, we wont be able to achieve. We have recieved funding from the Luxembourgians to create new units, and we must take advantage of this for our own sake."
mod_event.88.a: "This will not go to waste"
mod_event.89.t: "Revolutionaries Strike Var"
mod_event.89.d: "We are a small Nation with big dreams, mainly to reunify the German Lands, however, with the current issue of a losing war, we wont be able to achieve. However, our communist militias in Var have realized this issue, and have promised to strike soon, and now they have."
mod_event.89.a: "This will not go to waste"
mod_event.90.t: "Luxembourg wants to Influence our Politics"
mod_event.90.d: "Luxembourg has committed itself to increase communism in foreign Nations, and now they have arrived to South America, should we accept their demands, we will be at risk of turning communist, if not, they will have war justifications. We need to be tactical"
mod_event.90.a: "I guess we have no choice then"
mod_event.90.b: "A tiny nation should not have this much influence"
mod_event.91.t: "[FROM.GetNameDefCap] Disallows Political Influence Operations"
mod_event.91.d: "Our agents operating in [FROM.GetNameDef] to strengthen the communist movement have been noticed by the country's leadership. We have received a stern letter from them demanding we stop this operation at once. It seems that us informing the workers of their rights in good intent has revealed [FROM.GetLeader]'s true side as an enemy of the common man."
mod_event.91.a: "We must liberate our [FROM.GetAdjective] comrades!"
mod_event.92.t: "[FROM.GetNameDef] Allows our Influence"
mod_event.92.d: "After a long period of growing communist sentiments it seems that the [FROM.GetAdjective] proletariat has grown weary of waiting for a peaceful change of government. Our influence has greatly influenced the future, we have succeeded."
mod_event.92.a: "For the Strength of our Nation!"

