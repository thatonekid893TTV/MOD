LUX_alt_focus_63_desc: "We have been subjects for too long, it is time to bring the war, lets show them how its done."
LUX_alt_focus_64: "The Final Message"
LUX_alt_focus_64_desc: "We have won this war through strength and might, lets prove ourselves in the long term, as our nation approaches greatness, not at slow speeds. But at one of a great magnitude, VIVE LA LUXEMBOURG."
LUX_alt_focus_65: "Integration of Northern France"
LUX_alt_focus_65_desc: "Through integration of industry and people in Northern France can we grow our nation and prove glory. Also being beneficial politically, proving out long lasting strength."
LUX_alt_focus_66: "Integration of the Middle of France"
LUX_alt_focus_66_desc: "Through integration of industry and people in the Middle of France can we grow our nation and prove glory. Also being beneficial politically, proving out long lasting strength."
LUX_alt_focus_67: "Integration of the South of France"
LUX_alt_focus_67_desc: "Through integration of industry and people in the South of France can we grow our nation and prove glory. Also being beneficial politically, proving out long lasting strength."
LUX_alt_focus_68: "The New Citizens of Luxembourg"
LUX_alt_focus_68_desc: "THrough our Victory in the war, it has become clear that we need further integration of them. We have won the war against our enemies, Luxembourg has become something great. Lets continue our expansion into further territories, lets prove ourselves."
LUX_alt_focus_69: "Luxembourgish Irredentism"
LUX_alt_focus_69_desc: "\"We must focus on the true goal of Luxembourg, nations all oppose our expansion, and it is our goal to beat them, no matter the cost, no matter the loss...\" - Queen Charlotte, after expansion against enemies"
LUX_alt_focus_70: "Prepare for War"
LUX_alt_focus_70_desc: "The war is coming, we must be prepared to win the upcoming war for the future of Luxembourg, for the future of our Nation, for the future of us."
LUX_alt_focus_71: "Revenge for the Rhine Crisis"
LUX_alt_focus_71_desc: "Germany and France have long had tensions regarding the Rhine, and its territorial alignment. Lets settle this dispute long a for all, we have Alsace-Lorraine, so lets expand this into the Rhine. FOR LUXEMBOURG."
LUX_alt_focus_72: "Lasting War"
LUX_alt_focus_72_desc: "The current war is one of Attrition, and the enemy is becoming increasingly demoralized being unable to break our strong might and fury. So it is time to take advantage of the situation, we shall eliminate all their troops, through propaganda means alone."
LUX_alt_focus_72_tooltip: "This focus gives §Gnegative§! effects to §Yany country§! that has war with you"
LUX_alt_focus_73: "Integration of East Germany"
LUX_alt_focus_73_desc: "We need to integrate eastern Germany for effective control of the nation. This will increase our strength, prosperity, and control over Europe."
LUX_alt_focus_74: "Prepare for War"
LUX_alt_focus_74_desc: "The war is coming, we must be prepared to win the upcoming war for the future of Luxembourg, for the future of our Nation, for the future of us."
LUX_alt_focus_75: "Take it back!"
LUX_alt_focus_75_desc: "The Germans have long been enemies of the French, and with us now owning them, it should be our duty to take back the territory we deserve. Lets destroy France, no matter the cost."
LUX_alt_focus_76: "Offensive into France"
LUX_alt_focus_76_desc: "Through a strong thrust through France will we be able to break the French Hegemony over their own territory. We shall prove ourselves once again, and overcome this large hurdle that stops further advances from us."
LUX_alt_focus_77: "Strike the Rhine"
LUX_alt_focus_77_desc: "Through striking the Rhine, can we eliminate the German Units stationed there, and increase our land coverage. We will be closer to Victory than ever."
LUX_alt_focus_78: "The Final Threat"
LUX_alt_focus_78_desc: "The United Kingdom has long opposed our rule, it is time to end their regime, we shall prove ourselves as a nation of strength, lets finish her."
LUX_alt_focus_79: "From the inside"
LUX_alt_focus_79_desc: "Uhh, weird name lol. But anyways, ohh yeah. The United Kingdom has not been the more instable of Nations, but through financement of revolutionaries, rallies, and intel, shall we win against them."
LUX_alt_focus_80: "Telegraph the Message"
LUX_alt_focus_80_desc: "It is time to end this war once and for all, lets bring them the war that they have wanted this entire time. TO VICTORY LUXEMBOURG."
LUX_alt_focus_81: "Telegraph the Message"
LUX_alt_focus_81_desc: "It is time to end this war once and for all, lets bring them the war that they have wanted this entire time. TO VICTORY LUXEMBOURG."
LUX_alt_focus_82: "The Sun never Sets"
LUX_alt_focus_82_desc: "We have won the wars, we are Luxembourg, and it is time to fully prove ourselves in the next upcoming wars. It has been hard, and much has been lost. However, the deeds of the graves of the unknown soldiers will prove to be immortal."
LUX_alt_focus_83: "Eastern Allies"
LUX_alt_focus_83_desc: "We need to increase diplomatic relations with eastern countries, in order to prepare for future war with the Soviet Union. It will be a good staging ground for the future."
LUX_alt_focus_83_tooltip: "§YEvery Country§! that borders the §YSoviet Union§! and that is on §YEurope§! will be added to our faction."
LUX_alt_focus_83_tooltip2: "Current Effects:"
LUX_alt_focus_84: "The Holy Roman Empire"
LUX_alt_focus_84_desc: "The Holy Roman Empire has long been gone, its dream is no longer known, it has been too many years, too many decades. The dream still lives in a few minds and hearts of those who have committed their lives to it. We shall prove to them that their dream was worthy, that their dream was reasonable."
LUX_alt_focus_85: "Construct an Imperial Palace"
LUX_alt_focus_85_desc: "Through constructing an imperial palace, will we be able to reliquinsh national pride, and unity. Not only through our own homeland states, but through all other territories, let this be the greatest national pride."
LUX_alt_focus_86: "The Moscow Tragedy"
LUX_alt_focus_86_desc: "Moscow is the center of the Russian menance, we must eliminate this threat for our own survival, and to expand the territories of our land."
LUX_alt_focus_87: "Extend the Offensive"
LUX_alt_focus_87_desc: "Through extending an offensive against the Soviet Union, will we be able to eliminate the Soviet Hegemony from the planet."
LUX_alt_focus_88: "Orleanist Luxembourg"
LUX_alt_focus_88_desc: "Orleanist Luxembourg shall expand into foreign territory, we shall triumph in the faces of the enemy, lets bring justice for the perpetrators of the end of this long lost Nation."
LUX_alt_focus_89: "The Roman Empire"
LUX_alt_focus_89_desc: "Our Nation has had potential beyond our comprehension. We have established the Holy Roman Empire, and are looking for more. Most territories of the once Great Roman Empire are under our control, maybe it is time to relive this dream, maybe it is time to reintroduce it."
LUX_alt_focus_90: "Core Roman Provinces"
LUX_alt_focus_90_desc: "The Roman Empire has long been gone, its dream is no longer known, it has been too many years, too many decades. The dream still lives in a few minds and hearts of those who have committed their lives to it. We shall prove to them that their dream was worthy, that their dream was reasonable."
LUX_alt_focus_91: "Investments in Turkey"
LUX_alt_focus_91_desc: "Turkey has long been a nation of great potential, and through investing in it, will we be able to increase our strength, and our power. This will also help us greatly in the future, especially with offensive operations."
LUX_alt_focus_92: "Invite the Turks"
LUX_alt_focus_92_desc: "Turkey has long been a nation of great potential, and through inviting them to our faction, will we be able to increase our strength, and our power. This will also help us greatly in the future, especially with offensive operations."
LUX_alt_focus_93: "Revenge for the Lousiana Purchase"
LUX_alt_focus_93_desc: "The Lousiana Purchase was one of the most humiliating defeats in our history, we have lost a large amount of territory, and it is time to take it back. We will prove ourselves as a nation of strength, and we will take back what is rightfully ours."
LUX_alt_focus_94: "From Louisiana to the Gulf"
LUX_alt_focus_94_desc: "The Lousiana Purchase was one of the most humiliating defeats in our history, we have lost a large amount of territory, and it is time to take it back. We will prove ourselves as a nation of strength, and we will take back what is rightfully ours."

LUX_question_royal_family_1: "The Question of the Royal Family"
LUX_question_royal_family_1_desc: "The Royal Family has been a symbol of our Nation, but with the current situation, it is time to ask ourselves, do we want to keep the Royal Family? Or do we want to abolish it?"
LUX_question_royal_family_2: "Queen Endorsment"
mod_event_75_flag_a: "The Queen has been Accepted"
mod_event_75_flag_b: "The Queen has been Rejected"
LUX_question_royal_family_2_desc: "By endorsing the Queen, we can create a future where people will be permanently loyal to the Queen, and to the Royal Family. This will create a more stable government, and a more stable nation."
LUX_question_royal_family_2_tooltip: "§RThe Queen will want things from us in the future§!"
LUX_unlocks_new_focuses_tooltip: "§YThis Focus§! §GUnlocks New§! §YFocuses§!"
LUX_question_royal_family_3: "The Royal Family is no more"
LUX_question_royal_family_3_desc: "The Royal Family has been a symbol of our Nation, but through our determination, have we been able to take over the government, and in turn, have full control over the nation. Now it is time to retire the long known Royal Family."
LUX_question_royal_family_4: "Limit the Queen's Influence"
LUX_question_royal_family_4_desc: "Despite our undisputed victory and power, the Queen still has a large influence over the nation. It is time to limit her influence, and to create a more stable government, and a more stable nation."
LUX_question_royal_family_5: "Allow the Queen to have Influence"
LUX_question_royal_family_5_desc: "We should allow the Queen to have some influence over our Nation, considering that she is already influential. And is a symbol of our Nation."
LUX_question_royal_family_6: "Kick out Monarchism"
LUX_question_royal_family_6_desc: "Through kicking out any last Monarchist sentiment, are we able to stablize our Nation, and make sure that our position as the leader of Luxembourg is undisputed."
LUX_question_royal_family_7: "A Deal with the Devil"
LUX_question_royal_family_7_desc: "Despite our feirce resistance to the Queen, we can still make a compromise with her left over supporters."
LUX_question_royal_family_8: "Our Government, Our Rules"
LUX_question_royal_family_8_desc: "We have fought the counter revolutionaries, and have won. Now it is time to decide what we should do with this new found power. However, one thing is clear, we won, and beat them."

LUX_alt_main_focus_1: "The Start of the End"
LUX_alt_main_focus_1_desc: "The current government is not capable of handling the current situation, and an authoritarian government is needed. In order to centralise the Nation, we would need to do this, or we might fall under a red flag."

