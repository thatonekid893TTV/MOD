LUX_alt_focus_1_desc: "The current political situation requires the Queen to be in power, as a popular figure, and also as someone who can effectively lead the nation."
LUX_alt_focus_2_desc: "With chaos threatening to undermine our fragile institutions, we must take swift action to assert control and prevent national collapse."
LUX_alt_focus_3_desc: "To avoid unrest and secure loyalty, we must address the long-ignored demands of the working class by improving their conditions."
LUX_alt_focus_4_desc: "Though victory is near, lingering resistance threatens to undo our progress. Only through decisive action can we bring lasting peace."
LUX_alt_focus_5_desc: "Stalemates serve no one. By reaching out to the opposition, we can forge a path forward through compromise and mutual understanding."
LUX_alt_focus_6_desc: "The people yearn for stability. Restoring confidence in government is the first step toward healing a fractured nation."
LUX_alt_focus_7_desc: "Unemployment breeds discontent. By providing meaningful work, we can restore dignity and national purpose."
LUX_alt_focus_8_desc: "As rural ways fade, our future lies in the cities. Urban growth will bring opportunity, progress, and modern identity."
LUX_alt_focus_9_desc: "Communist agitators seek to divide our people. We must act now to preserve unity and prevent revolution."
LUX_alt_focus_10_desc: "All paths converge at this moment. The time has come to choose a course that will define our destiny."
LUX_alt_focus_11_desc: "Democracy remains our guiding light. We must reaffirm our commitment to liberty, even when challenged from within and without."
LUX_alt_focus_12_desc: "The crown has stood as a symbol of unity through generations. In honoring the Queen, we renew our bond as a nation."
LUX_alt_focus_13_desc: "We gave our word. No matter the cost, we must honor our promises if we are to retain the people's trust."
LUX_alt_focus_14_desc: "Revolution is not the answer. Gradual reform offers a safer path to progress without tearing apart our foundations."
LUX_alt_focus_15_desc: "Extremism knows no loyalty but to chaos. To safeguard our nation, we must root it out wherever it festers."
LUX_alt_focus_16_desc: "Our fate is tied to our neighbors. By standing together with the Benelux, we ensure our mutual survival."
LUX_alt_focus_17_desc: "France stands as both shield and sword. Strengthening this bond offers us a powerful ally and protector."
LUX_alt_focus_18_desc: "Our northern kin share our values and fears. Together, we can resist external pressure and build a safer region."
LUX_alt_focus_19_desc: "Poland and Czechoslovakia face the same looming threat. Unity among us is not just wise—it is necessary."
LUX_alt_focus_20_desc: "The Polish people have proven resilient and determined. Welcoming them strengthens both our cause and theirs."
LUX_alt_focus_21_desc: "This alliance is only the beginning. With enough resolve, more may follow and join our democratic mission."
LUX_alt_focus_22_desc: "The North shares our democratic principles. Together, we can form a bulwark against tyranny."
LUX_alt_focus_23_desc: "The Balkans have long been divided. If we can bring them into our fold, we may finally see stability in the region."
LUX_alt_focus_24_desc: "France has made its position clear. We must decide if this is an opportunity—or a challenge to our independence."
LUX_alt_focus_25_desc: "The world grows darker by the day. Only a united front of free nations can hope to preserve peace."
LUX_alt_focus_26_desc: "For centuries, Europe has been torn by war. We dare to dream of something better—a true democratic union."
LUX_alt_focus_27_desc: "If no one else will stand for whats right, we must. Even if we stand alone, we will not yield to tyranny."
LUX_alt_focus_28_desc: "The great powers ignore us—but together, we minor states are not so small. Its time they heard our voice."
LUX_alt_focus_29_desc: "Our shared history and values with Belgium and the Netherlands demand more than cooperation—they demand unity."
LUX_alt_focus_30_desc: "Now, more than ever, we must recognize the courage and vision of those who have sacrificed for our homeland."
LUX_alt_focus_31_desc: "We cannot ignore the storm on the horizon. A flood is coming—and we must brace ourselves or be swept away."
LUX_alt_focus_32_desc: "Our lineage is no mere relic. In the echoes of the Holy Roman Empire, we find a mandate to lead once again."
LUX_alt_focus_33_desc: "Even in times of crisis, democracy must endure. To abandon it now would betray everything we stand for."
LUX_alt_focus_34_desc: "History has taught us to never underestimate our eastern neighbor. We must be ready, no matter the cost."
LUX_alt_focus_35_desc: "We are not aggressors—but we will not be victims. A solid defense ensures peace through strength."
LUX_alt_focus_36_desc: "Passivity has its price. To protect our interests, we must be prepared to act with purpose and resolve."
LUX_alt_focus_37_desc: "The time for hesitation is over. We will carry the fight to those who threaten our freedom."
LUX_alt_focus_38_desc: "Our ancestors once ruled a continent. What was once broken can be rebuilt, stronger and just."
LUX_alt_focus_39_desc: "The Orléans name carries a noble legacy. In it, we find legitimacy and direction for a new future."
LUX_alt_focus_40_desc: "We may be small, but our economy can be mighty. By attracting investment, we transform into a continental force."
LUX_alt_focus_41_desc: "Luxembourg must not be overlooked. We can be the beating heart of European science and discovery."
LUX_alt_focus_42_desc: "By aligning our industries with those of our allies, we create strength through shared progress."
LUX_alt_focus_43_desc: "Gold flows through Europe, and we are uniquely positioned to direct its path—and its power."
LUX_alt_focus_44_desc: "Knowledge knows no borders. A united effort in research will ensure all of Europe moves forward."
LUX_alt_focus_45_desc: "The Balkans need a new partner—not a conqueror. Our support can guide them toward peace and progress."
LUX_alt_focus_46_desc: "Control over our financial instruments means control over our destiny. We must not leave this to others."
LUX_alt_focus_47_desc: "West Germany shares our values. Its integration is both practical and symbolic—a step toward unity."
LUX_alt_focus_48_desc: "Southern Germany stands at a crossroads. With our help, it can find its place in a democratic Europe."
LUX_alt_focus_49_desc: "In this dangerous world, information is our greatest weapon. We must sharpen it now."
LUX_alt_focus_50_desc: "A dedicated Luxembourgish intelligence network will protect our interests and outmaneuver our enemies."
LUX_alt_focus_51_desc: "It is time to unify our efforts and share intelligence across allied nations for our common defense."
LUX_alt_focus_52_desc: "Years of division and unrest have taken their toll. At last, we can begin to heal and move forward."
LUX_alt_focus_53_desc: "Scientific progress will not wait. We must invest in our thinkers if we are to stay relevant."
LUX_alt_focus_54_desc: "The world has changed. Our foreign policy must adapt or risk irrelevance in the new order."
LUX_alt_focus_55_desc: "Britain remains a cornerstone of European stability. Their support could tip the balance in our favor."
LUX_alt_focus_56_desc: "Diplomacy has its limits. Sometimes, one must shatter the illusion to reveal the truth beneath."
LUX_alt_focus_57_desc: "Our values align with Britains. Together, we can stand stronger against the coming storm."
LUX_alt_focus_58_desc: "The threat from Germany can no longer be ignored. War is the only path to secure our future."
LUX_alt_focus_59_desc: "Coordinated strikes with our allies will ensure our enemies are overwhelmed before they can react."
LUX_alt_focus_60_desc: "To strengthen our democracy, a National Assembly must be established to give the people their voice."
LUX_alt_focus_61_desc: "Our enemies within have had their chance. Now, we must purge them before they bring us to ruin."

LUX_focus_1_desc: "Establish the National Labour Council to mediate between employers and workers, fostering social harmony and preventing radicalization through balanced representation."
LUX_focus_2_desc: "Implement measures to safeguard democratic institutions and processes, ensuring political stability and public trust."
LUX_focus_3_desc: "Strengthen the National Labour Council's role in labor relations, promoting fair negotiations and conflict resolution."
LUX_focus_4_desc: "Develop strategies to counter communist influences, maintaining national security and democratic values."
LUX_focus_5_desc: "Appoint political advisors to guide policy decisions, enhancing governance and administrative efficiency."
LUX_focus_6_desc: "Reaffirm Luxembourg's commitment to neutrality, avoiding entanglement in foreign conflicts while promoting peace."
LUX_focus_7_desc: "Address unemployment through targeted programs and economic initiatives to stimulate job creation."
LUX_focus_8_desc: "Evaluate the impact of foreign populations on national identity and social cohesion, formulating inclusive policies."
LUX_focus_9_desc: "Analyze the reasons behind a failed legislative proposal, learning from past mistakes to improve future policymaking."
LUX_focus_10_desc: "Attempt to secure support for a new proposal aimed at addressing pressing national issues."
LUX_focus_11_desc: "Recognize the failure of a proposed law, reassessing strategies to achieve legislative success."
LUX_focus_12_desc: "Build a broad political coalition to unify diverse factions, strengthening democratic governance."
LUX_focus_13_desc: "Implement measures to prevent workers' strikes, ensuring industrial peace and economic stability."
LUX_focus_14_desc: "Promote political stability through reforms and policies that address societal needs and concerns."
LUX_focus_15_desc: "Identify and prepare for potential threats from the east, bolstering national defense and security."
LUX_focus_16_desc: "Enhance military readiness to respond effectively to emerging security challenges."
LUX_focus_17_desc: "Initiate economic reforms to end the depression, revitalizing the national economy."
LUX_focus_18_desc: "Strengthen ties with neighboring countries, fostering regional cooperation and solidarity."
LUX_focus_19_desc: "Increase workers' rights through legislation and policies that promote fair labor practices."
LUX_focus_20_desc: "Demonstrate that national strength is achieved through democratic principles and inclusive governance."
LUX_focus_21_desc: "Ban communism to protect democratic institutions and prevent authoritarian influences."
LUX_focus_22_desc: "Reinforce political stability by addressing internal divisions and promoting unity."
LUX_focus_23_desc: "Participate in the Brussels Meeting to collaborate with regional partners on common challenges."
LUX_focus_24_desc: "Celebrate the triumph of democracy, reinforcing commitment to democratic values."
LUX_focus_25_desc: "Form a neutral Benelux alliance to promote regional stability and cooperation."
LUX_focus_26_desc: "Prepare for potential conflicts through strategic planning and resource allocation."
LUX_focus_27_desc: "Establish a defense strategy for the Benelux region, ensuring collective security."
LUX_focus_28_desc: "Create a fallback line to provide strategic depth in defense planning."
LUX_focus_29_desc: "Engage with the Deutsche Bewegung to influence political developments in the region."
LUX_focus_30_desc: "Disseminate the fascist message to garner support for nationalist policies."
LUX_focus_31_desc: "Expand the socialist movement to advocate for workers' rights and social justice."
LUX_focus_32_desc: "Promote the communist solution as an alternative governance model."
LUX_focus_33_desc: "Assume a leadership role in regional politics, representing national interests."
LUX_focus_34_desc: "Eliminate opposition forces to consolidate power and implement policies effectively."
LUX_focus_35_desc: "Mobilize workers to support national initiatives and economic development."
LUX_focus_36_desc: "Establish a workers' nation where labor is central to national identity and policy."
LUX_focus_37_desc: "Request German support to strengthen national capabilities and strategic positioning."
LUX_focus_38_desc: "Pursue the vision of a communist utopia through comprehensive societal reforms."
LUX_focus_39_desc: "Infiltrate the Belgian administration to influence policy and regional dynamics."
LUX_focus_40_desc: "Assassinate King Leopold to destabilize opposition and assert dominance."
LUX_focus_41_desc: "Assert claims over the Benelux region to expand national influence."
LUX_focus_42_desc: "Adopt the Soviet principal as a guiding ideology for national governance."
LUX_focus_43_desc: "Engage in trade with Germany to bolster the economy and strategic alliances."
LUX_focus_44_desc: "Initiate a strike against the West to assert national interests and power."
LUX_focus_45_desc: "Maintain neutrality with Western powers to avoid entanglement in conflicts."
LUX_focus_46_desc: "End the fascist hegemony by promoting democratic values and alliances."
LUX_focus_47_desc: "Attempt mediation between conflicting parties to promote peace and stability."
LUX_focus_48_desc: "Lay claims on France to expand territorial influence and national prestige."
LUX_focus_49_desc: "Develop workers' capabilities to contribute to national development."
LUX_focus_50_desc: "Invest in the Benelux region to promote economic growth and integration."
LUX_focus_51_desc: "Join the Axis powers to align with dominant regional forces."
LUX_focus_52_desc: "Request German industrial support to enhance national infrastructure."
LUX_focus_53_desc: "Eliminate the opposition to consolidate power and implement policies."
LUX_focus_54_desc: "Join the war to assert national interests and fulfill alliance obligations."
LUX_focus_55_desc: "Develop a socialist industry to promote equitable economic development."
LUX_focus_56_desc: "Liberate French territories to expand influence and support allies."
LUX_focus_57_desc: "Join the Allies to support democratic nations and oppose authoritarianism."
LUX_focus_58_desc: "Conduct a pre-emptive strike to neutralize potential threats."
LUX_focus_59_desc: "Assert rightful claims to territories based on historical and cultural ties."
LUX_focus_60_desc: "Establish Greater Luxembourg to unify culturally and historically linked regions."
LUX_focus_61_desc: "Develop neutral intelligence capabilities to safeguard national security."
LUX_focus_62_desc: "Lay claims on the Low Countries to expand national territory."
LUX_focus_63_desc: "Implement the Schlieffen Plan to achieve strategic military objectives."
LUX_focus_64_desc: "Cross the Channel to project power and influence in the region."
LUX_focus_65_desc: "Form the Benelux Union to promote regional cooperation and integration."
LUX_focus_66_desc: "Navigate being a nation surrounded by war through strategic diplomacy."
LUX_focus_67_desc: "Turn against Germany to realign national interests and alliances."
LUX_focus_68_desc: "Expand Luxembourgish intelligence to enhance national security."
LUX_focus_69_desc: "Utilize nationalist propaganda to unify the populace and promote policies."
LUX_focus_70_desc: "Mobilize the nation for war, rallying citizens to defend national interests."
LUX_focus_71_desc: "Prepare for war through strategic planning and resource mobilization."
LUX_focus_72_desc: "Form a cooperative intelligence network with Germany to share critical wartime information."
LUX_focus_73_desc: "Invest in a state-controlled industrial framework to boost the socialist economy."
LUX_focus_74_desc: "Reflect on past failures and adjust national policy to avoid repeating mistakes."
LUX_focus_75_desc: "Engage in research collaborations with Allied nations for technological advancement."
LUX_focus_76_desc: "Honor the efforts of our resistance and integrate their spirit into national planning."
LUX_focus_77_desc: "Ensure national dignity by avoiding any further political or military subjugation."
LUX_focus_78_desc: "Promote national pride and unity through a resurgence of patriotic values."
LUX_focus_79_desc: "Coordinate with Axis forces in preparation for the planned invasion of Britain."
LUX_focus_80_desc: "Bolster French support and influence by emphasizing their strength and leadership."
LUX_focus_81_desc: "Push for territorial expansion based on historical or strategic claims."
LUX_focus_82_desc: "Repatriate citizens and former territories that have been separated from Luxembourg."
LUX_focus_83_desc: "Swear allegiance to the Führer in exchange for support and influence within the Axis."
LUX_focus_84_desc: "Stand firmly against German aggression and influence in our region."
LUX_focus_85_desc: "Prepare the nation for the ultimate confrontation: surrender is not an option."
LUX_focus_86_desc: "Strike before our enemies can, securing a strategic advantage in upcoming conflicts."
LUX_focus_87_desc: "Take on the authoritarian threat with bravery, aiming to eliminate tyranny."
LUX_focus_88_desc: "Identify and remove Nazi sympathizers from national institutions and the military."
LUX_focus_89_desc: "Launch a full economic recovery initiative to end the depression once and for all."
LUX_focus_90_desc: "Prepare the population and military for a desperate fight to preserve national survival."
LUX_focus_91_desc: "Reinforce a unified national identity as a rallying point in turbulent times."
LUX_focus_92_desc: "Embed nationalist principles into governance, culture, and military doctrine."
LUX_focus_93_desc: "Celebrate Luxembourg's independence and resilience on the global stage."
LUX_focus_94_desc: "Build a modern, capable military force that commands respect and deters threats."
LUX_focus_95_desc: "Enter temporary agreements to buy time or gain strategic leverage."
LUX_focus_96_desc: "Formalize defensive and economic partnerships with Allied nations."
LUX_focus_97_desc: "Reassert rightful territorial claims that have long been part of national discourse."
LUX_focus_98_desc: "Begin planning and executing operations aimed at expanding influence to the east."
LUX_focus_99_desc: "Support decolonization by releasing control over Congo and encouraging self-rule."
LUX_focus_100_desc: "Reclaim territories in Burundi that were once under Luxembourgish administration."
LUX_focus_101_desc: "Collaborate with the Soviet Union to exchange intelligence and strengthen security."
LUX_focus_102_desc: "Foster political and cultural unity with France as a bulwark against extremism."
LUX_focus_103_desc: "Reaffirm national pride through unity and resilience in the face of adversity."
LUX_focus_104_desc: "Chase an ambitious, perhaps utopian, vision for a powerful and united Luxembourg."
LUX_focus_105_desc: "Focus investment into turning Luxembourg into a central gem of European innovation."
LUX_focus_106_desc: "Pursue unification with Germany, aligning political and economic structures."
LUX_focus_107_desc: "Gain technological and industrial insights from the Soviet Union through cooperation."
LUX_focus_108_desc: "Stimulate the domestic economy with reforms and targeted investments."
LUX_focus_109_desc: "Recruit Soviet-aligned advisors to help guide Luxembourgs political transformation."
LUX_focus_110_desc: "Launch widespread propaganda campaigns promoting the communist ideology."
LUX_focus_111_desc: "Appeal to the working class by promising significantly higher wages and better conditions."
LUX_focus_112_desc: "Form a strategic alliance of unlikely political factions to consolidate power."
LUX_focus_113_desc: "Deploy large-scale propaganda to control public opinion and rally support."
LUX_focus_114_desc: "Prioritize national research with a focus on advancing Luxembourgish strength."
LUX_focus_115_desc: "Invite German advisors to assist in state planning and military structuring."
LUX_focus_116_desc: "Welcome fascist experts to help guide the states ideological and military growth."
LUX_focus_117_desc: "Appoint leading industrialists to optimize production and economic strategy."
LUX_focus_118_desc: "Form a council of economic advisors to help steer the nation through turbulent times."
LUX_focus_119_desc: "Bring in a French economic assistant to strengthen Franco-Luxembourgish relations."
LUX_focus_120_desc: "Solidify national identity through cultural and political unification efforts."
LUX_focus_121_desc: "Revitalize the market to create jobs, restore growth, and improve living standards."
LUX_focus_122_desc: "Prepare military and civil society to resist foreign or authoritarian threats."
LUX_focus_123_desc: "Reaffirm the policy of neutrality amidst growing global tensions."
LUX_focus_124_desc: "Strengthen internal stability and defense in anticipation of continental conflict."
LUX_focus_125_desc: "Establish a surveillance and intelligence framework throughout the Benelux region."
LUX_focus_126_desc: "Draft strategic war plans to ensure swift action in the event of conflict."
LUX_focus_127_desc: "Focus resources and doctrine on an aggressive, preemptive military stance."
LUX_focus_128_desc: "Adopt a defensive military posture to protect against external invasions."
LUX_focus_129_desc: "Initiate full mobilization of the population for total war readiness."
LUX_focus_130_desc: "Restructure the economy to meet the demands of wartime and national growth."
LUX_focus_131_desc: "Empower workers through democratic reforms and increased labor representation."
LUX_focus_132_desc: "Construct a robust defensive industry to support prolonged military engagements."
LUX_focus_133_desc: "Our current trade deal with the Belgians is very favorable, and we could advance this further. If done, we could gain a lot of resources, and even more money."
LUX_focus_134_desc: "Our relationship with the Germans has not been at its best. Historically, we are enemies, but that is the past. Improving relations with them, and signing trade deals could be benficial for the both of us."
LUX_focus_135_desc: "Our relationship with the French has, unlike with the Germans, always been good. We could improve and take advantage of this, and sign a trade deal."
LUX_focus_136_desc: "There is currently a lot of tension across the enterity of Europe. The French and Germans are at each others throats, and joining any of them would lead to an extisential threat to our nation. If we adopt an Autarkian Neutral Policy, we could advance."
LUX_focus_137_desc: "Our Political standpoint is uncertain at best. We need to take decisions and choose a side before it is too late."
LUX_focus_138_desc: "German relation with Switzerland have not been the best, but they are trading Gold. With our new government seeing this as an opportunity, we could join this for economic benefits."
LUX_focus_139_desc: "Money is something that has a power status, and monopolizitation of it will bring us glory, but more importantly, it will bring power."
LUX_focus_140_desc: "Knowledge presents strength in many forms, giving advantages in every filed, in every situation, and in every war. Knowledge brings power."
LUX_focus_141_desc: "Only through unity can we win, only through unity can we survive, only through unity can we thrive. We must unite the people, and the nation."
LUX_focus_142_desc: "Through coordinated attacks in the Benelux region, can we ensure victory. Can we insure peace. Can we ensure stability."

LUX_land_focus_1_desc: "Establish a balanced military doctrine with combined arms focus across land, air, and sea."
LUX_land_focus_2_desc: "Develop a comprehensive strategy for land-based operations suited to our geography and needs."
LUX_land_focus_3_desc: "Continue expanding and modernizing the Luxembourgish Army through training and equipment."
LUX_land_focus_4_desc: "Reform existing army doctrines to adapt to modern warfare demands."
LUX_land_focus_5_desc: "Adopt a bold, innovative land doctrine tailored to future conflicts."
LUX_land_focus_6_desc: "Organize flexible divisions capable of operating in tight spaces and varied terrain."
LUX_land_focus_7_desc: "Initiate a serious tank production effort—our army deserves real armored power."
LUX_land_focus_8_desc: "Develop infantry support tanks to bolster frontline resilience."
LUX_land_focus_9_desc: "Reinforce defensive positions with specialized armored units."
LUX_land_focus_10_desc: "Invest in developing new infantry weapons to maintain battlefield effectiveness."
LUX_land_focus_12_desc: "Prioritize the development and deployment of advanced artillery systems."
LUX_land_focus_13_desc: "Expand the military industry and doctrine to support long-term growth."
LUX_land_focus_14_desc: "Focus on medium tank designs to balance mobility, armor, and firepower."
LUX_land_focus_15_desc: "Adopt and adapt successful German land strategies for our own use."
LUX_land_focus_16_desc: "Build upon our doctrinal base to further refine combat tactics."
LUX_land_focus_17_desc: "Begin assembling a small but deadly submarine fleet for asymmetric naval warfare."
LUX_land_focus_18_desc: "Modernize our air force strategy to keep pace with foreign powers."
LUX_land_focus_19_desc: "Pursue combined air and naval doctrine to dominate both sea and sky."
LUX_land_focus_20_desc: "Purchase advanced foreign fighter designs to jump-start our air capabilities."
LUX_land_focus_21_desc: "Invest in heavy fighters to counter bombers and dominate long-range dogfights."
LUX_land_focus_22_desc: "Emphasize fast and agile light fighters for air superiority."
LUX_land_focus_23_desc: "Commit to Close Air Support doctrine to directly aid ground forces."
LUX_land_focus_24_desc: "Focus on tactical bombers for versatile mid-range aerial bombardment."
LUX_land_focus_25_desc: "Deploy light CAS bombers to harass enemy infantry and vehicles with precision."
LUX_land_focus_26_desc: "Train our submarine crews in wolfpack tactics to hunt enemy convoys efficiently."
LUX_land_focus_27_desc: "Prepare for warfare in the Atlantic through advanced submarine doctrine."
LUX_land_focus_28_desc: "Develop modern cruisers to support fleet operations and coastal defense."
LUX_land_focus_29_desc: "Construct heavy warships to serve as flagships of our naval power."
LUX_land_focus_30_desc: "Unify the nation behind a shared military vision to strengthen morale and resolve."

LUX_industry_focus_1_desc: "Kickstart national development by investing in our infrastructure, economy, and industrial potential."
LUX_industry_focus_1_tooltip: "§YUnlocks§! §Gnew§! §YDecisions to§! §GImprove§! §Your Economy§!"
LUX_industry_focus_2_desc: "Upgrade Luxembourg's road network to improve logistics and supply lines across the country."
LUX_industry_focus_3_desc: "Construct defensive structures to protect key cities and borders from invasion."
LUX_industry_focus_4_desc: "Reinforce the southern regions with forts and defenses to deter aggression from the south."
LUX_industry_focus_5_desc: "Allocate resources to grow the domestic military industry and reduce dependence on imports."
LUX_industry_focus_6_desc: "Prepare our skies—install anti-aircraft systems to defend against enemy bombers."
LUX_industry_focus_7_desc: "Broaden the industrial base to support both military and civilian production."
LUX_industry_focus_8_desc: "Finalize our preparations for war by ensuring our armed forces are well-equipped and supplied."
LUX_industry_focus_9_desc: "Invest in cutting-edge industrial technologies to stay ahead of our adversaries."
LUX_industry_focus_10_desc: "Combine military modernization and production efficiency to form an advanced, professional army."
LUX_industry_focus_11_desc: "Continue the expansion of domestic factories to meet the growing demand for wartime goods."
LUX_industry_focus_12_desc: "Luxembourg rises—small in size but mighty in resolve. Let the world take notice."
LUX_industry_focus_13_desc: "Lay the groundwork for future innovations by improving our research and development systems."
LUX_industry_focus_14_desc: "Exploit local natural resources to fuel our industry and strengthen economic independence."
LUX_industry_focus_15_desc: "Rally the nation. Full-scale mobilization will turn our civilian population into a wartime engine."
LUX_industry_focus_16_desc: "Empower our workers through programs that increase productivity and national spirit."
LUX_industry_focus_17_desc: "Focus national efforts on advancing military technologies and equipment designs."
LUX_industry_focus_18_desc: "Prepare the homeland with a network of defenses, bunkers, and strategic strongholds."
LUX_industry_focus_19_desc: "Assert Luxembourgs importance on the Rhine and claim our rightful role in European affairs."

luxembourg_mod_idea_desc: "Political Instability has plagued our nation, with the rise of communism and fascism threatening our very existence. Not taking action will result in our demise."
luxembourg_mod_idea_1_desc: "The Great Depression of 1929 has hit us hard, our economy was, and still is in shambles. With the growing politcal tensions, it is important that we will solve the issue of the depression, or we will be doomed to fail."
luxembourg_mod_idea_2_desc: "We made a deal for independence with the Prussians, that we would trade with them, no matter what. After the First World War, the Entente forced us to end this. We were forced to find new partners, France was no option since it was not interested in such an economic union. We were forced to reach our hand to Belgiun. \n\nThe Belgian Luxembourg Economic Union has developed into something greater than ever imagined. It has helped us through our darkest moments, but our heavy reliance on it has made us vulnerable."
luxembourg_mod_idea_57_desc: "We made a deal for independence with the Prussians, that we would trade with them, no matter what. After the First World War, the Entente forced us to end this. We were forced to find new partners, France was no option since it was not interested in such an economic union. We were forced to reach our hand to Belgiun. \n\nThe Belgian Luxembourg Economic Union has developed into something greater than ever imagined. It has helped us through our darkest moments, but our heavy reliance on it has made us vulnerable."
luxembourg_mod_idea_3_desc: "Large Protests have erupted across the nation, with workers demanding better conditions and pay. We can comply, or decline, it is up to us to decide."
luxembourg_mod_idea_4_desc: "A National Labour Council was created to end the strikes and protests. However, the power that has been handed to the workers is too much, and could result in our suffering."
luxembourg_mod_idea_5_desc: "Neutrality has been our moto for so long. It is our only method to survive as an independent nation. However, with the growing fire around us, it might not be enough."
luxembourg_mod_idea_6_desc: "A National Labour Council was created to end the strikes and protests. However, the power that has been handed to the workers is too much, and could result in our suffering."
luxembourg_mod_idea_7_desc: "We must end the current Lack of Weaponry in order for our military to be efficient in the coming war. Decreased prices of these weapons will support us in this matter."
luxembourg_mod_idea_10_desc: "The Proposal is a failed one... our nation now lies in risk. And the future of our nation is uncertain."
