  political_instability:0 "Political Instability - §RSEVERE§!"
  political_instability_desc:0 "Political instability plagued Romania during the interwar period, characterized by a series of frequent changes in government and a volatile political landscape. The country faced the challenges of establishing a stable democratic system while simultaneously grappling with social and economic upheavals. Factionalism, rivalries among political parties, and shifting alliances hindered the formation of strong and cohesive governments. Corruption and nepotism further eroded public trust in the political institutions. The rise of extremist ideologies, such as fascism and communism, added to the turbulence and polarization of Romanian society. These factors created a climate of uncertainty and hindered the implementation of consistent policies, ultimately impeding the country's progress and stability during this critical era."
