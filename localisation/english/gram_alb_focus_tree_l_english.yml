l_english:
albanian_focus_tree:0 "Albanian Focus Tree"
gram_focus_alb_make_a_deal_with_workers:0 "Make a deal with Workers"
gram_focus_alb_make_a_deal_with_workers_desc:0 "The deal will be established with the working class to put an end to this foolishness."
gram_focus_alb_expand_our_tobacco_industry:0 "Expand our Tobacco Industry"
gram_focus_alb_expand_our_tobacco_industry_desc:0 "To ensure future prosperity, we should expand our economic potential."
gram_focus_alb_royal_dictatorship:0 "Royal Dictatorship"
gram_focus_alb_royal_dictatorship_desc:0 "The King's leadership is paramount and should not be undermined, for he is the greatest of all."
gram_focus_alb_crush_the_workers_protests:0 "Crush the Workers Protests"
gram_focus_alb_crush_the_workers_protests_desc:0 "In the face of growing unrest among the working class, our government must take decisive action to maintain order and stability."
gram_focus_alb_arming_the_nation:0 "Arming the Nation"
gram_focus_alb_arming_the_nation_desc:0 "To safeguard our nation, we must prioritize the development of our defense capabilities."
gram_focus_alb_stabilize_the_nation:0 "Stabilize the Nation"
gram_focus_alb_stabilize_the_nation_desc:0 "To ensure future progress, national stability is a key requirement."
gram_focus_alb_industrial_expansion:0 "Industrial Expansion"
gram_focus_alb_industrial_expansion_desc:0 "Acquiring the know-how is a crucial preliminary step to any successful expansion."
gram_focus_alb_lower_the_need_for_imports:0 "Lower the Need for Imports"
gram_focus_alb_lower_the_need_for_imports_desc:0 "Although our nation is currently facing a drought, we are making steady progress in bringing it under control."
gram_focus_alb_lower_the_imports_even_more:0 "Lower the Imports Even More"
gram_focus_alb_lower_the_imports_even_more_desc:0 "The growth of our agriculture sector is progressively reducing our reliance on imports from other nations."
gram_focus_alb_remove_the_need_for_imports:0 "Remove the Need for Imports"
gram_focus_alb_remove_the_need_for_imports_desc:0 "Our agricultural sector has developed to the point where it can completely support our ever-increasing population, allowing us to become entirely self-sufficient and eliminate all imports."
gram_focus_alb_industrial_legacy:0 "Industrial Legacy"
gram_focus_alb_industrial_legacy_desc:0 "Outdated factory buildings will be renovated and returned to productive use."
gram_focus_alb_industrial_expansionism:0 "Industrial Expansionism"
gram_focus_alb_industrial_expansionism_desc:0 "Having secured the foundations of our industry, let's now focus on maximizing their utilization."
gram_focus_alb_literacy_program:0 "Literacy Program"
gram_focus_alb_literacy_program_desc:0 "For our nation to truly thrive and become stronger, prioritizing the education and development of our workforce is crucial."
gram_focus_alb_opening_of_agricultural_university_of_tirana:0 "Opening of Agricultural University of Tirana"
gram_focus_alb_opening_of_agricultural_university_of_tirana_desc:0 "Now that we've begun to prioritize education for our population, we can certainly encourage and support their enrollment in our new university."
gram_focus_alb_state_investment:0 "State Investment"
gram_focus_alb_state_investment_desc:0 "Through our progress, our nation has become fully equipped to deal with its internal matters independently."
gram_focus_alb_nationalization_of_our_oil:0 "Nationalization of Our Oil"
gram_focus_alb_nationalization_of_our_oil_desc:0 "The time has come for us to assert our right and take possession of what is rightfully ours. "
gram_focus_alb_invite_foreign_investors:0 "Invite Foreign Investors"
gram_focus_alb_invite_foreign_investors_desc:0 "We can use our geological location to attract some foreign investors."
gram_focus_alb_glory_to_zog:0 "Glory to Zog"
gram_focus_alb_glory_to_zog_desc:0 "King Zog is truly the greatest person, who truly knows how to take proper care of our country."
gram_focus_alb_expansion_of_oil_fields:0 "Expansion of Oil Fields"
gram_focus_alb_expansion_of_oil_fields_desc:0 "We should use our land to exploit our national resources for profit."
gram_focus_alb_glorious_walks_once_again:0 "Glorious Walks Once Again"
gram_focus_alb_glorious_walks_once_again_desc:0 "With unwavering faith and patriotism, we exclaim, Glory to Zog, glory to Albania, and glory to the Almighty God!"
gram_focus_alb_rebuilding_the_lost_empire:0 "Rebuilding the Lost Empire"
gram_focus_alb_rebuilding_the_lost_empire_desc:0 "Our people must unite under the banner of a single, powerful empire."
gram_focus_alb_attack_the_greece:0 "Attack the Greece"
gram_focus_alb_attack_the_greece_desc:0 "We will have united Empire once again, through all means necessary."
gram_focus_alb_unite_with_greece:0 "Unite with Greece"
gram_focus_alb_unite_with_greece_desc:0 "We will have united Empire once again, through democratic means."
gram_focus_alb_rebirth_of_new_byzantine_empire:0 "Rebirth of New Byzantine Empire"
gram_focus_alb_rebirth_of_new_byzantine_empire_desc:0 "Partly united but stronger then ever, we will retake our lost empire."
gram_focus_alb_bribe_british_and_french_goverment:0 "Bribe British and French Goverment"
gram_focus_alb_bribe_british_and_french_goverment_desc:0 "Nothing a little bit of money and good releations can't do in this world."
gram_focus_alb_attack_the_slavic_territorys:0 "Attack the Slavic Territorys"
gram_focus_alb_attack_the_slavic_territorys_desc:0 "We will bring those slavs back under our fold."
gram_focus_alb_true_defenders_of_slavic_people:0 "True Defenders of Slavic People"
gram_focus_alb_true_defenders_of_slavic_people_desc:0 "Southern slavs were part of our empire long before, and so are they now, so we should protect them."
gram_focus_alb_bribe_german_goverment:0 "Bribe German Goverment"
gram_focus_alb_bribe_german_goverment_desc:0 "Nothing a little bit of money and good releations can't do in this world."
gram_focus_alb_attack_the_turks:0 "Attack the Turks "
gram_focus_alb_attack_the_turks_desc:0 "We will take what once belonged to us."
gram_focus_alb_reintegrate_the_homeland_of_turks:0 "Reintegrate the Homeland of Turks "
gram_focus_alb_reintegrate_the_homeland_of_turks_desc:0 "Finishing this successful conquest we can finally reintegrate eastern parts back into our empire."
gram_focus_alb_no_empire_like_byzantine_empire:0 "No Empire like Byzantine Empire "
gram_focus_alb_no_empire_like_byzantine_empire_desc:0 "Glory to our empire, to its people and the Emperor."
gram_focus_alb_compromise_with_romania_and_czechoslovakia:0 "Compromise with Romania and Czechoslovakia"
gram_focus_alb_compromise_with_romania_and_czechoslovakia_desc:0 "Both Romania and Czehoslovakia know that they can't stop us if we want to attack the slavs, but we can make a little deal."
gram_focus_alb_our_place_in_the_world:0 "Our Place in the World"
gram_focus_alb_our_place_in_the_world_desc:0 "Our Empire has reconquered most of it's old territories, but we will spread our infulence further."
gram_focus_alb_empire_of_philosophy:0 "Empire of Philosophy"
gram_focus_alb_empire_of_philosophy_desc:0 "The only true wisdom is in knowing you know nothing. -Socrates"
gram_focus_alb_anti_fascist_campaign:0 "Anti-Fascist Campaign"
gram_focus_alb_anti_fascist_campaign_desc:0 "This ever growing monster on the face of Europe is sickening, we need to get rid of it."
gram_focus_alb_invite_greek_army_officers:0 "Invite Greek Army Officers"
gram_focus_alb_invite_greek_army_officers_desc:0 "Greek Army has few good officers that we are currently laking, so why we don't let them join the ranks."
gram_focus_alb_faction_expansion:0 "Faction Expansion"
gram_focus_alb_faction_expansion_desc:0 "We should start looking towards the plan of expanding our alliance."
gram_focus_alb_dark_day_for_our_nation:0 "Dark day for our Nation"
gram_focus_alb_dark_day_for_our_nation_desc:0 "A grave danger looms over our king."
gram_focus_alb_increased_conscription:0 "Increased Conscription"
gram_focus_alb_increased_conscription_desc:0 "Our nation needs more military personal, if we wish to still be a relevant nation."
gram_focus_alb_italo_albanian_treaty_of_friendship:0 "Italo-Albanian Treaty of Friendship"
gram_focus_alb_italo_albanian_treaty_of_friendship_desc:0 "Italian economic friendship helped us become very industrialised nation. With us having closer ties to Italy, we could achieve even bigger economic development."
gram_focus_alb_true_economic_tiger_of_balkans:0 "True Economic TIger of Balkans"
gram_focus_alb_true_economic_tiger_of_balkans_desc:0 "Our economic success is incredible for a Balkan nation. We are stronger and more economicaly "independent" then ever."
gram_focus_alb_royal_marriage:0 "Royal Marriage"
gram_focus_alb_royal_marriage_desc:0 "This day will be well known for many generations to come, the day our king found his queen."
gram_focus_alb_educational_reform:0 "Educational Reform"
gram_focus_alb_educational_reform_desc:0 "Our education system, is still lacking compared to other European nations. It is about time for something to be done about it."
gram_focus_alb_fortress_albania:0 "Fortress Albania"
gram_focus_alb_fortress_albania_desc:0 "In the name of safety and security for our nation, king Zog has ordered a construction of wide spread fortifications all over our nation."
gram_focus_alb_complete_mobilisation:0 "Complete Mobilisation"
gram_focus_alb_complete_mobilisation_desc:0 "Every man, shall defend his fatherland, no matter the cost. Even if it means his demise."
gram_focus_alb_peoples_revolution:0 "People's Revolution"
gram_focus_alb_peoples_revolution_desc:0 "The people have spoken, victory of the people is going to bring the freedom to this country. Long live the Revolution!"
gram_focus_alb_rebirth_of_democracy:0 "Rebirth of Democracy"
gram_focus_alb_rebirth_of_democracy_desc:0 "The people have spoken, victory of the people is going to bring the freedom to this country. Long live the Liberty!"
gram_focus_alb_new_era_for_the_republic:0 "New era for the Republic"
gram_focus_alb_new_era_for_the_republic_desc:0 "It is about the time to let the people speak, about the future of their country."
gram_focus_alb_rule_of_hoxha:0 "Rule of Hoxha"
gram_focus_alb_rule_of_hoxha_desc:0 "Hoxha, is a true leader that will bring peace and prosperity into our country."
gram_focus_alb_rule_of_the_people:0 "Rule of the People"
gram_focus_alb_rule_of_the_people_desc:0 "Leadership over the country shouldn't be centralized, and fully controlled by a single person, but by collective."
gram_focus_alb_our_king_no_more:0 "Our King no More"
gram_focus_alb_our_king_no_more_desc:0 "The monarchy has been shrinking since the end of World War 1 in Europe. The monarchist idealism is an outdated system that has been rotten in its core since the start of its existence."
gram_focus_alb_support_workers_unions:0 "Support Worker's Unions"
gram_focus_alb_support_workers_unions_desc:0 "Factory workers are true heart of our economy, we need to support them and keep the heart beating at all costs."
gram_focus_alb_new_economic_policy:0 "New Economic Policy"
gram_focus_alb_new_economic_policy_desc:0 "New economic policy, should improve our economic capabilities and development of the Republic."
gram_focus_alb_state_run_agriculture_sector:0 "State run Agriculture Sector"
gram_focus_alb_state_run_agriculture_sector_desc:0 "Small run agricultrual farms, wont be sufficient in our plan towards a full self-sufficiency."
gram_focus_alb_organisation_of_labour_through_labour_unions:0 "Organisation of Labour Through Labour Unions"
gram_focus_alb_organisation_of_labour_through_labour_unions_desc:0 "Under Capitalism, labor unions exist to ensure basic human rights for the workers and to fend off the exploitation from the factory owners. This is obviously no longer needed in the new system, and therefore the role of the Labor Union must shift towards organizing labor for the purpose of optimizing production."
gram_focus_alb_closer_ties_with_balkan_nations:0 "Closer Ties with Balkan Nations"
gram_focus_alb_closer_ties_with_balkan_nations_desc:0 "Revolution, should be persoud in other nations as well, not only in the ones that were eable to achive it fully. By improving our relations with other nations of Balkan penincula we will be eable to in future, liberate them from the terror of capitalism."
gram_focus_alb_closer_ties_with_ussr:0 "Closer Ties with USSR"
gram_focus_alb_closer_ties_with_ussr_desc:0 "By persuing closer ties with USSR we could get a protection against, Italian expansionist ideas."
gram_focus_alb_loyalty_to_the_party:0 "Loyalty to the Party"
gram_focus_alb_loyalty_to_the_party_desc:0 "Unifying the inner party will allow us to stabilise the country, and focus on more importent issues."
gram_focus_alb_spread_revolutionary_flame:0 "Spread Revolutionary Flame"
gram_focus_alb_spread_revolutionary_flame_desc:0 "Balkans still a shell of a region, has faced many nations overruling it, through history, from the mighty days of Ottoman Empire to a recent collapse of Austria-Hungary. All of the people of Balkan shall no longer be the ones that will have to obey. Every Balkan man shall be free from the shackles."
gram_focus_alb_membership_in_comintern:0 "Seek Membership in Comintern"
gram_focus_alb_membership_in_comintern_desc:0 "We shall get under a wing of our "Eastern" brothers, to secure our position in the Balkans from the other nations imperial ambitions."
gram_focus_alb_deal_with_mussolini:0 "Deal with Mussolini"
gram_focus_alb_deal_with_mussolini_desc:0 "If no one wishes to deal with this crazy man of Europe, with his imperial ambitions, then we shall deal with him ourselfs."
gram_focus_alb_start_of_balkan_project:0 "Start of Balkan Project"
gram_focus_alb_start_of_balkan_project_desc:0 "The dream of united Balkan will come true, we will accomplishe it. No matter the blood, sweat or tears that shall be spilled."
gram_focus_alb_to_yugoslavia:0 "To Yugoslavia"
gram_focus_alb_to_yugoslavia_desc:0 "Yugoslavia is one of the countrys we want to become the member of the Balkan Project. By influencing their politics we can accomplishe this even sooner, of course if there is a need for it."
gram_focus_alb_to_greece:0 "To Greece"
gram_focus_alb_to_greece_desc:0 "Greece is one of the countrys we want to become the member of the Balkan Project. By influencing their politics we can accomplishe this even sooner, of course if there is a need for it."
gram_focus_alb_to_romania:0 "To Romania"
gram_focus_alb_to_romania_desc:0 "Romania is one of the countrys we want to become the member of the Balkan Project. By influencing their politics we can accomplishe this even sooner, of course if there is a need for it."
gram_focus_alb_to_bulgaria:0 "To Bulgaria"
gram_focus_alb_to_bulgaria_desc:0 "Bulgaria is one of the countrys we want to become the member of the Balkan Project. By influencing their politics we can accomplishe this even sooner, of course if there is a need for it."
gram_focus_alb_balkan_trade_cooperation:0 "Balkan Trade Cooperation"
gram_focus_alb_balkan_trade_cooperation_desc:0 "We shall boost our trade with the other nations inside our Federation, and we shall give other Unions the directives that shall be followed, with the aim of boosting the economy and fostering cooperation between the countries of our Federation."
gram_focus_alb_balkan_armed_forces:0 "Balkan Armed Forces"
gram_focus_alb_balkan_armed_forces_desc:0 "The Balkans have long been subjected to foreign nations, but now is the time for our peoples to join forces against the invaders and fight for the land that, by right, belongs to us."
gram_focus_alb_realize_the_dream:0 "Realize the Dream"
gram_focus_alb_realize_the_dream_desc:0 "The dream of Balkan Unity is finally real, no more blood spill, only unity and brotherhood."
gram_focus_alb_pan_balkan_research_initiative:0 "Pan-Balkan Research Initiative"
gram_focus_alb_pan_balkan_research_initiative_desc:0 "Receant unification of Balkan nations, will allow us to be more research independent, from the hands of other European Powers."
gram_focus_alb_freedom_of_religion:0 "Freedom of Religion"
gram_focus_alb_freedom_of_religion_desc:0 "The lands our newly formed Nation has conquerd, has many ethnic groups and multiple religions. We will grant our people freedom to express themselfs and to be part of the religion. Without any repercussion."
gram_focus_alb_balkan_rural_area_investment:0 "Balkan Rural Area Investment"
gram_focus_alb_balkan_rural_area_investment_desc:0 "Vast regions of Balkan, are still underdeveloped. We shall boost our economic capabilities and improve our rular areas."
gram_focus_alb_balkan_expansion_plans:0 "Balkan Expansion Plans"
gram_focus_alb_balkan_expansion_plans_desc:0 "No matter what, some nations still hold their imperial grudges and don't wish to give us back our rightfull land."
gram_focus_alb_modernization_of_military_doctrine:0 "Modernization of Military Doctrine"
gram_focus_alb_modernization_of_military_doctrine_desc:0 "Our military doctrine, still very much ancient, needs some proper modernization."
gram_focus_alb_the_albanian_airforce:0 "The Albanian Airforce"
gram_focus_alb_the_albanian_airforce_desc:0 "Nowhere is technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
gram_focus_alb_the_albanian_army:0 "The Albanian Army"
gram_focus_alb_the_albanian_army_desc:0 "Despite the increasing possibilities of aerial and naval warfare, ground combat is still key in tomorrow's wars. With preparation, we can avoid reliving the hell of the trenches."
gram_focus_alb_the_albanian_navy:0 "The Albanian Navy"
gram_focus_alb_the_albanian_navy_desc:0 "The expansion of our navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
gram_focus_alb_equipment_effort:0 "Equipment Effort"
gram_focus_alb_equipment_effort_desc:0 "The limits for what equipment can be carried by infantry are constantly being pushed. We will focus on giving our troops the best tools available."
gram_focus_alb_motorization_effort:0 "Motorization Effort"
gram_focus_alb_motorization_effort_desc:0 "Mobility and protection are crucial to get infantry into and out of the field safely. Focusing on these developments will allow us to take action quickly."
gram_focus_alb_doctrine_effort:0 "Doctrine Effort"
gram_focus_alb_doctrine_effort_desc:0 "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
gram_focus_alb_equipment_effort_2:0 "Equipment Effort II"
gram_focus_alb_equipment_effort_2_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
gram_focus_alb_mechanization_effort:0 "Mechanization Effort"
gram_focus_alb_mechanization_effort_desc:0 "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles can be constructed today."
gram_focus_alb_doctrine_effort_2:0 "Doctrine Effort II"
gram_focus_alb_doctrine_effort_2_desc:0 "The battlefield has changed not just in the interbellum years, but over the course of recent conflicts. We must continuously reevaluate our doctrines to reflect this."
gram_focus_alb_armor_effort:0 "Armor Effort"
gram_focus_alb_armor_effort_desc:0 "Applying what we have learned from mechanizing our infantry, we can improve our armored vehicles as well."
gram_focus_alb_special_forces:0 "Special Forces"
gram_focus_alb_special_forces_desc:0 "We have need of elite forces; mountain troops and paratroopers should be our priority."
gram_focus_alb_aviation_effort:0 "Aviation Effort"
gram_focus_alb_aviation_effort_desc:0 "Nowhere is technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
gram_focus_alb_fighter_focus:0 "Fighter Focus"
gram_focus_alb_fighter_focus_desc:0 "We have not seen that last of dogfights in the Great War. Keeping ahead in the development of fighter planes will give us an edge in the future."
gram_focus_alb_bomber_focus:0 "Bomber Focus"
gram_focus_alb_bomber_focus_desc:0 "When people of the future speak of the horror to today's wars, fire raining from the skies will prominently feature. We will do our best to ensure those stories are told by our enemies."
gram_focus_alb_CAS_effort:0 "CAS Effort"
gram_focus_alb_CAS_effort_desc:0 "A modern army needs support from vehicles not only on the ground, but also in the air."
gram_focus_alb_NAV_effort:0 "NAV Effort"
gram_focus_alb_NAV_effort_desc:0 "Just as the new naval warfare takes place in part beneath the water's surface, part of it takes place in the air above the waters."
gram_focus_alb_flexible_navy:0 "Flexible Navy"
gram_focus_alb_flexible_navy_desc:0 "Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys."
gram_focus_alb_large_navy:0 "Large Navy"
gram_focus_alb_large_navy_desc:0 "Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need."
gram_focus_alb_submarine_effort:0 "Submarine Effort"
gram_focus_alb_submarine_effort_desc:0 "Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping."
gram_focus_alb_cruiser_effort:0 "Cruiser Effort"
gram_focus_alb_cruiser_effort_desc:0 "Before making forays into advanced battleship research, the smaller cruisers are in need of replacement."
gram_focus_alb_destroyer_effort:0 "Destroyer Effort"
gram_focus_alb_destroyer_effort_desc:0 "Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this."
gram_focus_alb_capital_ships_effort:0 "Capital Ship Effort"
gram_focus_alb_capital_ships_effort_desc:0 "The nation with the most battleships will rule the oceans. Battleships and carriers represent the old and the new in naval superiority."
gram_focus_alb_steel_cities:0 "Steel Cities"
gram_focus_alb_steel_cities_desc:0 "New iron mines as well the new steel mills will, make it possible for a lot of rural people to find the job inside the city and this opportunity will allow us to turn whole Tirana around and turn it into a true Steel City."
gram_focus_alb_rising_sun_of_the_balkans:0 "Rising sun of the Balkans"
gram_focus_alb_rising_sun_of_the_balkans_desc:0 "Our might shall be heard across the whole of the Balkan Peninsula and across the entirety of Europe."
gram_focus_alb_anti_communist_campaign:0 "Anti-Communist Campaign"
gram_focus_alb_anti_communist_campaign_desc:0 "The time has come for us to cleanse Europe of the scourge of Communism and liberate its nations from this oppressive force."
gram_focus_alb_anti_capitalist_march:0 "Anti-Capitalists March"
gram_focus_alb_anti_capitalist_march_desc:0 "The time has come for us to cleanse Europe of the scourge of Capitalism and liberate its nations from this oppressive system."
gram_focus_alb_world_shall_burn:0 "World Shall Burn"
gram_focus_alb_world_shall_burn_desc:0 "Driven by the absolute necessity to eliminate the capacity for global destruction, we will obliterate every nation that holds the status of a world power."
gram_focus_alb_cult_of_personality:0 "Cult of Personality"
gram_focus_alb_cult_of_personality_desc:0 "Inspired by the pervasive cult of personality surrounding Stalin, Enver Hoxha aims to cultivate a similar fervent devotion among Albania's youth, intending to shape their perceptions and secure his enduring influence on future generations."
gram_focus_alb_research_collaboration:0 "Research Collaboration"
gram_focus_alb_research_collaboration_desc:0 "Through our research collaboration with the USSR, we aim to enhance our existing technological capabilities and potentially develop new ones as well."
gram_focus_alb_albanian_path_to_communism:0 "Albanian Path to Communism"
gram_focus_alb_albanian_path_to_communism_desc:0 "Following the example of the USSR, we eliminated the obstacles of autocracy and swiftly transitioned to the establishment of a socialist system. Although some of the steps taken to achieve this goal were "unexpected," we ultimately succeeded in our efforts."
gram_focus_alb_last_revolution:0 "Last Revolution"
gram_focus_alb_last_revolution_desc:0 "Now, the only task remaining is to secure the future of our country, ensuring that we remain committed to its true purpose. By doing so, we can foster an environment in which our nation can thrive and prosper."
gram_focus_alb_red_albania:0 "Red Albania"
gram_focus_alb_red_albania_desc:0 "The security of our country is currently our primary concern. By gaining the support of the USSR, we can ensure that we have a reliable ally to provide us with protection and bolster our position on the international stage."
gram_focus_alb_secret_police:0 "Secret Police"
gram_focus_alb_secret_police_desc:0 "If we wish to maintain the stability and integrity of our nation's internal structure, it is crucial to identify and eliminate any forms of sabotage. This may require difficult choices and, unfortunately, some sacrifices. However, ensuring the security and unity of our nation must remain our top priority."
gram_focus_alb_two_year_plan:0 "Two Year Plan"
gram_focus_alb_two_year_plan_desc:0 "We will implement our own version of the Soviet Five-Year Plan, which is more flexible and effective. Rather than a full five-year commitment, our plan will focus on production goals over a two-year period. This approach will allow us to adapt quickly to changing circumstances and respond to the needs of our economy."
gram_focus_alb_adriatic_shall_be_ours:0 "Adriatic Shall be Ours"
gram_focus_alb_adriatic_shall_be_ours_desc:0 "The Adriatic could be of greater use to us than we expect. We should secure it for our cause while we still have the opportunity."
gram_focus_alb_destroy_yugoslavia_from_inside:0 "Destroy Yugoslavia From Inside"
gram_focus_alb_destroy_yugoslavia_from_inside_desc:0 "Our northern neighbors hold vital land that we would like to possess. Given their current internal situation, we might be able to exploit it for our own purposes."
gram_focus_alb_anti_serbia_league:0 "Anti-Serbia League"
gram_focus_alb_anti_serbia_league_desc:0 "With the breakup of Yugoslavia, we should now request that these new breakaway nations seek our protection against Serbia."
gram_focus_alb_balkan_defense_league_alt:0 "Balkan Defense League"
gram_focus_alb_balkan_defense_league_alt_desc:0 "With the breakup of Yugoslavia, we should now request that these new breakaway nations seek our protection against Serbia."
gram_focus_alb_destroy_what_is_left:0 "Destroy What is Left"
gram_focus_alb_destroy_what_is_left_desc:0 "Serbia, now reduced to a small and weakened nation, could be easily subdued with a combined effort from us and our allies."
gram_focus_alb_united_adriatic:0 "United Adriatic"
gram_focus_alb_united_adriatic_desc:0 "And finally our goal can be achieved to partially unify Adriatic into one singular entity."
gram_focus_alb_access_to_mediterian:0 "Access to Mediterian"
gram_focus_alb_access_to_mediterian_desc:0 "With much of the Adriatic now secured, we can turn our attention southward to create a new access point to the Mediterranean Sea."
gram_focus_alb_inclusion_of_kosovo_and_macedonia:0 "Inclusion of Kosovo and Macedonia"
gram_focus_alb_inclusion_of_kosovo_and_macedonia_desc:0 "States liberated from Serbian rule now seek to join our unified territory."
gram_focus_alb_liberate_territories_under_italian_rule:0 "Liberate Territories Under Italian Rule"
gram_focus_alb_liberate_territories_under_italian_rule_desc:0 "The only part of the Adriatic that remains contested is held by the Italians, who are unlikely to relinquish that land without a struggle."
gram_focus_alb_finally_a_true_prince:0 "Finally a True Prince"
gram_focus_alb_finally_a_true_prince_desc:0 "No more "false" kings on the throne, our rightful Prince has finally arrived."
gram_focus_alb_take_back_the_house_of_wied:0 "Take Back the House of Wied"
gram_focus_alb_take_back_the_house_of_wied_desc:0 "We will reclaim the land that our royal family believes is an integral part of our nation."
gram_focus_alb_wied_is_ours:0 "Wied is Ours"
gram_focus_alb_wied_is_ours_desc:0 "Finally, it feels like home."
gram_focus_alb_project_eagle:0 "Project Eagle"
gram_focus_alb_project_eagle_desc:0 "The top secret project, being developed by the best scientists in all of Albania."
gram_focus_alb_balkan_workers_league:0 "Balkan Workers League"
gram_focus_alb_balkan_workers_league_desc:0 "The world is made for those who are communist and strong, we must make a grand league of workers to honor this ideal."
gram_focus_alb_invite_bulgaria:0 "Invite Bulgaria"
gram_focus_alb_invite_bulgaria_desc:0 "The Bulgarians, the country on the other side of yugoslavia, is a strong country that must be brought towards the red light"
gram_focus_alb_invite_greece:0 "Invite Greece"
gram_focus_alb_invite_greece_desc:0 "The Greeks, our southern neighbor, is a strategic point that will secure our control over the adriatic entrance, alongside the Agean sea"
gram_focus_alb_great_commander:0 "Great Commander"
gram_focus_alb_invite_yug:0 "Invite Yugoslavia"
gram_focus_alb_invite_yug_desc:0 "Yugoslavia, the country of which our longest border lay, is not only our strongest neighbor, but our largest one. If we can secure their alliance, we can hold control over the Adriatic Sea's eastern bank in its entirety."
gram_focus_alb_north_balkan:0 "Focus North"
gram_focus_alb_north_balkan_desc:0 "Now that the southern Balkan is in our faction, we can now focus toward the Northern Balkan"
gram_focus_alb_invite_the_balkan:0 "Send the Invitations"
gram_focus_alb_invite_the_balkan_desc:0 "The time for us to send the invitations to our faction is now. We must hope that they do all accept our hope of a unified balkan."
gram_focus_alb_end_fascism:0 "The Final Fascist Strike"
gram_focus_alb_end_fascism_desc:0 "Fascism, the opposite of communism, must finally be eradicated off the globe. We must go against some of our ideals and subjugate them to assure it will never rise again."
gram_focus_alb_great_commander_desc:0 "Our mighty leader Hoxha has led us toward many victories in recent years, so we shall name him our "Great Commander"."
gram_focus_alb_revolutionary_guns:0 "Revolutionary Guns"
gram_focus_alb_revolutionary_guns_desc:0 "Securing the future of the revolution in our nation and many others can only be accomplished with a steady rifle."
gram_focus_alb_lower_class_education:0 "Lower Class Education"
gram_focus_alb_lower_class_education_desc:0 "Developing proper education programs for the future working class of our nation should be our main priority."
gram_focus_alb_industrial_investment:0 "Industrial Investment"
gram_focus_alb_industrial_investment_desc:0 "The interest from the USSR to invest in our nation is indeed intriguing, but it’s important to ensure that such investments do not come at a significant cost to us."
gram_focus_alb_new_step_forward:0 "New Step Forward"
gram_focus_alb_new_step_forward_desc:0 "We have successfully secured the future of our nation and set the foundation for prosperity. Now, it is time to step onto the global stage and engage with the world."
gram_focus_alb_defender_of_peasantry:0 "Defender of Peasantry"
gram_focus_alb_defender_of_peasantry_desc:0 "Our leader, Hoxha, has led peasants and workers towards liberation from past shackles. In recognition of his contributions, we shall honor him with the title 'Defender of Peasantry.'"
gram_focus_alb_one_union_solution:0 "One Union Solution"
gram_focus_alb_one_union_solution_desc:0 "The current Soviet war effort is somewhat underwhelming. As a result, both Hoxha and Stalin agreed that if the USSR were to fall, the two nations—Albania and the USSR would establish a new government, transforming the region into a vast federation made up of former Soviet republics along with newly included Albania."
gram_focus_alb_soviet_arms_shipments:0 "Soviet Arms Shipments"
gram_focus_alb_soviet_arms_shipments_desc:0 "The supply of Soviet arms will greatly enhance our ability to protect our nation and ensure our sovereignty."
gram_focus_alb_renounce_the_treaty_of_tirana:0 "Renounce the Treaty of Tirana"
gram_focus_alb_renounce_the_treaty_of_tirana_desc:0 "We have long awaited the moment to free ourselves from the Italian grip on our nation. Now, at last, we stand on the brink of true independence and can embrace our freedom."
ALB_restore_elections:0 "Restore Elections"
ALB_restore_elections_desc:0 "Now that the democrats have gained enough support, the time has finally come to restore our elections. This will allow the people to freely vote for the first time in a long time."
ALB_communist_victory:0 "Socialist Victory"
ALB_communist_victory_desc:0 "The socialists have won in our elections, the very party we have attempted to oppose"
ALB_democratic_victory:0 "Democracy Prevails!"
ALB_democratic_victory_desc:0 "The democrats have won our election, cementing us in the books as truly democratic for the first time in many years."
ALB_secure_the_administration_dem:0 "Secure the Administration"
ALB_secure_the_administration_dem_desc:0 "We must secure our democratic administration to secure our new democratic rule to prevent it from collapsing whenever we leave the office inevitably."
ALB_secure_the_military_administration_dem:0 "Secure the Military Administration"
ALB_secure_the_military_administration_dem_desc:0 "Our military, having been under multiple different leaders in the past few years, must be secured to ensure they do not lead a revolt against us."
ALB_secure_the_people_dem:0 "Secure the People"
ALB_secure_the_people_dem_desc:0 "The People, a countries worst nightmare if they do not support you, or a countries best dream if they do. We must secure their support to maintain the democracy in this nation."
ALB_our_new_era_dem:0 "Our New Era"
ALB_our_new_era_dem_desc:0 "Our new era has begun, we must take advantage of this."
ALB_exile_hoxha:0 "Exile Hoxha"
ALB_exile_hoxha_desc:0 "Hoxha, being the head of the countries communist party, must be exiled in order to secure the new democratic regime; we mustn't allow his past to define our nation."
ALB_communist_coup:0 "Communist Coup"
ALB_communist_coup_desc:0 "Communism has grown strong enough to secure  a steady majority of the people in a coup."
ALB_constitutional_zog:0 "Return of Zog"
ALB_constitutional_zog_desc:0 "Zog, being our former monarch, shouldn't be disgraced down to a normal pedestrian. He should be allowed to live out his days as a constitutional monarch over Albania, such as the English crown."
ALB_the_west:0 "The West"
ALB_the_west_desc:0 "The Western powers are who we must align with to survive in the world of today"
ALB_diplomatic_action:0 "Our Diplomacy"
ALB_diplomatic_action_desc:0 "Our diplomacy; Our diplomacy lies either with ourselves or the allies, we must do what will cement our survival in this world."
ALB_ourselves:0 "Our Own Path"
ALB_ourselves_desc:0 "We must secure ourselves on our own path to survive in this world."