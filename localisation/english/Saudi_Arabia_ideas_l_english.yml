l_english:
  ##################################
  ### 开局 ###
  ##################################
  SAU_xijila_modifiers: "Hijrah"
  SAU_xijila_modifiers_desc: "The word Hijrah means village or settlement. The nature of Hijrah is an agricultural-military reclamation organization. It not only expanded Saudi Arabia's agricultural production and developed the national economy, but also cultivated military power. The settlers of Hijrah are basically composed of members of different Bedouin tribes."
  modify_SAU_xijila_modifiers: "§Y$SAU_xijila_modifiers$§!Additional effects:"
  SAU_diqu_nueji: "Malaria is rampant"
  SAU_diqu_nueji_desc: "Malaria is an acute infectious disease caused by Plasmodium, which is transmitted by mosquitoes and occurs periodically."
  modify_SAU_diqu_nueji: "§Y$SAU_diqu_nueji$§!Additional effects:"
  qingli_nueji_dachenggong: "Defeating malaria"
  qingli_nueji_dachenggong_desc: "Through the concerted efforts of our people, we have defeated the widespread malaria and emerged from the quagmire of disease. Our victory over malaria will become a monument to Saudi Arabia's modernization."
  SAU_yihewan_de_yubo: "Purge of the Ikhwan?"
  SAU_yihewan_de_yubo_desc: "Ikhwan, meaning brotherhood, refers specifically to the Bedouin who have abandoned their nomadic lifestyle and moved into settlements with complete religious functions—the Hijra. Due to the nomads' habituation to desert life, and particularly the class divisions within the Ikhwan, hired farmers and impoverished herders could no longer bear the feudal exploitation and oppression, and continued resistance struggles occurred. A large-scale Ikhwan uprising broke out in 1929-1930, and the nomadic tribes severed the connection between Mecca, Riyadh, and the Persian Gulf."
  modify_SAU_yihewan_de_yubo: "§Y$SAU_yihewan_de_yubo$§!Additional effects:"
  SAU_Wahhabi: "Wahhabi Movement"
  SAU_Wahhabi_desc: "Founded in the mid-8th century by the Islamic scholar Muhammad ibn Abdul Wahhab in the Najd region of the Arabian Peninsula. The sect calls itself "monotheists" and is named after its founder, Wahhab. Wahhab absorbed the jurisprudence of the Hanbali school of Sunni Islam and the revivalist ideas of Ibn Taymiyyah, proposing a religious revival."
  modify_SAU_Wahhabi: "§Y$SAU_Wahhabi$§!Additional effects:"
  SAU_yihewan_Wahhabi: "Wahhabi Monotheism"
  SAU_yihewan_Wahhabi_desc: "Wahhabiism advocates strict adherence to the doctrine of monotheism, rejecting polytheism and all forms of "unconventionality." It adheres to the Quran and Hadith, restoring the orthodox beliefs of the time of the Prophet Muhammad. It opposes Sufism and the worship of saints."
  modify_SAU_yihewan_Wahhabi: "§Y$SAU_yihewan_Wahhabi$§!Additional effects:"
  ##################################
  ### 地区 ###
  ##################################
  SAU_yuanshi_youmu_shenghuo: "Unstable nomadic society"
  SAU_yuanshi_youmu_shenghuo_desc: "The Bedouin are seen as a subversive force, and periodic struggles among tribes for control of the region's meager resources disrupt trade routes and sow doubts and insecurity about Saudi Arabia's security and stability."
  modify_SAU_yuanshi_youmu_shenghuo: "§Y$SAU_yuanshi_youmu_shenghuo$§!Additional effects:"
  SAU_shenyepai_shequ: "Oppressed Shia"
  SAU_shenyepai_shequ_desc: "Saudi Shia, primarily concentrated in the oil-producing regions, have been relegated to second-class citizenship within Saudi Arabia, with little interaction between Shia and Sunni communities within the kingdom. As long as this policy of religious discrimination persists, religious and political opposition to the Saudi government will remain resilient."
  modify_SAU_shenyepai_shequ: "§Y$SAU_shenyepai_shequ$§!Additional effects:"
  SAU_state_mofangongcheng_dynamic_modifier: "Model Project"
  SAU_zhihuigong_diqu: "House of Wisdom"
  SAU_zhihuigong_diqu_desc: "Under our enlightened leadership, the rebuilt House of Wisdom has become a symbol of knowledge and enlightenment in Baghdad. Meticulously restored, this former sanctuary of scholars now radiates with splendor. Learned minds will gather here to exchange knowledge and foster innovation. The House of Wisdom's library, housing ancient texts, will also be revitalized, illuminating a new era of enlightenment. Our nation will forever be remembered as a patron of wisdom."
  SAU_ranshao_shengcheng_modifiers: "The Burning Holy City"
  ##################################
  ### 经济 ###
  ##################################
  SAU_shiyou_maoyi_xiuzheng: "Shallow oil fields"
  SAU_wunian_jihua: "[SAU.GetAdjective] Five-Year Plan"
  SAU_wunian_jihua_desc: "Despite its strong communist overtones, the Five-Year Plan is undeniably a useful tool for planning a country's economic development. We should introduce plans to guide the development of our industry."
  modify_SAU_wunian_jihua: "§Y$SAU_wunian_jihua$§!Additional effects:"
  fan_alabo_youguan: "Trans-Arabian Pipeline"
  fan_alabo_youguan_desc: "At the time of its completion, the Trans-Arabian Pipeline (Tapline) was the world's largest oil pipeline system. It runs east to north through the Kingdom of Saudi Arabia to the city of Sidon in Lebanon. Completed in 1950, the pipeline transports oil to European markets across the Mediterranean."
  SAU_oil_baron_idea: "[SAU.GetAdjective] Oil Baron"
  SAU_oil_baron_idea_desc: "Our nation is absolutely swimming in oil, especially now that we've successfully freed ourselves from [ENG.GetAdjective] control over our resources. What should we do with this wealth? Keep it for ourselves."
  SAU_shiyou_goumai: "[SAU.GetAdjective] Purchase of Oil"
  SAU_shiyou_shomai: "[FROM.GetAdjective] Purchase of Oil"
  SAU_huangjin_kaicai: ""Gold of Mahd Dahab"
  SAU_huangjin_kaicai_desc: "Mahad Dahab boasts Saudi Arabia's oldest gold mines, harnessing modern technology to mine and exploit them, purchasing the necessary supplies, expertise, and tools, and delivering them to where they are most needed."
  SAU_alaboma_mapi: "Arabian Horse"
  SAU_alaboma_mapi_desc: "The Arabian horse is the oldest horse breed on Earth. It was first domesticated by humans and has become their most loyal companion throughout history. Its fearlessness, swiftness, and endurance make it an excellent choice for war. "
  jialifuniya_alabo_shiyougongsi: "Standard Oil Company of California"
  jialifuniya_alabo_shiyougongsi_desc: "On May 29, 1933, Saudi Arabia and Standard Oil Company of California signed a concession agreement, allowing California-Arabian Standard Oil Company, a wholly owned subsidiary of Standard Oil Company of California, to explore for oil in Saudi Arabia."
  modify_jialifuniya_alabo_shiyougongsi: "§Y$jialifuniya_alabo_shiyougongsi$§!Additional effects:"
  ##################################
  ### 政治 ###
  ##################################
  SAU_meiyou_jiandie_dlc: "[SAU.GetAdjective] Counterintelligence Program"
  SAU_meiyou_jiandie_dlc_desc: "Espionage is one of the many fronts we must confront in this global conflict, so being able to effectively deploy our own counterintelligence program is crucial to our survival. We have adopted a stance that emphasizes defensive policies over offensive covert action tactics."
  SAU_honglan_fanduipai: "Breaking the Shackles"
  SAU_honglan_fanduipai_desc: "The Islamic Revolution is a religious obligation for all Muslims; essentially, it is a revolution against backwardness, oppression, and tyranny. Every conscientious believer has a religious duty and a legal obligation to protest against the corrupt realities."
  modify_SAU_honglan_fanduipai: "§Y$SAU_honglan_fanduipai$§!Additional effects:"
  SAU_jiudi_xingui: "Old Enemies Return"
  SAU_jiudi_xingui_desc: "Wahhabism has led our once glorious nation down a path of no return. Soon, our covetous neighbors will realize the regime's weakness and strike a fatal blow. If we are to save our beloved homeland, the Wahhabis must be driven out!"
  modify_SAU_jiudi_xingui: "§Y$SAU_jiudi_xingui$§!Additional effects:"
  SAU_disorganized_armed_forces: "Army disorganization"
  SAU_shate_kangmi: "Saudi Communism"
  SAU_shate_kangmi_desc: "We are part of the kingdom of the truly oppressed, while the Saudi monarchy is part of the kingdom of the true oppressors and colonizers. The ongoing battle is between these two kingdoms... Our struggle against tyranny is a long chain of world revolution that will inevitably lead to the collapse of the imperialist superpowers and the rise of the oppressed world."
  modify_SAU_shate_kangmi: "§Y$SAU_shate_kangmi$§!Additional effects:"
  SAU_jihua_jingji: "Planned Economy"
  SAU_jihua_jingji_desc: "A strong nation requires a strong, purposeful, and far-sighted economic system. By adopting a planned economy, we can allocate resources efficiently, prioritize industrial development, and ensure fair development for all citizens."
  modify_SAU_jihua_jingji: "§Y$SAU_jihua_jingji$§!Additional effects:"
  SAU_junshi_jihua_weiyuanhui: "Military Commission"
  SAU_junshi_jihua_weiyuanhui_desc: "We must establish a specialized agency to coordinate and plan the revolutionary struggle against the enemy."
  modify_SAU_junshi_jihua_weiyuanhui: "§Y$SAU_junshi_jihua_weiyuanhui$§!Additional effects:"
  enemy_operative_detection_chance_tt: "$MODIFIER_ENEMY_OPERATIVE_DETECTION_CHANCE_FACTOR$：§G+10.0％§!"
  SAU_yisilan_makesi: "Islam-Marxism"
  SAU_yisilan_makesi_desc: "While Islam does not reflect the ideas and perspectives of Marxism, it is a good guiding tool. We should protect Islam and unify it with our own ideology. Cooperation with religious schools will pave the way for this."
  SAU_sulian_gongye_yuanzhu: "Soviet Industrial Aid"
  SAU_sulian_gongye_yuanzhu_desc: "Our allies possess greater industrial capacity than we do. We will need their help if we are to weather the coming storm."
  SAU_sulian_lianhe_junshi_xueyuan: "Soviet-Arab Military Academy"
  SAU_sulian_lianhe_junshi_xueyuan_desc: "Jeddah, a city steeped in history and strategically located near the Persian Gulf, offers an ideal setting for a new school to train politicized officers, where they will learn not only the fundamentals of warfare but also the profound ideas of Marxist thought."
  SAU_SOV_tech_sharing_group_name: "Arab-Soviet Technical Cooperation Agreement"
  SAU_SOV_tech_sharing_group_desc: "[SAU.GetNameDef] and [SOV.GetNameDef] have begun sharing knowledge and scientific breakthroughs for the benefit of both nations."
  SAU_USA_tech_sharing_group_name: "British Technology Exchange Program"
  SAU_USA_tech_sharing_group_desc: "British and Arab countries have agreed to share their scientific knowledge, a move by Arab governments to collaborate more closely on foreign policy with their northern neighbors."
  SAU_Islamic_tech_sharing_name: "Saudi-USA Technology Agreement"
  SAU_Islamic_tech_sharing_desc: "The United States and the Arabs have agreed to share their scientific knowledge, a move by Arab governments to cooperate more closely with their northern neighbors on foreign policy."
  SAU_communist_influence: "Communist influence from [SAU.GetNameDef]"
  SAU_zhongdong_fankang_modifier: "Arab Revolt"
  SAU_zhongdong_fankang_modifier_desc: "[SAU.GetNameDef] is covertly supplying weapons and equipment to local resistance groups and providing them with military training."
  SAU_lianhe_jundui: "United Arab-Middle Eastern Revolutionary Army"
  SAU_lianhe_jingji: "Arab-Middle Eastern Economic Integration"
  SAU_tuanjie_gongfu_shengli: "United for Victory"
  SAU_tuanjie_gongfu_shengli_desc: "Arabs have suffered foreign domination for too long, but now is the time for our people to join the fight against the invaders and defend our homeland and rights."
  SAU_expanding_the_revolution: "Expanding the Revolution"
  SAU_expanding_the_revolution_desc: "The revolution has reached [SAU.GetNameDef], and we must now reach beyond our borders. For the sake of our comrades outside [SAU.GetNameDef], now is the time to spread the revolution."
  SAU_nimen_jiangyou_meihaode_rensheng: "You will have a better tomorrow."
  SAU_nimen_jiangyou_meihaode_rensheng_desc: "As our economies and cultures merge, a new sense of identity is emerging, advocating for an expanded meaning of [SAU.GetAdjective]. From now on, we are one people, one nation."
  SAU_anfu_buluo: "Appeasing the Tribes"
  SAU_anfu_buluo_desc: "There are still many tribal leaders who do not fully trust our government. We should appease them, invest in their communities, and ensure their loyalty is ours alone."
  ############蓝线####################
  SAU_lanxian_dongtaijingshen: "Saudi Socialism"
  SAU_lanxian_dongtaijingshen_desc: "The path to liberal democracy is now open to us. It is time to take decisive steps to build a fair society in our country and secure [SAU.GetAdjective] its proper place on the international stage."
  modify_SAU_lanxian_dongtaijingshen: "§Y$SAU_lanxian_dongtaijingshen$§!Additional effects:"
  SAU_gongheguo_weidui: "Republican Guard"
  SAU_gongheguo_weidui_desc: "Given the current situation, the Republic faces great danger. The Republic must establish a National Guard to combat the grave threats that seek to kill us. Soldiers, fight for your Republic!"
  SAU_zongjiao_ziyou: "Religious Freedom"
  SAU_zongjiao_ziyou_desc: "Everyone should have the right to choose their own religion. We will sign new laws to guarantee this."
  SAU_yumeiguo_mengyouguanxi: "Close Relations with Washington"
  SAU_yumeiguo_mengyouguanxi_desc: "In a spirit of alliance and cooperation, we have strengthened our political ties with [USA.GetNameDef]. As we act together on the vital principles of freedom and democracy, nothing from the European powers can divide our unity."
  SAU_yu_yingguo_guanxi: "Close Relations with London"
  SAU_yu_yingguo_guanxi_desc: "As long as we continue to support each other, [SAU.GetNameDef] is a friend of [ENG.GetNameDev]. It is vital that our two countries maintain political ties and ensure that our goals align."
  SAU_lanxian_beizhan: "Prepare for War"
  SAU_lanxian_beizhan_desc: "The Fertile Crescent looms above us, ripe for the picking. Our armies prepare for war, while our politicians and diplomats feverishly craft documents and ultimatums, preparing our conquests. We are rattlesnakes ready to strike."
  ############历史线开端####################
  SAU_yiben_shate_luxian: "Constitution of the Kingdom of Hejaz"
  SAU_yiben_shate_luxian_desc: "The Kingdom of Hejaz is a 'consultative Islamic monarchy with independent internal and external affairs', governed by the full authority of King Ibn Saud. The King is a successor to the Saudi royal family, and the legal form of succession is primarily derived from Islamic law and traditional customs. The King enjoys supreme authority."
  modify_SAU_yiben_shate_luxian: "§Y$SAU_yiben_shate_luxian$§!Additional effects:"
  SAU_battaglia_per_la_terra: "Land War"
  SAU_battaglia_per_la_terra_desc: "Our land campaign will drain miles of swamps to create farmland. It will also provide new jobs, and the resilience of the [SAU.GetAdjective] people will impress foreign governments."
  SAU_baoxian_zhidu: "King's Insurance System"
  SAU_baoxian_zhidu_desc: "The insurance system provides life insurance for our enlisted personnel, should the worst happen to them. Knowing their families will be taken care of has significantly increased the number of people willing to join the military."
  SAU_duifang_touzi_women: "Investing in Saudi Arabia"
  SAU_duifang_touzi_women_desc: "Investing a portion of our funds in [SAU.GetNameDev] not only unites the two countries but also strengthens our ally, ready to be called upon should we need them to repay a favor in the future."
  SAU_waijiao_jueze: "Diplomatic Decision"
  SAU_waijiao_jueze_desc: "Given global tensions, [ROOT.GetLeader] believes we should coordinate military and foreign policy across the region to better protect against future aggression."
  SAU_chuantongxingbie_juese: "Traditional Gender Roles"
  SAU_chuantongxingbie_juese_desc: "By establishing the traditional gender roles of 'men responsible for the outside world, women responsible for the home', everyone will know their place and what they desire."
  SAU_guojia_rentong: "Strengthening National Identity"
  SAU_guojia_rentong_desc: "We are a nation of orthodox Islam—and this is an important part of our national identity. Glory be to you, Allah, our hope, glory be to you."
  SAU_yaoqing_gongren: "Inviting Soviet workers"
  SAU_yaoqing_gongren_desc: "The oil discoveries in the Eastern Provinces have encouraged many [SOV.GetAdjective] to come and help develop the country, while also improving the quality of life for our people and our industrial capacity."
  SAU_state_aiji_shengfen_fankang: "Supporting the Egyptian Brotherhood"
  SAU_state_aiji_shengfen_fankang_desc: "The Egyptian Muslim Brotherhood (Ikhwan Al-Muslimeen) is the only Islamic group in Egypt that advocates replacing the monarchy with Sharia law and has not strayed from the radical ideas of former teacher Hassan al-Banna. If we want to expand the Caliphate into Egypt, we must help them launch their uprising."
  ############阿拉伯帝国线####################
  SAU_dizhi_xihua: "Resist Western Poisoning"
  SAU_dizhi_xihua_desc: "Excessive Westernization is a great scourge upon our great nation. Rather than catering to the fantasies of the colonizers, we must establish an independent regime united under the banner of God."
  SAU_emergency_measures: "Emergency Measures"
  SAU_emergency_measures_desc: "To survive in an increasingly aggressive world, [SAU.GetNameDef] must rapidly develop substantial industrial capacity to meet the nation's needs."
  SAU_emergency_measures: "Restore the Spirit of the Ikhwan"
  SAU_emergency_measures_desc: "Reignite the Ikhwan Movement and use it to reclaim our territories and become the hegemon of the Muslim world."
  SAU_alabo_diguo_qibing: "Arab Cavalry"
  SAU_alabo_diguo_qibing_desc: "Our cavalry is renowned for its formidable reputation. Wherever we send them, destruction and terror follow. Let us continue to cultivate this impression, and let us triumph through fear alone."
  SAU_alabo_diguo_mubalizun: "Modernized Mubalizun"
  SAU_alabo_diguo_mubalizun_desc: "Modeled after the legendary warriors of the armies of the Four Righteous Caliphs, our Mubalizun soldiers are trained to excel in both positional and individual combat."
  SAU_imperial_expansionism_idea: "Imperial Expansionism"
  SAU_imperial_expansionism_idea_desc: "It is time to demonstrate to the world what [SAU.GetNameDef] is capable of. We have activated our production lines and conscripted our people. Soon, we will fight for glory!"
  SAU_alabo_diguo_alabo_shijie_zhizhu: "Lord of the Arab World"
  SAU_alabo_diguo_alabo_shijie_zhizhu_desc: "Arabs have been divided for centuries, but we remember that the Prophet Muhammad united us in one ummah, one pious community that transcends tribal affiliations. Now we have overcome our divisions and recaptured the success of the Prophet's time: a united Arabia!"
  ############奥斯曼线####################
  SAU_xuancheng_aosiman_wenhao: "Rebuilding the Ottomans?"
  SAU_xuancheng_aosiman_wenhao_desc: "What a crazy idea..."
  SAU_xuancheng_aosiman_wenhao_tt: "We will eliminate this national spirit when we control §Y[797.GetName]§!"
  SAU_xiandaihua_aosiman_guanzhi: "Modern Ottoman Government"
  SAU_xiandaihua_aosiman_guanzhi_desc: "A reformed form of Ottoman government. It addresses deficiencies while strengthening the Sultan's authority."
  SAU_huangjia_hunli: "Wedding Celebrations"
  SAU_apsiman_minbing: "The Devshirme System"
  SAU_apsiman_minbing_desc: "By recruiting young men from newly conquered territories, we can significantly speed up conscription. Let us further implement and improve this system to accommodate our nation's expansion."
  SAU_aosiman_changshengjun: "Muhammad's Victorious Army"
  SAU_aosiman_changshengjun_desc: "Mansur's Army, also known as Muhammad's Ever-Victorious Army, is an elite corps formed after the abolition of the Janissary Corps. They were trained in Europe, possessing strict discipline, diligent training, and unwavering loyalty to the Sultan."
  SAU_yeniqieli_xiandaihua: "Modernized Janissaries"
  SAU_yeniqieli_xiandaihua_desc: "The Janissaries have once again become the core of our nation's military. They are prepared to swear allegiance to the Sultan in exchange for becoming one of the many Ottoman classes."
  SAU_aosiman_baohuangpan_neiiluan: "Ottoman Royalist Civil War"
  ############哈希姆线####################
  SAU_haximu_saiyide: "Sayyid"
  SAU_haximu_saiyideSAU_yeniqieli_xiandaihua_desc: "Hassan and Hussein were the two grandsons of the Prophet Muhammad. Their numerous descendants are revered as holy queens and hold special titles among Muslims. Hassan's descendants are called Sharifs, and Hussein's descendants are called Sayyids. They all have the right to wear green turbans."
  ############伊赫万线####################
  max_surrender_limit_offset_tt: "$MODIFIER_MAX_SURRENDER_LIMIT_OFFSET$：$RIGHT|+=%1$"
  SAU_yihewan_denglu_dongfei: "Across the Strait"
  SAU_yihewan_denglu_dongfei_desc: "Our Muslim brothers in the Horn of Africa face the prospect of subjugation by the pagan Christians of Ethiopia, or even worse, by the primitive polytheists of the Oromia region. We must advance to ensure Muslim control of the region."
  SAU_yihewan_ouzhoujingkong: "Trembling with fear"
  ############无政府线####################
  SAU_duoshenjiao_jiaxiliye_dynamic: "Jiaxiliye"
  SAU_duoshenjiao_jiaxiliye_dynamic_desc: "Civilization is unnatural, humanity's futile and blasphemous attempt to impose order on an inherently disordered creation. We embrace nature, living according to God's will, wild and free."
  modify_SAU_duoshenjiao_jiaxiliye_dynamic: "§Y$SAU_duoshenjiao_jiaxiliye_dynamic$§!Additional effects:"
  stability_weekly_tt: "$MODIFIER_STABILITY_WEEKLY$§R-0.01%§!\n\n"
  SAU_duoshenjiao_zuxian_chongbai: "Honoring ancestors"
  SAU_duoshenjiao_zuxian_chongbai_desc: "It is not just one faith that unites us, but rather a multitude of faiths that make up the religious ecology of our society. While claiming to be different and following different paths, some outsiders to our belief system have learned to coexist within our society, as if they were part of it."
  modify_SAU_duoshenjiao_zuxian_chongbai: "§Y$SAU_duoshenjiao_zuxian_chongbai$§!Additional effects:"
  ################################## 
  ### 军事 ###
  ##################################
  SAU_junshi_one: "Increase the military budget"
  SAU_junshi_one_desc: "National security is paramount. With a higher military budget, the military can equip itself with better equipment and be prepared for all potential threats."
  SAU_touzi_jixiehua: "Invest in mechanization"
  SAU_Royal_Saudi_Army: "Arab Army"
  SAU_Royal_Saudi_Army_desc: "Our armed forces may not appear impressive to visiting observers, but our people possess a genuine fighting spirit: a fire within them that will never be extinguished. This is a precious quality that we must cultivate so that we can face our enemies head-on."
  modify_SAU_Royal_Saudi_Army: "§Y$SAU_Royal_Saudi_Army$§!Additional effects:"
  SAU_self_propelled_guns_military_industry_tt: "$modify_SAU_Royal_Saudi_Army$\n$ITA_self_propelled_guns_dynamic_modifier_tt$\n"
  Saudi_Arabia_junshi_panyan_julebu_tt: "§Y$SAU_Royal_Saudi_Army$§!Additional effects:\n$MODIFIER_MOUNTAINEERS_SPECIAL_FORCES_CONTRIBUTION_FACTOR$：§G-20.0％§!\n$modifier_army_sub_unit_mountaineers_attack_factor$：§G+10.0%§!\n$modifier_army_sub_unit_mountaineers_defence_factor$：§G+10.0%§!\n$modifier_army_sub_unit_mountaineers_speed_factor$：§G+10.0%§!\n$special_forces_cap_tt$：§G+10.0%§!\n$modifier_trait_hill_fighter_xp_gain_factor$：§G+20.0%§!\n$modifier_unit_mountaineers_design_cost_factor$：§G-50.0％§!\n\n"
  Saudi_Arabia_junshi_luotuo_qibing_tuan_tt: "§Y$SAU_Royal_Saudi_Army$§!Additional effects:\n$modifier_army_sub_unit_camelry_attack_factor$：§G+12.0％§!\n$modifier_army_sub_unit_camelry_defence_factor$：§G+12.0%§!\n$modifier_army_sub_unit_camelry_speed_factor$：§G+12.0%§!\n$heat_attrition_factor_tt$：§G-20.0%§!\n$modifier_trait_desert_fox_xp_gain_factor$：§G+30.0%§!\n$acclimatization_hot_climate_gain_factor_tt$：§G+20.0%§!\n\n"
  
  SAU_Royal_Saudi_Air: "Arab Air Force"
  SAU_Royal_Saudi_Air_desc: "Although our air force didn't send personnel to Italy to study aviation technology until 1931, the [SAU.GetAdjective] people have been fighting in the skies since the Arab Revolt! We have long understood the importance of a strong air force. If only we could find a way to strengthen ours..."
  modify_SAU_Royal_Saudi_Air: "§Y$SAU_Royal_Saudi_Air$§!Additional effects:"
  Saudi_Arabia_junshi_sanbing_tt: "§Y$SAU_Royal_Saudi_Air$§!Additional effects:\n$modifier_trait_paratrooper_xp_gain_factor$：§G+30.0％§!\n$modifier_unit_paratrooper_design_cost_factor$：§G-50.0%§!\n\n"
  air_wing_xp_loss_when_killed_factor_tt: "$MODIFIER_AIR_WING_XP_LOSS_WHEN_KILLED_FACTOR$：§G-15.0％§!"
  production_speed_rocket_site_factor_tt: "$modifier_production_speed_rocket_site_factor$：$RIGHT|+=%1$"
  navy_anti_air_attack_tt: "Carrier-based aircraft anti-air attack: §G +10.0%§!"
  navy_carrier_air_attack_factor_tt: "Carrier-based aircraft anti-air targeting: §G +10.0%§!"
  army_bonus_air_superiority_factor_tt: "$MODIFIER_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$：§G+10.0％§!"

  SAU_Royal_Saudi_Naval: "Arab Navy"
  SAU_Royal_Saudi_Naval_desc: "The Navy is the guardian of our coasts. We must build a Navy. Our Navy will need competent officers and admirals to command it."
  modify_SAU_Royal_Saudi_Naval: "§Y$SAU_Royal_Saudi_Naval$§!Additional effects:"
  invasion_preparation_tt: "Landing preparation time: §G -10.0%§!"
