 LIB_anti_colonialism_decision:0 "Anti-[FROM.GetAdjective] Propaganda"
 LIB_anti_colonialism_decision_desc:0 "[FROM.GetAdjective] imperialism in Africa must end. The world need to wake up and realize that the days of [FROM.GetAdjective] colonialism are over. The people of [FROM.GetNameDef] must take pressure their leaders to release their suppressed African colonies."
 LIB_demand_peace_decision:0 "Demand [?FROM.previous_overlord.GetAdjective] recognition of [FROM.GetNameDef]"
 LIB_demand_peace_decision_desc:0 "The brave people of [FROM.GetName] have risen up against the [?FROM.previous_overlord.GetAdjective] tyranny. We should act now, and use whatever means necessary to force [?FROM.previous_overlord.GetNameDef] to withdraw from [FROM.GetAdjective] territory."
