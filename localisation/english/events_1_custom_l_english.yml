l_english:
1_custom.1.t:0 "1938 Colombian Elections"
1_custom.1.d:0 "The elections of 1938 are here, and the Liberal party seeks a new candidate for election. The recent reforms and social efforts have been popular with the people, but many moderates in the government seek an end to these reforms. "
1_custom.1.a:0 "The Liberals!"
1_custom.1.b:0 "The Moderates!"
1_custom.2.t:0 "The 1942 Colombian Elections"
1_custom.2.d:0 "Four years have passed and it's time for another election. The Liberals once again seek to cement control of the government, while the Moderates have remained a divisive thorn in their side. The Liberals seek further cooperation with allied nations like the United States, while the Moderates wish to normalize relations with allied opponents like Germany and Japan."
1_custom.2.a:0 "The Liberals!"
1_custom.2.b:0 "The Moderates!"
1_custom.2.c:0 "The Liberals!"
1_custom.2.d:0 "The Moderates!"
1_custom.3.t:0 "The 1941 Venezuelan Election"
1_custom.3.d:0 "Many reforms to the government have been enacted over the last few years, and the President has been pushing the nation towards democracy (while keeping many executive powers, of course.) Constitutional reforms and reduced presidential term limits will likely set a precedent, and the President is likely to resign to allow a new president take office."
1_custom.3.a:0 "Democracy is taking shape"
1_custom.4.t:0 "Haitian Immigrant Crisis"
1_custom.4.d:0 "An influx of immigrants from Haiti have flooded to the Dominican Republic, many seeking refuge and shelter from their country."
1_custom.4.a:0 "This is unexpected..."
1_custom.5.t:0 "El Corte"
1_custom.5.d:0 "Ordered by Trujillo, thousands of Haitian immigrants were deemed to be illegals and were ordered to be executed. Nearly three fifths of the Haitian immigrant population was killed in the Republic, and while trying to flee across the river back towards the border. Nicknamed, The Parsley Massacre, after soldiers were ordered to force suspected immigrants to pronounce the word, if unable to the satisfaction of the officer were then accused of being Haitian and killed."
1_custom.5.a:0 "Trujillo never to be tested again!"
1_custom.6.t:0 "The Parsley Massacre"
1_custom.6.d:0 "Thousands of Haitian emigrants leaving Haiti and rested in the Dominican Republic were slaughtered under the order of Trujillo with many of the immigrants attempting to flee back to Haiti. Many killed while trying to flee, hundreds of bodies drifted down the river and tens of thousands were killed. Nicknamed The Parsley Massacre from officers and soldiers forcing suspected immigrants to pronounce the word parsley, and if not to the officer's liking were then accused of being an immigrant and killed."
1_custom.6.a:0 "Dear God!"
