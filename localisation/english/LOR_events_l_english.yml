  LOR.84.t:0 "Trial of legionnaires begin"
  LOR.84.d:0 "Following a series of violent uprisings and assassination plots orchestrated by the Iron Guard, the Romanian government, under the leadership of King Carol II and General Ion Antonescu, decides to put the legionnaires on trial. The objective is to dismantle the fascist organization and restore stability, but this move risks further polarizing an already divided country."
  LOR.84.a:0 "THEY WILL PAY FOR THE CRIMES"
  LOR.85.t:0 "Trial of Horia Sima"
  LOR.85.d:0 "Following a violent rebellion instigated by the Iron Guard, King Carol II and General Antonescu decide to hold Sima accountable for his role in the uprising. The trial becomes a symbol of the monarchy's authority and the military's determination to eradicate extremism and maintain stability."
  LOR.85.a:0 "He will be executed for what he did!"
  LOR.86.t:0 "Trial of Zelea Codreanu"
  LOR.86.d:0 "Following a violent rebellion instigated by the Iron Guard, King Carol II and General Antonescu decide to hold Sima accountable for his role in the uprising. The trial becomes a symbol of the monarchy's authority and the military's determination to eradicate extremism and maintain stability."
  LOR.86.a:0 "He will be hung for the crimes he commited!"
  LOR.87.t:0 "Impending rebelion!"
  LOR.87.d:0 "Discontent with the government's policies and alliances, the Iron Guard seizes key strategic points in Bucharest and other major cities, challenging the authority of King Carol II and General Ion Antonescu."
  LOR.87.a:0 "To arms!"

  LOR.88.t:0 "Carol II abdicated!"
  LOR.88.d:0 "Marking the culmination of mounting tensions between King Carol II and the increasingly powerful Iron Guard. Faced with a growing rebellion and political instability orchestrated by the Iron Guard, as well as pressure from military leaders like General Antonescu, Carol II makes the decision to abdicate the throne."
  LOR.88.a:0 "Maybe Mihai will take the throne?"

  LOR.89.t:0 "No compromise for Transylvania"
  LOR.89.d:0 "As tensions escalate over the disputed region, Romania, under the combined leadership of King Carol II, General Ion Antonescu, and the Iron Guard's Horia Sima, adopts an uncompromising stance. Determined to maintain national sovereignty and territorial integrity, Romania prepares for the inevitable conflict with Hungary."
  LOR.89.a:0 "Transylvania will always stay in Romania"
  LOR.89.b:0 "No deal with Romanians!"

  LOR.90.t:0 "Germans agreed on our terms!"
  LOR.90.d:0 "Following intense negotiations and strategic maneuvering, Romania, under the leadership of King Carol II and Prime Minister Ion Antonescu, convinces Germany to recognize Romanian sovereignty over Transylvania. This agreement is reached amidst complex geopolitical calculations and shifting alliances in Europe."
  LOR.90.a:0 "A victory for Romanians!"

  LOR.91.t:0 "Germans rejected our terms!"
  LOR.91.d:0 "Despite Romania's efforts, led by King Carol II and Prime Minister Ion Antonescu, Germany refuses to recognize Romanian sovereignty over Transylvania. This rejection occurs amidst complex geopolitical dynamics and competing interests within the Axis alliance."
  LOR.91.a:0 "A major failure for our government!"

  LOR.92.t:0 "Transylvanian deal is signed!"
  LOR.92.d:0 "Following intensive negotiations and strategic maneuvering, Romania, under the leadership of King Carol II and Prime Minister Ion Antonescu, persuades Germany to recognize Romanian sovereignty over Transylvania. This agreement is reached amidst complex geopolitical calculations and shifting alliances in Europe."
  LOR.92.a:0 "A victory for Romanians!"


  LOR.93.t:0 "Nicolae's Dreams"
  LOR.93.d:0 "Nicolae has always dreamt of greatness not just for himself, but for his people and his nation. In the quiet of night, his mind races with images of towering legions, grand imperial cities, and a unified empire stretching across the lands once ruled by Rome. These dreams, vivid and relentless, compel him to act, to pursue what many would deem impossible: the rebirth of Rome under Romanian leadership."
  LOR.93.a:0 "The future of Romania is in your hands, Nicolae!"

  LOR.94.t:0 "Hopes of the Pheonix"
  LOR.94.d:0 "The phoenix, a symbol of rebirth and immortality, has long been tied to the legacy of the Eastern Roman Empire. As Romania seeks to reclaim its destiny, this ancient emblem inspires hope among its people a belief that from centuries of decline and struggle, a new empire can rise, stronger and more enduring than ever before.\nThe vision of a reborn empire resonates deeply with the nation's leaders, but it also carries immense challenges. Rebuilding the phoenix’s wings means uniting fractured lands, overcoming resistance, and reviving the imperial spirit that once burned brightly. Will Romania succeed in kindling the flames of renewal, or will the phoenix remain a distant hope?"
  LOR.94.a:0 "The Double Headed Eagle is Awaiting"

  LOR.95.t:0 "The Judgement Day" 
  LOR.95.d:0 "The fateful hour has arrived. The world watches as Romania stands at the precipice of history, its ambitions poised to reshape the destiny of nations. With its armies ready, its people stirred by imperial fervor, and its enemies both near and far preparing to resist, the empire must now face the ultimate test."
  LOR.95.a:0 "The New Beginning!"

  LOR.96.t:0 "Failed to Claim the Support" 
  LOR.96.d:0 "Despite fervent efforts to rally allies and secure support for our imperial aspirations, our calls have gone unanswered. Key nations remain hesitant, rival claimants undermine our authority, and the people grow wary of the empire's solitary path forward. Without external backing, the dream of a restored empire faces significant challenges."
  LOR.96.a:0 "Our hopes are not yet lost!"

  LOR.97.t:0 "Prepare for the Coronation" 
  LOR.97.d:0 "The moment approaches when the Emperor shall be crowned, solidifying their authority as the ruler of a reborn empire. The coronation must be nothing short of a masterpiece a demonstration of power, unity, and the divine right to rule. Dignitaries from across the world will witness this historic event, and the people look to it as a symbol of their renewed hope and pride."
  LOR.97.a:0 "The Crown is Yours!"

  LOR.98.t:0 "Rise of The Phoenix!"
  LOR.98.d:0 "Like the mythical phoenix, the empire has risen from the ashes of history. Centuries of division and decay have been swept aside, and under determined leadership, the glory of Rome is reborn. From Bucharest to Constantinople, the banners of the empire now fly proudly, proclaiming a new era of strength, unity, and ambition.\n The rebirth of the empire is a moment of triumph, but also one of immense responsibility. The world watches closely, some in awe, others in fear. With this revival comes the challenge of maintaining unity and asserting dominance over those who would oppose us. The phoenix rises, but its flame must be carefully guarded lest it falter."
  LOR.98.a:0 "AVE NICOLAE!"

  LOR.99.t:0 "Nicolae I of Romania, is crowned!"
  LOR.99.d:0 "In a pivotal moment for the nation, Nicolae I has been crowned as the Regent of Romania, stepping into power to guide the country while King Mihai I is still too young to rule. Nicolae’s coronation marks the beginning of a regency aimed at stabilizing the nation and pursuing a vision of strength and unity.\nWhile officially serving as a caretaker, Nicolae’s ambitions are unmistakable. His leadership inspires both hope and unease among the people, as whispers of greater plans circulate. For now, the regency is a symbol of continuity, but the road ahead could redefine Romania’s destiny."
  LOR.99.a:0 "Long live Nicolae!"