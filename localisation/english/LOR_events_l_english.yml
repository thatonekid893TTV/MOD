l_english: 
  LOR.1.t:0 "1 December, the Union Day!"
  LOR.1.d:0 "The union of Transylvania with Romania was declared on 1 December [O.S. 18 November] 1918 by the assembly of the delegates of ethnic Romanians held in Alba Iulia. The Great Union Day, celebrated on 1 December, is a national holiday in Romania that celebrates this event."
  LOR.1.a:0 "Long Live Greater Romania!"
  LOR.2.t:0 "By Blood to Preserve Greater Romania"
  LOR.2.d:0 "After enduring years of struggle during the Great War, we persevered and successfully reunited with our fellow countrymen. While we may have faced some setbacks along the way, our determination never wavered. Ultimately, we entered Bucharest as liberators, reclaiming our capital and achieving a significant victory.\n\nAs a direct outcome of the war, the birth of Greater Romania emerged—a nation-state that extended its reach to encompass the majority of Romanian people. By acquiring territories such as Transylvania and the Banat from Hungary, Bukovina from Austria, and Bessarabia from Russia, our country's territorial expanse doubled in size.\n\n The impact was not limited to geography alone. Romania's population also experienced a remarkable growth, surpassing 16 million individuals. This expansion brought about the inclusion of sizeable minority groups, most notably Hungarians in Transylvania and Jews in Bessarabia. As a result, the non-Romanian population constituted almost 30 percent of the total, marking a significant demographic shift.\n\n These transformative developments not only solidified the territorial integrity of our nation but also ushered in a diverse and vibrant society, setting the stage for new challenges and opportunities as we moved forward into a new era."
  LOR.2.a:0 "Long live Romania!"
  LOR.3.t:0 "Internal Government Struggles"
  LOR.3.d:0 "Romania's governments maintained the form, if not always the substance, of a liberal constitutional monarchy. The National Liberal Party, dominant in the years immediately after World War I, became increasingly clientelist and nationalist, and in 1927 was supplanted in power by the National Peasants' Party. Between 1930 and 1940 there were over 25 separate governments; on several occasions in the last few years before World War II, the rivalry between the fascist Iron Guard and other political groupings approached the level of a civil war."
  LOR.3.b:0 "National-Liberal Party"
  LOR.3.a:0 "National-Agrarian Party"
  LOR.4.t:0 "National-Agrarian Party"
  LOR.4.d:0 "The National Agrarian Party was founded on April 10, 1932 by Octavian Goga, by breaking away from Marshal Averescu's People's Party. The National Agrarian Party failed to assert itself in Romanian political life in the three years of its existence. On July 14, 1935, through the merger with A.C. Cuza's Christian National Defense League and the formation of the Christian National Party, P.N.A. ended its existence."
  LOR.4.a:0 "Long Live Agrarians!"
  LOR.5.t:0 "National-Liberal Party"
  LOR.5.d:0 "Out of Romania's 132 governments, 33 were led by prime ministers affiliated with these forms. The most important events in the modern history of Romania are linked to the name and history of the National Liberal Party: the establishment of the constitutional monarchy (1866), the obtaining of state independence (1877), the elevation of Romania to the rank of a kingdom (1881), the War of Reunification of the Nation and the creation of Greater Romania (1918), the adoption of the Constitution of 1923, and the economic recovery after the crisis of 1929–1933. Throughout this period, liberalism became the ideological foundation on which modern Romania was built."
  LOR.5.a:0 "Long live Liberal Romanian"
  LOR.6.t:0 "Status of the Monarchy in Romania"
  LOR.6.d:0 "The Romanian royal family (Romanian: Familia regală a României) was the ruling dynasty of the Kingdom of Romania, a constitutional monarchy in Central-Eastern Europe. The kingdom existed from 1881, when Carol I of Romania was proclaimed king, until 1947, when the last king, Michael I of Romania, was forced to abdicate and the Parliament proclaimed Romania a republic. Soon after, upon the establishment of the constitution of 13 April 1948, Romania became a people's republic, a regime that lasted until 1989."
  LOR.6.a:0 "Hopefully"
  LOR.7.t:0 "The Arrest of Corneliu Zelea Codreanu"
  LOR.7.d:0 "The Legion attempted to assassinate government officials and journalists, including Constantin Angelescu, undersecretary of Internal Affairs. Codreanu was briefly arrested together with the would-be assassin Gheorghe Beza: both were tried and acquitted. Nevertheless, the wave of violence and a planned march into Bessarabia signalled the outlawing of the party by Premier Gheorghe Mironescu and Minister of the Interior Ion Mihalache (January 1931); again arrested, Codreanu was acquitted in late February."
  LOR.7.a:0 "The Iron Guard must be stopped!"
  LOR.8.t:0 "End of Carol II lifestyle"
  LOR.8.d:0 ""
  LOR.8.a:0 "Finally!"
  LOR.10.t:0 "Carol II Coups the Government!"
  LOR.10.d:0 "Returning to the country on 7 June 1930, in a coup d'état engineered by National Peasant Prime Minister Iuliu Maniu, Carol was recognized by the Parliament as king of Romania the following day.\n For the next decade, he sought to influence the course of Romanian political life, first through manipulation of the rival Peasant and Liberal parties and anti-Semitic factions, and subsequently (January 1938) through a ministry of his own choosing.\n Carol also sought to build up his own personality cult against the growing influence of the Iron Guard, for instance by setting up a paramilitary youth organization known as Straja Țării in 1935.\n The American historian Stanley G. Payne described Carol as 'the most cynical, corrupt and power-hungry monarch who ever disgraced a throne anywhere in twentieth-century Europe'"
  LOR.10.a:0 "Fire Prevails!"
  LOR.9.t:0 "Execution of the Legionaries"
  LOR.9.d:0 "Many found the way that Legionaries went to their executions positively giddy and joyful about the prospect of their own deaths, happily proclaiming their deaths were the happiest moment of their life a deeply eerie experience. Carol regarded Codreanu's death fetish together with his claim that the Archangel Michael had told him that God had chosen him to save Romania as evidence that Codreanu was 'crazy'."
  LOR.9.a:0 "This may lead to a civil war!"
  LOR.11.t:0 "The August coup d'etat"
  LOR.11.d:0 "The 1944 Romanian coup d'état, better known in Romanian historiography as the Act of 23 August (Romanian: Actul de la 23 August), was a coup d'état led by King Michael I of Romania during World War II on 23 August 1944. With the support of several political parties, the king removed the government of Ion Antonescu, which had aligned Romania with Nazi Germany, after the Axis front in northeastern Romania collapsed in the face of a successful Soviet offensive. The Romanian Army declared a unilateral ceasefire with the Soviet Red Army on the Moldavian front, an event viewed as decisive in the Allied advances against the Axis powers in the European theatre of World War II. The coup was supported by the Romanian Communist Party, the Social Democratic Party, the National Liberal Party, and the National Peasants' Party who had coalesced into the National Democratic Bloc in June 1944."
  LOR.11.a:0 "FREEDOM!"
  LOR.12.t:0 "Towards a Great Romania"
  LOR.12.d:0 "The concept of Greater Romania has been a prevailing notion within a state that exudes confidence and strides towards success. There is a palpable belief that we possess the potential to emerge as a true hegemon in the Balkans, exerting influence over our neighboring nations and attaining a position on the global stage comparable to that of Germany or the United States.\n\nWith a clear vision of expansion and dominance, we envision a future where our country's boundaries extend, solidifying our position as a regional power. As we cultivate our strengths and leverage our resources, the ambition to wield significant political and economic influence becomes increasingly attainable.\n\nHowever, it is important to approach this aspiration with caution and consideration for the complexities inherent in such ambitions. Balancing our pursuit of growth with diplomacy, cooperation, and respect for our neighbors is essential. Striving for greatness should not come at the expense of destabilizing the region or compromising the principles of international cooperation and mutual respect.\n\nBy nurturing our potential, fostering strong relationships with our neighbors, and embracing a responsible approach to global affairs, we can strive for a prominent role in the Balkans and achieve recognition on the world stage, contributing positively to the community of nations."
  LOR.12.a:0 "Long Live Romania!"
  LOR.13.t:0 "The first Socialist Congress"
  LOR.13.d:0 "The First Socialist Congress is a long-awaited event of the working people of Romania! We will define our new policies and tendencies and establish the dictatorship of the proletariat!"
  LOR.13.a:0 "Petru Groza will lead us!"
  LOR.13.b:0 "Ana Pauker will bring the revolution!"
  LOR.14.t:0 "Socialist Victory!"
  LOR.14.d:0 "We have won the struggle against the capitalist offspring that tarnish the glory of the working people of Romania! Long live communism, the ideals of Marx and Lenin!"
  LOR.14.a:0 "The Socialist dream rise"
  LOR.15.t:0 "Rise of Socialist Balkan Fedeation!"
  LOR.15.d:0 "The Socialist Federation of the Balkans is a good alternative to Greater Romania, which was proposed by the imperialists. But we do not want to enslave other peoples, but only want to unite the working people of all the Balkans into one big federation. So let's go to this by leaps and bounds and not stop!"
  LOR.15.a:0 "Traiasca Poporul!"
  LOR.16.t:0 "Legacy of the Romanian Throne"
  LOR.16.d:0 "It was high time for us to overthrow this populist from the king's chair, he only squandered the budget of Romania and surrendered its territories without the slightest resistance! We need someone wealthier and more competent as king of Romania..."
  LOR.16.a:0 "Long Live the King"
  LOR.17.t:0 "Summon the Royal Council"
  LOR.17.d:0 "We have a conflict between the two successors of the previous king, so you have a choice: who will lead Romania on the royal throne?" 
  LOR.17.a:0 "Carol II should be our king!"
  LOR.17.b:0 "Prince Nicolae I should be the right heir!"
  LOR.17.c:0 "Neither of them, we should wait!"
  LOR.18.t:0 "First Monarch Act"
  LOR.18.d:0 "Our new king unites everyone around him and consolidates power in his managerial hands, we must trust his actions and wish him success in this complex geopolitical struggle on the world stage!"
  LOR.18.a:0 "Interesting"
  LOR.19.t:0 "The Ereditare Law of Succesion"
  LOR.19.d:0 "Since there is a rigid patriarchy in our state, we cannot have a woman as an heir, so we will have to choose among our sons."
  LOR.20.t:0 "Ultimatum to Bulgaria"
  LOR.20.d:0 "Bulgarians have long encroached on the ancestral Romanian territories and begin to mess up at any opportunity. Isn't it time for us to teach them a lesson?"
  LOR.20.a:0 "Accept the Ultimatum"
  LOR.20.b:0 "Reject the Ultimatum"
  LOR.21.t:0 "Bulgaria accepts the Ultimatum!"
  LOR.21.d:0 "Bulgaria is bowing under the might of Romania and its people! Nothing will stand in the way of historical justice!"
  LOR.21.a:0 "A victory for the crown!"
  LOR.22.t:0 "Bulgaria refused the Ultimatum!"
  LOR.22.d:0 "These pigs dared to deny the will of our people for historical justice!"
  LOR.22.a:0 "THE WAR BEGINS!"
  LOR.23.t:0 "Demand subjugation or War!"
  LOR.23.d:0 "Hungary have long encroached on the ancestral Romanian territories and begin to mess up at any opportunity. Isn't it time for us to teach them a lesson?"
  LOR.24.t:0 "Hungary accepts the Ultimatum!"
  LOR.24.d:0 "Hungary is bowing under the might of Romania and its people! Nothing will stand in the way of historical justice!"
  LOR.24.a:0 "Victory For the Crown!"
  LOR.25.t:0 "Hungary refuses the Ultimatum!"
  LOR.25.d:0 "These pigs dared to deny the will of our people for historical justice!"
  LOR.25.a:0 "TOWARDS BUDAPEST WE COME!"
  LOR.26.t:0 "The empire shall rise!"
  LOR.26.d:0 "Greater Romania, our long dream, has finally come true! We can say with confidence that we have entered the world stage properly and will show the world what Romania and its glorious people are capable of!"
  LOR.26.a:0 "URAAA!"
  LOR.27.t:0 "Legionary March in Bucharest"
  LOR.27.d:0 "In Bucharest, a march of legionnaires led by General Antonescu was recently held. These guys clearly see romania's future differently, is it worth supporting them?"
  LOR.27.a:0 "Romania has been rebirth!"
  LOR.28.t:0 "A Queen for a Nation!"
  LOR.28.d:0 "After her coronation and successful assumption of the throne, Maria's life as queen of Romania took on a new dimension as she pursued her ambitious vision for a Dacian Empire. Fuelled by a deep-rooted passion for her country's ancient heritage, she dedicated herself to realizing this audacious goal.\n\nQueen Maria became an unwavering advocate for the preservation and celebration of Dacian culture. She embarked on extensive research journeys, studying archaeological sites, historical records, and engaging with scholars and experts in the field. Her knowledge of Dacia's past grew exponentially, and she eagerly shared her findings with the Romanian people, instilling a sense of pride and fascination for their ancient origins.\n\nDriven by a desire to unite the scattered remnants of Dacian ancestry, Queen Maria embarked on diplomatic initiatives to form alliances with neighboring countries. She skillfully negotiated territorial agreements and cultural exchange programs, seeking to create a sense of shared identity and purpose among those who traced their roots back to the Dacian civilization.\n\nTo bolster the foundation of her ambition, Queen Maria implemented comprehensive educational reforms. She emphasized the teaching of Dacian history, language, and cultural practices in schools, ensuring that future generations would be well-versed in their ancestral roots. By nurturing a deep understanding and appreciation for Dacian heritage, she aimed to create a cohesive society ready to embrace the challenges and opportunities that lay ahead."
  LOR.28.a:0 "Traiasca Regina Mama!"
  LOR.29.t:0 "Royal Decret"
  LOR.29.d:0 "Upon ascending to the throne as queen of Romania, Maria embarked on a transformative journey marked by her visionary leadership and bold ambitions. Her first act as queen was a proclamation that resonated with both awe and intrigue. In a historic address to the nation, Maria unveiled her grand vision of reuniting the ancient lands of Dacia and forging a powerful Dacian Empire.\n\nWith unyielding determination, Maria sought to reclaim the glorious heritage of the Dacian people, drawing inspiration from their rich history and legendary strength. She recognized the potential for Romania to emerge as a major force in the region, bringing together the scattered remnants of Dacian ancestry under a unified banner.\n\nTo realize her audacious dream, Queen Maria tirelessly worked to strengthen Romania's military and diplomatic ties. She engaged in shrewd negotiations with neighboring nations, delicately balancing her ambitions with the need for peaceful cooperation. Recognizing that the formation of a Dacian Empire required not just military might, but also cultural and economic unity, she championed educational and economic reforms to foster a sense of shared purpose among her people.\n\nAs her reign progressed, Queen Maria's vision began to take shape. The acquisition of new territories, strategic alliances, and a resurgence of national pride propelled Romania's influence in the region. She skillfully navigated the complex geopolitical landscape, earning respect and admiration from both allies and rivals.\n\nHowever, it is important to note that while Queen Maria pursued the dream of a Dacian Empire, she also prioritized the well-being and prosperity of her own people. She understood that unity and progress went hand in hand, and she tirelessly worked towards improving the lives of Romanian citizens through social and economic reforms.\n\nQueen Maria's ambitious quest to form a Dacian Empire remains a defining chapter in Romania's history. It serves as a testament to her unwavering belief in the potential of her nation and the enduring legacy of the Dacian people. Though the realization of a unified Dacian Empire may have been an elusive goal, her visionary leadership set the stage for Romania's continued growth, influence, and contributions to the global stage."
  LOR.29.a:0 "Ambition's are high!"
  LOR.30.t:0 "Blood of Decebal"
  LOR.30.d:0 "Maria's reign as queen of Romania was not only marked by her political ambitions but also by her unwavering dedication to promoting and preserving Romanian culture. Recognizing the immense value of the country's heritage, she made it her mission to elevate Romanian culture to new heights and ensure its enduring legacy.\n\n From the onset of her reign, Queen Maria became a prominent patron of the arts, supporting Romanian artists, writers, and musicians. She established cultural institutions and academies, providing platforms for creative expression and fostering a renaissance of Romanian talent. Her unwavering support encouraged artists to explore their unique Romanian identity, creating works that celebrated the nation's history, folklore, and traditions."
  LOR.30.a:0 "Culture is a crucial pawn in our ambition!"
  LOR.32.t:0 "Ultimatum from Romania"
  LOR.32.a:0 "Accept Romanian Demands(No War)"
  LOR.32.b:0 "Reject Romanian Demands(War)"
  LOR.33.t:0 "Czechoslovakia accepted our demans!"
  LOR.33.a:0 "A great success!"
  LOR.34.t:0 "Czechoslovakia rejected our demans!"
  LOR.34.a:0 "We're going to war!"
  LOR.35.t:0 "Ultimatum for subjugation!"
  LOR.35.a:0 "Accept our fate"
  LOR.35.b:0 "NEVER"
  LOR.36.t:0 "Slovakia accepted the Ultimatum"
  LOR.36.a:0 "They knew what was coming!"
  LOR.37.t:0 "Slovakia rejected the Ultimatum"
  LOR.37.a:0 "THEY WILL PAY!"
  LOR.38.t:0 "Rise of Dacian Empire!"
  LOR.38.d:0 "In a remarkable turn of events, Queen Maria of Romania embarked on an extraordinary military and diplomatic campaign, reshaping the map of Europe and fulfilling her ambitious vision of a Dacian Empire. Her strategic acumen and unwavering determination propelled her to unparalleled heights of power and influence.\n\nWith a formidable military force at her disposal, Queen Maria launched a series of successful military campaigns, swiftly conquering Hungary, Bulgaria, Yugoslavia, and Austria. Her armies, imbued with a sense of purpose and guided by a resolute leader, prevailed over their adversaries, resulting in decisive victories and the swift integration of these territories into the expanding Dacian Empire.\n\nThroughout her conquests, Queen Maria showcased remarkable diplomatic finesse, garnering the support of key allies and negotiating favorable terms with neighboring nations. Recognizing the allure and power of her vision, several regional powers willingly joined the Dacian Empire, further solidifying its strength and influence."
  LOR.38.a:0 "TRAIASCA REGINA MAMA"
  LOR.39.t:0 "A visit to the Villa"
  LOR.39.d:0 "Romanian heirs decided, it's time for a time of peace in their life. In order to wait for the government to elect the king! used as a Royal residence. It was situated at 24, Pictor Grigorescu Street, behind the Royal Palace. During the reign of King Carol II of Romania, in 1930–1940, the villa hosted the Romanian Royal Family, namely the King and his son, Crown Prince Mihai, Grand Voivode of Alba Iulia (later HM King Michael I of Romania)."
  LOR.39.a:0 "A place like in heaven!"
  LOR.40.t:0 "Legionaries storms the Villa!"
  LOR.40.d:0 "In a shocking turn of events, a group of highly trained individuals known as the Legionaries launched a daring assault on the grand residence of Carol II and Nicolae I. The raid resulted in tragedy as Carol II was neutralized by the attackers, leading to his untimely demise. However, amidst the chaos, Nicolae I managed to escape, evading capture and preserving the hopes of his supporters. His survival marks a turning point, with the fate of the nation now resting heavily on his shoulders."
  LOR.40.a:0 "THEY WILL PAY!"
  LOR.41.t:0 "Maria of Romania shall be the Queen!"
  LOR.41.d:0 "Following this tragic event, the nation of Romania finds itself in a state of mourning and uncertainty. In the wake of her son's untimely death, Maria of Romania, a resilient and respected figure, assumes the weighty responsibility of leading the country as its new queen. With her unwavering determination and experience, Maria is crowned queen of Romania, stepping into the shoes of her fallen loved ones to guide the nation through this tumultuous period and into a new era. Her ascension brings a glimmer of hope to a grieving nation, as Romania looks to its new monarch for stability, strength, and a path towards healing."
  LOR.41.a:0 "Traiasca regina Mama!"
  LOR.41.b:0 "Maria refused the throne!"
  LOR.61.t:0 "Maria refused the throne in favour of Mihai I"
  LOR.61.d:0 "In 1936, Romania faced a delicate political situation, and Queen Maria found herself at the center of a crucial decision regarding the country's monarchy. Following the death of her husband, King Ferdinand, in 1927, the question of succession arose once again. This time, her son, Carol II, was the rightful heir to the throne. However, the political landscape was fraught with uncertainty. \n\nConcerned about the potential consequences of her son's tumultuous personal life and the political instability that surrounded him, Queen Maria made a significant and selfless decision. In an unexpected move in 1936, she chose to refuse the throne herself and, instead, supported the ascension of her grandson, Mihai I."
  LOR.61.a:0 "Mihai shall lead to glory!"
  LOR.62.t:0 "Mihai I takes the throne of Romania"
  LOR.62.d:0 "The loss of two successive monarchs in such a manner would create a power vacuum, leading to questions about the continuity of the monarchy. The tragic event could prompt a period of internal strife and external challenges as different factions vied for control and influence.\n\n With Mihai I being next in line, his ascension to the throne would occur under markedly different circumstances than in our historical timeline. The regency that followed might face increased challenges in maintaining stability, and the young king would find himself thrust into a position of leadership earlier than anticipated.\n\n "
  LOR.62.a:0 "Long Live Mihai I"
  LOR.62.b:0 "Mihai is still young, and can't rule the country!"
  LOR.63.t:0 "Mihai I is crowned king of Romania"
  LOR.63.d:0 "In the aftermath of the tragic events that claimed the lives of Carol II and Nicolae I during the villa storm orchestrated by Legionaries, a somber and uncertain atmosphere hung over Romania. Amidst the chaos and mourning, the focus turned to the young heir, Mihai I.\n\nIn a solemn ceremony, Mihai I was crowned king of Romania. The coronation, while symbolizing continuity, also marked the beginning of a challenging chapter for the nation. With a regency in place to guide the young monarch, the responsibilities of leadership fell on the shoulders of those tasked with ensuring stability during this tumultuous time.\n\nThe new king, barely a teenager, faced the daunting task of navigating a politically charged and uncertain landscape. The tragedy that had befallen his predecessors cast a shadow over the monarchy, and Mihai I's reign would be defined by the need to restore and reinforce the institution.\n\nThe political climate, reshaped by recent events, would require deft maneuvering and strategic decisions to unite the country and reestablish a sense of order. The international community would watch closely as Romania grappled with its challenges under the leadership of a young and untested monarch.\n\nMihai I's early years on the throne would become a formative period, shaping his character and leadership style. The resilience of the Romanian monarchy, now under the rule of a determined and youthful king, would be tested as the nation sought to heal and move forward in the wake of tragedy."
  LOR.63.a:0 "Traiasca Romania Mare!"

  
  LOR.43.t:0 "Invitation to the Balkan Aliance"
  LOR.43.d:0 "With warmth and friendship, we extend an invitation to the wonderful people of [ROOT.GetName] to join the Balkan Federation. In these times of change and progress, we believe that close cooperation between our countries would bring significant benefits to our citizens and the entire region.\n\n The Balkans boast a rich history and cultural diversity that defines us and unites us simultaneously. By uniting our efforts, we can contribute to peace, stability, and prosperity in the region. Therefore, we invite you to join us in this bold initiative.\n The Balkan Federation would be based on principles such as equality, democracy, respect for human rights, and environmental protection. Together, we can promote tourism, develop our infrastructure and economies, and collaborate on security and addressing common issues.\n\n While we are aware of the unique history and characteristics of each country, we firmly believe that through unity and collaboration, we can overcome any obstacles. Thus, we invite you to meet with us to discuss this proposal in more detail and how we can build our future together.\n\n Let's join forces to make the Balkans stronger and more prosperous for future generations. We look forward to your response and hope you will consider this invitation with an open heart."
  LOR.43.a:0 "Accept the invitation"
  LOR.43.b:0 "Reject the invitation"

  LOR.44.t:0 "[FROM.GetName] accepted the invitation!"
  LOR.44.a:0 "United Forever!"

  LOR.45.t:0 "[FROM.GetName] rejected the invitation!"
  LOR.45.a:0 "Traitors!"

  LOR.46.t:0 "[FROM.GetName] proposes you to join the Balkan Federation"
  LOR.46.a:0 "United in diversity!"
  LOR.46.b:0 "Rejected! Stupid proposal!"

  LOR.47.t:0 "[FROM.GetName] joined the federation"
  LOR.47.a:0 "Welcome into the Federation!"
  LOR.48.t:0 "[FROM.GetName] rejected the proposal"
  LOR.48.a:0 "They made a mistake!"

  LOR.49.t:0 "Liberté, égalité, fraternité!"
  LOR.49.d:0 "The Balkan Federation aims to foster regional collaboration, uniting countries in the pursuit of peace, stability, and shared prosperity. Grounded in principles of equality, democracy, and environmental protection, it seeks to promote tourism, develop infrastructure, and address common challenges. Together, we can build a stronger, more resilient Balkans for generations to come."
  LOR.49.a:0 "United in diversity!"

  LOR.50.t:0 "Peace on the continent!"
  LOR.50.d:0 "The war had ravaged the land, leaving behind scars that ran deep into the soul of the nation. Yet, as the dust settled and the smoke cleared, a profound sense of relief washed over the people. It was the end of an era marred by destruction and loss, but also marked by resilience and unity.\n Amidst the ruins, there lingered a flicker of hope, a belief in the possibility of rebuilding what had been shattered. The sacrifices made were not in vain; they were the foundations upon which a new beginning could be constructed.\n The toll of conflict weighed heavy on the hearts of those who had endured its wrath, their spirits tested to the limits of endurance. But as they gazed upon the horizon, they saw the glimmer of a peaceful dawn, promising a future free from the shadows of war."
  LOR.50.a:0 "Viva L'Europe!"

  LOR.51.t:0 "Birth of the true Democracy"
  LOR.51.d:0 "During the interwar period in Romania, the birth of true democracy emerged as a transformative force, championed by a burgeoning movement of intellectuals, activists, and political leaders. Marked by the establishment of universal suffrage, the enactment of progressive social reforms, and the emergence of a vibrant civil society, this pivotal era witnessed the flourishing of democratic values and principles, paving the way for a more inclusive and participatory political landscape in Romania."
  LOR.51.a:0 "A new dawn in balkans!"

  LOR.52.t:0 "Bulgarian generals are joining our ranks!"
  LOR.52.d:0 "In the lead-up to the Romanian coup in Sofia, a notable development unfolded as Bulgarian generals, disillusioned with the existing political climate, chose to align themselves with the Romanian forces. Drawn by the promise of a unified Vlaho-Bulgarian vision and a shared commitment to regional stability, the decision of these respected military figures to join the Romanian ranks not only bolstered the strategic strength of the impending coup but also symbolized a significant shift in regional allegiances, underscoring the growing momentum for a united Balkan front under the banner of Vlaho-Bulgaria."
  LOR.52.a:0 "The coup is in our favour!"

  LOR.53.t:0 "Bulgarian generals rejected our offers!\nTraitors!"
  LOR.53.d:0 "In the days leading up to the Romanian coup in Sofia, a critical development emerged as prominent Bulgarian generals staunchly rejected the proposition to align with the Romanian forces. Motivated by a deep sense of national pride and a commitment to Bulgaria's independent identity, these resolute military figures stood firm in their refusal, choosing to uphold their allegiance to the Bulgarian state. Despite the allure of a unified Vlaho-Bulgarian vision, their steadfast dedication reflected a prevailing sentiment of unwavering loyalty to the integrity and sovereignty of Bulgaria, emphasizing the complexities and divisions within the broader Balkan political landscape."
  LOR.53.a:0 "THEY WILL PAY!"

  LOR.54.t:0 "Mihai I visits Sofia"
  LOR.54.d:0 "During Mihai I's visit to Sofia, a historic atmosphere of diplomacy and camaraderie enveloped the Bulgarian capital, signifying a pivotal moment of reconciliation and renewed bilateral cooperation. The visit, characterized by high-level discussions and symbolic gestures, underscored the shared commitment of both nations to fostering enduring peace and strengthening regional alliances, setting the stage for a new chapter of mutual understanding and collaboration between Romania and Bulgaria."
  LOR.54.a:0 "Welcome to Bulgaria, my brother!"

  LOR.55.t:0 "The Bulgarian coup is almost ready"
  LOR.55.d:0 "In the shadows of political secrecy and strategic planning, the Bulgarian coup simmered on the verge of fruition, poised to unleash a seismic wave of change within the corridors of power. As the final preparations fell into place and anticipation hung in the air, the impending upheaval held the promise of reshaping the nation's destiny, igniting a new chapter in Bulgaria's turbulent political narrative."
  LOR.55.a:0 "Almost done!"

  LOR.56.t:0 "Agents are ready to act"
  LOR.56.d:0 "With their identities veiled in secrecy and their resolve unwavering, the covert agents tasked with driving the impending coup were poised on the precipice of action. Armed with unwritten loyalties and an unwavering commitment to the cause, these individuals were the linchpins in the grand design, ready to execute their carefully orchestrated maneuvers and set in motion the transformative events that would define the success of the operation."
  LOR.56.a:0 "We're closer to the final part"

  LOR.57.t:0 "Romania invests into Bulgaria!"
  LOR.57.d:0 "In the prelude to the anticipated coup in Bulgaria, Romania channeled substantial investments into the country, laying the groundwork for a strategic alliance and fostering economic interdependence between the two nations. As financial ties strengthened, the mutual interests and diplomatic collaboration between Romania and Bulgaria underscored a burgeoning partnership that would play a pivotal role in the upcoming political developments in the region."
  LOR.57.a:0 "Those are really welcoming for us!"

  LOR.58.t:0 "Bulgaro-Romanian relations have been inproved"
  LOR.58.d:0 "Bulgaro-Romanian relations have witnessed a remarkable upturn, characterized by burgeoning diplomatic exchanges, shared economic initiatives, and enhanced cultural collaboration. This concerted effort to foster deeper ties between the two nations has not only reinforced regional stability but has also laid the groundwork for a more robust and mutually beneficial partnership, setting the stage for a new era of cooperation and solidarity in the Balkans."
  LOR.58.a:0 "This is a great moment!"

  LOR.59.t:0 "Failed coup in Bulgaria"
  LOR.59.d:0 "n a sudden turn of events, the much-anticipated coup in Bulgaria faced a significant setback, plunging the nation into a state of uncertainty and political turmoil. Despite meticulous planning and careful coordination, the intricate web of alliances and interests proved to be a formidable obstacle, resulting in a failed attempt to seize power and reshape the country's political trajectory. The aftermath of the failed coup reverberated through the corridors of power, leaving a complex legacy of dashed aspirations and renewed calls for stability and reconciliation."
  LOR.59.a:0 "This is a big mistake!"

  LOR.60.t:0 "Successful coup in Bulgaria"
  LOR.60.d:0 "Amid heightened anticipation, the meticulously orchestrated coup in Bulgaria culminated in a resounding success, ushering in a transformative era marked by a shift in leadership and a redefined national agenda. With strategic precision and widespread support, the newly installed administration swiftly consolidated its authority, promising a path of reform, stability, and renewed diplomatic engagement. The successful coup sent ripples across the geopolitical landscape, signaling a fresh chapter in Bulgaria's political narrative and setting the stage for a dynamic repositioning within the broader regional context."
  LOR.60.a:0 "A big victory in our ambitions!"

  LOR.64.t:0 "Ultimatum from Vlaho-Bulgaria"
  LOR.64.d:0 "In the name of Vlaho-Bulgaria, we extend this ultimatum: Join our empire willingly and embrace the promise of unity, prosperity, and shared identity, or face the inevitable consequences of conflict and war. The choice is yours, but time is of the essence."
  LOR.64.a:0 "Accept the invitation"
  LOR.64.b:0 "Reject the invitation"

  LOR.65.t:0 "[FROM.GetName] accepted the Ultimatum!"
  LOR.65.d:0 ""
  LOR.65.a:0 "Another victory"
  
  LOR.66.t:0 "[FROM.GetName] rejected the Ultimatum!"
  LOR.66.d:0 ""
  LOR.66.a:0 "TRAITORS!"

  LOR.67.t:0 "Romanian Army enters Budapest!"
  LOR.67.d:0 "The entry of the Romanian Army into Budapest signified a transformative moment in the geopolitical dynamics of Central Europe, reshaping the balance of power and alliances in the region. As Romanian forces marched into the Hungarian capital, a carefully orchestrated campaign aimed at securing strategic control and fostering a new era of regional cooperation and stability began to unfold, signaling a profound shift in the broader political landscape and the dynamics of power in the heart of Europe."
  LOR.67.a:0 "Another victory for the Romanian Army"

  LOR.68.t:0 "Iron Guard, is marching in Bucharest"
  LOR.68.d:0 "The Iron Guard's march in Bucharest is a pivotal event, impacting national morale and influencing international diplomacy. Neighboring countries react with a mix of fear and condemnation, while some far-right factions across Europe see this as an inspiration to rekindle their movements. The fate of Romania and the balance of power in Eastern Europe hang in the balance as the Iron Guard mobilizes its forces, ready to impose its vision on the continent."
  LOR.68.a:0 "Traiasca Legiunea!"

  LOR.69.t:0 "Codreanu took the charge"
  LOR.69.d:0 "Internationally, Codreanu's ascendancy sends shockwaves through Europe. Allied and Axis powers alike must reevaluate their strategies, considering the unpredictable and ambitious new leader in the Balkans. Will Codreanu forge alliances with like-minded regimes, or will his vision of a Greater Romania bring conflict with neighboring states? Players face critical decisions as they navigate the intricate politics and volatile military landscape."
  LOR.69.a:0 "All Heil Codreanu!"

  LOR.70.t:0 "Sima took the charge"
  LOR.70.d:0 "As the inaugural scenario. After Codreanu's assassination, Sima swiftly moves to consolidate power, crushing internal dissent and rallying the Legionnaires under his command. His ascension marks a period of intense political upheaval and aggressive expansionism, as Sima seeks to fulfill the Iron Guard's vision of a fascist Romania."
  LOR.70.a:0 "A major shift into the politics!"

  LOR.71.t:0 "The King Compromise"
  LOR.71.d:0 "Faced with mounting internal strife and external threats, King Michael I decides to forge an uneasy alliance between the authoritarian Antonescu and the radical Iron Guard, led by Horia Sima. This tripartite arrangement aims to unify Romania's fractured political landscape, leveraging Antonescu's military expertise and the Iron Guard's fervent nationalism."
  LOR.71.a:0 "A better man suited for this times"

  LOR.72.t:0 "Assasination of Zelea Codreanu!"
  LOR.72.d:0 "Codreanu's death is shrouded in mystery, with suspicions ranging from royal orders to communist plots. As Romania reels from the loss of its leader, various factions within the Iron Guard vie for control, while external forces seek to exploit the ensuing turmoil."
  LOR.72.a:0 "THEY WILL PAY!"

  LOR.75.t:0 "Romania demand the lands from Trianon!"
  LOR.75.d:0 ""
  LOR.75.a:0 "Accept the Ultimatum"
  LOR.75.b:0 "Reject the Ultimatum"
